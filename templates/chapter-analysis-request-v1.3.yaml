schema_version: "1.3"

template:
  id: "BIBLIOTEKA-VSP-CHAPTER-ANALYSIS-REQUEST"
  version: "1.3"
  type: "chapter_analysis_request"
  status: "ACCEPTED"
  purpose: >-
    Canonical entrypoint for starting analysis of one chapter after book-level
    PDF/EPUB readiness has been established.

user_contract:
  minimal_command: "Анализ главы N"
  examples:
    - "Анализ главы 1"
    - "Анализ главы 7"
    - "Анализ главы N"

inputs:
  book_id: "[Resolved from active book branch context]"
  chapter:
    number: "[Required]"
    title: "[Needs confirmation]"
    slug: "[Needs confirmation]"

contracts:
  readiness:
    id: "BIBLIOTEKA-VSP-BOOK-READINESS"
    version: "1.3"
    path: "templates/book-readiness-v1.3.yaml"
  artifact_collection:
    id: "BIBLIOTEKA-VSP-CHAPTER-ARTIFACT-COLLECTION"
    version: "1.7"
    path: "templates/chapter-artifact-collection-v1.7.yaml"

git_execution:
  policy:
    id: "BIBLIOTEKA-VSP-GIT-EXECUTION-POLICY"
    version: "1.0"
    path: "templates/git-execution-policy-v1.0.yaml"
  default_mode: "github_connector_and_repository_automation"
  local_git_default_allowed: false

preflight:
  required: true
  type: "read-only"
  implementation_reference: >-
    python scripts/check_book_readiness.py --book-id <book_id>
    --capability chapter-analysis
  ready_behavior:
    status: "READY"
    action: >-
      Start BIBLIOTEKA-VSP-CHAPTER-ARTIFACT-COLLECTION v1.7 at workflow step 1:
      resolve and verify the chapter RAG boundary using format-appropriate source locators.
  blocked_behavior:
    status: "CHAPTER_ANALYSIS_BLOCKED"
    action: >-
      Stop before chapter retrieval. Report exact failed readiness checks,
      verified evidence and next action.
    forbidden:
      - "use direct canonical-source reading as a substitute"
      - "use external web as a substitute"
      - "use model memory as book content"
      - "invent chapter boundary"
      - "declare READY based on reading status"

source_policy:
  mode: "rag_only"
  supported_source_formats:
    - pdf
    - epub
  external_sources_allowed: false
  model_memory_allowed: false
  canonical_source_direct_access: false
  unknown_data_policy: "[Needs confirmation]"
  rag_miss_policy: "preserve_RAG_MISS"

chapter_execution:
  delegate_to:
    template: "BIBLIOTEKA-VSP-CHAPTER-ARTIFACT-COLLECTION"
    version: "1.7"
  required_sequence:
    - "Verify chapter boundary from addressable RAG."
    - "Retrieve only minimum relevant chunks."
    - "Create README.md."
    - "Create cheatsheet.md."
    - "Create commands.md."
    - "Create diagram.md."
    - "Create visual-cheatsheet.svg."
    - "Create visual-cheatsheet-detailed.svg."
    - "Create conditional summary/review artifacts when source provides them."
    - "Cross-check provenance and contradictions; create source-findings.md when classified source defects are detected."
    - "Update chapter/book indexes when applicable."

acceptance_criteria:
  - "Book-level readiness passes before chapter workflow starts."
  - "Chapter artifact template version is exactly 1.7 unless superseded by a later ACCEPTED version."
  - "Chapter boundary is source-grounded."
  - "EPUB boundaries use spine/XHTML locators and do not fabricate page numbers."
  - "No web/model-memory fallback is used for RAG-only content."
  - "Unsupported data remains [Needs confirmation] or RAG_MISS."
  - "Normal user interface remains the short command 'Анализ главы N'."
