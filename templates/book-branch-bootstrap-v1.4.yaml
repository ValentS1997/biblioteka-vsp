schema_version: "1.4"

template:
  id: "BIBLIOTEKA-VSP-BOOK-BRANCH-BOOTSTRAP"
  version: "1.4"
  type: "book_branch_bootstrap"
  status: "ACCEPTED"
  purpose: >-
    Canonical bootstrap for a new biblioteka-vsp book branch/chat whose purpose
    includes RAG-grounded chapter analysis from a PDF or EPUB canonical source.

inputs:
  book:
    book_id: "[Needs confirmation]"
    title: "[Needs confirmation]"
    edition: "[Needs confirmation]"
  source:
    electronic_copy_available: "[Needs confirmation]"
    source_file_identity: "[Needs confirmation]"
    source_format: "pdf | epub | [Needs confirmation]"
  reading:
    start_reading: "[Derived from user intent]"
    started_date: "[Needs confirmation]"
  desired_use:
    rag_required: true
    chapter_analysis_required: true
    chapter_artifacts_required: true

contracts:
  onboarding:
    id: "BIBLIOTEKA-VSP-BOOK-ONBOARDING"
    version: "1.3"
    path: "templates/book-onboarding-v1.3.yaml"
  rag_ingestion_acceptance:
    id: "BIBLIOTEKA-VSP-RAG-INGESTION-ACCEPTANCE"
    version: "1.0"
    path: "templates/rag-ingestion-acceptance-v1.0.yaml"
  readiness:
    id: "BIBLIOTEKA-VSP-BOOK-READINESS"
    version: "1.3"
    path: "templates/book-readiness-v1.3.yaml"
  chapter_request:
    id: "BIBLIOTEKA-VSP-CHAPTER-ANALYSIS-REQUEST"
    version: "1.4"
    path: "templates/chapter-analysis-request-v1.4.yaml"
  chapter_artifacts:
    id: "BIBLIOTEKA-VSP-CHAPTER-ARTIFACT-COLLECTION"
    version: "1.8"
    path: "templates/chapter-artifact-collection-v1.8.yaml"
  chapter_publication:
    id: "BIBLIOTEKA-VSP-CHAPTER-PUBLICATION"
    version: "1.0"
    path: "templates/chapter-publication-v1.0.yaml"

git_execution:
  policy:
    id: "BIBLIOTEKA-VSP-GIT-EXECUTION-POLICY"
    version: "1.0"
    path: "templates/git-execution-policy-v1.0.yaml"
  default_mode: "github_connector_and_repository_automation"
  local_git_default_allowed: false

source_policy:
  mode: "rag_only"
  supported_canonical_source_formats:
    - pdf
    - epub
  external_sources_allowed: false
  model_memory_allowed_for_book_content: false
  canonical_source_direct_access_for_chapter_content: false
  unknown_data_policy: "[Needs confirmation]"
  rag_miss_policy: "preserve_RAG_MISS"

startup_chapter_progress:
  mandatory: true
  chapter_publication_contract: "BIBLIOTEKA-VSP-CHAPTER-PUBLICATION v1.0"
  required_visible_fields:
    - "book title, inventory/knowledge ID and checked Git branch"
    - "total numbered chapters from verified RAG TOC or [Needs confirmation] with reason"
    - "Git-committed complete chapter collections (N)"
    - "remaining chapters and percent only if total verified"
    - "published chapter numbers, next unpublished chapter and latest Git commit"
  command_reference: "python scripts/chapter_publication_status.py --book-id <book_id>"
  provenance: "books/<book_id>/notes/chapters/plan.yaml"
  rule: "Chapter note count cannot establish total chapter count."

branch_initialization_workflow:
  - step: 0
    action: "Show chapter total and direct-Git publication progress, verifying RAG TOC and book branch state."
    type: "read-only"
  - step: 1
    action: "Resolve book identity, source format and current registry/knowledge/reading state."
    type: "read-only"
  - step: 2
    action: "Run capability preflight for chapter-analysis."
    type: "read-only"
    implementation_reference: >-
      python scripts/check_book_readiness.py --book-id <book_id>
      --capability chapter-analysis
  - step: 3
    when: "readiness == READY"
    action: "Declare READY_FOR_CHAPTER_ANALYSIS."
    type: "read-only"
  - step: 4
    when: "readiness == BLOCKED and RAG-dependent intent is explicit"
    action: >-
      Execute BIBLIOTEKA-VSP-BOOK-ONBOARDING v1.3 using available source and
      repository permissions. Preserve the original PDF/EPUB source format.
    type: "state-changing"
  - step: 5
    action: "Re-run readiness after onboarding."
    type: "read-only"
  - step: 6
    when: "readiness == READY"
    action: "Tell the user that normal chapter work may continue with 'Анализ главы N'."
    type: "read-only"
  - step: 7
    when: "readiness != READY"
    action: >-
      Return CHAPTER_ANALYSIS_BLOCKED with exact failed prerequisite(s),
      verified evidence and next action. Do not claim the branch is ready.
    type: "read-only"

forbidden_inferences:
  - "reading_active => rag_ready"
  - "reading_active => chapter_analysis_ready"
  - "electronic_holding_known => canonical_source_ready"
  - "rag_manifest_exists => retrieval_ready"
  - "book_registered => chapter_analysis_ready"
  - "EPUB => PDF page numbers exist"

ready_output:
  status: "READY_FOR_CHAPTER_ANALYSIS"
  allowed_next_user_command: "Анализ главы N"

acceptance_criteria:
  - "No READY claim is made before readiness passes."
  - "PDF and EPUB are accepted canonical source formats."
  - "EPUB is not silently converted into PDF."
  - "Explicit RAG/chapter intent triggers onboarding when prerequisites are missing."
  - "After successful onboarding, normal chapter work requires no repeated book-level setup."
  - "The active chapter artifact contract is v1.8."
  - "Routine branch/PR/CI/repository work is performed remotely through GitHub tools."
  - "All unknown or unsupported facts remain explicit."
  - "Book chat startup shows chapter total and commit-backed chapter publication progress."
  - "Chapter outputs are written directly as individual Git files; ZIP fallback is not allowed."
