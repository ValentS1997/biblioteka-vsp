schema_version: "1.3"

template:
  id: "BIBLIOTEKA-VSP-CHAPTER-ARTIFACT-COLLECTION"
  version: "1.3"
  type: "chapter_artifact_collection"
  status: "ACCEPTED"
  purpose: >-
    Canonical template for creating chapter-level RAG-grounded learning and
    operational artifacts, including mandatory compact and detailed visual
    chapter summaries.

artifact_collection:
  book:
    book_id: "[Needs confirmation]"
    title: "[Needs confirmation]"
    edition: "[Needs confirmation]"

  chapter:
    number: "[Needs confirmation]"
    title: "[Needs confirmation]"
    slug: "[Needs confirmation]"

  source_policy:
    mode: "rag_only"
    external_sources_allowed: false
    model_memory_allowed: false
    source_pdf_direct_access: false
    unknown_data_policy: "[Needs confirmation]"
    unsupported_claim_policy: "omit_or_mark_needs_confirmation"
    provenance_required: true

  target:
    directory: "books/<book_id>/notes/chapters/chapter-<NN>-<slug>/"

  provenance:
    rag_chunk_range: "[Needs confirmation]"
    pdf_page_range: "[Needs confirmation]"
    printed_page_range: "[Needs confirmation]"
    chapter_boundary_verified: "[Needs confirmation]"

  artifacts:
    required:
      - file: "README.md"
        role: "chapter index, scope, provenance, chapter map, main principle and limitations"

      - file: "cheatsheet.md"
        role: "operational or conceptual chapter cheatsheet"
        required_sections:
          - "Symptom / problem framing"
          - "Baseline / context"
          - "Read-only checks"
          - "Interpretation"
          - "Next action"
          - "Modifying action"
          - "Verification / acceptance checks"
          - "Rollback"
        applicability_rule: >-
          If a section is not supported by the chapter, keep the section and
          mark it [Not applicable] or [Needs confirmation]; do not invent content.

      - file: "commands.md"
        role: "source-confirmed commands and tools"
        rules:
          - "Include only commands/tools explicitly supported by chapter RAG."
          - "Do not add familiar commands from model memory."
          - "Classify each command as read-only, workload-generating, or state-changing."
          - "For state-changing actions include effect, risk, verification and rollback when source-supported."
          - "If rollback is not supplied by the source, mark it [Needs confirmation]."

      - file: "diagram.md"
        role: "Mermaid chapter logic / diagnostic flow"
        rules:
          - "Represent the chapter's actual logic, not a generic invented workflow."
          - "For operational diagnostics prefer baseline -> localization -> targeted analysis -> controlled change -> remeasure -> keep/rollback."
          - "When CPU, memory, storage, network or external-dependency branches are required by the chosen diagnostic form but absent from the source, mark them as not applicable instead of inventing checks."
          - "Conceptual chapters may use a source-grounded conceptual flow instead of a troubleshooting flow."

      - file: "visual-cheatsheet.svg"
        role: "mandatory compact visual chapter summary"
        rules:
          - "RAG-grounded only."
          - "Readable as a compact overview."
          - "Do not introduce facts absent from canonical chapter artifacts."

      - file: "visual-cheatsheet-detailed.svg"
        role: "mandatory detailed visual chapter summary"
        rules:
          - "RAG-grounded only."
          - "Cover the chapter's major concepts, workflow, commands and operational boundaries where applicable."
          - "Do not introduce facts absent from canonical chapter artifacts."

    conditional:
      - file: "summary.md"
        condition: "chapter contains an explicit chapter-end summary/resume"
        role: "chapter-end summary transferred from book RAG"
        rules:
          - "Preserve source meaning."
          - "Only structural/OCR cleanup is allowed."
          - "Record exact RAG provenance."

      - file: "review-questions.md"
        condition: "chapter contains review/control questions or exercises"
        role: "source questions/exercises"
        rules:
          - "Preserve original numbering."
          - "Only structural/OCR cleanup is allowed."
          - "Record exact RAG provenance."

      - file: "review-answers.md"
        condition: "review-questions.md exists"
        role: "RAG-grounded answers/solutions; not an official publisher answer key"
        rules:
          - "Base answers on review-questions.md, chapter RAG and canonical chapter artifacts."
          - "Do not use external web sources in rag_only mode."
          - "Questions requiring current external data, user measurements, unavailable figures or missing evidence must be marked [Needs confirmation]."

  content_rules:
    source_truth:
      - "Current chapter RAG is the authoritative content source."
      - "Existing canonical chapter artifacts may be used only when they are themselves RAG-grounded."
      - "Lower-priority model knowledge must not override or fill gaps in the source."

    uncertainty:
      - "Unknown data stays unknown."
      - "Do not reconstruct missing chapter facts from memory."
      - "Use [Needs confirmation] for unsupported or unavailable information."

    operational_safety:
      - "Separate observation from modification."
      - "State what a modifying action changes before presenting it."
      - "Include verification for state-changing actions."
      - "Include rollback when supported; otherwise mark rollback [Needs confirmation]."
      - "Do not chain destructive or state-changing operations into opaque command sequences."

    command_discipline:
      - "Do not normalize a source command into a different command unless the correction is explicitly documented."
      - "OCR normalization is allowed only when the intended command is unambiguous."
      - "Credentials, secrets, real community strings, tokens and environment-specific identifiers must be replaced with placeholders."

    visuals:
      - "Both compact and detailed SVG summaries are mandatory."
      - "Visuals must remain consistent with README.md, cheatsheet.md, commands.md and diagram.md."
      - "If a visual statement cannot be traced to chapter evidence, remove it or mark uncertainty."

  workflow:
    - step: 1
      action: "Resolve and verify the chapter RAG boundary."
    - step: 2
      action: "Retrieve only the minimum relevant chapter chunks needed for each artifact."
    - step: 3
      action: "Create README.md with scope and provenance."
    - step: 4
      action: "Create cheatsheet.md, commands.md and diagram.md."
    - step: 5
      action: "Create both mandatory visual SVG summaries."
    - step: 6
      action: "If present in the source, add summary.md and review-questions.md."
    - step: 7
      action: "If review questions exist, create review-answers.md under the same RAG-only policy."
    - step: 8
      action: "Cross-check artifacts for contradictions, unsupported commands and provenance gaps."
    - step: 9
      action: "Update the chapter README index and book-level chapter index when applicable."

  acceptance_criteria:
    - "Chapter scope and provenance are explicit."
    - "No unsupported external or model-memory facts are presented as book content."
    - "README.md, cheatsheet.md, commands.md and diagram.md exist."
    - "visual-cheatsheet.svg and visual-cheatsheet-detailed.svg exist."
    - "Conditional chapter-end artifacts exist when the source provides those sections."
    - "Commands are classified by operational effect."
    - "State-changing actions include verification and rollback or an explicit [Needs confirmation]."
    - "Unknown information is not silently completed."
    - "All artifacts describe the same chapter boundary and do not contradict one another."

  completion_status:
    value: "[Needs confirmation]"
    allowed:
      - "DRAFT"
      - "RAG_GROUNDED"
      - "VERIFIED"
      - "ACCEPTED"
