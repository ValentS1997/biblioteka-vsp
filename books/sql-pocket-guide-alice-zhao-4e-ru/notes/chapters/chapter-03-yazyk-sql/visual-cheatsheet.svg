<text x="858" y="152" fill="#0C4663" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700">03 / ТЕРМИНЫ</text>
<text x="858" y="189" fill="#28495E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" >Ключевые слова и функции</text>
<text x="858" y="220" fill="#28495E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" >Имена таблиц, столбцов и alias</text>
<text x="858" y="251" fill="#28495E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" >Statement → clauses</text>
