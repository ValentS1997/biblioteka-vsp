<text x="654" y="533" fill="#28495E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" >DCL: GRANT / REVOKE</text>
<text x="654" y="564" fill="#28495E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" >TCL: COMMIT / ROLLBACK</text>
