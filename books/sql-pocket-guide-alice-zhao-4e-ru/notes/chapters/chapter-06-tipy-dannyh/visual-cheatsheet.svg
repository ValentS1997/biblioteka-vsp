<rect x="686" y="363" width="647" height="244" rx="17" fill="#FAFDFF" stroke="#BCD0DD" stroke-width="1.5"/>
<text x="704" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#0D4866" font-weight="700">05 / CHANGE BOUNDARY</text>
<text x="704" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >CREATE TABLE → schema change</text>
<text x="704" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >INSERT → data change</text>
<text x="704" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >ALTER SESSION → session state</text>
<text x="704" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >SELECT / CAST → read-only</text>
<text x="704" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >Rollback в главе: [Needs confirmation]</text>
<rect x="27" y="635" width="1306" height="176" rx="17" fill="#fff" stroke="#BCD0DD" stroke-width="1.5"/>
<text x="45" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#0D4866" font-weight="700">06 / SOURCE FINDINGS</text>
<text x="45" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >MySQL datetime INSERT ↔ output mismatch · SQLite TEXT/REAL/INTEGER demo mismatch</text>
<text x="45" y="739" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >ASCII/Unicode exponents damaged · YYYYMM-DD vs YYYY-MM-DD</text>
<text x="45" y="769" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#24465A" >TINY TEXT / LARGE BLOB token splits · BOOLEAN output scope ambiguous</text>
<rect x="27" y="838" width="1306" height="111" rx="14" fill="#D8EAF3"/>
<text x="48" y="872" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#164A64" font-weight="700">DESIGN RULE: value requirements → RDBMS/version → candidate type → test round-trip → only then schema change</text>
<text x="48" y="905" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#214E66" >Никакие SQL-команды не выполнялись. Source/RAG/reading state не меняются.</text>
