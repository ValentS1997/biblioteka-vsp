<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1420" viewBox="0 0 1400 1420" role="img" aria-label="Подробная визуальная шпаргалка SQL глава 1">
<rect width="1400" height="1420" fill="#EEF4F8"/>
<text x="28" y="56" fill="#083B55" font-size="31" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">ГЛАВА 1. УСКОРЕННЫЙ КУРС SQL</text>
<text x="30" y="90" fill="#46657A" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" >Элис Жао · 4-е издание · PDF стр. 21–32 · chunks p0021:c01–p0032:c01</text>
<rect x="28" y="118" width="430" height="242" rx="16" fill="#FFFFFF" stroke="#CAD5DE" stroke-width="1.5"/><text x="50" y="157" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">01 · База данных [21–22]</text><text x="51" y="200" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >БД — организованное хранение</text><text x="51" y="230" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Реляционная БД: отношения</text><text x="51" y="260" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Обычно это таблицы</text><text x="51" y="290" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Таблица состоит из строк и столбцов</text><text x="51" y="320" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Структура задаётся схемой</text>
<rect x="485" y="118" width="430" height="242" rx="16" fill="#FFFFFF" stroke="#CAD5DE" stroke-width="1.5"/><text x="507" y="157" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">02 · NoSQL [22–23]</text><text x="508" y="200" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Not Only SQL — иные модели</text><text x="508" y="230" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Пример книги: MongoDB</text><text x="508" y="260" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Коллекции документов</text><text x="508" y="290" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >У документов разный набор полей</text><text x="508" y="320" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Горизонтальное масштабирование</text>
<rect x="942" y="118" width="430" height="242" rx="16" fill="#FFFFFF" stroke="#CAD5DE" stroke-width="1.5"/><text x="964" y="157" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">03 · СУБД [23–26]</text><text x="965" y="200" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >СУБД — ПО управления БД</text><text x="965" y="230" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >РСУБД — для реляционных БД</text><text x="965" y="260" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Пять систем: SQL Server, MySQL,</text><text x="965" y="290" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Oracle, PostgreSQL, SQLite</text><text x="965" y="320" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >У каждой — свой SQL-диалект</text>
<rect x="28" y="386" width="660" height="288" rx="16" fill="#F8FCFD" stroke="#CAD5DE" stroke-width="1.5"/><text x="50" y="425" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">04 · Чтение: SELECT [21, 27–28]</text><text x="51" y="468" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT * FROM my_table;</text><text x="51" y="498" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT *</text><text x="51" y="528" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >FROM my_table</text><text x="51" y="558" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >WHERE column1 &gt; 100</text><text x="51" y="588" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >ORDER BY column2;</text><text x="51" y="618" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >WHERE фильтрует, ORDER BY сортирует</text>
<rect x="714" y="386" width="658" height="288" rx="16" fill="#F8FCFD" stroke="#CAD5DE" stroke-width="1.5"/><text x="736" y="425" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">05 · CRUD и доступ [26–27]</text><text x="737" y="468" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Create — создание; Read — чтение</text><text x="737" y="498" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Update — обновление</text><text x="737" y="528" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Delete — удаление</text><text x="737" y="558" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SQL-оператор: общий класс</text><text x="737" y="588" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SQL-запрос: чтение/отображение</text><text x="737" y="618" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Примеры изменения здесь не приведены</text>
<rect x="28" y="701" width="660" height="235" rx="16" fill="#FFFFFF" stroke="#CAD5DE" stroke-width="1.5"/><text x="50" y="740" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">06 · ПОРЯДОК ЗАПИСИ [28–29]</text><text x="51" y="783" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >1 SELECT     2 FROM</text><text x="51" y="813" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >3 WHERE      4 GROUP BY</text><text x="51" y="843" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >5 HAVING     6 ORDER BY</text><text x="51" y="873" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Ключевые слова набирают в верхнем</text><text x="51" y="903" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >регистре для удобства чтения</text>
<rect x="714" y="701" width="658" height="235" rx="16" fill="#FFFFFF" stroke="#CAD5DE" stroke-width="1.5"/><text x="736" y="740" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">07 · ЛОГИЧЕСКИЙ ПОРЯДОК [29–30]</text><text x="737" y="783" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >1 FROM       2 WHERE</text><text x="737" y="813" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >3 GROUP BY   4 HAVING</text><text x="737" y="843" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >5 SELECT     6 ORDER BY</text><text x="737" y="873" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Это изложенная в книге логика,</text><text x="737" y="903" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >не проверенный физический план</text>
<rect x="28" y="962" width="660" height="307" rx="16" fill="#F8FCFD" stroke="#CAD5DE" stroke-width="1.5"/><text x="50" y="1001" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">08 · Диалекты: до 10 строк [24]</text><text x="51" y="1044" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >MySQL / PostgreSQL / SQLite:</text><text x="51" y="1074" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT * FROM birthdays LIMIT 10;</text><text x="51" y="1104" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Microsoft SQL Server:</text><text x="51" y="1134" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT TOP 10 * FROM birthdays;</text><text x="51" y="1164" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Oracle Database:</text><text x="51" y="1194" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT * FROM birthdays WHERE ROWNUM &lt;= 10;</text><text x="51" y="1224" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Код по книге; совместимость не тестировалась</text>
<rect x="714" y="962" width="658" height="307" rx="16" fill="#F8FCFD" stroke="#CAD5DE" stroke-width="1.5"/><text x="736" y="1001" fill="#0D4962" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">09 · МОДЕЛЬ ДАННЫХ [30–32]</text><text x="737" y="1044" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Students: student_id (PK)</text><text x="737" y="1074" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >student_name, date_of_birth</text><text x="737" y="1104" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Grades: student_id (FK)</text><text x="737" y="1134" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Один Students → много Grades</text><text x="737" y="1164" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >PK — уникально идентифицирует строку</text><text x="737" y="1194" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >FK — ссылка на PK другой таблицы</text><text x="737" y="1224" fill="#233E53" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Типы колонок: [Needs confirmation]</text>
<rect x="28" y="1293" width="1344" height="96" rx="14" fill="#DCECF3"/>
<text x="46" y="1326" fill="#234C65" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Проверка: реальные SQL-команды НЕ запускались. Схема / доступ / версия РСУБД — [Needs confirmation].</text>
<text x="46" y="1354" fill="#234C65" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >RAG-only: текст и provenance p0021:c01–p0032:c01. Рис. 1.1–1.3 не представлены как изображения.</text>
<text x="46" y="1379" fill="#315B72" font-size="14" font-family="DejaVu Sans,Arial,sans-serif" >Рисунок — сводка проверенных концепций, а не точная копия иллюстраций книги.</text>
</svg>