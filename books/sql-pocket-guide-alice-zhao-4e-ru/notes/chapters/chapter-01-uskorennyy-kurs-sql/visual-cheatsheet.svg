<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="760" viewBox="0 0 1130 760" role="img" aria-label="Глава 1 SQL. Компактная шпаргалка">
<rect width="1130" height="760" fill="#F0F5F9"/>
<text x="28" y="58" fill="#063956" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">SQL · ГЛАВА 1 / УСКОРЕННЫЙ КУРС</text>
<text x="29" y="88" fill="#405B73" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Элис Жао · PDF 21–32 · RAG p0021:c01 — p0032:c01</text>
<rect x="28" y="114" width="340" height="240" rx="16" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="150" fill="#0B4660" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">01 · Данные и модели</text><text x="46" y="187" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >БД = организованное хранение</text><text x="46" y="218" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Реляционная модель: таблицы</text><text x="46" y="249" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Схема определяется заранее</text><text x="46" y="280" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >NoSQL: документный пример</text><text x="46" y="311" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Динамическая схема</text>
<rect x="395" y="114" width="340" height="240" rx="16" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/><text x="413" y="150" fill="#0B4660" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">02 · SQL и СУБД</text><text x="413" y="187" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SQL = язык запросов</text><text x="413" y="218" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >РСУБД = программное обеспечение</text><text x="413" y="249" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SQL Server / MySQL / Oracle</text><text x="413" y="280" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >PostgreSQL / SQLite</text><text x="413" y="311" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Синтаксис зависит от РСУБД</text>
<rect x="762" y="114" width="340" height="240" rx="16" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/><text x="780" y="150" fill="#0B4660" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">03 · CRUD и SELECT</text><text x="780" y="187" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >CRUD: Create / Read</text><text x="780" y="218" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Update / Delete</text><text x="780" y="249" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT — чтение данных</text><text x="780" y="280" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT * FROM my_table;</text><text x="780" y="311" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Запись ≠ запрос на чтение</text>
<rect x="28" y="377" width="524" height="258" rx="16" fill="#F8FCFE" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="413" fill="#0B4660" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">04 · Как записывается SQL</text><text x="46" y="450" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT → FROM → WHERE</text><text x="46" y="481" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >→ GROUP BY → HAVING</text><text x="46" y="512" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >→ ORDER BY</text><text x="46" y="543" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >SELECT * FROM my_table</text><text x="46" y="574" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >WHERE column1 &gt; 100</text><text x="46" y="605" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >ORDER BY column2;</text>
<rect x="577" y="377" width="525" height="258" rx="16" fill="#F8FCFE" stroke="#CBD5E1" stroke-width="1.5"/><text x="595" y="413" fill="#0B4660" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">05 · Логическая обработка</text><text x="595" y="450" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >FROM → WHERE → GROUP BY</text><text x="595" y="481" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >→ HAVING → SELECT</text><text x="595" y="512" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >→ ORDER BY</text><text x="595" y="543" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Модель: Students.student_id (PK)</text><text x="595" y="574" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Grades.student_id (FK)</text><text x="595" y="605" fill="#213548" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Один студент → много оценок</text>
<rect x="28" y="654" width="1074" height="67" rx="12" fill="#DCECF3"/>
<text x="46" y="681" fill="#16415A" font-size="15" font-family="DejaVu Sans,Arial,sans-serif" >Проверка: примеры не выполнялись; целевая БД/права — [Needs confirmation].</text>
<text x="46" y="705" fill="#16415A" font-size="14" font-family="DejaVu Sans,Arial,sans-serif" >Основа: только RAG главы. Рисунки 1.1–1.3 доступны лишь как текстовые описания.</text>
