<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Физический уровень: итоговая шпаргалка</title>
  <desc id="desc">Подробное визуальное резюме основных тем главы 2.</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 2 — Физический уровень: итоговая шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Вся глава: среды → спектр → сигналы → пределы → модуляция → сети доступа → регулирование</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Среды передачи</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Проводные: витая пара, коаксиал, оптоволокно.</tspan><tspan x="78" dy="29">Беспроводные: радио, микроволны, ИК / видимый свет.</tspan><tspan x="78" dy="29">Спутниковые каналы — отдельный класс глобальной связи.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Спектр и распространение</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Частота, длина волны и используемая полоса.</tspan><tspan x="593" dy="29">Расширение спектра и UWB.</tspan><tspan x="593" dy="29">Для беспроводной среды важны помехи и распределение спектра.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. От формы волны к битам</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Сигнал анализируется во времени и по частотным компонентам.</tspan><tspan x="1108" dy="29">Bandwidth в Гц ≠ цифровая скорость в бит/с.</tspan><tspan x="1108" dy="29">Физическая среда ограничивает передаваемый спектр.</tspan></text><rect x="50" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Пределы канала</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Найквист, идеальный канал:</tspan><tspan x="78" dy="29">Rmax = 2 B log₂(V)</tspan><tspan x="78" dy="29">Шеннон, зашумленный канал:</tspan><tspan x="78" dy="29">Rmax = B log₂(1 + S/N)</tspan><tspan x="78" dy="29">Неизвестные B, V или S/N → [Needs confirmation].</tspan></text><rect x="565" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Модуляция и мультиплексирование</text>
  <text x="593" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Baseband и passband.</tspan><tspan x="593" dy="29">Амплитуда / частота / фаза несущей.</tspan><tspan x="593" dy="29">Совместное использование среды:</tspan><tspan x="593" dy="29">TDM · FDM · WDM · кодовое разделение.</tspan></text><rect x="1080" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Стационарный доступ</text>
  <text x="1108" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Телефонная сеть, модемы и абонентский шлейф.</tspan><tspan x="1108" dy="29">ADSL: скорость связана с линией, расстоянием и SNR.</tspan><tspan x="1108" dy="29">Оптический доступ / PON переносит оптоволокно ближе к абоненту.</tspan></text><rect x="50" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="78" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">7. Сотовые сети</text>
  <text x="78" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Соты, повторное использование частот, handoff.</tspan><tspan x="78" dy="29">Поколения 1G → 2G → 3G → 4G → 5G.</tspan><tspan x="78" dy="29">Глава связывает развитие поколений с методами физического уровня.</tspan></text><rect x="565" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">8. Кабель и спутники</text>
  <text x="593" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">HFC / DOCSIS: общая полоса для абонентов узла.</tspan><tspan x="593" dy="29">Спутники: GEO, MEO и LEO.</tspan><tspan x="593" dy="29">Орбита влияет на покрытие, мощность и задержку.</tspan></text><rect x="1080" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="1108" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">9. Сравнение и регулирование</text>
  <text x="1108" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Сети доступа сравниваются по свойствам последнего участка.</tspan><tspan x="1108" dy="29">Физический уровень зависит и от распределения частот.</tspan><tspan x="1108" dy="29">Operational CLI-команды для главы не подтверждены.</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0122:c01–p0242:c01 · no universal modifying action is asserted</text></svg>