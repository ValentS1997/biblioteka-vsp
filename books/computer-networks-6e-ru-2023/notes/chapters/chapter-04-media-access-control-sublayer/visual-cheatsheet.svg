<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — MAC: компактная шпаргалка</title>
  <desc id="desc">Общий канал → доступ к среде → Ethernet/Wi‑Fi → централизованный доступ → L2 switching</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 4 — MAC: компактная шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Общий канал → доступ к среде → Ethernet/Wi‑Fi → централизованный доступ → L2 switching</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Общий канал</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Статическое FDM/TDM удобно при постоянной нагрузке.</tspan><tspan x="78" dy="29">Bursty-трафик требует динамического распределения.</tspan><tspan x="78" dy="29">Ключевой вопрос: кто и когда получает право передачи?</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Семейства MAC</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">ALOHA → передача с риском коллизий.</tspan><tspan x="593" dy="29">CSMA → сначала прослушать среду.</tspan><tspan x="593" dy="29">CSMA/CD → классический проводной Ethernet.</tspan><tspan x="593" dy="29">Collision-free / limited-contention → меньше конкуренции.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Ethernet</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Фрейм + MAC-адресация.</tspan><tspan x="1108" dy="29">Классический Ethernet делит общую среду.</tspan><tspan x="1108" dy="29">Switch + full-duplex → отдельные point-to-point линии</tspan><tspan x="1108" dy="29">и отсутствие общей конкуренции на порту.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. IEEE 802.11</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">CSMA/CA вместо надежного collision detection.</tspan><tspan x="78" dy="29">NAV — виртуальный контроль канала.</tspan><tspan x="78" dy="29">RTS/CTS — hidden-station scenario.</tspan><tspan x="78" dy="29">QoS/TXOP, безопасность и power-save — части MAC-картины.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">5. Bluetooth + DOCSIS</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Bluetooth: главный узел пикосети распределяет слоты.</tspan><tspan x="593" dy="29">DOCSIS: CMTS выполняет ranging и</tspan><tspan x="593" dy="29">распределяет ресурс через service flows.</tspan><tspan x="593" dy="29">Обе модели уменьшают произвольную конкуренцию.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">6. Bridges / VLAN / observation</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Learning bridge → source MAC → forwarding/flooding.</tspan><tspan x="1108" dy="29">Spanning tree → без L2-петель.</tspan><tspan x="1108" dy="29">VLAN + IEEE 802.1Q → логическая топология.</tspan><tspan x="1108" dy="29">Read-only: Wireshark capture.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0313:c01–p0412:c01 · universal modifying commands are not asserted</text></svg>