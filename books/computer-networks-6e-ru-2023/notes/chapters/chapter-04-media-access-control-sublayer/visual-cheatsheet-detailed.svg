<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — MAC: итоговая шпаргалка</title>
  <desc id="desc">Вся глава: allocation → multiple access → Ethernet → 802.11 → Bluetooth → DOCSIS → bridges/VLAN</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 4 — MAC: итоговая шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Вся глава: allocation → multiple access → Ethernet → 802.11 → Bluetooth → DOCSIS → bridges/VLAN</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Распределение канала</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">FDM/TDM: статическое разделение.</tspan><tspan x="78" dy="29">При bursty-трафике выделенный ресурс часто простаивает.</tspan><tspan x="78" dy="29">Динамическая модель учитывает shared channel,</tspan><tspan x="78" dy="29">collisions, time model и carrier sense.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Коллективный доступ</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Pure ALOHA → максимальная простота, много коллизий.</tspan><tspan x="593" dy="29">Slotted ALOHA → более короткий vulnerable period.</tspan><tspan x="593" dy="29">CSMA → carrier sense перед передачей.</tspan><tspan x="593" dy="29">CSMA/CD → collision detection.</tspan><tspan x="593" dy="29">Collision-free и limited-contention → другой компромисс.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Ethernet</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Фрейм Ethernet содержит destination/source MAC.</tspan><tspan x="1108" dy="29">Broadcast и multicast задаются MAC-адресацией.</tspan><tspan x="1108" dy="29">Эволюция: classic → Fast → Gigabit → 10-Gigabit.</tspan><tspan x="1108" dy="29">Switch/full-duplex заменяет общую коллизионную среду.</tspan></text><rect x="50" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. IEEE 802.11</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">Infrastructure: client ↔ AP ↔ distribution system.</tspan><tspan x="78" dy="29">CSMA/CA + NAV; RTS/CTS при hidden-station problem.</tspan><tspan x="78" dy="29">QoS использует приоритеты и TXOP.</tspan><tspan x="78" dy="29">Beacon-механизмы участвуют в power save.</tspan><tspan x="78" dy="29">MAC также включает framing и security mechanisms.</tspan></text><rect x="565" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Bluetooth</text>
  <text x="593" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Пикосеть: один главный узел контролирует slots.</tspan><tspan x="593" dy="29">Подчиненные обмениваются данными через главный узел.</tspan><tspan x="593" dy="29">Profiles задают сценарии применения.</tspan><tspan x="593" dy="29">Стек включает radio, link control, L2CAP и верхние уровни.</tspan><tspan x="593" dy="29">Frequency hopping уменьшает взаимные помехи.</tspan></text><rect x="1080" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. DOCSIS</text>
  <text x="1108" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">CMTS координирует cable modems.</tspan><tspan x="1108" dy="29">Ranging настраивает timing/frequency/power.</tspan><tspan x="1108" dy="29">Service flows связывают трафик с правилами QoS.</tspan><tspan x="1108" dy="29">Мини-слоты и grants распределяют upstream resource.</tspan><tspan x="1108" dy="29">LLD уменьшает задержку для latency-sensitive traffic.</tspan></text><rect x="50" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="78" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">7. Bridges / switches</text>
  <text x="78" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">Learning: source MAC → ingress port.</tspan><tspan x="78" dy="29">Known destination → targeted forwarding.</tspan><tspan x="78" dy="29">Unknown destination → flooding.</tspan><tspan x="78" dy="29">Redundant links создают loops.</tspan><tspan x="78" dy="29">Spanning tree строит незацикленную логическую топологию.</tspan><tspan x="78" dy="29">Switch — современная форма bridge.</tspan></text><rect x="565" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">8. VLAN / IEEE 802.1Q</text>
  <text x="593" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">VLAN отделяет logical LAN от physical topology.</tspan><tspan x="593" dy="29">Bridge хранит membership/forwarding information.</tspan><tspan x="593" dy="29">802.1Q добавляет VLAN tag в Ethernet frame.</tspan><tspan x="593" dy="29">Broadcast traffic ограничивается логической VLAN.</tspan><tspan x="593" dy="29">Это управление L2, не маршрутизация между сетями.</tspan></text><rect x="1080" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="1108" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">9. Практическая проверка и границы</text>
  <text x="1108" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Read-only: Wireshark для capture/inspection.</tspan><tspan x="1108" dy="29">Учебно: simulator CSMA/CD на собственной трассировке.</tspan><tspan x="1108" dy="29">Physical signal/SNR → глава 2.</tspan><tspan x="1108" dy="29">Framing/CRC/ARQ → глава 3.</tspan><tspan x="1108" dy="29">Routing between networks → глава 5.</tspan><tspan x="1108" dy="29">CLI changes для VLAN/STP/Wi‑Fi в главе не заданы.</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0313:c01–p0412:c01 · detailed visual covers sections 4.1–4.8</text></svg>