<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 9 — Рекомендации для чтения и библиография: итоговая карта</title>
  <desc id="desc">Вся глава: discovery channels → 8 тематических reading paths → alphabetic bibliography</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 9 — Рекомендации для чтения и библиография: итоговая карта</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Вся глава: discovery channels → 8 тематических reading paths → alphabetic bibliography</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. General discovery</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">IEEE/ACM journals and networking reviews.</tspan><tspan x="78" dy="29">SIGCOMM publications and research community.</tspan><tspan x="78" dy="29">Conferences named by source:</tspan><tspan x="78" dy="29">SIGCOMM · NSDI · MobiSys · SOSP · OSDI.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. 9.1.1 Introduction</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Broad Internet/networking explanations.</tspan><tspan x="593" dy="29">History and evolution of the Internet.</tspan><tspan x="593" dy="29">Examples: Comer, Kurose/Ross, McCullough,</tspan><tspan x="593" dy="29">Naughton, Severance.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. 9.1.2–9.1.3 Physical + Link</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Physical: 5G, satellite, fiber, copper/access.</tspan><tspan x="1108" dy="29">Data link: error-detection/correction coding,</tspan><tspan x="1108" dy="29">retransmission and flow-control material.</tspan><tspan x="1108" dy="29">Examples include Hui, Lin/Costello, Stallings.</tspan></text><rect x="50" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. 9.1.4 MAC</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">Wi-Fi and millimeter-wave indoor systems.</tspan><tspan x="78" dy="29">Bluetooth architecture/protocols.</tspan><tspan x="78" dy="29">Carrier Ethernet and Ethernet practice.</tspan><tspan x="78" dy="29">Bridges, spanning tree and interconnections.</tspan><tspan x="78" dy="29">Examples: Perlman, Spurgeon/Zimmerman.</tspan></text><rect x="565" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. 9.1.5 Network layer</text>
  <text x="593" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">TCP/IP network-layer protocols and examples.</tspan><tspan x="593" dy="29">IP/ARP/ICMP and routing.</tspan><tspan x="593" dy="29">SDN history and DDoS-defense context.</tspan><tspan x="593" dy="29">Router implementation/algorithms.</tspan><tspan x="593" dy="29">Examples: Comer, Stevens, Feamster, Varghese.</tspan></text><rect x="1080" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. 9.1.6 Transport</text>
  <text x="1108" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">TCP/UDP-focused continuation.</tspan><tspan x="1108" dy="29">IPv4/IPv6 material appears in broader TCP/IP works.</tspan><tspan x="1108" dy="29">TCP Illustrated chapters are specifically recommended.</tspan><tspan x="1108" dy="29">Internet speed measurement is a separate practical topic.</tspan></text><rect x="50" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="78" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">7. 9.1.7 Application</text>
  <text x="78" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">DASH/HLS and video streaming.</tspan><tspan x="78" dy="29">World Wide Web architecture and history.</tspan><tspan x="78" dy="29">VoIP / SIP / H.323.</tspan><tspan x="78" dy="29">IoT application protocols.</tspan><tspan x="78" dy="29">CDN and content-delivery practice.</tspan></text><rect x="565" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">8. 9.1.8 Security</text>
  <text x="593" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Security engineering and system-level thinking.</tspan><tspan x="593" dy="29">Cryptography engineering and network-security protocols.</tspan><tspan x="593" dy="29">Steganography and malware detection.</tspan><tspan x="593" dy="29">Adversarial perspective is included as further reading,</tspan><tspan x="593" dy="29">not as an operational chapter-9 procedure.</tspan></text><rect x="1080" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="1108" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">9. 9.2 Bibliography</text>
  <text x="1108" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Alphabetical full reference list.</tspan><tspan x="1108" dy="29">Use after choosing an author/work in 9.1</tspan><tspan x="1108" dy="29">or following a citation from earlier chapters.</tspan><tspan x="1108" dy="29">Chapter ends at p0990:c01.</tspan><tspan x="1108" dy="29">p0991:c01 is publisher colophon.</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0961:c01–p0990:c01 · detailed visual covers 9.1.1–9.1.8 and 9.2</text></svg>