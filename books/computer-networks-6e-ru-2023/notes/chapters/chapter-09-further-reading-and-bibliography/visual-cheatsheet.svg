<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 9 — Дальнейшее чтение и библиография</title>
  <desc id="desc">Выбрать тему → 9.1.x recommendations → 9.2 full reference → внешний источник</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 9 — Дальнейшее чтение и библиография</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Выбрать тему → 9.1.x recommendations → 9.2 full reference → внешний источник</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Назначение главы</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Не новый protocol и не troubleshooting chapter.</tspan><tspan x="78" dy="29">9.1 помогает выбрать, что читать дальше.</tspan><tspan x="78" dy="29">9.2 дает алфавитные полные bibliographic records.</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Discovery channels</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">IEEE/ACM journals и review publications.</tspan><tspan x="593" dy="29">SIGCOMM-related publications.</tspan><tspan x="593" dy="29">Conferences: SIGCOMM · NSDI · MobiSys · SOSP · OSDI.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Sections 9.1.1–9.1.4</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Introduction → broad networking/history.</tspan><tspan x="1108" dy="29">Physical → 5G/satellite/fiber/access.</tspan><tspan x="1108" dy="29">Data link → error control.</tspan><tspan x="1108" dy="29">MAC → Wi-Fi/Bluetooth/Ethernet/bridges.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Sections 9.1.5–9.1.8</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Network → IP/routing/SDN/router design.</tspan><tspan x="78" dy="29">Transport → TCP/UDP/performance measurement.</tspan><tspan x="78" dy="29">Application → Web/media/VoIP/IoT/CDN.</tspan><tspan x="78" dy="29">Security → engineering/crypto/PKI/malware.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Workflow</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">1. Выбрать topic.</tspan><tspan x="593" dy="29">2. Открыть соответствующий 9.1.x.</tspan><tspan x="593" dy="29">3. Выбрать работу по source description.</tspan><tspan x="593" dy="29">4. Найти full record в 9.2.</tspan><tspan x="593" dy="29">5. Читать внешний источник отдельно.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Scope boundary</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Chapter-specific shell commands: none.</tspan><tspan x="1108" dy="29">Нельзя приписывать главе содержание внешней книги.</tspan><tspan x="1108" dy="29">Operational artifacts адаптированы как reading navigation.</tspan><tspan x="1108" dy="29">Next page after chapter: publisher colophon.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0961:c01–p0990:c01 · p0991:c01 is publisher colophon, not chapter content</text></svg>