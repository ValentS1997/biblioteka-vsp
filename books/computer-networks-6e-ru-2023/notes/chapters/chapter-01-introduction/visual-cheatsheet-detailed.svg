<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Введение: итоговая шпаргалка</title>
  <desc id="desc">Подробное визуальное резюме основных тем главы 1.</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Введение: итоговая шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Карта всей главы: применение → типы сетей → архитектура → модели → стандарты → контекст</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Применение и масштаб</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">• приложение / сценарий использования;</tspan><tspan x="78" dy="29">• PAN → LAN → MAN → WAN → интерсеть;</tspan><tspan x="78" dy="29">• проводные, беспроводные и мобильные сети;</tspan><tspan x="78" dy="29">• сначала определить контекст задачи.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Примеры сетевых технологий</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">• интернет как пример интерсети;</tspan><tspan x="593" dy="29">• мобильные сети;</tspan><tspan x="593" dy="29">• Wi‑Fi;</tspan><tspan x="593" dy="29">• реальные технологии связываются с общей моделью.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Службы и протоколы</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Служба: что уровень предоставляет вышележащему.</tspan><tspan x="1108" dy="29">Протокол: правила взаимодействия одноранговых сущностей.</tspan><tspan x="1108" dy="29">Различать соединение, надежность, запрос/ответ и поток.</tspan></text><rect x="50" y="410" width="720" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Уровни и модели</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">OSI и TCP/IP рассматриваются как модели организации сетевых функций.</tspan><tspan x="78" dy="29">Пятиуровневая модель книги:</tspan><tspan x="78" dy="29">5 — прикладной · 4 — транспортный · 3 — сетевой</tspan><tspan x="78" dy="29">2 — канальный · 1 — физический</tspan><tspan x="78" dy="29">Разделение на уровни скрывает детали нижележащей реализации.</tspan></text><rect x="810" y="410" width="740" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Стандартизация и совместимость</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="838" dy="0">Стандарты позволяют независимо разработанным реализациям взаимодействовать.</tspan><tspan x="838" dy="29">Совместимость — отдельное требование наряду с архитектурой и услугой.</tspan><tspan x="838" dy="29">Глава выделяет стандартизацию как самостоятельную часть сетевой картины.</tspan></text><rect x="50" y="725" width="470" height="225" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="765" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Безопасность, право, общество</text>
  <text x="78" y="803" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Глава отдельно рассматривает:</tspan><tspan x="78" dy="29">• безопасность и приватность;</tspan><tspan x="78" dy="29">• политические, правовые и социальные вопросы;</tspan><tspan x="78" dy="29">• влияние сетевых технологий за пределами протоколов.</tspan></text><rect x="565" y="725" width="470" height="225" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="765" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. Практические наблюдения</text>
  <text x="593" y="803" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">READ‑ONLY: Browser DevTools → Network.</tspan><tspan x="593" dy="29">WORKLOAD: ping &lt;host&gt; для RTT.</tspan><tspan x="593" dy="29">State-changing действий в главе не подтверждено.</tspan></text><rect x="1080" y="725" width="470" height="225" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="765" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Навигация по книге</text>
  <text x="1108" y="803" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Физический → гл. 2 · канальный → гл. 3–4</tspan><tspan x="1108" dy="29">Сетевой → гл. 5 · транспортный → гл. 6</tspan><tspan x="1108" dy="29">Прикладной → гл. 7 · безопасность → гл. 8</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0027:c01–p0121:c01 · detailed summary synthesizes README/commands/cheatsheet/diagram</text></svg>