<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Введение: визуальная шпаргалка</title>
  <desc id="desc">Классификация сетевой задачи, пятиуровневая модель и подтвержденные наблюдательные действия главы 1.</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="50" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Введение</text>
  <text x="60" y="86" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Сначала классифицировать сетевую задачу, затем переходить к нужному уровню</text>

  <rect x="50" y="145" width="720" height="260" rx="18" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
  <text x="80" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17202a">1. Классифицируй задачу</text>
  <text x="80" y="225" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="80" dy="0">• приложение / сценарий использования;</tspan>
    <tspan x="80" dy="31">• масштаб: PAN → LAN → MAN → WAN → интерсеть;</tspan>
    <tspan x="80" dy="31">• технология: проводная, беспроводная, мобильная;</tspan>
    <tspan x="80" dy="31">• свойства службы: соединение, надежность, запрос/ответ, поток;</tspan>
    <tspan x="80" dy="31">• совместимость, стандарты, безопасность и приватность.</tspan>
  </text>

  <rect x="810" y="145" width="740" height="260" rx="18" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
  <text x="840" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17202a">2. Пятиуровневая модель книги</text>
  <rect x="850" y="215" width="650" height="32" rx="8" fill="#eaf2f8"/><text x="875" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#17202a">5  Прикладной — сетевые приложения и вспомогательные службы</text>
  <rect x="850" y="252" width="650" height="32" rx="8" fill="#e8f6f3"/><text x="875" y="275" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#17202a">4  Транспортный — гарантии доставки и абстракции передачи</text>
  <rect x="850" y="289" width="650" height="32" rx="8" fill="#fef9e7"/><text x="875" y="312" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#17202a">3  Сетевой — пересылка пакетов между удаленными узлами</text>
  <rect x="850" y="326" width="650" height="32" rx="8" fill="#fbeee6"/><text x="875" y="349" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#17202a">2  Канальный — фреймы между непосредственно связанными узлами</text>
  <rect x="850" y="363" width="650" height="32" rx="8" fill="#f4ecf7"/><text x="875" y="386" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#17202a">1  Физический — биты как сигналы в среде передачи</text>

  <rect x="50" y="445" width="470" height="300" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="3"/>
  <text x="80" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">READ-ONLY</text>
  <text x="80" y="524" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202a">Browser DevTools → Network</text>
  <text x="80" y="565" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="80" dy="0">Проверить при загрузке страницы:</tspan>
    <tspan x="80" dy="30">• сколько запросов отправил клиент;</tspan>
    <tspan x="80" dy="30">• какие типы запросов видны;</tspan>
    <tspan x="80" dy="30">• что запросы отправляются отдельно.</tspan>
  </text>

  <rect x="565" y="445" width="470" height="300" rx="18" fill="#fffaf0" stroke="#f5b041" stroke-width="3"/>
  <text x="595" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">WORKLOAD-GENERATING</text>
  <text x="595" y="524" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700" fill="#17202a">ping &lt;host&gt;</text>
  <text x="595" y="565" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="595" dy="0">Цель: получить RTT до нескольких узлов</tspan>
    <tspan x="595" dy="30">и сопоставить значения между собой.</tspan>
    <tspan x="595" dy="42">Эффект: генерирует тестовый сетевой трафик.</tspan>
    <tspan x="595" dy="30">Не превращать учебный тест в нагрузочный.</tspan>
  </text>

  <rect x="1080" y="445" width="470" height="300" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="3"/>
  <text x="1110" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">ИНТЕРПРЕТАЦИЯ</text>
  <text x="1110" y="530" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1110" dy="0">• пропускная способность ≠ задержка;</tspan>
    <tspan x="1110" dy="31">• служба ≠ протокол;</tspan>
    <tspan x="1110" dy="31">• уровни скрывают детали нижележащих уровней;</tspan>
    <tspan x="1110" dy="31">• стандарты обеспечивают совместимость;</tspan>
    <tspan x="1110" dy="31">• после классификации — профильная глава.</tspan>
  </text>

  <text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0027:c01–p0121:c01 · state-changing действий в главе не подтверждено</text>
</svg>