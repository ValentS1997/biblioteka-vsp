<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 7 — Прикладной уровень</title>
  <desc id="desc">DNS → e-mail → Web/HTTP → streaming → content delivery</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 7 — Прикладной уровень</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">DNS → e-mail → Web/HTTP → streaming → content delivery</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. DNS</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Distributed hierarchy: resolver → authoritative data.</tspan><tspan x="78" dy="29">Records + zones + cache/TTL.</tspan><tspan x="78" dy="29">Observation: dig ns @a.edu-servers.net cs.uchicago.edu</tspan><tspan x="78" dy="29">Privacy: traditional DNS vs encrypted resolver path.</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. E-mail</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">User agent → submission → SMTP transfer → mailbox.</tspan><tspan x="593" dy="29">MIME extends message content.</tspan><tspan x="593" dy="29">IMAP provides remote mailbox access.</tspan><tspan x="593" dy="29">Observation: telnet mail.isp.com 25.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Web / HTTP</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">URL identifies resource and scheme.</tspan><tspan x="1108" dy="29">HTTP/HTTPS request → status + content.</tspan><tspan x="1108" dy="29">Static/dynamic pages; client/server execution.</tspan><tspan x="1108" dy="29">Caching reduces repeated transfers.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Web state / privacy</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Cookies preserve state across requests.</tspan><tspan x="78" dy="29">Third-party tracking can span sites/devices.</tspan><tspan x="78" dy="29">Cookie syncing merges tracker datasets.</tspan><tspan x="78" dy="29">Fingerprinting can work even when cookies are blocked.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Streaming</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Encoding/compression reduces media bitrate.</tspan><tspan x="593" dy="29">Jitter → playback buffer.</tspan><tspan x="593" dy="29">DASH/HLS adapt short segments to conditions.</tspan><tspan x="593" dy="29">H.323/SIP handle real-time communication signaling.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Content delivery</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Browser/proxy caches reduce repeated fetches.</tspan><tspan x="1108" dy="29">CDN distributes cached copies near users.</tspan><tspan x="1108" dy="29">P2P uses peer resources.</tspan><tspan x="1108" dy="29">BitTorrent: torrent + tracker/DHT + chunks + incentives.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0685:c01–p0813:c01 · operational tools limited to source-supported dig/telnet</text></svg>