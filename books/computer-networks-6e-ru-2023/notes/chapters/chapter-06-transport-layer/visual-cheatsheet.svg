<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 6 — Транспортный уровень</title>
  <desc id="desc">Sockets → reliability/flow → congestion → UDP/TCP → QUIC/BBR → performance</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 6 — Транспортный уровень</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Sockets → reliability/flow → congestion → UDP/TCP → QUIC/BBR → performance</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Transport service</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Process-to-process поверх network layer.</tspan><tspan x="78" dy="29">Connection-oriented или connectionless.</tspan><tspan x="78" dy="29">Berkeley sockets — common application API.</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Reliability + flow</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Sequence numbers · ACK · timers · retransmission.</tspan><tspan x="593" dy="29">Receiver window защищает получателя.</tspan><tspan x="593" dy="29">Connection setup/release требует transport state.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Congestion control</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Network overload требует снизить sender rate.</tspan><tspan x="1108" dy="29">Congestion window ≠ receiver window.</tspan><tspan x="1108" dy="29">AIMD стремится к efficiency + fairness.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. UDP / real-time</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">UDP: ports + datagrams, без встроенного retransmission.</tspan><tspan x="78" dy="29">RPC строит request/response semantics.</tspan><tspan x="78" dy="29">RTP: media timing; RTCP: feedback/synchronization.</tspan><tspan x="78" dy="29">Jitter сглаживается receiver buffering.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. TCP / transport evolution</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">TCP: reliable ordered byte stream.</tspan><tspan x="593" dy="29">Slow start · SACK · ECN · CUBIC.</tspan><tspan x="593" dy="29">QUIC работает поверх UDP.</tspan><tspan x="593" dy="29">BBR оценивает bottleneck bandwidth + RTT.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Performance</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Line rate — не единственный bottleneck.</tspan><tspan x="1108" dy="29">CPU · copies · context switches · timers.</tspan><tspan x="1108" dy="29">RTT + bandwidth-delay product + window.</tspan><tspan x="1108" dy="29">Operational tuning CLI в главе не задан.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0564:c01–p0684:c01 · socket calls are API primitives, not shell commands</text></svg>