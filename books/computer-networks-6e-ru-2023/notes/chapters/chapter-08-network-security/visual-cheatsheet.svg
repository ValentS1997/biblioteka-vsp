<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — Сетевая безопасность</title>
  <desc id="desc">Goals → threats → controls → crypto/auth → secure channels → application security</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 8 — Сетевая безопасность</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Goals → threats → controls → crypto/auth → secure channels → application security</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Security goals</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Confidentiality · integrity · availability.</tspan><tspan x="78" dy="29">Authentication · nonrepudiation.</tspan><tspan x="78" dy="29">Start from asset + trust boundary, not from cipher choice.</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">2. Threat model</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Reconnaissance · interception.</tspan><tspan x="593" dy="29">Spoofing/tampering · disruption/DoS.</tspan><tspan x="593" dy="29">Attack examples explain adversary capability, not a runbook.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Defensive controls</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Firewall → filtering.</tspan><tspan x="1108" dy="29">IDS → signature/anomaly detection.</tspan><tspan x="1108" dy="29">IPS → inline prevention.</tspan><tspan x="1108" dy="29">False positive / false negative both matter.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Cryptography + identity</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Symmetric: AES + modes.</tspan><tspan x="78" dy="29">Public-key: RSA / elliptic-curve context.</tspan><tspan x="78" dy="29">Hashes → digital signatures.</tspan><tspan x="78" dy="29">Certificates/CA bind identity to public key.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Protocol security</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Authentication needs freshness/replay resistance.</tspan><tspan x="593" dy="29">IPsec/VPN protect network-layer communication.</tspan><tspan x="593" dy="29">802.11i/WPA2 protects Wi-Fi link context.</tspan><tspan x="593" dy="29">PGP and TLS apply primitives to real services.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">6. Authorized observation</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">traceroute → workload-generating.</tspan><tspan x="1108" dy="29">tcpdump / Wireshark → read-only capture/analysis.</tspan><tspan x="1108" dy="29">telnet → generic TCP connection tool.</tspan><tspan x="1108" dy="29">No universal configuration CLI is asserted.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0814:c01–p0960:c01 · security tooling retained only in authorized observation context</text></svg>