<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Сетевой уровень: итоговая шпаргалка</title>
  <desc id="desc">Вся глава: design → routing → traffic/QoS → internetworking → SDN → Internet L3 → policy</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 5 — Сетевой уровень: итоговая шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Вся глава: design → routing → traffic/QoS → internetworking → SDN → Internet L3 → policy</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Архитектура сетевого уровня</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">Store-and-forward packet switching.</tspan><tspan x="78" dy="29">Datagram vs virtual-circuit service.</tspan><tspan x="78" dy="29">Routing выбирает путь; forwarding отправляет packet</tspan><tspan x="78" dy="29">на next hop по локальной таблице.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Routing algorithms</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Shortest path и flooding.</tspan><tspan x="593" dy="29">Distance vector и link state — основные adaptive families.</tspan><tspan x="593" dy="29">Hierarchy уменьшает state для больших сетей.</tspan><tspan x="593" dy="29">Mobile / broadcast / multicast / anycast расширяют delivery model.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Congestion control</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Перегрузка проявляется ростом queues, delay и loss.</tspan><tspan x="1108" dy="29">Traffic-aware routing перераспределяет нагрузку.</tspan><tspan x="1108" dy="29">Admission control ограничивает новый трафик.</tspan><tspan x="1108" dy="29">Feedback/throttling/load shedding уменьшают нагрузку.</tspan></text><rect x="50" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. QoS / QoE</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">Приложения различаются требованиями к throughput/delay/jitter/loss.</tspan><tspan x="78" dy="29">Глава рассматривает shaping и packet scheduling.</tspan><tspan x="78" dy="29">Reservation + admission позволяют обещать ресурсы.</tspan><tspan x="78" dy="29">Integrated и differentiated service дают разные модели QoS.</tspan></text><rect x="565" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Internetworking</text>
  <text x="593" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">Объединяемые сети могут иметь разные технологии и MTU.</tspan><tspan x="593" dy="29">Path MTU определяет допустимый размер по выбранному пути.</tspan><tspan x="593" dy="29">Fragmentation разбивает большой packet.</tspan><tspan x="593" dy="29">Tunneling переносит packet через отличающуюся сеть.</tspan></text><rect x="1080" y="410" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. SDN</text>
  <text x="1108" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">Control logic переносится в программируемый controller.</tspan><tspan x="1108" dy="29">Forwarding devices выполняют установленные правила.</tspan><tspan x="1108" dy="29">OpenFlow / NETCONF / YANG — control mechanisms.</tspan><tspan x="1108" dy="29">Programmable pipelines и telemetry расширяют наблюдаемость.</tspan></text><rect x="50" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="78" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">7. Internet network layer</text>
  <text x="78" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="78" dy="0">IPv4/IPv6 · prefixes · CIDR · subnetting.</tspan><tspan x="78" dy="29">ICMP — управляющие сообщения.</tspan><tspan x="78" dy="29">ARP связывает IP и link-layer addressing context.</tspan><tspan x="78" dy="29">DHCP предоставляет host configuration.</tspan><tspan x="78" dy="29">MPLS добавляет label-based forwarding.</tspan></text><rect x="565" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">8. Routing в интернете</text>
  <text x="593" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="593" dy="0">OSPF — один из основных intra-network routing protocols.</tspan><tspan x="593" dy="29">BGP — interdomain routing между autonomous systems.</tspan><tspan x="593" dy="29">BGP route choice зависит от provider policy.</tspan><tspan x="593" dy="29">IP multicast использует group membership и multicast routing.</tspan></text><rect x="1080" y="690" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="1108" y="730" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">9. Диагностика и policy</text>
  <text x="1108" y="768" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746"><tspan x="1108" dy="0">traceroute / tracert → наблюдаем последовательность hops.</tspan><tspan x="1108" dy="29">Команда генерирует diagnostic traffic; rate limits неизвестны.</tspan><tspan x="1108" dy="29">Peering disputes и paid prioritization — policy layer.</tspan><tspan x="1108" dy="29">Network neutrality связывает prioritization с правилами рынка.</tspan><tspan x="1108" dy="29">Routing/QoS modifying CLI источник не задает.</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0413:c01–p0563:c01 · detailed visual covers sections 5.1–5.9</text></svg>