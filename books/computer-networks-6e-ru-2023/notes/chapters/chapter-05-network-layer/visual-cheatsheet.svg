<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Сетевой уровень</title>
  <desc id="desc">Routing → forwarding → congestion/QoS → internetworking → SDN → IP/BGP</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 5 — Сетевой уровень</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Routing → forwarding → congestion/QoS → internetworking → SDN → IP/BGP</text><rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Service model</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Datagram: packet-by-packet routing.</tspan><tspan x="78" dy="29">Virtual circuit: path/state at connection setup.</tspan><tspan x="78" dy="29">Главная задача: доставить packet end-to-end.</tspan></text><rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Routing</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Shortest path · flooding.</tspan><tspan x="593" dy="29">Distance vector · link state.</tspan><tspan x="593" dy="29">Hierarchy · mobile · broadcast · multicast · anycast.</tspan></text><rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Traffic management</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Congestion → queues, delay, loss.</tspan><tspan x="1108" dy="29">Traffic-aware routing · admission control.</tspan><tspan x="1108" dy="29">Feedback · throttling · load shedding.</tspan></text><rect x="50" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. QoS + internetworking</text>
  <text x="78" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">QoS: throughput, delay, jitter, loss.</tspan><tspan x="78" dy="29">Shaping · scheduling · reservation.</tspan><tspan x="78" dy="29">Different MTU → Path MTU / fragmentation.</tspan><tspan x="78" dy="29">Tunneling помогает пересекать отличающиеся сети.</tspan></text><rect x="565" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. SDN + Internet L3</text>
  <text x="593" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Controller/control plane ↔ forwarding plane.</tspan><tspan x="593" dy="29">OpenFlow · NETCONF/YANG · telemetry.</tspan><tspan x="593" dy="29">IPv4/IPv6 · CIDR · ICMP · ARP · DHCP · MPLS.</tspan><tspan x="593" dy="29">OSPF внутри сети · BGP между AS.</tspan></text><rect x="1080" y="445" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="485" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Observation + policy</text>
  <text x="1108" y="523" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">WORKLOAD: traceroute / tracert.</tspan><tspan x="1108" dy="29">Путь наблюдаем, внутренняя policy не выводится автоматически.</tspan><tspan x="1108" dy="29">Peering · prioritization · network neutrality.</tspan><tspan x="1108" dy="29">Universal modifying CLI в главе не задан.</tspan></text><text x="60" y="835" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0413:c01–p0563:c01 · commands limited to source-supported traceroute/tracert</text></svg>