<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Канальный уровень: итоговая шпаргалка</title>
  <desc id="desc">Подробное визуальное резюме основных тем главы 3.</desc>
  <rect width="1600" height="1060" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 3 — Канальный уровень: итоговая шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Вся глава: службы → framing → error control → ARQ → flow control → sliding window → PPP/DOCSIS</text><rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Задача канального уровня</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Преобразовать поток битов в поток фреймов.</tspan><tspan x="78" dy="29">Дать сетевому уровню выбранный уровень надежности.</tspan><tspan x="78" dy="29">Фрейм содержит Header · Payload · Trailer.</tspan></text><rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Формирование фреймов</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Byte count.</tspan><tspan x="593" dy="29">Flag bytes + byte stuffing.</tspan><tspan x="593" dy="29">Flag bits + bit stuffing.</tspan><tspan x="593" dy="29">Зарезервированные сигналы физического уровня.</tspan></text><rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Ошибки и избыточность</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Коррекция ошибок: FEC / корректирующие коды.</tspan><tspan x="1108" dy="29">Обнаружение: parity · checksum · CRC.</tspan><tspan x="1108" dy="29">Выбор зависит от характера канала и модели ошибок.</tspan></text><rect x="50" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. ACK, таймеры, sequence numbers</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">ACK/NAK сообщает результат приема.</tspan><tspan x="78" dy="29">Таймер предотвращает зависание при потере frame или ACK.</tspan><tspan x="78" dy="29">Sequence number отличает новый фрейм от дубликата.</tspan><tspan x="78" dy="29">Повторная передача должна сохранять корректность доставки.</tspan></text><rect x="565" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Flow control</text>
  <text x="593" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">Проблема: sender может быть быстрее receiver.</tspan><tspan x="593" dy="29">Глава рассматривает feedback-based flow control.</tspan><tspan x="593" dy="29">Протокол определяет, когда разрешена отправка следующего фрейма.</tspan></text><rect x="1080" y="410" width="470" height="260" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Повышение эффективности</text>
  <text x="1108" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Stop-and-wait прост, но простаивает на длинном RTT.</tspan><tspan x="1108" dy="29">Sliding window держит несколько фреймов неподтвержденными.</tspan><tspan x="1108" dy="29">Piggyback ACK использует встречный трафик для подтверждений.</tspan></text><rect x="50" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="78" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">7. Go-Back-N vs Selective Repeat</text>
  <text x="78" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Go-Back-N: прием по порядку, повтор серии после ошибки.</tspan><tspan x="78" dy="29">Selective Repeat: буферизация допустимых out-of-order frames.</tspan><tspan x="78" dy="29">Выбор — компромисс сложности, буферов и лишних повторов.</tspan></text><rect x="565" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">8. Практические протоколы</text>
  <text x="593" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">PPP — основной протокол линий «точка-точка».</tspan><tspan x="593" dy="29">Рассмотрены применения поверх SONET и ADSL.</tspan><tspan x="593" dy="29">DOCSIS иллюстрирует framing, flow/error control в кабельной сети.</tspan></text><rect x="1080" y="700" width="470" height="250" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="1108" y="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">9. Проверка границ анализа</text>
  <text x="1108" y="778" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Биты / SNR / среда → глава 2.</tspan><tspan x="1108" dy="29">Конкуренция за общую Ethernet/Wi‑Fi среду → глава 4.</tspan><tspan x="1108" dy="29">generator / verifier / alter — учебная CRC-модель, не production runbook.</tspan></text><text x="60" y="1024" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#566573">Provenance: RAG p0243:c01–p0312:c01 · universal state-changing commands are not asserted</text></svg>