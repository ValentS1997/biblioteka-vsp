<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 9 — Выбор владельца: подробная шпаргалка</title>
  <desc id="desc">RAG-grounded detailed map of singleton trade-offs, compare-and-swap, TTL locks, leases, stale-owner races and owner/version validation.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .t { font-size: 32px; font-weight: 700; }
      .s { font-size: 14px; fill: #4b5563; }
      .h { font-size: 18px; font-weight: 700; }
      .b { font-size: 14px; }
      .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 2; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="50" y="50" class="t">Глава 9 — Выбор владельца</text>
  <text x="50" y="78" class="s">RAG p0151:c01–p0170:c01 · PDF 151–170</text>

  <rect x="70" y="120" width="630" height="145" class="blue"/>
  <text x="100" y="158" class="h">Singleton</text>
  <text x="100" y="190" class="b">ownership is implicit</text>
  <text x="100" y="220" class="b">simple deployment · downtime during failure/update</text>

  <rect x="800" y="120" width="630" height="145" class="green"/>
  <text x="830" y="158" class="h">Replicated service with election</text>
  <text x="830" y="190" class="b">several candidates · one active owner</text>
  <text x="830" y="220" class="b">higher availability · much more coordination complexity</text>

  <text x="50" y="325" class="h">Ownership safety stack</text>

  <rect x="60" y="355" width="300" height="145" class="green"/>
  <text x="90" y="392" class="h">1. CAS</text>
  <text x="90" y="424" class="b">atomic acquire</text>
  <text x="90" y="454" class="b">one contender wins</text>

  <rect x="420" y="355" width="300" height="145" class="orange"/>
  <text x="450" y="392" class="h">2. TTL</text>
  <text x="450" y="424" class="b">crashed owner cannot block forever</text>
  <text x="450" y="454" class="b">expiry enables failover</text>

  <rect x="780" y="355" width="300" height="145" class="blue"/>
  <text x="810" y="392" class="h">3. Resource version</text>
  <text x="810" y="424" class="b">release only same ownership state</text>
  <text x="810" y="454" class="b">stale unlock rejected</text>

  <rect x="1140" y="355" width="300" height="145" class="violet"/>
  <text x="1170" y="392" class="h">4. Renewal</text>
  <text x="1170" y="424" class="b">refresh before TTL expires</text>
  <text x="1170" y="454" class="b">loss → stop protected work</text>

  <path d="M360,427 L420,427" class="arrow"/>
  <path d="M720,427 L780,427" class="arrow"/>
  <path d="M1080,427 L1140,427" class="arrow"/>

  <text x="50" y="565" class="h">The hard race</text>

  <rect x="70" y="595" width="630" height="205" class="orange"/>
  <text x="100" y="632" class="h">Old owner resumes after lease loss</text>
  <text x="100" y="664" class="b">A owns → A pauses → TTL expires</text>
  <text x="100" y="694" class="b">B acquires → A resumes</text>
  <text x="100" y="724" class="b">A may temporarily believe it still owns</text>
  <text x="100" y="754" class="b">local isLocked check reduces but cannot eliminate race</text>

  <rect x="800" y="595" width="630" height="205" class="green"/>
  <text x="830" y="632" class="h">Protected receiver validates authority</text>
  <text x="830" y="664" class="b">request carries owner identity + resource version</text>
  <text x="830" y="694" class="b">receiver compares against coordination store</text>
  <text x="830" y="724" class="b">mismatch → reject stale request</text>
  <text x="830" y="754" class="b">works even after same owner later reacquires</text>

  <path d="M700,697 L800,697" class="arrow"/>

  <text x="50" y="865" class="h">Source practical</text>

  <rect x="70" y="895" width="420" height="145" class="box"/>
  <text x="100" y="932" class="h">etcd cluster</text>
  <text x="100" y="964" class="b">Helm + etcd operator</text>
  <text x="100" y="994" class="b">3-member source configuration</text>

  <rect x="540" y="895" width="420" height="145" class="box"/>
  <text x="570" y="932" class="h">Mutex</text>
  <text x="570" y="964" class="b">Alice acquires</text>
  <text x="570" y="994" class="b">Bob compare-and-swap fails</text>

  <rect x="1010" y="895" width="420" height="145" class="box"/>
  <text x="1040" y="932" class="h">Lease</text>
  <text x="1040" y="964" class="b">10-second TTL example</text>
  <text x="1040" y="994" class="b">conditional renew of current owner</text>

  <rect x="180" y="1065" width="1140" height="40" class="orange"/>
  <text x="210" y="1092" class="b">Source endpoint command contains extraction/name mismatches; current Helm/etcd/Kubernetes compatibility remains unverified.</text>
</svg>