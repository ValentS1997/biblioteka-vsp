<text x="180" y="622" class="h">Book thesis</text>
<text x="180" y="654" class="b">Do not rebuild distributed mechanisms from scratch for every system.</text>
<text x="180" y="684" class="b">Generalize, reuse and collaborate around canonical implementations.</text>

