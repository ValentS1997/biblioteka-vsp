<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Введение: компактная визуальная шпаргалка</title>
  <desc id="desc">RAG-grounded схема мотивации распределенных систем, определения паттерна и трех видов ценности паттернов.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 15px; fill: #4b5563; }
      .h { font-size: 19px; font-weight: 700; }
      .b { font-size: 16px; }
      .small { font-size: 13px; fill: #374151; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 14; }
      .accent { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 14; }
      .value { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="50" y="52" class="title">Глава 1 — Введение</text>
  <text x="50" y="80" class="sub">RAG p0018:c01–p0028:c01 · PDF 18–28 · source policy: rag_only</text>

  <rect x="50" y="115" width="300" height="125" class="box"/>
  <text x="70" y="145" class="h">Почему distributed?</text>
  <text x="70" y="175" class="b">always-on приложения + API</text>
  <text x="70" y="200" class="b">+ быстрый рост нагрузки</text>
  <text x="70" y="225" class="b">→ масштабирование на многих машинах</text>

  <rect x="450" y="115" width="300" height="125" class="warn"/>
  <text x="470" y="145" class="h">Цена распределенности</text>
  <text x="470" y="175" class="b">сложнее проектировать</text>
  <text x="470" y="200" class="b">сложнее строить и отлаживать</text>
  <text x="470" y="225" class="b">→ нужны patterns / practices</text>

  <rect x="850" y="115" width="300" height="125" class="accent"/>
  <text x="870" y="145" class="h">Технологический enabler</text>
  <text x="870" y="175" class="b">containers + images</text>
  <text x="870" y="200" class="b">+ orchestrators</text>
  <text x="870" y="225" class="b">→ reusable building blocks</text>

  <path d="M350,177 L450,177" class="arrow"/>
  <path d="M750,177 L850,177" class="arrow"/>

  <rect x="250" y="285" width="700" height="120" class="accent"/>
  <text x="275" y="320" class="h">Паттерн распределенной системы</text>
  <text x="275" y="350" class="b">Обобщенная схема организации и ориентировочная структура системы</text>
  <text x="275" y="378" class="b">не привязана к конкретной технологии или приложению</text>

  <path d="M600,240 L600,285" class="arrow"/>

  <rect x="50" y="465" width="330" height="130" class="value"/>
  <text x="70" y="500" class="h">1. Чужой опыт</text>
  <text x="70" y="532" class="b">не повторять известные ошибки</text>
  <text x="70" y="560" class="b">ускорять обучение и design</text>

  <rect x="435" y="465" width="330" height="130" class="value"/>
  <text x="455" y="500" class="h">2. Общий язык</text>
  <text x="455" y="532" class="b">назвать архитектурную идею</text>
  <text x="455" y="560" class="b">и сразу обсуждать реализацию</text>

  <rect x="820" y="465" width="330" height="130" class="value"/>
  <text x="840" y="500" class="h">3. Reusable components</text>
  <text x="840" y="532" class="b">реализовать один раз</text>
  <text x="840" y="560" class="b">использовать во многих системах</text>

  <path d="M440,405 L215,465" class="arrow"/>
  <path d="M600,405 L600,465" class="arrow"/>
  <path d="M760,405 L985,465" class="arrow"/>

  <rect x="160" y="640" width="880" height="70" class="box"/>
  <text x="190" y="672" class="h">Главный принцип</text>
  <text x="190" y="697" class="b">Повторяющаяся архитектурная задача → общий паттерн → общий язык → reusable implementation</text>

  <text x="50" y="742" class="small">Boundary: глава концептуальная; CLI, deployment procedure и количественные SLO/thresholds отсутствуют.</text>
</svg>
