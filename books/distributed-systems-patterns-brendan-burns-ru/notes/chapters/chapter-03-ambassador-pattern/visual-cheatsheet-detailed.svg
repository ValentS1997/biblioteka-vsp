<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Паттерн Ambassador: подробная шпаргалка</title>
  <desc id="desc">RAG-grounded detailed map of Ambassador use cases, Redis twemproxy flow, service broker and nginx experiments.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 15px; fill: #4b5563; }
      .section { font-size: 22px; font-weight: 700; }
      .h { font-size: 17px; font-weight: 700; }
      .b { font-size: 14px; }
      .small { font-size: 12px; fill: #374151; }
      .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="50" y="52" class="title">Глава 3 — Паттерн Ambassador</text>
  <text x="50" y="82" class="sub">«Распределенные системы. Паттерны проектирования» · RAG p0050:c01–p0063:c01 · PDF 50–63</text>

  <text x="50" y="125" class="section">A. Core abstraction</text>

  <rect x="90" y="155" width="400" height="120" class="blue"/>
  <text x="120" y="192" class="h">Application container</text>
  <text x="120" y="222" class="b">stable local-facing contract</text>
  <text x="120" y="250" class="b">does not own external topology/policy</text>

  <rect x="600" y="155" width="400" height="120" class="green"/>
  <text x="630" y="192" class="h">Ambassador container</text>
  <text x="630" y="222" class="b">mediates communication with external world</text>
  <text x="630" y="250" class="b">routing · discovery · request policy</text>

  <rect x="1110" y="155" width="400" height="120" class="box"/>
  <text x="1140" y="192" class="h">External systems</text>
  <text x="1140" y="222" class="b">shards · environment services</text>
  <text x="1140" y="250" class="b">production / experimental backends</text>

  <path d="M490,215 L600,215" class="arrow"/>
  <path d="M1000,215 L1110,215" class="arrow"/>

  <text x="50" y="335" class="section">B. Use case 1 — client-side sharding</text>

  <rect x="70" y="365" width="350" height="150" class="violet"/>
  <text x="95" y="400" class="h">Application expectation</text>
  <text x="95" y="432" class="b">one local storage endpoint</text>
  <text x="95" y="462" class="b">no shard-routing code</text>

  <rect x="485" y="365" width="350" height="150" class="green"/>
  <text x="510" y="400" class="h">twemproxy Ambassador</text>
  <text x="510" y="432" class="b">listen 127.0.0.1:6379</text>
  <text x="510" y="462" class="b">hash + distribution + host policy</text>

  <rect x="900" y="365" width="600" height="150" class="blue"/>
  <text x="925" y="400" class="h">Redis shards</text>
  <text x="925" y="432" class="b">sharded-redis-0.redis · sharded-redis-1.redis</text>
  <text x="925" y="462" class="b">sharded-redis-2.redis · port 6379</text>
  <text x="925" y="490" class="small">StatefulSet + headless Service + ConfigMap are used in source example</text>

  <path d="M420,440 L485,440" class="arrow"/>
  <path d="M835,440 L900,440" class="arrow"/>

  <text x="50" y="575" class="section">C. Use case 2 — service broker</text>

  <rect x="100" y="605" width="400" height="135" class="blue"/>
  <text x="125" y="640" class="h">Same application</text>
  <text x="125" y="672" class="b">expects local dependency endpoint</text>
  <text x="125" y="702" class="b">e.g. MySQL-like service</text>

  <rect x="600" y="605" width="400" height="135" class="green"/>
  <text x="625" y="640" class="h">Service-broker Ambassador</text>
  <text x="625" y="672" class="b">inspect environment</text>
  <text x="625" y="702" class="b">discover / create target instance</text>

  <rect x="1100" y="605" width="400" height="135" class="box"/>
  <text x="1125" y="640" class="h">Environment-specific target</text>
  <text x="1125" y="672" class="b">public / private cloud</text>
  <text x="1125" y="702" class="b">physical data center</text>

  <path d="M500,672 L600,672" class="arrow"/>
  <path d="M1000,672 L1100,672" class="arrow"/>

  <text x="50" y="800" class="section">D. Use case 3 — experiment / request splitting</text>

  <rect x="70" y="835" width="340" height="160" class="blue"/>
  <text x="95" y="870" class="h">Incoming request</text>
  <text x="95" y="902" class="b">application uses local Ambassador</text>
  <text x="95" y="932" class="b">traffic policy outside app logic</text>

  <rect x="470" y="835" width="340" height="160" class="green"/>
  <text x="495" y="870" class="h">nginx Ambassador</text>
  <text x="495" y="902" class="b">ip_hash</text>
  <text x="495" y="932" class="b">web weight=9</text>
  <text x="495" y="962" class="b">experiment backend</text>

  <rect x="870" y="825" width="290" height="105" class="violet"/>
  <text x="895" y="860" class="h">Production</text>
  <text x="895" y="892" class="b">≈ 90% traffic</text>

  <rect x="870" y="950" width="290" height="105" class="violet"/>
  <text x="895" y="985" class="h">Experiment</text>
  <text x="895" y="1017" class="b">≈ 10% traffic</text>

  <rect x="1220" y="835" width="310" height="220" class="orange"/>
  <text x="1245" y="870" class="h">Source boundaries</text>
  <text x="1245" y="902" class="b">web + experiment services</text>
  <text x="1245" y="930" class="b">must already exist</text>
  <text x="1245" y="958" class="b">ConfigMap naming mismatch</text>
  <text x="1245" y="986" class="b">Redis manifest sequence ambiguous</text>
  <text x="1245" y="1014" class="b">rollback not supplied</text>

  <path d="M410,915 L470,915" class="arrow"/>
  <path d="M810,900 L870,875" class="arrow"/>
  <path d="M810,945 L870,1000" class="arrow"/>

  <rect x="200" y="1095" width="1200" height="55" class="box"/>
  <text x="230" y="1129" class="h">Decision: external interaction complexity → local reusable Ambassador OR separate operated service, based on ownership/use frequency</text>

  <text x="50" y="1172" class="small">Chapter 3 does not define universal rollout/rollback, modern API compatibility or production hardening controls.</text>
</svg>