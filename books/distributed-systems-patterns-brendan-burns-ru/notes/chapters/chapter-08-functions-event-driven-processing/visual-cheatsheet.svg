<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — Функции и событийно-ориентированная обработка</title>
  <desc id="desc">Компактная RAG-grounded схема FaaS, Decorator, event handler and Event Pipeline.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 14px; fill: #4b5563; }
      .h { font-size: 18px; font-weight: 700; }
      .b { font-size: 15px; }
      .small { font-size: 13px; fill: #374151; }
      .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 14; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 14; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="45" y="50" class="title">Глава 8 — Функции и событийно-ориентированная обработка</text>
  <text x="45" y="78" class="sub">RAG p0134:c01–p0150:c01 · PDF 134–150 · rag_only</text>

  <rect x="80" y="120" width="300" height="115" class="blue"/>
  <text x="105" y="157" class="h">Discrete event</text>
  <text x="105" y="188" class="b">request / trigger</text>

  <rect x="450" y="120" width="300" height="115" class="green"/>
  <text x="475" y="157" class="h">FaaS function</text>
  <text x="475" y="188" class="b">short-lived · stateless</text>

  <rect x="820" y="120" width="300" height="115" class="violet"/>
  <text x="845" y="157" class="h">Result / next event</text>
  <text x="845" y="188" class="b">network-coupled flow</text>

  <path d="M380,177 L450,177" class="arrow"/>
  <path d="M750,177 L820,177" class="arrow"/>

  <rect x="70" y="320" width="300" height="145" class="blue"/>
  <text x="95" y="357" class="h">Decorator</text>
  <text x="95" y="389" class="b">transform request/response</text>
  <text x="95" y="419" class="b">before main API</text>

  <rect x="450" y="320" width="300" height="145" class="green"/>
  <text x="475" y="357" class="h">Async handler</text>
  <text x="475" y="389" class="b">move slower side effect</text>
  <text x="475" y="419" class="b">out of sync path</text>

  <rect x="830" y="320" width="300" height="145" class="violet"/>
  <text x="855" y="357" class="h">Event Pipeline</text>
  <text x="855" y="389" class="b">function → event → function</text>
  <text x="855" y="419" class="b">required / optional handlers</text>

  <rect x="130" y="555" width="430" height="130" class="orange"/>
  <text x="155" y="592" class="h">Poor FaaS fit</text>
  <text x="155" y="624" class="b">long-running background work</text>
  <text x="155" y="652" class="b">large warm-up / sustained high load</text>

  <rect x="640" y="555" width="430" height="130" class="box"/>
  <text x="665" y="592" class="h">Operational boundary</text>
  <text x="665" y="624" class="b">external state · monitoring</text>
  <text x="665" y="652" class="b">dependency/cycle visibility</text>

  <rect x="180" y="735" width="840" height="45" class="green"/>
  <text x="210" y="764" class="b">Rule: discrete + independent + short-lived + little local state → strong FaaS candidate.</text>

  <text x="45" y="808" class="small">Source code defects and current Kubeless/runtime compatibility are recorded as unverified.</text>
</svg>
