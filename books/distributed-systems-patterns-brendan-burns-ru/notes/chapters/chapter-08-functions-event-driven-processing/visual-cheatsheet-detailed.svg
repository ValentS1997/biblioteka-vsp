<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; }
    .t { font-size: 32px; font-weight: 700; }
    .s { font-size: 14px; fill: #4b5563; }
    .h { font-size: 18px; font-weight: 700; }
    .b { font-size: 14px; }
    .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
    .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
    .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
    .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
    .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 2; rx: 12; }
    .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#m); }
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#374151"/></marker></defs>

  <text x="50" y="50" class="t">Глава 8 — Функции и событийно-ориентированная обработка</text>
  <text x="50" y="78" class="s">RAG p0134:c01–p0150:c01 · PDF 134–150</text>

  <rect x="70" y="120" width="410" height="125" class="blue"/>
  <text x="100" y="158" class="h">Execution model</text>
  <text x="100" y="190" class="b">discrete event / request</text>
  <text x="100" y="220" class="b">short-lived function invocation</text>

  <rect x="545" y="120" width="410" height="125" class="green"/>
  <text x="575" y="158" class="h">Platform behavior</text>
  <text x="575" y="190" class="b">automatic scale / restart in chapter framing</text>
  <text x="575" y="220" class="b">external shared state</text>

  <rect x="1020" y="120" width="410" height="125" class="violet"/>
  <text x="1050" y="158" class="h">Operational cost</text>
  <text x="1050" y="190" class="b">network coupling · monitoring burden</text>
  <text x="1050" y="220" class="b">dependency graph can become opaque</text>

  <text x="50" y="310" class="h">FaaS fit</text>

  <rect x="70" y="340" width="620" height="160" class="green"/>
  <text x="100" y="378" class="h">Good candidate</text>
  <text x="100" y="410" class="b">independent event handler</text>
  <text x="100" y="440" class="b">little local state · variable/rare load</text>
  <text x="100" y="470" class="b">asynchronous side effect or lightweight transform</text>

  <rect x="810" y="340" width="620" height="160" class="orange"/>
  <text x="840" y="378" class="h">Poor candidate</text>
  <text x="840" y="410" class="b">long-running background computation</text>
  <text x="840" y="440" class="b">large in-memory warm-up</text>
  <text x="840" y="470" class="b">sustained high request rate / always-busy CPU</text>

  <text x="50" y="565" class="h">Source patterns</text>

  <rect x="60" y="600" width="410" height="170" class="blue"/>
  <text x="90" y="638" class="h">Decorator</text>
  <text x="90" y="670" class="b">client → function → API</text>
  <text x="90" y="700" class="b">default values / validation / enrichment</text>
  <text x="90" y="730" class="b">independent scale from main service</text>

  <rect x="545" y="600" width="410" height="170" class="green"/>
  <text x="575" y="638" class="h">2FA event handler</text>
  <text x="575" y="670" class="b">login event → async function</text>
  <text x="575" y="700" class="b">register code + send message</text>
  <text x="575" y="730" class="b">slow side effect leaves sync path</text>

  <rect x="1030" y="600" width="410" height="170" class="violet"/>
  <text x="1060" y="638" class="h">Event Pipeline</text>
  <text x="1060" y="670" class="b">event → function → event → function</text>
  <text x="1060" y="700" class="b">required + optional callbacks</text>
  <text x="1060" y="730" class="b">context traces business flow</text>

  <text x="50" y="835" class="h">Operational checks</text>

  <rect x="70" y="870" width="1360" height="150" class="box"/>
  <text x="100" y="908" class="b">1. Map function dependencies and detect cycles.</text>
  <text x="100" y="938" class="b">2. Identify external state and network calls.</text>
  <text x="100" y="968" class="b">3. Add monitoring/alerting before failures become systemic.</text>
  <text x="760" y="908" class="b">4. Measure cold-start/warm-up impact.</text>
  <text x="760" y="938" class="b">5. Revisit economics under sustained load.</text>
  <text x="760" y="968" class="b">6. Keep modern runtime/platform compatibility unverified unless separately checked.</text>

  <rect x="160" y="1040" width="1180" height="40" class="orange"/>
  <text x="190" y="1067" class="b">Source code contains extraction/wording defects; artifacts preserve intent without silently producing corrected executable code.</text>
</svg>
