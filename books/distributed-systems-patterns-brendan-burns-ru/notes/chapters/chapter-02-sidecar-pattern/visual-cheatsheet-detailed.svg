<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Паттерн Sidecar: подробная шпаргалка</title>
  <desc id="desc">RAG-grounded карта Sidecar: shared resources, legacy HTTPS, dynamic config, topz, PaaS, parameterization, API stability and documentation.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 15px; fill: #4b5563; }
      .section { font-size: 22px; font-weight: 700; }
      .h { font-size: 17px; font-weight: 700; }
      .b { font-size: 14px; }
      .small { font-size: 12px; fill: #374151; }
      .box { fill: #f9fafb; stroke: #4b5563; stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="50" y="52" class="title">Глава 2 — Паттерн Sidecar</text>
  <text x="50" y="82" class="sub">«Распределенные системы. Паттерны проектирования» · RAG p0034:c01–p0049:c01 · PDF 34–49</text>

  <text x="50" y="125" class="section">A. Core pattern</text>

  <rect x="160" y="155" width="420" height="120" class="blue"/>
  <text x="190" y="192" class="h">Application container</text>
  <text x="190" y="222" class="b">business / primary application logic</text>
  <text x="190" y="250" class="b">может быть legacy и не изменяться</text>

  <rect x="1020" y="155" width="420" height="120" class="green"/>
  <text x="1050" y="192" class="h">Sidecar container</text>
  <text x="1050" y="222" class="b">дополняет / расширяет application</text>
  <text x="1050" y="250" class="b">co-scheduled на одном узле</text>

  <rect x="635" y="170" width="330" height="90" class="box"/>
  <text x="660" y="202" class="h">Shared resources</text>
  <text x="660" y="230" class="b">network · PID · filesystem · hostname</text>

  <path d="M580,215 L635,215" class="arrow"/>
  <path d="M965,215 L1020,215" class="arrow"/>

  <text x="50" y="335" class="section">B. Source use cases</text>

  <rect x="50" y="365" width="350" height="145" class="violet"/>
  <text x="75" y="400" class="h">1. Legacy HTTPS</text>
  <text x="75" y="430" class="b">legacy app: HTTP on 127.0.0.1</text>
  <text x="75" y="458" class="b">nginx sidecar: external HTTPS</text>
  <text x="75" y="486" class="b">proxy → localhost HTTP</text>

  <rect x="430" y="365" width="350" height="145" class="violet"/>
  <text x="455" y="400" class="h">2. Dynamic config</text>
  <text x="455" y="430" class="b">API → config manager</text>
  <text x="455" y="458" class="b">shared config file</text>
  <text x="455" y="486" class="b">file watch / SIGHUP / restart</text>

  <rect x="810" y="365" width="350" height="145" class="violet"/>
  <text x="835" y="400" class="h">3. topz utility</text>
  <text x="835" y="430" class="b">same PID namespace</text>
  <text x="835" y="458" class="b">inspect processes/resources</text>
  <text x="835" y="486" class="b">serve /topz</text>

  <rect x="1190" y="365" width="360" height="145" class="violet"/>
  <text x="1215" y="400" class="h">4. Simple PaaS</text>
  <text x="1215" y="430" class="b">Git-sync loop</text>
  <text x="1215" y="458" class="b">shared filesystem</text>
  <text x="1215" y="486" class="b">Node.js + nodemon</text>

  <text x="50" y="570" class="section">C. Reusable implementation</text>

  <rect x="70" y="605" width="450" height="175" class="green"/>
  <text x="95" y="642" class="h">Parameterization</text>
  <text x="95" y="675" class="b">container ≈ function with inputs</text>
  <text x="95" y="705" class="b">environment variables preferred by author</text>
  <text x="95" y="735" class="b">example: PROXY_PORT, CERTIFICATE_PATH</text>
  <text x="95" y="762" class="small">inputs feed startup script / generated config</text>

  <rect x="575" y="605" width="450" height="175" class="green"/>
  <text x="600" y="642" class="h">Stable API</text>
  <text x="600" y="675" class="b">startup params + external calls + services</text>
  <text x="600" y="705" class="b">rename can break consumers</text>
  <text x="600" y="735" class="b">semantic/unit change can silently break behavior</text>
  <text x="600" y="762" class="small">compatibility = syntax + meaning</text>

  <rect x="1080" y="605" width="450" height="175" class="green"/>
  <text x="1105" y="642" class="h">Documentation</text>
  <text x="1105" y="675" class="b">Dockerfile as first documentation point</text>
  <text x="1105" y="705" class="b">EXPOSE → ports</text>
  <text x="1105" y="735" class="b">ENV → defaults · LABEL → metadata</text>
  <text x="1105" y="762" class="small">comments explain semantics</text>

  <text x="50" y="840" class="section">D. Operational checks and risks</text>

  <rect x="70" y="875" width="700" height="190" class="box"/>
  <text x="95" y="910" class="h">Check before deploy</text>
  <text x="95" y="942" class="b">• capability is truly cross-cutting / reusable</text>
  <text x="95" y="970" class="b">• only necessary namespaces/resources are shared</text>
  <text x="95" y="998" class="b">• ports do not conflict</text>
  <text x="95" y="1026" class="b">• parameters and semantics are stable</text>
  <text x="95" y="1054" class="b">• observable verification exists</text>

  <rect x="830" y="875" width="700" height="190" class="orange"/>
  <text x="855" y="910" class="h">Risks / boundaries</text>
  <text x="855" y="942" class="b">• shared resources increase coupling</text>
  <text x="855" y="970" class="b">• SIGKILL is disruptive</text>
  <text x="855" y="998" class="b">• generic utility may cost size/performance</text>
  <text x="855" y="1026" class="b">• API semantic drift can silently alter load</text>
  <text x="855" y="1054" class="b">• topz “-  p” option is an extraction defect</text>

  <rect x="180" y="1095" width="1240" height="55" class="blue"/>
  <text x="210" y="1129" class="h">Decision rule: repeated adjacent capability → co-locate as Sidecar → parameterize → stabilize API → document → verify</text>

  <text x="50" y="1172" class="small">No universal Kubernetes manifest, TLS validation policy or rollback command is supplied by chapter 2.</text>
</svg>
