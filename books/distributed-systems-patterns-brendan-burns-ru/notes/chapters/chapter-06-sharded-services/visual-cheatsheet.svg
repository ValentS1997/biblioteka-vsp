<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Глава 6 — Шардированные сервисы</title>
  <desc id="desc">RAG-grounded компактная схема sharding, replicated shards, consistent hashing and hot sharding.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 14px; fill: #4b5563; }
      .h { font-size: 18px; font-weight: 700; }
      .b { font-size: 15px; }
      .small { font-size: 13px; fill: #374151; }
      .blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .violet { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 14; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 14; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="45" y="50" class="title">Глава 6 — Шардированные сервисы</text>
  <text x="45" y="78" class="sub">RAG p0102:c01–p0121:c01 · PDF 102–121 · rag_only</text>

  <rect x="60" y="120" width="300" height="120" class="blue"/>
  <text x="85" y="157" class="h">Request / key</text>
  <text x="85" y="188" class="b">semantic sharding key</text>

  <rect x="450" y="120" width="300" height="120" class="green"/>
  <text x="475" y="157" class="h">Sharding function</text>
  <text x="475" y="188" class="b">deterministic + uniform</text>

  <rect x="840" y="120" width="300" height="120" class="violet"/>
  <text x="865" y="157" class="h">Shard</text>
  <text x="865" y="188" class="b">owns subset of data/traffic</text>

  <path d="M360,180 L450,180" class="arrow"/>
  <path d="M750,180 L840,180" class="arrow"/>

  <rect x="80" y="330" width="310" height="145" class="orange"/>
  <text x="105" y="366" class="h">Cache dependency</text>
  <text x="105" y="398" class="b">shard loss → misses</text>
  <text x="105" y="426" class="b">→ backend load / latency</text>
  <text x="105" y="454" class="b">load-test with/without cache</text>

  <rect x="445" y="330" width="310" height="145" class="green"/>
  <text x="470" y="366" class="h">Replicated shard</text>
  <text x="470" y="398" class="b">shard A → A1 + A2</text>
  <text x="470" y="426" class="b">failure tolerance</text>
  <text x="470" y="454" class="b">independent scale</text>

  <rect x="810" y="330" width="310" height="145" class="violet"/>
  <text x="835" y="366" class="h">Routing layer</text>
  <text x="835" y="398" class="b">local Ambassador</text>
  <text x="835" y="426" class="b">or shared twemproxy service</text>

  <rect x="120" y="570" width="420" height="130" class="blue"/>
  <text x="145" y="607" class="h">Consistent hashing</text>
  <text x="145" y="639" class="b">change shard count</text>
  <text x="145" y="667" class="b">→ minimize key remapping</text>

  <rect x="660" y="570" width="420" height="130" class="orange"/>
  <text x="685" y="607" class="h">Hot sharding</text>
  <text x="685" y="639" class="b">real traffic can be uneven</text>
  <text x="685" y="667" class="b">→ scale hot shard separately</text>

  <rect x="160" y="745" width="880" height="55" class="box"/>
  <text x="190" y="779" class="b">Main rule: partition by semantic key, replicate critical shards, minimize remapping, observe and scale hot shards.</text>

  <text x="45" y="827" class="small">Source cautions: port/formula/filename contradictions and PDF-extracted command/YAML issues are recorded separately.</text>
</svg>