<g fill="#ffffff" font-size="23" font-weight="700"><text x="55" y="214">01 · Выявить признаки проблемы (35–36)</text><text x="757" y="214">02 · Выбрать процесс (36–38)</text><text x="55" y="514">03 · Рамки, цели, сроки (38–39)</text><text x="757" y="514">04 · Состав команды (40–41)</text><text x="55" y="814">05 · Поставить задачу команде (41–42)</text></g>
<g fill="#263b55" font-size="19">
<text x="57" y="273">• Жалобы клиентов на качество товаров/услуг</text>
<text x="57" y="310">• Избыточная сложность процедур</text>
<text x="57" y="347">• Рост или разброс времени выполнения</text>
<text x="57" y="384">• Ошибки с первого раза; падение результата</text>
<text x="57" y="421">• Недовольство сотрудников и препятствия</text>
<text x="758" y="273">• Составить перечень процессов-кандидатов</text>
<text x="758" y="310">• Матрица критериев, баллы 1–5</text>
<text x="758" y="347">• Учитывать клиентов, вклад, эффект/затраты</text>
<text x="758" y="384">• Выбрать наибольший итоговый рейтинг</text>
<text x="758" y="421">• В примере Джо: 18 / 17 / 14 баллов</text>
<text x="57" y="573">• Обозначить, что изменится, а что — нет</text>
<text x="57" y="610">• Связать с целями фирмы и другими процессами</text>
<text x="57" y="647">• Сформулировать желаемый эффект в цифрах</text>
<text x="57" y="684">• Определить ключевые задачи и ориентиры</text>
<text x="57" y="721">• Установить приблизительный график работ</text>
<text x="758" y="573">• Менеджер проекта — сроки и координация</text>
<text x="758" y="610">• Ответственный за процесс — дальнейшее ведение</text>
<text x="758" y="647">• Пользователи — репрезентативная выборка</text>
<text x="758" y="684">• Скептик, ведущий, технологический эксперт</text>
<text x="758" y="721">• Состав зависит от конкретного проекта</text>
<text x="57" y="876">• Зафиксировать частоту встреч, ответственность, обмен информацией и работу с конфликтами</text>
<text x="57" y="918">• При необходимости согласовать участие руководителя, порядок и сроки отчётности</text>
</g>
<rect x="32" y="1015" width="1376" height="101" rx="17" fill="#dce9f9"/>
