<title id="title">Подробная памятка: этап 1 — планирование улучшения бизнес-процессов</title>
<desc id="desc">Развернутая карта пяти шагов с типовыми симптомами, матрицей приоритетов, целями, ролями и правилами команды, составленная по RAG PDF-страниц 35–42.</desc>
<rect width="1440" height="1150" fill="#f3f6fa"/>
<rect x="32" y="24" width="1376" height="118" rx="19" fill="#112a49"/>
<text x="62" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#ffffff" font-weight="700">Этап 1. Планирование улучшения бизнес-процессов</text>
<text x="62" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#cbdcf0">РAG-only · 5 шагов · PDF с. 33–42 · книга №0036</text>
<g font-family="DejaVu Sans,Arial,sans-serif">
<g fill="#ffffff" stroke="#ccdaeb" stroke-width="2">
