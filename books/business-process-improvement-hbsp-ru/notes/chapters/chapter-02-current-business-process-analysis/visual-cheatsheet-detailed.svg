<text x="50" y="283">• Данные обо всех операциях и частоте цикла</text>
<text x="50" y="320">• Начало и окончание, названия должностей</text>
<text x="50" y="357">• Макросхема: 2–7 основных элементов</text>
<text x="50" y="394">• Дорожки, действия, решения и стрелки</text>
<text x="50" y="431">• Пронумеровать операции и решения</text>
<text x="50" y="472">• Основа: PDF c. 45–48, 50–51</text>
<text x="756" y="283">• Где возникают прерывания и задержки?</text>
<text x="756" y="320">• Где участникам неудобно?</text>
<text x="756" y="357">• Где перерасход времени и денег?</text>
<text x="756" y="394">• Где результат неудовлетворителен?</text>
<text x="756" y="431">• Проверить выводы, не угадывать причины</text>
<text x="756" y="472">• Основа: PDF c. 48–50</text>
<text x="50" y="654">• Руководители, сотрудники, клиенты, поставщики</text>
<text x="50" y="693">• Что в процессе устроено удачно и неудачно?</text>
<text x="50" y="732">• Какие изменения предлагают участники?</text>
<text x="50" y="771">• Ожидания клиента и критерий «отлично»</text>
<text x="50" y="816">• Основа: PDF c. 51–52</text>
