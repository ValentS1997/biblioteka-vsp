<title id="title">Детальная карта этапа 6: дальнейшее улучшение бизнес-процессов</title>
<desc id="desc">Система показателей, четыре категории метрик из таблицы 5, приборная панель Джо из таблицы 6, решение о корректировках, пересмотр целей и границы безопасных изменений.</desc>
