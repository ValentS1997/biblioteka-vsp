<text x="53" y="1190" font-size="22" font-weight="700" fill="#1e486c">Источник и ограничения извлечения</text>
<text x="53" y="1231" font-size="18" fill="#365978">business-process-improvement-hbsp-ru:p0091:c01–p0097:c01</text>
<text x="53" y="1270" font-size="17" fill="#365978">Таблицы 5 и 6 разделены по страницам; точная графическая верстка не заявлена.</text>
