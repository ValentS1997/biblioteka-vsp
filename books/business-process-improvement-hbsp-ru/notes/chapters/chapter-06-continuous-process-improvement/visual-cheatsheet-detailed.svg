<g font-size="22" font-weight="700" fill="#ffffff">
<text x="53" y="222">01 · Показатели (табл. 5, 92–94)</text>
<text x="790" y="222">02 · Панель Джо (табл. 6, 94–95)</text>
<text x="53" y="589">03 · Реакция на отклонения (95–96)</text>
<text x="790" y="589">04 · Адаптация целей (96–97)</text>
</g>
<g font-size="19" fill="#294861">
<text x="53" y="294">• Качество: отказов оборудования за месяц</text>
<text x="53" y="337">• Время: недель на заполнение вакансии</text>
<text x="53" y="380">• Клиенты: звонков для решения обращения</text>
<text x="53" y="423">• Затраты: расходы на консультантов</text>
<text x="53" y="474">Данные: отчёты, HR, поддержка, опросы</text>
<text x="790" y="293">Среднее время заявки: цель 24 ч, факт 36 ч</text>
<text x="790" y="338">Полнота документов: цель 80%, факт 69%</text>
<text x="790" y="383">Без ответа: цель 0, факт 150 вопросов</text>
<text x="790" y="428">Ранее: 300 неотвеченных вопросов</text>
<text x="790" y="473">Числа относятся только к кейсу из книги</text>
<text x="53" y="662">• Сопоставить факт с целью</text>
<text x="53" y="707">• Разобраться в причинах и тенденциях</text>
<text x="53" y="752">• Можно исправлять или пока наблюдать</text>
<text x="53" y="797">• Идеи сначала владельцу процесса</text>
<text x="53" y="842">• Оценить влияние на другие подразделения</text>
<text x="790" y="662">• Мониторинг должен быть регулярным</text>
<text x="790" y="707">• Условия бизнеса меняют требования</text>
<text x="790" y="752">• У Джо новая цель по комплектности: 95%</text>
<text x="790" y="797">• Новая цель не равна достигнутому факту</text>
<text x="790" y="842">• Вернуться к измерению и сравнению</text>
</g>
<rect x="29" y="922" width="1442" height="185" rx="17" fill="#f8e9df"/>
<text x="53" y="965" font-size="23" font-weight="700" fill="#764a2d">Операционная граница</text>
<text x="53" y="1008" font-size="19" fill="#715034">Измерение — наблюдение. Пересмотр метрик и порядка работы — организационное изменение.</text>
<text x="53" y="1051" font-size="18" fill="#715034">Порог допуска, полномочия конкретной организации и rollback не описаны: [Needs confirmation].</text>
