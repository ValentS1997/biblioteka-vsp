<text x="47" y="448">Причины, сроки, цели</text>
<text x="331" y="448">Практика, симуляции</text>
<text x="615" y="448">Реальный ограниченный</text><text x="615" y="472">масштаб</text>
<text x="899" y="448">Данные и поддержка</text>
<text x="1183" y="448">Не возвращаться</text><text x="1183" y="472">к прежним методам</text>
</g>
<rect x="28" y="524" width="1404" height="110" rx="16" fill="#f8e8dc"/>
<text x="52" y="562" font-size="20" font-weight="700" fill="#704423">Риск: пилот затрагивает реальных клиентов; отказ от прежних материалов может быть необратим</text>
<text x="52" y="598" font-size="17" fill="#704423">Условия запуска, остановки, сохранения данных и rollback в главе не указаны: [Needs confirmation].</text>
