<text x="54" y="111" fill="#d3e5f7" font-size="19">RAG: PDF 79–88 · Инв. №0036</text>
<rect x="28" y="177" width="1404" height="116" rx="16" fill="#dce9f6"/>
<text x="52" y="216" font-size="22" font-weight="700" fill="#183b64">Подготовка: найти препятствия и получить поддержку</text>
<text x="52" y="254" font-size="19" fill="#2e5275">Сопротивление персонала · сопротивление руководителей · отсутствие влиятельного сторонника</text>
<g stroke="#c6d7e9" fill="#ffffff" stroke-width="2">
