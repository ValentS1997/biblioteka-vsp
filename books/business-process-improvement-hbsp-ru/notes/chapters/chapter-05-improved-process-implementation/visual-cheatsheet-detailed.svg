<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="54" y="76" font-size="32" fill="#ffffff" font-weight="700">Этап 5. Внедрение улучшенного бизнес-процесса</text>
<text x="54" y="114" font-size="19" fill="#d4e4f5">Подробная карта по RAG · PDF pp. 79–88 · книга №0036</text>
<g fill="#ffffff" stroke="#cbdbea" stroke-width="2">
