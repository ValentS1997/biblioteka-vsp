<g fill="#ffffff" font-weight="700" font-size="23">
<text x="54" y="225">1 · Препятствия · pp. 81–83</text>
<text x="794" y="225">2 · Поддержка изменений · pp. 84–86</text>
<text x="54" y="575">3 · Информирование и обучение · pp. 86–87</text>
<text x="794" y="575">4 · Пилот, внедрение и закрепление · 87–88</text>
</g>
<g fill="#2d4660" font-size="18">
<text x="54" y="295">• Персонал: страх, непонимание собственной выгоды</text>
<text x="54" y="340">• Руководители: конфликты и привычные методы</text>
<text x="54" y="385">• Спонсор: необходима видимая поддержка</text>
<text x="54" y="430">• Обсудить препятствия до запуска</text>
<text x="794" y="295">• Вовлекать заинтересованных лиц заранее</text>
<text x="794" y="340">• Слушать и записывать возражения</text>
<text x="794" y="385">• Менять процедуру, не обвинять сотрудников</text>
<text x="794" y="430">• Объяснять пользу, последствия и новые роли</text>
<text x="54" y="643">• Широко разъяснить причины и план перехода</text>
<text x="54" y="686">• Обучить новому порядку действий</text>
<text x="54" y="729">• Практикумы, ролевые игры, симуляции</text>
<text x="54" y="772">• Наблюдать трудности и помогать участникам</text>
<text x="54" y="815">• Подготовка предшествует рабочему переходу</text>
<text x="794" y="643">• Пилот только если нужны дополнительные проверки</text>
<text x="794" y="686">• Ограниченный реальный масштаб, наблюдение</text>
<text x="794" y="729">• Официальный запуск новой процедуры</text>
<text x="794" y="772">• Измерять результаты и поддерживать сотрудников</text>
<text x="794" y="815">• Отказаться от напоминаний о старом порядке</text>
</g>
<rect x="28" y="915" width="1444" height="213" rx="18" fill="#faeadc"/>
<text x="54" y="962" font-size="23" font-weight="700" fill="#7a491f">Граница безопасности внедрения</text>
<text x="54" y="1001" font-size="18" fill="#6b4b31">• Пилот более рискован, чем учебная проверка, поскольку затрагивает реальный бизнес (p. 87).</text>
<text x="54" y="1040" font-size="18" fill="#6b4b31">• Отказ от старых бланков и оборудования (p. 88) не сопровождается процедурой возврата.</text>
<text x="54" y="1079" font-size="18" fill="#6b4b31">• Пороги, авторизация, сохранение данных, stop criteria, rollback: [Needs confirmation].</text>
<rect x="28" y="1158" width="1444" height="101" rx="15" fill="#dce7f4"/>
<text x="54" y="1198" fill="#315674" font-size="18">RAG: business-process-improvement-hbsp-ru:p0081:c01–p0088:c01</text>
<text x="54" y="1231" fill="#315674" font-size="16">Таблица 4 разбита на pp. 82–83; полная верстка по текстовому слою не подтверждена.</text>
</g>
