<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="58" y="72" font-size="33" font-weight="700" fill="#ffffff">Этап 3. Редизайн бизнес-процесса</text>
<text x="58" y="111" font-size="20" fill="#cddff1">Подробная RAG-памятка · PDF 55–68 · Книга №0036</text>
<g fill="#ffffff" stroke="#c9d9eb" stroke-width="2">
