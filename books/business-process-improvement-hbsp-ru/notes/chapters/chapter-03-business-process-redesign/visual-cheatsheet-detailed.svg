<g fill="#ffffff" font-size="23" font-weight="700">
<text x="56" y="212">01 · Сформировать варианты · 57–61</text>
<text x="794" y="212">02 · Протестировать идеи · 61–63</text>
<text x="56" y="538">03 · Оценить последствия · 63–64</text>
<text x="794" y="538">04 · Документировать дизайн · 65</text>
<text x="56" y="864">05 · Получить отзывы и исправить · 65–68</text>
</g>
<g fill="#27435e" font-size="18">
<text x="54" y="277">• Письменные истории идеального процесса</text>
<text x="54" y="315">• Мозговой штурм, обсуждение и консенсус</text>
<text x="54" y="353">• Клиенты: удобство, точность, качество, скорость</text>
<text x="54" y="391">• Сокращение затрат и времени цикла</text>
<text x="54" y="429">• Метрики: клиент, качество, стоимость, время</text>
<text x="794" y="277">• Ролевые игры с реалистичными примерами</text>
<text x="794" y="315">• Практическое прохождение сценария</text>
<text x="794" y="353">• Компьютерное моделирование вариантов</text>
<text x="794" y="391">• Ищем сбои, координационные препятствия</text>
<text x="794" y="429">• Корректируем идеи до внедрения</text>
<text x="54" y="603">• Структура: новые роли и подчинение</text>
<text x="54" y="641">• Сотрудники: навыки, обучение, набор</text>
<text x="54" y="679">• Клиенты: связь и информирование</text>
<text x="54" y="717">• Системы: новые или изменённые решения</text>
<text x="54" y="755">• Таблица 3: четыре группы последствий</text>
<text x="794" y="603">• Подготовить будущую функциональную схему</text>
<text x="794" y="641">• Представить схему заинтересованным лицам</text>
<text x="794" y="679">• Детальное назначение задач пока отложить</text>
<text x="794" y="717">• Схема — проект, не производственный rollout</text>
<text x="794" y="755">• Запланировать проверку предложений</text>
<text x="54" y="932">• Руководитель и затрагиваемые участники: эффективность, риски, упущения, идеи</text>
<text x="54" y="971">• При необходимости корректировать проект и повторно обсуждать</text>
</g>
<rect x="30" y="1057" width="1440" height="183" rx="17" fill="#e0ebf9"/>
<text x="56" y="1094" font-size="20" font-weight="700" fill="#163d66">Граница безопасности: p. 68 — увеличение потока и скорости для поиска узких мест</text>
<text x="56" y="1127" font-size="18" fill="#315578">Это нагрузочное испытание. Пределы, критерии остановки и rollback в RAG не заданы:</text>
<text x="56" y="1160" font-size="18" fill="#315578">[Needs confirmation]. Не трактовать как инструкцию к нагрузке в production.</text>
