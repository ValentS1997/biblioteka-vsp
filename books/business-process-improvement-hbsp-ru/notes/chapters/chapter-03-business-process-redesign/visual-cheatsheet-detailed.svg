<title id="title">Редизайн бизнес-процесса — подробная схема этапа 3</title>
<desc id="desc">Пять стадий проектирования: генерация и обсуждение идей, тестирование сценариев, оценка организационных последствий, документирование, корректировка по отзывам. Отдельное предупреждение о нагрузке.</desc>
<rect width="1500" height="1280" fill="#f1f5fb"/>
