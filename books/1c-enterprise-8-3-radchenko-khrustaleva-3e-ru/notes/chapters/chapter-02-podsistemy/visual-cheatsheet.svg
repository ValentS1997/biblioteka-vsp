<text x="691" y="508" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold" fill="#24503d">Режим «1С:Предприятие»</text>
<text x="691" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#24503d">Настройки → Настройка панели разделов</text>
