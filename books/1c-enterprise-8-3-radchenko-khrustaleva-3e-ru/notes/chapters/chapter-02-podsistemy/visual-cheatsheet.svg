<rect x="35" y="363" width="1210" height="80" rx="12" fill="#fff1d9"/>
<text x="66" y="399" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#705024">«Главное» создаётся платформой и всегда идёт первым</text>
<text x="66" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#705024">Содержание остальных разделов пока пустое: прикладные объекты будут добавлены позже.</text>
