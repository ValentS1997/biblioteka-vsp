<text x="66" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#19375a">Командный интерфейс → Вверх / Вниз</text>
<text x="66" y="580" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#19375a">Порядок общий для всех пользователей</text>
