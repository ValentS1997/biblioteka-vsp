<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение В — помощь и поддержка</text>
<rect x="50" y="130" width="1100" height="180" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="175" font-family="sans-serif" font-size="24" font-weight="700">Before asking</text>
<text x="75" y="220" font-family="sans-serif" font-size="19">1. Что пытаюсь сделать?  2. Что уже сделал?  3. Что получил?</text>
<text x="75" y="260" font-family="sans-serif" font-size="19">Capture exact error + minimal relevant code.</text>
<rect x="50" y="360" width="520" height="210" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="405" font-family="sans-serif" font-size="24" font-weight="700">Self-debug</text>
<text x="75" y="450" font-family="sans-serif" font-size="18">rubber duck → retry → break</text>
<text x="75" y="485" font-family="sans-serif" font-size="18">reproduce and simplify</text>
<rect x="630" y="360" width="520" height="210" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="655" y="405" font-family="sans-serif" font-size="24" font-weight="700">Escalate intelligently</text>
<text x="655" y="450" font-family="sans-serif" font-size="18">search exact error → docs → community</text>
<text x="655" y="485" font-family="sans-serif" font-size="18">small reproducible example, specific question</text>
<text x="50" y="675" font-family="sans-serif" font-size="16">Named online resources are source-era; current availability: [Needs confirmation].</text>
</svg>
