<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="980" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение В — диагностический help flow</text>
<text x="50" y="105" font-family="sans-serif" font-size="18">RAG e0034:c01–c03 · EPUB spine 34</text>
<rect x="50" y="145" width="440" height="280" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="185" font-family="sans-serif" font-size="25" font-weight="700">1. Stabilize context</text>
<text x="75" y="230" font-family="sans-serif" font-size="18">Exact goal</text>
<text x="75" y="265" font-family="sans-serif" font-size="18">Exact steps already tried</text>
<text x="75" y="300" font-family="sans-serif" font-size="18">Exact result/error</text>
<text x="75" y="345" font-family="sans-serif" font-size="18">Often enough to spot own mistake</text>
<rect x="530" y="145" width="440" height="280" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="555" y="185" font-family="sans-serif" font-size="25" font-weight="700">2. Self-debug</text>
<text x="555" y="230" font-family="sans-serif" font-size="18">Rubber duck explanation</text>
<text x="555" y="265" font-family="sans-serif" font-size="18">Repeat steps from start</text>
<text x="555" y="300" font-family="sans-serif" font-size="18">Take a break after long stall</text>
<text x="555" y="345" font-family="sans-serif" font-size="18">Use book companion material</text>
<rect x="1010" y="145" width="440" height="280" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="1035" y="185" font-family="sans-serif" font-size="25" font-weight="700">3. Search</text>
<text x="1035" y="230" font-family="sans-serif" font-size="18">Specific query</text>
<text x="1035" y="265" font-family="sans-serif" font-size="18">Exact error text</text>
<text x="1035" y="300" font-family="sans-serif" font-size="18">Official docs / community results</text>
<text x="1035" y="345" font-family="sans-serif" font-size="18">Evaluate advice, especially blogs</text>
<rect x="50" y="485" width="680" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="525" font-family="sans-serif" font-size="25" font-weight="700">Good question contract</text>
<text x="75" y="570" font-family="sans-serif" font-size="18">• minimal problematic code</text>
<text x="75" y="605" font-family="sans-serif" font-size="18">• roughly 5–20 lines in source example</text>
<text x="75" y="640" font-family="sans-serif" font-size="18">• goal + attempts + exact output</text>
<text x="75" y="675" font-family="sans-serif" font-size="18">• no huge unexplained project dump</text>
<rect x="770" y="485" width="680" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="795" y="525" font-family="sans-serif" font-size="25" font-weight="700">Source resource classes</text>
<text x="795" y="570" font-family="sans-serif" font-size="18">Python/library official docs</text>
<text x="795" y="605" font-family="sans-serif" font-size="18">Q&amp;A / subreddit / Discord / Slack</text>
<text x="795" y="640" font-family="sans-serif" font-size="18">Blogs with caution</text>
<text x="795" y="690" font-family="sans-serif" font-size="18">Current resource status not verified externally.</text>
<text x="50" y="925" font-family="sans-serif" font-size="16">Source finding: Stack Overlow / stackoverlow.com typo preserved explicitly.</text>
</svg>
