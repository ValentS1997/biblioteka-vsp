<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение Д — troubleshooting deployment</text>
<rect x="50" y="130" width="520" height="220" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="175" font-family="sans-serif" font-size="24" font-weight="700">Diagnostic loop</text>
<text x="75" y="220" font-family="sans-serif" font-size="18">read output → locate failed stage</text>
<text x="75" y="255" font-family="sans-serif" font-size="18">first/last actionable error</text>
<text x="75" y="290" font-family="sans-serif" font-size="18">targeted fix → redeploy → verify</text>
<rect x="630" y="130" width="520" height="220" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="655" y="175" font-family="sans-serif" font-size="24" font-weight="700">Prerequisites</text>
<text x="655" y="220" font-family="sans-serif" font-size="18">curl + PHP + Git + Bash-like shell</text>
<text x="655" y="255" font-family="sans-serif" font-size="18">Windows: WSL / Git Bash</text>
<text x="655" y="290" font-family="sans-serif" font-size="18">macOS/Linux: install missing tools</text>
<rect x="50" y="410" width="1100" height="180" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="455" font-family="sans-serif" font-size="24" font-weight="700">Safety</text>
<text x="75" y="500" font-family="sans-serif" font-size="18">Do not run commands you do not understand from untrusted sources.</text>
<text x="75" y="540" font-family="sans-serif" font-size="18">Do not over-engineer hosting before traffic/requirements justify it.</text>
<text x="50" y="675" font-family="sans-serif" font-size="16">Platform/provider details are source-era and require current verification.</text>
</svg>
