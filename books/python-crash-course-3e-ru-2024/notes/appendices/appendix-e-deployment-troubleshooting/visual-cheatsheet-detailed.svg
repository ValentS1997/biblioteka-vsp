<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение Д — detailed deployment troubleshooting</text>
<text x="50" y="105" font-family="sans-serif" font-size="18">RAG e0036:c01–c06 · final EPUB spine item 36</text>
<rect x="50" y="145" width="440" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="185" font-family="sans-serif" font-size="25" font-weight="700">Deployment stages</text>
<text x="75" y="230" font-family="sans-serif" font-size="18">server → connection → code</text>
<text x="75" y="265" font-family="sans-serif" font-size="18">dependencies → database/migrations</text>
<text x="75" y="300" font-family="sans-serif" font-size="18">static files → app server → routing</text>
<text x="75" y="350" font-family="sans-serif" font-size="18">Find which stage failed.</text>
<rect x="530" y="145" width="440" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="555" y="185" font-family="sans-serif" font-size="25" font-weight="700">Log reading</text>
<text x="555" y="230" font-family="sans-serif" font-size="18">separate warnings from errors</text>
<text x="555" y="265" font-family="sans-serif" font-size="18">inspect first errors</text>
<text x="555" y="300" font-family="sans-serif" font-size="18">inspect last errors</text>
<text x="555" y="335" font-family="sans-serif" font-size="18">ignore cascade noise until root</text>
<text x="555" y="370" font-family="sans-serif" font-size="18">source example: gunicorrn typo</text>
<rect x="1010" y="145" width="440" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="1035" y="185" font-family="sans-serif" font-size="25" font-weight="700">Environment</text>
<text x="1035" y="230" font-family="sans-serif" font-size="18">CLI: curl + PHP + Git + Bash</text>
<text x="1035" y="265" font-family="sans-serif" font-size="18">Windows → WSL / Git Bash</text>
<text x="1035" y="300" font-family="sans-serif" font-size="18">macOS → PHP if absent</text>
<text x="1035" y="335" font-family="sans-serif" font-size="18">Linux → install missing tools</text>
<rect x="50" y="505" width="680" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="545" font-family="sans-serif" font-size="25" font-weight="700">Targeted recovery</text>
<text x="75" y="590" font-family="sans-serif" font-size="18">remote not linked → set project remote</text>
<text x="75" y="625" font-family="sans-serif" font-size="18">dependency typo → fix requirements</text>
<text x="75" y="660" font-family="sans-serif" font-size="18">missing tool → install prerequisite</text>
<text x="75" y="705" font-family="sans-serif" font-size="18">then redeploy and re-read output</text>
