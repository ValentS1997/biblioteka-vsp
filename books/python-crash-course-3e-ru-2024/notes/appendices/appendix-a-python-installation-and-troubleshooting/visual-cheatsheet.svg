<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение А — Python: установка и диагностика</text>
<rect x="50" y="130" width="330" height="220" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="175" font-family="sans-serif" font-size="24" font-weight="700">Windows</text>
<text x="75" y="220" font-family="sans-serif" font-size="18">python не найден → try py</text>
<text x="75" y="255" font-family="sans-serif" font-size="18">PATH → rerun/Modify installer</text>
<text x="75" y="290" font-family="sans-serif" font-size="18">new terminal → verify</text>
<rect x="435" y="130" width="330" height="220" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="460" y="175" font-family="sans-serif" font-size="24" font-weight="700">macOS</text>
<text x="460" y="220" font-family="sans-serif" font-size="18">official installer</text>
<text x="460" y="255" font-family="sans-serif" font-size="18">old system Python → python3</text>
<text x="460" y="290" font-family="sans-serif" font-size="18">verify actual interpreter</text>
<rect x="820" y="130" width="330" height="220" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="845" y="175" font-family="sans-serif" font-size="24" font-weight="700">Linux</text>
<text x="845" y="220" font-family="sans-serif" font-size="18">system Python baseline</text>
<text x="845" y="255" font-family="sans-serif" font-size="18">dev + pip + venv packages</text>
<text x="845" y="290" font-family="sans-serif" font-size="18">versioned interpreter example</text>
<rect x="50" y="410" width="1100" height="200" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="455" font-family="sans-serif" font-size="24" font-weight="700">Universal check</text>
<text x="75" y="500" font-family="monospace" font-size="21">python --version   /   python -V</text>
<text x="75" y="545" font-family="sans-serif" font-size="18">Keywords: forbidden as variable names · Built-ins: avoid shadowing</text>
<text x="50" y="675" font-family="sans-serif" font-size="16">Source-era versions/install methods require current verification.</text>
</svg>
