<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="980" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение А — подробная карта</text>
<text x="50" y="105" font-family="sans-serif" font-size="18">RAG e0032:c01–c03 · EPUB spine 32</text>
<rect x="50" y="145" width="430" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="185" font-family="sans-serif" font-size="25" font-weight="700">Windows path</text>
<text x="75" y="230" font-family="sans-serif" font-size="18">1. python fails / Store opens</text>
<text x="75" y="265" font-family="sans-serif" font-size="18">2. try py launcher</text>
<text x="75" y="300" font-family="sans-serif" font-size="18">3. if needed repair PATH</text>
<text x="75" y="335" font-family="sans-serif" font-size="18">4. close old terminals</text>
<text x="75" y="370" font-family="sans-serif" font-size="18">5. reopen + verify prompt</text>
<rect x="535" y="145" width="430" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="560" y="185" font-family="sans-serif" font-size="25" font-weight="700">macOS path</text>
<text x="560" y="230" font-family="sans-serif" font-size="18">official installer preferred</text>
<text x="560" y="265" font-family="sans-serif" font-size="18">developer-tools Python may differ</text>
<text x="560" y="300" font-family="sans-serif" font-size="18">older macOS: python may be Python 2</text>
<text x="560" y="335" font-family="sans-serif" font-size="18">use python3 for installed Python 3</text>
<rect x="1020" y="145" width="430" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="1045" y="185" font-family="sans-serif" font-size="25" font-weight="700">Linux path</text>
<text x="1045" y="230" font-family="sans-serif" font-size="18">check system Python</text>
<text x="1045" y="265" font-family="sans-serif" font-size="18">install dev/pip/venv packages</text>
<text x="1045" y="300" font-family="sans-serif" font-size="18">source example: Python 3.11</text>
<text x="1045" y="335" font-family="sans-serif" font-size="18">use versioned command consistently</text>
<rect x="50" y="500" width="670" height="310" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="540" font-family="sans-serif" font-size="25" font-weight="700">Verification</text>
<text x="75" y="585" font-family="monospace" font-size="20">python --version</text>
<text x="75" y="625" font-family="monospace" font-size="20">python -V</text>
<text x="75" y="675" font-family="sans-serif" font-size="18">Goal: know exactly which interpreter</text>
<text x="75" y="710" font-family="sans-serif" font-size="18">the command resolves to before</text>
<text x="75" y="745" font-family="sans-serif" font-size="18">installing packages or running projects.</text>
<rect x="780" y="500" width="670" height="310" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="805" y="540" font-family="sans-serif" font-size="25" font-weight="700">Name safety</text>
<text x="805" y="585" font-family="sans-serif" font-size="18">Python keywords → cannot be variables</text>
<text x="805" y="625" font-family="sans-serif" font-size="18">Built-in names → can be shadowed</text>
<text x="805" y="675" font-family="sans-serif" font-size="18">Source recommendation:</text>
<text x="825" y="710" font-family="sans-serif" font-size="18">avoid both categories for your names</text>
<text x="50" y="925" font-family="sans-serif" font-size="16">Current OS/Python version guidance: [Needs confirmation]. External docs not used.</text>
</svg>
