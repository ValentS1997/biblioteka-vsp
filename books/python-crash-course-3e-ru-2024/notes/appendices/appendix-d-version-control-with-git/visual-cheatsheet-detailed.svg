<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="980" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение Г — Git workflow and recovery boundaries</text>
<text x="50" y="105" font-family="sans-serif" font-size="18">RAG e0035:c01–c05 · EPUB spine 35</text>
<rect x="50" y="145" width="440" height="290" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="185" font-family="sans-serif" font-size="25" font-weight="700">Setup</text>
<text x="75" y="230" font-family="sans-serif" font-size="18">git --version</text>
<text x="75" y="265" font-family="sans-serif" font-size="18">user.name + user.email</text>
<text x="75" y="300" font-family="sans-serif" font-size="18">default branch = main</text>
<text x="75" y="335" font-family="sans-serif" font-size="18">.gitignore generated files</text>
<text x="75" y="370" font-family="sans-serif" font-size="18">git init</text>
<rect x="530" y="145" width="440" height="290" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="555" y="185" font-family="sans-serif" font-size="25" font-weight="700">Snapshot cycle</text>
<text x="555" y="230" font-family="sans-serif" font-size="18">status → stage new files</text>
<text x="555" y="265" font-family="sans-serif" font-size="18">commit with message</text>
<text x="555" y="300" font-family="sans-serif" font-size="18">status = clean</text>
<text x="555" y="335" font-family="sans-serif" font-size="18">log → commit IDs + messages</text>
<text x="555" y="370" font-family="sans-serif" font-size="18">repeat after tested change</text>
<rect x="1010" y="145" width="440" height="290" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="1035" y="185" font-family="sans-serif" font-size="25" font-weight="700">Normal rollback</text>
<text x="1035" y="230" font-family="sans-serif" font-size="18">restore → discard uncommitted edits</text>
<text x="1035" y="265" font-family="sans-serif" font-size="18">checkout old commit → detached HEAD</text>
<text x="1035" y="300" font-family="sans-serif" font-size="18">switch - → return to branch</text>
<text x="1035" y="350" font-family="sans-serif" font-size="18">Always verify status/log first.</text>
<rect x="50" y="500" width="680" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="540" font-family="sans-serif" font-size="25" font-weight="700">High-risk path</text>
<text x="75" y="585" font-family="sans-serif" font-size="18">hard reset to old commit</text>
<text x="75" y="620" font-family="sans-serif" font-size="18">→ discards current branch state</text>
<text x="75" y="665" font-family="sans-serif" font-size="18">remove .git + re-init</text>
<text x="75" y="700" font-family="sans-serif" font-size="18">→ destroys all repository history metadata</text>
<text x="75" y="745" font-family="sans-serif" font-size="18">Not routine recovery for shared repositories.</text>
<rect x="770" y="500" width="680" height="300" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="795" y="540" font-family="sans-serif" font-size="25" font-weight="700">Acceptance checkpoints</text>
<text x="795" y="585" font-family="sans-serif" font-size="18">Correct branch</text>
<text x="795" y="620" font-family="sans-serif" font-size="18">Known intended commit ID</text>
<text x="795" y="655" font-family="sans-serif" font-size="18">working tree state understood</text>
<text x="795" y="690" font-family="sans-serif" font-size="18">clean status after successful snapshot</text>
<text x="795" y="725" font-family="sans-serif" font-size="18">recovery scope matches intended loss</text>
<text x="50" y="925" font-family="sans-serif" font-size="16">Source finding: “password” wording conflicts with shown user.email configuration.</text>
</svg>
