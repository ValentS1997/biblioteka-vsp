<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="700">Приложение Г — Git: безопасный baseline</text>
<rect x="50" y="130" width="520" height="210" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="175" font-family="sans-serif" font-size="24" font-weight="700">Normal loop</text>
<text x="75" y="220" font-family="monospace" font-size="18">status → add → commit → status</text>
<text x="75" y="255" font-family="monospace" font-size="18">log --pretty=oneline</text>
<text x="75" y="295" font-family="sans-serif" font-size="18">Target: clean working tree</text>
<rect x="630" y="130" width="520" height="210" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="655" y="175" font-family="sans-serif" font-size="24" font-weight="700">Rollback ladder</text>
<text x="655" y="220" font-family="sans-serif" font-size="18">restore → uncommitted changes</text>
<text x="655" y="255" font-family="sans-serif" font-size="18">checkout/switch → inspect old commit</text>
<text x="655" y="295" font-family="sans-serif" font-size="18">hard reset / re-init → HIGH RISK</text>
<rect x="50" y="390" width="1100" height="170" rx="18" fill="#f4f4f4" stroke="#222"/>
<text x="75" y="435" font-family="sans-serif" font-size="24" font-weight="700">Rule</text>
<text x="75" y="480" font-family="sans-serif" font-size="19">Commit known-good states. Inspect status before changes and before destructive recovery.</text>
<text x="50" y="675" font-family="sans-serif" font-size="16">Source workflow is single-developer learning Git, not a shared-repository recovery policy.</text>
</svg>
