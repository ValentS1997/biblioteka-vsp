<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Первые шаги: подробная шпаргалка</title>
  <desc id="desc">Подробная карта подготовки среды Python для Windows, macOS и Linux, VS Code, запуска программы и устранения ошибок.</desc>
  <rect width="1800" height="1200" fill="#f5f7fa"/>
  <rect width="1800" height="116" fill="#17202a"/>
  <text x="56" y="50" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Глава 1 — Первые шаги</text>
  <text x="56" y="86" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Проверяемая цепочка: Python → редактор → программа → результат → troubleshooting</text>

  <rect x="45" y="150" width="540" height="285" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="75" y="195" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1b4f72">Windows</text>
  <text x="75" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="75" dy="0">Проверка: python</tspan>
    <tspan x="75" dy="32">Если нет / версия ниже 3.9: installer с python.org</tspan>
    <tspan x="75" dy="32">При установке: Add Python to PATH</tspan>
    <tspan x="75" dy="32">VS Code: installer с code.visualstudio.com</tspan>
    <tspan x="75" dy="32">Выход из Python: Ctrl+Z, Enter или exit()</tspan>
    <tspan x="75" dy="32">Запуск файла: python hello_world.py</tspan>
  </text>

  <rect x="630" y="150" width="540" height="285" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="660" y="195" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#196f3d">macOS</text>
  <text x="660" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="660" dy="0">Проверка: python3</tspan>
    <tspan x="660" dy="32">Книга предупреждает о старом Python 2 в старых ОС</tspan>
    <tspan x="660" dy="32">Installer с python.org при необходимости</tspan>
    <tspan x="660" dy="32">После установки: Install Certificates.command</tspan>
    <tspan x="660" dy="32">Выход из Python: Ctrl+D или exit()</tspan>
    <tspan x="660" dy="32">Запуск файла: python3 hello_world.py</tspan>
  </text>

  <rect x="1215" y="150" width="540" height="285" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1245" y="195" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#9c640c">Linux</text>
  <text x="1245" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1245" dy="0">Проверка: python3</tspan>
    <tspan x="1245" dy="32">Python часто уже установлен</tspan>
    <tspan x="1245" dy="32">Требование книги: версия не ниже 3.9</tspan>
    <tspan x="1245" dy="32">Ubuntu: VS Code через Ubuntu Software Center</tspan>
    <tspan x="1245" dy="32">Выход из Python: Ctrl+D или exit()</tspan>
    <tspan x="1245" dy="32">Запуск файла: python3 hello_world.py</tspan>
  </text>

  <rect x="45" y="475" width="825" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="75" y="520" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#6c3483">VS Code + первая программа</text>
  <text x="75" y="563" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="75" dy="0">1. Установить Python extension от Microsoft.</tspan>
    <tspan x="75" dy="32">2. Создать каталог python_work.</tspan>
    <tspan x="75" dy="32">3. Создать hello_world.py.</tspan>
    <tspan x="75" dy="32">4. Код: print("Hello Python world!")</tspan>
    <tspan x="75" dy="32">5. Run → Run Without Debugging.</tspan>
    <tspan x="75" dy="32">6. Acceptance: Hello Python world!</tspan>
  </text>

  <rect x="915" y="475" width="840" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="945" y="520" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#922b21">Troubleshooting</text>
  <text x="945" y="563" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="945" dy="0">Traceback: сначала прочитать сообщение Python.</tspan>
    <tspan x="945" dy="32">Проверить точный синтаксис.</tspan>
    <tspan x="945" dy="32">Типовые подсказки главы: регистр print, кавычки, скобки.</tspan>
    <tspan x="945" dy="32">Если зашли в тупик: сделать паузу и проверить шаги снова.</tspan>
    <tspan x="945" dy="32">При необходимости удалить hello_world.py и создать заново.</tspan>
    <tspan x="945" dy="32">Внешние ресурсы из главы здесь не использовались.</tspan>
  </text>

  <rect x="45" y="800" width="825" height="260" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="75" y="845" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#21618c">Терминал: сохранённая программа</text>
  <text x="75" y="888" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Windows:</tspan>
    <tspan x="105" dy="30">cd Desktop\python_work</tspan>
    <tspan x="105" dy="30">dir</tspan>
    <tspan x="105" dy="30">python hello_world.py</tspan>
    <tspan x="445" dy="-90">macOS / Linux:</tspan>
    <tspan x="475" dy="30">cd Desktop/python_work/</tspan>
    <tspan x="475" dy="30">ls</tspan>
    <tspan x="475" dy="30">python3 hello_world.py</tspan>
  </text>

  <rect x="915" y="800" width="840" height="260" rx="18" fill="#ffffff" stroke="#58d68d" stroke-width="2"/>
  <text x="945" y="845" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e8449">Упражнения и границы</text>
  <text x="945" y="888" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="945" dy="0">1.1 — самостоятельный обзор python.org.</tspan>
    <tspan x="945" dy="30">1.2 — опечатки с ошибкой и без ошибки.</tspan>
    <tspan x="945" dy="30">1.3 — три личные идеи будущих программ.</tspan>
    <tspan x="945" dy="42">RAG-only: внешнее содержимое и личные ответы не выдумываются.</tspan>
    <tspan x="945" dy="30">EPUB: e0010:c01–c07, spine item 10.</tspan>
    <tspan x="945" dy="30">Следующий unit e0011 открывает главу 2.</tspan>
  </text>

  <rect x="45" y="1100" width="1710" height="62" rx="14" fill="#17202a"/>
  <text x="75" y="1139" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Принцип: не переходить к следующим темам, пока минимальная цепочка hello_world.py не даёт ожидаемый результат.</text>
</svg>