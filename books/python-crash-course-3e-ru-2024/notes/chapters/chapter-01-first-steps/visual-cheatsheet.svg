<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Первые шаги: компактная шпаргалка</title>
  <desc id="desc">Подготовка Python, VS Code, hello_world.py, проверка и troubleshooting.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="110" fill="#17202a"/>
  <text x="55" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Первые шаги</text>
  <text x="55" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Python → VS Code → hello_world.py → проверка → исправление</text>

  <rect x="50" y="145" width="470" height="250" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">1. Проверить Python</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#273746">
    <tspan x="78" dy="0">Windows: python</tspan>
    <tspan x="78" dy="34">macOS / Linux: python3</tspan>
    <tspan x="78" dy="34">Книга: Python 3.9+</tspan>
    <tspan x="78" dy="34">Признак готовности: приглашение &gt;&gt;&gt;</tspan>
  </text>

  <rect x="565" y="145" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">2. Настроить редактор</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#273746">
    <tspan x="593" dy="0">VS Code</tspan>
    <tspan x="593" dy="34">Python extension от Microsoft</tspan>
    <tspan x="593" dy="34">Каталог: python_work</tspan>
    <tspan x="593" dy="34">Файл: hello_world.py</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">3. Минимальный тест</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">print("Hello Python world!")</tspan>
    <tspan x="1108" dy="34">Run Without Debugging</tspan>
    <tspan x="1108" dy="34">Ожидаемый вывод:</tspan>
    <tspan x="1108" dy="34" font-weight="700">Hello Python world!</tspan>
  </text>

  <rect x="50" y="435" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="478" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Если не работает</text>
  <text x="78" y="522" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#273746">
    <tspan x="78" dy="0">1. Читать traceback.</tspan>
    <tspan x="78" dy="34">2. Проверить регистр print.</tspan>
    <tspan x="78" dy="34">3. Проверить кавычки и парные скобки.</tspan>
    <tspan x="78" dy="34">4. При необходимости создать hello_world.py заново.</tspan>
    <tspan x="78" dy="34">5. Повторить минимальный запуск.</tspan>
  </text>

  <rect x="815" y="435" width="735" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="478" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Запуск из терминала</text>
  <text x="843" y="522" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="843" dy="0">Windows:</tspan>
    <tspan x="875" dy="31">cd Desktop\python_work → dir → python hello_world.py</tspan>
    <tspan x="843" dy="43">macOS / Linux:</tspan>
    <tspan x="875" dy="31">cd Desktop/python_work/ → ls → python3 hello_world.py</tspan>
  </text>

  <rect x="50" y="760" width="1500" height="92" rx="15" fill="#17202a"/>
  <text x="78" y="800" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Acceptance: интерпретатор доступен → файл найден → hello_world.py запускается → ожидаемый текст получен.</text>
  <text x="78" y="832" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#d6e4f0">RAG: e0010:c01–c07 · EPUB spine 10 · printed/PDF pages не используются.</text>
</svg>