<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 9 — Классы</title>
  <desc id="desc">Классы, экземпляры, атрибуты, методы, наследование, композиция и импорты.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">Глава 9 — Классы</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">class → instance → state → behavior → reuse</text>

  <rect x="50" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Основы</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">class → описание категории</tspan>
    <tspan x="78" dy="34">instance → конкретный объект</tspan>
    <tspan x="78" dy="34">__init__() + self</tspan>
    <tspan x="78" dy="34">attributes + methods</tspan>
  </text>

  <rect x="565" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Mutation</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">instance.attr = value</tspan>
    <tspan x="593" dy="34">update_method(value)</tspan>
    <tspan x="593" dy="34">increment_method(delta)</tspan>
    <tspan x="593" dy="34">method validation ≠ security boundary</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Reuse</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">inheritance → specialization</tspan>
    <tspan x="1108" dy="34">super().__init__()</tspan>
    <tspan x="1108" dy="34">override parent method</tspan>
    <tspan x="1108" dy="34">composition → object as attribute</tspan>
  </text>

  <rect x="50" y="445" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Modules / standard library</text>
  <text x="78" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">from car import Car</tspan>
    <tspan x="78" dy="34">import car → car.Car()</tspan>
    <tspan x="78" dy="34">aliases поддерживаются</tspan>
    <tspan x="78" dy="34">random: randint() / choice()</tspan>
  </text>

  <rect x="815" y="445" width="735" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Source findings</text>
  <text x="843" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="843" dy="0">self.make ↔ self.manufacturer</tspan>
    <tspan x="843" dy="34">malformed docstring in inheritance example</tspan>
    <tspan x="843" dy="34">about ↔ approximately in range output</tspan>
    <tspan x="843" dy="34">c02–c15 boundary clipping</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Provenance: e0018:c01–c15 · EPUB spine 18 · OEBPS/Text/978544614112-15.xhtml</text>
</svg>