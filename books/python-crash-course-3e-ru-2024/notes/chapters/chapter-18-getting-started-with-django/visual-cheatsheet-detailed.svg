<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200">
<rect width="1800" height="1200" fill="#f5f7fa"/><rect width="1800" height="115" fill="#17202a"/>
<text x="55" y="50" font-family="Arial" font-size="38" font-weight="700" fill="white">Глава 18 — Знакомство с Django</text>
<text x="55" y="85" font-family="Arial" font-size="20" fill="#d6e4f0">project bootstrap, relational models, migrations, admin, ORM and request routing</text>
<g font-family="Arial" fill="#273746">
<rect x="45" y="150" width="540" height="300" rx="18" fill="white" stroke="#5dade2" stroke-width="2"/>
<text x="75" y="195" font-size="25" font-weight="700">Bootstrap</text><text x="75" y="240" font-size="18">Create and activate isolated venv.</text><text x="75" y="273" font-size="18">Install Django in active environment.</text><text x="75" y="306" font-size="18">startproject with trailing dot.</text><text x="75" y="339" font-size="18">migrate creates initial SQLite state.</text>
<rect x="630" y="150" width="540" height="300" rx="18" fill="white" stroke="#7dcea0" stroke-width="2"/>
<text x="660" y="195" font-size="25" font-weight="700">Models / migration</text><text x="660" y="240" font-size="18">Topic: CharField + DateTimeField.</text><text x="660" y="273" font-size="18">Entry: ForeignKey + TextField.</text><text x="660" y="306" font-size="18">CASCADE removes dependent entries.</text><text x="660" y="339" font-size="18">edit → makemigrations → migrate.</text>
<rect x="1215" y="150" width="540" height="300" rx="18" fill="white" stroke="#f5b041" stroke-width="2"/>
<text x="1245" y="195" font-size="25" font-weight="700">Admin / shell</text><text x="1245" y="240" font-size="18">createsuperuser grants full site privileges.</text><text x="1245" y="273" font-size="18">Register Topic/Entry in admin.py.</text><text x="1245" y="306" font-size="18">Shell validates ORM queries quickly.</text><text x="1245" y="339" font-size="18">Reverse relation uses entry_set.</text>
<rect x="45" y="495" width="825" height="300" rx="18" fill="white" stroke="#af7ac5" stroke-width="2"/>
<text x="75" y="540" font-size="25" font-weight="700">URL → view → template</text><text x="75" y="585" font-size="18">Project urls.py includes app URLs.</text><text x="75" y="618" font-size="18">App path() maps names to views.</text><text x="75" y="651" font-size="18">Views query data and create context.</text><text x="75" y="684" font-size="18">Templates render variables, loops and filters.</text><text x="75" y="717" font-size="18">Named URLs avoid hard-coded links.</text>
<rect x="915" y="495" width="840" height="300" rx="18" fill="white" stroke="#ec7063" stroke-width="2"/>
<text x="945" y="540" font-size="25" font-weight="700">Template inheritance</text><text x="945" y="585" font-size="18">base.html stores shared navigation.</text><text x="945" y="618" font-size="18">extends chooses parent template.</text><text x="945" y="651" font-size="18">block/endblock define replaceable regions.</text><text x="945" y="684" font-size="18">for/empty render collections safely.</text><text x="945" y="717" font-size="18">topic detail adds date/linebreak filters.</text>
<rect x="45" y="840" width="1710" height="270" rx="18" fill="white" stroke="#58d68d" stroke-width="2"/>
<text x="75" y="885" font-size="25" font-weight="700">Exercises / quality boundary</text>
<text x="75" y="930" font-size="18">18.1–18.8 cover repeated project bootstrap, Entry formatting, query docs, Pizzeria, Meal Planner and linked detail pages.</text>
<text x="75" y="965" font-size="18">External Django docs were not opened in rag_only; current Django/Python compatibility remains unverified.</text>
<text x="75" y="1000" font-size="18">Findings include command, argument, URL, docs-version, terminology and date-format mismatches.</text>
<text x="75" y="1035" font-size="18">e0028:c02–c18 also show legacy chunk-boundary clipping/overlap.</text>
</g>
<rect x="45" y="1140" width="1710" height="40" rx="12" fill="#17202a"/>
<text x="75" y="1167" font-family="Arial" font-size="18" font-weight="700" fill="white">Provenance: e0028:c01–c18 · EPUB spine 28 · OEBPS/Text/978544614112-25.xhtml</text>
</svg>