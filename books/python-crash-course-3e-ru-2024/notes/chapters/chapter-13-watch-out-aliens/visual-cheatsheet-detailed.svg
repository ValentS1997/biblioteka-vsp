<text x="75" y="195" font-size="25" font-weight="700">Create fleet</text><text x="75" y="240" font-size="18">Alien.rect.size → width/height</text><text x="75" y="273" font-size="18">nested while loops → rows</text><text x="75" y="306" font-size="18">_create_alien(x, y)</text><text x="75" y="339" font-size="18">Group stores fleet sprites</text>
<rect x="630" y="150" width="540" height="300" rx="18" fill="white" stroke="#7dcea0" stroke-width="2"/>
<text x="660" y="195" font-size="25" font-weight="700">Move fleet</text><text x="660" y="240" font-size="18">alien_speed × fleet_direction</text><text x="660" y="273" font-size="18">check_edges() detects both sides</text><text x="660" y="306" font-size="18">drop every alien on edge</text><text x="660" y="339" font-size="18">invert direction once</text>
<rect x="1215" y="150" width="540" height="300" rx="18" fill="white" stroke="#f5b041" stroke-width="2"/>
<text x="1245" y="195" font-size="25" font-weight="700">Collision lifecycle</text><text x="1245" y="240" font-size="18">groupcollide(bullets, aliens,...)</text><text x="1245" y="273" font-size="18">empty fleet → bullets.empty()</text><text x="1245" y="306" font-size="18">then _create_fleet()</text><text x="1245" y="339" font-size="18">temporary wide bullets aid testing</text>
<rect x="45" y="495" width="825" height="300" rx="18" fill="white" stroke="#af7ac5" stroke-width="2"/>
<text x="75" y="540" font-size="25" font-weight="700">Ship loss / game over</text><text x="75" y="585" font-size="18">spritecollideany() or alien reaches bottom</text><text x="75" y="618" font-size="18">_ship_hit() → decrement ships_left</text><text x="75" y="651" font-size="18">clear groups → new fleet → center ship</text><text x="75" y="684" font-size="18">sleep(0.5) → feedback pause</text><text x="75" y="717" font-size="18">no ships → game_active = False</text>
