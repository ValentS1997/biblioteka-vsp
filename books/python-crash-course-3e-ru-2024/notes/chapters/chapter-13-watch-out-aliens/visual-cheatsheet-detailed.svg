<text x="55" y="50" font-family="Arial" font-size="38" font-weight="700" fill="white">Глава 13 — Осторожно, пришельцы!</text>
<text x="55" y="85" font-family="Arial" font-size="20" fill="#d6e4f0">grid generation, fleet state, collisions and terminal gameplay state</text>
