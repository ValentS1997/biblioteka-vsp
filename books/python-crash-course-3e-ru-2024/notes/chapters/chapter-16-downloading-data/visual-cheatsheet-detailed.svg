<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200">
<rect width="1800" height="1200" fill="#f5f7fa"/><rect width="1800" height="115" fill="#17202a"/>
<text x="55" y="50" font-family="Arial" font-size="38" font-weight="700" fill="white">Глава 16 — Загрузка данных</text>
<text x="55" y="85" font-family="Arial" font-size="20" fill="#d6e4f0">real datasets, schema inspection, missing-data handling and geographic visualization</text>
<g font-family="Arial" fill="#273746">
<rect x="45" y="150" width="540" height="300" rx="18" fill="white" stroke="#5dade2" stroke-width="2"/>
<text x="75" y="195" font-size="25" font-weight="700">CSV inspection</text><text x="75" y="240" font-size="18">Read text → splitlines → csv.reader.</text><text x="75" y="273" font-size="18">next(reader) consumes header.</text><text x="75" y="306" font-size="18">enumerate() reveals column indexes.</text><text x="75" y="339" font-size="18">Different stations can use different layouts.</text>
<rect x="630" y="150" width="540" height="300" rx="18" fill="white" stroke="#7dcea0" stroke-width="2"/>
<text x="660" y="195" font-size="25" font-weight="700">Weather quality</text><text x="660" y="240" font-size="18">Parse DATE with strptime().</text><text x="660" y="273" font-size="18">Convert TMAX/TMIN to integers.</text><text x="660" y="306" font-size="18">ValueError marks missing numeric values.</text><text x="660" y="339" font-size="18">Append only complete synchronized records.</text>
<rect x="1215" y="150" width="540" height="300" rx="18" fill="white" stroke="#f5b041" stroke-width="2"/>
<text x="1245" y="195" font-size="25" font-weight="700">Weather visualization</text><text x="1245" y="240" font-size="18">Plot highs and lows together.</text><text x="1245" y="273" font-size="18">fill_between() exposes daily range.</text><text x="1245" y="306" font-size="18">autofmt_xdate() improves date labels.</text><text x="1245" y="339" font-size="18">Use same Y scale for direct comparisons.</text>
<rect x="45" y="495" width="825" height="300" rx="18" fill="white" stroke="#af7ac5" stroke-width="2"/>
<text x="75" y="540" font-size="25" font-weight="700">GeoJSON extraction</text><text x="75" y="585" font-size="18">json.loads() → one Python dictionary.</text><text x="75" y="618" font-size="18">features → list of earthquake dictionaries.</text><text x="75" y="651" font-size="18">properties.mag/title + geometry.coordinates.</text><text x="75" y="684" font-size="18">GeoJSON order: longitude, latitude.</text><text x="75" y="717" font-size="18">Readable copy uses json.dumps(indent=4).</text>
<rect x="915" y="495" width="840" height="300" rx="18" fill="white" stroke="#ec7063" stroke-width="2"/>
<text x="945" y="540" font-size="25" font-weight="700">Plotly world map</text><text x="945" y="585" font-size="18">scatter_geo(lat, lon) creates base map.</text><text x="945" y="618" font-size="18">size and color encode magnitude.</text><text x="945" y="651" font-size="18">Viridis + natural earth tune presentation.</text><text x="945" y="684" font-size="18">hover_name adds earthquake description.</text><text x="945" y="717" font-size="18">Current external data remains unverified.</text>
<rect x="45" y="840" width="1710" height="270" rx="18" fill="white" stroke="#58d68d" stroke-width="2"/>
<text x="75" y="885" font-size="25" font-weight="700">Exercises / quality boundary</text>
<text x="75" y="930" font-size="18">16.1–16.5 extend weather extraction; 16.6–16.9 refactor/map external datasets.</text>
<text x="75" y="965" font-size="18">External NOAA/USGS/NASA/supplemental files were not fetched in rag_only mode.</text>
<text x="75" y="1000" font-size="18">Findings: intro scope mismatch, argument naming, dataset-description mismatch, filename/extension and variable-name mismatches.</text>
<text x="75" y="1035" font-size="18">e0026:c02–c13 also show legacy chunk-boundary clipping/overlap.</text>
</g>
<rect x="45" y="1140" width="1710" height="40" rx="12" fill="#17202a"/>
<text x="75" y="1167" font-family="Arial" font-size="18" font-weight="700" fill="white">Provenance: e0026:c01–c13 · EPUB spine 26 · OEBPS/Text/978544614112-23.xhtml</text>
</svg>