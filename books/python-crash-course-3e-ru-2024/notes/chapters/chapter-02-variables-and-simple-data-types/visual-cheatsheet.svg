<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Переменные и простые типы данных</title>
  <desc id="desc">Переменные, строки, числа, ошибки, комментарии и принципы простоты.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffffff">Глава 2 — Переменные и простые типы данных</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">значение → имя → операция → вывод → проверка</text>

  <rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Переменные</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">message = "..."</tspan>
    <tspan x="78" dy="34">Повторное присваивание меняет значение.</tspan>
    <tspan x="78" dy="34">Имена: буквы, цифры, _, не с цифры.</tspan>
    <tspan x="78" dy="34">Traceback помогает найти NameError.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Строки</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">title / upper / lower</tspan>
    <tspan x="593" dy="34">f-строки: f"{name}"</tspan>
    <tspan x="593" dy="34">\t и \n для форматирования</tspan>
    <tspan x="593" dy="34">strip / removeprefix / removesuffix</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Числа</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">+  -  *  /  **</tspan>
    <tspan x="1108" dy="34">/ возвращает float.</tspan>
    <tspan x="1108" dy="34">float может показывать лишние разряды.</tspan>
    <tspan x="1108" dy="34">1_000 и multiple assignment.</tspan>
  </text>

  <rect x="50" y="450" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="493" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Диагностика</text>
  <text x="78" y="536" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">NameError → проверить имя и присваивание.</tspan>
    <tspan x="78" dy="34">SyntaxError → проверить кавычки и границы строки.</tspan>
    <tspan x="78" dy="34">Подсветка синтаксиса — ранний визуальный сигнал.</tspan>
    <tspan x="78" dy="34">Сравнивать фактический вывод с ожидаемым.</tspan>
  </text>

  <rect x="815" y="450" width="735" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="493" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Комментарии и Zen</text>
  <text x="843" y="536" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="843" dy="0"># поясняет намерение и решение.</tspan>
    <tspan x="843" dy="34">Простое лучше сложного.</tspan>
    <tspan x="843" dy="34">Удобочитаемость имеет значение.</tspan>
    <tspan x="843" dy="34">Работающий код важнее бесконечной полировки.</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">RAG: e0011:c01–c10 · EPUB spine 11 · source findings сохранены отдельно, без молчаливых исправлений.</text>
</svg>