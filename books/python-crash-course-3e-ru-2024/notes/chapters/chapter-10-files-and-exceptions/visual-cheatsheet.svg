<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 10 — Файлы и исключения</title>
  <desc id="desc">Path, чтение и запись файлов, исключения, JSON и persistence.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">Глава 10 — Файлы и исключения</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Path → read/write → try/except → JSON persistence</text>

  <rect x="50" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Чтение</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Path('file.txt')</tspan>
    <tspan x="78" dy="34">read_text() → string</tspan>
    <tspan x="78" dy="34">splitlines() → lines</tspan>
    <tspan x="78" dy="34">relative / absolute paths</tspan>
  </text>

  <rect x="565" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Запись</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">write_text(contents)</tspan>
    <tspan x="593" dy="34">создаёт target при отсутствии</tspan>
    <tspan x="593" dy="34">существующий target перезаписывается</tspan>
    <tspan x="593" dy="34">после write → read-back check</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Exceptions</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">try → risky operation</tspan>
    <tspan x="1108" dy="34">except → expected failure</tspan>
    <tspan x="1108" dy="34">else → success-dependent code</tspan>
    <tspan x="1108" dy="34">pass → intentional silent handling</tspan>
  </text>

  <rect x="50" y="445" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Persistence</text>
  <text x="78" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">json.dumps(data) → JSON string</tspan>
    <tspan x="78" dy="34">write_text() → persistent file</tspan>
    <tspan x="78" dy="34">read_text() → json.loads()</tspan>
    <tspan x="78" dy="34">Path.exists() → first/repeat run branch</tspan>
  </text>

  <rect x="815" y="445" width="735" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Source findings</text>
  <text x="843" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="843" dy="0">count_words docstring ↔ implementation</tspan>
    <tspan x="843" dy="34">10.7 / 10.9 cross-reference mismatches</tspan>
    <tspan x="843" dy="34">json.dumps prose ↔ shown code</tspan>
    <tspan x="843" dy="34">c02–c15 boundary clipping</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Provenance: e0019:c01–c15 · EPUB spine 19 · OEBPS/Text/978544614112-16.xhtml</text>
</svg>