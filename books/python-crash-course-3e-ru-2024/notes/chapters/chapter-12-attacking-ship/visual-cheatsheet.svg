<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 12 — Атакующий корабль</title>
  <desc id="desc">Pygame game loop, ship movement, bullets, cleanup and refactoring.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">Глава 12 — Атакующий корабль</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">events → state → cleanup → render → tick</text>

  <rect x="50" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Game loop</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">_check_events()</tspan>
    <tspan x="78" dy="34">ship.update()</tspan>
    <tspan x="78" dy="34">_update_bullets()</tspan>
    <tspan x="78" dy="34">_update_screen() → tick(60)</tspan>
  </text>

  <rect x="565" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Movement</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">KEYDOWN → flag True</tspan>
    <tspan x="593" dy="34">KEYUP → flag False</tspan>
    <tspan x="593" dy="34">float self.x → precise speed</tspan>
    <tspan x="593" dy="34">rect bounds → stay on screen</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Bullets</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Bullet(Sprite)</tspan>
    <tspan x="1108" dy="34">Group.add() / update()</tspan>
    <tspan x="1108" dy="34">draw.rect()</tspan>
    <tspan x="1108" dy="34">copy() + remove() cleanup</tspan>
  </text>

  <rect x="50" y="445" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Architecture</text>
  <text x="78" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">AlienInvasion → coordinator</tspan>
    <tspan x="78" dy="34">Settings → configuration</tspan>
    <tspan x="78" dy="34">Ship → player state/behavior</tspan>
    <tspan x="78" dy="34">Bullet → independently moving sprite</tspan>
  </text>

  <rect x="815" y="445" width="735" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Source findings</text>
  <text x="843" y="531" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="843" dy="0">Ship(screen) ↔ Ship(ai_game)</tspan>
    <tspan x="843" dy="34">check_events ↔ _check_events</tspan>
    <tspan x="843" dy="34">bullet cleanup indentation mismatch</tspan>
    <tspan x="843" dy="34">draw_rect prose ↔ pygame.draw.rect code</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Provenance: e0022:c01–c16 · EPUB spine 22 · OEBPS/Text/978544614112-19.xhtml</text>
</svg>