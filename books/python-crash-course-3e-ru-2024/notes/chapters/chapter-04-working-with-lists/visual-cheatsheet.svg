<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — Работа со списками</title>
  <desc id="desc">Циклы for, range, срезы, копирование, кортежи и форматирование.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">Глава 4 — Работа со списками</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">for → range → slices → copy → tuple → readable code</text>

  <rect x="50" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Цикл for</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">for item in items:</tspan>
    <tspan x="78" dy="34">Indented body → каждый элемент</tspan>
    <tspan x="78" dy="34">Без отступа → после цикла</tspan>
    <tspan x="78" dy="34">Проверять : и indentation</tspan>
  </text>

  <rect x="565" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Числовые списки</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">range(start, stop, step)</tspan>
    <tspan x="593" dy="34">stop не включается</tspan>
    <tspan x="593" dy="34">list(range(...))</tspan>
    <tspan x="593" dy="34">min / max / sum / comprehension</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Срезы и копия</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">items[start:stop]</tspan>
    <tspan x="1108" dy="34">items[:], items[-3:]</tspan>
    <tspan x="1108" dy="34">copy = original[:] → отдельный список</tspan>
    <tspan x="1108" dy="34">copy = original → один объект</tspan>
  </text>

  <rect x="50" y="440" width="720" height="285" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="483" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Ошибки структуры</text>
  <text x="78" y="526" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Нет блока после for → IndentationError</tspan>
    <tspan x="78" dy="34">Лишний отступ → unexpected indent</tspan>
    <tspan x="78" dy="34">Неверная область отступа → logical error</tspan>
    <tspan x="78" dy="34">Нет двоеточия → SyntaxError expected ':'</tspan>
  </text>

  <rect x="815" y="440" width="735" height="285" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
  <text x="843" y="483" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Кортежи и стиль</text>
  <text x="843" y="526" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="843" dy="0">(200, 50) → элементы неизменяемы</tspan>
    <tspan x="843" dy="34">item assignment → TypeError</tspan>
    <tspan x="843" dy="34">Можно заменить tuple целиком</tspan>
    <tspan x="843" dy="34">4 пробела · короткие строки · разумные пустые строки</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Provenance: e0013:c01–c13 · EPUB spine 13 · OEBPS/Text/978544614112-10.xhtml</text>
</svg>