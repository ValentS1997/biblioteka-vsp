<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" role="img" aria-label="Глава 5 - подробная карта качества признаков и защиты от утечек"><rect width="1360" height="1000" fill="#0f172a"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="31" fill="#f8fafc" font-weight="700">ГЛАВА 5 · КАЧЕСТВО ПРИЗНАКОВ ДЛЯ ML</text>
<text x="40" y="96" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8" font-weight="400">Только источник: RAG PDF 136–161 · точный SHA в README</text>
<rect x="36" y="123" width="622" height="247" rx="14" fill="#1f2937" stroke="#475569"/>
<rect x="684" y="123" width="640" height="247" rx="14" fill="#1f2937" stroke="#475569"/>
<text x="58" y="165" font-family="Arial,sans-serif" font-size="24" fill="#93c5fd" font-weight="700">ПОДГОТОВКА И КОДИРОВАНИЕ</text>
<text x="58" y="206" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">MNAR / MAR / MCAR → осмысленно убрать или заполнить</text>
<text x="58" y="246" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Scale / standardize / binning на данных train</text>
<text x="58" y="286" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Новые категории → hashing + риск collision</text>
<text x="58" y="333" font-family="Arial,sans-serif" font-size="16" fill="#a5b4fc" font-weight="400">p0139–p0147</text>
<text x="707" y="165" font-family="Arial,sans-serif" font-size="24" fill="#93c5fd" font-weight="700">СЛОЖНЫЕ ПРЕДСТАВЛЕНИЯ</text>
<text x="707" y="206" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Feature crosses → больше взаимодействий и риска</text>
<text x="707" y="246" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Позиции → learned / predetermined embeddings</text>
<text x="707" y="286" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Fourier features → непрерывные координаты</text>
<text x="707" y="333" font-family="Arial,sans-serif" font-size="16" fill="#a5b4fc" font-weight="400">p0147–p0150</text>
<rect x="36" y="395" width="1288" height="258" rx="14" fill="#1f2937" stroke="#475569"/>
<text x="58" y="437" font-family="Arial,sans-serif" font-size="25" fill="#93c5fd" font-weight="700">DATA LEAKAGE — ГЛАВНЫЙ КОНТРОЛЬ</text>
<text x="58" y="482" font-family="Arial,sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">Разделение по времени при временной корреляции.</text>
<text x="58" y="526" font-family="Arial,sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">Статистика fill / scale только из train, не из validation или test.</text>
<text x="58" y="570" font-family="Arial,sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">Дубли, общие субъекты, способ сбора и скрытая связь с меткой.</text>
<text x="58" y="620" font-family="Arial,sans-serif" font-size="17" fill="#a5b4fc" font-weight="400">p0151–p0155 · аномальная важность → расследовать и выполнить ablation</text>
<rect x="36" y="681" width="1288" height="222" rx="14" fill="#1f2937" stroke="#475569"/>
<text x="58" y="722" font-family="Arial,sans-serif" font-size="24" fill="#93c5fd" font-weight="700">ВАЖНОСТЬ + ОБОБЩЕНИЕ</text>
<text x="58" y="766" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">XGBoost / SHAP / InterpretML: важность без универсального API.</text>
<text x="58" y="806" font-family="Arial,sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Coverage + распределение значений на unseen данных.</text>
<text x="58" y="853" font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">Уберите нерелевантные признаки: ресурсы, задержка, долг поддержки.</text>
<text x="40" y="952" font-family="Arial,sans-serif" font-size="17" fill="#fca5a5" font-weight="400">p0155–p0160 · нет подтверждённого production CLI · точные формулы: [Needs confirmation]</text>
</svg>