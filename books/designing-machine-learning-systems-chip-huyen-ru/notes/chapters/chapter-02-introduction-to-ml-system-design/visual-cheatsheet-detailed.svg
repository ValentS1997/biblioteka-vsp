<text x="60" y="396" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#93c5fd">ИТЕРАТИВНЫЙ ЦИКЛ ПО КНИГЕ</text>
<text x="60" y="439" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">1. Скопинг    →    2. Данные    →    3. Разработка модели</text>
<text x="60" y="479" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">4. Развертывание    →    5. Мониторинг и обновление</text>
<text x="60" y="519" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">6. Бизнес-анализ    →    возврат к скопингу и метрике</text>
<text x="60" y="569" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#a5b4fc">Пересмотр данных и меток при ошибках · p0053–p0055</text>
<rect x="38" y="634" width="1242" height="183" rx="13" fill="#1f2937" stroke="#475569"/>
<text x="60" y="673" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#93c5fd">КОМПРОМИССЫ: НЕ ОДНА МЕТРИКА</text>
<text x="60" y="710" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#e2e8f0">Качество и вовлечённость: разные модели позволяют менять веса результатов.</text>
<text x="60" y="747" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#e2e8f0">Объём данных ≠ качество; неверные метки могут навредить.</text>
