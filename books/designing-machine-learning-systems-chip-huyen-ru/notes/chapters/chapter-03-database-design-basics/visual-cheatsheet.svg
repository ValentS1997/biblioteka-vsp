<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 550" width="1170" height="550" role="img" aria-label="Глава 3 - основы проектирования баз данных"><rect x="0" y="0" width="1170" height="550" fill="#0f172a"/>
<text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">ГЛАВА 3 · АРХИТЕКТУРА ДАННЫХ ДЛЯ ML</text>
<text x="36" y="97" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">Источник → представление → хранение → обмен → признаки</text>
