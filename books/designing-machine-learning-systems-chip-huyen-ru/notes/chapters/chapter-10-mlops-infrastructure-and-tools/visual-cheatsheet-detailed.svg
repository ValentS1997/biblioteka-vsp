<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-label="Глава 10. Подробная карта инфраструктуры MLOps"><rect width="1200" height="950" fill="#102030"/><g fill="#ffffff" font-family="Arial,sans-serif"><text x="50" y="70" font-size="34">Глава 10. Инфраструктура MLOps</text><text x="50" y="165" font-size="26">1. Storage и compute: CPU, GPU, RAM, cloud и собственный ЦОД</text><text x="50" y="230" font-size="19">p0300-c01 — p0305-c01: capacity, quota, elastic compute</text><text x="50" y="325" font-size="26">2. Development: IDE, notebooks, versions, CI/CD</text><text x="50" y="390" font-size="19">p0306-c01 — p0313-c01: containers, reproducible dependencies</text><text x="50" y="485" font-size="26">3. Resource management: Cron, DAG, scheduling, orchestration</text><text x="50" y="550" font-size="19">p0314-c01 — p0322-c01: Airflow, Argo, Metaflow, Kubernetes</text><text x="50" y="645" font-size="26">4. ML platform: serving, registry, feature store</text><text x="50" y="710" font-size="19">p0323-c01 — p0330-c01: provenance, feature parity</text><text x="50" y="790" font-size="26">Build vs buy: p0330-c01 — p0332-c01</text><text x="50" y="880" font-size="18">Source-only. Deployment details require confirmation.</text></g></svg>