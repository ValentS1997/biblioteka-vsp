<text x="401" y="381" font-size="32" fill="#eff9ff">→</text>
<text x="804" y="381" font-size="32" fill="#eff9ff">→</text>
<rect x="48" y="480" width="1144" height="131" rx="14" fill="#354765"/>
<text x="77" y="529" font-size="28" font-weight="bold" fill="#f4faff">2 · Наблюдай поток, а не занятость</text>
