<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1190" viewBox="0 0 1320 1190" role="img" aria-labelledby="title desc">
<title id="title">Глава 2 — подробная визуальная памятка</title>
<desc id="desc">Типы нагрузки, локальная и облачная среда, FaaS, приложение, контейнеры, VM, компромиссы</desc>
<rect width="1320" height="1190" fill="#f8fafc"/>
<text x="44" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#102a43">Глава 2 · Вычислительные среды</text>
<text x="45" y="105" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#526879">Концептуальная карта решения · RAG PDF 37–47</text>
<rect x="40" y="130" width="1240" height="110" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="65" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#075985">① Выявите доминирующий ресурс приложения</text>
<text x="65" y="199" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#0b5980">CPU-bound: вычислительная мощность     Memory-bound: объём RAM     Storage-bound: задержки и I/O</text>
<rect x="40" y="264" width="595" height="215" rx="14" fill="#ffffff" stroke="#c9d9e7" stroke-width="1.5"/>
<rect x="665" y="264" width="615" height="215" rx="14" fill="#ffffff" stroke="#c9d9e7" stroke-width="1.5"/>
<text x="64" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">② Выберите место размещения</text>
<text x="64" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Локально: собственное / арендованное железо</text>
<text x="64" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Плюсы: контроль, особые регуляторные условия</text>
<text x="64" y="405" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Компромисс: закупка и сложность сопровождения</text>
<text x="64" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Совместное размещение: сеть ↘, конкуренция ↗</text>
<text x="691" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">③ Определите требуемый контроль</text>
<text x="691" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">FaaS: минимум контроля над средой</text>
<text x="691" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Managed app: платформа + runtime</text>
<text x="691" y="405" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Контейнер: приложение + зависимости + runtime</text>
<text x="691" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">VM: собственная ОС и больший объём забот</text>
<rect x="40" y="502" width="1240" height="248" rx="14" fill="#f1f5f9" stroke="#c9d9e7" stroke-width="1.5"/>
<text x="64" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">④ Сопоставьте способ исполнения с ограничениями</text>
<text x="64" y="583" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">FaaS: небольшие функции, HTTP/события/расписание; платите за вызовы и исполнение [41–42]</text>
<text x="64" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Служба приложений: управляемые языки, зависимости, масштабирование [42]</text>
<text x="64" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Контейнер: слоистый образ, общий kernel, оркестрация при необходимости [42–43]</text>
<text x="64" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">VM: гипервизор, разные ОС, настройка виртуальных CPU/RAM/storage [43–44]</text>
<text x="64" y="703" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Unikernel: лёгкий неизменяемый образ для одного процесса [40–41]</text>
<rect x="40" y="777" width="595" height="210" rx="14" fill="#ffffff" stroke="#c9d9e7" stroke-width="1.5"/>
<rect x="665" y="777" width="615" height="210" rx="14" fill="#ffffff" stroke="#c9d9e7" stroke-width="1.5"/>
<text x="64" y="816" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">⑤ Эксплуатационные компромиссы</text>
<text x="64" y="858" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Изоляция: контейнер ≠ полноценная VM</text>
<text x="64" y="889" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Запуск: секунды vs загрузка ОС (по книге)</text>
<text x="64" y="920" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Переносимость и риск привязки FaaS</text>
<text x="64" y="951" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Сеть, хранение, масштабирование и затраты</text>
<text x="691" y="816" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">⑥ Контроль принятого решения</text>
<text x="691" y="858" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Учтены ОС, язык, фреймворк и регуляторика?</text>
<text x="691" y="889" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Нужна скорость реакции на рост нагрузки?</text>
<text x="691" y="920" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Где география сервиса и какие условия?</text>
<text x="691" y="951" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">Этика поставщика и бюджет проверены?</text>
<rect x="40" y="1015" width="1240" height="92" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
<text x="64" y="1053" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">Итог: примените минимально достаточную модель и пересмотрите выбор по результатам</text>
<text x="64" y="1084" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#166534">Действия, измерения и rollback для конкретной платформы: [Needs confirmation]</text>
<text x="44" y="1153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748b">Источник: accepted RAG · chunks p0037-c01…p0047-c01 · source SHA 06862ea1…4a790</text>
</svg>
