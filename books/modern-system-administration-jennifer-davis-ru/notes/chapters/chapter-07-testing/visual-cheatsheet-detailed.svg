<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-labelledby="t d">
<title id="t">Глава 7 — Подробная карта тестирования инфраструктуры</title>
<desc id="d">Исследовательское тестирование, линтинг, unit, integration, E2E, пирамида и четыре класса причин отказа. Схема по RAG PDF 89–99, без восстановления недоступных иллюстраций.</desc>
<rect width="1500" height="1150" fill="#0b1829"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="55" y="69" font-size="39" font-weight="bold" fill="#eff7ff">Глава 7 · Тестирование</text>
<text x="55" y="105" font-size="21" fill="#b0cee4">Учиться по тестам, получать быструю обратную связь, не путать сбой с дефектом</text>
<rect x="55" y="137" width="1390" height="115" rx="15" fill="#19404d" stroke="#73daca" stroke-width="2"/>
<text x="82" y="182" font-size="27" font-weight="bold" fill="#f0ffff">Исследование поведения (PDF 89–90)</text>
<text x="82" y="217" font-size="20" fill="#d7f5ef">Ручной эксперимент в непроизводственной среде → краткий цикл проверки целей и гипотез</text>
<rect x="55" y="284" width="675" height="180" rx="14" fill="#23334f"/>
<text x="83" y="328" font-size="26" font-weight="bold" fill="#f2f8ff">Линтинг и unit (PDF 90–92)</text>
<text x="83" y="365" font-size="19" fill="#d7e8f6">• Линтер: ошибки, читаемость, стандарты</text>
<text x="83" y="401" font-size="19" fill="#d7e8f6">• Unit: быстрые локальные проверки логики</text>
<text x="83" y="437" font-size="19" fill="#d7e8f6">• Внешние связи в unit изолируются</text>
<rect x="770" y="284" width="675" height="180" rx="14" fill="#244654"/>
<text x="799" y="328" font-size="26" font-weight="bold" fill="#f1ffff">Integration и E2E (PDF 93)</text>
<text x="799" y="365" font-size="19" fill="#d7f2f5">• Integration: совместная работа модулей</text>
<text x="799" y="401" font-size="19" fill="#d7f2f5">• E2E: полный поток на тестовых данных</text>
<text x="799" y="437" font-size="19" fill="#d7f2f5">• Дороже, сложнее локализовать причины</text>
<rect x="55" y="497" width="1390" height="159" rx="14" fill="#2b3954"/>
<text x="84" y="540" font-size="27" font-weight="bold" fill="#f1f7ff">Стратегия и пирамида (PDF 94–96)</text>
<text x="84" y="578" font-size="20" fill="#dbeafa">Больше быстрых узких проверок; меньше дорогих E2E. Избегать избыточного дублирования.</text>
<text x="84" y="610" font-size="20" fill="#dbeafa">Для инфракода unit полезнее при ветвлении конфигураций; integration может занимать большее место.</text>
<text x="84" y="638" font-size="17" fill="#b8cfe8">Точные рисунки 7.1–7.6 не воспроизведены: текстовый RAG не передаёт их полностью.</text>
<text x="56" y="705" font-size="28" font-weight="bold" fill="#f3f8ff">При падении теста: четыре возможных класса причин (PDF 97–98)</text>
<rect x="55" y="732" width="675" height="103" rx="14" fill="#444050"/>
<text x="83" y="772" font-size="24" font-weight="bold" fill="#fff3ff">1 · Среда и инфраструктура</text>
<text x="83" y="807" font-size="18" fill="#f4e5f5">Сеть, разрешения, оборудование, различия сред</text>
<rect x="770" y="732" width="675" height="103" rx="14" fill="#4a414f"/>
<text x="799" y="772" font-size="24" font-weight="bold" fill="#fff3ff">2 · Неправильная логика теста</text>
<text x="799" y="807" font-size="18" fill="#f4e5f5">Несовпадение проверки с реальными ожиданиями</text>
<rect x="55" y="853" width="675" height="103" rx="14" fill="#45424d"/>
<text x="83" y="894" font-size="24" font-weight="bold" fill="#fff3ff">3 · Изменившиеся предположения</text>
<text x="83" y="927" font-size="18" fill="#f4e5f5">Порядок и время меняют поведение системы</text>
<rect x="770" y="853" width="675" height="103" rx="14" fill="#4b3d48"/>
<text x="799" y="894" font-size="24" font-weight="bold" fill="#fff3ff">4 · Дефект кода</text>
<text x="799" y="927" font-size="18" fill="#f4e5f5">Проверять после других вероятных объяснений</text>
<rect x="55" y="978" width="1390" height="99" rx="14" fill="#28554a" stroke="#68dcae"/>
<text x="83" y="1019" font-size="25" font-weight="bold" fill="#f3fff9">Итог и следующий цикл (PDF 98–99)</text>
<text x="83" y="1052" font-size="20" fill="#ddfff0">Для долгоживущих систем могут понадобиться длительные нагрузки; стратегию улучшать по результатам.</text>
<text x="55" y="1113" font-size="16" fill="#a8c3db">RAG PDF 89–99, печатные 93–103. Не даны точные команды, rollback и универсальные пороги.</text>
</g></svg>