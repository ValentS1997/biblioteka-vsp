<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" role="img" aria-labelledby="t d">
<title id="t">Глава 7 — Тестирование: компактная карта</title>
<desc id="d">Уровни тестов, оценка падений и особенности инфраструктурных проверок по RAG PDF 89–99.</desc>
<rect width="1180" height="780" fill="#0e1a2b"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="50" y="73" font-size="40" font-weight="bold" fill="#f6faff">Глава 7 · Тестирование</text>
<text x="50" y="111" font-size="22" fill="#afc9e0">Полезная обратная связь важнее количества тестов</text>
<rect x="50" y="147" width="1080" height="106" rx="15" fill="#173f4e" stroke="#6bdbce" stroke-width="2"/>
<text x="80" y="190" font-size="28" font-weight="bold" fill="#f6ffff">1 · Исследуй поведение системы</text>
<text x="80" y="227" font-size="20" fill="#d6f7f4">Ручной эксперимент → понятная цель → короткий цикл обратной связи</text>
<rect x="50" y="288" width="515" height="159" rx="14" fill="#21344f"/>
<text x="78" y="329" font-size="26" font-weight="bold" fill="#f2f8ff">2 · Базовые проверки</text>
<text x="78" y="365" font-size="19" fill="#dfebfa">Линтинг: ранние предупреждения</text>
<text x="78" y="396" font-size="19" fill="#dfebfa">Unit: быстрый тест собственной логики</text>
<text x="78" y="425" font-size="19" fill="#dfebfa">Без проверки реальных зависимостей</text>
<rect x="613" y="288" width="517" height="159" rx="14" fill="#244454"/>
<text x="640" y="329" font-size="26" font-weight="bold" fill="#f1ffff">3 · Связи и сценарии</text>
<text x="640" y="365" font-size="19" fill="#dbf3f3">Integration: взаимодействие компонентов</text>
<text x="640" y="396" font-size="19" fill="#dbf3f3">E2E: реалистичный сквозной поток</text>
<text x="640" y="425" font-size="19" fill="#dbf3f3">Дольше и сложнее локализовать сбой</text>
<rect x="50" y="478" width="1080" height="117" rx="14" fill="#293853"/>
<text x="78" y="520" font-size="27" font-weight="bold" fill="#f2f8ff">4 · Балансируй тестовую пирамиду</text>
<text x="78" y="552" font-size="19" fill="#dce8f8">Чаще быстрые узкие тесты, реже дорогие E2E; для инфракода возможна иная форма</text>
<rect x="50" y="622" width="1080" height="104" rx="14" fill="#315449" stroke="#6ce0b2"/>
<text x="78" y="664" font-size="27" font-weight="bold" fill="#f5fff9">5 · Разбирай падения по причинам</text>
<text x="78" y="696" font-size="19" fill="#e2fff4">Среда → логика теста → предположения → дефект кода</text>
<text x="50" y="761" font-size="15" fill="#adc2d6">Источник: RAG PDF 89–99; это концептуальная карта, не буквальная копия рис. 7.1–7.6.</text>
</g></svg>