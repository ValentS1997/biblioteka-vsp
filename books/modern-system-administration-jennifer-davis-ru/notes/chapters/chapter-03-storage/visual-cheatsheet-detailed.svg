<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1270" viewBox="0 0 1530 1270" role="img" aria-labelledby="title desc">
<title id="title">Глава 3. Хранилище — подробная визуальная шпаргалка по RAG</title>
<desc id="desc">Характеристики, типы блочного, файлового, объектного и баз данных, CAP и PACELC, размещение, retention, приватность и проверяемое восстановление.</desc>
<rect width="1530" height="1270" fill="#fff"/>
<rect width="1530" height="120" fill="#153f54"/>
<text x="42" y="51" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#ffffff">ХРАНИЛИЩЕ / ГЛАВА 3</text>
<text x="42" y="88" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#d9edf2">Требования массива данных → модель → размещение → безопасность → восстановление</text>
<rect x="42" y="152" width="705" height="176" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="42" y="152" width="7" height="176" rx="3" fill="#16856b"/><text x="64" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">1 / ПРОФИЛЬ И МЕТРИКИ</text><text x="64" y="224" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Емкость • IOPS • размер одной операции I/O</text><text x="64" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Пропускная способность • задержка</text><text x="64" y="282" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Источник: IOPS = throughput / размер I/O [51]</text>
<rect x="778" y="152" width="710" height="176" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="778" y="152" width="7" height="176" rx="3" fill="#2466a5"/><text x="800" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">2 / ПОЧЕМУ ДАННЫЕ ВАЖНЫ</text><text x="800" y="224" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Потеря данных может стоить дороже носителя</text><text x="800" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Конфиденциальные/платежные/учетные данные</text><text x="800" y="282" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Учитывайте доверие клиентов и обязательства [48–50]</text>
<rect x="42" y="352" width="705" height="185" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="42" y="352" width="7" height="185" rx="3" fill="#2d8091"/><text x="64" y="388" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">3A / БЛОК И ФАЙЛ</text><text x="64" y="424" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Блок: тома VM, диски БД, RAID, SAN [52]</text><text x="64" y="453" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Файл: дерево каталогов, NFS и Samba</text><text x="64" y="482" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Общий доступ и ограничения больших деревьев [53]</text>
<rect x="778" y="352" width="710" height="185" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="778" y="352" width="7" height="185" rx="3" fill="#2d8091"/><text x="800" y="388" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">3Б / ОБЪЕКТ И БАЗЫ ДАННЫХ</text><text x="800" y="424" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Объекты: ID + метаданные, медиа и backup [53]</text><text x="800" y="453" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">SQL: ACID, транзакции [54]</text><text x="800" y="482" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">NoSQL: key-value, document, graph, wide-column [55–56]</text>
<rect x="42" y="561" width="705" height="175" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="42" y="561" width="7" height="175" rx="3" fill="#7653a4"/><text x="64" y="597" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">4 / РАСПРЕДЕЛЕННЫЕ БД</text><text x="64" y="633" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">CAP: доступность и согласованность при partition</text><text x="64" y="662" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">PACELC: trade-off задержки и согласованности</text><text x="64" y="691" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Контекст важнее универсального выбора [54–56]</text>
<rect x="778" y="561" width="710" height="175" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="778" y="561" width="7" height="175" rx="3" fill="#b66a22"/><text x="800" y="597" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">5 / ЛОКАЛЬНО ИЛИ ОБЛАКО</text><text x="800" y="633" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Локально: низкая задержка; оборудование и уход</text><text x="800" y="662" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Облако: гибкость, репликация, регулярный счет</text><text x="800" y="691" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Выбор учитывает географию и нормы [56–58]</text>
<rect x="42" y="759" width="705" height="176" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="42" y="759" width="7" height="176" rx="3" fill="#b66a22"/><text x="64" y="795" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">6 / ЖИЗНЕННЫЙ ЦИКЛ</text><text x="64" y="831" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Определите необходимый срок и детализацию</text><text x="64" y="860" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Агрегируйте архивы; «холодный» уровень [58–59]</text><text x="64" y="889" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">При удалении носителей учтите риск остатка данных [59]</text>
<rect x="778" y="759" width="710" height="176" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="778" y="759" width="7" height="176" rx="3" fill="#7653a4"/><text x="800" y="795" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">7 / ЗАЩИТА</text><text x="800" y="831" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Минимальные привилегии и нужный доступ</text><text x="800" y="860" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Шифруйте данные при хранении и передаче</text><text x="800" y="889" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Не собирайте ненужные чувствительные данные [60–61]</text>
<rect x="42" y="961" width="1446" height="188" rx="17" fill="#e9f6f0" stroke="#b0d6c3" stroke-width="2"/>
<text x="71" y="1003" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#14513e">8 / НЕ ПРОСТО BACKUP: ПРОВЕРКА ВОССТАНОВЛЕНИЯ</text>
<text x="71" y="1043" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#183047">Моделируйте удаление/сбой, восстановите данные на практике и задокументируйте процедуру.</text>
<text x="71" y="1081" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#183047">Уточните допустимую свежесть копии и срок возврата данных для своего процесса. [61–62]</text>
<text x="71" y="1117" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Средства: в главе явно упомянута iostat как утилита наблюдения [52]; флаги не приведены.</text>
<text x="38" y="1194" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#526476">Источник: canonical RAG PDF 48–62; p0048-c01…p0062-c01 · БХВ-Петербург, 2024</text>
<text x="38" y="1226" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#526476">Исторические значения Amazon EBS: август 2022 года; актуальные тарифы и настройки: [Needs confirmation].</text>
</svg>