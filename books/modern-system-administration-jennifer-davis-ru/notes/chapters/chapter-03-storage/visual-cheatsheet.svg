<title id="title">Глава 3. Хранилище — компактная RAG-шпаргалка</title>
<desc id="desc">Главный принцип: выбирать способ хранения по типу данных, требованиям производительности, защиты, стоимости и восстановления.</desc>
<rect width="1250" height="720" fill="#ffffff"/>
<rect x="0" y="0" width="1250" height="113" fill="#153f54"/>
<text x="38" y="47" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#ffffff">ГЛАВА 3 / ХРАНИЛИЩЕ</text>
<text x="38" y="82" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#cfeaf0">Сначала свойства данных и требования — затем технология хранения</text>
<rect x="38" y="136" width="564" height="166" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="38" y="136" width="7" height="166" rx="3" fill="#16856b"/><text x="60" y="172" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">1 / ПРОФИЛЬ ДАННЫХ</text><text x="60" y="208" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Емкость • IOPS • размер I/O</text><text x="60" y="237" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Пропускная способность • задержка</text><text x="60" y="266" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Доступ • согласованность • срок хранения</text>
<rect x="629" y="136" width="580" height="166" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="629" y="136" width="7" height="166" rx="3" fill="#2466a5"/><text x="651" y="172" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">2 / ТИП ХРАНИЛИЩА</text><text x="651" y="208" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Блок: тома и низкоуровневый I/O</text><text x="651" y="237" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Файл: каталоги и общий доступ</text><text x="651" y="266" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Объект: метаданные; БД: транзакции</text>
<rect x="38" y="325" width="564" height="140" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="38" y="325" width="7" height="140" rx="3" fill="#b66a22"/><text x="60" y="361" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">3 / РАЗМЕЩЕНИЕ</text><text x="60" y="397" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Локально / облако / гибрид: стоимость,</text><text x="60" y="426" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">масштаб, география, ограничения</text>
<rect x="629" y="325" width="580" height="140" rx="15" fill="#f7fafc" stroke="#dbe5eb" stroke-width="1.5"/><rect x="629" y="325" width="7" height="140" rx="3" fill="#7c4da5"/><text x="651" y="361" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#183047">4 / ЗАЩИТА И ЖИЗНЕННЫЙ ЦИКЛ</text><text x="651" y="397" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Минимальные привилегии и шифрование</text><text x="651" y="426" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183047">Retention • удаление • конфиденциальность</text>
<rect x="38" y="487" width="1171" height="136" rx="15" fill="#eaf6f1" stroke="#abd3c4"/>
<text x="65" y="528" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#164937">5 / BACKUP ≠ ВОССТАНОВЛЕНИЕ</text>
<text x="65" y="565" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#183047">Документировать восстановление и регулярно моделировать потерю данных.</text>
<text x="65" y="594" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#183047">Проверить сроки и пригодность копий до аварии. [PDF 61–62]</text>
<text x="38" y="666" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#526476">Источник: canonical RAG · PDF 48–62 (печатные 51–65) · p0048-c01…p0062-c01</text>
<text x="38" y="691" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#526476">Артефакт RAG-only · Числовые цели, CLI-процедуры и rollback: [Needs confirmation]</text>
