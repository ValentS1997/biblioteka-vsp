<text x="68" y="671" font-size="22" font-weight="700" fill="#1e40af">Прикладной</text>
<text x="68" y="699" font-size="18" fill="#1e40af">HTTP, DNS · взаимодействие приложения</text>
<text x="68" y="755" font-size="22" font-weight="700" fill="#065f46">Транспортный</text>
<text x="68" y="783" font-size="18" fill="#065f46">TCP: соединение и подтверждения · UDP: без гарантии доставки</text>
<text x="68" y="839" font-size="22" font-weight="700" fill="#92400e">Сетевой</text>
<text x="68" y="867" font-size="18" fill="#92400e">IP-адресация, IPv4 / IPv6, MTU, ICMP по табл. 1.2</text>
<text x="68" y="923" font-size="22" font-weight="700" fill="#9d174d">Канальный</text>
<text x="68" y="951" font-size="18" fill="#9d174d">ARP, MAC-адреса, возможные конфликты адресации</text>
<text x="68" y="1007" font-size="22" font-weight="700" fill="#5b21b6">Физический</text>
<text x="68" y="1035" font-size="18" fill="#5b21b6">Кабель, оптика, радио; расстояние и оборудование влияют на задержки</text>
