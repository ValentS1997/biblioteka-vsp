<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1130" viewBox="0 0 1360 1130" role="img" aria-labelledby="title desc">
<title id="title">Глава 1 — подробная RAG-памятка о системных взаимосвязях</title>
<desc id="desc">Концептуальные архитектуры, качественные компромиссы, события и пять сетевых уровней с PDF-локаторами и ограничениями</desc>
<rect width="1360" height="1130" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="45" y="61" fill="#102a43" font-weight="700" font-size="36">Глава 1 · Закономерности и взаимосвязи</text>
<text x="45" y="96" fill="#486581" font-size="21">Рассматривать сочетание компонентов, связей и требований, а не отдельные элементы</text>
<rect x="43" y="121" width="1274" height="78" rx="15" fill="#e0f2fe" stroke="#0284c7"/>
<text x="67" y="155" fill="#075985" font-size="22" font-weight="700">Контекст выбора архитектуры</text>
<text x="67" y="182" fill="#075985" font-size="19">Надёжность · Масштабируемость · Удобство сопровождения — PDF 28–31</text>
<rect x="44" y="229" width="400" height="312" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="480" y="229" width="400" height="312" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="916" y="229" width="400" height="312" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="64" y="267" font-size="23" font-weight="700" fill="#1e3a8a">Многоуровневая</text>
<text x="64" y="308" font-size="19" fill="#334155">Представление / приложение /</text>
<text x="64" y="335" font-size="19" fill="#334155">данные, разграничение задач</text>
<text x="64" y="375" font-size="18" fill="#334155">Смежные слои обмениваются</text>
<text x="64" y="402" font-size="18" fill="#334155">запросами и ответами</text>
<text x="64" y="458" font-size="19" fill="#166534">Сопровождение: высокое*</text>
<text x="64" y="490" font-size="19" fill="#92400e">Масштабирование: среднее*</text>
<text x="500" y="267" font-size="23" font-weight="700" fill="#1e3a8a">Микросервисы</text>
<text x="500" y="308" font-size="19" fill="#334155">Небольшие автономные единицы</text>
<text x="500" y="335" font-size="19" fill="#334155">бизнес-логики, свой стек</text>
<text x="500" y="375" font-size="18" fill="#334155">Независимые развертывания;</text>
<text x="500" y="402" font-size="18" fill="#334155">выше когнитивная нагрузка</text>
<text x="500" y="458" font-size="19" fill="#166534">Надёжность: высокая*</text>
<text x="500" y="490" font-size="19" fill="#92400e">Сопровождение: низкое*</text>
<text x="936" y="267" font-size="23" font-weight="700" fill="#1e3a8a">Событийная</text>
<text x="936" y="308" font-size="19" fill="#334155">Издатель → брокер → потребитель</text>
<text x="936" y="346" font-size="18" fill="#334155">Pub/sub: доставка, затем</text>
<text x="936" y="373" font-size="18" fill="#334155">удаление после потребления</text>
<text x="936" y="414" font-size="18" fill="#334155">Поток: распределённый журнал,</text>
<text x="936" y="441" font-size="18" fill="#334155">хранение и повторное чтение</text>
<text x="936" y="490" font-size="19" fill="#166534">Слабая связанность</text>
<text x="45" y="569" font-size="17" fill="#64748b">* Авторские качественные характеристики из таблицы 1.1 (PDF 31), а не измеренные значения в реальной среде.</text>
<text x="45" y="619" font-size="25" font-weight="700" fill="#102a43">Пятиуровневая модель взаимодействия · PDF 32–36</text>
