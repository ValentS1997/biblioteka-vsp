<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1210" viewBox="0 0 1500 1210" role="img" aria-labelledby="t d">
<title id="t">Глава 10 — Подробная карта презентаций</title>
<desc id="d">Аудитория, способы коммуникации, пять типов историй, панели для трёх адресатов, типы диаграмм и визуальные проверки, по RAG PDF 116–133.</desc>
<rect width="1500" height="1210" fill="#0b1729"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="55" y="73" font-size="40" font-weight="bold" fill="#f0f8ff">Глава 10 · Презентации</text>
<text x="55" y="108" font-size="21" fill="#bed3e6">Подобрать аудитории историю, дать контекст и ускорить решение</text>
<rect x="55" y="143" width="1390" height="112" rx="14" fill="#174451" stroke="#73d8d2" stroke-width="2"/>
<text x="83" y="188" font-size="28" font-weight="bold" fill="#efffff">1 · Аудитория и канал (PDF 116–120)</text>
<text x="83" y="223" font-size="20" fill="#daf5f2">Вопрос слушателя · устная / письменная речь · терминология · темп · голос · паузы</text>
<text x="55" y="298" font-size="28" font-weight="bold" fill="#f1f8ff">2 · Выбор истории (PDF 120–121)</text>
<rect x="55" y="321" width="433" height="139" rx="13" fill="#283952"/>
<text x="82" y="365" font-size="25" font-weight="bold" fill="#f4f8ff">Фактоид</text>
<text x="82" y="401" font-size="19" fill="#dce9f7">Значимый факт и масштаб</text>
<text x="82" y="432" font-size="17" fill="#bad0e7">Например, число пользователей</text>
<rect x="533" y="321" width="433" height="139" rx="13" fill="#284654"/>
<text x="560" y="365" font-size="25" font-weight="bold" fill="#f4ffff">Взаимодействие</text>
<text x="560" y="401" font-size="19" fill="#d8f2f5">Связи между величинами</text>
<text x="560" y="432" font-size="17" fill="#b6d9e2">Не путать связь и причину</text>
<rect x="1011" y="321" width="434" height="139" rx="13" fill="#303e54"/>
<text x="1038" y="365" font-size="25" font-weight="bold" fill="#f5f9ff">Изменение</text>
<text x="1038" y="401" font-size="19" fill="#dce8fa">Тренд, скорость и ускорение</text>
<text x="1038" y="432" font-size="17" fill="#bad0eb">Важна шкала времени</text>
<rect x="55" y="479" width="676" height="111" rx="13" fill="#304353"/>
<text x="82" y="521" font-size="25" font-weight="bold" fill="#f5faff">Сравнение</text>
<text x="82" y="557" font-size="19" fill="#deebf7">Стоимость, производительность, масштаб и надёжность</text>
<rect x="768" y="479" width="677" height="111" rx="13" fill="#334354"/>
<text x="795" y="521" font-size="25" font-weight="bold" fill="#f5faff">Персонализация</text>
<text x="795" y="557" font-size="19" fill="#deebf7">Реальный инцидент через опыт людей</text>
<rect x="55" y="620" width="1390" height="139" rx="14" fill="#293d55"/>
<text x="83" y="663" font-size="27" font-weight="bold" fill="#f0f7ff">3 · Один проект — три представления (PDF 123–127)</text>
<text x="83" y="702" font-size="20" fill="#e1ebfa">Команда: задачи по регионам и статусы · Руководство: прогресс и прогноз</text>
<text x="83" y="735" font-size="20" fill="#e1ebfa">Клиент: доступность его таблиц и сроки · Внутренние детали не всегда нужны</text>
<rect x="55" y="784" width="1390" height="143" rx="14" fill="#24505a"/>
<text x="83" y="830" font-size="27" font-weight="bold" fill="#f0ffff">4 · Подбери визуальное выражение (PDF 127–132)</text>
<text x="83" y="867" font-size="19" fill="#def5f7">Цвет, форма, движение, положение · Таблица · Столбцы · Линии · Области</text>
<text x="83" y="901" font-size="19" fill="#def5f7">Тепловая карта · Flame-график · Древовидная карта</text>
<rect x="55" y="953" width="1390" height="158" rx="14" fill="#28584e" stroke="#7cdeb8"/>
<text x="83" y="997" font-size="27" font-weight="bold" fill="#f3fff9">5 · Проверь качество (PDF 132–133)</text>
<text x="83" y="1035" font-size="20" fill="#dffff0">Размечены оси · Указаны источники · Аннотации акцентируют вывод</text>
<text x="83" y="1069" font-size="20" fill="#dffff0">Мало отвлекающих цветов · Читается без цвета · Контекст достаточен для решения</text>
<text x="55" y="1170" font-size="17" fill="#b1cbdd">RAG PDF 116–133. Рисунки и числовые таблицы извлечены не полностью.</text>
</g></svg>