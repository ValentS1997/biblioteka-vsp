<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc">
<title id="title">Глава 4. Сеть — подробная визуальная RAG-шпаргалка</title>
<desc id="desc">Маршрут клиентского запроса, четыре сетевые характеристики, балансировка, сетевые устройства, SDN, CDN, стратегия и риски CDN-кеша.</desc>
<rect width="1280" height="1060" fill="#ffffff"/>
<rect x="0" y="0" width="1280" height="114" fill="#16394f"/>
<text x="38" y="48" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#ffffff">ГЛАВА 4 / СЕТЬ — ПОДРОБНО</text>
<text x="38" y="82" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#d6edf4">Коммуникационная основа системы: маршрут, метрики, политика, география</text>
<rect x="38" y="137" width="1204" height="134" rx="14" fill="#eaf5fa" stroke="#b7d4e1"/>
<text x="60" y="171" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#17415b">КАК ИДЁТ ЗАПРОС / PDF 63–64</text>
<text x="60" y="209" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#243f4e">Клиент → сеть доступа → CDN / PoP → балансировщик → гипервизор / ВМ</text>
<text x="60" y="242" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#243f4e">→ ядро Linux → приложение → обратный путь ответа</text>
<rect x="38" y="292" width="584" height="176" rx="13" fill="#f8fafc" stroke="#d6e3e9"/><rect x="38" y="292" width="7" height="176" rx="3" fill="#138b87"/><text x="60" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193c52">1 / МЕТРИКИ КАЧЕСТВА</text><text x="60" y="366" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Пропускная способность: объём / время</text><text x="60" y="395" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Задержка: передача + обработка + очередь</text><text x="60" y="424" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Джиттер: изменение задержки; важен для потоков</text><text x="60" y="453" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Доступность: устойчивость к отказам</text>
<rect x="645" y="292" width="597" height="176" rx="13" fill="#f8fafc" stroke="#d6e3e9"/><rect x="645" y="292" width="7" height="176" rx="3" fill="#3267a7"/><text x="667" y="330" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193c52">2 / СЕТЕВЫЕ УЗЛЫ И L4/L7</text><text x="667" y="366" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Межсетевой экран, шлюз, IDS, VPN</text><text x="667" y="395" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Балансировщик L4: IP-адреса и порты</text><text x="667" y="424" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Балансировщик L7: свойства запросов</text><text x="667" y="453" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Топология и количество переходов важны</text>
<rect x="38" y="490" width="584" height="186" rx="13" fill="#f8fafc" stroke="#d6e3e9"/><rect x="38" y="490" width="7" height="186" rx="3" fill="#8b5db7"/><text x="60" y="528" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193c52">3 / ВИРТУАЛИЗАЦИЯ И SDN</text><text x="60" y="564" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Сетевые функции могут быть программными</text><text x="60" y="593" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Физические каналы всё равно обязательны</text><text x="60" y="622" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">SDN: контроллер и политика управления</text><text x="60" y="651" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Сегментация ограничивает последствия атак</text>
<rect x="645" y="490" width="597" height="186" rx="13" fill="#f8fafc" stroke="#d6e3e9"/><rect x="645" y="490" width="7" height="186" rx="3" fill="#bd7623"/><text x="667" y="528" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193c52">4 / CDN И ФИЗИКА ЗАДЕРЖКИ</text><text x="667" y="564" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">PoP ближе к пользователю → меньше RTT</text><text x="667" y="593" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Кеш снижает передачи от исходного сервера</text><text x="667" y="622" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">Резервирование; помощь при отдельных DDoS</text><text x="667" y="651" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#273e4b">CDN добавляет настройки и риски кеша</text>
<rect x="38" y="697" width="1204" height="190" rx="14" fill="#eef7f0" stroke="#b6d4bc"/>
<text x="60" y="736" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#24553b">5 / СТРАТЕГИЯ И БЕЗОПАСНОСТЬ ИЗМЕНЕНИЙ</text>
<text x="60" y="776" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#244338">Контекст пользователей и трафика → базовые измерения → выбор сетевой меры</text>
<text x="60" y="809" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#244338">HTTP/2 и QUIC: рекомендации главы; совместимость [Needs confirmation]</text>
<text x="60" y="842" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#244338">CDN: не очищать весь кеш без оценки каскада запросов на его наполнение</text>
<rect x="38" y="908" width="1204" height="67" rx="12" fill="#fff7e8" stroke="#e4c894"/>
<text x="60" y="936" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#704a1d">ВАЖНО: CLI и сценарии отката не приведены. Пороги и фактические конфигурации — [Needs confirmation].</text>
<text x="60" y="961" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#704a1d">Измерить эффект после точечных изменений; при неуспехе требуется заранее согласованный план возврата.</text>
<text x="38" y="1013" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#506574">RAG-only • PDF 63–71 • печатные 66–74 • p0063-c01 … p0071-c01 • Source SHA-256 06862ea10…</text>
<text x="38" y="1041" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#506574">Схема — учебная структуризация текста, не конфигурация сети и не дополнение из внешних источников.</text>
</svg>
