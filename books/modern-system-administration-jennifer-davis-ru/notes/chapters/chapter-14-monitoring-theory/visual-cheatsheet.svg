<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830" role="img" aria-labelledby="t d">
<title id="t">Глава 14 — Теоретические аспекты мониторинга</title>
<desc id="d">Компактная схема отличий мониторинга и наблюдаемости и пяти этапов мониторинга первого уровня; двойная петля обучения. Основано на canonical RAG PDF 173–181.</desc>
<rect width="1180" height="830" fill="#102033"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="48" y="71" font-size="39" font-weight="bold" fill="#f4f8ff">Глава 14 · Теория мониторинга</text>
<text x="48" y="109" font-size="21" fill="#c4d9ee">От событий к данным, решениям и адаптации команды</text>
<rect x="48" y="144" width="525" height="141" rx="16" fill="#273e59"/>
<text x="76" y="191" font-size="27" font-weight="bold" fill="#f5faff">Мониторинг = процесс</text>
<text x="76" y="228" font-size="19" fill="#d3e6f6">Измерять, собирать, анализировать</text>
<text x="76" y="256" font-size="19" fill="#d3e6f6">и представлять данные</text>
<rect x="606" y="144" width="526" height="141" rx="16" fill="#22515c"/>
<text x="634" y="191" font-size="27" font-weight="bold" fill="#f5ffff">Наблюдаемость = свойство</text>
<text x="634" y="228" font-size="19" fill="#d3f3f3">Можно ли объяснить внутреннее</text>
<text x="634" y="256" font-size="19" fill="#d3f3f3">состояние по выходным данным?</text>
<text x="48" y="339" font-size="28" font-weight="bold" fill="#f3f8ff">5 этапов мониторинга первого уровня</text>
<rect x="48" y="365" width="1084" height="77" rx="13" fill="#285166"/>
<text x="75" y="411" font-size="24" font-weight="bold" fill="#effbff">1 · Обнаружить событие или его отсутствие</text>
<text x="574" y="458" font-size="22" text-anchor="middle" fill="#73d8d1">↓</text>
<rect x="48" y="475" width="514" height="77" rx="13" fill="#293f5a"/>
<text x="72" y="521" font-size="22" fill="#e8f4ff">2 · Собрать: метрики, логи, трассы</text>
<rect x="598" y="475" width="534" height="77" rx="13" fill="#293f5a"/>
<text x="621" y="521" font-size="22" fill="#e8f4ff">3 · Сократить объём данных</text>
<rect x="48" y="575" width="514" height="77" rx="13" fill="#293f5a"/>
<text x="72" y="621" font-size="22" fill="#e8f4ff">4 · Анализировать: SLI, SLO</text>
<rect x="598" y="575" width="534" height="77" rx="13" fill="#293f5a"/>
<text x="621" y="621" font-size="22" fill="#e8f4ff">5 · Представить и действовать</text>
<rect x="48" y="683" width="1084" height="93" rx="14" fill="#285649" stroke="#83d6ae" stroke-width="2"/>
<text x="76" y="723" font-size="26" font-weight="bold" fill="#f2fff6">Второй уровень · Двойная петля обучения</text>
<text x="76" y="754" font-size="19" fill="#d9f5e7">Верни обратную связь в процессы и пересмотри предпосылки решений</text>
<text x="48" y="808" font-size="15" fill="#aac5db">Источник: canonical RAG PDF 173–181; новая карта, не реконструкция рис. 14.1.</text>
</g></svg>