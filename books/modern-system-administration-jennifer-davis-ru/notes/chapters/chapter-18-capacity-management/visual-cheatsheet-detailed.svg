<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1600" viewBox="0 0 1660 1600" role="img" aria-labelledby="title desc">
<title id="title">Глава 18 — Подробная карта управления мощностями</title>
<desc id="desc">Карта трех типов мощности, жизненного цикла, SLO-проверки, стратегий спроса и ограничений облака по RAG PDF 213–225.</desc>
<rect width="1660" height="1600" fill="#102035"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="54" y="72" font-size="39" font-weight="bold" fill="#f1f9ff">Глава 18 · Управление мощностями</text>
<text x="54" y="113" font-size="22" fill="#c1d8e8">Баланс полезной производительности, спроса, SLO, затрат и поддержки</text>
<text x="54" y="175" font-size="29" font-weight="bold" fill="#eff8ff">1 · Различай три предела (PDF 213–214)</text>
<rect x="54" y="201" width="482" height="177" rx="14" fill="#2a4566"/>
<text x="82" y="249" font-size="27" font-weight="bold" fill="#f5faff">Проектная · 1000</text>
<text x="82" y="287" font-size="21" fill="#e2eef9">Прогноз при проектировании</text>
<text x="82" y="330" font-size="19" fill="#c7dbe9">Возможности архитектуры</text>
<rect x="590" y="201" width="482" height="177" rx="14" fill="#225666"/>
<text x="617" y="249" font-size="26" font-weight="bold" fill="#f3ffff">Производственная · 800</text>
<text x="617" y="287" font-size="21" fill="#e2f4f7">Фактический максимум</text>
<text x="617" y="330" font-size="19" fill="#c5e4eb">Эксплуатационные пределы</text>
<rect x="1126" y="201" width="482" height="177" rx="14" fill="#31584a"/>
<text x="1154" y="249" font-size="27" font-weight="bold" fill="#f6fff9">Эффективная · 300</text>
<text x="1154" y="287" font-size="21" fill="#ddf5e9">Реальные условия/сезонность</text>
<text x="1154" y="330" font-size="19" fill="#cce9d9">Числа — пример книги</text>
<text x="54" y="437" font-size="29" font-weight="bold" fill="#f0f9ff">2 · Цикл решений по SLO (PDF 222–223)</text>
<rect x="54" y="460" width="1554" height="215" rx="15" fill="#284c68"/>
<text x="85" y="511" font-size="26" font-weight="bold" fill="#f4faff">Измерь нагрузку компонентов → проверь SLO</text>
<text x="85" y="553" font-size="21" fill="#e0effa">SLO PASS: оцени будущее и требования клиентов</text>
<text x="85" y="592" font-size="21" fill="#e0effa">SLO FAIL: capacity или конфигурация / внешняя проблема?</text>
<text x="85" y="635" font-size="21" fill="#e0effa">При capacity: одно изменение → повторно измерь → передай контекст командам</text>
<text x="54" y="733" font-size="29" font-weight="bold" fill="#f0f9ff">3 · Четыре компонента управления (PDF 215–222)</text>
<rect x="54" y="758" width="1554" height="169" rx="15" fill="#245863"/>
<text x="85" y="808" font-size="26" font-weight="bold" fill="#f3ffff">Закупка → Обоснование → Управление → Мониторинг</text>
<text x="85" y="846" font-size="21" fill="#dff3f6">Проблема, альтернативы, риск, измеримая польза и сроки поставки</text>
<text x="85" y="884" font-size="21" fill="#dff3f6">Физические активы: приемка, эксплуатация, ремонт, вывод, утилизация</text>
<text x="54" y="990" font-size="29" font-weight="bold" fill="#f0f9ff">4 · Стратегии масштабирования (PDF 223–224)</text>
<rect x="54" y="1015" width="482" height="165" rx="14" fill="#374963"/>
<text x="82" y="1063" font-size="28" font-weight="bold" fill="#f4faff">Lead · опережение</text>
<text x="82" y="1104" font-size="20" fill="#dfeafa">Ресурс до спроса</text>
<text x="82" y="1142" font-size="20" fill="#d0dff0">Риск лишних расходов</text>
<rect x="590" y="1015" width="482" height="165" rx="14" fill="#36556a"/>
<text x="617" y="1063" font-size="28" font-weight="bold" fill="#f4faff">Lag · запаздывание</text>
<text x="617" y="1104" font-size="20" fill="#dfeafa">Ресурс после спроса</text>
<text x="617" y="1142" font-size="20" fill="#d0dff0">Риск задержек и потерь</text>
<rect x="1126" y="1015" width="482" height="165" rx="14" fill="#2d5a4a"/>
<text x="1154" y="1063" font-size="28" font-weight="bold" fill="#f4fff8">Match · соответствие</text>
<text x="1154" y="1104" font-size="20" fill="#e3f8e9">Постепенное добавление</text>
<text x="1154" y="1142" font-size="20" fill="#d0eadb">Компромисс двух подходов</text>
<rect x="54" y="1232" width="1554" height="212" rx="14" fill="#2a534c" stroke="#7fdeb5" stroke-width="2"/>
<text x="84" y="1283" font-size="28" font-weight="bold" fill="#f5fff8">5 · Облако не бесконечно (PDF 220–225)</text>
<text x="84" y="1327" font-size="21" fill="#e1f7ed">Задержка предоставления · лимиты провайдера · managed storage</text>
<text x="84" y="1365" font-size="21" fill="#e1f7ed">Внешние зависимости · стоимость простаивающих ресурсов</text>
<text x="84" y="1403" font-size="21" fill="#e1f7ed">В serverless часть жизненного цикла контролирует поставщик</text>
<text x="54" y="1557" font-size="17" fill="#adcadf">Canonical RAG PDF 213–225. Оригинальные рисунки 18.1–18.6 недоступны. Пороги и rollback — [Needs confirmation].</text>
</g></svg>