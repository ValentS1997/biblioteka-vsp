<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="ttl desc">
<title id="ttl">Подробная схема главы 1 — переход к роли руководителя</title>
<desc id="desc">Адаптация, рабочие стили, команда, стимулы, технические решения и ограничения источника.</desc>
<rect width="1440" height="920" fill="#fafcfe"/><rect x="32" y="28" width="1376" height="100" rx="17" fill="#102a43"/>
<text x="62" y="73" font-family="Arial,sans-serif" font-weight="700" font-size="31" fill="#fff">Как привыкнуть к роли руководителя</text>
<text x="62" y="108" font-family="Arial,sans-serif" font-size="19" fill="#d9e9f1">RAG главы 1 · PDF p. 26–45 · авторские принципы</text>
<g font-family="Arial,sans-serif" fill="#17324e" font-size="20">
<rect x="32" y="154" width="672" height="200" rx="13" fill="#e7f1f9"/>
<text x="54" y="193" font-size="24" font-weight="700">Адаптация руководителя (26–30)</text>
<text x="54" y="232">• Руководящая роль меняет общение с коллегами.</text>
<text x="54" y="264">• «Крутость» и имидж не заменяют лидерства.</text>
<text x="54" y="296">• Нельзя постоянно делать работу за команду.</text>
<text x="54" y="328">• Делегирование освобождает управленческое время.</text>
<rect x="736" y="154" width="672" height="200" rx="13" fill="#e7f1f9"/>
<text x="758" y="193" font-size="24" font-weight="700">Люди и рабочие стили (31–38)</text>
<text x="758" y="232">• «Породы» — авторская метафора, не тест.</text>
<text x="758" y="264">• Архитектор силён в структуре решения.</text>
<text x="758" y="296">• Конструктивист — в реализации деталей.</text>
<text x="758" y="328">• Важно объединять разные сильные стороны.</text>
<rect x="32" y="380" width="672" height="200" rx="13" fill="#e7f1f9"/>
<text x="54" y="419" font-size="24" font-weight="700">Мотивация и стимулы (38–42)</text>
<text x="54" y="458">• Понимать, чем заинтересован разработчик.</text>
<text x="54" y="490">• Признавать вклад, а не только платить.</text>
<text x="54" y="522">• Хвалить публично, критиковать лично.</text>
<text x="54" y="554">• Оплата: справедливость плюс ограничения.</text>
<rect x="736" y="380" width="672" height="200" rx="13" fill="#e7f1f9"/>
<text x="758" y="419" font-size="24" font-weight="700">Мышление и решения (42–44)</text>
<text x="758" y="458">• Сначала выслушать автора решения.</text>
<text x="758" y="490">• Выяснить ограничения и мотивы.</text>
<text x="758" y="522">• Проверить архитектуру прототипом.</text>
<text x="758" y="554">• Искать согласие вместо силового приказа.</text>
<rect x="32" y="607" width="1376" height="186" rx="13" fill="#dbeaf4"/>
<text x="56" y="648" font-size="24" font-weight="700">Выводы главы (44–45)</text>
<text x="56" y="685">Адаптироваться → совершенствоваться → изучать людей → признавать вклад → думать и слушать.</text>
<text x="56" y="721">Граница: конкретные KPI, кадровые процедуры и CLI-команды в RAG главы не заданы.</text>
<text x="56" y="757">Переход к главе 2: научиться управлять собой.</text>
</g>
<text x="34" y="838" font-size="17" font-family="Arial,sans-serif" fill="#4b637c">Источник: rag/chunks/p0001-p0100/p0026-c01.md … p0045-c01.md.</text>
<text x="34" y="869" font-size="17" font-family="Arial,sans-serif" fill="#4b637c">Mojibake в части заголовков: см. source-findings.md. Не использовать внешние дополнения.</text>
</svg>
