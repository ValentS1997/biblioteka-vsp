<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="ttl desc">
<title id="ttl">Глава 2 — подробная визуальная памятка самоуправления руководителя</title>
<desc id="desc">Самодиагностика, управление временем, результаты команды, обучение и ежедневная проверка по RAG.</desc>
<rect width="1440" height="1010" fill="#f8fafc"/>
<rect x="30" y="25" width="1380" height="110" rx="18" fill="#12324b"/>
<text x="62" y="74" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="white">Глава 2. Как руководить собой</text>
<text x="62" y="112" font-family="Arial,sans-serif" font-size="18" fill="#d9e9f4">Переход: личное кодирование → управление результатом команды · PDF 46–62</text>
<g font-family="Arial,sans-serif" fill="#18334c" font-size="20">
<rect x="30" y="158" width="672" height="175" rx="13" fill="#e3eff9"/>
<text x="54" y="201" font-weight="700" font-size="23">Шаг 1. Самопроверка (46–49)</text>
<text x="54" y="242">• Как я отношусь к срокам и качеству?</text>
<text x="54" y="275">• Могу ли доверять и делегировать?</text>
<text x="54" y="308">• Не мешает ли самолюбие признать чужой код?</text>
<rect x="738" y="158" width="672" height="175" rx="13" fill="#e3eff9"/>
<text x="762" y="201" font-weight="700" font-size="23">Шаг 2. Новая роль (49–50, 54)</text>
<text x="762" y="242">• Ценность труда — в работе коллектива.</text>
<text x="762" y="275">• Сохраняйте связь с ремеслом.</text>
<text x="762" y="308">• Увлечённость не заменяет ответственность.</text>
<rect x="30" y="359" width="672" height="212" rx="13" fill="#e3eff9"/>
<text x="54" y="401" font-weight="700" font-size="23">Шаг 3. Время и этапы (50–52)</text>
<text x="54" y="442">• Совещание: предмет, повестка, решения.</text>
<text x="54" y="475">• Планируйте достаточно, но без перегруза.</text>
<text x="54" y="508">• Проверяйте промежуточный прогресс.</text>
<text x="54" y="541">• 45 минут — совет автора, не регламент.</text>
<rect x="738" y="359" width="672" height="212" rx="13" fill="#e3eff9"/>
<text x="762" y="401" font-weight="700" font-size="23">Шаг 4. От идеи к реализации (52–54)</text>
<text x="762" y="442">• Сначала архитектура, потом технология.</text>
<text x="762" y="475">• Практичность и сопровождаемость.</text>
<text x="762" y="508">• Делегируйте и обучайте.</text>
<text x="762" y="541">• Документ → прототип → продукт.</text>
<rect x="30" y="598" width="672" height="200" rx="13" fill="#e3eff9"/>
<text x="54" y="640" font-weight="700" font-size="23">Шаг 5. Контроль себя (54–57)</text>
<text x="54" y="681">• Смотрите на результаты команды.</text>
<text x="54" y="714">• Не переносите свои слабости на нормы.</text>
<text x="54" y="747">• Читайте: навыки, кругозор, глубина, мудрость.</text>
<text x="54" y="776">• Учитесь у людей вне технологий.</text>
<rect x="738" y="598" width="672" height="200" rx="13" fill="#e3eff9"/>
<text x="762" y="640" font-weight="700" font-size="23">Шаг 6. Сверить с опытом (58–61)</text>
<text x="762" y="681">• 12 ответов автора на вопросы p. 47.</text>
<text x="762" y="714">• Дедлайн, качество, консенсус, коммуникация.</text>
<text x="762" y="747">• Кейс: не найти причину срыва — ошибка.</text>
<text x="762" y="776">• Искусственный срок p. 60: не универсален.</text>
<rect x="30" y="821" width="1380" height="122" rx="13" fill="#d5e6f4"/>
<text x="54" y="859" font-size="23" font-weight="700">Каждый день задайте семь вопросов самому себе (p. 62)</text>
<text x="54" y="897">Качество управления · прогресс · удовольствие · время · результаты команды · слабости · новые знания</text>
<text x="54" y="927" font-size="17">Формальные KPI и rollback организационных решений: [Needs confirmation]</text>
</g>
<text x="34" y="982" font-family="Arial,sans-serif" fill="#4f667c" font-size="17">Provenance: RAG p0046-c01…p0062-c01; заголовки с mojibake → source-findings.md; исходник не изменён.</text>
</svg>