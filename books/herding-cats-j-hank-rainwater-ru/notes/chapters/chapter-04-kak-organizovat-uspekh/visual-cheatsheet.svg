<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="735" viewBox="0 0 1240 735" role="img" aria-labelledby="ttl desc">
<title id="ttl">Глава 4 — Как организовать успех</title>
<desc id="desc">Компактная визуальная схема: от организации информации к действиям команды по RAG PDF 81–106.</desc>
<rect width="1240" height="735" fill="#f8fafc"/>
<rect x="26" y="24" width="1188" height="115" rx="15" fill="#17344b"/>
<text x="54" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Глава 4 · Как организовать успех</text>
<text x="54" y="109" font-family="Arial,sans-serif" font-size="20" fill="#d9ebf7">Информация → знания → действия → результат</text>
<g font-family="Arial,sans-serif" fill="#1b3b53" font-size="20">
<rect x="26" y="164" width="572" height="147" rx="14" fill="#e2eef7"/>
<text x="49" y="208" font-size="24" font-weight="bold">1. Организация информации</text>
<text x="49" y="246">Папки, источники и архивы</text>
<text x="49" y="279">PDF 82–85</text>
<rect x="642" y="164" width="572" height="147" rx="14" fill="#e2eef7"/>
<text x="665" y="208" font-size="24" font-weight="bold">2. Управление задачами</text>
<text x="665" y="246">Проект, источник, исполнитель</text>
<text x="665" y="279">Срок, статус, приоритет · 86–90</text>
<rect x="26" y="331" width="572" height="147" rx="14" fill="#e2eef7"/>
<text x="49" y="375" font-size="24" font-weight="bold">3. Пределы контроля</text>
<text x="49" y="413">Управляемое и внешние ожидания</text>
<text x="49" y="446">PDF 91–97</text>
<rect x="642" y="331" width="572" height="147" rx="14" fill="#e2eef7"/>
<text x="665" y="375" font-size="24" font-weight="bold">4. Компания и продукт</text>
<text x="665" y="413">Изменения, тестирование, среда</text>
<text x="665" y="446">PDF 98–105</text>
<rect x="26" y="498" width="1188" height="146" rx="14" fill="#daeaf4"/>
<text x="49" y="543" font-size="24" font-weight="bold">5. Итог — сделать работу выполнимой</text>
<text x="49" y="581">Сосредоточиться на контролируемом, сотрудничать и дробить большие задачи</text>
<text x="49" y="614">Явное заключение автора, PDF 105–106</text>
</g>
<text x="30" y="693" font-family="Arial,sans-serif" font-size="17" fill="#566c7f">Источник: RAG p0081-c01–p0106-c01 · детали рис. 4.1–4.3 требуют отдельной проверки</text>
</svg>