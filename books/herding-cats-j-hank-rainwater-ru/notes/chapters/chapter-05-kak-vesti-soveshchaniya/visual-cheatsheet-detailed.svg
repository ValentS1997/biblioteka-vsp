<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
<title id="title">Глава 5 — подробный визуальный конспект</title>
<desc id="desc">Роли совещаний, метод согласования, протокол и профессиональные ограничения по RAG p. 107–123.</desc>
<rect width="1500" height="1050" fill="#f8fafc"/>
<rect x="28" y="24" width="1444" height="115" rx="16" fill="#15344d"/>
<text x="55" y="72" font-size="34" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">Как вести совещания · глава 5</text>
<text x="55" y="113" font-size="20" font-family="Arial,sans-serif" fill="#d9e9f5">Консенсус и план действий — два результата любой встречи (p. 122)</text>
<g font-family="Arial,sans-serif" fill="#19364d" font-size="20">
<rect x="28" y="166" width="699" height="216" rx="13" fill="#e2edf7"/>
<text x="53" y="208" font-size="25" font-weight="bold">Еженедельная встреча · 107–110</text>
<text x="53" y="249">Что выполнено? Что будет сделано?</text>
<text x="53" y="284">Что препятствует сроку?</text>
<text x="53" y="319">Поручения письменно, результат конкретен</text>
<text x="53" y="354" font-size="17">45 минут — ориентир автора, не норматив</text>
<rect x="763" y="166" width="709" height="216" rx="13" fill="#e2edf7"/>
<text x="788" y="208" font-size="25" font-weight="bold">Проектное обсуждение · 110–115</text>
<text x="788" y="249">Сопоставить конкурирующие идеи</text>
<text x="788" y="284">Консенсус через синтез, не голосование</text>
<text x="788" y="319">Сохранять вовлечённость участников</text>
<text x="788" y="354" font-size="17">Кейс «Чужак» — риск изоляции специалиста</text>
<rect x="28" y="410" width="699" height="216" rx="13" fill="#e2edf7"/>
<text x="53" y="452" font-size="25" font-weight="bold">Протокол решения · 112–113</text>
<text x="53" y="493">Замечания и идеи</text>
<text x="53" y="528">Влияние на проектное решение</text>
<text x="53" y="563">Необходимые действия и итог</text>
<text x="53" y="598" font-size="17">Рис. 5.1 не доступен как изображение в RAG</text>
<rect x="763" y="410" width="709" height="216" rx="13" fill="#e2edf7"/>
<text x="788" y="452" font-size="25" font-weight="bold">Один на один и отделы · 116–119</text>
<text x="788" y="493">Индивидуальные препятствия и помощь</text>
<text x="788" y="528">Профессиональный, не личный разговор</text>
<text x="788" y="563">Бизнес-требования связать с разработкой</text>
<text x="788" y="598" font-size="17">Персональные записи — отдельная защита</text>
<rect x="28" y="654" width="699" height="217" rx="13" fill="#e2edf7"/>
<text x="53" y="696" font-size="25" font-weight="bold">Ретроспектива · 119–120</text>
<text x="53" y="737">Психологическая безопасность</text>
<text x="53" y="772">Семь вопросов: от требований до процесса</text>
<text x="53" y="807">Задача — уроки, а не поиск виноватых</text>
<text x="53" y="842" font-size="17">Реальные ответы требуют данных проекта</text>
<rect x="763" y="654" width="709" height="217" rx="13" fill="#e2edf7"/>
<text x="788" y="696" font-size="25" font-weight="bold">Телеконференция · 120–121</text>
<text x="788" y="737">Повестка, материалы и своевременный старт</text>
<text x="788" y="772">Молчание неизвестного участника ≠ согласие</text>
<text x="788" y="807">Рассылка протокола и действий</text>
<text x="788" y="842" font-size="17">Час — верхний ориентир автора</text>
<rect x="28" y="898" width="1444" height="85" rx="12" fill="#d7e9f5"/>
<text x="54" y="937" font-size="24" font-weight="bold">Подготовка → содержательная дискуссия → консенсус → действия → проверка</text>
<text x="54" y="970" font-size="17">Длительность, запись встреч и кадровые процедуры требуют организационной проверки.</text>
</g>
<text x="34" y="1021" font-family="Arial,sans-serif" font-size="16" fill="#536b80">Источник: p0107-c01–p0123-c01; не реконструкция оригинальных иллюстраций 5.1/5.2.</text>
</svg>