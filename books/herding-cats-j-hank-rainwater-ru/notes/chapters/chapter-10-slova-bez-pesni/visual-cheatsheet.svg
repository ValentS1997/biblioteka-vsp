<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Глава 10 — Слова без песни</title>
<desc id="desc">Компактное резюме шести тем финальной главы: распределённые команды, культуры, методологии, технологии, экономика, одиночество руководителя.</desc>
<rect width="1280" height="860" fill="#f7fafc"/>
<rect x="26" y="24" width="1228" height="126" rx="17" fill="#18384e"/>
<text x="52" y="78" font-size="33" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff">Глава 10 · Слова без песни</text>
<text x="52" y="118" font-size="21" font-family="Arial,sans-serif" fill="#dcebf4">Управленческий хаос требует разных инструментов</text>
<g font-family="Arial,sans-serif" fill="#183a4e" font-size="20">
<rect x="26" y="172" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="50" y="214" font-size="24" font-weight="bold">1 · Распределённые команды</text>
<text x="50" y="257">Уединение + сотрудничество</text>
<text x="50" y="292" font-size="17">План, интерфейсы, проверки · 206–210</text>
<rect x="669" y="172" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="693" y="214" font-size="24" font-weight="bold">2 · Культурная коммуникация</text>
<text x="693" y="257">Ясность и проверка понимания</text>
<text x="693" y="292" font-size="17">Не национальные ярлыки · 210–212</text>
<rect x="26" y="340" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="50" y="382" font-size="24" font-weight="bold">3 · Методы разработки</text>
<text x="50" y="425">MSF · XP · Agile · Мастерство</text>
<text x="50" y="460" font-size="17">Практическая адаптация · 213–221</text>
<rect x="669" y="340" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="693" y="382" font-size="24" font-weight="bold">4 · Технологические изменения</text>
<text x="693" y="425">Тренды, прототипы, стратегия</text>
<text x="693" y="460" font-size="17">Избегать рекламной шумихи · 221–223</text>
<rect x="26" y="508" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="50" y="550" font-size="24" font-weight="bold">5 · Экономика</text>
<text x="50" y="593">План/факт расходов, прибыльность</text>
<text x="50" y="628" font-size="17">Учитывать людей и риски · 223–224</text>
<rect x="669" y="508" width="585" height="146" rx="14" fill="#e0edf6"/>
<text x="693" y="550" font-size="24" font-weight="bold">6 · Развитие руководителя</text>
<text x="693" y="593">Исследования, управление, отношения</text>
<text x="693" y="628" font-size="17">Избегать изоляции · 224–226</text>
<rect x="26" y="678" width="1228" height="99" rx="13" fill="#d6e9f4"/>
<text x="50" y="718" font-size="25" font-weight="bold">«Финал» · 227: развивать команду, методы и себя</text>
<text x="50" y="750" font-size="18">Последняя нумерованная глава; p. 228 — отдельное послесловие</text>
</g>
<text x="32" y="828" font-family="Arial,sans-serif" font-size="17" fill="#536d7f">RAG p0205-c01–p0227-c01 · редакционный конспект, не авторский рисунок</text>
</svg>