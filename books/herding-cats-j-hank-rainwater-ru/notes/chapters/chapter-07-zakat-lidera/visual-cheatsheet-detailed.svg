<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1160" viewBox="0 0 1540 1160" role="img" aria-labelledby="title desc">
<title id="title">Глава 7 — подробный конспект негативных стилей руководства</title>
<desc id="desc">Симптомы, последствия, способы коррекции четырёх антипаттернов, сигналы перегрузки и шаги восстановления отношений и процессов, RAG PDF 147–166.</desc>
<rect width="1540" height="1160" fill="#f8fafc"/>
<rect x="28" y="24" width="1484" height="135" rx="17" fill="#17364c"/>
<text x="55" y="74" font-family="Arial,sans-serif" font-weight="bold" font-size="34" fill="#ffffff">Закат лидера · глава 7</text>
<text x="55" y="119" font-family="Arial,sans-serif" font-size="22" fill="#dbeaf7">Симптомы → вариации → исключения → решение (p. 149)</text>
<g font-family="Arial,sans-serif" fill="#19384e" font-size="20">
<rect x="28" y="184" width="712" height="213" rx="14" fill="#e0edf6"/>
<text x="55" y="229" font-weight="bold" font-size="26">Мелочная опека · 150–155</text>
<text x="55" y="271">Причина: недоверие, страх ошибки</text>
<text x="55" y="310">Риск: усталость и зависимость команды</text>
<text x="55" y="349">Рецепт: маленькие автономные задания</text>
<text x="55" y="381" font-size="17">Варианты: всезнайка, диктатор, генерал</text>
<rect x="776" y="184" width="736" height="213" rx="14" fill="#e0edf6"/>
<text x="803" y="229" font-weight="bold" font-size="26">Неорганизованность · 155–158</text>
<text x="803" y="271">Причина: откладывание, отвлечённость</text>
<text x="803" y="310">Риск: хаос, сроки и задачи без контроля</text>
<text x="803" y="349">Рецепт: текущие приоритеты и поддержка</text>
<text x="803" y="381" font-size="17">Варианты: Скарлетт, временщик, новичок</text>
<rect x="28" y="418" width="712" height="213" rx="14" fill="#e0edf6"/>
<text x="55" y="463" font-weight="bold" font-size="26">Гений не на месте · 158–160</text>
<text x="55" y="505">Причина: технологии в ущерб людям</text>
<text x="55" y="544">Риск: сложность и молчание команды</text>
<text x="55" y="583">Рецепт: администрирование, обучение</text>
<text x="55" y="615" font-size="17">Проверка: участие сотрудников в решениях</text>
<rect x="776" y="418" width="736" height="213" rx="14" fill="#e0edf6"/>
<text x="803" y="463" font-weight="bold" font-size="26">Строительство империй · 160–162</text>
<text x="803" y="505">Причина: личное влияние и политиканство</text>
<text x="803" y="544">Риск: изоляция отделов, нет консенсуса</text>
<text x="803" y="583">Рецепт: отказаться от интриг</text>
<text x="803" y="615" font-size="17">Клиенты и результат важнее фаворитов</text>
<rect x="28" y="654" width="1484" height="176" rx="14" fill="#e6edf2"/>
<text x="55" y="700" font-weight="bold" font-size="26">Ранние признаки упадка · 162–163</text>
<text x="55" y="743">Неэффективная переработка · потеря контроля над ролью · гнев от критики</text>
<text x="55" y="790">Автор: сообщить о перегрузке, получить помощь, не скрывать проблемы</text>
<rect x="28" y="850" width="1484" height="213" rx="14" fill="#d7e9f4"/>
<text x="55" y="895" font-weight="bold" font-size="26">Восстановление и профилактика · 163–166</text>
<text x="55" y="938">1. Признать ошибки и восстановить отношения с людьми</text>
<text x="55" y="976">2. Исправить нарушения процессов и снова соблюдать правила</text>
<text x="55" y="1015">3. Установить собственные первопричины; проверить результат</text>
<text x="55" y="1046" font-size="17">Таблица 7.3 сопоставляет последствия для менеджера, сотрудников и продукта</text>
</g>
<text x="35" y="1103" font-family="Arial,sans-serif" font-size="18" fill="#4c6779">RAG p0147-c01–p0166-c01 · Таблицы 7.1–7.3 частично повреждены кодировкой</text>
<text x="35" y="1137" font-family="Arial,sans-serif" font-size="16" fill="#4c6779">Схема — аналитический пересказ; не универсальная HR-политика.</text>
</svg>