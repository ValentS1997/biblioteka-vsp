<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="775" viewBox="0 0 1250 775" role="img" aria-labelledby="title desc">
<title id="title">Глава 6 — Философия и методы технического лидера</title>
<desc id="desc">Краткое резюме: бизнес-контекст, архитектура, нулевой этап, итерации и обзор кода; RAG PDF 124–146.</desc>
<rect width="1250" height="775" fill="#f7fafc"/>
<rect x="26" y="24" width="1198" height="132" rx="16" fill="#19374f"/>
<text x="50" y="76" font-size="30" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">Глава 6 · Техническое лидерство</text>
<text x="50" y="118" font-size="21" font-family="Arial,sans-serif" fill="#daebf7">Архитектура раньше деталей. Убеждения — в действия.</text>
<g font-family="Arial,sans-serif" fill="#16384f" font-size="20">
<rect x="26" y="179" width="568" height="145" rx="12" fill="#e0edf6"/>
<text x="49" y="218" font-size="24" font-weight="bold">1 · Архитектура · 125–132</text>
<text x="49" y="255">Ограничения, представления, риски</text>
<text x="49" y="288">Решения для повторного использования</text>
<rect x="654" y="179" width="570" height="145" rx="12" fill="#e0edf6"/>
<text x="676" y="218" font-size="24" font-weight="bold">2 · Нулевой этап · 133–134</text>
<text x="676" y="255">Проверить вертикальный прототип</text>
<text x="676" y="288">Заглушки и независимость компонентов</text>
<rect x="26" y="344" width="568" height="145" rx="12" fill="#e0edf6"/>
<text x="49" y="383" font-size="24" font-weight="bold">3 · Итерации · 134–137</text>
<text x="49" y="420">Учиться на обратной связи</text>
<text x="49" y="453">Стандарты, связность, малая зависимость</text>
<rect x="654" y="344" width="570" height="145" rx="12" fill="#e0edf6"/>
<text x="676" y="383" font-size="24" font-weight="bold">4 · Обзор кода · 139–143</text>
<text x="676" y="420">Объяснять причины и исправлять дефекты</text>
<text x="676" y="453">Учить коллег, а не заменять их работу</text>
<rect x="26" y="510" width="1198" height="146" rx="12" fill="#d5e8f4"/>
<text x="49" y="555" font-size="24" font-weight="bold">5 · Проверить лидерство · 145–146</text>
<text x="49" y="590">Расширяемость, поддержка чужого кода, конструктивная критика</text>
<text x="49" y="625">Не только знание, но отбор идей и их реализация</text>
</g>
<text x="32" y="706" font-family="Arial,sans-serif" font-size="17" fill="#506d82">Источник: RAG p0124-c01–p0146-c01 · метрики, команды и rollback: [Needs confirmation]</text>
<text x="32" y="740" font-family="Arial,sans-serif" font-size="16" fill="#506d82">Не копия исходных иллюстраций; авторские оценки технологий зависят от контекста книги.</text>
</svg>