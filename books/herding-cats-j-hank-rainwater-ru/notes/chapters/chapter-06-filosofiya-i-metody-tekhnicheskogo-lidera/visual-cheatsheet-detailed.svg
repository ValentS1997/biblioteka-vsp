<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1170" viewBox="0 0 1520 1170" role="img" aria-labelledby="ttl desc">
<title id="ttl">Глава 6 — подробная памятка технического лидера</title>
<desc id="desc">Архитектурные риски, пять аналитических позиций, нулевой этап, итеративная разработка, код-ревью и самопроверка по PDF 124–146.</desc>
<rect width="1520" height="1170" fill="#f8fafc"/>
<rect x="26" y="24" width="1468" height="123" rx="15" fill="#16374f"/>
<text x="53" y="72" font-size="33" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">Философия и методы технического лидера</text>
<text x="53" y="118" font-size="22" font-family="Arial,sans-serif" fill="#d8eafa">Приоритет архитектуры → проверка → развитие → качество</text>
<g font-family="Arial,sans-serif" fill="#17374f" font-size="20">
<rect x="26" y="174" width="707" height="209" rx="14" fill="#e2edf6"/>
<text x="53" y="216" font-size="25" font-weight="bold">1. Роль и архитектура · 124–129</text>
<text x="53" y="255">Лидер отвечает за системные решения</text>
<text x="53" y="291">Архитектура — повторное использование</text>
<text x="53" y="325">проектных решений, не только кода</text>
<text x="53" y="358" font-size="17">Риск: негибкость и высокая цена сопровождения</text>
<rect x="768" y="174" width="726" height="209" rx="14" fill="#e2edf6"/>
<text x="795" y="216" font-size="25" font-weight="bold">2. Ограничения и взгляды · 129–131</text>
<text x="795" y="255">Пользователь, компонент, взаимодействие</text>
<text x="795" y="291">Технология, поставка — пять позиций</text>
<text x="795" y="325">Изменения, инфраструктура, квалификация</text>
<text x="795" y="358" font-size="17">Zachman, ODP, 4+1 — названия из источника</text>
<rect x="26" y="408" width="707" height="209" rx="14" fill="#e2edf6"/>
<text x="53" y="450" font-size="25" font-weight="bold">3. «Нулевой» этап · 132–134</text>
<text x="53" y="489">Вертикальный прототип из заглушек</text>
<text x="53" y="525">Проверить независимость подсистем</text>
<text x="53" y="561">Понятность и настраиваемость серверов</text>
<text x="53" y="593" font-size="17">Не откладывать проверку до бета-тестирования</text>
<rect x="768" y="408" width="726" height="209" rx="14" fill="#e2edf6"/>
<text x="795" y="450" font-size="25" font-weight="bold">4. Итерации и дисциплина · 134–137</text>
<text x="795" y="489">Реакция на отзывы и бизнес-изменения</text>
<text x="795" y="525">Стандарты языка и связность объектов</text>
<text x="795" y="561">Ограничить взаимозависимость</text>
<text x="795" y="593" font-size="17">Метафора «выращивания» не заменяет проект</text>
<rect x="26" y="642" width="707" height="221" rx="14" fill="#e2edf6"/>
<text x="53" y="684" font-size="25" font-weight="bold">5. «Кодовая полиция» · 139–143</text>
<text x="53" y="725">Критические обзоры как обучение</text>
<text x="53" y="761">Комментарии объясняют «почему»</text>
<text x="53" y="797">Имена, обработка ошибок, зависимости</text>
<text x="53" y="833" font-size="17">Исправлять недостатки силами команды</text>
<rect x="768" y="642" width="726" height="221" rx="14" fill="#e2edf6"/>
<text x="795" y="684" font-size="25" font-weight="bold">6. Философия в действии · 143–145</text>
<text x="795" y="725">Знание без действий не приносит результата</text>
<text x="795" y="761">Наблюдать, учиться на ошибках</text>
<text x="795" y="797">Баланс анализа, творчества и системы</text>
<text x="795" y="833" font-size="17">Леонардо — пример, пересказанный автором</text>
<rect x="26" y="890" width="1468" height="182" rx="14" fill="#d9eaf5"/>
<text x="53" y="936" font-size="26" font-weight="bold">7. «Перспективы»: самопроверка · 145–146</text>
<text x="53" y="975">Лидерство · расширяемая архитектура · повторное использование</text>
<text x="53" y="1009">Недочёты кода · квалификация людей · практические действия</text>
<text x="53" y="1043" font-size="17">Критерии проекта, команда/среда и rollback: [Needs confirmation]</text>
</g>
<text x="34" y="1123" font-family="Arial,sans-serif" font-size="17" fill="#50687c">RAG p0124-c01–p0146-c01 · Визуальный синтез главы, не схема автора</text>
</svg>