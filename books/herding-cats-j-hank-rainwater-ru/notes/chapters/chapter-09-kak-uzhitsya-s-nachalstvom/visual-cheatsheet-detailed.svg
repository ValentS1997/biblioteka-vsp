<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1190" viewBox="0 0 1560 1190" role="img" aria-labelledby="t d">
<title id="t">Глава 9 — подробный конспект отношений с начальством</title>
<desc id="d">Шесть авторских рекомендаций резюме и опорные разделы: иерархия, честность, проектные планы, пределы знаний, реакция на неожиданности и инерцию, потребности клиента.</desc>
<rect width="1560" height="1190" fill="#f8fafc"/>
<rect x="27" y="26" width="1506" height="128" rx="16" fill="#17364e"/>
<text x="56" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Как ужиться с начальством · Глава 9</text>
<text x="56" y="120" font-family="Arial,sans-serif" font-size="21" fill="#dceaf5">Шесть рекомендаций авторского «Резюме», PDF p. 204</text>
<g font-family="Arial,sans-serif" fill="#1a3b50" font-size="20">
<rect x="27" y="178" width="729" height="214" rx="14" fill="#e0edf6"/>
<text x="56" y="221" font-size="26" font-weight="bold">1. Понять ответственность · 193–195</text>
<text x="56" y="265">Начальство отвечает за большее число задач</text>
<text x="56" y="306">Уважать давление, предлагать аргументы</text>
<text x="56" y="353" font-size="17">Результат важнее утешающих обещаний</text>
<rect x="792" y="178" width="741" height="214" rx="14" fill="#e0edf6"/>
<text x="821" y="221" font-size="26" font-weight="bold">2. Честность · 195–197</text>
<text x="821" y="265">Не обещать невозможное</text>
<text x="821" y="306">Выявлять неполные требования и риски</text>
<text x="821" y="353" font-size="17">Не терять репутацию из-за красивых сроков</text>
<rect x="27" y="418" width="729" height="214" rx="14" fill="#e0edf6"/>
<text x="56" y="461" font-size="26" font-weight="bold">3. Совместное планирование · 197–199</text>
<text x="56" y="505">Стратегический ориентир → план инженера</text>
<text x="56" y="546">Дисциплина, компетентность, усилие команды</text>
<text x="56" y="593" font-size="17">Разработка и тестирование входят в сроки</text>
<rect x="792" y="418" width="741" height="214" rx="14" fill="#e0edf6"/>
<text x="821" y="461" font-size="26" font-weight="bold">4. Признать пробелы · 199–200</text>
<text x="821" y="505">Не знать — допустимо; блефовать — риск</text>
<text x="821" y="546">Стратегия начальницы + тактика лидера</text>
<text x="821" y="593" font-size="17">Игровые уровни в книге — только метафора</text>
<rect x="27" y="658" width="729" height="214" rx="14" fill="#e0edf6"/>
<text x="56" y="701" font-size="26" font-weight="bold">5. Быть готовым · 200–202</text>
<text x="56" y="745">Обновлять знания и оценивать инструменты</text>
<text x="56" y="786">Оповещать о неожиданных рисках заранее</text>
<text x="56" y="833" font-size="17">Не объявлять предположения фактами</text>
<rect x="792" y="658" width="741" height="214" rx="14" fill="#e0edf6"/>
<text x="821" y="701" font-size="26" font-weight="bold">6. Преодолеть инерцию · 201–203</text>
<text x="821" y="745">Сравнивать рынок и стратегию компании</text>
<text x="821" y="786">Пробовать методы; проверять пользу</text>
<text x="821" y="833" font-size="17">Потребности клиента выше любимого стека</text>
<rect x="27" y="896" width="1506" height="179" rx="14" fill="#d7eaf4"/>
<text x="56" y="942" font-size="26" font-weight="bold">Практическая проверка: требования → проект → макет → план → тесты</text>
<text x="56" y="990">Сообщать руководству основания, риски, неопределённость и отклонения</text>
<text x="56" y="1037" font-size="18">Взаимное уважение — заключительный принцип автора (p. 204)</text>
</g>
<text x="36" y="1116" font-family="Arial,sans-serif" font-size="18" fill="#526d80">RAG p0193-c01–p0204-c01. Иллюстрация редакционная; не готовый корпоративный регламент.</text>
<text x="36" y="1150" font-family="Arial,sans-serif" font-size="16" fill="#526d80">Цифры экономии 10% и 20% на p. 202 — пример, не подтверждённые результаты; KPI и rollback: [Needs confirmation].</text>
</svg>