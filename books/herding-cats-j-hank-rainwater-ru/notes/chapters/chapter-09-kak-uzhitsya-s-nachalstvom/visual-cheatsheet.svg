<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="t d">
<title id="t">Глава 9 — Как ужиться с начальством</title>
<desc id="d">Компактный пересказ: уважение и честность, реалистичные планы, знание своего потолка, готовность к изменениям и приоритет клиента, RAG PDF 193–204.</desc>
<rect width="1280" height="825" fill="#f6f9fc"/>
<rect x="26" y="24" width="1228" height="128" rx="17" fill="#173750"/>
<text x="52" y="77" font-family="Arial,sans-serif" font-weight="bold" font-size="33" fill="#fff">Глава 9 · Как ужиться с начальством</text>
<text x="52" y="118" font-family="Arial,sans-serif" font-size="21" fill="#dcebf7">Сильный технический лидер умеет и руководить, и следовать</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#173a50">
<rect x="26" y="182" width="588" height="151" rx="14" fill="#dceaf6"/>
<text x="51" y="226" font-weight="bold" font-size="24">1 · Учитывать положение начальства</text>
<text x="51" y="267">Понимать ответственность и давление</text>
<text x="51" y="300" font-size="17">PDF 193–195</text>
<rect x="666" y="182" width="588" height="151" rx="14" fill="#dceaf6"/>
<text x="691" y="226" font-weight="bold" font-size="24">2 · Быть честным со сроками</text>
<text x="691" y="267">Требования → проект → макет → план</text>
<text x="691" y="300" font-size="17">PDF 195–197</text>
<rect x="26" y="353" width="588" height="151" rx="14" fill="#dceaf6"/>
<text x="51" y="397" font-weight="bold" font-size="24">3 · Помогать планировать</text>
<text x="51" y="438">Стратегия начальства + инженерные детали</text>
<text x="51" y="471" font-size="17">PDF 197–199</text>
<rect x="666" y="353" width="588" height="151" rx="14" fill="#dceaf6"/>
<text x="691" y="397" font-weight="bold" font-size="24">4 · Знать свой потолок</text>
<text x="691" y="438">Признать пределы знаний, не блефовать</text>
<text x="691" y="471" font-size="17">PDF 199–200</text>
<rect x="26" y="524" width="1228" height="153" rx="14" fill="#d5e8f3"/>
<text x="51" y="568" font-weight="bold" font-size="24">5 · Готовиться к изменениям и заботиться о клиенте</text>
<text x="51" y="609">Следить за рынком, предупреждать об инерции, пробовать методы</text>
<text x="51" y="645" font-size="17">PDF 200–203 · Авторское резюме на p. 204</text>
</g>
<text x="32" y="725" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#29495e">Правило: относиться к начальству так, как хотели бы, чтобы относились к вам.</text>
<text x="32" y="780" font-family="Arial,sans-serif" font-size="17" fill="#50697a">Основа: RAG p0193-c01–p0204-c01 · схема не является оригинальным рисунком.</text>
</svg>