<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880" role="img" aria-labelledby="ttl desc">
<title id="ttl">Глава 8 — Восход лидера</title>
<desc id="desc">Компактная схема пяти фундаментальных принципов и пяти элементов надстройки лидерства из главы 8, PDF p. 167–192.</desc>
<rect width="1300" height="880" fill="#f7fafc"/>
<rect x="26" y="24" width="1248" height="125" rx="16" fill="#173b52"/>
<text x="55" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Глава 8 · Восход лидера</text>
<text x="55" y="118" font-family="Arial,sans-serif" font-size="20" fill="#dceaf6">Фундамент характера → пять принципов → развитие команды</text>
<g font-family="Arial,sans-serif" fill="#1a3a4f">
<text x="32" y="194" font-size="25" font-weight="bold">Пять фундаментальных принципов · PDF 168–176, 191</text>
<rect x="26" y="215" width="390" height="132" rx="12" fill="#e0edf6"/>
<text x="49" y="258" font-size="24" font-weight="bold">1. Понимание</text>
<text x="49" y="298" font-size="20">Цель, требования, план</text>
<rect x="455" y="215" width="390" height="132" rx="12" fill="#e0edf6"/>
<text x="478" y="258" font-size="24" font-weight="bold">2. Передача знаний</text>
<text x="478" y="298" font-size="20">Объяснение, макеты</text>
<rect x="884" y="215" width="390" height="132" rx="12" fill="#e0edf6"/>
<text x="907" y="258" font-size="24" font-weight="bold">3. Делегирование</text>
<text x="907" y="298" font-size="20">Задачи и ответственность</text>
<rect x="26" y="368" width="603" height="132" rx="12" fill="#e0edf6"/>
<text x="50" y="411" font-size="24" font-weight="bold">4. Проверка</text>
<text x="50" y="451" font-size="20">Сборки, тесты и обратная связь</text>
<rect x="667" y="368" width="607" height="132" rx="12" fill="#e0edf6"/>
<text x="691" y="411" font-size="24" font-weight="bold">5. Участие</text>
<text x="691" y="451" font-size="20">Помощь команде без микроменеджмента</text>
<text x="32" y="548" font-size="25" font-weight="bold">Пять элементов «надстройки» · PDF 177–182, 191</text>
<rect x="26" y="568" width="1248" height="147" rx="12" fill="#d9eaf4"/>
<text x="52" y="616" font-size="23" font-weight="bold">Наставничество · Вознаграждение · Исправление</text>
<text x="52" y="661" font-size="23" font-weight="bold">Предвидение · Адаптация</text>
<rect x="26" y="737" width="1248" height="78" rx="12" fill="#e5eef5"/>
<text x="50" y="786" font-size="22" font-weight="bold">Принципы закрепляются действиями, не декларациями · 190–191</text>
</g>
<text x="31" y="855" font-family="Arial,sans-serif" font-size="17" fill="#506879">Источник: RAG p0167-c01–p0192-c01 · это конспект, не копия рис. 8.1</text>
</svg>