<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" role="img" aria-labelledby="ttl desc">
<title id="ttl">Глава 8 — подробная памятка по конструктивному лидерству</title>
<desc id="desc">Пять фундаментальных принципов, пять элементов надстройки, мотивация следования за лидером, адаптация и практическое резюме Рейнвотера по PDF p. 167–192.</desc>
<rect width="1560" height="1180" fill="#f8fafc"/>
<rect x="24" y="24" width="1512" height="122" rx="17" fill="#17364e"/>
<text x="55" y="76" font-family="Arial,sans-serif" font-weight="bold" font-size="35" fill="#ffffff">Восход лидера · Глава 8</text>
<text x="55" y="118" font-family="Arial,sans-serif" font-size="21" fill="#e0edf6">Характер лидера + освоенные навыки + действие в интересах команды</text>
<g font-family="Arial,sans-serif" fill="#17374d" font-size="20">
<rect x="24" y="172" width="732" height="199" rx="13" fill="#e1edf7"/>
<text x="51" y="215" font-size="26" font-weight="bold">1. Понимание · 168–170</text>
<text x="51" y="255">Прочитать требования дважды</text>
<text x="51" y="293">Различить известное и новое</text>
<text x="51" y="331">Макет + контрольный список задач</text>
<rect x="792" y="172" width="744" height="199" rx="13" fill="#e1edf7"/>
<text x="819" y="215" font-size="26" font-weight="bold">2. Передача знаний · 170–172</text>
<text x="819" y="255">Донести смысл требований до команды</text>
<text x="819" y="293">Пояснять, аргументировать, обсуждать</text>
<text x="819" y="331">Макет и обзор как средство обучения</text>
<rect x="24" y="396" width="732" height="199" rx="13" fill="#e1edf7"/>
<text x="51" y="439" font-size="26" font-weight="bold">3. Делегирование · 172–173</text>
<text x="51" y="479">Модули, задания, подходящие люди</text>
<text x="51" y="517">Пары и группы — по потребности</text>
<text x="51" y="555">Не заменять собою исполнителя</text>
<rect x="792" y="396" width="744" height="199" rx="13" fill="#e1edf7"/>
<text x="819" y="439" font-size="26" font-weight="bold">4. Проверка · 173–175</text>
<text x="819" y="479">Регулярно собирать и тестировать</text>
<text x="819" y="517">Проверять прогресс и интеграцию</text>
<text x="819" y="555">Документировать результат тестирования</text>
<rect x="24" y="620" width="732" height="192" rx="13" fill="#e1edf7"/>
<text x="51" y="663" font-size="26" font-weight="bold">5. Участие · 175–176</text>
<text x="51" y="703">Помогать в тестировании и кодировании</text>
<text x="51" y="741">Не терять фокус и ресурс внимания</text>
<text x="51" y="779">Делиться трудностями и победами</text>
<rect x="792" y="620" width="744" height="192" rx="13" fill="#d9eaf4"/>
<text x="819" y="663" font-size="26" font-weight="bold">Надстройка · 177–182</text>
<text x="819" y="703">Наставничество · Вознаграждение</text>
<text x="819" y="741">Исправление · Предвидение</text>
<text x="819" y="779">Адаптация: вопросы и эксперименты</text>
<rect x="24" y="837" width="1512" height="221" rx="13" fill="#e3edf4"/>
<text x="51" y="880" font-size="26" font-weight="bold">Почему идут за лидером? · 182–185</text>
<text x="51" y="924">Принуждение · Долг · Восхищение · Вознаграждение · Знание</text>
<text x="51" y="964">У автора принуждение — крайнее средство, поощрение — краткосрочное</text>
<text x="51" y="1004">Возраст не ограничивает обучение; форма должна иметь содержание · 185–190</text>
<text x="51" y="1038" font-size="18">Авторское «Резюме»: навыки реализуются и развиваются на практике (p. 190–191)</text>
</g>
<text x="32" y="1101" font-family="Arial,sans-serif" font-size="18" fill="#486479">Источник: RAG p0167-c01–p0192-c01. Рис. 8.1 и табл. 8.1 частично недоступны из-за извлечения.</text>
<text x="32" y="1137" font-family="Arial,sans-serif" font-size="16" fill="#486479">Эта схема — редакционный конспект, не оригинальный рисунок; KPI, HR-правила и rollback: [Needs confirmation].</text>
</svg>