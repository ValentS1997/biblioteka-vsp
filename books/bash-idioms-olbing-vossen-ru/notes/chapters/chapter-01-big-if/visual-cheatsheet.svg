<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img" aria-label="Глава 1: Идиома большого if"><rect width="1000" height="545" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#17243a}.body{font-size:17px;fill:#334155}.code{font-size:22px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="45" y="57" class="head">Глава 1 • Идиома «большого» if</text><text x="45" y="88" class="small">Условное выполнение по статусу команды • PDF 21–29</text><rect x="44" y="119" width="436" height="174" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="71" y="160" class="title">&amp;&amp; — ветка успеха</text><text x="71" y="204" class="code">A &amp;&amp; B</text><text x="71" y="240" class="body">B выполнится при успехе A</text><text x="71" y="267" class="body">Иначе B пропускается</text><rect x="520" y="119" width="436" height="174" rx="16" fill="#fff1ed" stroke="#f2b7a8" stroke-width="1.4"/><text x="548" y="160" class="title">|| — ветка ошибки</text><text x="548" y="204" class="code">A || B</text><text x="548" y="240" class="body">B выполнится при неуспехе A</text><text x="548" y="267" class="body">Иначе B пропускается</text><rect x="44" y="319" width="912" height="152" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="72" y="360" class="title">Ключевые границы</text><text x="72" y="398" class="body">&amp;&amp; и || равноприоритетны: слева направо.</text><text x="72" y="425" class="body">Несколько команд: { echo ... ; exit ; }, а не ; exit вне группы.</text><text x="72" y="452" class="body">Простая проверка → краткая идиома; сложная логика → явный if.</text><text x="45" y="520" class="small">Основание: RAG p0021:c01–p0029:c01 • PDF 21–29</text></svg>