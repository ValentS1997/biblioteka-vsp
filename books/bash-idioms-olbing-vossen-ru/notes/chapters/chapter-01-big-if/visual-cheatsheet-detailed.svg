<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-label="Глава 1: Идиома большого if"><rect width="1200" height="1010" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#17243a}.body{font-size:17px;fill:#334155}.code{font-size:22px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="43" y="60" class="head">Глава 1 • Условное выполнение в Bash</text><text x="43" y="88" class="small">Подробная памятка по разделам главы • RAG-only</text><rect x="38" y="113" width="540" height="218" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="62" y="150" class="title">1 · Условие и ветка успеха</text><text x="62" y="195" class="code">[[ -n &quot;$DIR&quot; ]] &amp;&amp; cd &quot;$DIR&quot;</text><text x="62" y="234" class="body">Непустой DIR → попытка cd.</text><text x="62" y="261" class="body">При ложной проверке cd пропускается.</text><text x="62" y="288" class="body">Успех проверки не гарантирует успех cd.</text><rect x="620" y="113" width="540" height="218" rx="16" fill="#fff1ed" stroke="#f2b7a8" stroke-width="1.4"/><text x="645" y="150" class="title">2 · Условие и ветка ошибки</text><text x="645" y="195" class="code">[[ -z &quot;$DIR&quot; ]] || cd &quot;$DIR&quot;</text><text x="645" y="234" class="body">Пустой DIR → правая часть пропускается.</text><text x="645" y="261" class="body">Непустой DIR → попытка cd.</text><text x="645" y="288" class="body">Статус первой команды управляет второй.</text><rect x="38" y="351" width="1122" height="197" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="63" y="389" class="title">3 · Группировка команд справа от ||</text><text x="63" y="432" class="code">cd /tmp || { echo &quot;cd to /tmp failed.&quot; ; exit ; }</text><text x="63" y="470" class="body">Группа { ... ; } выполняется только при ошибке cd.</text><text x="63" y="497" class="body">Без скобок: cd /tmp || echo ... ; exit — exit выполнится всегда.</text><rect x="38" y="567" width="540" height="203" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="63" y="608" class="title">4 · Приоритет и порядок</text><text x="63" y="650" class="code">A &amp;&amp; B || C</text><text x="63" y="687" class="body">&amp;&amp; и || имеют равный приоритет.</text><text x="63" y="714" class="body">Цепочки вычисляются слева направо.</text><text x="63" y="741" class="body">Анализируйте статус каждой команды.</text><rect x="620" y="567" width="540" height="203" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="645" y="608" class="title">5 · Проверки строк</text><text x="645" y="650" class="code">[[ -z &quot;$VAR&quot; ]]</text><text x="645" y="687" class="body">Ключи -z и -n вместо старых трюков.</text><text x="645" y="714" class="body">В Bash рекомендуются [[ ... ]].</text><text x="645" y="741" class="body">Для совместимости с sh бывают нужны [ ... ].</text><rect x="38" y="790" width="1122" height="143" rx="16" fill="#fff8e7" stroke="#e1bf6b" stroke-width="1.4"/><text x="63" y="831" class="title">6 · Риски выполнения</text><text x="63" y="866" class="body">cd меняет каталог; rm удаляет файлы; exit завершает сценарий.</text><text x="63" y="893" class="body">Контекст, проверка результата и rollback: [Needs confirmation].</text><text x="43" y="975" class="small">Источник: PDF 21–29 • RAG p0021:c01–p0029:c01 • книга 0032</text></svg>