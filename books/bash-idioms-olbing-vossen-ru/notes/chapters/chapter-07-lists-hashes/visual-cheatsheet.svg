<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="Глава 7 Списки и хеши компактная памятка"><rect width="1120" height="700" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:31px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#19344e}.body{font-size:18px;fill:#334155}.code{font-size:21px;font-weight:bold;fill:#16415f}.small{font-size:14px;fill:#475569}</style><text x="42" y="56" class="head">Глава 7 · Списки и хеши</text><text x="42" y="87" class="small">Bash: индексы, ключи, подстановки и частоты · PDF 94–110</text><rect x="36" y="110" width="512" height="191" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="63" y="154" class="title">Индексированный список</text><text x="63" y="196" class="code">declare -a mylist</text><text x="63" y="225" class="code">mylist+=(&quot;five by five&quot;)</text><text x="63" y="254" class="code">&quot;${mylist[@]}&quot; → по элементам</text><text x="63" y="283" class="code">${!mylist[@]} → индексы</text><rect x="572" y="110" width="512" height="191" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="599" y="154" class="title">Ассоциативный хеш</text><text x="599" y="196" class="code">declare -A myhash</text><text x="599" y="225" class="code">myhash[key]='value'</text><text x="599" y="254" class="code">&quot;${!myhash[@]}&quot; → ключи</text><text x="599" y="283" class="code">${#myhash[@]} → число ключей</text><rect x="36" y="323" width="1048" height="174" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="63" y="365" class="title">Кавычки определяют границы элементов</text><text x="63" y="405" class="body">&quot;${name[@]}&quot; — каждый элемент сохраняется отдельно, включая пробелы.</text><text x="63" y="433" class="body">&quot;${name[*]}&quot; — все элементы объединяются в одну строку.</text><text x="63" y="461" class="body">Для обычного обхода авторы предпочитают [@] вместо [*].</text><rect x="36" y="520" width="1048" height="108" rx="16" fill="#fff8e7" stroke="#dbb86d" stroke-width="1.4"/><text x="63" y="561" class="title">Осторожно: unset и файловый пример 7.5</text><text x="63" y="596" class="body">/tmp/words.txt перезаписывается, trap может удалить его.</text><text x="63" y="622" class="body">Без проверки целевых данных и rollback запуск запрещён.</text><text x="42" y="676" class="small">RAG p0094:c01–p0110:c01 · главы 7 · v1.7</text></svg>