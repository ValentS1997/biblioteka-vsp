<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="1315" viewBox="0 0 1310 1315" role="img" aria-label="Глава 7 Списки и хеши подробная памятка"><rect width="1310" height="1315" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#173653}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#153e5b}.small{font-size:14px;fill:#475569}</style><text x="43" y="55" class="head">Глава 7 · Массивы Bash: списки и хеши</text><text x="43" y="85" class="small">RAG-only · PDF 94–110 · 17 адресуемых чанков</text><rect x="38" y="111" width="603" height="215" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="64" y="152" class="title">1 · Списки — числовые индексы</text><text x="64" y="193" class="code">declare -a mylist</text><text x="64" y="231" class="body">mylist[0]='foo'</text><text x="64" y="259" class="body">mylist+=(&quot;five by five&quot;)</text><text x="64" y="287" class="body">Срез: &quot;${mylist[@]:5:2}&quot;</text><text x="64" y="315" class="body">Удаление элемента: unset -v 'mylist[2]'</text><rect x="664" y="111" width="608" height="215" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="689" y="152" class="title">2 · Хеши — строковые ключи</text><text x="689" y="193" class="code">declare -A myhash</text><text x="689" y="231" class="body">myhash[a]='foo'</text><text x="689" y="259" class="body">Доступ: ${myhash[a]}</text><text x="689" y="287" class="body">Ключи: &quot;${!myhash[@]}&quot;</text><text x="689" y="315" class="body">Порядок ключей не фиксирован</text><rect x="38" y="352" width="603" height="211" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="391" class="title">3 · Кавычки и массивы</text><text x="64" y="432" class="code">&quot;${name[@]}&quot; ≠ &quot;${name[*]}&quot;</text><text x="64" y="475" class="body">quoted @ → аргумент на каждый элемент</text><text x="64" y="503" class="body">quoted * → одна объединённая строка</text><text x="64" y="531" class="body">Без кавычек: разделение строк на слова</text><rect x="664" y="352" width="608" height="211" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="689" y="391" class="title">4 · Диагностика и соединение</text><text x="689" y="432" class="code">declare -p / printf '%q|'</text><text x="689" y="475" class="body">Видны значение, экранирование и границы</text><text x="689" y="503" class="body">Join с локальным IFS использует &quot;$*&quot;</text><text x="689" y="531" class="body">String_Join допускает длинный delimiter</text><rect x="38" y="588" width="603" height="213" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="627" class="title">5 · Добавление и удаление</text><text x="64" y="669" class="code">mylist=(&quot;${mylist[@]:1}&quot;)</text><text x="64" y="709" class="body">Срез меняет список только при присваивании.</text><text x="64" y="737" class="body">unset -v 'mylist[-1]' — Bash 4.3+.</text><text x="64" y="765" class="body">unset -v myhash удаляет всю переменную.</text><rect x="664" y="588" width="608" height="213" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="689" y="627" class="title">6 · Подсчёт слов (пример 7.5)</text><text x="689" y="669" class="code">(( myhash[$line]++ ))</text><text x="689" y="709" class="body">Сгенерировать слова, записать в файл.</text><text x="689" y="737" class="body">Прочитать строки и увеличить счётчики.</text><text x="689" y="765" class="body">Перебрать ключи, отсортировать вывод.</text><rect x="38" y="827" width="1234" height="252" rx="16" fill="#fff8e7" stroke="#dbb86d" stroke-width="1.3"/><text x="64" y="869" class="title">7 · Риски и контроль состояния</text><text x="64" y="911" class="body">Фиксированный /tmp/words.txt обнуляется, а trap выполняет rm -f.</text><text x="64" y="939" class="body">Не воспроизводить пример 7.5 без согласования пути и резервной копии.</text><text x="64" y="967" class="body">Ассоциативные массивы: Bash 4.0+, массивы не стандартизованы POSIX.</text><text x="64" y="995" class="body">Точное сокращение с $$RANDOM в комментарии: [Needs confirmation].</text><text x="64" y="1023" class="body">Восстановление удалённых элементов: [Needs confirmation].</text><rect x="38" y="1103" width="1234" height="124" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="1148" class="title">Рекомендация главы: сначала выбрать правильную структуру данных.</text><text x="64" y="1181" class="body">Для обычного обхода почти всегда использовать [@], а не [*].</text><text x="64" y="1204" class="small">См. source-findings.md и команды перед практическим применением.</text><text x="45" y="1285" class="small">Источник: bash-idioms-olbing-vossen-ru · p0094:c01–p0110:c01 · v1.7</text></svg>