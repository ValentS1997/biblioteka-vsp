<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-label="Глава 11 Разработка собственного руководства по стилю"><rect width="1120" height="760" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-weight:700;font-size:29px;fill:#162941}.sub{font-size:14px;fill:#526172}.sec{font-size:21px;font-weight:700;fill:#193e55}.body{font-size:18px;fill:#35475c}.code{font-size:20px;font-weight:700;fill:#153b54}</style><text x="42" y="55" class="head">Глава 11 · Собственное руководство по стилю</text><text x="42" y="83" class="sub">Принципы KISS / DRY · PDF 175–192 · RAG-only</text><rect x="37" y="108" width="510" height="202" rx="14" fill="#e5f3ee" stroke="#bfcdd8"/><text x="64" y="149" class="sec">Пишем понятно</text><text x="64" y="189" class="body">Говорящие имена и заголовки</text><text x="64" y="220" class="body">Комментарии: объясняйте почему</text><text x="64" y="251" class="body">Функции: контракт, local, повторное</text><text x="64" y="282" class="body">Существующий проект: свой стиль</text><rect x="574" y="108" width="508" height="202" rx="14" fill="#e4eff9" stroke="#bfcdd8"/><text x="601" y="149" class="sec">Синтаксис Bash</text><text x="601" y="189" class="body">[[ ]]   — строковые условия</text><text x="601" y="220" class="body">$( )     — подстановка команды</text><text x="601" y="251" class="body">(( ))   — арифметическая команда</text><text x="601" y="282" class="body">set -euo pipefail — с проверкой</text><rect x="37" y="334" width="1045" height="195" rx="14" fill="#fff" stroke="#bfcdd8"/><text x="64" y="375" class="sec">Оформление</text><text x="64" y="417" class="body">Глобальные имена: UPPER_CASE · остальные: lower_case · функции: Mixed_Case</text><text x="64" y="448" class="body">Отступы: 4 пробела, продолжение: ещё 2; длина строки около 78</text><text x="64" y="479" class="body">Кавычки защищают значения; не усложняйте выражения без пользы</text><rect x="37" y="551" width="1045" height="140" rx="14" fill="#fff4de" stroke="#bfcdd8"/><text x="64" y="591" class="sec">Ограничения и риски</text><text x="64" y="625" class="body">Bash style ≠ POSIX sh. Не запускать книжный шаблон с заглушками.</text><text x="64" y="656" class="body">Рискованные примеры удаления — антипаттерны, а не инструкции.</text><text x="43" y="736" class="sub">p0175:c01–p0192:c01 · v1.7 · reading status без изменений</text></svg>
