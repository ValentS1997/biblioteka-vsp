<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1490" viewBox="0 0 1280 1490" role="img" aria-label="Подробная памятка главы 11 о руководстве по стилю"><rect width="1280" height="1490" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#243e56}.head{font-weight:bold;font-size:31px}.label{font-weight:bold;font-size:21px}.body{font-size:18px}.small{font-size:14px}</style><text x="40" y="57" class="head">Глава 11 · Руководство по стилю Bash</text><text x="40" y="87" class="small">Положения авторов, а не обязательный стандарт для любого проекта</text><rect x="38" y="116" width="1204" height="102" rx="14" fill="#e5f3ee" stroke="#cbd5df"/><text x="66" y="156" class="label">1. Ключевые идеи</text><text x="66" y="188" class="body">KISS, DRY; история в системе контроля версий</text><rect x="38" y="232" width="1204" height="102" rx="14" fill="#e7eff8" stroke="#cbd5df"/><text x="66" y="272" class="label">2. Удобочитаемость</text><text x="66" y="304" class="body">Документируйте почему; добавляйте -h / --help</text><rect x="38" y="348" width="1204" height="102" rx="14" fill="#e5f3ee" stroke="#cbd5df"/><text x="66" y="388" class="label">3. Имена</text><text x="66" y="420" class="body">Глобальные UPPER; локальные lower; функции Mixed_Case</text><rect x="38" y="464" width="1204" height="102" rx="14" fill="#e7eff8" stroke="#cbd5df"/><text x="66" y="504" class="label">4. Функции</text><text x="66" y="536" class="body">Сначала определение; затем вызов. Описывайте контракт.</text><rect x="38" y="580" width="1204" height="102" rx="14" fill="#e5f3ee" stroke="#cbd5df"/><text x="66" y="620" class="label">5. Локальные значения</text><text x="66" y="652" class="body">local var, отдельно var=&quot;$(command)&quot; для статуса</text><rect x="38" y="696" width="1204" height="102" rx="14" fill="#e7eff8" stroke="#cbd5df"/><text x="66" y="736" class="label">6. Кавычки</text><text x="66" y="768" class="body">Кавычки по смыслу; одинарные без интерполяции</text><rect x="38" y="812" width="1204" height="102" rx="14" fill="#e5f3ee" stroke="#cbd5df"/><text x="66" y="852" class="label">7. Форматирование</text><text x="66" y="884" class="body">4 пробела; перенос +2; строки около 78 знаков</text><rect x="38" y="928" width="1204" height="102" rx="14" fill="#e7eff8" stroke="#cbd5df"/><text x="66" y="968" class="label">8. Синтаксис Bash</text><text x="66" y="1000" class="body">Предпочтения: [[ ]], $( ), (( )), $(( ))</text><rect x="38" y="1044" width="1204" height="102" rx="14" fill="#e5f3ee" stroke="#cbd5df"/><text x="66" y="1084" class="label">9. Надёжность</text><text x="66" y="1116" class="body">Проверять ошибки, STDERR и явные коды exit</text><rect x="38" y="1160" width="1204" height="102" rx="14" fill="#e7eff8" stroke="#cbd5df"/><text x="66" y="1200" class="label">10. Применимость</text><text x="66" y="1232" class="body">Не переносить без адаптации на sh и Dash</text><rect x="38" y="1294" width="1204" height="135" rx="14" fill="#fff4df" stroke="#dcc092"/><text x="66" y="1337" class="label">Предупреждения</text><text x="66" y="1370" class="body">Не исполнять шаблон с заглушками; опасный пример удаления — антипаттерн.</text><text x="66" y="1401" class="body">IFS и строгий режим требуют проверки; rollback: [Needs confirmation].</text><text x="40" y="1468" class="small">Источник: p0175:c01–p0192:c01 · PDF 175–192 · v1.7</text></svg>
