<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="655" viewBox="0 0 1110 655" role="img" aria-label="Глава 5 Выражения и арифметика краткая памятка"><rect width="1110" height="655" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#1b2a40}.title{font-size:21px;font-weight:bold;fill:#21364e}.body{font-size:17px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#193951}.small{font-size:14px;fill:#536178}</style><text x="42" y="57" class="head">Глава 5 · Выражения и арифметика</text><text x="42" y="88" class="small">Результат, статус, тип условия · источник RAG PDF 73–82</text><rect x="39" y="112" width="497" height="180" rx="16" fill="#e3f5ef" stroke="#7bcbb5" stroke-width="1.3"/><text x="63" y="151" class="title">Получить значение</text><text x="63" y="195" class="code">$(( expression ))</text><text x="63" y="230" class="body">Арифметическая подстановка</text><text x="63" y="260" class="body">Результат подставляется как число</text><rect x="565" y="112" width="506" height="180" rx="16" fill="#fff1ed" stroke="#edb9a8" stroke-width="1.3"/><text x="591" y="151" class="title">Получить статус</text><text x="591" y="195" class="code">(( expression ))</text><text x="591" y="230" class="body">Ненулевой результат → статус 0</text><text x="591" y="260" class="body">Нулевой результат → статус 1</text><rect x="39" y="319" width="1032" height="194" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="63" y="360" class="title">Условия и сравнения</text><text x="63" y="401" class="body">[[ ... ]] → строковые условия, =~ для регулярных выражений.</text><text x="63" y="431" class="body">[ ... ] → test; для &lt; и &gt; требуется экранирование.</text><text x="63" y="461" class="body">(( ... )) → авторский выбор для числовых сравнений.</text><rect x="39" y="537" width="1032" height="77" rx="16" fill="#fff8e7" stroke="#e4bd76" stroke-width="1.3"/><text x="63" y="578" class="title">Присваивания внутри арифметики меняют состояние переменных.</text><text x="43" y="638" class="small">RAG p0073:c01–p0082:c01 · без запуска команд</text></svg>