<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-label="Глава 5 Выражения и арифметика подробная памятка"><rect width="1280" height="1260" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#1b2a40}.title{font-size:21px;font-weight:bold;fill:#21364e}.body{font-size:17px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#193951}.small{font-size:14px;fill:#536178}</style><text x="41" y="59" class="head">Глава 5 · Арифметика и условия Bash</text><text x="41" y="90" class="small">Подробная памятка по RAG PDF 73–82</text><rect x="37" y="115" width="592" height="205" rx="16" fill="#e3f5ef" stroke="#7bcbb5" stroke-width="1.3"/><text x="62" y="154" class="title">1 · Арифметическая подстановка</text><text x="62" y="202" class="code">max=$(( intro + body + outro - 1 ))</text><text x="62" y="242" class="body">Возвращает число для присваивания.</text><text x="62" y="272" class="body">Внутри выражения $ перед именами не нужен.</text><rect x="652" y="115" width="590" height="205" rx="16" fill="#fff1ed" stroke="#edb9a8" stroke-width="1.3"/><text x="677" y="154" class="title">2 · Арифметическая команда</text><text x="677" y="202" class="code">(( step++ ))</text><text x="677" y="242" class="body">Может изменить переменную.</text><text x="677" y="272" class="body">Статус 0 при ненулевом результате, иначе 1.</text><rect x="37" y="347" width="592" height="207" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="62" y="390" class="title">3 · let и целочисленные переменные</text><text x="62" y="436" class="code">let &quot;step++&quot;</text><text x="62" y="475" class="body">declare -i SEE влияет на будущие присваивания.</text><text x="62" y="505" class="body">Без declare SEE=X+Y — строка X+Y.</text><rect x="652" y="347" width="590" height="207" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="677" y="390" class="title">4 · Проверки строк</text><text x="677" y="436" class="code">[[ -n &quot;$DIR&quot; ]]</text><text x="677" y="475" class="body">[[ ... ]] — ключевое слово Bash.</text><text x="677" y="505" class="body">[ ... ] — test, с обязательным ].</text><rect x="37" y="582" width="592" height="213" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="62" y="623" class="title">5 · Сравнения с регулярным выражением</text><text x="62" y="672" class="code">[[ &quot;$FILE_NAME&quot; =~ pattern ]]</text><text x="62" y="710" class="body">Авторы используют =~ с [[ ... ]].</text><text x="62" y="740" class="body">Пример regex берётся из PDF 79.</text><rect x="652" y="582" width="590" height="213" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="677" y="623" class="title">6 · Числовые сравнения</text><text x="677" y="672" class="code">(( OTHERVAL * 10 &lt;= VAL / 5 ))</text><text x="677" y="710" class="body">Для арифметики удобны двойные скобки.</text><text x="677" y="740" class="body">&lt; и &gt; в [ ] нуждаются в экранировании.</text><rect x="37" y="821" width="1205" height="234" rx="16" fill="#fff8e7" stroke="#e4bd76" stroke-width="1.3"/><text x="62" y="866" class="title">7 · Ограничения и проверка</text><text x="62" y="908" class="body">Bash в этой главе — целочисленная арифметика: дроби через внешние средства.</text><text x="62" y="938" class="body">Не запускайте $((step++)) как отдельную командную строку (PDF 76).</text><text x="62" y="968" class="body">if cd $DIR может сменить каталог; результат и rollback: [Needs confirmation].</text><text x="62" y="998" class="body">Для строк используйте [[...]], для чисел ((...)): рекомендация авторов.</text><rect x="37" y="1080" width="1205" height="102" rx="16" fill="#fff" stroke="#cad2db" stroke-width="1.3"/><text x="62" y="1122" class="title">Смысл раздела: одинаковые символы — разные вычислительные контексты.</text><text x="62" y="1155" class="small">Проверять отдельно значение, код завершения и изменение состояния.</text><text x="43" y="1229" class="small">RAG p0073:c01–p0082:c01 · chapter artifacts v1.7 · 0032</text></svg>
