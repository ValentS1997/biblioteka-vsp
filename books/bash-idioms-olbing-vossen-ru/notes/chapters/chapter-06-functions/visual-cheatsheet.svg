<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-label="Идиомы Bash глава 6 Функции, компактный конспект"><rect width="1080" height="690" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:31px;font-weight:bold;fill:#162640}.title{font-size:21px;font-weight:bold;fill:#1b3852}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#14354f}.small{font-size:14px;fill:#526174}</style><text x="40" y="55" class="head">Глава 6 · Функции Bash</text><text x="40" y="83" class="small">Аргументы · результаты · область видимости · printf</text><rect x="35" y="112" width="487" height="207" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="58" y="150" class="title">Объявление и аргументы</text><text x="58" y="193" class="body">function MyFunc { ... }</text><text x="58" y="221" class="body">$1, $2 — позиционные аргументы</text><text x="58" y="249" class="body">$# — количество; &quot;$@&quot; — все</text><text x="58" y="277" class="body">$0 — сценарий; FUNCNAME — функция</text><rect x="547" y="112" width="498" height="207" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="572" y="150" class="title">Результат: три разных канала</text><text x="572" y="193" class="body">$? — статус выполнения</text><text x="572" y="221" class="body">STDOUT — текстовые данные</text><text x="572" y="249" class="body">$(...) — захват вывода</text><text x="572" y="277" class="body">global variable — побочный эффект</text><rect x="35" y="339" width="1010" height="177" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="58" y="377" class="title">Область видимости и перенаправление</text><text x="58" y="417" class="body">local защищает от случайной порчи глобальных переменных.</text><text x="58" y="445" class="body">Динамическая область: вложенная функция видит local вызывающей.</text><text x="58" y="473" class="body">Определение функции может содержать общее 1&gt;&amp;2 для STDERR.</text><rect x="35" y="535" width="1010" height="108" rx="15" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="58" y="576" class="title">printf: явный формат, -v для переменной, %q, формат даты.</text><text x="58" y="609" class="body">Время %(... )T зависит от версии Bash; проверьте совместимость.</text><text x="41" y="671" class="small">Источник: RAG p0083:c01–p0093:c01 · PDF 83–93 · v1.7</text></svg>