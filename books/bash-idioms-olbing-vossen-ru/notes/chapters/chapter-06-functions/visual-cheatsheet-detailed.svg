<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1250" viewBox="0 0 1270 1250" role="img" aria-label="Подробная визуальная памятка глава 6 функции"><rect width="1270" height="1250" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#1d3851}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#174263}.small{font-size:14px;fill:#475569}</style><text x="43" y="55" class="head">Глава 6 · Функции в Bash</text><text x="43" y="86" class="small">Подробный RAG-конспект · PDF 83–93 · 11 чанков</text><rect x="39" y="112" width="575" height="213" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="64" y="151" class="title">1 · Определения и вызовы</text><text x="64" y="192" class="code">function Say_So { ... }</text><text x="64" y="232" class="body">Определить функцию до её вызова.</text><text x="64" y="260" class="body">Вызов выглядит как обычная команда.</text><text x="64" y="288" class="body">function и круглые скобки необязательны.</text><rect x="640" y="112" width="590" height="213" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="666" y="151" class="title">2 · Параметры</text><text x="666" y="192" class="code">$1, $2, $#, &quot;$@&quot;</text><text x="666" y="232" class="body">Аргументы функции заменяют контекст $1...</text><text x="666" y="260" class="body">$0 остаётся именем сценария.</text><text x="666" y="288" class="body">FUNCNAME отражает стек функций.</text><rect x="39" y="350" width="575" height="215" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="389" class="title">3 · Возврат результата</text><text x="64" y="430" class="code">$?  /  STDOUT  /  global</text><text x="64" y="473" class="body">Статус — результат последней команды.</text><text x="64" y="501" class="body">Вывод захватывается через $(...).</text><text x="64" y="529" class="body">Общая переменная меняет состояние.</text><rect x="640" y="350" width="590" height="215" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="666" y="389" class="title">4 · Локальные переменные</text><text x="666" y="430" class="code">local i     local -i i</text><text x="666" y="473" class="body">Защита глобального состояния.</text><text x="666" y="501" class="body">Область видимости динамическая.</text><text x="666" y="529" class="body">Вложенная функция видит local вызывающей.</text><rect x="39" y="590" width="575" height="215" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="64" y="629" class="title">5 · Перенаправление</text><text x="64" y="672" class="code">function Usage_Message { ... } 1&gt;&amp;2</text><text x="64" y="715" class="body">Один редирект для всей функции.</text><text x="64" y="743" class="body">Действует во время вызова.</text><text x="64" y="771" class="body">Сообщения адресуются STDERR.</text><rect x="640" y="590" width="590" height="215" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="666" y="629" class="title">6 · printf и переносимость</text><text x="666" y="672" class="code">printf -v / %q / %(... )T</text><text x="666" y="715" class="body">Явные форматы и управляющие символы.</text><text x="666" y="743" class="body">-v сохраняет строку в переменной.</text><text x="666" y="771" class="body">Время: нужен подходящий Bash.</text><rect x="39" y="830" width="1191" height="240" rx="15" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="64" y="872" class="title">7 · Критерии безопасного применения</text><text x="64" y="915" class="body">Не смешивать статус $? с данными, возвращёнными через STDOUT.</text><text x="64" y="943" class="body">Снабжать аргументы, побочные эффекты и динамический scope комментариями.</text><text x="64" y="971" class="body">Отладка: type -a printf, help printf, man 1 printf.</text><text x="64" y="999" class="body">Фрагмент Summer с фигурными скобками — [Needs confirmation], не рецепт.</text><text x="64" y="1027" class="body">Откат изменений глобальных переменных: [Needs confirmation].</text><rect x="39" y="1097" width="1191" height="92" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="1138" class="title">Авторы: функции короткие, решают одну задачу, определены до вызова.</text><text x="64" y="1167" class="small">Пример printf с датой зависит от версии Bash; не переносить без проверки.</text><text x="42" y="1226" class="small">Источник: bash-idioms-olbing-vossen-ru · p0083:c01–p0093:c01 · v1.7</text></svg>