<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1260" viewBox="0 0 1270 1260" role="img" aria-label="Глава 2 Язык циклов — памятка"><rect width="1270" height="1260" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#17243a}.body{font-size:18px;fill:#334155}.code{font-size:19px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="45" y="55" class="head">Глава 2 · Практические формы циклов</text><text x="45" y="85" class="small">RAG PDF 30–42 · главы: явные и неявные значения, массивы, безопасное тестирование</text><rect x="42" y="111" width="574" height="218" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="67" y="152" class="title">1 · Числовой for</text><text x="67" y="197" class="code">for ((i=0; i&lt;10; i++))</text><text x="67" y="236" class="body">Инициализация, условие, шаг.</text><text x="67" y="265" class="body">for ((;;)) — бесконечный цикл.</text><text x="67" y="294" class="body">Диапазоны {01..10} зависят от Bash.</text><rect x="651" y="111" width="574" height="218" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="676" y="152" class="title">2 · Параметры и явные значения</text><text x="676" y="197" class="code">for arg in &quot;$@&quot;</text><text x="676" y="236" class="body">for arg — неявные параметры.</text><text x="676" y="265" class="body">Внутри функции — аргументы функции.</text><text x="676" y="294" class="body">for x in 1 2 3 — заданный список.</text><rect x="42" y="351" width="574" height="218" rx="15" fill="#fff1ed" stroke="#f2b7a8" stroke-width="1.4"/><text x="67" y="392" class="title">3 · Массивы: кавычки важны</text><text x="67" y="432" class="code">&quot;${namelist[@]}&quot;</text><text x="67" y="473" class="body">Отдельные элементы остаются целыми.</text><text x="67" y="502" class="body">Без кавычек строка может делиться.</text><text x="67" y="531" class="body">Особенно важно для имён файлов.</text><rect x="651" y="351" width="574" height="218" rx="15" fill="#fff1ed" stroke="#f2b7a8" stroke-width="1.4"/><text x="676" y="392" class="title">4 · Разница @ и *</text><text x="676" y="432" class="code">&quot;${namelist[*]}&quot;</text><text x="676" y="473" class="body">Под кавычками — одна строка.</text><text x="676" y="502" class="body">Цикл сделает одну итерацию.</text><text x="676" y="531" class="body">Для ключей хеша: &quot;${!hash[@]}&quot;.</text><rect x="42" y="591" width="574" height="216" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="67" y="632" class="title">5 · Разработка и проверка</text><text x="67" y="674" class="code">echo перед mv / ssh</text><text x="67" y="717" class="body">Печатать план, затем проверять аргументы.</text><text x="67" y="746" class="body">Переименование файлов меняет состояние.</text><text x="67" y="775" class="body">Без отдельного rollback не запускать.</text><rect x="651" y="591" width="574" height="216" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="676" y="632" class="title">6 · Другие виды циклов</text><text x="676" y="674" class="code">while / until</text><text x="676" y="717" class="body">Работа под управлением условия.</text><text x="676" y="746" class="body">Пример: until ssh ...; do sleep 3; done</text><text x="676" y="775" class="body">Семантика текста требует проверки.</text><rect x="42" y="830" width="1183" height="245" rx="15" fill="#fff8e7" stroke="#e1bf6b" stroke-width="1.4"/><text x="67" y="875" class="title">7 · Контроль рисков</text><text x="67" y="921" class="body">• for ((;;)) без условия завершения создаёт непрерывную нагрузку.</text><text x="67" y="950" class="body">• Переменные с пробелами могут изменить число итераций и состав аргументов.</text><text x="67" y="979" class="body">• mv переименовывает файлы; ssh затрагивает удалённые узлы.</text><text x="67" y="1008" class="body">• Авторские формулировки while/until и echo -e: [Needs confirmation].</text><rect x="42" y="1099" width="1183" height="94" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="67" y="1141" class="title">Принцип главы: читаемость → проверка через echo → контролируемое действие</text><text x="67" y="1170" class="small">Rollback и результаты исполнения вне учебного RAG: [Needs confirmation]</text><text x="47" y="1230" class="small">Источник: bash-idioms-olbing-vossen-ru · p0030:c01–p0042:c01 · v1.7</text></svg>