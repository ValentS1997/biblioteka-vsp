<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="665" viewBox="0 0 1050 665" role="img" aria-label="Глава 2 Язык циклов — памятка"><rect width="1050" height="665" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#17243a}.body{font-size:18px;fill:#334155}.code{font-size:19px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="42" y="55" class="head">Глава 2 · Язык циклов</text><text x="42" y="85" class="small">Формы циклов и сохранение элементов массива • PDF 30–42</text><rect x="40" y="112" width="470" height="175" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="63" y="152" class="title">for — источник значений</text><text x="63" y="195" class="code">for ((i=0; i&lt;10; i++))</text><text x="63" y="224" class="code">for arg  ≈  for arg in &quot;$@&quot;</text><text x="63" y="253" class="code">for value in a b c</text><rect x="540" y="112" width="470" height="175" rx="15" fill="#fff1ed" stroke="#f2b7a8" stroke-width="1.4"/><text x="565" y="152" class="title">Массивы и пробелы</text><text x="565" y="195" class="code">&quot;${array[@]}&quot; → каждый элемент</text><text x="565" y="224" class="code">&quot;${array[*]}&quot; → одна строка</text><text x="565" y="253" class="code">Без кавычек: риск разбить слова</text><rect x="40" y="311" width="970" height="164" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="63" y="353" class="title">Предсказуемая работа с файлами и узлами</text><text x="63" y="391" class="body">1. Начните с простого for и выводите команды через echo.</text><text x="63" y="420" class="body">2. Проверьте элементы, пробелы и точные аргументы.</text><text x="63" y="449" class="body">3. mv / ssh запускайте только после проверки эффекта.</text><rect x="40" y="500" width="970" height="96" rx="15" fill="#fff8e7" stroke="#e1bf6b" stroke-width="1.4"/><text x="63" y="543" class="title">while/until: уточнение формулировок источника необходимо</text><text x="63" y="570" class="small">Проверка семантики: [Needs confirmation] · см. source-findings.md</text><text x="42" y="637" class="small">Источник: RAG p0030:c01–p0042:c01 · без исполнения команд</text></svg>