<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="765" viewBox="0 0 1130 765" role="img" aria-label="Глава 10 Помимо идиом работа с bash компактный конспект"><rect width="1130" height="765" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#173857}.body{font-size:18px;fill:#334155}.code{font-size:19px;font-weight:bold;fill:#153852}.small{font-size:14px;fill:#526174}</style><text x="43" y="56" class="head">Глава 10 · Помимо идиом: Bash</text><text x="43" y="85" class="small">Работа с окружением, вводом, файлами и отладкой · PDF 146–174</text><rect x="37" y="110" width="518" height="199" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="63" y="150" class="title">Оболочка и интерактивность</text><text x="63" y="192" class="body">PS0–PS4, PROMPT_COMMAND</text><text x="63" y="220" class="body">read -eip, select, Readline и bind</text><text x="63" y="248" class="body">alias / unalias, local IFS</text><text x="63" y="276" class="body">logger, jq, pgrep</text><rect x="578" y="110" width="515" height="199" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="604" y="150" class="title">Работа со сценарием</text><text x="604" y="192" class="body">mcd — функции и состояние CWD</text><text x="604" y="220" class="body">find: сначала -print или -ls</text><text x="604" y="248" class="body">here-doc: встроенная документация</text><text x="604" y="276" class="body">bash -n — проверка без исполнения</text><rect x="37" y="333" width="1056" height="194" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="63" y="376" class="title">Важное различие режимов диагностики</text><text x="63" y="424" class="code">bash -n   → проверяет синтаксис, не выполняет код</text><text x="63" y="462" class="code">bash -x   → выполняет код, печатает трассировку</text><text x="63" y="496" class="body">set -x / set +x — включение и выключение xtrace</text><rect x="37" y="548" width="1056" height="157" rx="16" fill="#fff8e7" stroke="#dbb86d" stroke-width="1.3"/><text x="63" y="590" class="title">Изменение состояния и риск утечки</text><text x="63" y="629" class="body">read -s скрывает ввод, но пример затем печатает пароль.</text><text x="63" y="658" class="body">PROMPT_COMMAND и logger могут записывать команды в журнал.</text><text x="63" y="687" class="body">find -delete уничтожает файлы; сначала сверить выборку.</text><text x="43" y="746" class="small">Источник: RAG p0146:c01–p0174:c01 · v1.7 · примеры не выполнялись</text></svg>
