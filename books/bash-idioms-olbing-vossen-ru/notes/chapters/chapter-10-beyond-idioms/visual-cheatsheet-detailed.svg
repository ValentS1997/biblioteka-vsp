<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-label="Подробный конспект главы 10"><rect width="1200" height="1240" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1d344b}.head{font-weight:bold;font-size:31px}.sec{font-weight:bold;font-size:21px}.body{font-size:18px}.foot{font-size:14px}</style><text class="head" x="35" y="57">Глава 10 · Помимо идиом: работа с bash</text><text class="foot" x="35" y="89">Развернутый обзор · PDF 146–174 · RAG-only</text><rect x="32" y="112" width="1134" height="102" rx="14" fill="#e9f6f0" stroke="#c0ced9"/><text x="60" y="152" class="sec">01. Приглашения оболочки</text><text x="60" y="186" class="body">PS0, PS1, PS2, PS3, PS4; PROMPT_COMMAND</text><rect x="32" y="230" width="1134" height="102" rx="14" fill="#e8eef5" stroke="#c0ced9"/><text x="60" y="270" class="sec">02. Получение ввода</text><text x="60" y="304" class="body">read -ei, read -s, read -t; select и REPLY</text><rect x="32" y="348" width="1134" height="102" rx="14" fill="#e9f6f0" stroke="#c0ced9"/><text x="60" y="388" class="sec">03. Удобства командной строки</text><text x="60" y="422" class="body">alias, unalias, mcd, IFS и Readline</text><rect x="32" y="466" width="1134" height="102" rx="14" fill="#e8eef5" stroke="#c0ced9"/><text x="60" y="506" class="sec">04. История и журналирование</text><text x="60" y="540" class="body">HISTCONTROL, HISTIGNORE; logger</text><rect x="32" y="584" width="1134" height="102" rx="14" fill="#e9f6f0" stroke="#c0ced9"/><text x="60" y="624" class="sec">05. Обработка структурированных данных</text><text x="60" y="658" class="body">jq для JSON, pgrep для процессов</text><rect x="32" y="702" width="1134" height="102" rx="14" fill="#e8eef5" stroke="#c0ced9"/><text x="60" y="742" class="sec">06. Поиск и ротация</text><text x="60" y="776" class="body">find: сначала -print / -ls; затем оценить -delete</text><rect x="32" y="820" width="1134" height="102" rx="14" fill="#e9f6f0" stroke="#c0ced9"/><text x="60" y="860" class="sec">07. Документация</text><text x="60" y="894" class="body">Блоки here-doc; извлечение через emit-docs</text><rect x="32" y="938" width="1134" height="102" rx="14" fill="#e8eef5" stroke="#c0ced9"/><text x="60" y="978" class="sec">08. Диагностика</text><text x="60" y="1012" class="body">bash -n без выполнения; bash -x с выполнением</text><rect x="32" y="1056" width="1134" height="102" rx="14" fill="#e9f6f0" stroke="#c0ced9"/><text x="60" y="1096" class="sec">09. Риски</text><text x="60" y="1130" class="body">Удаление, раскрытие данных, изменение окружения</text><text x="36" y="1201" class="foot">Реальное применение и обратимость изменяющих операций: [Needs confirmation].</text></svg>
