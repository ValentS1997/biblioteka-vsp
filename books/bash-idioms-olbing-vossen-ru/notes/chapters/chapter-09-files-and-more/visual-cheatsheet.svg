<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="740" viewBox="0 0 1130 740" role="img" aria-label="Глава 9 Файлы и не только: краткая SVG памятка"><rect width="1130" height="740" fill="#F6F8FB"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17283E}.sub{font-size:14px;fill:#4B6174}.title{font-size:21px;font-weight:bold;fill:#183B53}.body{font-size:17px;fill:#334155}.code{font-size:19px;font-weight:bold;fill:#1D4861}.small{font-size:14px;fill:#465768}</style><text x="42" y="54" class="head">Глава 9 · Файлы и не только</text><text x="42" y="84" class="sub">Чтение, подстановки, библиотеки и завершение · PDF 126–145</text><rect x="38" y="113" width="513" height="219" rx="16" fill="#E4F4EF" stroke="#91C9BC" stroke-width="1.3"/><text x="63" y="155" class="title">Чтение файлов и IFS</text><text x="63" y="199" class="body">read — поля, IFS — их разделитель</text><text x="63" y="229" class="body">mapfile -t — строки в массив</text><text x="63" y="259" class="body">mapfile -n — чтение порциями</text><text x="63" y="289" class="body">Большие файлы: проверять память</text><rect x="576" y="113" width="516" height="219" rx="16" fill="#E8F2FB" stroke="#9CBED8" stroke-width="1.3"/><text x="600" y="155" class="title">Потоки и подключение</text><text x="600" y="199" class="body">diff &lt;(cut ... | sort -u) ...</text><text x="600" y="229" class="body">source — исполнение чужого кода</text><text x="600" y="259" class="body">Каталоги настроек и библиотеки</text><text x="600" y="289" class="body">Shebang: /bin/bash или env bash</text><rect x="38" y="357" width="1054" height="174" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/><text x="63" y="400" class="title">Контроль завершения</text><text x="63" y="439" class="body">set -euo pipefail: проверять совместимость сценария.</text><text x="63" y="469" class="body">exit n — выход сценария; return n — выход функции.</text><text x="63" y="499" class="body">trap Cleanup ... — обработчик, но без универсальной гарантии.</text><rect x="38" y="555" width="1054" height="124" rx="16" fill="#FFF7E8" stroke="#D9BB79" stroke-width="1.3"/><text x="63" y="598" class="title">Операционные риски</text><text x="63" y="631" class="body">Запись в /tmp, rm, source и ssh требуют проверки целей и побочных эффектов.</text><text x="43" y="714" class="small">Источник: RAG p0126:c01–p0145:c01 · v1.7 · без выполнения команд</text></svg>
