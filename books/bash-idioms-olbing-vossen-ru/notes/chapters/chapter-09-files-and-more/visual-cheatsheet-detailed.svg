<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1370" viewBox="0 0 1320 1370" role="img" aria-label="Подробный визуальный конспект главы 9 Файлы и не только"><rect width="1320" height="1370" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#243b53}.head{font-weight:700;font-size:30px}.sec{font-weight:700;font-size:20px}.body{font-size:17px}.small{font-size:14px}</style><text x="42" y="57" class="head">Глава 9 · Файлы и не только</text><text x="42" y="86" class="small">Подробная памятка · PDF 126–145 · RAG p0126:c01–p0145:c01</text><rect x="38" y="113" width="1245" height="107" rx="15" fill="#e6f4ee" stroke="#bbccd7"/><text x="62" y="146" class="sec">1 · read и разделение полей</text><text x="62" y="179" class="body">read -d: завершение записи; IFS: границы полей</text><text x="62" y="206" class="body">Переменные после pipeline могут остаться в подоболочке</text><rect x="38" y="234" width="1245" height="107" rx="15" fill="#e8eff8" stroke="#bbccd7"/><text x="62" y="267" class="sec">2 · mapfile / readarray</text><text x="62" y="300" class="body">mapfile -t — строки в массив; -n — порциями</text><text x="62" y="327" class="body">Проверяйте память и условие выхода при EOF</text><rect x="38" y="355" width="1245" height="107" rx="15" fill="#e6f4ee" stroke="#bbccd7"/><text x="62" y="388" class="sec">3 · IFS и простое чтение</text><text x="62" y="421" class="body">IFS='' read ... — локально для команды</text><text x="62" y="448" class="body">Глобальные изменения разделителя не копировать слепо</text><rect x="38" y="476" width="1245" height="107" rx="15" fill="#e8eff8" stroke="#bbccd7"/><text x="62" y="509" class="sec">4 · Подстановка процессов</text><text x="62" y="542" class="body">diff &lt;(cut ... | sort -u) &lt;(cut ... | sort -u)</text><text x="62" y="569" class="body">Сравнить потоки без промежуточных файлов</text><rect x="38" y="597" width="1245" height="107" rx="15" fill="#e6f4ee" stroke="#bbccd7"/><text x="62" y="630" class="sec">5 · Конфигурация и библиотеки</text><text x="62" y="663" class="body">source /path/to/library — выполнение кода</text><text x="62" y="690" class="body">Перед подключением проверьте доверенность содержимого</text><rect x="38" y="718" width="1245" height="107" rx="15" fill="#e8eff8" stroke="#bbccd7"/><text x="62" y="751" class="sec">6 · Shebang и режим оболочки</text><text x="62" y="784" class="body">#!/bin/bash или #!/usr/bin/env bash</text><text x="62" y="811" class="body">set -euo pipefail требует проверки совместимости</text><rect x="38" y="839" width="1245" height="107" rx="15" fill="#e6f4ee" stroke="#bbccd7"/><text x="62" y="872" class="sec">7 · Статус и очистка</text><text x="62" y="905" class="body">exit n / return n; trap Cleanup ...</text><text x="62" y="932" class="body">trap не гарантирует очистку при любом сигнале</text><rect x="38" y="960" width="1245" height="107" rx="15" fill="#e8eff8" stroke="#bbccd7"/><text x="62" y="993" class="sec">8 · Встроенные тексты</text><text x="62" y="1026" class="body">Here-document &lt;&lt;-EoH, here-string &lt;&lt;&lt;word</text><text x="62" y="1053" class="body">Перенаправление &gt; файл может перезаписать данные</text><rect x="38" y="1081" width="1245" height="107" rx="15" fill="#e6f4ee" stroke="#bbccd7"/><text x="62" y="1114" class="sec">9 · Риски исходных примеров</text><text x="62" y="1147" class="body">/tmp/nodes.txt и /tmp/ifs-test.txt перезаписываются</text><text x="62" y="1174" class="body">ssh — удалённый вызов; rm удаляет промежуточные файлы</text><rect x="38" y="1222" width="1245" height="91" rx="15" fill="#fff5dd" stroke="#ddbf86"/><text x="62" y="1258" class="sec">Ограничение источника</text><text x="62" y="1290" class="body">BATCH_SIZE=0 в комментарии противоречит делению; rollback: [Needs confirmation].</text><text x="42" y="1348" class="small">CHAPTER-ARTIFACT-COLLECTION v1.7 · reading status не изменён</text></svg>
