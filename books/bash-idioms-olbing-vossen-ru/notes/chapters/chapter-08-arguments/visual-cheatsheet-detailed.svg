<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="1320" viewBox="0 0 1310 1320" role="img" aria-label="Подробная памятка по главе 8 Аргументы"><rect width="1310" height="1320" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#153856}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#174362}.small{font-size:14px;fill:#526174}</style><text x="43" y="55" class="head">Глава 8 · От аргументов к интерфейсу CLI</text><text x="43" y="85" class="small">Структура исходника • RAG-only • PDF 111–125</text><rect x="38" y="112" width="604" height="213" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="64" y="152" class="title">1 · Позиционные аргументы</text><text x="64" y="192" class="code">$1 / $# / &quot;$@&quot; / &quot;$*&quot;</text><text x="64" y="231" class="body">Назвать параметры осмысленно.</text><text x="64" y="259" class="body">${1:-favorite.txt} — значение по умолчанию.</text><text x="64" y="287" class="body">Кавычки сохраняют пробелы и отдельные args.</text><rect x="665" y="112" width="606" height="213" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="690" y="152" class="title">2 · Короткие ключи</text><text x="690" y="192" class="code">getopts ':ao:v' VAL</text><text x="690" y="231" class="body">while вызывает getopts повторно.</text><text x="690" y="259" class="body">case различает a, o, v, ошибки.</text><text x="690" y="287" class="body">После цикла: shift по OPTIND.</text><rect x="38" y="352" width="604" height="212" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="392" class="title">3 · Длинные ключи</text><text x="64" y="434" class="code">getopts ':-:ao:v'</text><text x="64" y="476" class="body">VAL '-' открывает вложенный case.</text><text x="64" y="504" class="body">--outfile=x → удалить часть до знака =.</text><text x="64" y="532" class="body">--outfile x → взять отдельный аргумент.</text><rect x="665" y="352" width="606" height="212" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="690" y="392" class="title">4 · Помощь и выход</text><text x="690" y="434" class="code">Display_Help / cat &lt;&lt;-EoH</text><text x="690" y="476" class="body">Here-doc с удалением ведущих TAB.</text><text x="690" y="504" class="body">-h / --help — ожидаемые ключи.</text><text x="690" y="532" class="body">Выбор exit 0 или 1 авторы обсуждают.</text><rect x="38" y="592" width="604" height="216" rx="16" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="64" y="632" class="title">5 · Версия и режимы</text><text x="64" y="676" class="code">-V  /  -v  /  -d</text><text x="64" y="720" class="body">-V для версии, -v для verbose.</text><text x="64" y="748" class="body">VERBOSE и DEBUG: ':' либо 'echo'.</text><text x="64" y="776" class="body">Сообщения без дополнительных if.</text><rect x="665" y="592" width="606" height="216" rx="16" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="690" y="632" class="title">6 · Отдельная функция разбора</text><text x="690" y="676" class="code">parseargs &quot;${@}&quot;</text><text x="690" y="720" class="body">Отделить разбор от основного кода.</text><text x="690" y="748" class="body">Флаги сохраняются для основной логики.</text><text x="690" y="776" class="body">Комментарии помогают сопровождению.</text><rect x="38" y="831" width="1233" height="234" rx="16" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="64" y="873" class="title">7 · Риски, требующие проверки</text><text x="64" y="913" class="body">shift меняет позиционные параметры; exit завершает сценарий.</text><text x="64" y="941" class="body">OFILE=имя — присваивание переменной, не создание файла.</text><text x="64" y="969" class="body">Пример 8.4: сообщение 'valid options aov' уже набора ключей.</text><text x="64" y="997" class="body">Комментарий здесь-документа EoH, код использует EoN.</text><text x="64" y="1025" class="body">Результат запуска и rollback: [Needs confirmation].</text><rect x="38" y="1091" width="1233" height="139" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="1134" class="title">Критерий главы: CLI понятен, когда парсер отделён от задачи.</text><text x="64" y="1174" class="body">Сначала зафиксировать набор допустимых ключей и ожидаемые аргументы.</text><text x="64" y="1203" class="body">Справка, версия и отладка — часть качества интерфейса.</text><text x="43" y="1285" class="small">RAG: p0111:c01–p0125:c01 · Source findings зафиксированы отдельно · v1.7</text></svg>