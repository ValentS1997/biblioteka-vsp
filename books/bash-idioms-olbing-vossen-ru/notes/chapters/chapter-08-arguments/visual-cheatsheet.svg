<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-label="Глава 8. Аргументы. Компактный визуальный конспект"><rect width="1120" height="720" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:31px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#143b59}.body{font-size:18px;fill:#334155}.code{font-size:19px;font-weight:bold;fill:#16415f}.small{font-size:14px;fill:#475569}</style><text x="43" y="56" class="head">Глава 8 · Аргументы Bash</text><text x="43" y="85" class="small">Позиционные параметры, getopts, help и диагностика · PDF 111–125</text><rect x="37" y="111" width="502" height="212" rx="15" fill="#e4f4f0" stroke="#77c7b5" stroke-width="1.4"/><text x="62" y="153" class="title">Параметры и кавычки</text><text x="62" y="192" class="code">$1 / $2 — значения, $# — число</text><text x="62" y="222" class="code">${1:-favorite.txt} — default</text><text x="62" y="252" class="code">&quot;$@&quot; — отдельные аргументы</text><text x="62" y="282" class="code">&quot;$*&quot; — одна строка</text><rect x="562" y="111" width="518" height="212" rx="15" fill="#e4f4f0" stroke="#77c7b5" stroke-width="1.4"/><text x="588" y="153" class="title">Короткие и длинные ключи</text><text x="588" y="192" class="code">getopts ':ao:v' + case</text><text x="588" y="222" class="code">OPTARG — значение ключа</text><text x="588" y="252" class="code">OPTIND — позиция, затем shift</text><text x="588" y="282" class="code">Длинные: специальный case OPTARG</text><rect x="37" y="348" width="1043" height="185" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="62" y="390" class="title">Help, version, verbose и debug</text><text x="62" y="429" class="body">cat &lt;&lt;-EoH — текст справки, убирает ведущие TAB.</text><text x="62" y="458" class="body">-V — версия; -v — подробный режим по выбору авторов.</text><text x="62" y="487" class="body">VERBOSE=':' / 'echo' — условный вывод без if.</text><rect x="37" y="551" width="1043" height="105" rx="15" fill="#fff8e7" stroke="#dbb76c" stroke-width="1.4"/><text x="62" y="590" class="title">Отделяйте разбор аргументов от основной логики.</text><text x="62" y="622" class="body">Пример 8.4: несогласованный текст допустимых ключей — [Needs confirmation].</text><text x="43" y="696" class="small">Источник: RAG p0111:c01–p0125:c01 · v1.7 · без исполнения</text></svg>