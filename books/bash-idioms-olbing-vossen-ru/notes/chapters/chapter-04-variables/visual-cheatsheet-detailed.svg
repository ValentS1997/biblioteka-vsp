<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1290" viewBox="0 0 1300 1290" role="img" aria-label="Глава 4: Язык переменных, подробная памятка"><rect width="1300" height="1290" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:20px;font-weight:bold;fill:#17243a}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="43" y="56" class="head">Глава 4 · Расширения параметров Bash</text><text x="43" y="85" class="small">RAG-only • PDF 58–72 • Извлечение значения и изменение состояния — разные действия</text><rect x="38" y="110" width="599" height="218" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="64" y="151" class="title">1 · Значение и длина</text><text x="64" y="194" class="code">${VAR}    ${#VAR}</text><text x="64" y="237" class="body">Двойные кавычки: подстановка значения.</text><text x="64" y="266" class="body">Одинарные: строка остаётся буквальной.</text><text x="64" y="295" class="body">Фигурные скобки выделяют имя переменной.</text><rect x="661" y="110" width="600" height="218" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="686" y="151" class="title">2 · Префиксы и суффиксы</text><text x="686" y="194" class="code"># / ##       % / %%</text><text x="686" y="237" class="body"># / ## удаляют слева, коротко / длинно.</text><text x="686" y="266" class="body">% / %% удаляют справа, коротко / длинно.</text><text x="686" y="295" class="body">Пример: ${0##*/} оставляет имя сценария.</text><rect x="38" y="352" width="599" height="219" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="393" class="title">3 · Замена и подстроки</text><text x="64" y="438" class="code">${FN// /_}    ${FN:10:4}</text><text x="64" y="480" class="body">/ заменяет первое, // — все совпадения.</text><text x="64" y="509" class="body">:offset:length извлекает подстроку.</text><text x="64" y="538" class="body">Для суффикса лучше %, чем замена везде.</text><rect x="661" y="352" width="600" height="219" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="686" y="393" class="title">4 · Регистр и преобразование</text><text x="686" y="438" class="code">${TXT^^}    ${TXT,,}</text><text x="686" y="480" class="body">^ / ^^ — верхний регистр.</text><text x="686" y="509" class="body"> , / ,, — нижний регистр.</text><text x="686" y="538" class="body">Присваивание результата отдельно меняет var.</text><rect x="38" y="595" width="599" height="211" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="64" y="636" class="title">5 · Условные значения</text><text x="64" y="679" class="code">${VAR:-5}  /  ${VAR:=5}</text><text x="64" y="725" class="body">Первое возвращает default без записи.</text><text x="64" y="754" class="body">Второе может присвоить default.</text><text x="64" y="783" class="body">${LIST:+,} помогает собрать CSV-список.</text><rect x="661" y="595" width="600" height="211" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="686" y="636" class="title">6 · Подстановка команд</text><text x="686" y="679" class="code">$(command)</text><text x="686" y="725" class="body">Команда выполняется до использования вывода.</text><text x="686" y="754" class="body">Вложение читаемее обратных кавычек.</text><text x="686" y="783" class="body">Внутренняя команда может менять облако!</text><rect x="38" y="830" width="1223" height="238" rx="15" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="64" y="873" class="title">7 · Риски и проверки</text><text x="64" y="914" class="body">$RANDOM: числа 0–32767, не для криптографии.</text><text x="64" y="943" class="body">Создание TEMP_DIR из $RANDOM: авторы отмечают race condition.</text><text x="64" y="972" class="body">mktemp предложен к рассмотрению; процедуры отката не приведены.</text><text x="64" y="1001" class="body">Для mkdir и создания EC2 нужны разрешение и подтверждённый rollback.</text><rect x="38" y="1093" width="1223" height="111" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="1138" class="title">Рекомендация авторов: сложные подстановки снабжать комментариями.</text><text x="64" y="1171" class="small">Реальная среда, результаты команд и rollback: [Needs confirmation].</text><text x="45" y="1254" class="small">Provenance: bash-idioms-olbing-vossen-ru · p0058:c01–p0072:c01 · v1.7</text></svg>