<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-label="Глава 4: Язык переменных, краткая памятка"><rect width="1100" height="670" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:20px;font-weight:bold;fill:#17243a}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="42" y="54" class="head">Глава 4 · Язык переменных</text><text x="42" y="84" class="small">Строковые операции Bash: RAG PDF 58–72</text><rect x="37" y="111" width="494" height="201" rx="15" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="63" y="153" class="title">Обработка строк</text><text x="63" y="195" class="code">${VAR}  — значение</text><text x="63" y="223" class="code">${#VAR}  — длина строки</text><text x="63" y="251" class="code">${VAR##*/} — убрать путь</text><text x="63" y="279" class="code">${FN%.*} — снять расширение</text><rect x="557" y="111" width="506" height="201" rx="15" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="581" y="153" class="title">Условные подстановки</text><text x="581" y="195" class="code">${VAR:-default} — только результат</text><text x="581" y="225" class="code">${VAR:=default} — присваивание</text><text x="581" y="255" class="code">${LIST:+,} — разделитель при значении</text><rect x="37" y="333" width="1026" height="184" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="63" y="374" class="title">Извлечение, замена и подстановка команд</text><text x="63" y="414" class="body">${VAR/pattern/replacement} — первое совпадение; // — все.</text><text x="63" y="443" class="body">${VAR:offset:length} — подстрока; ^/,, — изменение регистра.</text><text x="63" y="472" class="body">$(command) выполняет команду: она может менять состояние!</text><rect x="37" y="538" width="1026" height="76" rx="15" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="63" y="579" class="title">$RANDOM не для криптографии; временный каталог: риск гонки.</text><text x="42" y="650" class="small">Источник: p0058:c01–p0072:c01 · RAG-only · статус чтения не затронут</text></svg>