<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-label="Подробная памятка — глава 3 оператор case"><rect width="1280" height="1160" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#17243a}.title{font-size:21px;font-weight:bold;fill:#17243a}.body{font-size:18px;fill:#334155}.code{font-size:20px;font-weight:bold;fill:#18324e}.small{font-size:14px;fill:#475569}</style><text x="42" y="54" class="head">Глава 3 · case: шаблоны, ветви, последствия</text><text x="42" y="84" class="small">RAG-only · PDF 43–57 · исходный текст не исправлялся</text><rect x="38" y="109" width="575" height="218" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="64" y="149" class="title">1 · Форма case</text><text x="64" y="195" class="code">case &quot;$var&quot; in ... esac</text><text x="64" y="232" class="body">pattern) тело ;;</text><text x="64" y="259" class="body">*) общий вариант ;;</text><text x="64" y="286" class="body">Поиск по шаблону, не regex.</text><rect x="643" y="109" width="598" height="218" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.3"/><text x="668" y="149" class="title">2 · Шаблоны</text><text x="668" y="195" class="code">[Nn][Oo]*    |    [Yy]??</text><text x="668" y="232" class="body">? — один символ; * — любое количество.</text><text x="668" y="259" class="body">[xy] — один из набора символов.</text><text x="668" y="286" class="body">| объединяет альтернативы одной ветви.</text><rect x="38" y="350" width="1203" height="199" rx="16" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.3"/><text x="64" y="393" class="title">3 · Три разных завершения</text><text x="64" y="433" class="body">;;    — закончить обработку case.</text><text x="64" y="460" class="body">;&amp;   — без сравнения выполнить тело следующей ветви.</text><text x="64" y="487" class="body">;;&amp;  — продолжить сравнение следующих шаблонов.</text><rect x="38" y="573" width="575" height="202" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="64" y="612" class="title">4 · list.sh: выбор режима ls</text><text x="64" y="650" class="body">color → цветной вывод</text><text x="64" y="674" class="body">last / latest → список и tail</text><text x="64" y="698" class="body">len* → длина имени и сортировка</text><text x="64" y="722" class="body">long → самое длинное имя</text><text x="64" y="746" class="body">прочее → Usage_Exit</text><rect x="643" y="573" width="598" height="202" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><text x="668" y="612" class="title">5 · wrapper.sh: сценарий-обёртка</text><text x="668" y="650" class="body">h1 / h2 / h3 → заголовки</text><text x="668" y="674" class="body">bold / italic / sub → разметка</text><text x="668" y="698" class="body">id / index / rerun / cleanup → инструменты</text><text x="668" y="722" class="body">Справка составляется из комментариев.</text><text x="668" y="746" class="body">index / rerun / cleanup затрагивают файлы.</text><rect x="38" y="797" width="1203" height="256" rx="16" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.3"/><text x="64" y="840" class="title">6 · Проверка до запуска</text><text x="64" y="881" class="body">Поместить общий шаблон * последним при обычной маршрутизации.</text><text x="64" y="908" class="body">Объяснить комментариями любое использование ;&amp; и ;;&amp;.</text><text x="64" y="935" class="body">Для index, rerun и cleanup выяснить цели, эффект и rollback.</text><text x="64" y="962" class="body">В книжном примере continue внешний цикл не показан: [Needs confirmation].</text><text x="64" y="989" class="body">Проверенные результаты исполнения команд: [Needs confirmation].</text><text x="44" y="1118" class="small">Источник: p0043:c01–p0057:c01 · CHAPTER-ARTIFACT-COLLECTION v1.7</text></svg>