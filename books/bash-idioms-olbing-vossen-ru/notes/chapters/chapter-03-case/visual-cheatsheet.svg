<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="645" viewBox="0 0 1080 645" role="img" aria-label="Глава 3. Оператор case — краткая памятка"><rect width="1080" height="645" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#15243a}.title{font-size:21px;font-weight:bold;fill:#19334c}.body{font-size:18px;fill:#344255}.code{font-size:22px;font-weight:bold;fill:#133450}.small{font-size:14px;fill:#526074}</style><text x="43" y="55" class="head">Глава 3 · Оператор case</text><text x="43" y="85" class="small">Выбор по шаблонам, не по регулярным выражениям · PDF 43–57</text><rect x="38" y="113" width="488" height="199" rx="16" fill="#e4f4f0" stroke="#7dc9b5" stroke-width="1.4"/><text x="63" y="153" class="title">Шаблоны</text><text x="63" y="197" class="body">?   — один символ</text><text x="63" y="226" class="body">*   — любое количество символов</text><text x="63" y="255" class="body">[Nn] — один из двух символов</text><text x="63" y="284" class="body">a | b — альтернатива</text><rect x="553" y="113" width="488" height="199" rx="16" fill="#fff1ed" stroke="#e7bba9" stroke-width="1.4"/><text x="579" y="153" class="title">Завершение</text><text x="579" y="197" class="body">;;    завершить case</text><text x="579" y="226" class="body">;&amp;   выполнить следующее тело</text><text x="579" y="255" class="body">;;&amp;  искать следующее совпадение</text><rect x="38" y="333" width="1003" height="177" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="64" y="374" class="title">Сценарии-обёртки</text><text x="64" y="414" class="body">list.sh: color, last/latest, len*, long</text><text x="64" y="443" class="body">wrapper.sh: разметка, справка, index, rerun, cleanup</text><text x="64" y="472" class="body">Последние три операции изменяют файлы: нужен rollback.</text><rect x="38" y="528" width="1003" height="69" rx="16" fill="#fff8e7" stroke="#dfbd71" stroke-width="1.4"/><text x="64" y="568" class="title">Сложные переходы комментировать; неизвестное — [Needs confirmation].</text><text x="42" y="624" class="small">Источник: RAG p0043:c01–p0057:c01 · PDF 43–57 · v1.7</text></svg>