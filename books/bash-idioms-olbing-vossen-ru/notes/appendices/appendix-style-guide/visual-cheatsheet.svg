<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-label="Приложение Руководство по стилю Bash, компактная памятка"><rect width="1120" height="752" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}.head{font-size:30px;font-weight:bold;fill:#172941}.title{font-size:21px;font-weight:bold;fill:#20415c}.body{font-size:18px;fill:#32485b}.small{font-size:14px;fill:#526174}</style><text x="42" y="55" class="head">Приложение · Руководство по стилю Bash</text><text x="42" y="83" class="small">PDF 193–202 · свод рекомендаций главы 11, не глава 12</text><rect x="36" y="108" width="511" height="203" rx="15" fill="#e6f3ed" stroke="#bbcbd7" stroke-width="1.3"/><text x="61" y="149" class="title">Читаемость и структура</text><text x="61" y="191" class="body">KISS, понятные имена и помощь -h</text><text x="61" y="220" class="body">Комментарии объясняют почему</text><text x="61" y="249" class="body">Глобальные имена UPPER, прочие lower</text><text x="61" y="278" class="body">Функции: Mixed_Case, local</text><rect x="570" y="108" width="513" height="203" rx="15" fill="#e6eef9" stroke="#bbcbd7" stroke-width="1.3"/><text x="595" y="149" class="title">Кавычки и синтаксис</text><text x="595" y="191" class="body">&quot;$(command)&quot; — значение подстановки</text><text x="595" y="220" class="body">[[ ]] — Bash-условия, (( )) — арифметика</text><text x="595" y="249" class="body">4 пробела, продолжение +2</text><text x="595" y="278" class="body">Строка около 78 знаков</text><rect x="36" y="335" width="1047" height="183" rx="15" fill="#fff" stroke="#bbcbd7" stroke-width="1.3"/><text x="61" y="376" class="title">Безопасность изменений</text><text x="61" y="419" class="body">source исполняет подключённый файл; readonly меняет переменную.</text><text x="61" y="448" class="body">set -euo pipefail меняет режим; IFS — разбиение слов.</text><text x="61" y="477" class="body">Ошибки в STDERR; коды exit определять явно.</text><rect x="36" y="540" width="1047" height="143" rx="15" fill="#fff4de" stroke="#bbcbd7" stroke-width="1.3"/><text x="61" y="580" class="title">Область применения</text><text x="61" y="619" class="body">Только Bash. Не переносить автоматически на POSIX, Dash и sh в контейнерах.</text><text x="61" y="648" class="body">Шаблон PDF 201–202 содержит заглушки: не запускать как готовый сценарий.</text><text x="42" y="733" class="small">RAG p0193:c01–p0202:c01 · адаптация v1.7 · reading status без изменений</text></svg>
