<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1570" viewBox="0 0 1330 1570" role="img" aria-label="Подробная памятка приложения Руководство по стилю Bash"><rect width="1330" height="1570" fill="#f5f7fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#25415a}.head{font-weight:bold;font-size:31px}.section{font-weight:bold;font-size:21px}.body{font-size:18px}.foot{font-size:14px}</style><text class="head" x="43" y="58">Приложение · Руководство по стилю Bash</text><text class="foot" x="43" y="88">PDF 193–202 · исходные рекомендации · RAG-only</text><rect x="37" y="112" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="151" class="section">01 · Область применения</text><text x="64" y="184" class="body">Только Bash; POSIX, Dash и контейнерный sh требуют адаптации</text><rect x="37" y="228" width="1253" height="101" rx="14" fill="#e5eef8" stroke="#bdccd7"/><text x="64" y="267" class="section">02 · Удобочитаемость</text><text x="64" y="300" class="body">KISS, говорящие имена, помощь -h, явное source, ISO-8601</text><rect x="37" y="344" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="383" class="section">03 · Комментарии</text><text x="64" y="416" class="body">Заголовки, функции, причины решений и сложные флаги</text><rect x="37" y="460" width="1253" height="101" rx="14" fill="#e5eef8" stroke="#bdccd7"/><text x="64" y="499" class="section">04 · Имена</text><text x="64" y="532" class="body">Глобальные UPPER; прочие lower; функции Mixed_Case</text><rect x="37" y="576" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="615" class="section">05 · Функции</text><text x="64" y="648" class="body">Определять до вызова, документировать ввод/вывод, local</text><rect x="37" y="692" width="1253" height="101" rx="14" fill="#e5eef8" stroke="#bdccd7"/><text x="64" y="731" class="section">06 · Локальные результаты</text><text x="64" y="764" class="body">local my_input; затем отдельное присваивание $(command)</text><rect x="37" y="808" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="847" class="section">07 · Кавычки</text><text x="64" y="880" class="body">Выбирать по смыслу; интерполяция, строки и проверки</text><rect x="37" y="924" width="1253" height="101" rx="14" fill="#e5eef8" stroke="#bdccd7"/><text x="64" y="963" class="section">08 · Форматирование</text><text x="64" y="996" class="body">4 пробела, продолжение +2, около 78 символов, без хвостов</text><rect x="37" y="1040" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="1079" class="section">09 · Bash-синтаксис</text><text x="64" y="1112" class="body">[[ ]], $( ), (( )), $(( )); предпочитать ясный if</text><rect x="37" y="1156" width="1253" height="101" rx="14" fill="#e5eef8" stroke="#bdccd7"/><text x="64" y="1195" class="section">10 · Контроль ошибок</text><text x="64" y="1228" class="body">set -euo pipefail с проверкой; осторожно с IFS; STDERR</text><rect x="37" y="1272" width="1253" height="101" rx="14" fill="#e6f3ed" stroke="#bdccd7"/><text x="64" y="1311" class="section">11 · Структура сценария</text><text x="64" y="1344" class="body">Shebang, заголовок, переменные, функции, основной код</text><rect x="37" y="1404" width="1253" height="104" rx="14" fill="#fff4de" stroke="#e0c18b"/><text x="64" y="1446" class="section">Не исполнять шаблон без адаптации</text><text x="64" y="1480" class="body">На PDF 201–202 есть заглушки; итоговое поведение и rollback: [Needs confirmation].</text><text class="foot" x="43" y="1547">RAG p0193:c01–p0202:c01 · v1.7 · без изменений reading status</text></svg>
