schema_version: "1.0"

chapters:
  15:
    - start: "## РАЗБОР ИНЦИДЕНТА: ПОШАГОВО"
      replacement: |-
        ## РАЗБОР ИНЦИДЕНТА: ПОШАГОВО

        Следующие шаги дают краткий практический ориентир для:

        - закрытия инцидента;
        - документирования;
        - фиксации метрик;
        - проведения послеинцидентного разбора (AAR);
        - подготовки отчётности;
        - представления результатов заинтересованным сторонам;
        - организационных улучшений.

        Разбор инцидента преследует три основные цели:

        1. задокументировать произошедшее;
        2. понять корневые и сопутствующие причины;
        3. превратить полученный опыт в устойчивые организационные улучшения.

        Источник отмечает, что это руководство также доступно в PDF/Markdown на dynamicincidentresponse.com.

        ### ШАГ 1. ОПРЕДЕЛИТЬ МАСШТАБ РАЗБОРА И ТРЕБОВАНИЯ К ДОКУМЕНТАЦИИ

        #### 1. Оценить готовность к переходу

        - Цикл действий реагирования завершён, новых IOC не выявлено.
        - Лица, принимающие решения, одобрили переход к разбору.
        - Критические системы восстановлены и проверены.
        - Принятые руководством остаточные риски задокументированы.

        #### 2. Определить глубину документирования

        Проверить организационные пороговые критерии:

        - количество затронутых систем;
        - раскрытие данных;
        - необходимость регуляторных уведомлений;
        - длительность реагирования;
        - компрометацию привилегированных учётных записей;
        - необходимость внешнего уведомления.

        Также оценить:

        - вероятность судебного разбирательства;
        - регуляторное расследование;
        - участие правоохранительных органов.

        Привлечь юридическую службу для определения требований к хранению и документированию.

        #### 3. Выбрать подход

        **Облегчённый разбор**

        - документирование в тикете;
        - подтверждение руководителя реагирования;
        - подходит для локализованных инцидентов.

        **Формальный разбор**

        - полная документация;
        - AAR;
        - отчётность для руководства;
        - подходит для значимых инцидентов.

        **Поэтапный разбор**

        - сразу зафиксировать необходимый минимум;
        - более глубокую работу при нехватке ресурсов перенести на следующий этап;
        - согласовать глубину разбора с допустимым риском.

        Задокументировать причину выбора подхода.

        #### 4. Учесть юридические и регуляторные требования

        - провести юридическую проверку практики документирования;
        - при необходимости учитывать режим юридической привилегии;
        - помнить, что объём и устойчивость такой привилегии зависят от юрисдикции;
        - определить применимые требования к хранению и документированию;
        - сбалансировать ценность организационного обучения и риски судебного раскрытия информации.

        ### ШАГ 2. УПРАВЛЯТЬ ВРЕМЕННЫМИ РЕСУРСАМИ, СОЗДАННЫМИ ВО ВРЕМЯ РЕАГИРОВАНИЯ

        #### 1. Определить судьбу форензик-доказательств

        Инвентаризировать:

        - образы дисков;
        - дампы памяти;
        - PCAP;
        - журналы.

        Согласовать сроки хранения с юридической службой.

        Определить ценность материалов для:

        - киберразведки;
        - обучения;
        - будущих расследований.

        Задокументировать решение по срокам хранения.

        Уничтожить ненужные артефакты в соответствии с политикой организации.

        #### 2. Обработать временные учётные записи и повышенный доступ

        - перечислить учётные записи, созданные для реагирования;
        - отключить или удалить их, если дальнейшее использование не обосновано;
        - отозвать временный повышенный доступ responders;
        - зафиксировать итоговое состояние и время изменения.

        #### 3. Обработать временный мониторинг

        Оценить:

        - ценность получаемой наблюдаемости;
        - влияние на производительность;
        - объём предупреждений;
        - стоимость дальнейшей эксплуатации.

        Полезные меры передать в постоянные процессы SOC/detection.

        Временный мониторинг с низкой ценностью и высокой эксплуатационной нагрузкой удалить.

        Решение задокументировать.

        ### ШАГ 3. КОНСОЛИДИРОВАТЬ ДОКУМЕНТАЦИЮ ПО ИНЦИДЕНТУ

        #### 1. Собрать все источники

        - тикеты;
        - чаты;
        - совместные документы;
        - электронную почту;
        - заметки responders;
        - форензик-отчёты;
        - вывод инструментов;
        - коммуникации с заинтересованными сторонами;
        - записи о принятых решениях.

        #### 2. Проверить и уточнить хронологию

        - сверить её с ключевыми участниками реагирования;
        - заполнить пробелы;
        - согласовать противоречащие друг другу временные метки и свидетельства;
        - указывать уровень уверенности с учётом качества доказательств.

        #### 3. Задокументировать важные решения

        Для значимых решений фиксировать:

        - рассмотренные альтернативы;
        - обоснование;
        - выбранное действие;
        - результат.

        Если позднее решение оказалось неоптимальным, зафиксировать:

        - какой информации не хватало;
        - какая информация могла бы улучшить решение.

        При необходимости фиксировать разногласия и способ их разрешения.

        Сохранить журнал решений для будущих инцидентов и юридических потребностей.

        ### ШАГ 4. ЗАФИКСИРОВАТЬ МЕТРИКИ ИНЦИДЕНТА

        #### 1. Метрики обнаружения и реагирования

        - MTTD: от начала инцидента до обнаружения;
        - MTTR: от обнаружения до разрешения;
        - время до сдерживания;
        - время до искоренения;
        - время до полного восстановления;
        - полный жизненный цикл инцидента: от первоначальной компрометации до подтверждённого разрешения.

        #### 2. Масштаб и влияние

        - количество затронутых серверов, рабочих станций и облачных ресурсов;
        - количество скомпрометированных или сброшенных учётных записей;
        - раскрытие данных:
          - число записей;
          - классификация;
          - регуляторная категория;
        - влияние на бизнес:
          - длительность нарушения работы;
          - влияние на выручку, если применимо.

        #### 3. Использование ресурсов

        - трудозатраты персонала;
        - внешняя поддержка;
        - инструменты и инфраструктура;
        - затраты на выкуп/вымогательство, если применимо.

        #### 4. Сохранить метрики для последующего улучшения

        - использовать единый формат для разных инцидентов;
        - сравнивать с внутренней базовой линией;
        - выявлять тренды зрелости и возможностей;
        - использовать данные при планировании защиты и обосновании ресурсов.

        ### ШАГ 5. ПРОВЕСТИ ПОСЛЕИНЦИДЕНТНЫЙ РАЗБОР

        #### 1. Запланировать и подготовить

        - провести в течение 1–2 недель после закрытия;
        - пригласить все релевантные команды;
        - подготовить визуальную хронологию;
        - подготовить краткое изложение выводов;
        - заранее установить правило разбора без поиска виноватых.

        Фокусироваться на системных причинах:

        - недостаточных средствах контроля;
        - неясных процедурах;
        - ограничениях ресурсов.

        Вопросы индивидуальной производительности рассматривать отдельно.

        #### 2. Основные вопросы AAR

        - Что должно было произойти?
        - Что произошло на самом деле?
        - Почему возникли различия?
        - Что можно сделать лучше?
        - Что сработало хорошо?
        - Почему это сработало?

        #### 3. Зафиксировать и приоритизировать рекомендации

        - записать предложения;
        - классифицировать:
          - немедленные;
          - краткосрочные;
          - долгосрочные;
        - назначить владельцев;
        - назначить сроки;
        - приоритизировать по снижению риска и реализуемости.

        #### 4. Задокументировать результат AAR

        - участников;
        - краткое резюме;
        - ключевые выводы;
        - рекомендации;
        - владельцев и сроки;
        - нерешённые вопросы;
        - последующие контрольные встречи.

        ### ШАГ 6. ПОДГОТОВИТЬ ОТЧЁТЫ ОБ ИНЦИДЕНТЕ — КОГДА ЭТО ТРЕБУЕТСЯ

        #### 1. Облегчённая документация

        - краткий Debrief Summary в тикете инцидента;
        - что произошло;
        - что сработало;
        - что нужно улучшить;
        - участники;
        - подтверждение руководителя инцидента;
        - подтверждение руководства;
        - формальное закрытие.

        #### 2. Определить цель и аудиторию формальной отчётности

        Определить:

        - основную аудиторию;
        - какие решения должен поддерживать отчёт;
        - внутреннее/внешнее распространение;
        - форензик- и доказательственные требования;
        - обязательства HIPAA/PCI DSS/GDPR или иные;
        - единый отчёт или несколько версий для разных аудиторий.

        #### 3. Краткий отчёт для руководства

        Для значимых инцидентов:

        - краткий объём, обычно 1–3 страницы;
        - обзор инцидента;
        - влияние на бизнес;
        - важные выводы;
        - метрики;
        - рекомендации и требуемые ресурсы;
        - структурированное бизнес-обоснование:
          - возможность;
          - выгода;
          - стоимость;
          - время;
          - ресурсы;
        - решения, требуемые от руководства;
        - ссылка на технический отчёт.

        #### 4. Технический отчёт об инциденте

        Включить:

        - полную хронологию действий атакующего и команды реагирования;
        - анализ атаки;
        - сопоставление с фреймворками, например MITRE ATT&CK, где применимо;
        - затронутые активы;
        - скомпрометированные идентичности;
        - IOC;
        - RCA;
        - сопутствующие факторы;
        - рекомендации;
        - указания по реализации;
        - приложения с доказательствами, запросами и артефактами.

        ### ШАГ 7. ПРЕДСТАВИТЬ ВЫВОДЫ И РЕКОМЕНДАЦИИ ЗАИНТЕРЕСОВАННЫМ СТОРОНАМ

        #### 1. Подготовить и запланировать

        - провести вскоре после завершения документации;
        - обычно в течение 1–2 недель;
        - привлечь лиц, принимающих решения и обладающих полномочиями по ресурсам и политикам;
        - сосредоточить презентацию на выводах, влиянии и рекомендациях;
        - назначить ведущего;
        - назначить человека для фиксации решений.

        #### 2. Провести сессию

        Рассмотреть:

        - хронологию;
        - ключевые выводы;
        - влияние на бизнес;
        - уровень риска;
        - сроки реализации;
        - потребности в ресурсах;
        - вопросы заинтересованных сторон.

        Зафиксировать решения и action items.

        #### 3. Распространить результаты

        В течение 24–48 часов отправить:

        - сводку решений;
        - action items;
        - статус рекомендаций:
          - одобрено;
          - изменено;
          - отложено;
        - выделенные ресурсы;
        - владельцев и ответственность.

        ### ШАГ 8. ОБЕСПЕЧИТЬ ОРГАНИЗАЦИОННЫЕ УЛУЧШЕНИЯ

        #### 1. Интегрировать извлечённые уроки

        - обновить планы IR;
        - обновить плейбуки;
        - скорректировать правила обнаружения;
        - улучшить мониторинг;
        - создать учебные сценарии;
        - при необходимости делиться релевантной threat intelligence с партнёрами/ISAC.

        #### 2. Отслеживать реализацию

        - внести рекомендации в проектный/security-трекинг;
        - определить контрольные точки;
        - назначить владельцев;
        - зафиксировать ожидаемый результат реализации.

        #### 3. Проводить контрольные обзоры

        - использовать цикл 30/60/90 дней;
        - обеспечить участие руководства;
        - устранять блокеры и ресурсные ограничения;
        - эскалировать рекомендации, реализация которых остановилась.

        #### 4. Завершить разбор

        - немедленные рекомендации реализованы или выполняются по плану;
        - долгосрочные задачи включены в планирование/бюджетирование;
        - документация инцидента архивирована согласно политике хранения;
        - организационные метрики и данные о трендах обновлены.

  18:
    - start: "# ВРЕЗКА: РАСПРОСТРАНЁННЫЕ ОШИБКИ ОБЛАЧНОГО IR"
      end: "# ВОЗМОЖНОСТИ АВТОМАТИЗИРОВАННОГО РЕАГИРОВАНИЯ"
      replacement: |-
        # ВРЕЗКА: РАСПРОСТРАНЁННЫЕ ОШИБКИ ОБЛАЧНОГО IR

        Несколько ошибок регулярно повторяются при реагировании на инциденты в облачной среде.

        ## 1. Выключение скомпрометированного инстанса до фиксации доказательств

        После остановки или удаления инстанса волатильные данные могут быть безвозвратно потеряны:

        - содержимое памяти;
        - запущенные процессы;
        - активные сетевые соединения.

        До разрушительного действия следует сохранить необходимые данные: snapshot, сетевую и runtime-телеметрию, а при наличии возможности — сведения о памяти и процессах.

        ## 2. Ротация учётных данных без отзыва активных сессий

        Новый пароль или ключ доступа не обязательно делает уже выданные токены недействительными. Если у атакующего остаётся действующий session token, доступ может сохраниться и после ротации.

        Поэтому ротацию учётных данных нужно дополнять явным отзывом активных сессий и токенов.

        ## 3. Предположение, что журналы плоскости управления показывают всю картину

        Расследование только по CloudTrail, Azure Activity Log или аналогичному журналу может пропустить:

        - латеральное перемещение;
        - фактический доступ к данным;
        - события, видимые только в журналах плоскости данных;
        - сетевые потоки;
        - host/runtime-телеметрию.

        Журналы плоскости управления показывают, какие API- и конфигурационные действия выполнялись, но не всегда показывают, что произошло с данными и workload после этого.

        ## 4. Проверка только одного региона

        Облачные провайдеры работают во многих регионах. Атакующий может создать механизм закрепления в регионе, которым организация обычно не пользуется.

        Ключ доступа, полученный в одном регионе, может быть применён для создания функции, VM или другого ресурса в другом регионе.

        Во время определения масштаба и искоренения необходимо перечислять релевантные ресурсы во всех регионах.

        Общая причина этих ошибок — перенос on-premises предположений в облачную среду. Специальные cloud-IR checklist'ы в runbook'ах и регулярные tabletop-учения уменьшают риск таких ошибок под давлением реального инцидента.


  19:
    - start: "# ВРЕЗКА: ПРОДОЛЖЕНИЕ БЕЗОПАСНОЙ РАБОТЫ ВО ВРЕМЯ АТАКИ"
      end: "# ТИПОВЫЕ OT-ИНЦИДЕНТЫ"
      replacement: |-
        # ВРЕЗКА: ПРОДОЛЖЕНИЕ БЕЗОПАСНОЙ РАБОТЫ ВО ВРЕМЯ АТАКИ

        В OT немедленная цель не всегда состоит в остановке систем.

        Иногда безопаснее продолжить контролируемую работу, пока:

        - собираются доказательства;
        - подтверждается состояние технологического процесса;
        - инженеры и операционный персонал оценивают варианты реагирования.

        Это позволяет сохранить наблюдаемость и управление процессом и снижает риск того, что само реагирование вызовет нестабильность.

        # ПРИМЕР: ПРОДОЛЖЕНИЕ РАБОТЫ ВО ВРЕМЯ АТАКИ ДЛЯ СОХРАНЕНИЯ ГЕНЕРАЦИИ ЭЛЕКТРОЭНЕРГИИ

        На гидроэлектростанции возник выбор между немедленным остановом и продолжением безопасной работы во время атаки.

        В координации участвовали:

        - инженеры;
        - операционный персонал;
        - физическая безопасность.

        Вместо отключения скомпрометированного HMI команда изолировала путь доступа атакующего на уровне промышленной DMZ (Level 3.5).

        OT-сеть отделили от IT-среды, откуда исходила атака.

        Это было намеренное сдерживание с учётом инженерного контекста:

        - основное управление станцией не зависело от IT или интернета;
        - после изоляции внешнего периметра удалённая сессия к HMI завершилась;
        - операторы сохранили наблюдаемость и управление процессом.

        Работа продолжилась через встроенные HMI на выделенных системах управления.

        Такое сдерживание позволило одновременно:

        - сохранить генерацию;
        - продолжить форензик-анализ;
        - подготовить восстановление.

    - start: "# ПЯТЬ КРИТИЧЕСКИХ МЕР КИБЕРБЕЗОПАСНОСТИ ICS"
      end: "# Ссылки"
      replacement: |-
        # ПЯТЬ КРИТИЧЕСКИХ МЕР КИБЕРБЕЗОПАСНОСТИ ICS

        Эффективное реагирование в OT требует одновременно:

        - экспертизы по кибербезопасности;
        - знаний промышленной инженерии.

        OT-response находится на пересечении киберзащиты и управления физическим процессом. Успех зависит от совместной работы:

        - IT security;
        - специалистов по кибербезопасности OT;
        - операторов;
        - инженеров.

        Five ICS Cybersecurity Critical Controls и специализированный план реагирования дают практическую основу для безопасного и инженерно обоснованного подхода.[9]

        ### Рисунок 199. The Five ICS Cybersecurity Critical Controls

        THIRD_PARTY_REVIEW_REQUIRED — внешний визуальный материал не воспроизводится.

        ## 1. Специализированное реагирование на инциденты ICS

        План должен учитывать реальность систем управления:

        - операционный контекст;
        - требования безопасности;
        - целостность технологического процесса;
        - контролируемое восстановление;
        - возможность продолжать операции во время активного инцидента.

        Учения должны моделировать, в частности:

        - потерю операторской наблюдаемости;
        - изменение логики контроллеров;
        - несанкционированный удалённый доступ.

        Без OT-специфичной подготовки команда рискует действовать либо чрезмерно агрессивно, либо слишком медленно.

        ## 2. Защищаемая архитектура сети управления

        Необходимы:

        - сегментация;
        - понятные границы доверия;
        - промышленная DMZ;
        - наблюдаемость управляющего трафика;
        - инвентаризация активов;
        - сбор журналов;
        - контроль ожидаемых коммуникаций.

        В плохо сегментированной среде сложнее определить масштаб, проследить латеральное перемещение и оценить blast radius. Это повышает риск чрезмерно широких или разрушительных действий реагирования.

        ## 3. Сетевая наблюдаемость и мониторинг OT

        Многие OT-активы не поддерживают endpoint agents, поэтому непрерывный протокол-осведомлённый мониторинг становится одним из основных источников форензик-данных.

        Наблюдаемость промышленных протоколов помогает:

        - подтверждать инциденты;
        - выявлять затронутые активы и процессы;
        - понимать действия атакующего;
        - отличать вредоносную активность от штатной инженерной работы;
        - уменьшать ложные срабатывания;
        - принимать более безопасные решения реагирования.

        ## 4. Защищённый удалённый доступ

        Удалённый доступ — один из часто злоупотребляемых путей в OT.

        Организация должна чётко понимать:

        - как реализован удалённый доступ;
        - какие пользователи и поставщики уполномочены;
        - к каким системам они могут подключаться.

        Защищённая архитектура использует:

        - ограниченный по времени доступ;
        - сильную аутентификацию;
        - MFA, где это возможно;
        - контролируемые jump hosts;
        - сегментацию;
        - мониторинг.

        Во время инцидента пути удалённого доступа часто становятся ключевыми точками сдерживания.

        ## 5. Управление уязвимостями на основе риска

        В OT vulnerability management не сводится к принципу «пропатчить всё».

        Нужно определить:

        - какие уязвимости действительно значимы;
        - какие системы можно безопасно обновить;
        - где требуются компенсирующие меры;
        - где предпочтительнее усиленный мониторинг;
        - какие операционные ограничения существуют;
        - какие пути эксплуатации реально доступны.

        Исправление может быть:

        - немедленным;
        - отложенным;
        - компенсированным мониторингом и другими мерами.

        Главный критерий: мера защиты не должна ухудшать безопасность и надёжность физического процесса.

        Вместе эти пять мер формируют повторяемую и защищаемую способность OT IR, согласующую кибербезопасность с инженерной реальностью.

