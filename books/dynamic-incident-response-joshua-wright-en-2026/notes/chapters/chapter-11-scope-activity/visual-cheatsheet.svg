<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="45" y="55" font-family="Arial" font-size="34" font-weight="700">Глава 11 — Scope Activity</text>
<rect x="60" y="120" width="260" height="150" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
