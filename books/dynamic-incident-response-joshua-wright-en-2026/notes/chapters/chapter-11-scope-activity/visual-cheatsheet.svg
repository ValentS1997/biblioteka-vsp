<text x="680" y="460" font-family="Arial" font-size="17">critical assets</text>
<text x="680" y="495" font-family="Arial" font-size="17">→ lateral expansion</text>
<text x="680" y="530" font-family="Arial" font-size="17">→ environmental sweep</text>

<text x="190" y="650" font-family="Arial" font-size="24" font-weight="700">Scope = определить реальную границу incident, а не только известные hosts.</text>
