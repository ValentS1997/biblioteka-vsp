<rect x="190" y="830" width="1020" height="95" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="230" y="885" font-family="Arial" font-size="22" font-weight="700">Compliance becomes a byproduct of disciplined response when evidence and rationale are captured continuously.</text>
