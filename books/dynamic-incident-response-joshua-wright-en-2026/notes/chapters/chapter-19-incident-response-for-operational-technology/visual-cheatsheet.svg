<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#fff"/>
<text x="45" y="55" font-family="Arial" font-size="34" font-weight="700">Глава 19 — OT Incident Response</text>

<rect x="60" y="120" width="250" height="150" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="90" y="160" font-family="Arial" font-size="22" font-weight="700">Verify</text>
<text x="90" y="200" font-family="Arial" font-size="17">engineering context</text>
<text x="90" y="235" font-family="Arial" font-size="17">process + safety impact</text>

<rect x="350" y="120" width="250" height="150" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="380" y="160" font-family="Arial" font-size="22" font-weight="700">Scope</text>
<text x="380" y="200" font-family="Arial" font-size="17">network / protocol</text>
<text x="380" y="235" font-family="Arial" font-size="17">controller / process</text>

<rect x="640" y="120" width="250" height="150" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="670" y="160" font-family="Arial" font-size="22" font-weight="700">Contain</text>
<text x="670" y="200" font-family="Arial" font-size="17">preserve visibility</text>
<text x="670" y="235" font-family="Arial" font-size="17">island/manual mode</text>

<rect x="930" y="120" width="210" height="150" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="960" y="160" font-family="Arial" font-size="22" font-weight="700">Recover</text>
<text x="960" y="200" font-family="Arial" font-size="17">trusted logic</text>
<text x="960" y="235" font-family="Arial" font-size="17">controlled startup</text>

<rect x="110" y="390" width="430" height="180" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="140" y="430" font-family="Arial" font-size="22" font-weight="700">Critical warning</text>
<text x="140" y="470" font-family="Arial" font-size="17">IT-style isolation can remove</text>
<text x="140" y="505" font-family="Arial" font-size="17">operator visibility or process control</text>
<text x="140" y="540" font-family="Arial" font-size="17">response action may exceed threat impact</text>

<rect x="660" y="390" width="430" height="180" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="690" y="430" font-family="Arial" font-size="22" font-weight="700">Five ICS controls</text>
<text x="690" y="470" font-family="Arial" font-size="17">OT-specific IR • architecture</text>
<text x="690" y="505" font-family="Arial" font-size="17">visibility • remote access</text>
<text x="690" y="540" font-family="Arial" font-size="17">risk-based vulnerability management</text>

<text x="150" y="650" font-family="Arial" font-size="24" font-weight="700">OT IR succeeds when cyber response preserves safe control of the process.</text>
</svg>