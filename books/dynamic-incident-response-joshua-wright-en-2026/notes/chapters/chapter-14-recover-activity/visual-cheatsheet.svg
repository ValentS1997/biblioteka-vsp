<text x="690" y="505" font-family="Arial" font-size="17">capture metrics and issues</text>
<text x="690" y="540" font-family="Arial" font-size="17">handoff to Debrief</text>

<text x="170" y="650" font-family="Arial" font-size="24" font-weight="700">Recovery = secure + functional + accepted + monitored production return.</text>
