<rect x="60" y="120" width="250" height="150" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="90" y="160" font-family="Arial" font-size="22" font-weight="700">Verify</text>
<text x="90" y="200" font-family="Arial" font-size="17">root cause / persistence</text>
<text x="90" y="235" font-family="Arial" font-size="17">backup / controls</text>

<rect x="350" y="120" width="250" height="150" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="380" y="160" font-family="Arial" font-size="22" font-weight="700">Validate</text>
<text x="380" y="200" font-family="Arial" font-size="17">functional + security</text>
<text x="380" y="235" font-family="Arial" font-size="17">dependencies</text>

<rect x="640" y="120" width="250" height="150" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="670" y="160" font-family="Arial" font-size="22" font-weight="700">Accept</text>
