<text x="670" y="235" font-family="Arial" font-size="17">known limitations</text>

<rect x="930" y="120" width="210" height="150" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="960" y="160" font-family="Arial" font-size="22" font-weight="700">Monitor</text>
<text x="960" y="200" font-family="Arial" font-size="17">enhanced logging</text>
<text x="960" y="235" font-family="Arial" font-size="17">detect recurrence</text>

<rect x="110" y="390" width="430" height="180" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="140" y="430" font-family="Arial" font-size="22" font-weight="700">Recovery strategy</text>
<text x="140" y="470" font-family="Arial" font-size="17">phased when confidence is limited</text>
<text x="140" y="505" font-family="Arial" font-size="17">coordinated when systems are coupled</text>
<text x="140" y="540" font-family="Arial" font-size="17">dependency order matters</text>

<rect x="660" y="390" width="430" height="180" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
