<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#ffffff"/>
  <style>
    .title{font:700 36px Arial,sans-serif;fill:#1f3f6d}
    .h{font:700 21px Arial,sans-serif;fill:#1f3f6d}
    .t{font:16px Arial,sans-serif;fill:#20242a}
    .box{fill:#f6f8fb;stroke:#8aa2c4;stroke-width:2;rx:14}
    .warn{fill:#fff7e8;stroke:#c89b4a;stroke-width:2;rx:14}
    .good{fill:#eef8f0;stroke:#6d9d76;stroke-width:2;rx:14}
    .bad{fill:#fff0f0;stroke:#c56b6b;stroke-width:2;rx:14}
    .a{stroke:#5e6d7c;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e6d7c"/></marker></defs>

  <text x="55" y="55" class="title">Глава 2 — рамка современной функции Incident Response</text>

  <text x="55" y="100" class="h">1. Почему IR стал сложнее</text>
  <rect x="55" y="125" width="400" height="250" class="box"/>
  <text x="80" y="160" class="t">• зависимость от digital services</text>
  <text x="80" y="190" class="t">• рост complexity / volume threats</text>
  <text x="80" y="220" class="t">• regulation и reporting</text>
  <text x="80" y="250" class="t">• ransomware / extortion</text>
  <text x="80" y="280" class="t">• cloud / third-party risk</text>
  <text x="80" y="310" class="t">• remote work</text>
  <text x="80" y="340" class="t">• AI-driven attack orchestration</text>

  <text x="500" y="100" class="h">2. Что требуется responder'у</text>
  <rect x="500" y="125" width="400" height="250" class="warn"/>
  <text x="525" y="160" class="t">• работать при incomplete information</text>
  <text x="525" y="190" class="t">• сохранять judgment under pressure</text>
  <text x="525" y="220" class="t">• понимать sphere of influence</text>
  <text x="525" y="250" class="t">• работать с decision makers</text>
  <text x="525" y="280" class="t">• балансировать precision / strategy</text>
  <text x="525" y="310" class="t">• адаптировать response</text>
  <text x="525" y="340" class="t">• учиться на каждом incident</text>

  <text x="945" y="100" class="h">3. Tools — support layer</text>
  <rect x="945" y="125" width="400" height="250" class="good"/>
  <text x="970" y="160" class="t">Forensics platform</text>
  <text x="970" y="190" class="t">Endpoint protection</text>
  <text x="970" y="220" class="t">Threat intelligence</text>
  <text x="970" y="250" class="t">Managed provider</text>
  <text x="970" y="280" class="t">SIEM</text>
  <text x="970" y="310" class="t">XDR</text>
  <text x="970" y="340" class="t">SOAR</text>

  <text x="55" y="440" class="h">4. Response logic</text>
  <rect x="55" y="465" width="220" height="100" class="box"/>
  <text x="82" y="505" class="t">Observe / Identify</text>
  <text x="82" y="535" class="t">initial signal</text>

  <rect x="325" y="465" width="220" height="100" class="warn"/>
  <text x="352" y="505" class="t">Verify / Triage</text>
  <text x="352" y="535" class="t">is it real / priority?</text>

  <rect x="595" y="465" width="220" height="100" class="warn"/>
  <text x="622" y="505" class="t">Scope</text>
  <text x="622" y="535" class="t">how far did it go?</text>

  <rect x="865" y="465" width="220" height="100" class="good"/>
  <text x="892" y="495" class="t">Contain / Eradicate</text>
  <text x="892" y="525" class="t">Recover</text>

  <rect x="1135" y="465" width="210" height="100" class="box"/>
  <text x="1162" y="505" class="t">Review / Metrics</text>
  <text x="1162" y="535" class="t">Improve</text>

  <path d="M275 515 L320 515" class="a"/>
  <path d="M545 515 L590 515" class="a"/>
  <path d="M815 515 L860 515" class="a"/>
  <path d="M1085 515 L1130 515" class="a"/>

  <rect x="245" y="650" width="910" height="190" class="bad"/>
  <text x="280" y="690" class="h">Failure modes highlighted by Chapter 2</text>
  <text x="280" y="730" class="t">• incomplete scope → confident but wrong assurances</text>
  <text x="280" y="765" class="t">• premature/narrow containment → attacker notices response</text>
  <text x="280" y="800" class="t">• rushed eradication → persistence survives</text>
  <text x="280" y="835" class="t">• poor recovery communication → downtime / data loss</text>

  <rect x="245" y="885" width="910" height="62" class="warn"/>
  <text x="285" y="924" class="h">Book thesis: не script, а repeatable framework для better decisions under pressure.</text>
</svg>