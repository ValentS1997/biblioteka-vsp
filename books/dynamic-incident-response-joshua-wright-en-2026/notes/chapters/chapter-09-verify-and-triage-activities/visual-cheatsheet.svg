<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="45" y="55" font-family="Arial" font-size="34" font-weight="700">Глава 9 — Verify + Triage</text>

<rect x="70" y="120" width="220" height="120" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="105" y="160" font-family="Arial" font-size="22" font-weight="700">Detect</text>
<text x="105" y="195" font-family="Arial" font-size="17">EOI + evidence</text>

<rect x="350" y="120" width="260" height="120" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="385" y="160" font-family="Arial" font-size="22" font-weight="700">Verify</text>
<text x="385" y="195" font-family="Arial" font-size="17">real / not real / unknown</text>

<rect x="670" y="120" width="220" height="120" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="705" y="160" font-family="Arial" font-size="22" font-weight="700">Triage</text>
<text x="705" y="195" font-family="Arial" font-size="17">priority + resources</text>

<rect x="950" y="120" width="180" height="120" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="980" y="160" font-family="Arial" font-size="22" font-weight="700">Respond</text>
<text x="980" y="195" font-family="Arial" font-size="17">actions loop</text>

<rect x="100" y="350" width="300" height="170" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="130" y="390" font-family="Arial" font-size="22" font-weight="700">Verification outcomes</text>
<text x="130" y="430" font-family="Arial" font-size="17">Continue</text>
<text x="130" y="465" font-family="Arial" font-size="17">Stop</text>
<text x="130" y="500" font-family="Arial" font-size="17">Defer</text>

<rect x="450" y="350" width="300" height="170" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="480" y="390" font-family="Arial" font-size="22" font-weight="700">Context</text>
<text x="480" y="430" font-family="Arial" font-size="17">CTI / local knowledge</text>
<text x="480" y="465" font-family="Arial" font-size="17">risk / regulation</text>
<text x="480" y="500" font-family="Arial" font-size="17">business impact</text>

<rect x="800" y="350" width="300" height="170" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="830" y="390" font-family="Arial" font-size="22" font-weight="700">Key warning</text>
<text x="830" y="430" font-family="Arial" font-size="17">No CTI hit ≠ no threat</text>
<text x="830" y="465" font-family="Arial" font-size="17">No IOC found ≠ proof</text>
<text x="830" y="500" font-family="Arial" font-size="17">Document coverage</text>

<text x="210" y="650" font-family="Arial" font-size="24" font-weight="700">Verify = is it real? • Triage = what should we do about it?</text>
</svg>