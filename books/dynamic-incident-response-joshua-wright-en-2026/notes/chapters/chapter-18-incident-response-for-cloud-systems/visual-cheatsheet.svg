<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#fff"/>
<text x="45" y="55" font-family="Arial" font-size="34" font-weight="700">Глава 18 — Cloud Incident Response</text>
<rect x="60" y="120" width="250" height="150" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="90" y="160" font-family="Arial" font-size="22" font-weight="700">Identity</text>
<text x="90" y="200" font-family="Arial" font-size="17">roles / tokens / keys</text>
<text x="90" y="235" font-family="Arial" font-size="17">effective permissions</text>
<rect x="350" y="120" width="250" height="150" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="380" y="160" font-family="Arial" font-size="22" font-weight="700">Telemetry</text>
<text x="380" y="200" font-family="Arial" font-size="17">control + data plane</text>
<text x="380" y="235" font-family="Arial" font-size="17">flow + runtime</text>
<rect x="640" y="120" width="250" height="150" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="670" y="160" font-family="Arial" font-size="22" font-weight="700">Scope</text>
<text x="670" y="200" font-family="Arial" font-size="17">all regions / accounts</text>
<text x="670" y="235" font-family="Arial" font-size="17">resources / SaaS</text>
<rect x="930" y="120" width="210" height="150" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="960" y="160" font-family="Arial" font-size="22" font-weight="700">Contain</text>
<text x="960" y="200" font-family="Arial" font-size="17">preserve evidence</text>
<text x="960" y="235" font-family="Arial" font-size="17">isolate safely</text>
<rect x="110" y="390" width="430" height="180" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="140" y="430" font-family="Arial" font-size="22" font-weight="700">Common mistakes</text>
<text x="140" y="470" font-family="Arial" font-size="17">terminate before capture</text>
<text x="140" y="505" font-family="Arial" font-size="17">rotate creds but keep sessions</text>
<text x="140" y="540" font-family="Arial" font-size="17">single log layer / single region</text>
<rect x="660" y="390" width="430" height="180" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="690" y="430" font-family="Arial" font-size="22" font-weight="700">Cloud advantage</text>
<text x="690" y="470" font-family="Arial" font-size="17">API-driven response</text>
<text x="690" y="505" font-family="Arial" font-size="17">immutable evidence storage</text>
<text x="690" y="540" font-family="Arial" font-size="17">on-demand forensic tooling</text>
<text x="145" y="650" font-family="Arial" font-size="24" font-weight="700">Cloud IR = identity + permissions + telemetry + all-region resource context.</text>
</svg>