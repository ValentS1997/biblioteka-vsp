<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#ffffff"/>
<text x="45" y="55" font-family="Arial" font-size="36" font-weight="700">Глава 6 — Dynamic Approach to Incident Response</text>

<rect x="70" y="120" width="200" height="100" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="105" y="160" font-family="Arial" font-size="22" font-weight="700">Prepare</text>
<text x="105" y="192" font-family="Arial" font-size="16">готовность</text>

<rect x="320" y="120" width="200" height="100" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="360" y="160" font-family="Arial" font-size="22" font-weight="700">Detect</text>
<text x="360" y="192" font-family="Arial" font-size="16">поиск EOI</text>

<rect x="570" y="120" width="250" height="100" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="600" y="160" font-family="Arial" font-size="22" font-weight="700">Verify + Triage</text>
<text x="600" y="192" font-family="Arial" font-size="16">подтвердить + приоритизировать</text>

<rect x="870" y="120" width="220" height="100" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="910" y="160" font-family="Arial" font-size="22" font-weight="700">Scope</text>
<text x="910" y="192" font-family="Arial" font-size="16">понять breadth</text>

<rect x="1140" y="120" width="190" height="100" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="1175" y="160" font-family="Arial" font-size="22" font-weight="700">Debrief</text>
<text x="1175" y="192" font-family="Arial" font-size="16">improve</text>

<text x="50" y="300" font-family="Arial" font-size="24" font-weight="700">Response Actions Loop</text>

<rect x="110" y="340" width="250" height="130" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="145" y="385" font-family="Arial" font-size="22" font-weight="700">Scope</text>
<text x="145" y="425" font-family="Arial" font-size="16">IOC / TTP / affected systems</text>

<rect x="430" y="340" width="250" height="130" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="465" y="385" font-family="Arial" font-size="22" font-weight="700">Contain</text>
<text x="465" y="425" font-family="Arial" font-size="16">limit impact</text>

<rect x="750" y="340" width="250" height="130" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="785" y="385" font-family="Arial" font-size="22" font-weight="700">Eradicate</text>
<text x="785" y="425" font-family="Arial" font-size="16">remove known threat</text>

<rect x="1070" y="340" width="250" height="130" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="1105" y="385" font-family="Arial" font-size="22" font-weight="700">Recover</text>
<text x="1105" y="425" font-family="Arial" font-size="16">restore systems</text>

<rect x="100" y="560" width="540" height="230" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="130" y="605" font-family="Arial" font-size="22" font-weight="700">Why iteration is mandatory</text>
<text x="130" y="650" font-family="Arial" font-size="16">unauthorized account found</text>
<text x="130" y="685" font-family="Arial" font-size="16">↓ containment + analysis</text>
<text x="130" y="720" font-family="Arial" font-size="16">malicious scheduled task discovered</text>
<text x="130" y="755" font-family="Arial" font-size="16">↓ new scoping indicator → more systems</text>

<rect x="760" y="560" width="540" height="230" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="790" y="605" font-family="Arial" font-size="22" font-weight="700">Decision-maker context</text>
<text x="790" y="650" font-family="Arial" font-size="16">system criticality / revenue / SLA</text>
<text x="790" y="685" font-family="Arial" font-size="16">acceptable disruption / legal duties</text>
<text x="790" y="720" font-family="Arial" font-size="16">business continuity / customer impact</text>
<text x="790" y="755" font-family="Arial" font-size="16">technical response must align with these</text>

<rect x="190" y="855" width="1020" height="70" rx="14" fill="#fff0f0" stroke="#c56b6b"/>
<text x="235" y="898" font-family="Arial" font-size="22" font-weight="700">Loop exit: no new evidence + IRT confidence + decision-maker confidence.</text>
</svg>