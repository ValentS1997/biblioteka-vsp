<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="45" y="55" font-family="Arial" font-size="34" font-weight="700">Глава 5 — классические IR-модели и их gaps</text>

<rect x="55" y="115" width="300" height="180" rx="14" fill="#f6f8fb" stroke="#8aa2c4"/>
<text x="80" y="155" font-family="Arial" font-size="22" font-weight="700">PICERL</text>
<text x="80" y="195" font-family="Arial" font-size="17">Prepare → Identify</text>
<text x="80" y="225" font-family="Arial" font-size="17">Contain → Eradicate</text>
<text x="80" y="255" font-family="Arial" font-size="17">Recover → Lessons Learned</text>

<rect x="450" y="115" width="300" height="180" rx="14" fill="#eef8f0" stroke="#6d9d76"/>
<text x="475" y="155" font-family="Arial" font-size="22" font-weight="700">NIST</text>
<text x="475" y="195" font-family="Arial" font-size="17">Rev.2: 4-phase lifecycle</text>
<text x="475" y="225" font-family="Arial" font-size="17">Rev.3: CSF integration</text>
<text x="475" y="255" font-family="Arial" font-size="17">Govern → Recover</text>

<rect x="845" y="115" width="300" height="180" rx="14" fill="#fff7e8" stroke="#c89b4a"/>
<text x="870" y="155" font-family="Arial" font-size="22" font-weight="700">Common variants</text>
<text x="870" y="195" font-family="Arial" font-size="17">7-step / retest</text>
<text x="870" y="225" font-family="Arial" font-size="17">communication / docs</text>
<text x="870" y="255" font-family="Arial" font-size="17">circular process</text>

<text x="55" y="365" font-family="Arial" font-size="24" font-weight="700">Пять gaps, которые глава считает критичными</text>

<rect x="55" y="405" width="205" height="120" rx="12" fill="#fff0f0" stroke="#c56b6b"/>
<text x="80" y="448" font-family="Arial" font-size="18" font-weight="700">Scoping</text>
<text x="80" y="485" font-family="Arial" font-size="15">breadth unknown</text>

<rect x="280" y="405" width="205" height="120" rx="12" fill="#fff0f0" stroke="#c56b6b"/>
<text x="305" y="448" font-family="Arial" font-size="18" font-weight="700">Iteration</text>
<text x="305" y="485" font-family="Arial" font-size="15">linear bias</text>

<rect x="505" y="405" width="205" height="120" rx="12" fill="#fff0f0" stroke="#c56b6b"/>
<text x="530" y="448" font-family="Arial" font-size="18" font-weight="700">Prioritization</text>
<text x="530" y="485" font-family="Arial" font-size="15">limited resources</text>

<rect x="730" y="405" width="205" height="120" rx="12" fill="#fff0f0" stroke="#c56b6b"/>
<text x="755" y="448" font-family="Arial" font-size="18" font-weight="700">Verification</text>
<text x="755" y="485" font-family="Arial" font-size="15">event ≠ incident</text>

<rect x="955" y="405" width="205" height="120" rx="12" fill="#fff0f0" stroke="#c56b6b"/>
<text x="980" y="448" font-family="Arial" font-size="18" font-weight="700">Root cause</text>
<text x="980" y="485" font-family="Arial" font-size="15">symptom ≠ cause</text>

<rect x="180" y="600" width="840" height="64" rx="12" fill="#fff7e8" stroke="#c89b4a"/>
<text x="225" y="640" font-family="Arial" font-size="21" font-weight="700">Modern IR = structured foundation + explicit adaptation and iteration.</text>
</svg>