<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1420" viewBox="0 0 1680 1420">
<rect width="1680" height="1420" fill="#eef5f8"/><rect width="1680" height="170" fill="#173349"/>
<text x="48" y="72" font-family="DejaVu Sans,Arial" font-size="40" fill="#fff" font-weight="700">Глава 9 | Capture → preserve → analyze → correlate</text>
<text x="50" y="122" font-family="DejaVu Sans,Arial" font-size="23" fill="#d4e9f0">tcpdump, tshark, Wireshark, BPF, SPAN, sniffing detection and spoofing indicators</text>
<g font-family="DejaVu Sans,Arial">
<rect x="38" y="205" width="510" height="430" rx="18" fill="#fff" stroke="#cbdde5"/>
<text x="65" y="250" font-size="29" fill="#267587" font-weight="700">Capture mechanics</text>
<text x="65" y="298" font-size="20" fill="#315166">Frames captured at L2</text>
<text x="65" y="340" font-size="20" fill="#315166">PCAP for later analysis</text>
<text x="65" y="382" font-size="20" fill="#315166">BPF capture filters</text>
<text x="65" y="424" font-size="20" fill="#315166">Display filters after capture</text>
<text x="65" y="466" font-size="20" fill="#315166">SPAN copies switch traffic</text>
<text x="65" y="508" font-size="20" fill="#8b5b3c">Capture filter can destroy evidence</text>
<rect x="585" y="205" width="510" height="430" rx="18" fill="#fff" stroke="#cbdde5"/>
<text x="612" y="250" font-size="29" fill="#4a6ea5" font-weight="700">Analysis quality</text>
<text x="612" y="298" font-size="20" fill="#315166">Name resolution adds DNS traffic</text>
<text x="612" y="340" font-size="20" fill="#315166">Protocol decode / streams</text>
<text x="612" y="382" font-size="20" fill="#315166">Statistics / expert information</text>
<text x="612" y="424" font-size="20" fill="#315166">PROMISC visibility varies by OS</text>
<text x="612" y="466" font-size="20" fill="#315166">Heuristics need validation</text>
<text x="612" y="508" font-size="20" fill="#8b5b3c">Wireshark inference is not root cause</text>
<rect x="1132" y="205" width="510" height="430" rx="18" fill="#fff" stroke="#cbdde5"/>
<text x="1158" y="250" font-size="29" fill="#95633e" font-weight="700">Spoofing defense</text>
<text x="1158" y="298" font-size="20" fill="#315166">Unsolicited ARP replies</text>
<text x="1158" y="340" font-size="20" fill="#315166">Unexpected DHCP offers</text>
<text x="1158" y="382" font-size="20" fill="#315166">Route/source path anomalies</text>
<text x="1158" y="424" font-size="20" fill="#315166">DNS logs / DNSSEC controls</text>
<text x="1158" y="466" font-size="20" fill="#315166">MAC to switch-port tracing</text>
<text x="1158" y="508" font-size="20" fill="#8b5b3c">No MITM attack recipe reproduced</text></g>
<rect x="38" y="675" width="1604" height="520" rx="18" fill="#dfeef3" stroke="#bdd8e3"/>
<text x="68" y="725" font-family="DejaVu Sans,Arial" font-size="30" fill="#173349" font-weight="700">Evidence and source caveats</text>
<text x="68" y="775" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">1. Save raw capture when policy and storage allow; document filters.</text>
<text x="68" y="818" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">2. Extra DNS lookups may come from capture tool name resolution.</text>
<text x="68" y="861" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">3. Missing PROMISC flag does not prove no sniffing.</text>
<text x="68" y="904" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">4. Spoofing indicators require correlation with switch, DHCP, DNS and routing evidence.</text>
<text x="68" y="947" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">5. PCAP may contain credentials, tokens, internal names and application content.</text>
<text x="68" y="1005" font-family="DejaVu Sans,Arial" font-size="20" fill="#8b5b3c">F-05: source DNS-spoofing comparison is internally contradictory.</text>
<text x="68" y="1048" font-family="DejaVu Sans,Arial" font-size="20" fill="#8b5b3c">F-06: DNS over TCP security wording is a source suggestion, not a proven universal guarantee.</text>
<text x="68" y="1110" font-family="DejaVu Sans,Arial" font-size="20" fill="#315166">Retention, capture authorization, SPAN rollback: [Needs confirmation]</text>
<text x="49" y="1380" font-family="DejaVu Sans,Arial" font-size="19" fill="#526e7e">RAG-only · p0246:c01–p0273:c01 · no spoofing/MITM actions executed</text>
</svg>