<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1400" viewBox="0 0 1650 1400" role="img" aria-labelledby="title description">
<title id="title">Глава 2 — детальная сетевая и облачная памятка</title>
<desc id="description">Подробное RAG-основанное обзорное представление уровней OSI и TCP/IP, MAC/IP/портов, TCP/UDP/ICMP, VLAN/DMZ, облачных моделей и ограничений источника.</desc>
<rect width="1650" height="1400" fill="#eef4f7"/>
<rect x="0" y="0" width="1650" height="170" fill="#152d42"/>
<text x="45" y="72" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" fill="#ffffff" font-weight="700">Глава 2 — Сетевая архитектура и облачные сервисы</text>
<text x="47" y="124" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#cae4ef" font-weight="400">А. В. Чумилин · canonical RAG · PDF pp. 15–42 · учебный обзор, не runbook</text>

<rect x="38" y="202" width="504" height="475" rx="18" fill="#fff" stroke="#ccdce4" stroke-width="2"/><text x="63" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#1d6d7c" font-weight="700">2.1 · OSI ↔ TCP/IP</text><text x="66" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L7  Прикладной (HTTP)</text><text x="66" y="334" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L6  Представления</text><text x="66" y="376" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L5  Сеансовый</text><text x="66" y="418" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L4  Транспортный</text><text x="66" y="460" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L3  Сетевой (IP)</text><text x="66" y="502" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L2  Канальный (Ethernet)</text><text x="66" y="544" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">OSI L1  Физический</text><text x="66" y="586" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">TCP/IP: Application = OSI 5–7</text><text x="66" y="628" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">Transport = OSI 4 · Internet = OSI 3</text><text x="66" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">Link = OSI 1–2</text>
<rect x="573" y="202" width="505" height="475" rx="18" fill="#fff" stroke="#ccdce4" stroke-width="2"/><text x="598" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#3f6ca7" font-weight="700">2.2 · Адреса и транспорт</text><text x="601" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">MAC → локальный кадр / коммутатор</text><text x="601" y="334" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">IP → сетевой пакет / маршрут</text><text x="601" y="376" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Port → приложение / сокет</text><text x="601" y="418" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">IPv4 / IPv6; CIDR задаёт границы</text><text x="601" y="460" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">TCP → SYN, ACK, seq, повторы</text><text x="601" y="502" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">UDP → нет гарантии доставки</text><text x="601" y="544" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">ICMP → echo / ошибки / TTL</text><text x="601" y="586" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">Пример: 172.20.30.42/25</text><text x="601" y="628" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">Блок: 172.20.30.0–127</text><text x="601" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#965729" font-weight="400">Нет ответа UDP ≠ закрытый порт</text>
<rect x="1108" y="202" width="504" height="475" rx="18" fill="#fff" stroke="#ccdce4" stroke-width="2"/><text x="1133" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#98633d" font-weight="700">2.3 · Облако / IoT</text><text x="1136" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">StaaS — хранение как услуга</text><text x="1136" y="334" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">IaaS — VM и инфраструктура</text><text x="1136" y="376" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">PaaS — платформенные решения</text><text x="1136" y="418" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">SaaS — приложение как сервис</text><text x="1136" y="460" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">IoT — устройства, HTTP, MQTT</text><text x="1136" y="502" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">SSH / RDP — возможный доступ</text><text x="1136" y="544" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Cloud security rules: клиент</text><text x="1136" y="586" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#527386" font-weight="400">Конфиденциальные данные у провайдера</text><text x="1136" y="628" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#a15a32" font-weight="400">Ошибки правил могут открыть сервис</text><text x="1136" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#527386" font-weight="400">Окружение и права: [Needs confirmation]</text>
<rect x="38" y="704" width="760" height="332" rx="18" fill="#fff" stroke="#ccdce4" stroke-width="2"/><text x="63" y="751" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#1d6d7c" font-weight="700">Топологии и зоны доверия</text><text x="66" y="794" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Шина → общая среда; звезда → switch/hub</text><text x="66" y="836" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Кольцо → логический круг; mesh → пути</text><text x="66" y="878" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Гибрид → сочетание топологий</text><text x="66" y="920" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">VLAN → L2-сегментация; DMZ → внешняя зона</text><text x="66" y="962" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Enclave / microsegmentation → строгий доступ</text><text x="66" y="1004" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">VPN / IPsec / TLS → удалённая связь</text>
<rect x="828" y="704" width="784" height="332" rx="18" fill="#fff" stroke="#ccdce4" stroke-width="2"/><text x="853" y="751" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#98633d" font-weight="700">Operational interpretation</text><text x="856" y="794" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">1. Подтвердить разрешённую область / CIDR</text><text x="856" y="836" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">2. Разделить MAC / IP / transport port</text><text x="856" y="878" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">3. Учесть TCP-ACK vs UDP-неопределённость</text><text x="856" y="920" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">4. Проверить логику сегментов и cloud rules</text><text x="856" y="962" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">5. Не изменять VLAN/ACL/VM без плана отката</text><text x="856" y="1004" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#294b60" font-weight="400">Rollback и параметры команд — [Needs confirmation]</text>
<rect x="38" y="1061" width="1574" height="228" rx="16" fill="#e0edf2" stroke="#bfdae6" stroke-width="2"/>
<text x="68" y="1116" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#152d42" font-weight="700">Source findings / ограничения</text>
<text x="70" y="1158" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#34556a" font-weight="400">F-01 · p24: IP best effort; p42: IP «гарантирующий» — две исходные версии, без коррекции.</text>
<text x="70" y="1201" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#34556a" font-weight="400">F-02 · p27: полный пример IPv6 потерян при извлечении; не реконструировать адрес.</text>
<text x="70" y="1244" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#34556a" font-weight="400">F-03 · оригинальные рисунки PDF недоступны как отдельные мультимодальные RAG-объекты.</text>
<text x="50" y="1360" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#476678" font-weight="400">Provenance: ethical-hacking-basics-ru:p0015:c01–p0042:c01 · summary p41–42 · commands.md: только source-mentioned tools</text>
</svg>