<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title description">
<title id="title">Глава 3 — компактная схема защиты информации</title>
<desc id="description">Управление риском, классы технических мер, многоуровневая защита и журналирование по главе 3 книги Основы этичного хакинга.</desc>
<rect width="1500" height="850" fill="#eff5f8"/>
<rect width="1500" height="173" fill="#172d43"/>
<text x="43" y="75" font-family="Arial,DejaVu Sans,sans-serif" font-size="41" fill="#fff" font-weight="700">Глава 3 · Основы информационной безопасности</text>
<text x="43" y="127" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#d2e7f1" font-weight="400">От CIA и риска — к контролям, наблюдаемости и подготовке</text>
<rect x="36" y="207" width="455" height="360" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><rect x="56" y="227" width="49" height="45" rx="12" fill="#276e7a" stroke="#276e7a" stroke-width="2"/><text x="70" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#fff" font-weight="700">3.1</text><text x="118" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#182f42" font-weight="700">Основы и риск</text><text x="64" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">CIA: тайна / целостность / доступ</text><text x="64" y="355" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Parker: + владение, подлинность</text><text x="64" y="398" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">+ возможность использования</text><text x="64" y="441" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Риск = вероятность × потери</text><text x="64" y="484" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Принять / передать / снизить / избежать</text>
<rect x="524" y="207" width="455" height="360" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><rect x="544" y="227" width="49" height="45" rx="12" fill="#4165a0" stroke="#4165a0" stroke-width="2"/><text x="558" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#fff" font-weight="700">3.2</text><text x="606" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#182f42" font-weight="700">Средства защиты</text><text x="552" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Packet / stateful / DPI / WAF</text><text x="552" y="355" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">IDS: обнаружить; IPS: блокировать</text><text x="552" y="398" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">EDR: события и артефакты хоста</text><text x="552" y="441" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">SIEM: корреляция источников</text><text x="552" y="484" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">False positives требуют проверки</text>
<rect x="1012" y="207" width="453" height="360" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><rect x="1032" y="227" width="49" height="45" rx="12" fill="#93633b" stroke="#93633b" stroke-width="2"/><text x="1046" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#fff" font-weight="700">3.3</text><text x="1094" y="258" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#182f42" font-weight="700">Готовность</text><text x="1040" y="312" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Defense in depth / breadth</text><text x="1040" y="355" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">DMZ и контроль границ сети</text><text x="1040" y="398" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Syslog / Windows events / audit</text><text x="1040" y="441" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Политика → стандарт → процедура</text><text x="1040" y="484" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Нужны подготовка и реагирование</text>
<rect x="36" y="603" width="1429" height="152" rx="18" fill="#dcebf1" stroke="#bed8e3" stroke-width="2"/>
<text x="65" y="651" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#182f42" font-weight="700">Safety boundary</text>
<text x="66" y="693" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#6c4c38" font-weight="400">iptables -P ... DROP меняет политику и может оборвать доступ. Rollback: [Needs confirmation].</text>
<text x="66" y="728" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#36566b" font-weight="400">Примеры WAF/Snort не восстанавливать из повреждённых переносов без проверки.</text>
