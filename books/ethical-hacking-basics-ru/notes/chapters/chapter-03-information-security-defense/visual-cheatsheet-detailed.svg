<title id="title">Глава 3 — подробная схема CIA, рисков, средств защиты, логирования и аудита</title>
<desc id="description">Сводка главы 3 книги Основы этичного хакинга: свойства информации, риск и governance, firewall/IDS/IPS/EDR/SIEM, defense in depth и журналы.</desc>
<rect width="1720" height="1480" fill="#eff5f8"/>
<rect width="1720" height="170" fill="#172d43"/>
<text x="47" y="73" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" fill="#fff" font-weight="700">Глава 3 | Защита информации и готовность к инцидентам</text>
<text x="49" y="122" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#cfe7f1" font-weight="400">А. В. Чумилин · PDF pp. 43–71 · 48 RAG chunks · исходник без внешних дополнений</text>

<rect x="38" y="203" width="527" height="451" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><text x="63" y="248" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#236e80" font-weight="700">3.1 · Свойства и риск</text><text x="65" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Конфиденциальность — сохранение тайны</text><text x="65" y="335" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Целостность — ожидаемая неизменность</text><text x="65" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Доступность — данные доступны вовремя</text><text x="65" y="421" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Parker: контроль, подлинность, полезность</text><text x="65" y="464" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Риск = вероятность × потери</text><text x="65" y="507" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Решение: принять / передать / снизить</text><text x="65" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">или избежать риска</text><text x="65" y="593" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Контроли: превентивный / обнаруживающий</text><text x="65" y="636" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">/ корректирующий; 3 типа: техн. / адм. / физ.</text>
<rect x="596" y="203" width="525" height="451" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><text x="621" y="248" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#4265a0" font-weight="700">3.2 · Технологические меры</text><text x="623" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Packet filter: порт / адрес / протокол</text><text x="623" y="335" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Stateful: NEW / ESTABLISHED / RELATED</text><text x="623" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">DPI: анализ содержимого, ограничения TLS</text><text x="623" y="421" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">WAF: защита на прикладном уровне</text><text x="623" y="464" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">IDS alert · IPS блокировка inline</text><text x="623" y="507" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">EDR: процессы, журналы, изоляция</text><text x="623" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">SIEM: поиск и корреляция событий</text><text x="623" y="593" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">False positive не доказывает атаку</text><text x="623" y="636" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">UTM совмещает защитные функции</text>
<rect x="1151" y="203" width="530" height="451" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><text x="1176" y="248" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#95623a" font-weight="700">3.3 · Процесс и архитектура</text><text x="1178" y="292" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Defense in depth: несколько барьеров</text><text x="1178" y="335" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Defense in breadth: люди и процессы</text><text x="1178" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">DMZ + границы доступа / сегментация</text><text x="1178" y="421" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Политика → стандарт → процедура</text><text x="1178" y="464" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Syslog: локальные и центральные логи</text><text x="1178" y="507" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Windows Event ID / Security log</text><text x="1178" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Linux Audit: файлы, вызовы, действия</text><text x="1178" y="593" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Данные → корреляция → реагирование</text><text x="1178" y="636" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Одной технологии недостаточно</text>
<rect x="38" y="685" width="820" height="293" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><text x="63" y="730" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#8d4d31" font-weight="700">Классы команд и безопасная граница</text><text x="65" y="774" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">STATE-CHANGING: iptables -P ... DROP; iptables -A ...</text><text x="65" y="817" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Изменяют firewall; возможно отключение доступа</text><text x="65" y="860" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">CONFIG: auditctl rules / IPS / EDR host isolation</text><text x="65" y="903" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">OBSERVE: audit.log, syslog, Event Viewer</text><text x="65" y="946" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Неизвестны: owner, scope, tests, recovery, rollback</text>
<rect x="889" y="685" width="792" height="293" rx="18" fill="#fff" stroke="#cbdbe3" stroke-width="2"/><text x="914" y="730" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#236e80" font-weight="700">Порядок решений по смыслу главы</text><text x="916" y="774" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">Активы и CIA → угроза / потери / вероятность</text><text x="916" y="817" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">→ обработка риска → политика / стандарт</text><text x="916" y="860" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">→ превентивный, детективный, корректирующий</text><text x="916" y="903" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">→ сбор журналов / IDS / EDR / SIEM</text><text x="916" y="946" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#345368" font-weight="400">→ корреляция, план и ответ на инцидент</text>
<rect x="38" y="1007" width="1643" height="354" rx="18" fill="#dcebf1" stroke="#bfd8e3" stroke-width="2"/>
<text x="68" y="1056" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" fill="#182f42" font-weight="700">Источник и неоднозначности</text>
<text x="70" y="1101" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#38566a" font-weight="400">F-01 | ModSecurity RESPONSE_BODY vs пояснение «не дойдёт до сервера» — mismatch.</text>
<text x="70" y="1146" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#38566a" font-weight="400">F-02 | Snort и ModSecurity: длинные regex разорваны при извлечении — не применять.</text>
<text x="70" y="1191" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#38566a" font-weight="400">F-03 | Подлинность / неопровержимость: терминологию не нормализовать по памяти.</text>
<text x="70" y="1236" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#38566a" font-weight="400">F-04 | Оценка DDoS 36% без воспроизводимого набора исходных данных.</text>
