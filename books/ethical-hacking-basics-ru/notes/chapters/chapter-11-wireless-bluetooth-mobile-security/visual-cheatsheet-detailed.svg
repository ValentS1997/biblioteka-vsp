<rect x="38" y="675" width="1604" height="520" rx="18" fill="#dfeef3" stroke="#bdd8e3"/>
<text x="68" y="725" font-family="DejaVu Sans,Arial" font-size="30" fill="#173349" font-weight="700">Evidence, acceptance and source caveats</text>
<text x="68" y="775" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">1. Inventory owned AP/BSSID/client/device before testing.</text>
<text x="68" y="818" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">2. Channel hopping can miss traffic; capture context matters.</text>
<text x="68" y="861" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">3. Monitor mode may interrupt NetworkManager/wpa_supplicant connectivity.</text>
<text x="68" y="904" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">4. Deauth exercise requires isolated owned lab and accepted outage.</text>
<text x="68" y="947" font-family="DejaVu Sans,Arial" font-size="21" fill="#315166">5. Bluetooth attack names do not prove current device vulnerability.</text>
<text x="68" y="1005" font-family="DejaVu Sans,Arial" font-size="20" fill="#8b5b3c">F-03: KRACK wording is historical/current-state uncertain.</text>
<text x="68" y="1048" font-family="DejaVu Sans,Arial" font-size="20" fill="#8b5b3c">F-04/F-07: BYOD and Wi‑Fi security requirements are environment/current-standard dependent.</text>
<text x="68" y="1110" font-family="DejaVu Sans,Arial" font-size="20" fill="#315166">Actual AP/device/channel/outage/recovery: [Needs confirmation]</text>
<text x="49" y="1380" font-family="DejaVu Sans,Arial" font-size="19" fill="#526e7e">RAG-only · p0298:c01–p0323:c01 · no disruptive wireless/Bluetooth attack executed</text>
