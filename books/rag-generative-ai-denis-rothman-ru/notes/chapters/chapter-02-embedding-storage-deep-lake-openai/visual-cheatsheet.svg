<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — embeddings, Deep Lake и augmented generation</title>
  <desc id="desc">Компактная схема трехкомпонентного RAG pipeline из главы 2.</desc>
  <rect width="1200" height="780" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .h1 { font-size: 29px; font-weight: 700; }
    .h2 { font-size: 20px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 13px; }
    .box { fill: #f7f7f7; stroke: #222; stroke-width: 2; rx: 14; }
    .arrow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="55" y="55" class="h1">Глава 2. Хранение эмбеддингов RAG с помощью Deep Lake и OpenAI</text>
  <text x="55" y="86" class="small">RAG provenance: p0052:c01–p0079:c01 · PDF 52–79</text>

  <rect x="55" y="145" width="300" height="175" class="box"/>
  <text x="80" y="180" class="h2">1. Data preparation</text>
  <text x="80" y="215" class="body">fetch → clean → llm.txt</text>
  <text x="80" y="245" class="body">source checks before handoff</text>
  <text x="80" y="275" class="body">independent team/component</text>

  <rect x="450" y="145" width="300" height="175" class="box"/>
  <text x="475" y="180" class="h2">2. Embeddings + store</text>
  <text x="475" y="215" class="body">chunk text (example: 1000 chars)</text>
  <text x="475" y="245" class="body">embedding function</text>
  <text x="475" y="275" class="body">Deep Lake VectorStore</text>

  <rect x="845" y="145" width="300" height="175" class="box"/>
  <text x="870" y="180" class="h2">3. Augmented generation</text>
  <text x="870" y="215" class="body">query → top result</text>
  <text x="870" y="245" class="body">augment prompt → GPT-4o</text>
  <text x="870" y="275" class="body">evaluate output</text>

  <path d="M355 232 H450" class="arrow"/>
  <path d="M750 232 H845" class="arrow"/>

  <rect x="130" y="390" width="400" height="165" class="box"/>
  <text x="155" y="425" class="h2">Stored dataset</text>
  <text x="155" y="460" class="body">text + metadata + embedding + id</text>
  <text x="155" y="490" class="body">source remains inspectable / traceable</text>
  <text x="155" y="520" class="body">vector search retrieves context</text>

  <rect x="670" y="390" width="400" height="165" class="box"/>
  <text x="695" y="425" class="h2">Evaluation</text>
  <text x="695" y="460" class="body">TF-IDF cosine similarity</text>
  <text x="695" y="490" class="body">SentenceTransformer similarity</text>
  <text x="695" y="520" class="body">metric choice affects numeric result</text>

  <rect x="180" y="635" width="840" height="90" class="box"/>
  <text x="205" y="670" class="h2">Boundary</text>
  <text x="205" y="700" class="body">Environment changes, credentials and remote dataset writes are state-changing operations.</text>
</svg>
