<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — detailed dynamic RAG map</title>
  <desc id="desc">Подробная схема environment, SciQ preparation, Chroma ingestion, retrieval evaluation, Llama generation and disposal.</desc>
  <rect width="1600" height="1260" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .h1 { font-size: 31px; font-weight: 700; }
    .h2 { font-size: 20px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; }
    .box { fill: #f8f8f8; stroke: #222; stroke-width: 2; rx: 12; }
    .arrow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="55" y="55" class="h1">Глава 8. Dynamic RAG — detailed map</text>
  <text x="55" y="84" class="small">Source: p0227:c01–p0252:c01 · PDF 227–252</text>

  <rect x="55" y="125" width="455" height="235" class="box"/>
  <text x="80" y="162" class="h2">Environment</text>
  <text x="80" y="198" class="body">HF token → environment</text>
  <text x="80" y="228" class="body">datasets 2.20.0</text>
  <text x="80" y="258" class="body">transformers 4.41.2</text>
  <text x="80" y="288" class="body">accelerate 0.31.0</text>
  <text x="80" y="318" class="body">Chroma 0.5.3 + spaCy model</text>

  <rect x="570" y="125" width="455" height="235" class="box"/>
  <text x="595" y="162" class="h2">SciQ preparation</text>
  <text x="595" y="198" class="body">filter support + correct_answer</text>
  <text x="595" y="228" class="body">drop distractors</text>
  <text x="595" y="258" class="body">completion = answer + support</text>
  <text x="595" y="288" class="body">source rows: 10,481</text>

  <rect x="1085" y="125" width="455" height="235" class="box"/>
  <text x="1110" y="162" class="h2">Temporary Chroma</text>
  <text x="1110" y="198" class="body">chromadb.Client()</text>
  <text x="1110" y="228" class="body">create collection if absent</text>
  <text x="1110" y="258" class="body">add documents + metadata</text>
  <text x="1110" y="288" class="body">source embedding length: 384</text>

  <path d="M510 242 H570" class="arrow"/>
  <path d="M1025 242 H1085" class="arrow"/>

  <text x="55" y="435" class="h2">Pre-meeting validation</text>

  <rect x="55" y="470" width="470" height="190" class="box"/>
  <text x="80" y="507" class="body">query all science questions</text>
  <text x="80" y="537" class="body">n_results=1</text>
  <text x="80" y="567" class="body">retrieved vs original completion</text>
  <text x="80" y="597" class="body">spaCy vector similarity</text>

  <rect x="565" y="470" width="470" height="190" class="box"/>
  <text x="590" y="507" class="body">example criterion:</text>
  <text x="590" y="537" class="body">similarity_score &gt; 0.7</text>
  <text x="590" y="567" class="body">acc = accepted / total</text>
  <text x="590" y="597" class="small">not a universal production threshold</text>

  <rect x="1075" y="470" width="465" height="190" class="box"/>
  <text x="1100" y="507" class="body">timing examples</text>
  <text x="1100" y="537" class="body">ingestion: 234.25 s</text>
  <text x="1100" y="567" class="body">bulk query: 199.34 s</text>
  <text x="1100" y="597" class="small">hardware-dependent examples</text>

  <text x="55" y="735" class="h2">Meeting-time flow</text>

  <rect x="55" y="770" width="340" height="180" class="box"/>
  <text x="80" y="807" class="body">real/reworded prompt</text>
  <text x="80" y="837" class="body">Chroma query</text>
  <text x="80" y="867" class="body">top 1 document</text>

  <rect x="445" y="770" width="340" height="180" class="box"/>
  <text x="470" y="807" class="body">iprompt + retrieved text</text>
  <text x="470" y="837" class="body">augmented Llama input</text>

  <rect x="835" y="770" width="340" height="180" class="box"/>
  <text x="860" y="807" class="body">Llama 2 generation</text>
  <text x="860" y="837" class="body">top_k=10</text>
  <text x="860" y="867" class="body">temperature=0.5</text>
  <text x="860" y="897" class="body">max_new_tokens=100</text>

  <rect x="1225" y="770" width="315" height="180" class="box"/>
  <text x="1250" y="807" class="body">human review</text>
  <text x="1250" y="837" class="body">adjust prompt/model</text>
  <text x="1250" y="867" class="body">if result is poor</text>

  <path d="M395 860 H445" class="arrow"/>
  <path d="M785 860 H835" class="arrow"/>
  <path d="M1175 860 H1225" class="arrow"/>

  <text x="55" y="1020" class="h2">Lifecycle / source issues</text>

  <rect x="55" y="1055" width="1490" height="145" class="box"/>
  <text x="80" y="1092" class="body">Temporary collection may be discarded after the meeting; displayed delete call is commented.</text>
  <text x="80" y="1122" class="body">p232 typo: import tranformers; p250 computes end_time but prints response_time.</text>
  <text x="80" y="1152" class="body">Source still requires human supervision as prompt wording moves away from the original dataset.</text>
</svg>
