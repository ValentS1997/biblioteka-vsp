<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Глава 9 — Fine-tuning RAG data</title>
  <desc id="desc">Компактная схема перехода stable RAG data → JSONL → GPT-4o-mini fine-tuning → validation and metrics.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .h1 { font-size: 29px; font-weight: 700; }
    .h2 { font-size: 20px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 13px; }
    .box { fill: #f7f7f7; stroke: #222; stroke-width: 2; rx: 14; }
    .arrow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="55" y="55" class="h1">Глава 9. Fine-tuning данных RAG</text>
  <text x="55" y="86" class="small">RAG provenance: p0253:c01–p0270:c01 · PDF 253–270</text>

  <rect x="55" y="145" width="300" height="180" class="box"/>
  <text x="80" y="182" class="h2">1. Stable RAG data</text>
  <text x="80" y="220" class="body">SciQ questions</text>
  <text x="80" y="250" class="body">answers + explanations</text>
  <text x="80" y="280" class="body">human-quality input</text>

  <rect x="450" y="145" width="300" height="180" class="box"/>
  <text x="475" y="182" class="h2">2. Training set</text>
  <text x="475" y="220" class="body">system/user/assistant</text>
  <text x="475" y="250" class="body">JSONL-style file</text>

  <rect x="845" y="145" width="300" height="180" class="box"/>
  <text x="870" y="182" class="h2">3. Fine-tuning</text>
  <text x="870" y="220" class="body">GPT-4o-mini</text>
  <text x="870" y="250" class="body">upload → job → model ID</text>

  <path d="M355 235 H450" class="arrow"/>
  <path d="M750 235 H845" class="arrow"/>

  <rect x="150" y="430" width="390" height="140" class="box"/>
  <text x="175" y="468" class="h2">Validation</text>
  <text x="175" y="505" class="body">known science prompt</text>
  <text x="175" y="535" class="body">inspect generated explanation</text>

  <rect x="660" y="430" width="390" height="140" class="box"/>
  <text x="685" y="468" class="h2">Metrics</text>
  <text x="685" y="505" class="body">loss · tokens · epochs</text>
  <text x="685" y="535" class="body">batch · LR · seed · cost</text>

  <rect x="235" y="655" width="730" height="105" class="box"/>
  <text x="260" y="695" class="h2">Boundary</text>
  <text x="260" y="730" class="body">Fine-tuning is for suitable stable data; dynamic/current data can remain retrieval-based.</text>
</svg>
