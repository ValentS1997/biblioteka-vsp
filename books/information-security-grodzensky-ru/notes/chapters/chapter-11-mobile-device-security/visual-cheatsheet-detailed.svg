<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 11 — безопасность информации на мобильных устройствах</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0073:c01–p0078:c01 · PDF 73–78</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Ownership & policy</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">BYOD → personal device + corporate policy</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">COPE → company-owned device</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">Policy/enrollment defines allowed controls</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Source legal statements preserved without external update</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">EMM architecture</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Agent on device</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Policy-management server</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">Proxy/gateway for traffic enforcement</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">Secure mail · files · browser · app store · VPN</text>

  <rect x="60" y="435" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Data protection</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Crypto-container separates corporate data</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Password / PIN / biometrics</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20">VPN/proxy protects transmission path</text>
  <text x="90" y="634" font-family="sans-serif" font-size="18">App wrapping can add policy/containerization</text>

  <rect x="820" y="435" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">Threat response</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Phishing → content/reputation controls</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">Jailbreak → detect / notify / restrict</text>
  <text x="850" y="592" font-family="sans-serif" font-size="20">Loss/theft → anti-theft / wipe</text>
  <text x="850" y="634" font-family="sans-serif" font-size="18">Wi-Fi · Bluetooth · NFC can be policy-controlled</text>

  <rect x="60" y="725" width="1480" height="185" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="768" font-family="sans-serif" font-size="27" font-weight="700">Threats named in source</text>
  <text x="90" y="810" font-family="sans-serif" font-size="20">Physical loss · malware · ransomware · botnet · phishing · jailbreak · NFC-related risk</text>
  <text x="90" y="848" font-family="sans-serif" font-size="20">Insider leakage is also in scope.</text>
  <text x="90" y="882" font-family="sans-serif" font-size="18">EMM is the central policy-enforcement layer in the chapter.</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Operational sequence</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Ownership → enrollment → container + policy + VPN → posture monitoring → response</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">Goal: protect corporate data outside the classic LAN perimeter.</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">No modern UEM/MDM taxonomy or vendor-specific procedures were added.</text>
</svg>
