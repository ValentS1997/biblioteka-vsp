<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 3 — обеспечение безопасности персональных данных</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0024:c01–p0029:c01 · PDF 24–29</text>

  <rect x="60" y="145" width="720" height="240" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Объект и операции</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">Персональные данные → определяемое физическое лицо</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">Обработка: сбор · запись · хранение · изменение</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">использование · передача · обезличивание</text>
  <text x="90" y="338" font-family="sans-serif" font-size="20">блокирование · удаление · уничтожение</text>

  <rect x="820" y="145" width="720" height="240" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Контекст обработки</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Внутри периметра / вне периметра</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Незащищённый Internet → VPN</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">Мобильные устройства → EMM</text>
  <text x="850" y="338" font-family="sans-serif" font-size="20">Открытые каналы + риск → СКЗИ</text>

  <rect x="60" y="425" width="1480" height="220" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="468" font-family="sans-serif" font-size="27" font-weight="700">Определение уровня защищённости</text>
  <text x="90" y="512" font-family="sans-serif" font-size="20">Тип угрозы: 1 / 2 / 3</text>
  <text x="90" y="548" font-family="sans-serif" font-size="20">Категория ПД: специальные / биометрические / общедоступные / иные</text>
  <text x="90" y="584" font-family="sans-serif" font-size="20">Количество записей: более 100 000 / менее</text>
  <text x="90" y="620" font-family="sans-serif" font-size="20">→ ПП РФ № 1119 → один из четырёх уровней защищённости</text>

  <rect x="60" y="685" width="720" height="280" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="728" font-family="sans-serif" font-size="27" font-weight="700">Меры по Приказу № 21</text>
  <text x="90" y="770" font-family="sans-serif" font-size="19">Идентификация / аутентификация</text>
  <text x="90" y="804" font-family="sans-serif" font-size="19">Управление доступом · защита носителей</text>
  <text x="90" y="838" font-family="sans-serif" font-size="19">Журналирование · антивирус · IDS/IPS</text>
  <text x="90" y="872" font-family="sans-serif" font-size="19">Анализ защищённости · целостность · доступность</text>
  <text x="90" y="906" font-family="sans-serif" font-size="19">Виртуализация · связь · incident response</text>
  <text x="90" y="940" font-family="sans-serif" font-size="19">Управление конфигурацией</text>

  <rect x="820" y="685" width="720" height="280" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="728" font-family="sans-serif" font-size="27" font-weight="700">Модель угроз и проект</text>
  <text x="850" y="770" font-family="sans-serif" font-size="19">Источник → уязвимость → способ реализации</text>
  <text x="850" y="804" font-family="sans-serif" font-size="19">→ объект → деструктивное воздействие</text>
  <text x="850" y="846" font-family="sans-serif" font-size="19">Обследование процессов</text>
  <text x="850" y="880" font-family="sans-serif" font-size="19">→ отчёт о недостатках → технический проект</text>
  <text x="850" y="914" font-family="sans-serif" font-size="19">→ модель угроз / ТЗ / документация</text>
  <text x="850" y="948" font-family="sans-serif" font-size="19">→ оценка эффективности мер</text>

  <rect x="60" y="1005" width="1480" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="1048" font-family="sans-serif" font-size="27" font-weight="700">Operational rule</text>
  <text x="90" y="1090" font-family="sans-serif" font-size="20">Контекст обработки → актуальные угрозы → уровень → меры → оценка эффективности</text>
  <text x="90" y="1122" font-family="sans-serif" font-size="18">Примечание: в RAG противоречие по дате 152-ФЗ (2016 vs 2006); внешняя коррекция не применялась.</text>
</svg>
