<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 3 — защита персональных данных</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0024:c01–p0029:c01 · PDF 24–29</text>

  <rect x="60" y="150" width="1080" height="115" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Что и как обрабатывается</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Персональные данные · оператор · полный жизненный цикл обработки</text>

  <rect x="60" y="300" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="342" font-family="sans-serif" font-size="26" font-weight="700">2. Контекст и угрозы</text>
  <text x="90" y="380" font-family="sans-serif" font-size="21">Тип угрозы · категория данных · количество записей</text>
  <text x="90" y="412" font-family="sans-serif" font-size="18">Удалённая работа: VPN · мобильные устройства: EMM · открытые каналы: СКЗИ</text>

  <rect x="60" y="465" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="507" font-family="sans-serif" font-size="26" font-weight="700">3. Уровень защищённости</text>
  <text x="90" y="545" font-family="sans-serif" font-size="21">ПП РФ № 1119 → 4 уровня защищённости</text>
  <text x="90" y="577" font-family="sans-serif" font-size="18">После определения уровня → набор мер по Приказу ФСТЭК № 21</text>

  <rect x="60" y="630" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="672" font-family="sans-serif" font-size="26" font-weight="700">4. Проверка</text>
  <text x="90" y="710" font-family="sans-serif" font-size="21">Модель угроз → внедрение мер → оценка эффективности</text>
  <text x="90" y="742" font-family="sans-serif" font-size="18">Недостатки и нарушения → корректирующие меры</text>
</svg>
