<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 2 — управление ИБ через требования, доказательство и измерение</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0018:c01–p0023:c01 · PDF 18–23</text>

  <rect x="60" y="145" width="470" height="255" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Нормативная опора</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">• обязательные документы</text>
  <text x="90" y="265" font-family="sans-serif" font-size="20">• национальные стандарты</text>
  <text x="90" y="300" font-family="sans-serif" font-size="20">• отраслевые стандарты</text>
  <text x="90" y="335" font-family="sans-serif" font-size="20">• международные стандарты</text>
  <text x="90" y="372" font-family="sans-serif" font-size="18">Стандарты могут быть обязательными или рекомендательными</text>

  <rect x="565" y="145" width="975" height="255" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="595" y="188" font-family="sans-serif" font-size="27" font-weight="700">Где применяется стандартизация</text>
  <text x="595" y="230" font-family="sans-serif" font-size="19">Аудит · моделирование угроз · защита от НСД · персональные данные</text>
  <text x="595" y="264" font-family="sans-serif" font-size="19">Криптография · управление ИБ · управление рисками · методы и средства защиты</text>
  <text x="595" y="298" font-family="sans-serif" font-size="19">Испытания ПО на отсутствие недекларированных возможностей</text>
  <text x="595" y="332" font-family="sans-serif" font-size="19">Защита от специальных электромагнитных воздействий</text>
  <text x="595" y="370" font-family="sans-serif" font-size="18">Стандарты используются как структура и критерий для СМИБ</text>

  <rect x="60" y="440" width="720" height="255" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="483" font-family="sans-serif" font-size="27" font-weight="700">Соответствие и сертификация</text>
  <text x="90" y="525" font-family="sans-serif" font-size="20">Проверка → выявленные нарушения → устранение</text>
  <text x="90" y="563" font-family="sans-serif" font-size="20">Внедрение стандарта → сертификационные испытания</text>
  <text x="90" y="601" font-family="sans-serif" font-size="20">→ сертификат соответствия</text>
  <text x="90" y="645" font-family="sans-serif" font-size="18">ISO 27001 в главе — основной ориентир для СМИБ</text>

  <rect x="820" y="440" width="720" height="255" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="483" font-family="sans-serif" font-size="27" font-weight="700">Стандарт vs спецификация</text>
  <text x="850" y="525" font-family="sans-serif" font-size="20">Стандарт → требования и правила управления</text>
  <text x="850" y="565" font-family="sans-serif" font-size="20">Спецификация → конкретная реализация</text>
  <text x="850" y="610" font-family="sans-serif" font-size="20">IPsec · Kerberos · TLS</text>
  <text x="850" y="650" font-family="sans-serif" font-size="18">Не смешивать management requirements и protocol implementation</text>

  <rect x="60" y="735" width="1480" height="180" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="778" font-family="sans-serif" font-size="27" font-weight="700">Метрология и KPI СМИБ</text>
  <text x="90" y="820" font-family="sans-serif" font-size="20">Цель → программа измерений → показатель → фактическое значение → сравнение с планом</text>
  <text x="90" y="858" font-family="sans-serif" font-size="20">Примеры: % обученных · число инцидентов · найденные уязвимости · параметры паролей</text>
  <text x="90" y="892" font-family="sans-serif" font-size="18">Методы измерения: объективные и субъективные</text>

  <rect x="60" y="955" width="1480" height="180" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="998" font-family="sans-serif" font-size="27" font-weight="700">Цикл улучшения</text>
  <text x="90" y="1040" font-family="sans-serif" font-size="21">Requirements → ISMS → Audit/Certification → Metrics → Correction</text>
  <text x="90" y="1078" font-family="sans-serif" font-size="20">Если факт не соответствует цели, процесс корректируется и измеряется снова.</text>
  <text x="90" y="1112" font-family="sans-serif" font-size="18">Глава использует обучение персонала как практический пример этого цикла.</text>
</svg>
