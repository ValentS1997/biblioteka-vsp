<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 12 — защита информации ограниченного доступа</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0079:c01–p0085:c01 · PDF 79–85</text>
  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Classify & govern</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Classification · value · owners · access · awareness</text>
  <rect x="60" y="305" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="347" font-family="sans-serif" font-size="26" font-weight="700">2. DLP</text>
  <text x="90" y="385" font-family="sans-serif" font-size="21">Gateway + endpoint · detect + block</text>
  <text x="90" y="417" font-family="sans-serif" font-size="18">Blocking needs tuning: false positives can disrupt business</text>
  <rect x="60" y="470" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. DAG + labels</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">Rights · actions · access workflow · AD changes · labels</text>
  <text x="90" y="582" font-family="sans-serif" font-size="18">DLP controls movement; DAG controls access and use</text>
  <rect x="60" y="635" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="677" font-family="sans-serif" font-size="26" font-weight="700">4. Commercial-secret regime</text>
  <text x="90" y="715" font-family="sans-serif" font-size="21">Survey → assets/risk → documentation → access/logging/leak procedures</text>
</svg>
