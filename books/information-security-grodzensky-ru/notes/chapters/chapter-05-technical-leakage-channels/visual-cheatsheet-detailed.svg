<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 5 — защита от утечки по техническим каналам</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0036:c01–p0041:c01 · PDF 36–41</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Электромагнитные и проводные</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">ПЭМИН → побочные излучения/наводки</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">Электрический канал → контакт с линией</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">Индукционный → поле вокруг линии</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Контроли: шум · заземление · исследования</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Речевая информация</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Акустический → воздух</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Виброакустический → конструкции и коммуникации</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">Электроакустический · оптико-электронный · параметрический</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">Контроли: генератор шума · виброзашумление</text>

  <rect x="60" y="435" width="720" height="230" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Визуальный канал</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Наблюдение / фиксация экранной информации</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Скрытые камеры и иные устройства</text>
  <text x="90" y="604" font-family="sans-serif" font-size="18">Контроль: обследование + организационные меры</text>

  <rect x="820" y="435" width="720" height="230" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">Материальный канал</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Документы · отходы · физические носители</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">Риск усиливается при низкой осведомлённости</text>
  <text x="850" y="604" font-family="sans-serif" font-size="18">Контроль: уничтожение документов · awareness</text>

  <rect x="60" y="705" width="1480" height="205" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="748" font-family="sans-serif" font-size="27" font-weight="700">Три вида проверочных работ</text>
  <text x="90" y="792" font-family="sans-serif" font-size="20">Специальная проверка → поиск закладных устройств в оборудовании</text>
  <text x="90" y="828" font-family="sans-serif" font-size="20">Специальное исследование → оценка возможности утечки по техническим каналам</text>
  <text x="90" y="864" font-family="sans-serif" font-size="20">Специальное обследование → помещение, каналы, устройства, необходимые меры</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Operational sequence</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Информация → физическая среда → возможный канал → контроль → обследование</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">→ обнаруженные проблемы → корректирующие меры → повторная проверка</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">CLI и детальные методики лабораторного перехвата в chapter artifacts не добавлялись.</text>
</svg>
