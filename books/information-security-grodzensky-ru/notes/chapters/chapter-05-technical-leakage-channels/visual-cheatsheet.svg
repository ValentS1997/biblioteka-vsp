<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 5 — технические каналы утечки</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0036:c01–p0041:c01 · PDF 36–41</text>

  <rect x="60" y="150" width="1080" height="145" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Каналы</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">ПЭМИН · электрические · индукционные · акустические · виброакустические</text>
  <text x="90" y="263" font-family="sans-serif" font-size="20">электроакустические · оптико-электронные · параметрические · визуальные · материальные</text>

  <rect x="60" y="330" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="372" font-family="sans-serif" font-size="26" font-weight="700">2. Защита</text>
  <text x="90" y="410" font-family="sans-serif" font-size="20">Шум · заземление · виброзашумление · организационные меры · уничтожение документов</text>
  <text x="90" y="442" font-family="sans-serif" font-size="18">Технические и организационные меры должны дополнять друг друга</text>

  <rect x="60" y="495" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="537" font-family="sans-serif" font-size="26" font-weight="700">3. Assurance</text>
  <text x="90" y="575" font-family="sans-serif" font-size="21">Специальная проверка · специальное исследование · специальное обследование</text>
  <text x="90" y="607" font-family="sans-serif" font-size="18">Оборудование + помещение → поиск каналов/закладок → выводы</text>

  <rect x="60" y="660" width="1080" height="110" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="702" font-family="sans-serif" font-size="26" font-weight="700">4. Результат</text>
  <text x="90" y="740" font-family="sans-serif" font-size="21">Корректирующие меры → повторная проверка → подтверждение защищённости</text>
</svg>
