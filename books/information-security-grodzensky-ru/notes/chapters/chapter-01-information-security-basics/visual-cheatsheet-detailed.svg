<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 1 — Информационная безопасность: свойства, угрозы, меры</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0008:c01–p0017:c01 · PDF 8–17</text>

  <rect x="60" y="145" width="470" height="240" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Защищаемые свойства</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">• Конфиденциальность</text>
  <text x="90" y="265" font-family="sans-serif" font-size="21">• Целостность</text>
  <text x="90" y="300" font-family="sans-serif" font-size="21">• Доступность</text>
  <text x="90" y="340" font-family="sans-serif" font-size="18">Дополнительно: неотказуемость,</text>
  <text x="90" y="368" font-family="sans-serif" font-size="18">подлинность, подотчетность, достоверность</text>

  <rect x="565" y="145" width="975" height="240" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="595" y="188" font-family="sans-serif" font-size="27" font-weight="700">Классификация угроз</text>
  <text x="595" y="230" font-family="sans-serif" font-size="19">По цели: конфиденциальность / целостность / доступность</text>
  <text x="595" y="262" font-family="sans-serif" font-size="19">По возникновению: случайные / преднамеренные</text>
  <text x="595" y="294" font-family="sans-serif" font-size="19">По воздействию: активные / пассивные</text>
  <text x="595" y="326" font-family="sans-serif" font-size="19">По природе: антропогенные / техногенные / стихийные</text>
  <text x="595" y="358" font-family="sans-serif" font-size="19">По нарушителю: внешние / внутренние; также способ, длительность, объект, обратная связь</text>

  <rect x="60" y="425" width="720" height="260" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="468" font-family="sans-serif" font-size="27" font-weight="700">Примеры механизмов/угроз</text>
  <text x="90" y="510" font-family="sans-serif" font-size="19">Active: вредоносное ПО, SQL-инъекция, DDoS</text>
  <text x="90" y="544" font-family="sans-serif" font-size="19">Passive: снифферы, кейлоггеры, сбор данных</text>
  <text x="90" y="578" font-family="sans-serif" font-size="19">Social engineering: фишинг</text>
  <text x="90" y="612" font-family="sans-serif" font-size="19">Remote access: несанкционированный RDP</text>
  <text x="90" y="646" font-family="sans-serif" font-size="19">Integrity check: хэш-функция</text>

  <rect x="820" y="425" width="720" height="260" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="468" font-family="sans-serif" font-size="27" font-weight="700">Три класса защитных мер</text>
  <text x="850" y="510" font-family="sans-serif" font-size="20">Организационные: политики, локальные акты, обучение</text>
  <text x="850" y="548" font-family="sans-serif" font-size="20">Физические: СКУД, контроль доступа</text>
  <text x="850" y="586" font-family="sans-serif" font-size="20">Технические: firewall, антивирус, защита от НСД, DLP, IPS</text>
  <text x="850" y="632" font-family="sans-serif" font-size="18">Выбор — компромисс на основе риска, стоимости</text>
  <text x="850" y="660" font-family="sans-serif" font-size="18">и обязательных требований законодательства</text>

  <rect x="60" y="725" width="1480" height="185" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="768" font-family="sans-serif" font-size="27" font-weight="700">Назначение мер</text>
  <text x="90" y="810" font-family="sans-serif" font-size="20">Сдерживание · превентивные · корректировка · восстановление · детективные</text>
  <text x="90" y="848" font-family="sans-serif" font-size="20">компенсирующие · соответствие требованиям законодательства</text>
  <text x="90" y="882" font-family="sans-serif" font-size="18">Пример различия: DLP mirror анализирует/оповещает; DLP inline может блокировать.</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">PDCA для СУИБ</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Plan — проектирование по актуальной модели угроз</text>
  <text x="90" y="1070" font-family="sans-serif" font-size="21">Do — внедрение комплекса защитных мер</text>
  <text x="800" y="1035" font-family="sans-serif" font-size="21">Check — инциденты, аудит ИБ, pen-test</text>
  <text x="800" y="1070" font-family="sans-serif" font-size="21">Act — корректировка СУИБ и настроек</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">Цикл повторяется, потому что инфраструктура и модель угроз изменяются.</text>
</svg>
