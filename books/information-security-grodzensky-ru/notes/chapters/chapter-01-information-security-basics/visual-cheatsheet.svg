<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 1 — базовая модель информационной безопасности</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0008:c01–p0017:c01 · PDF 8–17</text>

  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="190" font-family="sans-serif" font-size="26" font-weight="700">1. Что защищаем: CIA</text>
  <text x="90" y="228" font-family="sans-serif" font-size="22">Конфиденциальность · Целостность · Доступность</text>

  <rect x="60" y="305" width="1080" height="150" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="345" font-family="sans-serif" font-size="26" font-weight="700">2. Как описываем угрозу</text>
  <text x="90" y="383" font-family="sans-serif" font-size="20">случайная / преднамеренная · активная / пассивная · внешняя / внутренняя</text>
  <text x="90" y="417" font-family="sans-serif" font-size="20">антропогенная / техногенная / стихийная · НСД / технические каналы</text>

  <rect x="60" y="490" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="530" font-family="sans-serif" font-size="26" font-weight="700">3. Чем защищаем</text>
  <text x="90" y="568" font-family="sans-serif" font-size="22">Организационные + физические + технические меры</text>

  <rect x="60" y="645" width="1080" height="120" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="685" font-family="sans-serif" font-size="26" font-weight="700">4. Как управляем</text>
  <text x="90" y="723" font-family="sans-serif" font-size="22">PDCA: Plan → Do → Check → Act → обновленная модель угроз</text>
  <text x="90" y="756" font-family="sans-serif" font-size="18">Проверка: расследование инцидентов · аудит ИБ · pen-test</text>
</svg>
