<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 9 — безопасность компьютерных сетей</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0060:c01–p0066:c01 · PDF 60–66</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Proxy / SWG</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">User ↔ mediator ↔ resource</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">Direct · reverse · transparent · SOCKS · DNS · web</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">URL filtering · SSL inspection · DLP/IPS integration</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Access policy + reporting + caching/compression</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Firewall evolution</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Packet filtering → stateful inspection → NGFW</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">NGFW: application-aware control</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">IDS/IPS · botnet blocking · VPN · URL filtering</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">Decision moves beyond IP + port + protocol</text>

  <rect x="60" y="435" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Anti-APT / sandbox</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Unknown web/mail object → isolated execution</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Behavior analysis → malicious / benign verdict</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20">Criteria: OS coverage · encrypted traffic · YARA</text>
  <text x="90" y="634" font-family="sans-serif" font-size="18">EDR investigates anomalous endpoint processes / IOC</text>

  <rect x="820" y="435" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">NAC</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Device discovery / classification / posture</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">Allow · restrict · quarantine · isolate</text>
  <text x="850" y="592" font-family="sans-serif" font-size="20">EDR/AV trigger → isolation</text>
  <text x="850" y="634" font-family="sans-serif" font-size="18">Mobile scenario → EMM agent policy</text>

  <rect x="60" y="725" width="1480" height="185" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="768" font-family="sans-serif" font-size="27" font-weight="700">Modern source paradigm</text>
  <text x="90" y="810" font-family="sans-serif" font-size="21">Application + user + content + behavior + risk</text>
  <text x="90" y="848" font-family="sans-serif" font-size="20">Encrypted traffic and unknown objects must also enter the inspection path.</text>
  <text x="90" y="882" font-family="sans-serif" font-size="18">Wi-Fi layer adds rogue AP control and differentiated access.</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Integration</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Proxy/SWG + NGFW + Anti-APT + EDR + NAC + SIEM + EMM</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">Detection in one layer can trigger enforcement in another.</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">No vendor-specific rules or current architecture updates were added.</text>
</svg>
