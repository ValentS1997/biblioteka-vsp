<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 9 — безопасность компьютерных сетей</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0060:c01–p0066:c01 · PDF 60–66</text>

  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Perimeter / mediation</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Proxy / SWG + Firewall / NGFW — взаимодополняющие слои</text>

  <rect x="60" y="305" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="347" font-family="sans-serif" font-size="26" font-weight="700">2. Modern inspection</text>
  <text x="90" y="385" font-family="sans-serif" font-size="21">Не только IP/port/protocol → application + user + risk</text>
  <text x="90" y="417" font-family="sans-serif" font-size="18">NGFW · SSL inspection · IDS/IPS · URL filtering · VPN</text>

  <rect x="60" y="470" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Unknown threats</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">Anti-APT → sensor → sandbox → behavior → allow/block</text>
  <text x="90" y="582" font-family="sans-serif" font-size="18">EDR дополняет анализ на endpoint</text>

  <rect x="60" y="635" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="677" font-family="sans-serif" font-size="26" font-weight="700">4. Device admission</text>
  <text x="90" y="715" font-family="sans-serif" font-size="21">NAC → classify → posture → allow / quarantine / isolate</text>
  <text x="90" y="747" font-family="sans-serif" font-size="18">Integration with EDR · SIEM · EMM</text>
</svg>
