<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 6 — криптографическая защита информации</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0042:c01–p0048:c01 · PDF 42–48</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Симметричная модель</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">Один ключ → шифрование и дешифрование</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">Плюсы: простота · скорость · меньшая длина ключа</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">Минусы: доставка ключа · масштабирование управления</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Источник: симметричные шифры бывают блочные и поточные</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Классические примеры</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Цезарь → простая подстановка</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Виженер → полиалфавитная подстановка</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">Гронсфельд → числовой повторяемый ключ</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">Перестановка → символы те же, порядок меняется</text>

  <rect x="60" y="435" width="720" height="245" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Асимметричная модель</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Открытый ключ → передаётся другой стороне</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Закрытый ключ → остаётся у владельца</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20">Шифрование сообщений · проверка электронной подписи</text>
  <text x="90" y="634" font-family="sans-serif" font-size="18">Названы RSA и Диффи—Хеллман; source terminology сохранена</text>

  <rect x="820" y="435" width="720" height="245" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">Хэш-функция</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Произвольная длина входа</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">→ фиксированная битовая строка</text>
  <text x="850" y="592" font-family="sans-serif" font-size="20">Пароли · биометрические данные · электронная подпись</text>
  <text x="850" y="634" font-family="sans-serif" font-size="18">Критично: стойкость и низкая вероятность коллизий</text>

  <rect x="60" y="720" width="1480" height="190" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="763" font-family="sans-serif" font-size="27" font-weight="700">Области применения из главы</text>
  <text x="90" y="805" font-family="sans-serif" font-size="20">DRM · VPN · SSL-сертификаты · PKI · электронная подпись · SSH</text>
  <text x="90" y="843" font-family="sans-serif" font-size="20">SSL приведён как пример сочетания симметричного и асимметричного подходов.</text>
  <text x="90" y="878" font-family="sans-serif" font-size="18">Конкретные production-настройки и современные рекомендации не добавлялись.</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Source gap</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Вопрос 4 требует определить поточный шифр.</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">В тексте главы есть только классификация «блочные / поточные».</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">Ответ отмечен [Not supported by chapter text], без model-memory fallback.</text>
</svg>
