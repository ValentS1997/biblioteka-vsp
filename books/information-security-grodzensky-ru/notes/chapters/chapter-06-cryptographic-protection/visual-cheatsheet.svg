<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 6 — криптографическая защита</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0042:c01–p0048:c01 · PDF 42–48</text>

  <rect x="60" y="150" width="1080" height="125" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Симметричное шифрование</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Один ключ · быстро · просто · проблема передачи/управления ключом</text>

  <rect x="60" y="310" width="1080" height="125" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="352" font-family="sans-serif" font-size="26" font-weight="700">2. Подстановка vs перестановка</text>
  <text x="90" y="390" font-family="sans-serif" font-size="21">Подстановка меняет символы · перестановка меняет их порядок</text>

  <rect x="60" y="470" width="1080" height="125" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Асимметричное шифрование</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">Открытый ключ + закрытый ключ · шифрование · электронная подпись</text>

  <rect x="60" y="630" width="1080" height="125" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="672" font-family="sans-serif" font-size="26" font-weight="700">4. Хэш-функция</text>
  <text x="90" y="710" font-family="sans-serif" font-size="21">Произвольная длина → фиксированная строка · коллизии должны быть редкими</text>
  <text x="90" y="742" font-family="sans-serif" font-size="18">Применения в главе: пароли · биометрия · электронная подпись</text>
</svg>
