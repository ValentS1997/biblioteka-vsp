<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 14 — защита критической информационной инфраструктуры</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0092:c01–p0096:c01 · PDF 92–96</text>

  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Identify & inventory</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">CII subject → CII objects → architecture / assets / telecom links</text>

  <rect x="60" y="305" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="347" font-family="sans-serif" font-size="26" font-weight="700">2. Categorize</text>
  <text x="90" y="385" font-family="sans-serif" font-size="21">Social · political · economic · environmental · defense significance</text>
  <text x="90" y="417" font-family="sans-serif" font-size="18">Significant objects receive category 1 / 2 / 3</text>

  <rect x="60" y="470" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Protect</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">Threat model → organizational + technical measures</text>
  <text x="90" y="582" font-family="sans-serif" font-size="18">Source links significant-object controls to FSTEC Order No. 239</text>

  <rect x="60" y="635" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="677" font-family="sans-serif" font-size="26" font-weight="700">4. Monitor & report</text>
  <text x="90" y="715" font-family="sans-serif" font-size="21">SIEM / SOC → incident process → state reporting path</text>
</svg>
