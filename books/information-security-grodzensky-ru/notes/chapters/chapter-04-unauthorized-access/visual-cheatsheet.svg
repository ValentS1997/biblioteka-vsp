<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 4 — защита от НСД</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0030:c01–p0035:c01 · PDF 30–35</text>

  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Модель доступа</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">DAC / ACL · MAC / метки и допуски · RBAC / роли</text>

  <rect x="60" y="305" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="347" font-family="sans-serif" font-size="26" font-weight="700">2. Превентивный слой</text>
  <text x="90" y="385" font-family="sans-serif" font-size="20">IDM · PIM · patch management · NGFW · AV · 2FA · EDR · EMM · СКЗИ</text>
  <text x="90" y="417" font-family="sans-serif" font-size="18">Цель: снизить вероятность инцидента до его возникновения</text>

  <rect x="60" y="470" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Детективный слой</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">SIEM · IDS · UEBA · DAG · SOC / IRM</text>
  <text x="90" y="582" font-family="sans-serif" font-size="18">Накопление событий → аномалии → инцидент → response</text>

  <rect x="60" y="635" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="677" font-family="sans-serif" font-size="26" font-weight="700">4. Риск и режим эксплуатации</text>
  <text x="90" y="715" font-family="sans-serif" font-size="21">Monitor → tune → blocking · активы → ущерб → остаточный риск</text>
  <text x="90" y="747" font-family="sans-serif" font-size="18">Blocking без настройки может парализовать бизнес-процесс</text>
</svg>
