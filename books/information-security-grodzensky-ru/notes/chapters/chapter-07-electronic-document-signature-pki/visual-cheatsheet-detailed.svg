<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700">Глава 7 — электронный документооборот и электронная подпись</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0049:c01–p0053:c01 · PDF 49–53</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Digital identity & signature</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">Цифровая личность → однозначная идентификация</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">ЭП → определение подписавшего лица</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">Асимметричная криптография</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Правовой ориентир источника: ФЗ № 63</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Certificate / PKI</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">Открытый ключ + владелец + срок действия</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Имя центра сертификации + цифровая подпись</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">PKI → централизованное управление сертификатами</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">PGP упомянут как децентрализованная модель</text>

  <rect x="60" y="435" width="720" height="245" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Виды электронной подписи</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Простая</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Усиленная → квалифицированная</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20">Усиленная → неквалифицированная</text>
  <text x="90" y="634" font-family="sans-serif" font-size="18">Qualified certificate выдаётся аккредитованным УЦ</text>

  <rect x="820" y="435" width="720" height="245" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">Структура УЦ</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Центр сертификации → выпуск / отзыв</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">Центр регистрации → пользователи / запросы</text>
  <text x="850" y="592" font-family="sans-serif" font-size="20">АРМ admin / user / conflict resolution</text>
  <text x="850" y="634" font-family="sans-serif" font-size="18">Криптопровайдер выполняет криптографические операции</text>

  <rect x="60" y="720" width="1480" height="190" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="763" font-family="sans-serif" font-size="27" font-weight="700">Key storage & scaling</text>
  <text x="90" y="805" font-family="sans-serif" font-size="20">Токены / smart cards → персональные носители</text>
  <text x="90" y="843" font-family="sans-serif" font-size="20">Большое количество носителей → operational risk → HSM</text>
  <text x="90" y="878" font-family="sans-serif" font-size="18">HSM: создание/хранение ключей · подпись · проверка · хэширование</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Operational sequence</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Identity → key pair → certificate → CA/PKI → signature → EDI</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">Scale drives architecture: external certificates vs own CA; tokens vs HSM</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">Актуальность правовых требований вне RAG не проверялась.</text>
</svg>
