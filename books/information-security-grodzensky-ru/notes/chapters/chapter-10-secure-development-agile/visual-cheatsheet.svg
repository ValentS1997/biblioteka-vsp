<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 10 — безопасная разработка в эпоху Agile</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0067:c01–p0072:c01 · PDF 67–72</text>

  <rect x="60" y="150" width="1080" height="120" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Shift analysis into development</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Code/version changes → automated security analysis</text>

  <rect x="60" y="305" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="347" font-family="sans-serif" font-size="26" font-weight="700">2. SAST + DAST</text>
  <text x="90" y="385" font-family="sans-serif" font-size="21">Static code structure + runtime behavior → complementary coverage</text>
  <text x="90" y="417" font-family="sans-serif" font-size="18">Track false positive / false negative</text>

  <rect x="60" y="470" width="1080" height="130" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Specialized analysis</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">ERP · web application scanners · WAF integration</text>
  <text x="90" y="582" font-family="sans-serif" font-size="18">Code + configuration + privileges / SoD</text>

  <rect x="60" y="635" width="1080" height="130" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="677" font-family="sans-serif" font-size="26" font-weight="700">4. Verify and repeat</text>
  <text x="90" y="715" font-family="sans-serif" font-size="21">Finding → triage → fix → retest → next version</text>
  <text x="90" y="747" font-family="sans-serif" font-size="18">Browser dev tools = supporting inspection, not scanner replacement</text>
</svg>
