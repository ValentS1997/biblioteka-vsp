<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 13 — безопасность АСУ ТП</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">RAG: p0086:c01–p0091:c01 · PDF 86–91</text>
  <rect x="60" y="150" width="1080" height="125" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="192" font-family="sans-serif" font-size="26" font-weight="700">1. Три уровня АСУ ТП</text>
  <text x="90" y="230" font-family="sans-serif" font-size="21">Upper: MES/SCADA/ERP · Middle: PLC · Lower: sensors/actuators</text>
  <rect x="60" y="310" width="1080" height="125" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="352" font-family="sans-serif" font-size="26" font-weight="700">2. Safe visibility</text>
  <text x="90" y="390" font-family="sans-serif" font-size="21">Active scan may be risky → passive traffic analysis</text>
  <rect x="60" y="470" width="1080" height="125" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="512" font-family="sans-serif" font-size="26" font-weight="700">3. Level-specific controls</text>
  <text x="90" y="550" font-family="sans-serif" font-size="21">Segmentation · data diode · industrial firewall · isolation · monitoring</text>
  <rect x="60" y="630" width="1080" height="125" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="672" font-family="sans-serif" font-size="26" font-weight="700">4. Classification</text>
  <text x="90" y="710" font-family="sans-serif" font-size="21">УЗ1→К1 · УЗ2→К2 · УЗ3→К3 · controls follow classification</text>
</svg>
