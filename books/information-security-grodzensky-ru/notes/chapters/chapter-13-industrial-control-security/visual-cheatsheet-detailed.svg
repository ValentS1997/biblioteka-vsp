<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 13 — промышленная ИБ и защита АСУ ТП</text>
  <text x="60" y="108" font-family="sans-serif" font-size="18">Source: information-security-grodzensky-ru · RAG p0086:c01–p0091:c01 · PDF 86–91</text>

  <rect x="60" y="145" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="188" font-family="sans-serif" font-size="27" font-weight="700">Threats</text>
  <text x="90" y="230" font-family="sans-serif" font-size="20">Vulnerability exploitation</text>
  <text x="90" y="266" font-family="sans-serif" font-size="20">Malware · network attacks</text>
  <text x="90" y="302" font-family="sans-serif" font-size="20">Software/hardware implants</text>
  <text x="90" y="344" font-family="sans-serif" font-size="18">Physical consequences make impact potentially severe</text>

  <rect x="820" y="145" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="188" font-family="sans-serif" font-size="27" font-weight="700">Assessment constraint</text>
  <text x="850" y="230" font-family="sans-serif" font-size="20">24x7 process + criticality</text>
  <text x="850" y="266" font-family="sans-serif" font-size="20">Active scan may disrupt operation</text>
  <text x="850" y="302" font-family="sans-serif" font-size="20">Passive sniffers can infer versions/assets</text>
  <text x="850" y="344" font-family="sans-serif" font-size="18">Unsupported PLC firmware may remain vulnerable</text>

  <rect x="60" y="435" width="720" height="250" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="478" font-family="sans-serif" font-size="27" font-weight="700">Three levels</text>
  <text x="90" y="520" font-family="sans-serif" font-size="20">Upper → MES / SCADA / ERP</text>
  <text x="90" y="556" font-family="sans-serif" font-size="20">Middle → PLC</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20">Lower → sensors / actuators</text>
  <text x="90" y="634" font-family="sans-serif" font-size="18">Controls must cover all levels</text>

  <rect x="820" y="435" width="720" height="250" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="850" y="478" font-family="sans-serif" font-size="27" font-weight="700">Controls by level</text>
  <text x="850" y="520" font-family="sans-serif" font-size="20">Upper → segmentation / data diode / anomaly monitoring</text>
  <text x="850" y="556" font-family="sans-serif" font-size="20">Middle → industrial firewall</text>
  <text x="850" y="592" font-family="sans-serif" font-size="20">MODBUS · DNP3 · CIP awareness</text>
  <text x="850" y="634" font-family="sans-serif" font-size="18">Lower → physical + logical isolation</text>

  <rect x="60" y="725" width="1480" height="185" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="90" y="768" font-family="sans-serif" font-size="27" font-weight="700">Classification</text>
  <text x="90" y="810" font-family="sans-serif" font-size="20">Damage to confidentiality / integrity / availability → significance level</text>
  <text x="90" y="848" font-family="sans-serif" font-size="20">УЗ1→К1 · УЗ2→К2 · УЗ3→К3</text>
  <text x="90" y="882" font-family="sans-serif" font-size="18">Protective measures are selected after classification and threat modeling.</text>

  <rect x="60" y="950" width="1480" height="185" rx="18" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="90" y="993" font-family="sans-serif" font-size="27" font-weight="700">Operational sequence</text>
  <text x="90" y="1035" font-family="sans-serif" font-size="21">Classify → threat model → safe visibility → segment/isolate → monitor/respond</text>
  <text x="90" y="1073" font-family="sans-serif" font-size="20">Security activity must not jeopardize the industrial process itself.</text>
  <text x="90" y="1110" font-family="sans-serif" font-size="18">No external legal updates or industrial exploit procedures were added.</text>
</svg>
