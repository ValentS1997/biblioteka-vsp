<text x="52" y="96" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#fbfdff" font-weight="bold">Глава 6 · Разложение на составляющие</text>
<text x="52" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#b9d1e2" font-weight="normal">Декомпозиция полезна, только если компоненты известны лучше исходной величины</text>
<text x="52" y="182" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#82d0f7" font-weight="bold">Три фильтра Ховарда</text>
