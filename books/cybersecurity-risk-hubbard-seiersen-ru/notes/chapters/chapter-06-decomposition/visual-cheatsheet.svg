<text x="89" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Информативное разложение</text>
<text x="72" y="652" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Больше фактов, меньше абстракции</text>
<text x="72" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Учитывает корреляции</text>
<text x="72" y="708" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Помогает различать решения</text>
<rect x="626" y="570" width="522" height="164" rx="14" fill="#183149" stroke="#efb69d" stroke-width="1.5"/>
<rect x="640" y="587" width="6" height="34" rx="3" fill="#efb69d" stroke="#efb69d" stroke-width="1.5"/>
<text x="663" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Неинформативное</text>
<text x="646" y="652" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">«Суждения о суждениях»</text>
<text x="646" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Детализация без данных</text>
<text x="646" y="708" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Сложнее, но не точнее</text>
