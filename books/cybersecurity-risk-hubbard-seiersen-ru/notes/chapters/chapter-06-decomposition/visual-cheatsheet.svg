<text x="211" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#f8fbff" font-weight="bold">Компоненты → явные зависимости → симуляция</text>
<text x="211" y="485" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d0e6f3" font-weight="normal">Сравнить с прямой оценкой и наблюдаемой реальностью</text>
<text x="592" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#7ccdf4" font-weight="bold">↓</text>
<rect x="52" y="570" width="521" height="164" rx="14" fill="#183149" stroke="#89d9bd" stroke-width="1.5"/>
