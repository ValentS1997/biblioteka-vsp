<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="t d">
<title id="t">Глава 3 — Моделируем немедленно: компактная визуальная шпаргалка</title>
<desc id="d">Смена балльных рисков на вероятности и диапазоны потерь, моделирование Монте-Карло, кривая превышения, контроль остаточного риска.</desc>
<rect x="0" y="0" width="1200" height="850" rx="14" fill="#0c1929" stroke="#0c1929" stroke-width="1.5"/>
<text x="54" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#8bd4fc" font-weight="bold">BIBLIOTEKA-VSP / HUBBARD — SEIERSEN</text>
<text x="54" y="95" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#ffffff" font-weight="bold">Глава 3 · Моделируем немедленно!</text>
<text x="54" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#aec7dc">От субъективных баллов — к явной количественной неопределённости</text>
<text x="54" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#8bd4fc" font-weight="bold">1. Входы модели — «один на один»</text>
<rect x="54" y="202" width="342" height="146" rx="14" fill="#1b3149" stroke="#66c1ec" stroke-width="1.5"/>
<text x="74" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fafc" font-weight="bold">Событие и период</text>
<text x="74" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#c7dfed">Что может случиться?</text>
<text x="74" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c7dfed">На каком горизонте?</text>
<rect x="428" y="202" width="342" height="146" rx="14" fill="#1b3149" stroke="#8bdcc0" stroke-width="1.5"/>
<text x="448" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fafc" font-weight="bold">Вероятность</text>
<text x="448" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#c7dfed">Оценка эксперта 0–100%</text>
<text x="448" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c7dfed">За заданный период</text>
<rect x="802" y="202" width="342" height="146" rx="14" fill="#1b3149" stroke="#dfba8a" stroke-width="1.5"/>
<text x="822" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fafc" font-weight="bold">Ущерб при событии</text>
<text x="822" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#c7dfed">90%-ный интервал</text>
<text x="822" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c7dfed">В денежном выражении</text>
<text x="582" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#8bd4fc" font-weight="bold">↓</text>
<rect x="164" y="403" width="871" height="95" rx="14" fill="#213b55" stroke="#76c7eb" stroke-width="1.5"/>
<text x="201" y="442" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#f8fafc" font-weight="bold">2. Монте-Карло — тысячи случайных сценариев</text>
<text x="201" y="474" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#cfe4f0">Флаг события × условный ущерб → сумма потерь</text>
<text x="582" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#8bd4fc" font-weight="bold">↓</text>
<rect x="54" y="555" width="525" height="146" rx="14" fill="#1b3149" stroke="#8bdcc0" stroke-width="1.5"/>
<text x="74" y="594" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fafc" font-weight="bold">3. Кривые превышения</text>
<text x="74" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#c7dfed">P(потери выше порога)</text>
<text x="74" y="668" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c7dfed">Неотъемлемый / остаточный риск</text>
<rect x="621" y="555" width="523" height="146" rx="14" fill="#1b3149" stroke="#dfba8a" stroke-width="1.5"/>
<text x="641" y="594" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fafc" font-weight="bold">4. Выбор контроля</text>
<text x="641" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#c7dfed">Порог рискоустойчивости</text>
<text x="641" y="668" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c7dfed">Снижение ожидаемых потерь / цена</text>
<rect x="54" y="736" width="1090" height="72" rx="14" fill="#1f3640" stroke="#67c7ab" stroke-width="1.5"/>
<text x="80" y="768" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f9fffe" font-weight="bold">Важно: исходное мнение эксперта ещё не измерение</text>
<text x="80" y="793" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d1f0e9">Наблюдения нужны, чтобы реально уменьшить неопределённость.</text>
<text x="54" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#9cb8cb">RAG: EPUB spine 18–20 · OPS/ch1-16.xhtml – OPS/ch1-18.xhtml · не копия рис. 3.1–3.3</text>
</svg>
