<text x="56" y="600" fill="#88d0f8" font-family="Arial" font-size="21" font-weight="bold">Audit: не создавать incentive оставаться на мягких моделях</text>
<rect x="56" y="625" width="1488" height="155" rx="14" fill="#213d55" stroke="#efbd9b"/>
<text x="82" y="666" fill="#fff" font-family="Arial" font-size="20">Audit every decision model — включая intuition, ordinal scores и heat maps</text>
<text x="82" y="703" fill="#d2e8f3" font-family="Arial" font-size="18">Проверять не только арифметику внутри модели, но и пригодность самого подхода</text>
<text x="82" y="739" fill="#d2e8f3" font-family="Arial" font-size="18">Требовать comparative evidence относительно доступных альтернатив</text>
<text x="56" y="850" fill="#88d0f8" font-family="Arial" font-size="21" font-weight="bold">Ecosystem change requested by authors</text>
<rect x="56" y="875" width="1488" height="150" rx="14" fill="#183149" stroke="#91d6bd"/>
<text x="82" y="916" fill="#fff" font-family="Arial" font-size="18">Standards bodies · certification · auditors · regulators · vendors · consultants · insurers</text>
<text x="82" y="954" fill="#d1e6f1" font-family="Arial" font-size="18">Shift toward empirically supported methods and equal scrutiny of competing risk models</text>
<text x="82" y="992" fill="#d1e6f1" font-family="Arial" font-size="18">Final systemic-risk argument: interconnected organizations require models beyond unaided intuition</text>
<rect x="56" y="1070" width="1488" height="50" rx="10" fill="#2c2a38" stroke="#9a889f"/>
<text x="82" y="1102" fill="#f0dce8" font-family="Arial" font-size="16">Source boundary: Fig. 12.1 unavailable as original; governance/staffing/policy points remain author recommendations</text>
