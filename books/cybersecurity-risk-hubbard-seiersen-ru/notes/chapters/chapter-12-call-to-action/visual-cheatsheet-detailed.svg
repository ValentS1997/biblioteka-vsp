<text x="56" y="55" fill="#7fcaf4" font-family="Arial" font-size="16" font-weight="bold">BIBLIOTEKA-VSP / CHAPTER 12 / CYBER RISK</text>
<text x="56" y="108" fill="#fff" font-family="Arial" font-size="34" font-weight="bold">Программа управления рисками кибербезопасности</text>
<text x="56" y="148" fill="#bcd2e3" font-family="Arial" font-size="19">Финальная глава: governance, capability building и model assurance</text>
<rect x="56" y="205" width="1488" height="105" rx="14" fill="#203d54" stroke="#78cbf2"/>
<text x="82" y="247" fill="#fff" font-family="Arial" font-size="23" font-weight="bold">Strategic charter</text>
<text x="82" y="282" fill="#d1e6f1" font-family="Arial" font-size="18">Executive accountability · technology initiative review · risk tolerance · exceptions · ongoing investment monitoring · cyber insurance</text>
<g font-family="Arial">
<rect x="56" y="365" width="350" height="165" rx="14" fill="#183149" stroke="#8dcdf1"/><text x="80" y="407" fill="#fff" font-size="21" font-weight="bold">Quantitative analysis</text><text x="80" y="444" fill="#cee2ee" font-size="17">Decision analysis</text><text x="80" y="473" fill="#cee2ee" font-size="17">R / Python / statistics</text><text x="80" y="502" fill="#cee2ee" font-size="17">Portfolio monitoring</text>
<rect x="428" y="365" width="350" height="165" rx="14" fill="#183149" stroke="#91d6bd"/><text x="452" y="407" fill="#fff" font-size="21" font-weight="bold">Training & development</text><text x="452" y="444" fill="#cee2ee" font-size="17">Scale quantitative skills</text><text x="452" y="473" fill="#cee2ee" font-size="17">Content + enablement</text><text x="452" y="502" fill="#cee2ee" font-size="17">Distributed adoption</text>
