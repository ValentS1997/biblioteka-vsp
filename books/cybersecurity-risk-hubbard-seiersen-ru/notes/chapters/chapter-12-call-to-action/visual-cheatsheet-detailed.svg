<rect x="1172" y="365" width="372" height="165" rx="14" fill="#183149" stroke="#e7c18c"/><text x="1196" y="407" fill="#fff" font-size="21" font-weight="bold">Program management</text><text x="1196" y="444" fill="#cee2ee" font-size="17">Cross-functional coordination</text><text x="1196" y="473" fill="#cee2ee" font-size="17">Roadmap / rollout</text><text x="1196" y="502" fill="#cee2ee" font-size="17">Change management</text>
