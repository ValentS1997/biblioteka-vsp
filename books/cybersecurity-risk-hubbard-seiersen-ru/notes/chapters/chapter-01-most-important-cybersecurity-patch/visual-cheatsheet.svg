<rect x="624" y="539" width="520" height="155" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="639" y="557" width="6" height="36" rx="3" fill="#80d8bc" stroke="#80d8bc" stroke-width="1.5"/><text x="660" y="583" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">Альтернатива авторов</text><text x="646" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Количественные вероятностные методы</text>
<text x="646" y="649" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Оценка риска и снижения риска</text>
