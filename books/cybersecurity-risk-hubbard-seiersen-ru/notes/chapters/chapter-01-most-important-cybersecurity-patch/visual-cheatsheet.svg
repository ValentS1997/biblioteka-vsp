<text x="78" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">в интернете</text>
<rect x="333" y="187" width="257" height="149" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="348" y="205" width="6" height="36" rx="3" fill="#80d8bc" stroke="#80d8bc" stroke-width="1.5"/><text x="369" y="231" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">2 · Активность</text><text x="355" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Больше взаимодействий</text>
<text x="355" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">и подключённых устройств</text>
<rect x="610" y="187" width="257" height="149" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="625" y="205" width="6" height="36" rx="3" fill="#e2c188" stroke="#e2c188" stroke-width="1.5"/><text x="646" y="231" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">3 · Уязвимости</text><text x="632" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Больше систем и</text>
