<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Глава 1. Самая нужная заплатка в кибербезопасности — компактная схема</title>
<desc id="desc">Рост поверхности атаки, ограниченность ресурсов и авторское предложение измерять качество оценки риска количественными методами.</desc>
<rect x="0" y="0" width="1200" height="840" rx="0" fill="#0b1729" stroke="#0b1729" stroke-width="1.5"/>
<text x="56" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#70d6ff">BIBLIOTEKA-VSP / CYBER RISK</text>
<text x="56" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f8fafc">Глава 1 · Самая нужная «заплатка»</text>
<text x="56" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#bacbdb">Не только защищать, но и измерять качество решения о защите</text>
<text x="56" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#70d6ff">4 фактора расширения поверхности атаки — по аргументации авторов</text>
