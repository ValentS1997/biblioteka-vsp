<text x="93" y="1120" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#ffc9be">ГРАНИЦЫ ДОКАЗАТЕЛЬСТВ</text>
<text x="93" y="1150" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#f0dbdc">• Иллюстрация 1.1 не восстановлена: в RAG только её подпись и текстовое описание.</text>
<text x="93" y="1175" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#f0dbdc">• Глава не содержит CLI-команд, формулы оценки риска, порогов или rollback-процедур.</text>
