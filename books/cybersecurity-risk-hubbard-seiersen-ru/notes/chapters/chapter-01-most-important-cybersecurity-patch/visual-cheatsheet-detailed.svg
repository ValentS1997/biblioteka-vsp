<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">Глава 1. Самая нужная заплатка в кибербезопасности — подробная схема</title>
<desc id="desc">Аргумент об ограниченных ресурсах, четырёх факторах роста поверхности атаки, критике субъективных матриц и предложении количественных методов с проверяемой эффективностью.</desc>
<rect x="0" y="0" width="1600" height="1280" rx="0" fill="#0b1729" stroke="#0b1729" stroke-width="1.5"/>
<text x="65" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#71cfff">HOW TO MEASURE ANYTHING IN CYBERSECURITY RISK</text>
<text x="65" y="112" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f8fafc">01  /  Самая нужная «заплатка» в кибербезопасности</text>
<text x="65" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#bfd0e0">У авторов проблема не только в угрозах, но и в способе распределять ограниченные ресурсы</text>
<text x="65" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#78ccff">ГЛОБАЛЬНАЯ ПОВЕРХНОСТЬ АТАКИ · четыре фактора</text>
<rect x="65" y="225" width="339" height="194" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="80" y="243" width="6" height="36" rx="3" fill="#89d5ff" stroke="#89d5ff" stroke-width="1.5"/><text x="101" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">1 · Пользователи</text><text x="87" y="307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Мировая аудитория сети растёт.</text>
<text x="87" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Больше потенциальных</text>
<text x="87" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">целей и ценных данных.</text>
<text x="86" y="404" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#89a9bd">e0013:c03</text>
<rect x="442" y="225" width="339" height="194" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="457" y="243" width="6" height="36" rx="3" fill="#80d8bc" stroke="#80d8bc" stroke-width="1.5"/><text x="478" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">2 · Интернет-активность</text><text x="464" y="307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Больше онлайн-операций,</text>
<text x="464" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">веб-ресурсов и устройств.</text>
<text x="464" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Взаимодействий всё больше.</text>
<text x="463" y="404" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#89a9bd">e0013:c03</text>
<rect x="819" y="225" width="339" height="194" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="834" y="243" width="6" height="36" rx="3" fill="#eac38e" stroke="#eac38e" stroke-width="1.5"/><text x="855" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">3 · Уязвимости</text><text x="841" y="307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Больше систем и устройств,</text>
<text x="841" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">поиск и эксплуатация</text>
<text x="841" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">уязвимостей расширяются.</text>
<text x="840" y="404" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#89a9bd">e0013:c03–c04</text>
<rect x="1196" y="225" width="339" height="194" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="1211" y="243" width="6" height="36" rx="3" fill="#ceb5ff" stroke="#ceb5ff" stroke-width="1.5"/><text x="1232" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">4 · Взаимосвязи</text><text x="1218" y="307" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Поставщики и контрагенты.</text>
<text x="1218" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Один инцидент может</text>
<text x="1218" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">затронуть несколько сторон.</text>
<text x="1217" y="404" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#89a9bd">e0013:c03–c04</text>
<text x="800" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#83d3ff">↓</text>
<rect x="215" y="483" width="1170" height="94" rx="16" fill="#203a55" stroke="#78cbff" stroke-width="1.5"/>
<text x="800" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#f8fafc">Поверхность атаки шире отдельного сервера или сети</text>
<text x="800" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#c5d8e8">Рост взломов и поверхности атаки коррелирует — гипотеза главы, а не доказанная формула</text>
<text x="800" y="614" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#f1f5f9">Ограниченные ресурсы → неизбежная приоритизация угроз и мер</text>
<rect x="65" y="640" width="713" height="246" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="80" y="658" width="6" height="36" rx="3" fill="#f6b4a9" stroke="#f6b4a9" stroke-width="1.5"/><text x="101" y="684" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">Устоявшийся подход: матрицы</text><text x="87" y="722" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Субъективная «вероятность» и «воздействие» 1–5.</text>
<text x="87" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Баллы и heatmap используются для приоритетов.</text>
<text x="87" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Авторы указывают на риск искажения суждений.</text>
<text x="87" y="806" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Подробные исследования — в главах 4–5.</text>
<text x="88" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#aac0d0">RAG: e0014:c02–c03</text>
<rect x="822" y="640" width="713" height="246" rx="16" fill="#14263b" stroke="#38536e" stroke-width="1.5"/><rect x="837" y="658" width="6" height="36" rx="3" fill="#8de0c3" stroke="#8de0c3" stroke-width="1.5"/><text x="858" y="684" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#f1f5f9">Предложение: измеряемый анализ</text><text x="844" y="722" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Количественные вероятностные методы.</text>
<text x="844" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Риск и снижение риска — язык решений.</text>
<text x="844" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Учитывать эмпирические наблюдения.</text>
<text x="844" y="806" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#cbd5e1">Проверять результативность самого метода.</text>
<text x="845" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#aac0d0">RAG: e0013:c01, e0014:c03–c04</text>
<text x="65" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7bcfff">ЦЕЛЬ «ЗАПЛАТКИ» · цикл качества решений (логическая схема по главе)</text>
