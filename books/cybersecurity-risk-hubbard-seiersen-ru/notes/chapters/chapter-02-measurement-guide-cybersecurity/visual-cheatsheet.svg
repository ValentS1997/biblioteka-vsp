<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Глава 2 — компактная визуальная шпаргалка</title>
<desc id="d">Ошибки концепции, объекта и метода измерения; уменьшение неопределённости и правило пяти.</desc>
<rect width="1200" height="700" fill="#0f1c2d"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="45" y="52" font-size="32" fill="#ffffff" font-weight="bold">Глава 2 · Руководство по измерениям</text>
<text x="45" y="85" font-size="19" fill="#b9d7eb">Измерение — количественное уменьшение неопределённости через наблюдения</text>
<text x="45" y="135" font-size="22" fill="#7dd3fc" font-weight="bold">Три препятствия (COM)</text>
<rect x="45" y="155" width="343" height="150" rx="12" fill="#1c3650" stroke="#6fc6e9"/>
<rect x="428" y="155" width="343" height="150" rx="12" fill="#1c3650" stroke="#70c7a1"/>
<rect x="811" y="155" width="343" height="150" rx="12" fill="#1c3650" stroke="#ccb5ee"/>
<text x="65" y="197" font-size="24" fill="#ffffff">Concept</text>
<text x="65" y="231" font-size="18" fill="#d3e8f3">Не нужна абсолютная точность.</text>
<text x="65" y="259" font-size="18" fill="#d3e8f3">Нужно снижать неопределённость.</text>
<text x="448" y="197" font-size="24" fill="#ffffff">Object</text>
<text x="448" y="231" font-size="18" fill="#d3e8f3">Уточнить смысл термина.</text>
<text x="448" y="259" font-size="18" fill="#d3e8f3">Найти наблюдаемые последствия.</text>
<text x="831" y="197" font-size="24" fill="#ffffff">Method</text>
<text x="831" y="231" font-size="18" fill="#d3e8f3">Выборка, косвенные признаки,</text>
<text x="831" y="259" font-size="18" fill="#d3e8f3">контролируемые наблюдения.</text>
<text x="583" y="351" font-size="30" fill="#7dd3fc">↓</text>
<rect x="150" y="371" width="900" height="86" rx="12" fill="#214867" stroke="#7dd3fc"/>
<text x="219" y="407" font-size="24" fill="#ffffff" font-weight="bold">Вероятности до наблюдения → новые данные</text>
<text x="219" y="437" font-size="21" fill="#d7ebf9">→ оценка изменения неопределённости → решение</text>
<rect x="45" y="494" width="532" height="125" rx="12" fill="#1c3650" stroke="#f5c78f"/>
<rect x="621" y="494" width="533" height="125" rx="12" fill="#1c3650" stroke="#83dfc4"/>
<text x="65" y="531" font-size="21" fill="#ffffff" font-weight="bold">Шкалы: операции различаются</text>
<text x="65" y="563" font-size="18" fill="#d3e8f3">Номинальная, порядковая, интервальная,</text>
<text x="65" y="589" font-size="18" fill="#d3e8f3">отношений. Ранги нельзя перемножать.</text>
<text x="641" y="531" font-size="21" fill="#ffffff" font-weight="bold">«Правило пяти»</text>
<text x="641" y="563" font-size="18" fill="#d3e8f3">93,75%: медиана в диапазоне min–max</text>
<text x="641" y="589" font-size="18" fill="#d3e8f3">пяти случайных наблюдений (по авторам).</text>
<text x="45" y="674" font-size="15" fill="#9bbbd0">RAG: EPUB spine 15–17 · OPS/ch1-13.xhtml — OPS/ch1-15.xhtml</text>
</g></svg>
