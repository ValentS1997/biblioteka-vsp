<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
<title id="title">Глава 5 — подробная схема критики матриц риска</title>
<desc id="desc">Исследования шкал, примеры сжатия диапазона и инверсии, данные опроса и сравнительный принцип Exsupero Ursus.</desc>
<rect x="0" y="0" width="1600" height="1220" rx="0" fill="#0b1829" stroke="#0b1829" stroke-width="1.5"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#7fcaf4" font-weight="bold">BIBLIOTEKA-VSP / CHAPTER 05 / CYBER RISK</text>
<text x="56" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#fafcff" font-weight="bold">Матрицы риска, факторы лжи и ошибки сравнения</text>
<text x="56" y="138" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#bcd2e3" font-weight="normal">Источник: авторская критика qualitative risk scoring на основе описанных исследований</text>
<text x="56" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">I · Неоднозначность шкал</text>
<rect x="56" y="209" width="475" height="164" rx="14" fill="#183149" stroke="#efbd9b" stroke-width="1.5"/>
<rect x="70" y="226" width="6" height="34" rx="3" fill="#efbd9b" stroke="#efbd9b" stroke-width="1.5"/>
<text x="93" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Вербальные вероятности</text>
<text x="76" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Будеску: «весьма вероятно»</text>
<text x="76" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">примерно 43–99%,</text>
<text x="76" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">«маловероятно» 8–66%.</text>
<rect x="562" y="209" width="475" height="164" rx="14" fill="#183149" stroke="#edca8e" stroke-width="1.5"/>
<rect x="576" y="226" width="6" height="34" rx="3" fill="#edca8e" stroke="#edca8e" stroke-width="1.5"/>
<text x="599" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Даже с определениями</text>
<text x="582" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Контекст влияет на трактовку.</text>
<text x="582" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Период риска может</text>
<text x="582" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">пониматься по-разному.</text>
<rect x="1068" y="209" width="476" height="164" rx="14" fill="#183149" stroke="#b7b4ef" stroke-width="1.5"/>
<rect x="1082" y="226" width="6" height="34" rx="3" fill="#b7b4ef" stroke="#b7b4ef" stroke-width="1.5"/>
<text x="1105" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Иллюзия коммуникации</text>
<text x="1088" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Участники считают, что</text>
<text x="1088" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">пришли к общему пониманию,</text>
<text x="1088" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">хотя смыслы расходятся.</text>
<text x="56" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">II · Сжатие диапазона и инверсия</text>
<rect x="56" y="449" width="704" height="188" rx="14" fill="#183149" stroke="#8dd9bd" stroke-width="1.5"/>
<text x="82" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Одна ячейка — разные ожидаемые потери</text>
<text x="82" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d1e6f1" font-weight="normal">2% × $10 млн = $0,2 млн</text>
<text x="82" y="558" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d1e6f1" font-weight="normal">20% × $100 млн = $20 млн</text>
<text x="82" y="598" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#a9c7d9" font-weight="normal">Разница ×100, категория может совпасть</text>
<rect x="790" y="449" width="754" height="188" rx="14" fill="#183149" stroke="#efbd9b" stroke-width="1.5"/>
<text x="816" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Инверсия порядка в примере матрицы</text>
<text x="816" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d1e6f1" font-weight="normal">50% × $9 млн = $4,5 млн → «средний»</text>
<text x="816" y="558" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d1e6f1" font-weight="normal">60% × $2 млн = $1,2 млн → «высокий»</text>
<text x="816" y="598" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#a9c7d9" font-weight="normal">Конкретный пример Кокса, не универсальный шаблон</text>
<text x="56" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">III · Данные, приведённые в главе</text>
<rect x="56" y="712" width="360" height="164" rx="14" fill="#183149" stroke="#91d7bd" stroke-width="1.5"/>
<rect x="70" y="729" width="6" height="34" rx="3" fill="#91d7bd" stroke="#91d7bd" stroke-width="1.5"/>
<text x="93" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Опрос авторов</text>
<text x="76" y="794" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">171 специалист</text>
<text x="76" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">86% в целом за quant</text>
<text x="76" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">61% используют матрицы</text>
<rect x="438" y="712" width="360" height="164" rx="14" fill="#183149" stroke="#eac48d" stroke-width="1.5"/>
<rect x="452" y="729" width="6" height="34" rx="3" fill="#eac48d" stroke="#eac48d" stroke-width="1.5"/>
<text x="475" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Группирование оценок</text>
<text x="458" y="794" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">&gt;2000 ответов</text>
<text x="458" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">~76% — значения 3 или 4</text>
<text x="458" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">из шкалы 1–5</text>
<rect x="820" y="712" width="360" height="164" rx="14" fill="#183149" stroke="#b7b4ef" stroke-width="1.5"/>
<rect x="834" y="729" width="6" height="34" rx="3" fill="#b7b4ef" stroke="#b7b4ef" stroke-width="1.5"/>
<text x="857" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Фактор лжи</text>
<text x="840" y="794" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Thomas et al.:</text>
<text x="840" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">среднее искажение &gt;100</text>
<text x="840" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">по их метрике</text>
<rect x="1202" y="712" width="342" height="164" rx="14" fill="#183149" stroke="#92c8f1" stroke-width="1.5"/>
<rect x="1216" y="729" width="6" height="34" rx="3" fill="#92c8f1" stroke="#92c8f1" stroke-width="1.5"/>
<text x="1239" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Stat literacy</text>
<text x="1222" y="794" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Медиана 3/10</text>
<text x="1222" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">угадывание ~2,3/10</text>
<text x="1222" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">связь P &lt; 0,01</text>
<text x="56" y="939" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">IV · Exsupero Ursus: сравнивать с реальной альтернативой</text>
<rect x="56" y="960" width="1488" height="125" rx="14" fill="#203d54" stroke="#78cbf2" stroke-width="1.5"/>
<text x="82" y="1000" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#fbfdff" font-weight="bold">Недостаток количественной модели ≠ доказательство преимущества матрицы или интуиции</text>
<text x="82" y="1035" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d2e8f3" font-weight="normal">Проверять обе альтернативы: ошибки, сохранность информации, стоимость, прогнозы и решения</text>
<text x="82" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d2e8f3" font-weight="normal">Нехватка данных и сложность затрагивают все методы — qualitative labels не устраняют неопределённость</text>
<rect x="56" y="1110" width="1488" height="67" rx="14" fill="#2c2a38" stroke="#9a889f" stroke-width="1.5"/>
<text x="82" y="1140" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#f0dce8" font-weight="normal">SOURCE BOUNDARY: рис. 5.1–5.3 и табл. 5.1–5.4 не реконструируются; статистический dataset отсутствует</text>
<text x="82" y="1165" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#f0dce8" font-weight="normal">Target — иллюстрация, не сравнительное доказательство. Regulatory applicability: [Needs confirmation].</text>
<text x="56" y="1207" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#90aec4" font-weight="normal">RAG e0024:c01–c02 / e0025:c01–c09 / e0026:c01–c12 · EPUB spine 24–26</text>
</svg>
