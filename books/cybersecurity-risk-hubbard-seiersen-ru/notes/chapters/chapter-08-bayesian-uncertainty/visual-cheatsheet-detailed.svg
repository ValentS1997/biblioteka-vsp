<text x="56" y="1224" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#90aec4" font-weight="normal">RAG e0034:c01–c03 / e0035:c01–c05 · EPUB spine 34–35 · not a pentest runbook</text>
