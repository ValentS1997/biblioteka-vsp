<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">Глава 8 — подробная визуальная схема байесовского анализа</title>
<desc id="desc">Базовые правила вероятности, informative prior, Bayes reversal, chain rule и числовой пример обновления риска после penetration test.</desc>
<rect x="0" y="0" width="1600" height="1240" rx="0" fill="#0b1829" stroke="#0b1829" stroke-width="1.5"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#7fcaf4" font-weight="bold">BIBLIOTEKA-VSP / CHAPTER 08 / CYBER RISK</text>
<text x="56" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#fafcff" font-weight="bold">Bayes: согласованное обновление неопределённости</text>
<text x="56" y="138" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#bcd2e3" font-weight="normal">Исходное знание не отбрасывается — оно обновляется наблюдением</text>
<text x="56" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">I · События и условия</text>
<rect x="56" y="209" width="475" height="164" rx="14" fill="#183149" stroke="#8dcdf1" stroke-width="1.5"/>
<rect x="70" y="226" width="6" height="34" rx="3" fill="#8dcdf1" stroke="#8dcdf1" stroke-width="1.5"/>
<text x="93" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">КУД</text>
<text x="76" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Крупная утечка данных</text>
<text x="76" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">в указанном году</text>
<text x="76" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Target event</text>
<rect x="562" y="209" width="475" height="164" rx="14" fill="#183149" stroke="#91d6bd" stroke-width="1.5"/>
<rect x="576" y="226" width="6" height="34" rx="3" fill="#91d6bd" stroke="#91d6bd" stroke-width="1.5"/>
<text x="599" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">УЭУ</text>
<text x="582" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Удалённо эксплуатируемая</text>
<text x="582" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">уязвимость</text>
<text x="582" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Intermediate condition</text>
<rect x="1068" y="209" width="476" height="164" rx="14" fill="#183149" stroke="#e7c18c" stroke-width="1.5"/>
<rect x="1082" y="226" width="6" height="34" rx="3" fill="#e7c18c" stroke="#e7c18c" stroke-width="1.5"/>
<text x="1105" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">ПТП</text>
<text x="1088" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Положительный</text>
<text x="1088" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">penetration test</text>
<text x="1088" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Observed evidence</text>
<text x="56" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">II · Базовые правила</text>
<rect x="56" y="447" width="475" height="164" rx="14" fill="#183149" stroke="#8dcdf1" stroke-width="1.5"/>
<rect x="70" y="464" width="6" height="34" rx="3" fill="#8dcdf1" stroke="#8dcdf1" stroke-width="1.5"/>
<text x="93" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Complement / joint</text>
<text x="76" y="529" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">P(A)+P(~A)=1</text>
<text x="76" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">P(A,B)=P(A)P(B)</text>
<text x="76" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">только при independence</text>
<rect x="562" y="447" width="475" height="164" rx="14" fill="#183149" stroke="#91d6bd" stroke-width="1.5"/>
<rect x="576" y="464" width="6" height="34" rx="3" fill="#91d6bd" stroke="#91d6bd" stroke-width="1.5"/>
<text x="599" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Conditional / chain</text>
<text x="582" y="529" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">P(A|B)=P(A,B)/P(B)</text>
<text x="582" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">P(A,B)=P(A|B)P(B)</text>
<text x="582" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Chain rule for more states</text>
<rect x="1068" y="447" width="476" height="164" rx="14" fill="#183149" stroke="#e7c18c" stroke-width="1.5"/>
<rect x="1082" y="464" width="6" height="34" rx="3" fill="#e7c18c" stroke="#e7c18c" stroke-width="1.5"/>
<text x="1105" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Bayes</text>
<text x="1088" y="529" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">P(A|B)=P(A)P(B|A)/P(B)</text>
<text x="1088" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Переворачивает conditional</text>
<text x="1088" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">с учётом base rates</text>
<text x="56" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">III · Числовой пример</text>
<rect x="56" y="687" width="1488" height="190" rx="14" fill="#183149" stroke="#8dd9bd" stroke-width="1.5"/>
<text x="82" y="727" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#f8fbff" font-weight="bold">Prior / derived</text>
<text x="82" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d1e6f1" font-weight="normal">P(УЭУ) ≈ 1,0%   ·   P(КУД) = 1,24%   ·   P(УЭУ|КУД) = 20,16%</text>
<text x="82" y="807" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#f8fbff" font-weight="bold">Evidence update</text>
<text x="82" y="845" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d1e6f1" font-weight="normal">P(КУД|ПТП)=23,8%   &gt;   P(КУД)=1,24%   &gt;   P(КУД|~ПТП)=1,01%</text>
<text x="56" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#88d0f8" font-weight="bold">IV · Source / operational boundaries</text>
<rect x="56" y="951" width="713" height="164" rx="14" fill="#183149" stroke="#efbd9b" stroke-width="1.5"/>
<rect x="70" y="968" width="6" height="34" rx="3" fill="#efbd9b" stroke="#efbd9b" stroke-width="1.5"/>
<text x="93" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Source integrity</text>
<text x="76" y="1033" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Рис. 8.1–8.2 не реконструируются</text>
<text x="76" y="1061" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Step 3 numeric formula has broken parentheses</text>
<text x="76" y="1089" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">External calculator not retrieved</text>
<rect x="791" y="951" width="753" height="164" rx="14" fill="#183149" stroke="#b7b4ef" stroke-width="1.5"/>
<rect x="805" y="968" width="6" height="34" rx="3" fill="#b7b4ef" stroke="#b7b4ef" stroke-width="1.5"/>
<text x="828" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#f8fbff" font-weight="bold">Operational safety</text>
<text x="811" y="1033" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c9deec" font-weight="normal">Penetration test — evidence variable only</text>
