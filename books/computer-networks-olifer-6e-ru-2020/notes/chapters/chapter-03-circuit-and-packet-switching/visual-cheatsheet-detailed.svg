<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="t d">
<title id="t">Chapter 3 detailed switching map</title>
<desc id="d">Detailed RAG-grounded comparison of circuit switching, packet switching, forwarding modes, delay and Ethernet.</desc>
<rect width="1500" height="1180" fill="#ffffff"/>
<text x="60" y="60" font-family="sans-serif" font-size="36" font-weight="700">Chapter 3 — Switching Models</text>
<text x="60" y="98" font-family="sans-serif" font-size="18">PDF 75–102 · printed 74–101 · source mode: rag_only</text>

<rect x="60" y="140" width="660" height="280" rx="18" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="95" y="185" font-family="sans-serif" font-size="26" font-weight="700">Circuit switching</text>
<text x="95" y="225" font-family="sans-serif" font-size="18">elementary channels → composite end-to-end channel</text>
<text x="95" y="260" font-family="sans-serif" font-size="18">setup checks availability and reserves resources</text>
<text x="95" y="295" font-family="sans-serif" font-size="18">fixed bandwidth for the session</text>
<text x="95" y="330" font-family="sans-serif" font-size="18">data follows pre-established local channel mappings</text>
<text x="95" y="365" font-family="sans-serif" font-size="18">strong predictability; setup may be rejected</text>
<text x="95" y="400" font-family="sans-serif" font-size="18">bursty traffic leaves reserved capacity idle</text>

<rect x="780" y="140" width="660" height="280" rx="18" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="815" y="185" font-family="sans-serif" font-size="26" font-weight="700">Packet switching</text>
<text x="815" y="225" font-family="sans-serif" font-size="18">message → packets with header information</text>
<text x="815" y="260" font-family="sans-serif" font-size="18">statistical sharing of link capacity</text>
<text x="815" y="295" font-family="sans-serif" font-size="18">store-and-forward requires buffers</text>
<text x="815" y="330" font-family="sans-serif" font-size="18">queues absorb rate/processing mismatch</text>
<text x="815" y="365" font-family="sans-serif" font-size="18">overflow may cause loss; delay is variable</text>
<text x="815" y="400" font-family="sans-serif" font-size="18">bursty sources aggregate into a smoother total flow</text>

<text x="60" y="485" font-family="sans-serif" font-size="27" font-weight="700">Packet forwarding choices</text>

<rect x="75" y="525" width="400" height="175" rx="15" fill="#ffffff" stroke="#27364a" stroke-width="2"/>
<text x="110" y="570" font-family="sans-serif" font-size="23" font-weight="700">Datagram</text>
<text x="110" y="607" font-family="sans-serif" font-size="17">no prior exchange state required</text>
<text x="110" y="637" font-family="sans-serif" font-size="17">each packet handled independently</text>
<text x="110" y="667" font-family="sans-serif" font-size="17">best-effort; paths can differ</text>

<rect x="550" y="525" width="400" height="175" rx="15" fill="#ffffff" stroke="#27364a" stroke-width="2"/>
<text x="585" y="570" font-family="sans-serif" font-size="23" font-weight="700">Logical connection</text>
<text x="585" y="607" font-family="sans-serif" font-size="17">connection parameters are negotiated</text>
<text x="585" y="637" font-family="sans-serif" font-size="17">end systems track exchange state</text>
<text x="585" y="667" font-family="sans-serif" font-size="17">reliability/security behavior can be added</text>

<rect x="1025" y="525" width="400" height="175" rx="15" fill="#ffffff" stroke="#27364a" stroke-width="2"/>
<text x="1060" y="570" font-family="sans-serif" font-size="23" font-weight="700">Virtual circuit</text>
<text x="1060" y="607" font-family="sans-serif" font-size="17">logical connection + fixed route</text>
<text x="1060" y="637" font-family="sans-serif" font-size="17">packet carries a short label</text>
<text x="1060" y="667" font-family="sans-serif" font-size="17">switch tables track active virtual paths</text>

<rect x="120" y="770" width="1260" height="210" rx="18" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="160" y="815" font-family="sans-serif" font-size="26" font-weight="700">Delay model</text>
<text x="160" y="855" font-family="sans-serif" font-size="18">Circuit switching: setup + propagation + serialization.</text>
<text x="160" y="890" font-family="sans-serif" font-size="18">Packet switching adds packetization, per-hop buffering, queue waiting and switching/processing.</text>
<text x="160" y="925" font-family="sans-serif" font-size="18">Pipeline behavior overlaps packet processing across different links and nodes.</text>
<text x="160" y="960" font-family="sans-serif" font-size="18">The chapter's numerical example gives 825 ms vs 1856 ms under its stated assumptions.</text>

<rect x="120" y="1025" width="1260" height="105" rx="18" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="160" y="1067" font-family="sans-serif" font-size="24" font-weight="700">Ethernet example</text>
<text x="160" y="1102" font-family="sans-serif" font-size="18">Datagram packet switching, MAC addressing, shared-medium or switched topology, checksum-based detection, queues.</text>

<text x="60" y="1160" font-family="sans-serif" font-size="15">Source limit: formula indices/superscripts on PDF 95–100 are partially lost in extracted text.</text>
</svg>
