<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Chapter 5 — network characteristics and QoS</title>
<desc id="d">Compact RAG-grounded map from measurable service quality to QoS mechanisms.</desc>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="60" y="60" font-family="sans-serif" font-size="34" font-weight="700">Chapter 5 — Network Characteristics &amp; QoS</text>
<text x="60" y="96" font-family="sans-serif" font-size="18">PDF 134–180 · printed 133–179 · RAG only</text>

<rect x="70" y="145" width="1060" height="105" rx="16" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="105" y="187" font-family="sans-serif" font-size="24" font-weight="700">1. Define and measure service quality</text>
<text x="105" y="220" font-family="sans-serif" font-size="18">SLA · mean/median/percentile · OWD/jitter/RTT · rate · loss · availability</text>

<path d="M600 250 L600 300" stroke="#27364a" stroke-width="3"/>

<rect x="70" y="300" width="500" height="185" rx="16" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="105" y="342" font-family="sans-serif" font-size="24" font-weight="700">2. Understand traffic</text>
<text x="105" y="380" font-family="sans-serif" font-size="18">stream vs bursty</text>
<text x="105" y="414" font-family="sans-serif" font-size="18">delay / jitter sensitivity</text>
<text x="105" y="448" font-family="sans-serif" font-size="18">loss sensitivity</text>

<rect x="630" y="300" width="500" height="185" rx="16" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="665" y="342" font-family="sans-serif" font-size="24" font-weight="700">3. Understand queues</text>
<text x="665" y="380" font-family="sans-serif" font-size="18">utilization + burstiness → queueing</text>
<text x="665" y="414" font-family="sans-serif" font-size="18">FIFO · priority · weighted</text>
<text x="665" y="448" font-family="sans-serif" font-size="18">high utilization → nonlinear delay growth</text>

<path d="M320 485 L475 550" stroke="#27364a" stroke-width="3"/>
<path d="M880 485 L725 550" stroke="#27364a" stroke-width="3"/>

<rect x="190" y="550" width="820" height="175" rx="16" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="230" y="592" font-family="sans-serif" font-size="25" font-weight="700">4. Choose a QoS mechanism</text>
<text x="230" y="630" font-family="sans-serif" font-size="18">queue scheduling · classification · policing · shaping · feedback</text>
<text x="230" y="664" font-family="sans-serif" font-size="18">resource reservation · admission control · traffic engineering</text>
<text x="230" y="698" font-family="sans-serif" font-size="18">or keep the network underloaded by overprovisioning</text>

<path d="M600 725 L600 775" stroke="#27364a" stroke-width="3"/>

<rect x="250" y="775" width="700" height="80" rx="16" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="285" y="808" font-family="sans-serif" font-size="21" font-weight="700">Measure → classify → control → verify</text>
<text x="285" y="837" font-family="sans-serif" font-size="16">QoS begins with the metric and application requirement, not the queue type.</text>

<text x="60" y="882" font-family="sans-serif" font-size="14">Source note: formula typography is partially extraction-damaged; original figures are not multimodal RAG objects.</text>
</svg>
