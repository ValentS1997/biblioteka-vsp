<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-labelledby="t d">
<title id="t">Chapter 4 detailed map</title>
<desc id="d">Detailed RAG-grounded map of layered decomposition, OSI responsibilities, standards, protocol distribution, planes and network classification.</desc>
<rect width="1500" height="1240" fill="#ffffff"/>
<text x="60" y="60" font-family="sans-serif" font-size="36" font-weight="700">Chapter 4 — Standardization and Classification</text>
<text x="60" y="98" font-family="sans-serif" font-size="18">PDF 103–133 · printed 102–132 · source mode: rag_only</text>

<rect x="60" y="140" width="1380" height="130" rx="18" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="95" y="180" font-family="sans-serif" font-size="25" font-weight="700">1. Layered decomposition</text>
<text x="95" y="215" font-family="sans-serif" font-size="18">module responsibilities + stable service interfaces reduce complexity</text>
<text x="95" y="245" font-family="sans-serif" font-size="18">protocol = peer interaction across nodes · interface = adjacent-layer interaction inside one node</text>

<rect x="60" y="320" width="660" height="340" rx="18" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="95" y="362" font-family="sans-serif" font-size="25" font-weight="700">2. OSI vertical reference model</text>
<text x="95" y="404" font-family="sans-serif" font-size="18">7 Application — network services for applications</text>
<text x="95" y="438" font-family="sans-serif" font-size="18">6 Presentation — representation, conversion, protection</text>
<text x="95" y="472" font-family="sans-serif" font-size="18">5 Session — dialog/session coordination</text>
<text x="95" y="506" font-family="sans-serif" font-size="18">4 Transport — end-to-end service quality</text>
<text x="95" y="540" font-family="sans-serif" font-size="18">3 Network — internetworking and route selection</text>
<text x="95" y="574" font-family="sans-serif" font-size="18">2 Data Link — frame delivery within a network</text>
<text x="95" y="608" font-family="sans-serif" font-size="18">1 Physical — bit transmission over media</text>
<text x="95" y="642" font-family="sans-serif" font-size="16">Encapsulation: upper-layer PDU becomes lower-layer payload.</text>

<rect x="780" y="320" width="660" height="340" rx="18" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="815" y="362" font-family="sans-serif" font-size="25" font-weight="700">3. Real networks and standards</text>
<text x="815" y="404" font-family="sans-serif" font-size="18">Open specifications enable multi-vendor interoperability</text>
<text x="815" y="438" font-family="sans-serif" font-size="18">Standards may be firm, consortium, national or international</text>
<text x="815" y="472" font-family="sans-serif" font-size="18">Internet standardization uses an open RFC process</text>
<text x="815" y="506" font-family="sans-serif" font-size="18">Concrete stacks do not necessarily have seven explicit layers</text>
<text x="815" y="540" font-family="sans-serif" font-size="18">Hosts implement full stacks</text>
<text x="815" y="574" font-family="sans-serif" font-size="18">Link switches use lower layers; routers include network layer</text>
<text x="815" y="608" font-family="sans-serif" font-size="18">Auxiliary protocols add control and management functions</text>

<rect x="120" y="720" width="1260" height="190" rx="18" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
<text x="160" y="765" font-family="sans-serif" font-size="26" font-weight="700">4. Horizontal planes complement OSI</text>
<text x="160" y="807" font-family="sans-serif" font-size="19">User plane — carries user traffic</text>
<text x="160" y="842" font-family="sans-serif" font-size="19">Control plane — routing, naming and other functions required for network operation</text>
<text x="160" y="877" font-family="sans-serif" font-size="19">Management plane — monitoring and administrative control</text>

<rect x="120" y="955" width="1260" height="215" rx="18" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
<text x="160" y="1000" font-family="sans-serif" font-size="26" font-weight="700">5. Network classification is multidimensional</text>
<text x="160" y="1042" font-family="sans-serif" font-size="18">Geography: LAN · MAN · WAN</text>
<text x="160" y="1074" font-family="sans-serif" font-size="18">Medium: wired · wireless | Switching: packet · circuit | Topology: mesh/tree/star/ring/mixed</text>
<text x="160" y="1106" font-family="sans-serif" font-size="18">Users: carrier · corporate · personal | Role: access · aggregation · backbone</text>
<text x="160" y="1138" font-family="sans-serif" font-size="18">Infrastructure relation: primary · overlay</text>

<text x="60" y="1210" font-family="sans-serif" font-size="15">Source note: classifications are explicitly non-unique; figures 4.1–4.15 are not independent multimodal RAG objects.</text>
</svg>
