<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Эволюция компьютерных сетей</title>
  <desc id="desc">Компактная RAG-grounded схема эволюции от вычислительной техники и телекоммуникаций к LAN, WAN, конвергенции и Интернету.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700">Глава 1. Эволюция компьютерных сетей</text>
  <text x="60" y="100" font-family="sans-serif" font-size="18">RAG: PDF 26–40 · printed 25–39 · PDF 36 — gap</text>

  <rect x="70" y="150" width="470" height="100" rx="16" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
  <text x="100" y="190" font-family="sans-serif" font-size="23" font-weight="700">Вычислительная техника</text>
  <text x="100" y="224" font-family="sans-serif" font-size="18">batch → time sharing → мини-компьютеры → LAN</text>

  <rect x="660" y="150" width="470" height="100" rx="16" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
  <text x="690" y="190" font-family="sans-serif" font-size="23" font-weight="700">Телекоммуникации</text>
  <text x="690" y="224" font-family="sans-serif" font-size="18">дальний доступ → WAN → packet switching</text>

  <path d="M305 250 L420 330" stroke="#27364a" stroke-width="3" fill="none"/>
  <path d="M895 250 L780 330" stroke="#27364a" stroke-width="3" fill="none"/>

  <rect x="330" y="330" width="540" height="110" rx="16" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
  <text x="365" y="374" font-family="sans-serif" font-size="24" font-weight="700">Стандартизация и конвергенция</text>
  <text x="365" y="410" font-family="sans-serif" font-size="18">цифровые линии · IP · Ethernet · сближение LAN/WAN</text>

  <path d="M600 440 L600 500" stroke="#27364a" stroke-width="3"/>

  <rect x="250" y="500" width="700" height="110" rx="16" fill="#eef2f7" stroke="#27364a" stroke-width="2"/>
  <text x="285" y="544" font-family="sans-serif" font-size="24" font-weight="700">Интернет как фактор развития</text>
  <text x="285" y="578" font-family="sans-serif" font-size="18">новые устройства + сервисы + рост трафика</text>

  <path d="M600 610 L600 660" stroke="#27364a" stroke-width="3"/>

  <rect x="300" y="660" width="600" height="65" rx="16" fill="#f7f7f7" stroke="#27364a" stroke-width="2"/>
  <text x="330" y="700" font-family="sans-serif" font-size="20" font-weight="700">Новые требования: задержка · надежность · QoS · архитектура</text>
</svg>
