<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — Проектирование наборов данных</title>
  <desc id="desc">Компактная шпаргалка по quality, coverage, quantity, synthesis, verification and processing.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="110" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 8 — Проектирование наборов данных</text>
  <text x="56" y="83" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Behavior → quality · coverage · quantity → verify → process → train</text>

  <rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">Quality</text>
  <text x="78" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Relevance · task alignment</tspan>
    <tspan x="78" dy="31">Consistency · formatting</tspan>
    <tspan x="78" dy="31">Uniqueness · compliance</tspan>
    <tspan x="78" dy="31">Manual inspection still matters</tspan>
  </text>

  <rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">Coverage</text>
  <text x="593" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Reflect real usage patterns</tspan>
    <tspan x="593" dy="31">Topics · styles · languages</tspan>
    <tspan x="593" dy="31">Lengths · typos · task types</tspan>
    <tspan x="593" dy="31">Target weak/rare slices</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">Quantity</text>
  <text x="1108" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">No universal dataset size</tspan>
    <tspan x="1108" dy="31">Depends on method + task + base model</tspan>
    <tspan x="1108" dy="31">Start with a small high-quality pilot</tspan>
    <tspan x="1108" dy="31">Scale only after measurable signal</tspan>
  </text>

  <rect x="50" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">Synthetic data</text>
  <text x="78" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Rules · perturbation · simulation</tspan>
    <tspan x="78" dy="31">AI paraphrase · translate · self-play</tspan>
    <tspan x="78" dy="31">Instruction generation</tspan>
    <tspan x="78" dy="31">Useful only with verification</tspan>
  </text>

  <rect x="565" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="593" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">Synthetic risks</text>
  <text x="593" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Low quality / hallucinations</tspan>
    <tspan x="593" dy="31">Shallow imitation</tspan>
    <tspan x="593" dy="31">Model collapse / bias amplification</tspan>
    <tspan x="593" dy="31">Hidden provenance / licensing</tspan>
  </text>

  <rect x="1080" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="1108" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">Processing</text>
  <text x="1108" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Inspect → deduplicate</tspan>
    <tspan x="1108" dy="31">Clean / compliance filter</tspan>
    <tspan x="1108" dy="31">Format for tokenizer/chat template</tspan>
    <tspan x="1108" dy="31">Trial runs + immutable raw data</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="820" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Принцип: лучший dataset — не самый большой, а тот, который надежно демонстрирует нужное поведение.</text>
</svg>