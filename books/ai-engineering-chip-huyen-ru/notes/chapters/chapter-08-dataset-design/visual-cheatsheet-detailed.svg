<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — Проектирование наборов данных: подробная шпаргалка</title>
  <desc id="desc">Подробная карта главы 8: data quality, coverage, quantity, annotation, synthesis, validation, distillation and processing.</desc>
  <rect width="1600" height="1260" fill="#f7f8fa"/>
  <rect width="1600" height="112" fill="#17202a"/>
  <text x="58" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 8 — Проектирование наборов данных</text>
  <text x="58" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#d6e4f0">behavior · quality · coverage · quantity · annotation · synthetic data · processing</text>

  <rect x="50" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b4f72">1. Start from behavior</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Design data to demonstrate target behavior.</tspan>
    <tspan x="78" dy="28">Data format depends on training stage.</tspan>
    <tspan x="78" dy="28">Instruction, preference, reward and tool-use data differ.</tspan>
    <tspan x="78" dy="36">Evaluation guidance and labeling guidance are closely linked.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">2. Quality</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Relevance · task alignment · consistency.</tspan>
    <tspan x="593" dy="28">Formatting correctness · uniqueness.</tspan>
    <tspan x="593" dy="28">Compliance with internal/external policies.</tspan>
    <tspan x="593" dy="36">Small clean data can beat much larger noisy data.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">3. Coverage + quantity</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Coverage reflects real workload diversity.</tspan>
    <tspan x="1108" dy="28">Quantity depends on method, task and base model.</tspan>
    <tspan x="1108" dy="28">Use a small pilot before large collection.</tspan>
    <tspan x="1108" dy="36">Scale where measured improvement exists.</tspan>
  </text>

  <rect x="50" y="420" width="720" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#6c3483">4. Annotation and inspection</text>
  <text x="78" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Create explicit labeling guidelines.</tspan>
    <tspan x="78" dy="28">Compare annotators and resolve disagreement.</tspan>
    <tspan x="78" dy="28">Inspect samples manually; verify facts and labels.</tspan>
    <tspan x="78" dy="28">Analyze length, topic, language, score and annotator distributions.</tspan>
    <tspan x="78" dy="36" font-weight="700">Automation does not replace attention to data.</tspan>
  </text>

  <rect x="810" y="420" width="740" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#21618c">5. Augmentation and synthesis</text>
  <text x="838" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="838" dy="0">Rule/template transformations · perturbations.</tspan>
    <tspan x="838" dy="28">Simulation for expensive, dangerous or rare cases.</tspan>
    <tspan x="838" dy="28">AI: paraphrase · translate · self-play · instruction generation.</tspan>
    <tspan x="838" dy="28">Can increase quantity, coverage and sometimes quality.</tspan>
    <tspan x="838" dy="36">Real + synthetic mix is often more useful than synthetic-only.</tspan>
  </text>

  <rect x="50" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#922b21">6. Synthetic-data verification</text>
  <text x="78" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Prefer executable/programmatic verification.</tspan>
    <tspan x="78" dy="28">Parser · linter · tests where applicable.</tspan>
    <tspan x="78" dy="28">Else AI/factuality/anomaly/heuristic checks.</tspan>
    <tspan x="78" dy="28">Final test: does it improve downstream model?</tspan>
  </text>

  <rect x="565" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">7. Risks + distillation</text>
  <text x="593" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Quality failures · shallow imitation.</tspan>
    <tspan x="593" dy="28">Model collapse · bias amplification.</tspan>
    <tspan x="593" dy="28">Hidden provenance / copyright / benchmark contamination.</tspan>
    <tspan x="593" dy="28">Distillation: teacher outputs → student; check licenses.</tspan>
  </text>

  <rect x="1080" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">8. Processing pipeline</text>
  <text x="1108" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Inspect → deduplicate → clean/filter.</tspan>
    <tspan x="1108" dy="28">Remove disallowed fields / low-quality data.</tspan>
    <tspan x="1108" dy="28">Format for target tokenizer/chat template.</tspan>
    <tspan x="1108" dy="28">Trial run first; keep raw data immutable.</tspan>
  </text>

  <rect x="50" y="1040" width="1500" height="145" rx="16" fill="#17202a"/>
  <text x="78" y="1080" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Operational sequence</text>
  <text x="78" y="1115" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#d6e4f0">
    <tspan x="78" dy="0">desired behavior → quality/coverage/quantity → seed + guidelines → targeted collect/synthesize → verify</tspan>
    <tspan x="78" dy="29">→ deduplicate/clean/format → train → evaluate downstream behavior → iterate with preserved provenance</tspan>
  </text>

  <text x="50" y="1225" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" fill="#566573">Provenance: RAG p0414:c01–p0459:c01 · PDF/printed pages 414–459 · source SHA-256 850c3652…62fba</text>
</svg>