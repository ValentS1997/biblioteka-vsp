<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Промт-инжиниринг: подробная шпаргалка</title>
  <desc id="desc">Подробная карта prompt engineering: structure, context, decomposition, tools, versioning, attacks and defenses.</desc>
  <rect width="1600" height="1260" fill="#f7f8fa"/>
  <rect width="1600" height="112" fill="#17202a"/>
  <text x="58" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 5 — Промт-инжиниринг</text>
  <text x="58" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#d6e4f0">in-context learning · templates · context efficiency · decomposition · versioning · defense</text>

  <rect x="50" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b4f72">1. Prompt anatomy</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Task description / role / output format.</tspan>
    <tspan x="78" dy="28">Few-shot examples.</tspan>
    <tspan x="78" dy="28">Concrete user task/input.</tspan>
    <tspan x="78" dy="28">Context needed for the task.</tspan>
    <tspan x="78" dy="36">Zero-shot ↔ few-shot trade-off: quality vs tokens.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">2. System/user + templates</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">System and user messages merge into one prompt.</tspan>
    <tspan x="593" dy="28">Each model/version may have its own chat template.</tspan>
    <tspan x="593" dy="28">Wrong template can silently degrade quality.</tspan>
    <tspan x="593" dy="36" font-weight="700">Inspect final serialized prompt before inference.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">3. Context efficiency</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Long window ≠ equally usable context.</tspan>
    <tspan x="1108" dy="28">NIAH / RULER test retrieval from long prompts.</tspan>
    <tspan x="1108" dy="28">Middle positions may be harder than beginning/end.</tspan>
    <tspan x="1108" dy="36">If quality falls, shorten or rebuild context.</tspan>
  </text>

  <rect x="50" y="420" width="720" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#6c3483">4. Prompt optimization workflow</text>
  <text x="78" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Clear instruction + explicit output schema.</tspan>
    <tspan x="78" dy="28">Provide relevant context and examples.</tspan>
    <tspan x="78" dy="28">Split complex tasks into smaller prompts where useful.</tspan>
    <tspan x="78" dy="28">Use CoT / self-critique when evaluation justifies it.</tspan>
    <tspan x="78" dy="28">Evaluate every change on fixed data/metrics.</tspan>
    <tspan x="78" dy="28">Measure end-to-end quality · tokens · cost · latency.</tspan>
  </text>

  <rect x="810" y="420" width="740" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#21618c">5. Tools + lifecycle</text>
  <text x="838" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="838" dy="0">Optimization: OpenPrompt · DSPy · Promptbreeder · TextGrad.</tspan>
    <tspan x="838" dy="28">Structured outputs: Guidance · Outlines · Instructor.</tspan>
    <tspan x="838" dy="28">Risk: hidden API calls · template bugs · tool updates.</tspan>
    <tspan x="838" dy="28">Separate prompts from code; store metadata + versions.</tspan>
    <tspan x="838" dy="36" font-weight="700">Prompt version is part of experiment provenance.</tspan>
  </text>

  <rect x="50" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#922b21">6. Attack surface</text>
  <text x="78" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Prompt/context extraction.</tspan>
    <tspan x="78" dy="28">Manual + automated jailbreaks.</tspan>
    <tspan x="78" dy="28">Indirect injection via web/email/RAG/tool data.</tspan>
    <tspan x="78" dy="28">Training/context data extraction.</tspan>
    <tspan x="78" dy="36">Risk grows when model can call powerful tools.</tspan>
  </text>

  <rect x="565" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">7. Security evaluation</text>
  <text x="593" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Red-team known and new attack patterns.</tspan>
    <tspan x="593" dy="28">Violation rate: successful attacks / attempts.</tspan>
    <tspan x="593" dy="28">False refusal: safe requests rejected.</tspan>
    <tspan x="593" dy="28">Optimize both — blocking everything is useless.</tspan>
  </text>

  <rect x="1080" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">8. Defense in depth</text>
  <text x="1108" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Model: instruction hierarchy.</tspan>
    <tspan x="1108" dy="28">Prompt: explicit constraints / reminders.</tspan>
    <tspan x="1108" dy="28">System: sandbox + human approval gates.</tspan>
    <tspan x="1108" dy="28">Input/output guardrails + anomaly monitoring.</tspan>
    <tspan x="1108" dy="36" font-weight="700">Prompts alone cannot eliminate injection risk.</tspan>
  </text>

  <rect x="50" y="1040" width="1500" height="145" rx="16" fill="#17202a"/>
  <text x="78" y="1080" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Operational sequence</text>
  <text x="78" y="1115" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#d6e4f0">
    <tspan x="78" dy="0">define behavior → simple prompt → inspect final template → fixed evaluation → iterate → version + metadata</tspan>
    <tspan x="78" dy="29">→ adversarial tests → model/prompt/system defenses → monitor violations + false refusals → re-evaluate</tspan>
  </text>

  <text x="50" y="1225" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" fill="#566573">Provenance: RAG p0251:c01–p0294:c01 · PDF/printed pages 251–294 · source SHA-256 850c3652…62fba</text>
</svg>