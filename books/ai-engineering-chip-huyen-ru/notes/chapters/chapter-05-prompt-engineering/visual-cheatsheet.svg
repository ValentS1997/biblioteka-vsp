<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Промт-инжиниринг</title>
  <desc id="desc">Компактная шпаргалка по prompt design, evaluation, versioning и defense.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="110" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 5 — Промт-инжиниринг</text>
  <text x="56" y="83" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Design → inspect → evaluate → version → defend</text>

  <rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">Prompt structure</text>
  <text x="78" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Task description</tspan>
    <tspan x="78" dy="31">Examples / few-shot</tspan>
    <tspan x="78" dy="31">Concrete task/input</tspan>
    <tspan x="78" dy="31">Relevant context</tspan>
  </text>

  <rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">Engineering checks</text>
  <text x="593" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Correct chat template</tspan>
    <tspan x="593" dy="31">Inspect final serialized prompt</tspan>
    <tspan x="593" dy="31">Fixed eval set + metrics</tspan>
    <tspan x="593" dy="31">Measure tokens · cost · latency</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">Best practices</text>
  <text x="1108" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Clear instructions + output format</tspan>
    <tspan x="1108" dy="31">Enough context + examples</tspan>
    <tspan x="1108" dy="31">Decompose complex tasks</tspan>
    <tspan x="1108" dy="31">Iterate systematically</tspan>
  </text>

  <rect x="50" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">Prompt lifecycle</text>
  <text x="78" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Separate prompts from code.</tspan>
    <tspan x="78" dy="31">Store metadata + model/config.</tspan>
    <tspan x="78" dy="31">Version prompts.</tspan>
    <tspan x="78" dy="31">Track dependent applications.</tspan>
  </text>

  <rect x="565" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="593" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">Attack surface</text>
  <text x="593" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Prompt/context extraction</tspan>
    <tspan x="593" dy="31">Jailbreak / prompt injection</tspan>
    <tspan x="593" dy="31">Indirect injection via tools/data</tspan>
    <tspan x="593" dy="31">Training/context information extraction</tspan>
  </text>

  <rect x="1080" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="1108" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">Defense</text>
  <text x="1108" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Model instruction hierarchy</tspan>
    <tspan x="1108" dy="31">Prompt constraints</tspan>
    <tspan x="1108" dy="31">Isolation + human approval gates</tspan>
    <tspan x="1108" dy="31">Input/output guardrails + monitoring</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="820" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Принцип: prompt — versioned testable artifact, но не самостоятельная security boundary.</text>
</svg>