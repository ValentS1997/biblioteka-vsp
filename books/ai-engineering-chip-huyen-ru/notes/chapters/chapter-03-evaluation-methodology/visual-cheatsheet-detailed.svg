<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Методология оценки: подробная шпаргалка</title>
  <desc id="desc">Подробная визуальная карта главы 3: трудности оценки, LM metrics, exact evaluation, AI judges и comparative ranking.</desc>
  <rect width="1600" height="1240" fill="#f7f8fa"/>
  <rect width="1600" height="112" fill="#17202a"/>
  <text x="58" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 3 — Методология оценки</text>
  <text x="58" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#d6e4f0">open-ended outputs · exact metrics · embeddings · AI judge · comparative ranking</text>

  <rect x="50" y="145" width="470" height="240" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b4f72">1. Почему оценка сложна</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Open-ended tasks → много правильных outputs.</tspan>
    <tspan x="78" dy="28">Сильные models требуют сильных evaluators.</tspan>
    <tspan x="78" dy="28">Black-box models скрывают причины поведения.</tspan>
    <tspan x="78" dy="28">Benchmarks быстро насыщаются.</tspan>
    <tspan x="78" dy="36">Eyeballing не масштабируется для iterations.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="240" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">2. Language-model metrics</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Entropy: информация / predictability данных.</tspan>
    <tspan x="593" dy="28">Cross-entropy: model vs data distribution.</tspan>
    <tspan x="593" dy="28">PPL = exponential(cross-entropy).</tspan>
    <tspan x="593" dy="28">BPC / BPB нормализуют representation.</tspan>
    <tspan x="593" dy="36">PPL полезна, но не заменяет task evaluation.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="240" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">3. Exact evaluation</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Functional correctness: does it work?</tspan>
    <tspan x="1108" dy="28">Code: unit tests · pass@k.</tspan>
    <tspan x="1108" dy="28">Reference: exact match / lexical / semantic.</tspan>
    <tspan x="1108" dy="36" font-weight="700">Функция важнее похожести текста.</tspan>
  </text>

  <rect x="50" y="415" width="720" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="455" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#6c3483">4. Similarity metrics</text>
  <text x="78" y="493" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Exact match: только если допустимых ответов мало.</tspan>
    <tspan x="78" dy="28">Lexical: edit distance · n-grams · BLEU · ROUGE · METEOR++ · TER · CIDEr.</tspan>
    <tspan x="78" dy="28">Semantic: embedding vectors + cosine similarity.</tspan>
    <tspan x="78" dy="28">BERTScore / MoverScore используют learned representations.</tspan>
    <tspan x="78" dy="38" font-weight="700">Reference data может быть неполным или ошибочным.</tspan>
  </text>

  <rect x="810" y="415" width="740" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="455" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#21618c">5. AI as judge</text>
  <text x="838" y="493" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="838" dy="0">Single-answer score · reference comparison · pairwise preference.</tspan>
    <tspan x="838" dy="28">Judge = model + prompt + sampling settings.</tspan>
    <tspan x="838" dy="28">Prompt должен задавать task · criterion · scoring system · examples.</tspan>
    <tspan x="838" dy="28">Classification часто надежнее широких numeric scales.</tspan>
    <tspan x="838" dy="38" font-weight="700">Judge version — часть provenance оценки.</tspan>
  </text>

  <rect x="50" y="730" width="470" height="260" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="770" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#922b21">6. Judge limitations</text>
  <text x="78" y="808" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Несогласованность между повторными runs.</tspan>
    <tspan x="78" dy="28">Критерии не стандартизированы.</tspan>
    <tspan x="78" dy="28">self-bias · position bias · verbosity bias.</tspan>
    <tspan x="78" dy="28">Cost · latency · privacy/IP.</tspan>
    <tspan x="78" dy="36" font-weight="700">Стабильность ≠ correctness.</tspan>
  </text>

  <rect x="565" y="730" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="770" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">7. Specialized judges</text>
  <text x="593" y="808" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Reward model: request + answer → score.</tspan>
    <tspan x="593" dy="28">Reference judge: candidate vs reference.</tspan>
    <tspan x="593" dy="28">Preference model: answer A vs answer B.</tspan>
    <tspan x="593" dy="28">Examples: Cappy · BLEURT · Prometheus · PandaLM · JudgeLM.</tspan>
  </text>

  <rect x="1080" y="730" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="770" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">8. Comparative evaluation</text>
  <text x="1108" y="808" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">Pairwise signals → win rates → ranking.</tspan>
    <tspan x="1108" dy="28">Elo · Bradley–Terry · TrueSkill.</tspan>
    <tspan x="1108" dy="28">Signals expensive; model pairs grow quadratically.</tspan>
    <tspan x="1108" dy="28">Transitivity may not hold.</tspan>
    <tspan x="1108" dy="36">Relative rank ≠ absolute product threshold.</tspan>
  </text>

  <rect x="50" y="1025" width="1500" height="145" rx="16" fill="#17202a"/>
  <text x="78" y="1065" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Operational sequence</text>
  <text x="78" y="1100" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#d6e4f0">
    <tspan x="78" dy="0">failure hypothesis → exact metric if possible → reference / AI judge if needed → freeze evaluator definition</tspan>
    <tspan x="78" dy="29">→ repeatability &amp; bias checks → interpret against application goal → combine methods where one signal is insufficient</tspan>
  </text>

  <text x="50" y="1210" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" fill="#566573">Provenance: RAG p0146:c01–p0192:c01 · PDF/printed pages 146–192 · source SHA-256 850c3652…62fba</text>
</svg>