<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Глава 7 — Дообучение: подробная шпаргалка</title>
  <desc id="desc">Подробная карта главы 7: decision flow, memory, precision, PEFT, LoRA, model merging and training tactics.</desc>
  <rect width="1600" height="1260" fill="#f7f8fa"/>
  <rect width="1600" height="112" fill="#17202a"/>
  <text x="58" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Глава 7 — Дообучение, или Тонкая настройка</text>
  <text x="58" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#d6e4f0">when to finetune · memory · quantization · PEFT · LoRA · merging · hyperparameters</text>

  <rect x="50" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b4f72">1. Adaptation decision</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Start with evaluation + prompts.</tspan>
    <tspan x="78" dy="28">Add few-shot examples.</tspan>
    <tspan x="78" dy="28">Missing/stale information → RAG.</tspan>
    <tspan x="78" dy="28">Persistent behavior/format/safety → finetune.</tspan>
    <tspan x="78" dy="36">RAG + finetuning can coexist.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">2. Training memory</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Weights + activations + gradients + optimizer states.</tspan>
    <tspan x="593" dy="28">Adam: gradient + 2 states / trainable parameter.</tspan>
    <tspan x="593" dy="28">More trainable params → more memory.</tspan>
    <tspan x="593" dy="36">Checkpointing lowers activation memory, adds compute.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="245" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">3. Numeric representation</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">FP32 / FP16 / BF16 / TF32 / INT8 / INT4.</tspan>
    <tspan x="1108" dy="28">Fewer bits → lower memory, possible quality loss.</tspan>
    <tspan x="1108" dy="28">PTQ for post-training inference compression.</tspan>
    <tspan x="1108" dy="28">QAT / mixed precision for training trade-offs.</tspan>
  </text>

  <rect x="50" y="420" width="720" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#6c3483">4. PEFT and LoRA</text>
  <text x="78" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">PEFT: near-full quality with far fewer trainable parameters in supported cases.</tspan>
    <tspan x="78" dy="28">Adapter methods add trainable modules; soft prompts add trainable tokens.</tspan>
    <tspan x="78" dy="28">LoRA: W' = W + (α/r)·A·B; W stays frozen.</tspan>
    <tspan x="78" dy="28">Choose target matrices + rank r under memory/performance budget.</tspan>
    <tspan x="78" dy="28">QLoRA: quantized base weights + low-rank adapters.</tspan>
    <tspan x="78" dy="36" font-weight="700">Lower memory does not guarantee full-finetuning quality.</tspan>
  </text>

  <rect x="810" y="420" width="740" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#21618c">5. Model merging</text>
  <text x="838" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="838" dy="0">Goal: combine useful behaviors into one model.</tspan>
    <tspan x="838" dy="28">Linear combinations / task vectors.</tspan>
    <tspan x="838" dy="28">SLERP interpolation.</tspan>
    <tspan x="838" dy="28">TIES / DARE prune interfering delta parameters.</tspan>
    <tspan x="838" dy="28">Layer stacking creates new architectures/sizes.</tspan>
    <tspan x="838" dy="36">Merging is experimental → broad regression evaluation required.</tspan>
  </text>

  <rect x="50" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#922b21">6. Practical progression</text>
  <text x="78" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="78" dy="0">Cheap/fast model → validate code.</tspan>
    <tspan x="78" dy="28">Mid model → validate data.</tspan>
    <tspan x="78" dy="28">Strong model → estimate ceiling.</tspan>
    <tspan x="78" dy="28">Then compare cost/performance across candidates.</tspan>
  </text>

  <rect x="565" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#9c640c">7. Hyperparameters</text>
  <text x="593" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="593" dy="0">Learning rate: use loss stability.</tspan>
    <tspan x="593" dy="28">Batch size: stability vs memory.</tspan>
    <tspan x="593" dy="28">Gradient accumulation: larger effective batch.</tspan>
    <tspan x="593" dy="28">Epochs: train/validation divergence reveals overfit.</tspan>
    <tspan x="593" dy="28">Prompt-loss weight for instruction finetuning.</tspan>
  </text>

  <rect x="1080" y="735" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="775" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196f3d">8. Platforms</text>
  <text x="1108" y="813" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#273746">
    <tspan x="1108" dy="0">LLaMA-Factory · unsloth · PEFT.</tspan>
    <tspan x="1108" dy="28">Axolotl · LitGPT.</tspan>
    <tspan x="1108" dy="28">DeepSpeed · PyTorch Distributed · ColossalAI.</tspan>
    <tspan x="1108" dy="36">Platform choice controls supported models, methods and knobs.</tspan>
  </text>

  <rect x="50" y="1040" width="1500" height="145" rx="16" fill="#17202a"/>
  <text x="78" y="1080" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Operational sequence</text>
  <text x="78" y="1115" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" fill="#d6e4f0">
    <tspan x="78" dy="0">evaluate → prompt/few-shot → RAG for information → finetune for behavior → optimize memory</tspan>
    <tspan x="78" dy="29">→ tune LR/batch/epochs → compare quality/cost/latency/regressions → keep only measured improvement</tspan>
  </text>

  <text x="50" y="1225" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" fill="#566573">Provenance: RAG p0353:c01–p0413:c01 · PDF/printed pages 353–413 · source SHA-256 850c3652…62fba</text>
</svg>