<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 10 — Архитектура AI-инженерии и обратная связь</title>
  <desc id="desc">Компактная карта постепенной архитектуры, observability and feedback loops.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="110" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#ffffff">Глава 10 — Архитектура AI-инженерии и обратная связь</text>
  <text x="56" y="83" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Start simple → add boundaries → observe → learn from users</text>

  <rect x="50" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">Architecture progression</text>
  <text x="78" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Context → guardrails</tspan>
    <tspan x="78" dy="31">Router → gateway</tspan>
    <tspan x="78" dy="31">Cache → agent loops / tools</tspan>
    <tspan x="78" dy="31">Add only for an observed problem</tspan>
  </text>

  <rect x="565" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">Control boundaries</text>
  <text x="593" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">PII / prompt attacks</tspan>
    <tspan x="593" dy="31">Output quality / safety</tspan>
    <tspan x="593" dy="31">Central model access / cost control</tspan>
    <tspan x="593" dy="31">Write actions = larger blast radius</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="260" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">Caching</text>
  <text x="1108" y="226" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Exact: identical key</tspan>
    <tspan x="1108" dy="31">Semantic: embeddings + threshold</tspan>
    <tspan x="1108" dy="31">Measure correctness, not only hit rate</tspan>
    <tspan x="1108" dy="31">Privacy leak is a first-class risk</tspan>
  </text>

  <rect x="50" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">Observability</text>
  <text x="78" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">MTTD · MTTR · CFR</tspan>
    <tspan x="78" dy="31">Metrics → detect</tspan>
    <tspan x="78" dy="31">Logs + traces → explain</tspan>
    <tspan x="78" dy="31">Production failures → evaluation</tspan>
  </text>

  <rect x="565" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">User feedback</text>
  <text x="593" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Explicit + implicit + conversational</tspan>
    <tspan x="593" dy="31">Collect in normal workflow</tspan>
    <tspan x="593" dy="31">Explain data use / respect privacy</tspan>
    <tspan x="593" dy="31">Feedback is signal, not ground truth</tspan>
  </text>

  <rect x="1080" y="450" width="470" height="270" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">Feedback risks</text>
  <text x="1108" y="532" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Inflated / random ratings</tspan>
    <tspan x="1108" dy="31">Position / preference bias</tspan>
    <tspan x="1108" dy="31">Degenerate feedback loops</tspan>
    <tspan x="1108" dy="31">Independent evaluation required</tspan>
  </text>

  <rect x="50" y="775" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="78" y="820" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Принцип: каждый новый компонент должен решать измеримую проблему и оставаться наблюдаемым.</text>
</svg>