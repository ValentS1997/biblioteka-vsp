<svg xmlns="http://www.w3.org/2000/svg" width="1830" height="1590" viewBox="0 0 1830 1590" role="img" aria-label="Подробная карта главы 20 Prometheus TLS, Basic Authentication, CA, сертификатов и несогласованностей RAG"><rect x="0" y="0" width="1830" height="1590" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="55" y="72" font-family="DejaVu Sans,sans-serif" font-size="36" fill="#19374f" font-weight="bold">Глава 20 · Серверная безопасность Prometheus</text><text x="55" y="114" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64798b">PDF 345–349 · p0345:c01–p0349:c01 · strict RAG-only</text><rect x="55" y="156" width="835" height="265" rx="16" fill="#e7f3ff" stroke="#cbd5df" stroke-width="2"/><text x="80" y="201" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">1. Файлы и политика reload</text><text x="80" y="244" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">web.yml → --web.config.file</text><text x="80" y="280" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">TLS/Basic Auth читаются при каждом запросе</text><text x="80" y="316" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">promtool check web-config web.yml</text><text x="80" y="352" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">prometheus.yml → scheme / ca / auth</text><text x="80" y="388" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Reload основного конфига — отдельное действие</text><rect x="935" y="156" width="840" height="265" rx="16" fill="#e8f8ee" stroke="#cbd5df" stroke-width="2"/><text x="960" y="201" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">2. TLS и сертификаты</text><text x="960" y="244" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">openssl self-signed: RSA-2048, 365d</text><text x="960" y="280" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">CN=localhost; SAN=DNS:localhost</text><text x="960" y="316" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">tls_server_config: cert_file + key_file</text><text x="960" y="352" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">mTLS: RequireAndVerifyClientCert</text><text x="960" y="388" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">client_ca_file — дополнительное поле</text><rect x="55" y="466" width="835" height="270" rx="16" fill="#fff3e7" stroke="#cbd5df" stroke-width="2"/><text x="80" y="511" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">3. Basic Authentication</text><text x="80" y="554" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">bcrypt hash в basic_auth_users</text><text x="80" y="590" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">htpasswd -nBC 10; cost 10–12 в книге</text><text x="80" y="626" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">HTTP header несёт учётные данные</text><text x="80" y="662" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Шифрование TLS защищает транспорт</text><text x="80" y="698" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">julien/demo — публичный учебный пароль</text><rect x="935" y="466" width="840" height="270" rx="16" fill="#eeeefe" stroke="#cbd5df" stroke-width="2"/><text x="960" y="511" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">4. Сквозная проверка</text><text x="960" y="554" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">TLS сервер → HTTPS client и self-scrape</text><text x="960" y="590" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">scheme: https, ca_file: prometheus.crt</text><text x="960" y="626" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Basic Auth должен учесть self-scrape</text><text x="960" y="662" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Не использовать source curl IP без сверки SAN</text><text x="960" y="698" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Разграничение OAuth/LDAP — reverse proxy</text><rect x="55" y="780" width="1720" height="247" rx="16" fill="#fff" stroke="#c8d7e3" stroke-width="2"/><text x="87" y="827" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#194969" font-weight="bold">5. Изменения состояния и проверки</text><text x="87" y="873" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">openssl создаёт приватный ключ; запуск Prometheus активирует web.yml</text><text x="87" y="918" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">killall -HUP prometheus влияет на процессы с таким именем, а не выбранный PID</text><text x="87" y="963" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">Проверить конфигурацию, certificate identity, реальные credentials и rollback</text><rect x="55" y="1070" width="1720" height="452" rx="16" fill="#fff0ed" stroke="#dfaaa4" stroke-width="2"/><text x="87" y="1119" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#873d3a" font-weight="bold">6. Регистр расхождений канонического RAG</text><text x="87" y="1169" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0346: SAN содержит DNS:localhost; curl использует https://127.0.0.1</text><text x="87" y="1216" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0348: browser URL http:// после включения TLS</text><text x="87" y="1263" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0349: пример self-scrape с Basic Auth без static_configs</text><text x="87" y="1310" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0348: опубликован bcrypt hash и пароль demo — не production credential</text><text x="87" y="1357" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0346: ключ -nodes без passphrase; file permissions и rotation не даны</text><text x="87" y="1404" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">p0347: mTLS-параметры приведены без cert_file/key_file</text><text x="87" y="1460" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244158">Никаких runtime-запросов, генерации ключей или reload не выполнялось</text></svg>