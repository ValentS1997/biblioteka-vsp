<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="865" viewBox="0 0 1420 865" role="img" aria-label="Компактная карта главы 20 по TLS Basic Auth самосбору Prometheus и ошибкам исходника"><rect x="0" y="0" width="1420" height="865" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="48" y="67" font-family="DejaVu Sans,sans-serif" font-size="36" fill="#19374f" font-weight="bold">Глава 20 · Безопасность сервера</text><text x="48" y="112" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#647a8d">PDF 345–349 · 5 RAG-чанков · книга 0040</text><rect x="48" y="154" width="418" height="228" rx="16" fill="#e7f3ff" stroke="#cbd5df" stroke-width="2"/><text x="73" y="199" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">HTTPS / TLS</text><text x="73" y="242" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">web.yml: cert_file + key_file</text><text x="73" y="278" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">--web.config.file</text><text x="73" y="314" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">CA доверие и проверка имени</text><text x="73" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Client TLS: RequireAndVerify…</text><rect x="499" y="154" width="418" height="228" rx="16" fill="#e8f8ee" stroke="#cbd5df" stroke-width="2"/><text x="524" y="199" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">Basic Authentication</text><text x="524" y="242" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">basic_auth_users: bcrypt hash</text><text x="524" y="278" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Basic Auth требует TLS</text><text x="524" y="314" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">Secret demo — только учебный</text><text x="524" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">OAuth/LDAP/ACL → reverse proxy</text><rect x="949" y="154" width="422" height="228" rx="16" fill="#fff3e7" stroke="#cbd5df" stroke-width="2"/><text x="974" y="199" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1a4a6b" font-weight="bold">Self-scrape</text><text x="974" y="242" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">prometheus.yml: scheme https</text><text x="974" y="278" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">tls_config.ca_file</text><text x="974" y="314" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">basic_auth: username/password</text><text x="974" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244158">prometheus.yml требует reload</text><rect x="48" y="425" width="1323" height="177" rx="16" fill="#ffffff" stroke="#cbd5df" stroke-width="2"/><text x="78" y="469" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#184769" font-weight="bold">Preflight: проверять два конфигурационных файла</text><text x="78" y="513" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">web.yml → promtool check web-config → конфигурация TLS и Basic Auth</text><text x="78" y="553" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">prometheus.yml → HTTPS self-scrape → reload по согласованной процедуре</text><rect x="48" y="643" width="1323" height="174" rx="16" fill="#fff0ed" stroke="#e3aaa4" stroke-width="2"/><text x="78" y="685" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#863d39" font-weight="bold">Source findings, не копировать без проверки</text><text x="78" y="726" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">PDF 346 DNS:localhost ≠ curl IP 127.0.0.1 · PDF 348 http вместо https</text><text x="78" y="764" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244158">PDF 349 нет static_configs · demo password в открытом тексте</text><text x="78" y="794" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244158">