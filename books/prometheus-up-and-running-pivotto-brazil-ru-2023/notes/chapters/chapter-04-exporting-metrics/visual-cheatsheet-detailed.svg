<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-label="Глава 4 Экспортирование метрик: архитектура, форматы и границы"><rect x="0" y="0" width="1600" height="1260" rx="17" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="52" y="66" fill="#17304a" font-size="34" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 4 · Как метрики попадают в Prometheus</text><text x="52" y="107" fill="#617386" font-size="18" font-family="DejaVu Sans,sans-serif">RAG p0076:c01–p0096:c01 · PDF 76–96 · схемы по тексту, не изображения книги</text><rect x="52" y="147" width="715" height="227" rx="17" fill="#e8f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="74" y="189" fill="#17385a" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Экспорт долгоживущего сервиса</text><text x="74" y="229" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Код → реестр клиентской библиотеки</text><text x="74" y="263" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">WSGI / Twisted / promhttp / Servlet</text><text x="74" y="297" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">HTTP /metrics ← Prometheus pull</text><text x="74" y="331" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Проверить экспозицию и scrape</text><rect x="833" y="147" width="715" height="227" rx="17" fill="#e8f7ec" stroke="#cbd5e1" stroke-width="2"/><text x="855" y="189" fill="#17385a" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Gunicorn: несколько worker</text><text x="855" y="229" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Каждый worker пишет свою метрику</text><text x="855" y="263" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">MultiProcessCollector объединяет при scrape</text><text x="855" y="297" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">child_exit отмечает завершение процесса</text><text x="855" y="331" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Опасный rm -rf: нужен подтверждённый путь</text><rect x="52" y="411" width="715" height="241" rx="17" fill="#fff3e4" stroke="#cbd5e1" stroke-width="2"/><text x="74" y="453" fill="#17385a" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Pushgateway: краткое batch</text><text x="74" y="493" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Job передаёт данные один раз перед выходом</text><text x="74" y="527" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Pushgateway :9091 хранит последнюю группу</text><text x="74" y="561" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Prometheus выполняет обычный pull</text><text x="74" y="595" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">PUT заменяет; POST дополняет; DELETE удаляет</text><text x="74" y="629" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">honor_labels: true; группы сохраняются</text><rect x="833" y="411" width="715" height="241" rx="17" fill="#f0edff" stroke="#cbd5e1" stroke-width="2"/><text x="855" y="453" fill="#17385a" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Мосты и парсеры</text><text x="855" y="493" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">GraphiteBridge: преобразование и отправка</text><text x="855" y="527" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">CollectorRegistry.collect: снимок метрик</text><text x="855" y="561" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">text_string_to_metric_families: парсер</text><text x="855" y="595" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Сетевой получатель — отдельная зависимость</text><rect x="52" y="689" width="1496" height="290" rx="17" fill="#fff" stroke="#cbd6e2" stroke-width="2"/><text x="80" y="734" fill="#17385a" font-size="26" font-family="DejaVu Sans,sans-serif" font-weight="bold">Exposition format: что проверять</text><text x="80" y="787" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">Prometheus: text/plain v0.0.4; HELP, TYPE; labels; final LF</text><text x="80" y="828" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">Histogram: le; +Inf обязателен, _count = +Inf; bucket кумулятивен</text><text x="80" y="870" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">OpenMetrics: application/openmetrics-text v1.0.0; UNIT; EOF</text><text x="80" y="911" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">Добавлены Info, StateSet, GaugeHistogram; _gcount и _gsum</text><text x="80" y="951" fill="#225d8a" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="bold">Read-only check: curl http://localhost:8000/metrics | promtool check metrics</text><rect x="52" y="1020" width="1496" height="197" rx="17" fill="#fff0ed" stroke="#e3aaa6" stroke-width="2"/><text x="80" y="1065" fill="#843b38" font-size="25" font-family="DejaVu Sans,sans-serif" font-weight="bold">Source findings и риски</text><text x="80" y="1105" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">p0077: комментарий // в Python-листинге; p0096: timestamp ms vs seconds</text><text x="80" y="1144" fill="#26394f" font-size="19" font-family="DejaVu Sans,sans-serif">p0081–82: не удалять каталог multiprocess state без preflight и rollback</text><text x="80" y="1183" fill="#26394f" font-size="17" font-family="DejaVu Sans,sans-serif">Рисунки 4.1–4.2 недоступны как самостоятельные объекты; статус чтения не изменён</text></svg>