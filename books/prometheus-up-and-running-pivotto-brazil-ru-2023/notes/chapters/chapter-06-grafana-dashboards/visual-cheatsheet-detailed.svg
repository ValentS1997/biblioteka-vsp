<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="1290" viewBox="0 0 1610 1290" role="img" aria-label="Подробная карта главы 6: установка Grafana, Time series, Stat, Table, State timeline, переменные и подтверждённые проблемы RAG"><rect x="0" y="0" width="1610" height="1290" rx="0" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="52" y="66" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#18334f" font-weight="bold">Глава 6 · Визуализация метрик и эксплуатационные решения</text><text x="52" y="105" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#5c7184">PDF 112–129 · RAG p0112:c01–p0129:c01 · скриншоты не реконструируются</text><rect x="52" y="140" width="728" height="235" rx="16" fill="#e7f2ff" stroke="#ccd8e3" stroke-width="2"/><text x="75" y="182" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b74" font-weight="bold">1. Установка и источник</text><text x="75" y="219" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Grafana 9.1.6 (книга): Docker --net=host</text><text x="75" y="251" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">UI: http://localhost:3000/</text><text x="75" y="283" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Data source: Prometheus http://localhost:9090</text><text x="75" y="315" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Save &amp; Test; затем создать Dashboard</text><rect x="831" y="140" width="727" height="235" rx="16" fill="#e7f8ed" stroke="#ccd8e3" stroke-width="2"/><text x="854" y="182" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b74" font-weight="bold">2. Сборка дашборда</text><text x="854" y="219" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Создать панели, выбрать PromQL запрос</text><text x="854" y="251" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Сохранение панели: Apply</text><text x="854" y="283" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Сохранение дашборда: Ctrl+S</text><text x="854" y="315" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Save As — копия для экспериментов</text><rect x="52" y="411" width="728" height="240" rx="16" fill="#f0efff" stroke="#ccd8e3" stroke-width="2"/><text x="75" y="453" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b74" font-weight="bold">3. Time series и Stat</text><text x="75" y="490" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">process_resident_memory_bytes</text><text x="75" y="522" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Legend {{job}}, data/bytes (IEC)</text><text x="75" y="554" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Stat: prometheus_tsdb_head_series</text><text x="75" y="586" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Stat: node_uname_info → release</text><text x="75" y="618" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Графики зависят от time range</text><rect x="831" y="411" width="727" height="240" rx="16" fill="#fff3e4" stroke="#ccd8e3" stroke-width="2"/><text x="854" y="453" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b74" font-weight="bold">4. Table и State timeline</text><text x="854" y="490" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Table: rate(node_network_receive_bytes_total[1m])</text><text x="854" y="522" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Instant + Organize fields + bytes/sec</text><text x="854" y="554" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">State timeline: up</text><text x="854" y="586" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Mapping DOWN=2 из PDF требует проверки</text><text x="854" y="618" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#233e58">Искажение (aliasing) при другом шаге</text><rect x="52" y="694" width="1506" height="264" rx="16" fill="#fff" stroke="#cad6e1" stroke-width="2"/><text x="80" y="733" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173f60" font-weight="bold">5. Переменные и повторное использование дашборда</text><text x="80" y="773" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#233e58">Имя: Device; источник: Prometheus; refresh: On time range change</text><text x="80" y="809" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233e58">label_values(node_network_receive_bytes_total, device) — функция Grafana, не PromQL</text><text x="80" y="845" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#245f89">rate(node_network_receive_bytes_total{device=&quot;$Device&quot;}[$__rate_interval])</text><text x="80" y="880" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#233e58">Multi-value: device=~&quot;$Device&quot;; legend: {{device}}; Bytes Received</text><text x="80" y="920" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#233e58">Duplicate → Bytes Transmit; Share передаёт выбранные переменные и время</text><rect x="52" y="997" width="1506" height="249" rx="16" fill="#fff0ee" stroke="#e3aca6" stroke-width="2"/><text x="80" y="1043" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#893e39" font-weight="bold">6. Source findings, контроль безопасности и качество</text><text x="80" y="1085" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233e58">p0125: 1→UP, 2→DOWN; p0047–48: 0→DOWN. Не исправлять молча.</text><text x="80" y="1122" font-family="DejaVu Sans Mono,monospace" font-size="17" fill="#84413c">p0128: rate(node_network_transmit_bytes_total {device=~&quot;$Device&quot;})[$__rate_interval]</text><text x="80" y="1161" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233e58">Синтаксис исходящего запроса не подтверждён; смотрите source-findings.md</text><text x="80" y="1200" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233e58">Docker: без тома, host networking, первичный пароль admin/admin — не production</text></svg>