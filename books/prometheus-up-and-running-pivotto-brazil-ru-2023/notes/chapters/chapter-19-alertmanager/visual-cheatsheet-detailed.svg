<svg xmlns="http://www.w3.org/2000/svg" width="1790" height="1620" viewBox="0 0 1790 1620" role="img" aria-label="Подробная схема главы 19 Alertmanager: route tree, группировка, интервалы, webhooks, шаблоны, silences, findings"><rect x="0" y="0" width="1790" height="1620" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="56" y="72" font-family="DejaVu Sans,sans-serif" font-size="36" fill="#15374f" font-weight="bold">Глава 19 · Конвейер Alertmanager</text><text x="56" y="113" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#657d8f">PDF 321–343 · p0321:c01–p0343:c01 · strict RAG-only</text><rect x="56" y="159" width="818" height="253" rx="16" fill="#e7f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="205" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184e6e" font-weight="bold">1. Конфигурация и routing</text><text x="80" y="243" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">alertmanager.yml · amtool check-config</text><text x="80" y="275" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">root route обязателен, без matchers</text><text x="80" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Nested routes, severity/team/env, RE2</text><text x="80" y="339" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">continue:true — несколько маршрутов</text><text x="80" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Inherited options, кроме continue</text><rect x="918" y="159" width="818" height="253" rx="16" fill="#e8f8ed" stroke="#cbd5e1" stroke-width="2"/><text x="942" y="205" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184e6e" font-weight="bold">2. Grouping и дедупликация</text><text x="942" y="243" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">group_by: team / region / env / alertname</text><text x="942" y="275" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Не группировать по instance без причины</text><text x="942" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">group_wait 30s — первая отправка</text><text x="942" y="339" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">group_interval 5m — новые в группе</text><text x="942" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">repeat_interval 4h — повтор ongoing</text><rect x="56" y="455" width="818" height="269" rx="16" fill="#fff4e6" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="501" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184e6e" font-weight="bold">3. Receivers и webhook</text><text x="80" y="539" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Email, PagerDuty, Slack, Opsgenie</text><text x="80" y="571" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Telegram, SNS, VictorOps, webhook</text><text x="80" y="603" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Несколько notifiers в одном receiver</text><text x="80" y="635" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Webhook POST JSON; Python :1234</text><text x="80" y="667" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Секреты source — только XXXXX placeholders</text><rect x="918" y="455" width="818" height="269" rx="16" fill="#eeeefe" stroke="#cbd5e1" stroke-width="2"/><text x="942" y="501" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184e6e" font-weight="bold">4. Templates и group data</text><text x="942" y="539" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">GroupLabels / CommonLabels / Annotations</text><text x="942" y="571" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Alerts, GroupKey, Status, ExternalURL</text><text x="942" y="603" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">range, len, SortedPairs — Go templates</text><text x="942" y="635" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Webhook без notification templates</text><text x="942" y="667" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Короткий текст + dashboard + runbook</text><rect x="56" y="769" width="1680" height="251" rx="16" fill="#fff" stroke="#c8d8e4" stroke-width="2"/><text x="88" y="818" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#174a6a" font-weight="bold">5. Подавление, Silences и resolved</text><text x="88" y="867" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Inhibition: severity=page-regionfail отключает severity=page при equal(region)</text><text x="88" y="911" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Silences в UI: scope по labels, время, владелец, комментарий, preview, отмена</text><text x="88" y="952" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">send_resolved=true: отдельные уведомления; resolved alert ≠ исправленный incident</text><rect x="56" y="1068" width="1680" height="482" rx="16" fill="#fff0ed" stroke="#dfa9a4" stroke-width="2"/><text x="88" y="1118" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#86403c" font-weight="bold">6. Source findings / эксплуатационные ограничения</text><text x="88" y="1164" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0323: SMTP YAML слипся с издательскими маркерами ❶/❷</text><text x="88" y="1208" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0325: возможная ошибка отступа nested routes — проверить amtool</text><text x="88" y="1252" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0337: dashbord в пояснении, dashboard в Go template</text><text x="88" y="1296" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0339: получатель email_to виден в labels; риск раскрытия адресов</text><text x="88" y="1340" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0340: .Alert.Firing/.Alert.Resolved и ранее определённый список .Alerts</text><text x="88" y="1384" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0340–343: inhibition и silences могут скрыть важные оповещения</text><text x="88" y="1428" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Рисунки 19.1–19.5 доступны в RAG как текстовые подписи</text><text x="88" y="1480" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Изменения доставки требуют согласования, review, rollback [Needs confirmation]</text></svg>