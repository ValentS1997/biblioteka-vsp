<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="824" viewBox="0 0 1340 824" role="img" aria-label="Компактная RAG-карта главы 8: static file HTTP Consul EC2 SD, relabeling до и после scrape, target labels и риски"><rect x="0" y="0" width="1340" height="824" rx="16" fill="#f7fafc" stroke="none" stroke-width="2"/><text x="45" y="67" fill="#193752" font-size="34" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 8 · Обнаружение служб</text><text x="45" y="106" fill="#586f85" font-size="18" font-family="DejaVu Sans,sans-serif">Книга 0040 · PDF 144–169 · RAG-only · Prometheus 2.37.0 в источнике</text><rect x="45" y="149" width="387" height="218" rx="16" fill="#e7f2ff" stroke="#cbd6e2" stroke-width="2"/><text x="69" y="192" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Где взять targets</text><text x="69" y="233" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Static: prometheus.yml</text><text x="69" y="267" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">File SD: JSON / YAML</text><text x="69" y="301" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">HTTP SD: JSON / 200 OK</text><text x="69" y="335" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Consul / EC2: метаданные</text><rect x="475" y="149" width="387" height="218" rx="16" fill="#e8f8ee" stroke="#cbd6e2" stroke-width="2"/><text x="499" y="192" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">До scrape</text><text x="499" y="233" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">relabel_configs: keep / drop</text><text x="499" y="267" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">replace, labelmap, lowercase</text><text x="499" y="301" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">__address__ → адрес опроса</text><text x="499" y="335" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">job и instance — идентичность</text><rect x="905" y="149" width="387" height="218" rx="16" fill="#fff1e4" stroke="#cbd6e2" stroke-width="2"/><text x="929" y="192" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">После scrape</text><text x="929" y="233" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">metric_relabel_configs</text><text x="929" y="267" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Удалить дорогие ряды / bucket</text><text x="929" y="301" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">До хранения, но после сети</text><text x="929" y="335" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">honor_labels для конфликтов</text><rect x="45" y="400" width="1247" height="229" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/><text x="75" y="443" fill="#1b4466" font-size="25" font-family="DejaVu Sans,sans-serif" font-weight="bold">Поток данных</text><text x="75" y="486" fill="#25425a" font-size="20" font-family="DejaVu Sans,sans-serif">SD → discovered targets → relabel → scrape → metric relabel → TSDB</text><text x="75" y="527" fill="#25425a" font-size="18" font-family="DejaVu Sans,sans-serif">На /service-discovery проверять итоговые targets и target labels</text><text x="75" y="567" fill="#25425a" font-size="18" font-family="DejaVu Sans,sans-serif">HTTP SD: failures_total; keep/drop могут исключить вообще все цели</text><rect x="45" y="658" width="1247" height="125" rx="16" fill="#fff0ed" stroke="#e3ada4" stroke-width="2"/><text x="75" y="699" fill="#873d38" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">Source findings и безопасность</text><text x="75" y="734" fill="#25425a" font-size="18" font-family="DejaVu Sans,sans-serif">EC2 labelmap, singular/plural metric_relabel, TLS без проверки, inline secrets</text><text x="75" y="763" fill="#25425a" font-size="16" font-family="DejaVu Sans,sans-serif">Без silent-fix; production rollback и реальные credentials — [Needs confirmation]</text></svg>