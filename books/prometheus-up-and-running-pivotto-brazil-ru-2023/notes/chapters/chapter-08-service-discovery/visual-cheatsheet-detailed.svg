<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1530" viewBox="0 0 1720 1530" role="img" aria-label="Подробная карта главы 8: источники обнаружения целей Prometheus, этапы relabel, scrape и metric relabel, безопасность и несогласованности RAG"><rect x="0" y="0" width="1720" height="1530" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="56" y="70" fill="#193752" font-size="34" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 8 · Service Discovery и relabeling в Prometheus</text><text x="56" y="113" fill="#61788a" font-size="18" font-family="DejaVu Sans,sans-serif">PDF 144–169 · p0144:c01–p0169:c01 · строгий RAG-only · не воспроизведение рисунков книги</text><rect x="56" y="154" width="769" height="250" rx="16" fill="#e7f2ff" stroke="#cbd6e2" stroke-width="2"/><text x="80" y="197" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">1. Источники обнаружения</text><text x="80" y="238" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Static: редко меняющиеся targets</text><text x="80" y="272" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">File SD: JSON/YAML, globs по имени файла</text><text x="80" y="306" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">HTTP SD: JSON + 200 + application/json</text><text x="80" y="340" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Consul / EC2: __meta_* и контекст инфраструктуры</text><text x="80" y="374" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Восходящее и нисходящее SD</text><rect x="875" y="154" width="789" height="250" rx="16" fill="#e8f8ef" stroke="#cbd6e2" stroke-width="2"/><text x="899" y="197" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">2. Контроль работоспособности SD</text><text x="899" y="238" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">/service-discovery: найденные и итоговые цели</text><text x="899" y="272" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">prometheus_sd_http_failures_total: ошибки HTTP</text><text x="899" y="306" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">При сбое после рестарта список HTTP SD пуст</text><text x="899" y="340" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">File SD обновлять атомарным rename</text><text x="899" y="374" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Discovery не гарантирует доступный /metrics</text><rect x="56" y="446" width="769" height="267" rx="16" fill="#fff3e7" stroke="#cbd6e2" stroke-width="2"/><text x="80" y="489" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">3. relabel_configs — ДО scrape</text><text x="80" y="530" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">keep: оставить совпавшие цели</text><text x="80" y="564" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">drop: удалить совпавшие цели</text><text x="80" y="598" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Двойной keep infra + monitoring удалит все</text><text x="80" y="632" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">regex infra|monitoring сохраняет альтернативы</text><text x="80" y="666" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">replace, labelmap, lowercase / uppercase</text><rect x="875" y="446" width="789" height="267" rx="16" fill="#f0efff" stroke="#cbd6e2" stroke-width="2"/><text x="899" y="489" fill="#174466" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="bold">4. Адреса и target labels</text><text x="899" y="530" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">__address__: куда Prometheus подключается</text><text x="899" y="564" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">instance: по умолчанию равен __address__</text><text x="899" y="598" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">job: по умолчанию равен job_name</text><text x="899" y="632" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Consul: IP:9100 и отдельно читаемое instance</text><text x="899" y="666" fill="#25425a" font-size="17" font-family="DejaVu Sans,sans-serif">Не менять стабильные метки без необходимости</text><rect x="56" y="755" width="1608" height="262" rx="16" fill="#fff" stroke="#cad7e3" stroke-width="2"/><text x="84" y="801" fill="#194967" font-size="26" font-family="DejaVu Sans,sans-serif" font-weight="bold">5. Scrape → обработка образцов → TSDB</text><text x="84" y="843" fill="#25425a" font-size="20" font-family="DejaVu Sans,sans-serif">scrape_timeout, metrics_path, params, scheme, basic_auth, authorization, tls_config</text><text x="84" y="885" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">metric_relabel_configs: keep/drop рядов по __name__, фильтрация bucket по le</text><text x="84" y="924" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">labeldrop / labelkeep управляют именами меток; метрика up не участвует</text><text x="84" y="963" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">honor_labels: true при конфликте меток, особый случай instance=&quot;&quot; для Pushgateway</text><rect x="56" y="1057" width="1608" height="411" rx="16" fill="#fff0ed" stroke="#e2aca4" stroke-width="2"/><text x="84" y="1106" fill="#86413b" font-size="25" font-family="DejaVu Sans,sans-serif" font-weight="bold">6. Source findings, безопасное применение и проверка</text><text x="84" y="1151" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">p0163: EC2 __meta_ec2_public_tag_monitor_* конфликтует с __meta_ec2_tag_*</text><text x="84" y="1194" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">p0167: metrics_relabel_configs vs metric_relabel_configs; фрагмент relabel без _configs</text><text x="84" y="1237" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">p0150: HTTP URL и tls_config; p0165: insecure_skip_verify=true — не production</text><text x="84" y="1280" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">p0157: regex a(b/c*) и текст альтернативы; p0161: «значения» vs имена __*</text><text x="84" y="1323" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">Проверять targets до/после relabel, отдельный exporter, итоговые метки и scrape</text><text x="84" y="1366" fill="#25425a" font-size="19" font-family="DejaVu Sans,sans-serif">Секреты — placeholders; команды reload, access, rollback [Needs confirmation]</text><text x="84" y="1417" fill="#25425a" font-size="18" font-family="DejaVu Sans,sans-serif">Примеры учебные, версия Prometheus 2.37.0; CI книги 0040 ещё требует target validation</text></svg>