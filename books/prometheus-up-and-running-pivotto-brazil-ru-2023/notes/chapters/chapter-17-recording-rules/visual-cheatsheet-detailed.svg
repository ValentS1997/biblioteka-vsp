<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1540" viewBox="0 0 1740 1540" role="img" aria-label="Подробная визуальная карта главы 17 recording rules Prometheus, вычисления, использование, проверки и недостатки источника"><rect x="0" y="0" width="1740" height="1540" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="56" y="68" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#17344d" font-weight="bold">Глава 17 · Recording rules в Prometheus</text><text x="56" y="110" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64798b">PDF 294–305 · p0294:c01–p0305:c01 · canonical RAG-only</text><rect x="54" y="150" width="797" height="253" rx="16" fill="#e6f2ff" stroke="#ccd8e4" stroke-width="2"/><text x="79" y="194" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">1. Конфигурация и preflight</text><text x="79" y="235" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">prometheus.yml → rule_files: rules.yml</text><text x="79" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">groups[].name → rules[] → record, expr</text><text x="79" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">evaluation_interval и labels опциональны</text><text x="79" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">promtool check config / check rules</text><text x="79" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">reload: SIGHUP или POST /-/reload</text><rect x="892" y="150" width="797" height="253" rx="16" fill="#e6f8ed" stroke="#ccd8e4" stroke-width="2"/><text x="917" y="194" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">2. Выполнение и observability</text><text x="917" y="235" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Правила в группе строго по порядку</text><text x="917" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Результаты записываются в TSDB</text><text x="917" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Общий evaluation timestamp группы</text><text x="917" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">/rules — длительность и состояние</text><text x="917" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">config_last_reload_successful, rule_group_duration</text><rect x="54" y="449" width="797" height="258" rx="16" fill="#fff3e7" stroke="#ccd8e4" stroke-width="2"/><text x="79" y="493" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">3. Агрегирование с сохранением смысла</text><text x="79" y="534" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">rate(x_total[5m]) → sum without(instance)</text><text x="79" y="568" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Не выполнять rate(sum(x_total)[5m])</text><text x="79" y="602" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">job_device:...:rate5m → job:...:rate5m</text><text x="79" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Порядок зависимых правил важен</text><text x="79" y="670" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Проверять выгоду и кардинальность</text><rect x="892" y="449" width="797" height="258" rx="16" fill="#eeeefe" stroke="#ccd8e4" stroke-width="2"/><text x="917" y="493" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">4. Использование и антипаттерны</text><text x="917" y="534" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Дашборды, федерация, длительное хранение</text><text x="917" y="568" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Контракт метрик для чужой автоматизации</text><text x="917" y="602" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Не кодировать device=sda в имени</text><text x="917" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Не агрегировать все метрики и labels</text><text x="917" y="670" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Не чинить source names через rules</text><rect x="54" y="748" width="1635" height="252" rx="16" fill="#fff" stroke="#ccdbe7" stroke-width="2"/><text x="86" y="796" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#15496c" font-weight="bold">5. Именование: уровень:метрика:операции</text><text x="86" y="842" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#203b54">job_device:node_disk_read_bytes:rate5m</text><text x="86" y="884" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Для ratio согласовать окна и уровни: rate5m / rate10m — плохой пример</text><text x="86" y="926" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">mean5m: агрегировать _sum и _count отдельно и делить в конце</text><text x="86" y="963" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Не добавлять :federate или :longterm ради политик</text><rect x="54" y="1041" width="1635" height="426" rx="16" fill="#fff0ed" stroke="#e1aba5" stroke-width="2"/><text x="86" y="1088" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#85403b" font-weight="bold">6. Замечания, безопасность, ограничения</text><text x="86" y="1135" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">p0304: «правильный» YAML имеет лишние закрывающие скобки</text><text x="86" y="1181" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">p0303: rate5m / rate10m — намеренная демонстрация ошибки</text><text x="86" y="1227" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#203b54">p0299: без подзапроса max_over_time(sum(rate(...))[1h]) невалидно</text><text x="86" y="1273" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">p0295: reload не автоматический, lifecycle endpoint требует флаг</text><text x="86" y="1319" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">p0296: screenshot /rules доступен в RAG только как подпись</text><text x="86" y="1365" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">p0301: «90 % неиспользуемых» — опыт автора, не baseline этой TSDB</text><text x="86" y="1412" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">State-changing: files, reload, periodic TSDB recording; rollback не дан</text></svg>