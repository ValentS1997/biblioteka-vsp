<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="835" viewBox="0 0 1380 835" role="img" aria-label="Компактная визуальная карта главы 17 recording rules, конфигурация, группа, кардинальность, ошибки source"><rect x="0" y="0" width="1380" height="835" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="48" y="65" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#18344e" font-weight="bold">Глава 17 · Правила записи</text><text x="48" y="106" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#62768a">PDF 294–305 · 12 RAG-чанков · inventory 0040</text><rect x="47" y="146" width="411" height="222" rx="16" fill="#e7f3ff" stroke="#ccd8e4" stroke-width="2"/><text x="72" y="190" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">Конфигурация</text><text x="72" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">prometheus.yml → rule_files</text><text x="72" y="265" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">rules.yml → groups → record/expr</text><text x="72" y="299" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">promtool check, затем reload</text><text x="72" y="333" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">/rules и метрики длительности</text><rect x="485" y="146" width="411" height="222" rx="16" fill="#e8f7ee" stroke="#ccd8e4" stroke-width="2"/><text x="510" y="190" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">Последовательность</text><text x="510" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">rate(counter[5m]) → sum</text><text x="510" y="265" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Один evaluation timestamp</text><text x="510" y="299" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Зависимые rules в одной группе</text><text x="510" y="333" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Новые samples записаны в TSDB</text><rect x="924" y="146" width="411" height="222" rx="16" fill="#fff3e8" stroke="#ccd8e4" stroke-width="2"/><text x="949" y="190" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#174969" font-weight="bold">Когда применять</text><text x="949" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Дорогие запросы dashboard</text><text x="949" y="265" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Федерация / long-term storage</text><text x="949" y="299" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">API-метрики для других команд</text><text x="949" y="333" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#203b54">Не агрегировать всё подряд</text><rect x="47" y="406" width="1288" height="191" rx="16" fill="#fff" stroke="#ccd8e4" stroke-width="2"/><text x="78" y="454" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#164767" font-weight="bold">Называйте метрики по смыслу вычисления</text><text x="78" y="497" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Уровень:метрика:операции → job_device:node_disk_read_bytes:rate5m</text><text x="78" y="534" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Не переносите device=sda в имя; сохраняйте полезные labels</text><text x="78" y="570" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Агрегируйте суммы и count до вычисления среднего</text><rect x="47" y="632" width="1288" height="159" rx="16" fill="#fff0ed" stroke="#e3ada7" stroke-width="2"/><text x="78" y="678" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#87403a" font-weight="bold">Source findings и операции с риском</text><text x="78" y="718" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#203b54">PDF 304: лишние скобки в mean; PDF 303: намеренно неверный ratio</text><text x="78" y="757" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#203b54">Reload и evaluation меняют состояние. Rollback [Needs confirmation]</text></svg>