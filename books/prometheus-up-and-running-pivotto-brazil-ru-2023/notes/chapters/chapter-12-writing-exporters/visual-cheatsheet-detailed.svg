<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1480" viewBox="0 0 1730 1480" role="img" aria-label="Подробная визуальная карта главы 12: Consul telemetry, Go Collector, Python MetricFamily, единицы измерения, ошибки RAG"><rect x="0" y="0" width="1730" height="1480" rx="16" fill="#f7fafc" stroke="none" stroke-width="2"/><text x="55" y="72" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#16354f" font-weight="bold">Глава 12 · Собственный exporter: от API до /metrics</text><text x="55" y="113" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#657a8b">PDF 215–225 · p0215:c01–p0225:c01 · strict RAG-only</text><rect x="55" y="153" width="780" height="253" rx="16" fill="#e8f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="197" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b6d" font-weight="bold">1. Интерпретировать чужие данные</text><text x="77" y="235" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Consul API :8500/v1/agent/metrics</text><text x="77" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Gauges: Value; Counters: Count и Sum</text><text x="77" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Samples: таймеры в миллисекундах</text><text x="77" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Нормализация имени regexp [^a-zA-Z0-9:_]</text><text x="77" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Не доверять названию типа вслепую</text><rect x="881" y="153" width="794" height="253" rx="16" fill="#e8f8ed" stroke="#cbd5e1" stroke-width="2"/><text x="903" y="197" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b6d" font-weight="bold">2. Контракт Collector в Go</text><text x="903" y="235" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Describe: регистрации известного Desc</text><text x="903" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Collect: опрос API при каждом scrape</text><text x="903" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">NewDesc + MustNewConstMetric</text><text x="903" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">consul_up = 0 или 1 при ошибке/успехе</text><text x="903" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">promhttp.Handler(), :8000</text><rect x="55" y="448" width="780" height="244" rx="16" fill="#fff4e7" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="492" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b6d" font-weight="bold">3. Преобразование метрик</text><text x="77" y="530" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">GaugeValue → g.Value</text><text x="77" y="564" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">CounterValue → c.Count, суффикс _total</text><text x="77" y="598" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Samples → _seconds_count / _seconds_sum</text><text x="77" y="632" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">s.Sum / 1000 — ms в s</text><text x="77" y="666" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Unknown type → UntypedValue</text><rect x="881" y="448" width="794" height="244" rx="16" fill="#f0edff" stroke="#cbd5e1" stroke-width="2"/><text x="903" y="492" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#184b6d" font-weight="bold">4. Python и метки</text><text x="903" y="530" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">GaugeMetricFamily / CounterMetricFamily</text><text x="903" y="564" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">SummaryMetricFamily — отдельное семейство</text><text x="903" y="598" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">labels=[foo,baz], add_metric(children)</text><text x="903" y="632" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Go: Desc с label names и значениями</text><text x="903" y="666" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244058">Одинаковые имена → одинаковая HELP</text><rect x="55" y="735" width="1620" height="251" rx="16" fill="#fff" stroke="#c9d8e3" stroke-width="2"/><text x="85" y="779" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#1c4867" font-weight="bold">5. Эксплуатационная архитектура</text><text x="85" y="824" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244058">Один exporter на экземпляр · синхронное чтение без кеша · несколько scrape</text><text x="85" y="865" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244058">В PromQL: rate, отношения и агрегация; не переносить machine-level метрики</text><text x="85" y="906" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Следить за process_open_fds, go_/process_, myexporter_scrape_duration_seconds</text><text x="85" y="948" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Соблюдать кардинальность, осмысленность labels и выбор единиц seconds/bytes</text><rect x="55" y="1032" width="1620" height="383" rx="16" fill="#fff0ed" stroke="#e2aaa3" stroke-width="2"/><text x="85" y="1076" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#873f3b" font-weight="bold">6. Зарегистрированные расхождения источника</text><text x="85" y="1124" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244058">p0216 Samples.Sum = 0.13156799972057343</text><text x="85" y="1167" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244058">p0218 Go-код делит Sum на 1000, но /metrics печатает 0.13156799972057343</text><text x="85" y="1210" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0223 Python: count_value=c[Count] внутри цикла for s in Samples</text><text x="85" y="1253" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">p0221 Go-пояснение Counter: s.Count; p0218 полный листинг: c.Count</text><text x="85" y="1296" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Не выбирать исправленный вариант без отдельной проверки; не выполнять слепо</text><text x="85" y="1341" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244058">Контекст Consul, Go/Python версий, auth и rollback: [Needs confirmation]</text></svg>