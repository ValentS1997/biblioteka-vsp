<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1460" viewBox="0 0 1700 1460" role="img" aria-label="Подробная карта главы 10 Prometheus: типы exporter, Grok, Blackbox probes, multitarget relabel, ошибки RAG и эксплуатационные риски"><rect x="0" y="0" width="1700" height="1460" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="56" y="67" fill="#1a3651" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="bold">Глава 10 · Экспортеры, внешние пробы и relabel</text><text x="56" y="110" fill="#60778c" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 187–208 · p0187:c01–p0208:c01 · только canonical RAG</text><rect x="55" y="154" width="770" height="242" rx="16" fill="#e6f2ff" stroke="#ccd9e2" stroke-width="2"/><text x="79" y="199" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">1 · Обычные экспортеры</text><text x="79" y="239" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Consul Exporter :9107 → consul_up</text><text x="79" y="273" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">MySQLd Exporter :9104 → mysql_up</text><text x="79" y="307" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">up=1 ≠ приложение работает</text><text x="79" y="341" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Один exporter на экземпляр: обычная схема</text><rect x="872" y="154" width="772" height="242" rx="16" fill="#e6f7ee" stroke="#ccd9e2" stroke-width="2"/><text x="896" y="199" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">2 · Grok Exporter :9144</text><text x="896" y="239" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">example.log → grok.yml regex</text><text x="896" y="273" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">log_http_requests_total с path</text><text x="896" y="307" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Histogram задержек, _bucket/_count/_sum</text><text x="896" y="341" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">readall=false рекомендован для production</text><rect x="55" y="438" width="770" height="258" rx="16" fill="#fff2e5" stroke="#ccd9e2" stroke-width="2"/><text x="79" y="483" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">3 · Blackbox: независимые пробы</text><text x="79" y="523" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">/metrics — сам exporter</text><text x="79" y="557" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">/probe — ICMP / TCP / HTTP / DNS</text><text x="79" y="591" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">probe_success — успех цели, не scrape</text><text x="79" y="625" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">probe_http_status_code, duration, DNS, TLS</text><text x="79" y="659" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Сетевая нагрузка при каждом GET /probe</text><rect x="872" y="438" width="772" height="258" rx="16" fill="#f0efff" stroke="#ccd9e2" stroke-width="2"/><text x="896" y="483" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">4 · Диагностика проб</text><text x="896" y="523" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">ICMP: debug, IP, CAP_NET_RAW</text><text x="896" y="557" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">TCP: порт и SSH-banner regexp</text><text x="896" y="591" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">HTTP: код, redirect, SSL, content</text><text x="896" y="625" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">DNS: транспорт, имя, тип MX записи</text><text x="896" y="659" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Timeout зависит от scrape_timeout</text><rect x="55" y="734" width="1589" height="268" rx="16" fill="#fff" stroke="#cbd7e1" stroke-width="2"/><text x="84" y="780" fill="#1c4565" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold">5 · Multitarget: конфигурация Prometheus и Blackbox</text><text x="84" y="826" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="20">Список исходных URL / Consul → relabel_configs</text><text x="84" y="867" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="20">__address__ исходной цели → __param_target → instance</text><text x="84" y="908" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="20">Заменить __address__ на 127.0.0.1:9115 и послать scrape на /probe</text><text x="84" y="950" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">Цель проверяет Blackbox; exporter сообщает up, результат — probe_success</text><rect x="55" y="1044" width="1589" height="357" rx="16" fill="#fff0ed" stroke="#e1aba4" stroke-width="2"/><text x="84" y="1090" fill="#89423d" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">6 · Ограничения, безопасность, внутренние несоответствия</text><text x="84" y="1136" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">p0188 Consul URL v0.3.0, файл v0.8.0; p0193 Grok sum 0.57 при логе 9.03</text><text x="84" y="1180" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">p0196 probe_ip_protocol=6 назван IPv4; p0197 — IPv6</text><text x="84" y="1224" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">p0198–199 selected_ip_protocol vs preferred_ip_protocol</text><text x="84" y="1268" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">p0202–203 Prometheus в тексте vs oreillymedia regexp</text><text x="84" y="1312" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">p0205–206 в примере 10.10 два разных списка сайтов</text><text x="84" y="1356" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="18">Пароли MySQL, root/ICMP, наружные цели и rollback: [Needs confirmation]</text></svg>