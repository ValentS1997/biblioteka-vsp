<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="825" viewBox="0 0 1350 825" role="img" aria-label="Компактная визуальная карта главы 10: Consul, MySQLd, Grok, Blackbox, multitarget, ошибки источника"><rect x="0" y="0" width="1350" height="825" rx="16" fill="#f7fafc" stroke="none" stroke-width="2"/><text x="46" y="65" fill="#1b334b" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="bold">Глава 10 · Популярные экспортеры</text><text x="46" y="105" fill="#637689" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 187–208 · RAG-only · inventory 0040</text><rect x="45" y="147" width="396" height="212" rx="16" fill="#e7f3ff" stroke="#ccd9e2" stroke-width="2"/><text x="69" y="192" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Consul / MySQLd</text><text x="69" y="232" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">consul_up / mysql_up</text><text x="69" y="266" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Экспортер рядом с сервисом</text><text x="69" y="300" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Независимо проверять up</text><rect x="477" y="147" width="396" height="212" rx="16" fill="#e7f8ec" stroke="#ccd9e2" stroke-width="2"/><text x="501" y="192" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Grok Exporter</text><text x="501" y="232" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Log → Regex → Counter/Histogram</text><text x="501" y="266" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">readall: true лишь для теста</text><text x="501" y="300" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Расхождение чисел в примере</text><rect x="909" y="147" width="396" height="212" rx="16" fill="#fff2e6" stroke="#ccd9e2" stroke-width="2"/><text x="933" y="192" fill="#1b4b6d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Blackbox</text><text x="933" y="232" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">ICMP · TCP · HTTP · DNS</text><text x="933" y="266" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">/probe?module=...</text><text x="933" y="300" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">probe_success = 0 / 1</text><rect x="45" y="397" width="1260" height="196" rx="16" fill="#fff" stroke="#ccd9e2" stroke-width="2"/><text x="75" y="438" fill="#1d4364" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">Отдельная цель при multitarget</text><text x="75" y="484" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">Исходный URL → __param_target и instance</text><text x="75" y="523" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">__address__ = 127.0.0.1:9115 → Blackbox Exporter → probe</text><text x="75" y="559" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="19">up показывает exporter, probe_success — результат теста</text><rect x="45" y="634" width="1260" height="142" rx="16" fill="#fff0ed" stroke="#e0aea6" stroke-width="2"/><text x="77" y="673" fill="#8a403d" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Проблемы исходника</text><text x="77" y="711" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="18">Версии Consul; Grok histogram; IPv4/IPv6; HTTP regex; разные URL</text><text x="77" y="742" fill="#29405a" font-family="DejaVu Sans,sans-serif" font-size="17">Исторические бинарники, SQL secrets и sudo — не production-инструкция</text></svg>