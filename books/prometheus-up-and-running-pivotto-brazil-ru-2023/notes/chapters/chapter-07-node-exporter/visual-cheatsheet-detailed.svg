<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1370" viewBox="0 0 1660 1370" role="img" aria-label="Глава 7 подробная SVG-схема Node Exporter: CPU, FS, I/O, сеть, память, hwmon, PSI, textfile и безопасность"><rect x="0" y="0" width="1660" height="1370" rx="16" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="55" y="70" font-size="34" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#17364f">Глава 7 · От ядра Linux к метрикам Prometheus</text><text x="55" y="110" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#61788b">RAG p0131:c01–p0143:c01 · PDF 131–143 · источник без внешних дополнений</text><rect x="55" y="150" width="752" height="235" rx="16" fill="#e7f2ff" stroke="#d0d9e3" stroke-width="2"/><text x="75" y="192" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">1. CPU, файловые системы</text><text x="75" y="231" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">node_cpu_seconds_total{cpu,mode}</text><text x="75" y="264" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">avg without(cpu,mode)(rate(...idle...[1m]))</text><text x="75" y="297" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">node_filesystem_avail_bytes / size_bytes</text><text x="75" y="330" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">df -i: inode, а не дисковые байты</text><rect x="856" y="150" width="749" height="235" rx="16" fill="#e7f8ed" stroke="#d0d9e3" stroke-width="2"/><text x="876" y="192" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">2. Диск, сеть, память</text><text x="876" y="231" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">rate(node_disk_io_time_seconds_total[1m])</text><text x="876" y="264" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">Длительность чтения / reads_completed</text><text x="876" y="297" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">rate(node_network_receive_bytes_total[1m])</text><text x="876" y="330" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">MemFree не равен MemAvailable</text><rect x="55" y="428" width="752" height="233" rx="16" fill="#fff4e7" stroke="#d0d9e3" stroke-width="2"/><text x="75" y="470" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">3. Hardware и система</text><text x="75" y="509" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">node_hwmon_temp_celsius, sensor_label</text><text x="75" y="542" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">group_left(label): имя сенсора</text><text x="75" y="575" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">time() - node_boot_time_seconds</text><text x="75" y="608" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">node_uname_info, node_os_info, node_load*</text><rect x="856" y="428" width="749" height="233" rx="16" fill="#f0edff" stroke="#d0d9e3" stroke-width="2"/><text x="876" y="470" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">4. Давление ресурсов PSI</text><text x="876" y="509" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">CPU: waiting; память и I/O: waiting/stalled</text><text x="876" y="542" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">node_pressure_memory_waiting_seconds_total</text><text x="876" y="575" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">rate(...[1m]) по счётчику времени</text><text x="876" y="608" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">Поддержка зависит от ядра; psi=1</text><rect x="55" y="707" width="1550" height="252" rx="16" fill="#fff" stroke="#c6d6e1" stroke-width="2"/><text x="84" y="750" font-size="26" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#1b4665">5. Textfile collector: дополнительные machine-level метрики</text><text x="84" y="793" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Cron или отдельное задание читает нужные данные → формирует text format Prometheus</text><text x="84" y="832" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Записывает временный файл в том же каталоге → атомарно переименовывает в *.prom</text><text x="84" y="870" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Node Exporter читает *.prom, экспортирует метрики и node_textfile_mtime_seconds</text><text x="84" y="908" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Файл без собственных timestamps; одинаковые HELP для одинаковых метрик</text><rect x="55" y="1001" width="1550" height="317" rx="16" fill="#fff0ed" stroke="#e2aaa5" stroke-width="2"/><text x="84" y="1046" font-size="27" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#843e39">6. Безопасность и source findings</text><text x="84" y="1087" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Node Exporter без root; в Docker нужен правильный доступ к host /proc и /sys</text><text x="84" y="1127" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Cron из книги читает /etc/shadow как root: пример только для разбора</text><text x="84" y="1167" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">PDF 134: avail/size описан рядом с «используемым» пространством — конфликт</text><text x="84" y="1207" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">PDF 136: MemAvailable без _bytes в прозе — требуется подтверждение</text><text x="84" y="1247" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#263f57">Rollback/актуальные параметры ОС и флагов не подтверждены RAG</text></svg>