<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="770" viewBox="0 0 1330 770" role="img" aria-label="Глава 7 компактная SVG-карта Node Exporter, сборщики, машинные метрики, textfile collector, риски"><rect x="0" y="0" width="1330" height="770" rx="16" fill="#f7fafc" stroke="none" stroke-width="2"/><text x="46" y="65" font-size="35" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#18344d">Глава 7 · Node Exporter</text><text x="46" y="103" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#596f82">PDF 131–143 · книга 0040 · RAG-only · примеры Node Exporter 1.4.0</text><rect x="45" y="141" width="389" height="205" rx="16" fill="#e7f1ff" stroke="#d0d9e3" stroke-width="2"/><text x="65" y="183" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">CPU · диск · сеть</text><text x="65" y="222" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">cpu_seconds_total по mode/cpu</text><text x="65" y="255" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">disk_*: I/O, время, байты</text><text x="65" y="288" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">network_*: трафик, пакеты</text><rect x="470" y="141" width="389" height="205" rx="16" fill="#e7f7ee" stroke="#d0d9e3" stroke-width="2"/><text x="490" y="183" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#214d72">FS · память · PSI</text><text x="490" y="222" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">filesystem_avail/size</text><text x="490" y="255" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">memory_MemFree / Cached</text><text x="490" y="288" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#263f57">pressure_*: waiting, stalled</text><rect x="894" y="141" width="389" height="205" rx="16" fill="#fff2e6" stroke="#d0d9e3" stroke-width="2"/><text x="914" y="183" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold" 