<text x="68" y="258" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#20374d">scrape: 10s · TSDB</text>
<text x="68" y="290" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#20374d">Targets · /metrics</text>
<text x="68" y="322" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#475d71">Самосбор и приём выборок</text>
<rect x="428" y="140" width="342" height="210" rx="18" fill="#e7f7f2" stroke="#8bc6ae" stroke-width="2"/>
<text x="451" y="183" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#226748">Node Exporter · :9100</text>
<text x="451" y="226" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#20374d">CPU · RAM · ФС · диск · сеть</text>
<text x="451" y="258" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#20374d">HTTP /metrics</text>
