<text x="834" y="322" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#475d71">Маршрутизация уведомлений</text>
<rect x="45" y="390" width="1108" height="172" rx="16" fill="#ffffff" stroke="#d4dde7" stroke-width="2"/>
<text x="70" y="433" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#172b4d">Проверить метрики и условие тревоги</text>
<text x="70" y="475" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#205e8b">up  ·  up == 0  ·  rate(counter[1m])</text>
<text x="70" y="514" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#20374d">UP = 1, DOWN = 0 · правило InstanceDown: for: 1m · evaluation: 10s</text>
