<text x="46" y="99" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#566579">Книга: PDF 34–52 · локальный учебный стенд · RAG-only</text>
<rect x="45" y="140" width="342" height="210" rx="18" fill="#e7f3ff" stroke="#8bb7e0" stroke-width="2"/>
