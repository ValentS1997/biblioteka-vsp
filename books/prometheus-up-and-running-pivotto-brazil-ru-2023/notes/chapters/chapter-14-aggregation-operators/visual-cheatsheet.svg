<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="805" viewBox="0 0 1350 805" role="img" aria-label="Компактный конспект главы 14 об агрегировании, by/without, 12 операторах и проблемах исходника"><rect x="0" y="0" width="1350" height="805" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="44" y="65" font-size="34" font-family="DejaVu Sans,sans-serif" fill="#17354d" font-weight="bold">Глава 14 · Операторы агрегирования</text><text x="44" y="105" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#587084">PDF 246–257 · 12 RAG-чанков · книга 0040 · RAG-only</text><rect x="44" y="146" width="397" height="210" rx="16" fill="#e6f1ff" stroke="#cdd8e3" stroke-width="2"/><text x="66" y="190" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">Метки и группы</text><text x="66" y="230" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">without: убрать названные</text><text x="66" y="261" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">by: оставить названные</text><text x="66" y="292" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">job / instance / env важны</text><text x="66" y="323" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Пустой ввод → пустой vector</text><rect x="475" y="146" width="397" height="210" rx="16" fill="#e7f7ed" stroke="#cdd8e3" stroke-width="2"/><text x="497" y="190" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">Объединить значения</text><text x="497" y="230" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">sum, avg, count, group</text><text x="497" y="261" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">min, max, stddev, stdvar</text><text x="497" y="292" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Counter: rate → sum</text><text x="497" y="323" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">NaN требует интерпретации</text><rect x="907" y="146" width="398" height="210" rx="16" fill="#fff2e7" stroke="#cdd8e3" stroke-width="2"/><text x="929" y="190" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">Найти отличия</text><text x="929" y="230" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">topk / bottomk: исходные labels</text><text x="929" y="261" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">quantile: мгновенная группа</text><text x="929" y="292" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">count_values: частоты значений</text><text x="929" y="323" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">История topk меняет состав</text><rect x="44" y="394" width="1261" height="200" rx="16" fill="#fff" stroke="#cdd8e3" stroke-width="2"/><text x="72" y="438" font-size="25" font-family="DejaVu Sans,sans-serif" fill="#184264" font-weight="bold">Базовая логика агрегирования</text><text x="72" y="484" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#234158">Ряды и labels → группы by/without → оператор → instant vector</text><text x="72" y="522" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#234158">sum without()(metric): по ряду без имени · sum(metric): одна группа</text><text x="72" y="556" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">Для счётчиков: rate(node_disk_read_bytes_total[5m]) → sum</text><rect x="44" y="633" width="1261" height="129" rx="16" fill="#fff0ed" stroke="#dfa8a2" stroke-width="2"/><text x="75" y="675" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#8a3e38" font-weight="bold">Зафиксированные проблемы RAG</text><text x="75" y="711" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#234158">PDF 246: 12 операторов, PDF 249: 11 · quantile 0.9: «90 % не менее»</text><text x="75" y="743" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#234158">PDF 252: 1/0 = NaN в сноске — не 