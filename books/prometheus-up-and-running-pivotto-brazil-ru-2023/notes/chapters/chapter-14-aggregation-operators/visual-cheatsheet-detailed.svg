<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1520" viewBox="0 0 1750 1520" role="img" aria-label="Подробная визуальная карта главы 14, группировка, 12 операторов, примеры, квантиль и несогласованности RAG"><rect x="0" y="0" width="1750" height="1520" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="53" y="66" font-size="33" font-family="DejaVu Sans,sans-serif" fill="#15354f" font-weight="bold">Глава 14 · Группировка и операторы PromQL</text><text x="53" y="108" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#5f7689">PDF 246–257 · RAG p0246:c01–p0257:c01 · без внешних дополнений</text><rect x="53" y="149" width="797" height="257" rx="16" fill="#e7f2ff" stroke="#cdd8e3" stroke-width="2"/><text x="75" y="193" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">1. Группировка</text><text x="75" y="233" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">without(fstype,mountpoint): убрать указанные</text><text x="75" y="264" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Сохраняются device, job, instance, env</text><text x="75" y="295" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">by(job,instance,device): оставить только их</text><text x="75" y="326" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Нельзя совмещать by и without</text><text x="75" y="357" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Пустая группа / пустой instant vector</text><rect x="897" y="149" width="800" height="257" rx="16" fill="#e7f8ed" stroke="#cdd8e3" stroke-width="2"/><text x="919" y="193" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">2. Суммы и количество</text><text x="919" y="233" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">sum: сложить значения группы</text><text x="919" y="264" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">count: число рядов, не их значения</text><text x="919" y="295" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">group: 1 на группу независимо от значений</text><text x="919" y="326" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Counter: сначала rate(...[5m]), затем sum</text><text x="919" y="357" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Вложенный count для числа CPU</text><rect x="53" y="449" width="797" height="253" rx="16" fill="#f0edff" stroke="#cdd8e3" stroke-width="2"/><text x="75" y="493" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">3. Статистика и границы</text><text x="75" y="533" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">avg: арифметическое среднее</text><text x="75" y="564" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">stddev: отклонение генеральной совокупности</text><text x="75" y="595" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">stdvar: дисперсия</text><text x="75" y="626" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">min/max: экстремумы с метками группы</text><text x="75" y="657" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Выбросы: среднее + 2 * stddev</text><rect x="897" y="449" width="800" height="253" rx="16" fill="#fff4e5" stroke="#cdd8e3" stroke-width="2"/><text x="919" y="493" font-size="22" font-family="DejaVu Sans,sans-serif" fill="#1b4a68" font-weight="bold">4. Исходные ряды и распределение</text><text x="919" y="533" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">topk/bottomk(k): до k исходных рядов</text><text x="919" y="564" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Все исходные labels, включая __name__</text><text x="919" y="595" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">quantile(0.9): значения instant vector</text><text x="919" y="626" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">count_values: частоты дискретных значений</text><text x="919" y="657" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#234158">Различать quantile_over_time, histogram_quantile</text><rect x="53" y="744" width="1644" height="255" rx="16" fill="#fff" stroke="#cad8e3" stroke-width="2"/><text x="84" y="789" font-size="27" font-family="DejaVu Sans,sans-serif" fill="#184767" font-weight="bold">5. Порядок операций и полезные шаблоны</text><text x="84" y="838" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">sum without(device)(rate(node_disk_read_bytes_total[5m]))</text><text x="84" y="879" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">count without(cpu)(count without(mode)(node_cpu_seconds_total))</text><text x="84" y="920" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">count_values without(instance)(&quot;version&quot;, software_version)</text><text x="84" y="958" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#234158">query_range + topk: разные ряды на разных шагах, контролировать размер ответа</text><rect x="53" y="1041" width="1644" height="404" rx="16" fill="#fff0ed" stroke="#e0ada6" stroke-width="2"/><text x="84" y="1092" font-size="26" font-family="DejaVu Sans,sans-serif" fill="#863d38" font-weight="bold">6. Source findings, риски и ограничения</text><text x="84" y="1141" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#234158">p0246: «12» · p0249: «11» операторов</text><text x="84" y="1190" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">p0255: «90 % процессоров не менее 0.02» при quantile(0.9)</text><text x="84" y="1239" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">p0252: сноска «1/0 = NaN» требует проверки семантики</text><text x="84" y="1288" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#234158">sort_desc(count by(__name__)({__name__=~&quot;.+&quot;})) затрагивает все ряды</text><text x="84" y="1337" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">Значения учебного стенда не равны значениям production TSDB</text><text x="84" y="1386" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#234158">Read-only PromQL, но workload-generating; rollback [Not applicable]</text></svg>