<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1550" viewBox="0 0 1740 1550" role="img" aria-label="Подробная визуальная карта главы 15 PromQL о сопоставлении, bool, группировке, логике и проблемах исходника"><rect x="0" y="0" width="1740" height="1550" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="55" y="70" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#17354d" font-weight="bold">Глава 15 · Binary operators и vector matching</text><text x="55" y="111" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#637a8d">PDF 258–272 · p0258:c01–p0272:c01 · canonical RAG-only</text><rect x="55" y="151" width="791" height="260" rx="16" fill="#e7f3ff" stroke="#cdd7e0" stroke-width="2"/><text x="79" y="195" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1e4b6c" font-weight="bold">1. Типы и значения</text><text x="79" y="237" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Scalar: 0 · Instant vector: {} 0</text><text x="79" y="272" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">+ - * / % ^, atan2</text><text x="79" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Arithmetic удаляет __name__</text><text x="79" y="342" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Comparisons: == != &gt; &lt; &gt;= &lt;=</text><text x="79" y="377" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">bool: возвращает 1/0 для сопоставленных рядов</text><rect x="888" y="151" width="797" height="260" rx="16" fill="#e8f8ef" stroke="#cdd7e0" stroke-width="2"/><text x="912" y="195" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1e4b6c" font-weight="bold">2. Один к одному</text><text x="912" y="237" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">process_open_fds / process_max_fds</text><text x="912" y="272" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Matching всех labels, кроме __name__</text><text x="912" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">ignoring(mode): пропустить label</text><text x="912" y="342" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">on(instance,job): выбрать key</text><text x="912" y="377" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Нет пары → нет результата</text><rect x="55" y="457" width="791" height="253" rx="16" fill="#fff3e6" stroke="#cdd7e0" stroke-width="2"/><text x="79" y="501" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1e4b6c" font-weight="bold">3. Многие к одному</text><text x="79" y="543" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">LHS mode=idle/system/user/…</text><text x="79" y="578" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">RHS только instance/job</text><text x="79" y="613" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Без group_left: ошибка multiple matches</text><text x="79" y="648" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">group_left сохраняет LHS labels</text><text x="79" y="683" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">group_left(version): перенести метку RHS</text><rect x="888" y="457" width="797" height="253" rx="16" fill="#eeeefe" stroke="#cdd7e0" stroke-width="2"/><text x="912" y="501" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1e4b6c" font-weight="bold">4. Множества и sparse series</text><text x="912" y="543" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">or: приоритет левой группы</text><text x="912" y="578" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">unless: оставить левую без пары справа</text><text x="912" y="613" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">and: оставить левую при паре справа</text><text x="912" y="648" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">node_hwmon_sensor_label только temp2/temp3</text><text x="912" y="683" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">or + 0*temp+1 сохраняет temp1</text><rect x="55" y="752" width="1630" height="243" rx="16" fill="#fff" stroke="#c9d8e3" stroke-width="2"/><text x="85" y="793" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#184666" font-weight="bold">5. Практические проверки</text><text x="85" y="837" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#24405a">sum without(instance)(process_open_fds &gt; bool 10) → видны группы с 0</text><text x="85" y="880" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#24405a">up * on(instance) group_left(version) prometheus_build_info</text><text x="85" y="922" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#24405a">up{job=&quot;node&quot;} == 1 unless on(job,instance) node_custom_metric</text><text x="85" y="961" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">hour() &gt;= 9 &lt; 17 — часы UTC; and on() ограничивает набор результатов</text><rect x="55" y="1040" width="1630" height="447" rx="16" fill="#fff0ec" stroke="#e0aaa3" stroke-width="2"/><text x="86" y="1085" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#833e3b" font-weight="bold">6. Риски и расхождения RAG</text><text x="86" y="1130" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">p0270: фраза «иначе RHS» для unless конфликтует с разностью множеств</text><text x="86" y="1173" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">p0263: job=&quot; node&quot; в пояснении, хотя данные содержат job=&quot;node&quot;</text><text x="86" y="1217" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">p0267: on(instance) не всегда уникален; может потребоваться job</text><text x="86" y="1261" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">p0269: x*0+1 сохраняет NaN; up*0 не означает успешный scrape</text><text x="86" y="1305" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">p0271: seconds vs microseconds — разные примеры latency, не совмещать</text><text x="86" y="1350" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">Порядок: ^ → * / % atan2 → + - → сравнения → unless/and → or</text><text x="86" y="1395" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">^ — правоассоциативен; все остальные — левоассоциативны</text><text x="86" y="1445" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">Read-only PromQL; правила деплоя и rollback отсутствуют [Needs confirmation]</text></svg>