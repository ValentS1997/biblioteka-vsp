(version): перенести label</text><rect x="916" y="149" width="398" height="208" rx="16" fill="#fff3e6" stroke="#cdd7e0" stroke-width="2"/><text x="940" y="193" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1e4b6c" font-weight="bold">Логические множества</text><text x="940" y="235" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">or: левый, иначе правый</text><text x="940" y="270" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">unless: разность</text><text x="940" y="305" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">and: пересечение</text><text x="940" y="340" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#24405a">NaN и up требуют внимания</text><rect x="45" y="395" width="1269" height="193" rx="16" fill="#fff" stroke="#cdd7e0" stroke-width="2"/><text x="76" y="438" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#1a4568" font-weight="bold">Сначала проверить метки и кратность</text><text x="76" y="481" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#24405a">Две vector-series без matching key не создают результат</text><text x="76" y="523" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">group_left: RHS уникален по ключу · info labels из RHS по запросу</text><text x="76" y="561" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">У отсутствующей метрики и у метрики со значением 0 разная семантика</text><rect x="45" y="630" width="1269" height="144" rx="16" fill="#fff0ed" stroke="#e2aba3" stroke-width="2"/><text x="76" y="672" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#853e3a" font-weight="bold">Source findings</text><text x="76" y="713" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24405a">PDF 270: в прозе unless ошибочно упомянут возврат RHS</text><text x="76" y="748" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#24405a">PDF 263: job=&quot; node&quot;; up*0 может скрыть неуспешный scrape</t