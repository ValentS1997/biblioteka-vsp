<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="870" viewBox="0 0 1390 870" role="img" aria-label="Компактный конспект главы 13 PromQL: агрегация, выбор временных рядов, время и HTTP API, противоречия исходника"><rect x="0" y="0" width="1390" height="870" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="44" y="66" font-size="35" fill="#17334c" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 13 · Введение в PromQL</text><text x="44" y="105" font-size="18" fill="#617589" font-family="DejaVu Sans,sans-serif">PDF 227–245 · 19 чанков · RAG-only · книга 0040</text><rect x="44" y="150" width="408" height="222" rx="16" fill="#e8f3ff" stroke="#ccd8e2" stroke-width="2"/><text x="66" y="193" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">Агрегация</text><text x="66" y="228" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Gauge: sum / max / avg</text><text x="66" y="262" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Counter: rate → sum</text><text x="66" y="296" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Summary: sum(_sum) / sum(_count)</text><text x="66" y="330" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Histogram: buckets → quantile</text><rect x="492" y="150" width="408" height="222" rx="16" fill="#e7f8ee" stroke="#ccd8e2" stroke-width="2"/><text x="514" y="193" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">Селекторы</text><text x="514" y="228" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">=  !=  =~  !~  (RE2)</text><text x="514" y="262" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Instant → один актуальный sample</text><text x="514" y="296" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Range [1m] → набор samples</text><text x="514" y="330" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Staleness / lookback</text><rect x="940" y="150" width="406" height="222" rx="16" fill="#fff1e6" stroke="#ccd8e2" stroke-width="2"/><text x="962" y="193" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">Время</text><text x="962" y="228" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">[30m:1m] — подзапрос</text><text x="962" y="262" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">offset 1h — смещение</text><text x="962" y="296" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">@ timestamp / @ end()</text><text x="962" y="330" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">query_range: start/end/step</text><rect x="44" y="415" width="1302" height="194" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="74" y="460" font-size="26" fill="#194968" font-family="DejaVu Sans,sans-serif" font-weight="bold">HTTP API: один запрос или серия шагов</text><text x="74" y="506" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">/api/v1/query → vector, matrix, scalar</text><text x="74" y="547" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">/api/v1/query_range → matrix; range для rate длиннее step</text><text x="74" y="585" font-size="18" fill="#274059" font-family="DejaVu Sans,sans-serif">Результаты — оценки, не идеально синхронные измерения</text><rect x="44" y="654" width="1302" height="172" rx="16" fill="#fff0ed" stroke="#e0aaa3" stroke-width="2"/><text x="74" y="696" font-size="24" fill="#813d39" font-family="DejaVu Sans,sans-serif" font-weight="bold">Замечания к исходным примерам</text><text x="74" y="735" font-size="18" fill="#274059" font-family="DejaVu Sans,sans-serif">size_bytes vs free_bytes; histogram с / без _seconds; name vs __name__</text><text x="74" y="771" font-size="18" fill="#274059" font-family="DejaVu Sans,sans-serif">API URL vs JSON metric; JSON trailing comma; @: начало или конец окна</text><text x="74" y="802" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Не исправлять исходный RAG и не выполнять дорогие запросы без проверки</text></svg>