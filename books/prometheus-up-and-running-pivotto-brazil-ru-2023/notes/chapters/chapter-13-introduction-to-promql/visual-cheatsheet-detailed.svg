<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600" role="img" aria-label="Подробная визуальная карта главы 13, метрики, selectors, offset, subqueries и API, source-findings"><rect x="0" y="0" width="1740" height="1600" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="58" y="69" font-size="35" fill="#17334d" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 13 · Временные ряды и PromQL</text><text x="58" y="111" font-size="19" fill="#5c7488" font-family="DejaVu Sans,sans-serif">PDF 227–245 · p0227:c01–p0245:c01 · только RAG, без внешних исправлений</text><rect x="58" y="149" width="781" height="251" rx="16" fill="#e8f3ff" stroke="#ccd8e2" stroke-width="2"/><text x="80" y="192" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">1. Gauge / Counter</text><text x="80" y="227" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">sum without(device, fstype, mountpoint)(...)</text><text x="80" y="261" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">avg without(instance,job)(process_open_fds)</text><text x="80" y="295" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">rate(node_network_receive_bytes_total[5m])</text><text x="80" y="329" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">sum without(device)(rate(...))</text><text x="80" y="363" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Метки после without определяют группы</text><rect x="891" y="149" width="791" height="251" rx="16" fill="#e7f7ee" stroke="#ccd8e2" stroke-width="2"/><text x="913" y="192" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">2. Summary / Histogram</text><text x="913" y="227" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Среднее: sum(rate(_sum)) / sum(rate(_count))</text><text x="913" y="261" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Не усреднять средние и quantile Summary</text><text x="913" y="295" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Histogram: rate(_bucket) по le</text><text x="913" y="329" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Сначала агрегация bucket, затем histogram_quantile</text><text x="913" y="363" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Дорогие range / мало событий = слабая статистика</text><rect x="58" y="444" width="781" height="257" rx="16" fill="#fff1e6" stroke="#ccd8e2" stroke-width="2"/><text x="80" y="487" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">3. Метки, selectors и типы</text><text x="80" y="522" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Matchers: =, !=, =~, !~; RE2 anchored</text><text x="80" y="556" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Несколько matchers объединяются по AND</text><text x="80" y="590" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Instant vector: одна точка на series</text><text x="80" y="624" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Range vector: много точек с timestamp</text><text x="80" y="658" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">Staleness исключает устаревшие instant series</text><rect x="891" y="444" width="791" height="257" rx="16" fill="#eeeefe" stroke="#ccd8e2" stroke-width="2"/><text x="913" y="487" font-size="22" fill="#1d4968" font-family="DejaVu Sans,sans-serif" font-weight="bold">4. Временная ось</text><text x="913" y="522" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">[1m] — образцы за окно до оценки</text><text x="913" y="556" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">[30m:1m] — subquery с шагом</text><text x="913" y="590" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">offset 1h — сдвинуть отдельный selector</text><text x="913" y="624" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">@ UNIX и @ end() — фиксировать время</text><text x="913" y="658" font-size="17" fill="#274059" font-family="DejaVu Sans,sans-serif">ms / s / m / h / d / w / y из книги</text><rect x="58" y="747" width="1624" height="277" rx="16" fill="#fff" stroke="#cbd8e3" stroke-width="2"/><text x="88" y="792" font-size="27" fill="#204563" font-family="DejaVu Sans,sans-serif" font-weight="bold">5. HTTP API — как читать результат</text><text x="88" y="837" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">/api/v1/query: один instant evaluation, параметр time</text><text x="88" y="876" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">resultType = vector | matrix | scalar; metric labels и value(s) в JSON</text><text x="88" y="915" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">/api/v1/query_range: start, end, step → серия вычислений, результат matrix</text><text x="88" y="953" font-size="20" fill="#274059" font-family="DejaVu Sans,sans-serif">end включительно при совпадении с шагом; range для rate больше step</text><text x="88" y="992" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">11 000 шагов — ограничение указанной в книге версии Prometheus</text><rect x="58" y="1070" width="1624" height="467" rx="16" fill="#fff0ed" stroke="#e3aaa3" stroke-width="2"/><text x="88" y="1120" font-size="26" fill="#843e39" font-family="DejaVu Sans,sans-serif" font-weight="bold">6. Регистр source findings — не использовать как golden fixtures</text><text x="88" y="1165" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0228: запрос size_bytes, ряды free_bytes (их сумма 32511390720)</text><text x="88" y="1210" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0232–233: histogram _seconds_bucket vs _bucket, _sum, _count</text><text x="88" y="1255" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0235: поле __name__ в пояснении, но {name=...} в «эквиваленте»</text><text x="88" y="1300" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0240: @ и «начало» диапазона, p0236: lookback до оценки</text><text x="88" y="1345" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0242: URL head_samples_appended_total, JSON process_resident_memory_bytes</text><text x="88" y="1390" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">p0244: завершающая запятая делает пример JSON невалидным</text><text x="88" y="1437" font-size="19" fill="#274059" font-family="DejaVu Sans,sans-serif">Экран 13.1 недоступен как объект RAG; SVG строится только по тексту</text><text x="88" y="1490" font-size="18" fill="#274059" font-family="DejaVu Sans,sans-serif">Нет изменения TSDB; стоимость тяжёлых PromQL запросов нужно проверять</text></svg>