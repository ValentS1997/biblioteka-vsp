<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1510" viewBox="0 0 1730 1510" role="img" aria-label="Подробная визуальная карта главы 16 PromQL функции, типы, Counter, Gauge, отсутствие данных, временные агрегаты и source findings"><rect x="0" y="0" width="1730" height="1510" rx="14" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="54" y="69" fill="#15354d" font-size="35" font-family="DejaVu Sans,sans-serif" font-weight="bold">Глава 16 · Семейства функций PromQL</text><text x="54" y="110" fill="#657a8b" font-size="19" font-family="DejaVu Sans,sans-serif">PDF 273–293 · p0273:c01–p0293:c01 · strict RAG-only</text><rect x="54" y="152" width="792" height="241" rx="14" fill="#e6f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="195" fill="#174b6d" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">1. Типы и математика</text><text x="76" y="235" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">vector(1) создаёт instant vector</text><text x="76" y="269" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">scalar(v) требует ровно 1 sample</text><text x="76" y="303" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">abs, ln, log2/log10, sqrt, exp</text><text x="76" y="337" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">ceil/floor/round, clamp_min/max, sgn</text><text x="76" y="371" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">trig, deg, rad, pi; исторический набор</text><rect x="890" y="152" width="786" height="241" rx="14" fill="#eeeefe" stroke="#cbd5e1" stroke-width="2"/><text x="912" y="195" fill="#174b6d" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">2. Время, labels, absence</text><text x="912" y="235" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">time() — секунды Unix оценки</text><text x="912" y="269" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">timestamp(up) — время sample</text><text x="912" y="303" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">hour/day/month/year — UTC</text><text x="912" y="337" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">label_replace/label_join — labels</text><text x="912" y="371" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">absent / absent_over_time — нет рядов</text><rect x="54" y="431" width="792" height="258" rx="14" fill="#e6f8ee" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="474" fill="#174b6d" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">3. Counter: rate и resets</text><text x="76" y="514" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">rate: скорость в секунду, сбросы</text><text x="76" y="548" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">Окно ≥ 4 scrape intervals</text><text x="76" y="582" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">increase: rate × длительность</text><text x="76" y="616" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">irate: последние два sample, не алерты</text><text x="76" y="650" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">resets: подсчёт падений Counter</text><rect x="890" y="431" width="786" height="258" rx="14" fill="#fff3e5" stroke="#cbd5e1" stroke-width="2"/><text x="912" y="474" fill="#174b6d" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">4. Gauge: изменения и прогноз</text><text x="912" y="514" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">changes: число изменений</text><text x="912" y="548" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">deriv: наклон регрессии</text><text x="912" y="582" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">predict_linear: тренд в будущее</text><text x="912" y="616" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">delta/idelta: разность без resets</text><text x="912" y="650" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">holt_winters: сглаживание</text><rect x="54" y="730" width="1622" height="251" rx="14" fill="#fff" stroke="#c7d7e2" stroke-width="2"/><text x="86" y="778" fill="#174864" font-size="27" font-family="DejaVu Sans,sans-serif" font-weight="bold">5. Агрегирование по времени и Histogram</text><text x="86" y="824" fill="#234158" font-size="20" font-family="DejaVu Sans,sans-serif">*_over_time: sum, count, avg, min, max, stddev, stdvar, quantile</text><text x="86" y="868" fill="#234158" font-size="20" font-family="DejaVu Sans,sans-serif">present_over_time и last_over_time; значения образцов без временных весов</text><text x="86" y="912" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">histogram_quantile: кумулятивные +Inf buckets, rate для Counter-buckets</text><text x="86" y="953" fill="#234158" font-size="20" font-family="DejaVu Sans,sans-serif">Не путать instant vector result и range vector argument</text><rect x="54" y="1020" width="1622" height="417" rx="14" fill="#fff0ed" stroke="#dfaaa4" stroke-width="2"/><text x="86" y="1069" fill="#833d39" font-size="27" font-family="DejaVu Sans,sans-serif" font-weight="bold">6. Source findings и ограничения</text><text x="86" y="1116" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">p0275: не закрыт scalar(count(...); source code нельзя выполнить буквально</text><text x="86" y="1161" fill="#234158" font-size="18" font-family="DejaVu Sans,sans-serif">p0278: clip_max/clip_min в прозе против clamp_min/clamp в YAML-подобном тексте</text><text x="86" y="1206" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">p0284: sort(node_filesystem_size_bytes), а в выдаче free_bytes</text><text x="86" y="1251" fill="#234158" font-size="18" font-family="DejaVu Sans,sans-serif">p0293: avg_over_time(rate(...)[1h]) без явного subquery step — ошибка в примере</text><text x="86" y="1295" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">p0288: график rate/irate недоступен отдельно; схема производная от текста</text><text x="86" y="1340" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">Старый набор 69 функций и holt_winters — версия PromQL 2.37.0</text><text x="86" y="1389" fill="#234158" font-size="18" font-family="DejaVu Sans,sans-serif">Read-only; текущие версии, runtime limits и контроль качества [Needs confirmation]</text></svg>