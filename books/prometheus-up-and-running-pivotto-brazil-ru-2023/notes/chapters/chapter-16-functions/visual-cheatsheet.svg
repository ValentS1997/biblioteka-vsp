gram_quantile: bucket +Inf</text><rect x="913" y="147" width="392" height="224" rx="14" fill="#fff3e5" stroke="#cbd5e1" stroke-width="2"/><text x="935" y="190" fill="#174b6d" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">Gauge и отсутствие</text><text x="935" y="230" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">changes, deriv, predict_linear</text><text x="935" y="264" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">holt_winters, *_over_time</text><text x="935" y="298" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">absent / absent_over_time</text><text x="935" y="332" fill="#234158" font-size="17" font-family="DejaVu Sans,sans-serif">scrape пропуск ≠ ноль</text><rect x="45" y="407" width="1260" height="185" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="75" y="453" fill="#174968" font-size="27" font-family="DejaVu Sans,sans-serif" font-weight="bold">Выбор по типу временного ряда</text><text x="75" y="497" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">Counter → rate (алерты), increase (отчёты), resets (диагностика)</text><text x="75" y="537" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">Gauge → deriv / predict_linear; диапазон → over_time по samples</text><text x="75" y="573" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">Недостающая цель → absent, не up == 0</text><rect x="45" y="627" width="1260" height="148" rx="14" fill="#fff0ee" stroke="#dda8a3" stroke-width="2"/><text x="75" y="670" fill="#863b37" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold">Source findings без silent correction</text><text x="75" y="712" fill="#234158" font-size="19" font-family="DejaVu Sans,sans-serif">p0275 незакрытый scalar/count; p0278 clip vs clamp</text><text x="75" y="748" fill="#234158" font-size="18" font-family="DejaVu Sans,sans-serif">p0284 sort(size_bytes) vs free_bytes; p0293 типы range</text>