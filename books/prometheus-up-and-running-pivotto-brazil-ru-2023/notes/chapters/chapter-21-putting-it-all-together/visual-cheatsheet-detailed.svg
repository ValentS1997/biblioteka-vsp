<svg xmlns="http://www.w3.org/2000/svg" width="1870" height="1780" viewBox="0 0 1870 1780" role="img" aria-label="Подробная визуальная карта главы 21: внедрение Prometheus, федерация, long term, HA, мониторинг и риски"><rect x="0" y="0" width="1870" height="1780" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="58" y="74" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#17364f" font-weight="bold">Глава 21 · Архитектура и эксплуатация Prometheus</text><text x="58" y="117" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#647b90">PDF 350–374 · p0350:c01–p0374:c01 · canonical RAG-only</text><rect x="58" y="153" width="860" height="268" rx="16" fill="#e7f3ff" stroke="#cdd9e4" stroke-width="2"/><text x="81" y="196" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">1. Поэтапное внедрение</text><text x="81" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Небольшой локальный Prometheus + Node Exporter</text><text x="81" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">SNMP/JMX/Blackbox и существующие exporters</text><text x="81" y="302" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Инструментирование общих библиотек по RED</text><text x="81" y="335" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Обслуживание / ответственность каждой команды</text><text x="81" y="368" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Вертикальное разделение предпочтительно</text><rect x="956" y="153" width="860" height="268" rx="16" fill="#e8f8ed" stroke="#cdd9e4" stroke-width="2"/><text x="979" y="196" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">2. Федерация между ЦОД</text><text x="979" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Оповещения остаются в локальном ЦОД</text><text x="979" y="269" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">job:* агрегаты → /federate match[]</text><text x="979" y="302" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">honor_labels:true + external_labels источников</text><text x="979" y="335" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Не копировать все instance в global server</text><text x="979" y="368" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Grafana может использовать несколько data sources</text><rect x="58" y="462" width="860" height="268" rx="16" fill="#fff4e7" stroke="#cdd9e4" stroke-width="2"/><text x="81" y="505" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">3. Retention и storage</text><text x="81" y="545" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Local TSDB, snapshot, admin delete с осторожностью</text><text x="81" y="578" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">--web.enable-admin-api повышает риск</text><text x="81" y="611" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">remote_write/read и фильтр write_relabel_configs</text><text x="81" y="644" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Thanos / Cortex / Mimir — варианты издания</text><text x="81" y="677" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Agent mode в книге экспериментальный</text><rect x="956" y="462" width="860" height="268" rx="16" fill="#eeeefe" stroke="#cdd9e4" stroke-width="2"/><text x="979" y="505" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">4. Надёжность и оповещения</text><text x="979" y="545" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Две реплики Prometheus, alert labels совпадают</text><text x="979" y="578" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">external labels реплик уникальны для remote write</text><text x="979" y="611" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Alertmanager cluster (peer gossip/AP)</text><text x="979" y="644" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Meta-/cross-monitoring и dead-man switch</text><text x="979" y="677" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">WAN outage не должен ломать локальные alerts</text><rect x="58" y="771" width="1758" height="302" rx="16" fill="#fff" stroke="#cddae6" stroke-width="2"/><text x="91" y="822" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#1a496b" font-weight="bold">5. Ресурсы и тактическая производительность</text><text x="91" y="870" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243f58">Ingest rate(prometheus_tsdb_head_samples_appended_total[5m])</text><text x="91" y="918" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243f58">Source budgets: 2 bytes/sample storage; 20 bytes/sample network — оценки, не SLA</text><text x="91" y="966" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243f58">scrape_samples_scraped, scrape_duration_seconds, missed rule eval, dropped alerts</text><text x="91" y="1018" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">Высокая кардинальность: исправить источник → metric_relabel drop → hashmod sampling</text><rect x="58" y="1113" width="1758" height="602" rx="16" fill="#fff0ed" stroke="#dfaba5" stroke-width="2"/><text x="91" y="1162" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#853e3b" font-weight="bold">6. Source findings, область риска и review</text><text x="91" y="1210" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0363: заявлено отсутствие шифрования, хотя в главе 20 есть серверный TLS</text><text x="91" y="1257" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0356/359: дисковые оценки чувствительны к десятичным и двоичным единицам</text><text x="91" y="1304" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0364/365: дедуп alert labels только после alert_relabel_configs</text><text x="91" y="1351" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0357/369: admin delete / удаление каталога TSDB разрушают данные</text><text x="91" y="1398" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0371: sample_limit превышен → весь scrape завершается ошибкой</text><text x="91" y="1445" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0372: read_recent:true отключает оптимизацию remote_read для свежих samples</text><text x="91" y="1492" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0355/358/360: пороги federation и storage/CPU/RAM — авторские ориентиры</text><text x="91" y="1544" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">Для production нужна отдельная проверка версий, реальной нагрузки и rollback</text><text x="91" y="1600" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">Не запускали config reload, remote_write, admin API, шардирование или deletion</text><text x="91" y="1652" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">Схемы являются синтезом текста RAG, не копией рис. 21.1 или 21.2</text></svg>