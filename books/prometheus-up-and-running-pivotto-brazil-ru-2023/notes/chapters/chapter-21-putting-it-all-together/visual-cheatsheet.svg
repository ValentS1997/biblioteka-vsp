<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-label="Компактный конспект последней главы Prometheus 0040: внедрение, федерация, HA, производительность и ограничения источника"><rect x="0" y="0" width="1440" height="970" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="48" y="68" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#163a54" font-weight="bold">Глава 21 · Собираем все вместе</text><text x="48" y="108" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#647a8d">PDF 350–374 · 25 RAG-чанков · книга 0040</text><rect x="48" y="145" width="421" height="232" rx="16" fill="#e7f3ff" stroke="#cdd9e4" stroke-width="2"/><text x="71" y="188" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">Внедрение и масштаб</text><text x="71" y="228" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Node Exporter → сервисы → RED</text><text x="71" y="261" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Локальные Prometheus по ЦОД</text><text x="71" y="294" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Вертикальное сегментирование</text><text x="71" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Labels/cardinality — контроль</text><rect x="509" y="145" width="421" height="232" rx="16" fill="#e8f7ed" stroke="#cdd9e4" stroke-width="2"/><text x="532" y="188" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">Федерация и история</text><text x="532" y="228" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">/federate: агрегаты job:*</text><text x="532" y="261" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Не собирать все instance</text><text x="532" y="294" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Remote write/read для истории</text><text x="532" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Snapshot и retention осознанно</text><rect x="971" y="145" width="421" height="232" rx="16" fill="#fff4e7" stroke="#cdd9e4" stroke-width="2"/><text x="994" y="188" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#194b6b" font-weight="bold">Надёжность</text><text x="994" y="228" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Два Prometheus для alert HA</text><text x="994" y="261" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Одинаковые alert labels после relabel</text><text x="994" y="294" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Уникальные labels для хранения</text><text x="994" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243f58">Alertmanager cluster + meta-monitoring</text><rect x="48" y="414" width="1344" height="219" rx="16" fill="#fff" stroke="#cdd9e4" stroke-width="2"/><text x="80" y="463" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#194868" font-weight="bold">Обслуживание и диагностика</text><text x="80" y="507" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">Samples/sec → диск, RAM, сеть; исходные оценки проверять на нагрузке</text><text x="80" y="552" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">rule eval / notifications / scrape duration → поиск узких мест</text><text x="80" y="598" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">hashmod для выборки / shards; metric_relabel drop ≠ экономия сети</text><rect x="48" y="675" width="1344" height="238" rx="16" fill="#fff0ed" stroke="#e2a9a3" stroke-width="2"/><text x="80" y="720" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#853d39" font-weight="bold">Source findings и эксплуатационные запреты</text><text x="80" y="761" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0363: «нет шифрования» ↔ встроенный TLS главы 20</text><text x="80" y="803" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0356/p0359: GB vs GiB в оценках; числа условные</text><text x="80" y="844" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243f58">p0369: удаление TSDB потенциально разрушительно, не выполнять</text><text x="80" y="882" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243f58">p0372: read_recent:true может резко увеличить стоимость remote query</text></svg>