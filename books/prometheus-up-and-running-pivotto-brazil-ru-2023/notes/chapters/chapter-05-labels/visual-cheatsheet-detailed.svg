<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1190" viewBox="0 0 1580 1190" role="img" aria-label="Подробная визуальная карта меток Prometheus, API Python, PromQL агрегации, enum info и кардинальности"><rect x="0" y="0" width="1580" height="1190" rx="17" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="51" y="67" fill="#19314e" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="bold">Глава 5 · Идентичность, агрегация и цена временного ряда</text><text x="51" y="108" fill="#556d83" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 97–111 · 15 адресуемых чанков · источник только RAG</text><rect x="51" y="143" width="712" height="224" rx="17" fill="#e7f3ff" stroke="#cad5e1" stroke-width="2"/><text x="73" y="184" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">1 · Виды меток</text><text x="73" y="223" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Внутри приложения: path, method, db</text><text x="73" y="257" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">При scrape: job, instance, region, env</text><text x="73" y="291" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Имя метрики — __name__, служебные __</text><text x="73" y="325" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Не генерировать labels динамически</text><rect x="818" y="143" width="712" height="224" rx="17" fill="#e7f8ef" stroke="#cad5e1" stroke-width="2"/><text x="840" y="184" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">2 · Python client</text><text x="840" y="223" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Counter(..., labelnames=[&apos;path&apos;])</text><text x="840" y="257" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">REQUESTS.labels(self.path).inc()</text><text x="840" y="291" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">labels(&apos;/foo&apos;) инициализирует child</text><text x="840" y="325" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Повторные поиски child можно кешировать</text><rect x="51" y="407" width="712" height="239" rx="17" fill="#fff4e7" stroke="#cad5e1" stroke-width="2"/><text x="73" y="448" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">3 · PromQL агрегирование</text><text x="73" y="487" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">rate(hello_worlds_total[5m])</text><text x="73" y="521" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">sum without(path): убрать path</text><text x="73" y="555" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">sum without(path, instance): GET 45, POST 18</text><text x="73" y="589" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">sum by(version)(python_info)</text><text x="73" y="623" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">group_left(version): обогащение up</text><rect x="818" y="407" width="712" height="239" rx="17" fill="#f1edff" stroke="#cad5e1" stroke-width="2"/><text x="840" y="448" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">4 · Строковые состояния</text><text x="840" y="487" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Enum Gauge: STARTING / RUNNING / ...</text><text x="840" y="521" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Только один child = 1, другие = 0</text><text x="840" y="555" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Lock при сборе предотвращает race</text><text x="840" y="589" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Info: _info с постоянным значением 1</text><text x="840" y="623" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Целевые метки не переносить внутрь кода</text><rect x="51" y="689" width="1479" height="235" rx="17" fill="#fff" stroke="#c9d6e2" stroke-width="2"/><text x="79" y="728" fill="#224a69" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">5 · Кардинальность — контролировать заранее</text><text x="79" y="766" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="19">Серии растут с количеством экземпляров, значений меток и buckets гистограмм</text><text x="79" y="801" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="19">Примеры плохих значений: email, IP, клиент, динамические пути</text><text x="79" y="836" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Авторы рекомендуют обычно меньше 10 рядов/метрику/экземпляр; отдельные 100 допустимы</text><text x="79" y="874" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">sample_limit — потенциальный предохранитель, но его конфигурации в главе нет</text><rect x="51" y="962" width="1479" height="180" rx="17" fill="#fff0ef" stroke="#e4b1aa" stroke-width="2"/><text x="79" y="1002" fill="#813d39" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">6 · Контроль корректности</text><text x="79" y="1040" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Не включать total как отдельное значение метки; не удалять child при жизни процесса</text><text x="79" y="1074" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Смена инструментированных labels — breaking change; rollback источником не описан</text><text x="79" y="1108" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 104: таблица 5.4; PDF 105: # TYPE gauge resource_state — source findings</text></svg>