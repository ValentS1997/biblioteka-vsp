<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="765" viewBox="0 0 1270 765" role="img" aria-label="Компактная карта главы 5: смысл меток, агрегация, кардинальность и проблемы источника"><rect x="0" y="0" width="1270" height="765" rx="17" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="42" y="65" fill="#1c324d" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="bold">Глава 5 · Метки в Prometheus</text><text x="42" y="103" fill="#586d7e" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 97–111 · RAG-only · книга 0040</text><rect x="42" y="138" width="373" height="210" rx="17" fill="#e8f3ff" stroke="#cad5e1" stroke-width="2"/><text x="64" y="179" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Ряд = имя + метки</text><text x="64" y="218" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">http_requests_total</text><text x="64" y="252" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">path=/foo · method=GET</text><text x="64" y="286" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Целевые: job, instance</text><rect x="448" y="138" width="373" height="210" rx="17" fill="#e7f8f0" stroke="#cad5e1" stroke-width="2"/><text x="470" y="179" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Агрегация</text><text x="470" y="218" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">rate(counter[5m])</text><text x="470" y="252" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">sum without(path, instance)</text><text x="470" y="286" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">by(version) · group_left</text><rect x="853" y="138" width="373" height="210" rx="17" fill="#fff3e7" stroke="#cad5e1" stroke-width="2"/><text x="875" y="179" fill="#1e456b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Кардинальность</text><text x="875" y="218" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Экземпляры × метки × buckets</text><text x="875" y="252" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Обычно &lt; 10 на экземпляр</text><text x="875" y="286" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="17">Эвристика авторов, не лимит</text><rect x="42" y="379" width="1184" height="198" rx="17" fill="#ffffff" stroke="#cad5e1" stroke-width="2"/><text x="67" y="419" fill="#215177" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Семантика</text><text x="67" y="455" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Инструментированные labels: path, method; целевые: region, job, instance</text><text x="67" y="490" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Enum: одно состояние = 1; Info: версия и атрибуты при значении 1</text><text x="67" y="525" fill="#243a53" font-family="DejaVu Sans,sans-serif" font-size="18">Дочерние элементы появляются после labels(); удаление child не рекомендуется</text><rect x="42" y="610" width="1184" height="105" rx="17" fill="#fff0ef" stroke="#e2afa7" stroke-width="2"/><text x="67" y="648" fill="#853d3a" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold">Осторожно: изменение набора labels ломает запросы и агрегирование</text><text x="67" y="681" fill="#733f3b" font-family="DejaVu Sans,sans-serif" font-size="17">Таблица 5.4 и пример 5.6 имеют расхождения; см. source-findings.md</text></svg>