<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="805" viewBox="0 0 1320 805" role="img" aria-label="Компактная визуальная карта главы 9: cAdvisor, Kubernetes SD, kube-state-metrics и предупреждения источника"><rect x="0" y="0" width="1320" height="805" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="43" y="66" fill="#18344c" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="bold">Глава 9 · Контейнеры и Kubernetes</text><text x="43" y="106" fill="#587083" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 170–186 · RAG-only · книга 0040 · Kubernetes 1.25.0 в примере</text><rect x="43" y="146" width="387" height="205" rx="16" fill="#e8f3ff" stroke="#cdd8e3" stroke-width="2"/><text x="66" y="188" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Метрики контейнера</text><text x="66" y="228" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">cAdvisor → container_*</text><text x="66" y="261" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">CPU: counters, rate</text><text x="66" y="294" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Memory: RSS / cache / working set</text><rect x="468" y="146" width="387" height="205" rx="16" fill="#e7f7ee" stroke="#cdd8e3" stroke-width="2"/><text x="491" y="188" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">Метрики Kubernetes</text><text x="491" y="228" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Kubelet /metrics</text><text x="491" y="261" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Kubelet /metrics/cadvisor</text><text x="491" y="294" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">kube-state-metrics → объекты</text><rect x="893" y="146" width="383" height="205" rx="16" fill="#fff2e5" stroke="#cdd8e3" stroke-width="2"/><text x="916" y="188" fill="#174768" font-family="DejaVu Sans,sans-serif" font-