<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1410" viewBox="0 0 1670 1410" role="img" aria-label="Подробная визуальная карта главы 9: источники метрик, cAdvisor, Kubernetes, SD, аннотации, TLS и source findings"><rect x="0" y="0" width="1670" height="1410" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="54" y="67" fill="#19344c" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="bold">Глава 9 · Наблюдаемость контейнеров и Kubernetes</text><text x="54" y="107" fill="#5c7386" font-family="DejaVu Sans,sans-serif" font-size="18">PDF 170–186 · p0170:c01–p0186:c01 · строгий RAG-only, без реконструкции рисунков</text><rect x="54" y="148" width="755" height="229" rx="16" fill="#e8f3ff" stroke="#cdd8e3" stroke-width="2"/><text x="77" y="190" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">1. Разделить уровни наблюдения</text><text x="77" y="230" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Node Exporter: метрики самой машины</text><text x="77" y="263" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">cAdvisor: контейнерные cgroups и id</text><text x="77" y="296" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Приложение: process_resident_memory_bytes</text><text x="77" y="329" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">kube-state-metrics: состояние K8s объектов</text><rect x="858" y="148" width="757" height="229" rx="16" fill="#e7f8ef" stroke="#cdd8e3" stroke-width="2"/><text x="881" y="190" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">2. cAdvisor: CPU и память</text><text x="881" y="230" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">container_cpu_usage_seconds_total: Counter</text><text x="881" y="263" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">container_cpu_user/system_seconds_total</text><text x="881" y="296" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">cache, rss, usage_bytes, working_set_bytes</text><text x="881" y="329" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Вложенные cgroups могут дублировать объём</text><rect x="54" y="415" width="755" height="252" rx="16" fill="#fff3e5" stroke="#cdd8e3" stroke-width="2"/><text x="77" y="457" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">3. Kubernetes в Minikube</text><text x="77" y="497" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Minikube 1.27.0 / Kubernetes 1.25.0</text><text x="77" y="530" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">kubectl get services: доступ к API</text><text x="77" y="563" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">RBAC, ConfigMap, Deployment, Service</text><text x="77" y="596" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Учебный Prometheus теряет данные при restart</text><text x="77" y="629" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Manifest-файлы не доступны в RAG</text><rect x="858" y="415" width="757" height="252" rx="16" fill="#efedff" stroke="#cdd8e3" stroke-width="2"/><text x="881" y="457" fill="#174768" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold">4. Kubernetes Service Discovery</text><text x="881" y="497" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">role: node → Kubelet /metrics</text><text x="881" y="530" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">Kubelet /metrics/cadvisor: cgroups</text><text x="881" y="563" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">role: endpointslice → экземпляры сервисов</text><text x="881" y="596" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">role: pod → Pod вне Service</text><text x="881" y="629" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="17">service/ingress: проверки доступности</text><rect x="54" y="706" width="1561" height="270" rx="16" fill="#fff" stroke="#cbd8e3" stroke-width="2"/><text x="84" y="749" fill="#1b4666" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold">5. От Kubernetes API к отдельным целям</text><text x="84" y="796" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="20">Метаданные: namespace, service, Pod, port и annotation</text><text x="84" y="838" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="20">relabel_configs: keep/drop → job и адрес/схема/путь опроса</text><text x="84" y="880" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="19">prometheus.io/{scheme,path,port} → __scheme__, __metrics_path__, __address__</text><text x="84" y="923" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="20">Не передавать bearer token сервиса Kubernetes обычным HTTP-target</text><rect x="54" y="1015" width="1561" height="336" rx="16" fill="#fff0ed" stroke="#e2aea7" stroke-width="2"/><text x="84" y="1062" fill="#853c38" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold">6. Source findings и границы применения</text><text x="84" y="1111" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">p0173: /latesn/ в Minikube URL; labeldrop cadvisor :9090 против :8080</text><text x="84" y="1154" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">p0179: __meta_kubernetes_endpoint_port_name vs endpointslice_port_name</text><text x="84" y="1197" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">p0180–181: action drop пропущено в YAML, но присутствует в пояснении</text><text x="84" y="1240" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">Не использовать insecure_skip_verify как production-конфигурацию</text><text x="84" y="1283" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">kube-state-metrics.yml / prometheus-deployment.yml не раскрыты в RAG</text><text x="84" y="1321" fill="#25405b" font-family="DejaVu Sans,sans-serif" font-size="18">Реальный TLS, RBAC, storage, rollback: [Needs confirmation]</text></svg>