<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="805" viewBox="0 0 1350 805" role="img" aria-label="Компактная визуальная карта главы 11 InfluxDB StatsD и другие системы мониторинга"><rect x="0" y="0" width="1350" height="805" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="45" y="66" font-size="34" font-family="DejaVu Sans,sans-serif" fill="#19354e" font-weight="bold">Глава 11 · Другие системы мониторинга</text><text x="45" y="105" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#617789">PDF 209–214 · RAG-only · inventory 0040</text><rect x="45" y="148" width="390" height="217" rx="16" fill="#e6f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="68" y="191" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">InfluxDB Exporter</text><text x="68" y="231" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Line protocol → POST /write</text><text x="68" y="266" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Exporter :9122/metrics</text><text x="68" y="301" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Время события ≠ время scrape</text><text x="68" y="336" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Value+labels сохраняются</text><rect x="480" y="148" width="390" height="217" rx="16" fill="#e7f7ec" stroke="#cbd5e1" stroke-width="2"/><text x="503" y="191" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">StatsD Exporter</text><text x="503" y="231" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">TCP/UDP :9125, |g |c |ms</text><text x="503" y="266" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Prometheus HTTP :9102</text><text x="503" y="301" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">mapping.yml → region/path</text><text x="503" y="336" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">События → агрегаты</text><rect x="915" y="148" width="390" height="217" rx="16" fill="#fff3e4" stroke="#cbd5e1" stroke-width="2"/><text x="938" y="191" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">Другие адаптеры</text><text x="938" y="231" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">collectd, Graphite, JMX</text><text x="938" y="266" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">SNMP / NRPE / SaaS API</text><text x="938" y="301" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Dropwizard Java client</text><text x="938" y="336" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Разная стоимость интеграции</text><rect x="45" y="399" width="1260" height="196" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="440" font-size="27" font-family="DejaVu Sans,sans-serif" fill="#1d4567" font-weight="bold">Архитектурный принцип: push-to-pull</text><text x="76" y="486" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#233e58">Приложение отправляет данные → exporter хранит агрегаты</text><text x="76" y="526" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#233e58">Prometheus делает pull /metrics и получает текущие образцы</text><text x="76" y="564" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#233e58">Один exporter на экземпляр и общий lifecycle — рекомендация авторов</text><rect x="45" y="635" width="1260" height="132" rx="16" fill="#fff0ed" stroke="#e4ada8" stroke-width="2"/><text x="76" y="678" font-size="24" font-family="DejaVu Sans,sans-serif" fill="#823e3a" font-weight="bold">Ограничения источника</text><text x="76" y="716" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">PDF 213: euwest-1 vs eu-west-1; итоговый тип StatsD timer не показан</text><text x="76" y="746" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#233e58">SNMP slow, SaaS API costs и перенос timestamps требуют проверки</text></svg>