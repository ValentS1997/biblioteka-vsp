<svg xmlns="http://www.w3.org/2000/svg" width="1710" height="1420" viewBox="0 0 1710 1420" role="img" aria-label="Подробная визуальная карта главы 11 InfluxDB StatsD SNMP JMX SaaS и ограничений"><rect x="0" y="0" width="1710" height="1420" rx="16" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="55" y="71" font-size="34" font-family="DejaVu Sans,sans-serif" fill="#1b3450" font-weight="bold">Глава 11 · Переход от внешних систем к Prometheus</text><text x="55" y="113" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#667b8a">PDF 209–214 · p0209:c01–p0214:c01 · канонический RAG-only</text><rect x="55" y="150" width="768" height="257" rx="16" fill="#e6f2ff" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="193" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">1. Модели источников</text><text x="78" y="233" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">InfluxDB: line protocol и метки</text><text x="78" y="268" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">StatsD: события Gauge/Counter/timing</text><text x="78" y="303" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">collectd / Graphite: преобразование имён</text><text x="78" y="338" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">JMX mBean: Java agent и regex</text><text x="78" y="373" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">SNMP: MIB, близость к устройству</text><rect x="872" y="150" width="783" height="257" rx="16" fill="#eeeefe" stroke="#cbd5e1" stroke-width="2"/><text x="895" y="193" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">2. SaaS и переходные технологии</text><text x="895" y="233" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">CloudWatch, New Relic, Pingdom, Stackdriver</text><text x="895" y="268" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">API rate limit, стоимость запросов</text><text x="895" y="303" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">NRPE: сохранение старых Nagios checks</text><text x="895" y="338" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Dropwizard: direct Java client &gt; JMX</text><text x="895" y="373" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Текущие версии и тарифы неизвестны</text><rect x="55" y="450" width="768" height="235" rx="16" fill="#e6f7ed" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="493" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">3. InfluxDB Exporter :9122</text><text x="78" y="533" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">POST /write: example_metric,foo=bar value=43</text><text x="78" y="568" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">GET /metrics: example_metric с foo=bar</text><text x="78" y="603" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Исходная timestamp не экспортируется</text><text x="78" y="638" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">Prometheus использует время опроса</text><rect x="872" y="450" width="783" height="235" rx="16" fill="#fff3e3" stroke="#cbd5e1" stroke-width="2"/><text x="895" y="493" font-size="23" font-family="DejaVu Sans,sans-serif" fill="#15486d" font-weight="bold">4. StatsD Exporter :9125 / :9102</text><text x="895" y="533" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">TCP/UDP :9125 → агрегация событий</text><text x="895" y="568" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">|g, |c, |ms — виды событий</text><text x="895" y="603" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">mapping.yml app.http.requests.*.*</text><text x="895" y="638" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#233e58">region/path labels в /metrics :9102</text><rect x="55" y="726" width="1600" height="245" rx="16" fill="#fff" stroke="#c8d8e3" stroke-width="2"/><text x="85" y="774" font-size="27" font-family="DejaVu Sans,sans-serif" fill="#1d4462" font-weight="bold">5. Рекомендуемое развёртывание</text><text x="85" y="818" font-size="21" font-family="DejaVu Sans,sans-serif" fill="#233e58">Push-to-pull exporter рядом с каждым экземпляром приложения</text><text x="85" y="860" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#233e58">Запускать, останавливать и перезапускать одновременно с приложением</text><text x="85" y="902" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#233e58">Уменьшать риск смены labels, устаревших агрегатов и узкого места</text><rect x="55" y="1012" width="1600" height="339" rx="16" fill="#fff0ec" stroke="#e5aba2" stroke-width="2"/><text x="85" y="1064" font-size="26" font-family="DejaVu Sans,sans-serif" fill="#803c38" font-weight="bold">6. Source findings и ограничения</text><text x="85" y="1112" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#233e58">p0213: region=euwest-1 в прозе; p0214: region=eu-west-1 в метрике</text><text x="85" y="1158" font-size="20" font-family="DejaVu Sans,sans-serif" fill="#233e58">InfluxDB timestamps не сохраняют исходную историю событий</text><text x="85" y="1204" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#233e58">StatsD example_latency_total:20|ms — итоговый тип метрики не показан</text><text x="85" y="1250" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#233e58">Graphite labels vs поддержка tags в версии 1.1.0 — уточнение</text><text x="85" y="1296" font-size="19" font-family="DejaVu Sans,sans-serif" fill="#233e58">Проверять версии, протоколы, MIB, SaaS API, права и rollback</text></svg>