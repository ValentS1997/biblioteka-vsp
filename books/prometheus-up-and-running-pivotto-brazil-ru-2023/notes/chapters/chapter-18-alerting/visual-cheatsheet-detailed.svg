<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1525" viewBox="0 0 1760 1525" role="img" aria-label="Подробный визуальный конспект главы 18: alert lifecycle, stable labels, for, routing и source findings"><rect x="0" y="0" width="1760" height="1525" rx="15" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="56" y="70" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#16354f" font-weight="bold">Глава 18 · От выражения PromQL к уведомлению</text><text x="56" y="112" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#617b8d">PDF 307–320 · p0307:c01–p0320:c01 · strict RAG-only</text><rect x="55" y="154" width="809" height="258" rx="15" fill="#e7f2ff" stroke="#c9d7e2" stroke-width="2"/><text x="79" y="198" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">1. Prometheus определяет alert</text><text x="79" y="237" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">expr возвращает мгновенный вектор</text><text x="79" y="272" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Каждый sample даёт alert identity</text><text x="79" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">ALERTS{alertstate=pending/firing}</text><text x="79" y="342" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">ALERTS_FOR_STATE: время начала</text><text x="79" y="377" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Пустой vector — alert отсутствует</text><rect x="905" y="154" width="801" height="258" rx="15" fill="#e8f8ef" stroke="#c9d7e2" stroke-width="2"/><text x="929" y="198" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">2. Стабильность и for</text><text x="929" y="237" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">for: 5m — устойчивое условие</text><text x="929" y="272" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">pending не посылается Alertmanager</text><text x="929" y="307" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">firing → Alertmanager</text><text x="929" y="342" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Исчезновение series сбрасывает for</text><text x="929" y="377" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">max_over_time смягчает scrape misses</text><rect x="55" y="454" width="809" height="252" rx="15" fill="#fff4e7" stroke="#c9d7e2" stroke-width="2"/><text x="79" y="498" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">3. Метки и аннотации</text><text x="79" y="537" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">labels: severity ticket/page, team/service</text><text x="79" y="572" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Не помещать меняющийся $value в label</text><text x="79" y="607" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">annotations: summary, dashboard, runbook</text><text x="79" y="642" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">$value, $labels, query, range в Go template</text><text x="79" y="677" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">query может дорого обходиться</text><rect x="905" y="454" width="801" height="252" rx="15" fill="#eeeefe" stroke="#c9d7e2" stroke-width="2"/><text x="929" y="498" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">4. Доставка и внешние labels</text><text x="929" y="537" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Prometheus → Alertmanager → notifications</text><text x="929" y="572" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">alerting.alertmanagers: localhost:9093</text><text x="929" y="607" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">external_labels после rule evaluation</text><text x="929" y="642" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">alert_relabel_configs после external_labels</text><text x="929" y="677" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Alertmanager получает внешние labels</text><rect x="55" y="748" width="1651" height="253" rx="15" fill="#fff" stroke="#cad9e5" stroke-width="2"/><text x="87" y="797" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#1d4969" font-weight="bold">5. Рабочие критерии качества оповещения</text><text x="87" y="844" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244258">Оповещать о симптомах для пользователя, риске ресурсов или отказе мониторинга</text><text x="87" y="891" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244258">Каждому сигналу назначить владельца, действие, стабильный labelset и осмысленный for</text><text x="87" y="939" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244258">Не превращать low severity в безответственный поток писем/чатов</text><rect x="55" y="1045" width="1651" height="407" rx="15" fill="#fff0ed" stroke="#e0aaa4" stroke-width="2"/><text x="87" y="1093" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#843f3c" font-weight="bold">6. Замечания и пределы доказуемого</text><text x="87" y="1140" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0309: ALERTS_FOR_STATE и ALERT_FOR_STATE в одном абзаце</text><text x="87" y="1184" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0313: severity=page и severity=ticket могут срабатывать одновременно</text><text x="87" y="1228" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0315–316: query в annotations создаёт дополнительные дорогие запросы</text><text x="87" y="1272" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0318: издательский знак ❶ нельзя переносить в конфигурацию YAML</text><text x="87" y="1316" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0320: external_labels не доступны Prometheus annotations</text><text x="87" y="1360" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">Оригинальные скриншоты 18.1/18.2 в RAG недоступны как изображения</text><text x="87" y="1408" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#244258">Config changes / drop alert = state-changing; rollback [Needs confirmation]</text></svg>