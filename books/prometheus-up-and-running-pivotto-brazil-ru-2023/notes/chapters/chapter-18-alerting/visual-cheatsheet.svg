<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="834" viewBox="0 0 1390 834" role="img" aria-label="Компактный визуальный конспект главы 18: Prometheus alerts, Alertmanager, for, labels, annotations и ограничения"><rect x="0" y="0" width="1390" height="834" rx="15" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="47" y="67" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#19374f" font-weight="bold">Глава 18 · Оповещение</text><text x="47" y="108" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#607a8e">PDF 307–320 · RAG-only · книга 0040</text><rect x="47" y="150" width="410" height="220" rx="15" fill="#e7f2ff" stroke="#c9d7e2" stroke-width="2"/><text x="71" y="194" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">Prometheus</text><text x="71" y="233" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">PromQL expr → alert</text><text x="71" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Каждый sample = один alert</text><text x="71" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">for → pending / firing</text><text x="71" y="338" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">ALERTS, ALERTS_FOR_STATE</text><rect x="491" y="150" width="409" height="220" rx="15" fill="#e8f8ee" stroke="#c9d7e2" stroke-width="2"/><text x="515" y="194" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">Идентичность и детали</text><text x="515" y="233" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">labels: severity, team, job</text><text x="515" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">labelset должен быть стабильным</text><text x="515" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">annotations: $value, $labels</text><text x="515" y="338" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">query/range дорого на сотнях</text><rect x="934" y="150" width="410" height="220" rx="15" fill="#fff3e6" stroke="#c9d7e2" stroke-width="2"/><text x="958" y="194" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1a4a6a" font-weight="bold">Alertmanager</text><text x="958" y="233" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Получает firing alerts</text><text x="958" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">Группирует и направляет</text><text x="958" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">external_labels перед отправкой</text><text x="958" y="338" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#244258">alert_relabel_configs: drop</text><rect x="47" y="403" width="1297" height="198" rx="15" fill="#fff" stroke="#c9d7e2" stroke-width="2"/><text x="76" y="449" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#1a4a68" font-weight="bold">Один сигнал должен требовать понятного действия</text><text x="76" y="493" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">Симптомы пользователя, исчерпание ресурсов, отказ мониторинга</text><text x="76" y="533" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">Stable labels → routing. Dynamic diagnostics → annotations.</text><text x="76" y="571" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">Alert ≠ notification; отсутствие ряда ≠ up=0; pending ≠ firing</text><rect x="47" y="641" width="1297" height="140" rx="15" fill="#fff0ed" stroke="#dfa8a4" stroke-width="2"/><text x="77" y="682" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#873b39" font-weight="bold">Важные source findings</text><text x="77" y="721" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0309 ALERTS_FOR_STATE / ALERT_FOR_STATE; p0318 сноска ❶ внутри YAML</text><text x="77" y="753" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244258">p0313 два порога severity; внешние метки не видны в annotations</text></svg>