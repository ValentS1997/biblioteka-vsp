<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 6 — Сети Docker</title>
  <desc id="desc">Компактная шпаргалка по Bridge, Host, None, MACVLAN, Overlay, NAT и VXLAN.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 6 — Сети Docker</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">single-host bridge → physical MACVLAN → multi-host VXLAN overlay</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Bridge / docker0</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">container eth0 ↔ veth ↔ docker0</tspan>
    <tspan x="78" dy="34">IPAM assigns 172.17.0.x in source.</tspan>
    <tspan x="78" dy="34">Default bridge: IP communication.</tspan>
    <tspan x="78" dy="34">User bridge: name resolution in lab.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Host / None</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Host: shared host network namespace.</tspan>
    <tspan x="593" dy="34">No separate container IP stack.</tspan>
    <tspan x="593" dy="34">None: no external interface.</tspan>
    <tspan x="593" dy="34">Use modes according to isolation needs.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Port mapping / NAT</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">-P → random host port.</tspan>
    <tspan x="1108" dy="34">-p 8080:80 → explicit mapping.</tspan>
    <tspan x="1108" dy="34">TCP and UDP may be published.</tspan>
    <tspan x="1108" dy="34">Outbound bridge traffic uses MASQUERADE.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">MACVLAN</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Container gets own MAC + IP on physical net.</tspan>
    <tspan x="78" dy="34">Bridge mode → parent NIC.</tspan>
    <tspan x="78" dy="34">Trunk 802.1Q → parent subinterface.</tspan>
    <tspan x="78" dy="34">Host↔container needs special path in source.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Overlay / Swarm</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">ingress = default Swarm overlay.</tspan>
    <tspan x="593" dy="34">docker_gwbridge = external path.</tspan>
    <tspan x="593" dy="34">Standalone containers need --attachable.</tspan>
    <tspan x="593" dy="34">Overlay container has two network paths.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">VXLAN</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">L2 frames over physical L3.</tspan>
    <tspan x="1108" dy="34">VTEP encapsulates / decapsulates.</tspan>
    <tspan x="1108" dy="34">VNI identifies virtual network.</tspan>
    <tspan x="1108" dy="34">Source observes UDP 4789.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Core path: namespace + veth + bridge locally; MACVLAN reaches physical L2; VXLAN carries overlay L2 across host L3.</text>
</svg>