<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Глава 7 — Безопасность в Docker. Часть 1: подробная шпаргалка</title>
  <desc id="desc">Подробная карта Linux security layers used by Docker: namespaces, cgroups, capabilities, AppArmor, SELinux, seccomp.</desc>
  <rect width="1800" height="1200" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1800" height="112" fill="#17202a"/>
  <text x="58" y="50" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Глава 7 — Безопасность в Docker. Часть 1</text>
  <text x="58" y="86" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Isolation → resource control → privilege control → MAC → syscall filtering</text>

  <rect x="45" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="75" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1b4f72">1. Kernel namespaces</text>
  <text x="75" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">PID → independent process tree</tspan>
    <tspan x="75" dy="31">NET → network stack / ports</tspan>
    <tspan x="75" dy="31">MNT → filesystem / mount view</tspan>
    <tspan x="75" dy="31">IPC → shared-memory boundary</tspan>
    <tspan x="75" dy="31">USR → users / UID mapping</tspan>
    <tspan x="75" dy="31">UTS → hostname / domain identity</tspan>
  </text>

  <rect x="630" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="660" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#196f3d">2. cgroups / memory</text>
  <text x="660" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">Limit · prioritize · account · control</tspan>
    <tspan x="660" dy="31">--memory → hard ceiling</tspan>
    <tspan x="660" dy="31">--memory-reservation → soft target</tspan>
    <tspan x="660" dy="31">--memory-swap → memory + swap total</tspan>
    <tspan x="660" dy="31">OOM risk motivates explicit boundaries</tspan>
  </text>

  <rect x="1215" y="145" width="540" height="290" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1245" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#9c640c">3. cgroups / CPU</text>
  <text x="1245" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">--cpus → CPU capacity</tspan>
    <tspan x="1245" dy="31">--cpuset-cpus → exact CPU set</tspan>
    <tspan x="1245" dy="31">--cpu-shares → relative soft priority</tspan>
    <tspan x="1245" dy="31">Docker changes host cgroup parameters</tspan>
    <tspan x="1245" dy="31">No limit by default in source framing</tspan>
  </text>

  <rect x="45" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="75" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#6c3483">4. Capabilities</text>
  <text x="75" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Kernel splits traditional root privilege.</tspan>
    <tspan x="75" dy="31">Container gets a reduced default set.</tspan>
    <tspan x="75" dy="31">Drop CAP_CHOWN → chown denied.</tspan>
    <tspan x="75" dy="31">Add LINUX_IMMUTABLE → chattr +i works.</tspan>
    <tspan x="75" dy="31">Principle: add only what application needs.</tspan>
  </text>

  <rect x="630" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="660" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#21618c">5. AppArmor</text>
  <text x="660" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">Profile-based mandatory access control.</tspan>
    <tspan x="660" dy="31">complain → observe/log violations</tspan>
    <tspan x="660" dy="31">enforce → block disallowed operations</tspan>
    <tspan x="660" dy="31">docker-default attached to containers</tspan>
    <tspan x="660" dy="31">Custom profile attached by --security-opt</tspan>
  </text>

  <rect x="1215" y="475" width="540" height="300" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1245" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#922b21">6. SELinux</text>
  <text x="1245" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">Objects/processes receive security labels.</tspan>
    <tspan x="1245" dy="31">Policy compares process vs object label.</tspan>
    <tspan x="1245" dy="31">Modes: enforcing / permissive / disabled.</tspan>
    <tspan x="1245" dy="31">MCS categories separate containers.</tspan>
    <tspan x="1245" dy="31">AVC caches access decisions.</tspan>
  </text>

  <rect x="45" y="815" width="840" height="250" rx="18" fill="#ffffff" stroke="#48c9b0" stroke-width="2"/>
  <text x="75" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#117864">7. Seccomp / syscall boundary</text>
  <text x="75" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Container process issues a system call.</tspan>
    <tspan x="75" dy="31">Seccomp profile decides allowed vs blocked.</tspan>
    <tspan x="75" dy="31">Kernel support requires CONFIG_SECCOMP.</tspan>
    <tspan x="75" dy="31">Source default profile is compatibility-oriented.</tspan>
    <tspan x="75" dy="31">Reduces reachable kernel interfaces.</tspan>
  </text>

  <rect x="930" y="815" width="825" height="250" rx="18" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="960" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#a04000">8. Operational safety</text>
  <text x="960" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="960" dy="0">Read first: aa-status / getenforce / docker info.</tspan>
    <tspan x="960" dy="31">Capability changes alter application privileges.</tspan>
    <tspan x="960" dy="31">MAC policy changes can block administration.</tspan>
    <tspan x="960" dy="31">GRUB / SELinux / daemon changes need rollback.</tspan>
    <tspan x="960" dy="31">Restart/reboot affects running workloads.</tspan>
  </text>

  <rect x="45" y="1105" width="1710" height="62" rx="14" fill="#17202a"/>
  <text x="76" y="1145" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Mental model: no single mechanism is sufficient — Docker security layers constrain different dimensions of container behavior.</text>
</svg>