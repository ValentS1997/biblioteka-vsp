<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 7 — Безопасность в Docker. Часть 1</title>
  <desc id="desc">Компактная шпаргалка по namespaces, cgroups, capabilities, AppArmor, SELinux и seccomp.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 7 — Безопасность в Docker. Часть 1</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Linux security layers around the container process</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Namespaces</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">PID · NET · MNT · IPC · USR · UTS</tspan>
    <tspan x="78" dy="34">Separate process/network/mount views.</tspan>
    <tspan x="78" dy="34">IPC can be shared explicitly.</tspan>
    <tspan x="78" dy="34">USR supports UID separation/remapping.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">cgroups</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Limits · priority · accounting · control</tspan>
    <tspan x="593" dy="34">Memory: hard / reservation / swap.</tspan>
    <tspan x="593" dy="34">CPU: cpus / cpuset / shares.</tspan>
    <tspan x="593" dy="34">Default source state: no resource limits.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Capabilities</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Root privileges split into units.</tspan>
    <tspan x="1108" dy="34">Docker exposes a reduced default set.</tspan>
    <tspan x="1108" dy="34">--cap-drop removes privilege.</tspan>
    <tspan x="1108" dy="34">--cap-add expands privilege.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">AppArmor</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Profile-based mandatory access control.</tspan>
    <tspan x="78" dy="34">complain → log, do not block.</tspan>
    <tspan x="78" dy="34">enforce → block violations.</tspan>
    <tspan x="78" dy="34">Docker profile: docker-default.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">SELinux</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Labels + policy → allow / deny.</tspan>
    <tspan x="593" dy="34">enforcing · permissive · disabled.</tspan>
    <tspan x="593" dy="34">MCS adds category separation.</tspan>
    <tspan x="593" dy="34">Docker integration adds process/mount labels.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Seccomp</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Kernel system-call filtering.</tspan>
    <tspan x="1108" dy="34">Docker uses a default profile.</tspan>
    <tspan x="1108" dy="34">Blocked calls reduce kernel surface.</tspan>
    <tspan x="1108" dy="34">Kernel support: CONFIG_SECCOMP.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Core idea: isolation + resource boundaries + least privilege + mandatory policy + syscall filtering.</text>
</svg>