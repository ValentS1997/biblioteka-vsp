<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Контейнеризация и Docker</title>
  <desc id="desc">Компактная шпаргалка: контейнеры, Docker Engine, Registry, микросервисы и безопасность.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Контейнеризация и Docker</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">app + runtime + dependencies → container → shared host kernel</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Контейнер vs ВМ</text>
  <text x="78" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">ВМ: отдельная ОС + гипервизор.</tspan>
    <tspan x="78" dy="34">Контейнер: ядро хоста общее.</tspan>
    <tspan x="78" dy="34">Меньше overhead, быстрый запуск.</tspan>
    <tspan x="78" dy="34">Среда приложения переносима.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Docker Engine</text>
  <text x="593" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">CLI / client</tspan>
    <tspan x="593" dy="34">↓ REST API / socket / network</tspan>
    <tspan x="593" dy="34">Docker daemon</tspan>
    <tspan x="593" dy="34">↓ containers / images / networks / volumes</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Registry / Hub</text>
  <text x="1108" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Хранение и доставка образов.</tspan>
    <tspan x="1108" dy="34">Теги различают версии образа.</tspan>
    <tspan x="1108" dy="34">push → registry</tspan>
    <tspan x="1108" dy="34">pull ← registry</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Микросервисы</text>
  <text x="78" y="542" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Чёткие границы компонентов.</tspan>
    <tspan x="78" dy="34">Независимые deploy / update / scale.</tspan>
    <tspan x="78" dy="34">Контейнер = изолированная среда сервиса.</tspan>
    <tspan x="78" dy="34">Docker Swarm = clustering + orchestration.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="593" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Security</text>
  <text x="593" y="542" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">namespaces — изоляция процессов</tspan>
    <tspan x="593" dy="34">cgroups — лимиты ресурсов</tspan>
    <tspan x="593" dy="34">capabilities — минимальные привилегии</tspan>
    <tspan x="593" dy="34">DCT — подписанные образы</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="1108" y="498" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Практический смысл</text>
  <text x="1108" y="542" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Меньше различий между средами.</tspan>
    <tspan x="1108" dy="34">Быстрый lifecycle контейнера.</tspan>
    <tspan x="1108" dy="34">Образы удобно включать в CI/CD.</tspan>
    <tspan x="1108" dy="34">Daemon — чувствительная security boundary.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Модель главы: упаковать runtime → изолировать → управлять Docker → доставлять образ → масштабировать сервис.</text>
</svg>