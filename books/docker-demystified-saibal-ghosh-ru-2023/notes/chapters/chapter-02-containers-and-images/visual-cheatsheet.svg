<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Контейнеры и образы</title>
  <desc id="desc">Компактная шпаргалка: lifecycle, inspect, logs, runtime stack, image layers и Dockerfile.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 2 — Контейнеры и образы</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">image layers → thin writable layer → container lifecycle</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Container lifecycle</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Created → Running → Exited</tspan>
    <tspan x="78" dy="34">Running ↔ Paused</tspan>
    <tspan x="78" dy="34">Restarting / Dead / Stopped</tspan>
    <tspan x="78" dy="34">Observe: docker ps / container ls -a</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Inspect &amp; Logs</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">inspect → JSON state/config</tspan>
    <tspan x="593" dy="34">logs → stdout / stderr</tspan>
    <tspan x="593" dy="34">--follow · --tail · -t · grep</tspan>
    <tspan x="593" dy="34">Default example: json-file</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Runtime stack</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Docker CLI → REST API</tspan>
    <tspan x="1108" dy="34">→ dockerd → containerd → runC</tspan>
    <tspan x="1108" dy="34">→ namespaces / cgroups</tspan>
    <tspan x="1108" dy="34">runC follows OCI specifications</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Image layers</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Image = immutable ordered layers.</tspan>
    <tspan x="78" dy="34">Container adds thin read-write layer.</tspan>
    <tspan x="78" dy="34">Digest = SHA-256 checksum.</tspan>
    <tspan x="78" dy="34">Changes use Copy-On-Write.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Dockerfile</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">FROM · RUN · CMD · ENTRYPOINT</tspan>
    <tspan x="593" dy="34">ENV · LABEL · USER · WORKDIR</tspan>
    <tspan x="593" dy="34">ADD · EXPOSE · VOLUME</tspan>
    <tspan x="593" dy="34">Build cache uses intermediate results.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Layer-size rule</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Delete in later layer ≠ erase older layer.</tspan>
    <tspan x="1108" dy="34">Create + remove in same RUN → smaller.</tspan>
    <tspan x="1108" dy="34">Multi-stage: several FROM stages.</tspan>
    <tspan x="1108" dy="34">Copy only needed artifacts to final image.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Ключ: image immutable; container mutable только через свой writable layer; наблюдение — ps / inspect / logs.</text>
</svg>