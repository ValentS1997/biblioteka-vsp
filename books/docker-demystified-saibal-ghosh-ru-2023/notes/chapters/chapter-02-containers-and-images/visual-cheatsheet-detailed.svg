<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Контейнеры и образы: подробная шпаргалка</title>
  <desc id="desc">Подробная карта: lifecycle контейнера, диагностика, logging, Docker runtime stack, image layers, COW, Dockerfile и build cache.</desc>
  <rect width="1800" height="1200" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1800" height="112" fill="#17202a"/>
  <text x="58" y="50" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Глава 2 — Контейнеры и образы</text>
  <text x="58" y="86" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Lifecycle → diagnostics → runtime → layers → build</text>

  <rect x="45" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="75" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1b4f72">1. Lifecycle</text>
  <text x="75" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">run → create + start</tspan>
    <tspan x="75" dy="31">create → Created</tspan>
    <tspan x="75" dy="31">Running ↔ Paused</tspan>
    <tspan x="75" dy="31">stop / process exit → Exited</tspan>
    <tspan x="75" dy="31">Restarting — restart in progress</tspan>
    <tspan x="75" dy="31">Dead — failed partial removal</tspan>
  </text>

  <rect x="630" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="660" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#196f3d">2. Diagnostics</text>
  <text x="660" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">docker ps / container ls -a → state</tspan>
    <tspan x="660" dy="31">docker inspect → JSON metadata</tspan>
    <tspan x="660" dy="31">docker exec -it ... sh → process inside</tspan>
    <tspan x="660" dy="31">inspect fields: PID, ExitCode, image</tspan>
    <tspan x="660" dy="31">storage/network/service paths</tspan>
  </text>

  <rect x="1215" y="145" width="540" height="290" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1245" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#9c640c">3. Logging</text>
  <text x="1245" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">stdout / stderr → logging driver</tspan>
    <tspan x="1245" dy="31">Example default: json-file</tspan>
    <tspan x="1245" dy="31">logs: follow · tail · timestamp · grep</tspan>
    <tspan x="1245" dy="31">Local files consume disk space.</tspan>
    <tspan x="1245" dy="31">Large fleets need central aggregation.</tspan>
  </text>

  <rect x="45" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="75" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#6c3483">4. Runtime architecture</text>
  <text x="75" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Docker CLI</tspan>
    <tspan x="75" dy="31">↓ REST API</tspan>
    <tspan x="75" dy="31">dockerd</tspan>
    <tspan x="75" dy="31">↓ containerd</tspan>
    <tspan x="75" dy="31">↓ runC / OCI</tspan>
    <tspan x="75" dy="31">↓ namespaces · cgroups · security</tspan>
  </text>

  <rect x="630" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="660" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#21618c">5. Image structure</text>
  <text x="660" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">Immutable ordered layers</tspan>
    <tspan x="660" dy="31">SHA-256 digest identifies layer content</tspan>
    <tspan x="660" dy="31">Configuration object orders digests</tspan>
    <tspan x="660" dy="31">Container adds thin read-write layer</tspan>
    <tspan x="660" dy="31">One image → many containers</tspan>
  </text>

  <rect x="1215" y="475" width="540" height="300" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1245" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#922b21">6. Copy-On-Write</text>
  <text x="1245" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">Read: use shared image layer.</tspan>
    <tspan x="1245" dy="31">Write: copy object to writable layer.</tspan>
    <tspan x="1245" dy="31">Modify private copy only.</tspan>
    <tspan x="1245" dy="31">Original image layer remains unchanged.</tspan>
    <tspan x="1245" dy="31">Storage drivers track layer differences.</tspan>
  </text>

  <rect x="45" y="815" width="840" height="250" rx="18" fill="#ffffff" stroke="#48c9b0" stroke-width="2"/>
  <text x="75" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#117864">7. Dockerfile / cache</text>
  <text x="75" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">FROM · RUN · CMD · ENTRYPOINT · ENV · LABEL</tspan>
    <tspan x="75" dy="31">ADD · EXPOSE · WORKDIR · USER · VOLUME</tspan>
    <tspan x="75" dy="31">Docker reads top → bottom.</tspan>
    <tspan x="75" dy="31">Build cache reuses matching intermediate images.</tspan>
    <tspan x="75" dy="31">Several FROM instructions = multi-stage build.</tspan>
  </text>

  <rect x="930" y="815" width="825" height="250" rx="18" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="960" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#a04000">8. Layer-size behavior</text>
  <text x="960" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="960" dy="0">Create file in layer A, delete in layer B:</tspan>
    <tspan x="960" dy="31">layer A still contains file data.</tspan>
    <tspan x="960" dy="31">Create + delete in same RUN:</tspan>
    <tspan x="960" dy="31">temporary data does not persist as separate layer.</tspan>
    <tspan x="960" dy="31">Multi-stage build keeps only required artifacts.</tspan>
  </text>

  <rect x="45" y="1105" width="1710" height="62" rx="14" fill="#17202a"/>
  <text x="76" y="1145" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Operational rule: identify object + state first, inspect metadata/logs, then reason about image layers and build history.</text>
</svg>