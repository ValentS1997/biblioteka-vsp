<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — Container Network Model и Docker bridge</title>
  <desc id="desc">Компактная шпаргалка по CNM, libnetwork, drivers, namespaces, veth и docker0.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 4 — Container Network Model и Docker bridge</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">CNM abstraction → Linux namespace/veth/bridge</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">CNM</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Sandbox = isolated network stack</tspan>
    <tspan x="78" dy="34">Endpoint = connection point</tspan>
    <tspan x="78" dy="34">Network = communication domain</tspan>
    <tspan x="78" dy="34">Sandbox ↔ Endpoint ↔ Network</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">libnetwork + drivers</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">libnetwork implements CNM.</tspan>
    <tspan x="593" dy="34">Network driver = implementation.</tspan>
    <tspan x="593" dy="34">IPAM = address/subnet allocation.</tspan>
    <tspan x="593" dy="34">Built-in + third-party drivers.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Built-in drivers</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">bridge · host · none</tspan>
    <tspan x="1108" dy="34">overlay · MACVLAN</tspan>
    <tspan x="1108" dy="34">Overlay: multi-host + VXLAN.</tspan>
    <tspan x="1108" dy="34">Bridge: Linux bridge on host.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Network namespace</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Independent network stack.</tspan>
    <tspan x="78" dy="34">Own interfaces, routes, firewall.</tspan>
    <tspan x="78" dy="34">Provides container network isolation.</tspan>
    <tspan x="78" dy="34">Check: ip netns list</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">veth pair</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Full-duplex virtual Ethernet link.</tspan>
    <tspan x="593" dy="34">One endpoint in each namespace.</tspan>
    <tspan x="593" dy="34">Chapter lab: 10.0.0.15 ↔ 10.0.0.16</tspan>
    <tspan x="593" dy="34">Verification: ping both directions.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Linux bridge / docker0</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Bridge = Layer-2 virtual switch.</tspan>
    <tspan x="1108" dy="34">docker0 is based on Linux bridge.</tspan>
    <tspan x="1108" dy="34">container eth0 ↔ veth ↔ docker0</tspan>
    <tspan x="1108" dy="34">IPAM assigns container address.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Ключ: CNM описывает модель; namespaces + veth + Linux bridge реализуют базовую изоляцию и связность.</text>
</svg>