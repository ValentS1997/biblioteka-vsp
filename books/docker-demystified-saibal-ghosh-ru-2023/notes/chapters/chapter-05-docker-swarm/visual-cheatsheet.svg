<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Docker Swarm</title>
  <desc id="desc">Компактная шпаргалка по managers/workers, services/tasks, quorum, drain, autolock и overlay networking.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 5 — Docker Swarm</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">desired state → scheduler → tasks → reconciliation</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Cluster roles</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Managers orchestrate cluster state.</tspan>
    <tspan x="78" dy="34">One manager is Leader.</tspan>
    <tspan x="78" dy="34">Workers execute assigned tasks.</tspan>
    <tspan x="78" dy="34">Odd manager count: source suggests 3 or 5.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Service / Task</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Service = desired state.</tspan>
    <tspan x="593" dy="34">Task/replica = execution unit.</tspan>
    <tspan x="593" dy="34">Failure → replacement task elsewhere.</tspan>
    <tspan x="593" dy="34">Scale changes desired replica count.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Consensus / quorum</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Raft consensus per source.</tspan>
    <tspan x="1108" dy="34">Majority required for state changes.</tspan>
    <tspan x="1108" dy="34">Loss tolerance ≈ (N-1)/2.</tspan>
    <tspan x="1108" dy="34">No quorum → scheduler cannot reconcile.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Modes / maintenance</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Replicated = N tasks.</tspan>
    <tspan x="78" dy="34">Global = one task per eligible node.</tspan>
    <tspan x="78" dy="34">DRAIN evacuates Swarm service tasks.</tspan>
    <tspan x="78" dy="34">ACTIVE accepts future tasks.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Security</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Mutual TLS / encrypted control traffic.</tspan>
    <tspan x="593" dy="34">Autolock protects manager after restart.</tspan>
    <tspan x="593" dy="34">Unlock key must be stored securely.</tspan>
    <tspan x="593" dy="34">Overlay data encryption: --opt encrypted.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Networking</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">docker_gwbridge + ingress.</tspan>
    <tspan x="1108" dy="34">Custom overlay networks.</tspan>
    <tspan x="1108" dy="34">Published ports → routing mesh.</tspan>
    <tspan x="1108" dy="34">DNSRR can bypass mesh with external LB.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Core idea: declare service state; Swarm schedules tasks, restores replicas after failure, and exposes services through cluster networking.</text>
</svg>