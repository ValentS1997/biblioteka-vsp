<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Драйверы хранилища и тома: подробная шпаргалка</title>
  <desc id="desc">Подробная карта главы: storage drivers, backing filesystem, overlay2, persistence, volumes, bind mounts и tmpfs.</desc>
  <rect width="1800" height="1200" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1800" height="112" fill="#17202a"/>
  <text x="58" y="50" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Глава 3 — Драйверы хранилища и тома</text>
  <text x="58" y="86" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Storage path → OverlayFS → persistence mechanisms</text>

  <rect x="45" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="75" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1b4f72">1. Storage driver role</text>
  <text x="75" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Container changes → thin read-write layer.</tspan>
    <tspan x="75" dy="31">Storage driver writes/manages that layer.</tspan>
    <tspan x="75" dy="31">Use mainly for smaller data volumes.</tspan>
    <tspan x="75" dy="31">Selection depends on kernel + backing FS.</tspan>
    <tspan x="75" dy="31">Book preference: overlay2.</tspan>
  </text>

  <rect x="630" y="145" width="535" height="290" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="660" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#196f3d">2. Driver matrix</text>
  <text x="660" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">overlay2 → XFS/ext4</tspan>
    <tspan x="660" dy="31">aufs → older Ubuntu context</tspan>
    <tspan x="660" dy="31">Device Mapper → direct-lvm</tspan>
    <tspan x="660" dy="31">btrfs → btrfs backing FS</tspan>
    <tspan x="660" dy="31">zfs → zfs backing FS</tspan>
    <tspan x="660" dy="31">vfs → any FS, slow, no COW</tspan>
  </text>

  <rect x="1215" y="145" width="540" height="290" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1245" y="188" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#9c640c">3. Overlay2 internals</text>
  <text x="1245" y="232" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">lowerdir → lower read-only layers</tspan>
    <tspan x="1245" dy="31">upperdir → writes / differences</tspan>
    <tspan x="1245" dy="31">diff → layer content</tspan>
    <tspan x="1245" dy="31">work → OverlayFS work directory</tspan>
    <tspan x="1245" dy="31">union mount → merged filesystem view</tspan>
  </text>

  <rect x="45" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="75" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#6c3483">4. Driver checks / change</text>
  <text x="75" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">lsmod | grep overlay</tspan>
    <tspan x="75" dy="31">docker info | grep Storage</tspan>
    <tspan x="75" dy="31">Change workflow: stop Docker</tspan>
    <tspan x="75" dy="31">→ backup /var/lib/docker</tspan>
    <tspan x="75" dy="31">→ edit daemon.json → start → verify</tspan>
    <tspan x="75" dy="31">Disruptive: preserve rollback point.</tspan>
  </text>

  <rect x="630" y="475" width="535" height="300" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="660" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#21618c">5. Volume</text>
  <text x="660" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="660" dy="0">Docker-managed host storage.</tspan>
    <tspan x="660" dy="31">Anonymous: Docker chooses source path.</tspan>
    <tspan x="660" dy="31">Named: docker volume create myvolume.</tspan>
    <tspan x="660" dy="31">Persists after container removal.</tspan>
    <tspan x="660" dy="31">Can be shared across containers.</tspan>
  </text>

  <rect x="1215" y="475" width="540" height="300" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1245" y="518" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#922b21">6. Bind mount</text>
  <text x="1245" y="562" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1245" dy="0">Arbitrary host path mapped into container.</tspan>
    <tspan x="1245" dy="31">Example: /root/testing ↔ /test1</tspan>
    <tspan x="1245" dy="31">Host and container see same data.</tspan>
    <tspan x="1245" dy="31">Container removal does not delete host data.</tspan>
    <tspan x="1245" dy="31">Inspect Mounts shows Type=bind.</tspan>
  </text>

  <rect x="45" y="815" width="840" height="250" rx="18" fill="#ffffff" stroke="#48c9b0" stroke-width="2"/>
  <text x="75" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#117864">7. Persistence decision</text>
  <text x="75" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="75" dy="0">Small container-local writes → writable layer.</tspan>
    <tspan x="75" dy="31">Persistent Docker-managed data → volume.</tspan>
    <tspan x="75" dy="31">Persistent arbitrary host path → bind mount.</tspan>
    <tspan x="75" dy="31">Temporary memory-only data → tmpfs.</tspan>
    <tspan x="75" dy="31">Large write workloads should avoid container layer.</tspan>
  </text>

  <rect x="930" y="815" width="825" height="250" rx="18" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="960" y="858" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#a04000">8. tmpfs / lifecycle boundary</text>
  <text x="960" y="902" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="960" dy="0">tmpfs mount points to host RAM.</tspan>
    <tspan x="960" dy="31">Outside container writable layer.</tspan>
    <tspan x="960" dy="31">Exists only while container is running.</tspan>
    <tspan x="960" dy="31">Container stop → data unavailable.</tspan>
    <tspan x="960" dy="31">Unlike volume/bind: no persistence.</tspan>
  </text>

  <rect x="45" y="1105" width="1710" height="62" rx="14" fill="#17202a"/>
  <text x="76" y="1145" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Главная граница: writable layer — часть lifecycle container; volume/bind — persistence вне container; tmpfs — RAM only.</text>
</svg>