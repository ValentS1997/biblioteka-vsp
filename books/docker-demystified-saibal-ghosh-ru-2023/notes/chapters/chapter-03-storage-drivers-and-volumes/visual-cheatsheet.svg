<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Драйверы хранилища и тома</title>
  <desc id="desc">Компактная шпаргалка: storage driver, overlay2, volumes, bind mounts и tmpfs.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 3 — Драйверы хранилища и тома</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">writable layer vs persistent storage</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Storage driver</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Writes to container read-write layer.</tspan>
    <tspan x="78" dy="34">Choose by kernel + backing filesystem.</tspan>
    <tspan x="78" dy="34">Book preference: overlay2.</tspan>
    <tspan x="78" dy="34">Large persistent data → use volumes.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Overlay2</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">lowerdir = read-only layers</tspan>
    <tspan x="593" dy="34">upperdir = changes / diff</tspan>
    <tspan x="593" dy="34">work = OverlayFS work area</tspan>
    <tspan x="593" dy="34">union mount = merged view</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Backing filesystem</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Docker data root: /var/lib/docker</tspan>
    <tspan x="1108" dy="34">overlay2: XFS / ext4</tspan>
    <tspan x="1108" dy="34">XFS requirement in source: ftype=1</tspan>
    <tspan x="1108" dy="34">btrfs / zfs require matching backing FS.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Volume</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Docker-managed host storage.</tspan>
    <tspan x="78" dy="34">Persists after container deletion.</tspan>
    <tspan x="78" dy="34">Anonymous or named.</tspan>
    <tspan x="78" dy="34">Can be shared by several containers.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Bind mount</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Arbitrary host path ↔ container path.</tspan>
    <tspan x="593" dy="34">Outside Docker-managed area.</tspan>
    <tspan x="593" dy="34">Host and container see same data.</tspan>
    <tspan x="593" dy="34">Data survives container removal.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">tmpfs / change risk</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">tmpfs stores data in host RAM.</tspan>
    <tspan x="1108" dy="34">No persistence after container stops.</tspan>
    <tspan x="1108" dy="34">Storage-driver change is disruptive.</tspan>
    <tspan x="1108" dy="34">Backup /var/lib/docker first.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Правило: container layer — для небольших изменений; persistence — volume/bind; temporary RAM — tmpfs.</text>
</svg>