<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 8 — Безопасность в Docker. Часть 2</title>
  <desc id="desc">Компактная шпаргалка по Docker Enterprise, UCP, DTR, Client Bundle, scanning и RBAC.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 8 — Безопасность в Docker. Часть 2</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Enterprise control plane → registry scanning → RBAC</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Docker Enterprise</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Engine Enterprise</tspan>
    <tspan x="78" dy="34">Universal Control Plane (UCP)</tspan>
    <tspan x="78" dy="34">Docker Trusted Registry (DTR)</tspan>
    <tspan x="78" dy="34">Source-era 2019–2020 platform.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Client Bundle</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Client cert/key + CLI scripts.</tspan>
    <tspan x="593" dy="34">DOCKER_HOST</tspan>
    <tspan x="593" dy="34">DOCKER_CERT_PATH</tspan>
    <tspan x="593" dy="34">DOCKER_TLS_VERIFY</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">DTR scanning</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Image → DTR → CVE scan.</tspan>
    <tspan x="1108" dy="34">Online CVE synchronization.</tspan>
    <tspan x="1108" dy="34">Offline TAR update model.</tspan>
    <tspan x="1108" dy="34">Manual or scan-on-push.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">RBAC subjects</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Users</tspan>
    <tspan x="78" dy="34">Organizations</tspan>
    <tspan x="78" dy="34">Teams</tspan>
    <tspan x="78" dy="34">Subject receives a grant.</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">RBAC roles</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">View Only</tspan>
    <tspan x="593" dy="34">Restricted Control</tspan>
    <tspan x="593" dy="34">Scheduler</tspan>
    <tspan x="593" dy="34">Full Control</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Grant</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Subject</tspan>
    <tspan x="1108" dy="34">+ Role</tspan>
    <tspan x="1108" dy="34">+ Collection / resource set</tspan>
    <tspan x="1108" dy="34">= effective access</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Core idea: authenticate operators, scan image supply, and bind subjects to permissions over defined resource collections.</text>
</svg>