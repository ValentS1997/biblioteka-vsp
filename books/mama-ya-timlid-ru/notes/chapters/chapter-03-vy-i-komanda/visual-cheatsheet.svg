<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <rect width="1200" height="840" fill="white"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 3. Вы и команда</text>
  <text x="60" y="110" font-family="sans-serif" font-size="18">Устойчивость команды: доверие, делегирование, ответственность, защита</text>

  <rect x="60" y="150" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="190" font-family="sans-serif" font-size="23" font-weight="700">Делегирование</text>
  <text x="85" y="225" font-family="sans-serif" font-size="17">• подходящий исполнитель</text>
  <text x="85" y="255" font-family="sans-serif" font-size="17">• ясные сроки и критерии</text>
  <text x="85" y="285" font-family="sans-serif" font-size="17">• логические checkpoints</text>
  <text x="85" y="315" font-family="sans-serif" font-size="17">• «достаточно хорошо» вместо «только как я»</text>

  <rect x="630" y="150" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="655" y="190" font-family="sans-serif" font-size="23" font-weight="700">Ответственность</text>
  <text x="655" y="225" font-family="sans-serif" font-size="17">• право принимать решения</text>
  <text x="655" y="255" font-family="sans-serif" font-size="17">• публично обозначенные полномочия</text>
  <text x="655" y="285" font-family="sans-serif" font-size="17">• признание вклада</text>
  <text x="655" y="315" font-family="sans-serif" font-size="17">• право на исправимую ошибку</text>

  <rect x="60" y="375" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="415" font-family="sans-serif" font-size="23" font-weight="700">Не микроменеджерить</text>
  <text x="85" y="450" font-family="sans-serif" font-size="17">• не контролировать каждую мелочь</text>
  <text x="85" y="480" font-family="sans-serif" font-size="17">• не делать себя точкой всех согласований</text>
  <text x="85" y="510" font-family="sans-serif" font-size="17">• вмешиваться по контрольным этапам</text>
  <text x="85" y="540" font-family="sans-serif" font-size="17">• принимать другой рабочий способ</text>

  <rect x="630" y="375" width="510" height="190" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="655" y="415" font-family="sans-serif" font-size="23" font-weight="700">Успех и провал</text>
  <text x="655" y="450" font-family="sans-serif" font-size="17">Успех → публично разделить признание.</text>
  <text x="655" y="480" font-family="sans-serif" font-size="17">Провал → разобрать причины процесса.</text>
  <text x="655" y="510" font-family="sans-serif" font-size="17">Личная критика → не публичная порка.</text>
  <text x="655" y="540" font-family="sans-serif" font-size="17">Руководитель не снимает с себя ответственность.</text>

  <rect x="60" y="600" width="1080" height="150" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="640" font-family="sans-serif" font-size="23" font-weight="700">Защита и авторитет</text>
  <text x="85" y="675" font-family="sans-serif" font-size="17">Фильтровать лишнюю турбулентность · не отдавать сотрудников под прямой внешний «разнос» · уметь сказать «нет» перегрузу.</text>
  <text x="85" y="708" font-family="sans-serif" font-size="17">Использовать корпоративные ресурсы для команды · зарабатывать доверие пользой, справедливостью и последовательностью.</text>

  <text x="60" y="800" font-family="sans-serif" font-size="16">Provenance: EPUB spine 5 · OPS/ch1-4.xhtml · RAG e0005:c01–c11</text>
</svg>