<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700">Глава 1. Вы стали руководителем</text>
  <text x="60" y="110" font-family="sans-serif" font-size="18">Главная смена: от личного результата к результату команды</text>

  <rect x="60" y="150" width="510" height="150" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="85" y="190" font-family="sans-serif" font-size="24" font-weight="700">Специалист</text>
  <text x="85" y="225" font-family="sans-serif" font-size="18">• экспертность</text>
  <text x="85" y="255" font-family="sans-serif" font-size="18">• качество собственной работы</text>
  <text x="85" y="285" font-family="sans-serif" font-size="18">• соблюдение сроков</text>

  <rect x="630" y="150" width="510" height="150" rx="12" fill="#f4f4f4" stroke="#222"/>
  <text x="655" y="190" font-family="sans-serif" font-size="24" font-weight="700">Руководитель</text>
  <text x="655" y="225" font-family="sans-serif" font-size="18">• команда умеет выполнять задачи</text>
  <text x="655" y="255" font-family="sans-serif" font-size="18">• команда работает качественно</text>
  <text x="655" y="285" font-family="sans-serif" font-size="18">• команда укладывается в сроки</text>

  <text x="60" y="355" font-family="sans-serif" font-size="26" font-weight="700">Приоритеты</text>
  <text x="80" y="395" font-family="sans-serif" font-size="19">1. Сначала проблемы, влияющие на людей и эффективность команды.</text>
  <text x="80" y="430" font-family="sans-serif" font-size="19">2. Найм, мотивация, процессы и административные вопросы — не «второстепенная работа».</text>
  <text x="80" y="465" font-family="sans-serif" font-size="19">3. Индивидуальные задачи руководителя — после критичных командных задач.</text>

  <text x="60" y="525" font-family="sans-serif" font-size="26" font-weight="700">Три управленческие ловушки</text>
  <text x="80" y="565" font-family="sans-serif" font-size="19">• «Я ничего полезного не делаю» → смотреть на устойчивость и результат команды.</text>
  <text x="80" y="600" font-family="sans-serif" font-size="19">• «Сотрудник сильнее меня» → использовать его силу, а не конкурировать.</text>
  <text x="80" y="635" font-family="sans-serif" font-size="19">• «Должен быть правильный ответ» → принять неопределенность и искать опыт/менторство.</text>

  <text x="60" y="705" font-family="sans-serif" font-size="16">Provenance: EPUB spine 3 · OPS/ch1-2.xhtml · RAG e0003:c01–c08</text>
</svg>