<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <rect width="1600" height="1180" fill="white"/>
  <text x="60" y="70" font-family="sans-serif" font-size="38" font-weight="700">Глава 1. Вы стали руководителем — подробная схема</text>
  <text x="60" y="110" font-family="sans-serif" font-size="18">RAG-only · EPUB spine 3 · OPS/ch1-2.xhtml · e0003:c01–c08</text>

  <rect x="60" y="150" width="1480" height="120" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="85" y="190" font-family="sans-serif" font-size="25" font-weight="700">1. Новая ответственность</text>
  <text x="85" y="225" font-family="sans-serif" font-size="18">Специалист отвечает за собственную экспертность, качество и сроки. Руководитель — за способность команды делать работу качественно и вовремя.</text>
  <text x="85" y="252" font-family="sans-serif" font-size="18">Отсюда: найм, мотивация, удержание, процессы, риски, кадровые решения, заказчики и несколько параллельных задач.</text>

  <rect x="60" y="300" width="1480" height="150" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="85" y="340" font-family="sans-serif" font-size="25" font-weight="700">2. Приоритеты руководителя</text>
  <text x="85" y="375" font-family="sans-serif" font-size="18">• Сначала задачи, которые сильнее влияют на других людей и общую эффективность.</text>
  <text x="85" y="405" font-family="sans-serif" font-size="18">• Не откладывать найм, разговоры с демотивированными сотрудниками и административные обязательства ради личной работы.</text>
  <text x="85" y="435" font-family="sans-serif" font-size="18">• Героическое «сделаю сам» не устраняет системную нехватку рук и создает повторяющиеся авралы.</text>

  <rect x="60" y="480" width="710" height="245" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="85" y="520" font-family="sans-serif" font-size="25" font-weight="700">3. Синдром «я ничего не делаю»</text>
  <text x="85" y="555" font-family="sans-serif" font-size="17">• Иногда брать посильные личные задачи.</text>
  <text x="85" y="585" font-family="sans-serif" font-size="17">• Выписывать всю работу за день.</text>
  <text x="85" y="615" font-family="sans-serif" font-size="17">• Отменять лишнее и делегировать возможное.</text>
  <text x="85" y="645" font-family="sans-serif" font-size="17">• Смотреть назад на проекты и исправленные ошибки.</text>
  <text x="85" y="675" font-family="sans-serif" font-size="17">• Иногда спрашивать команду о полезности своего участия.</text>
  <text x="85" y="705" font-family="sans-serif" font-size="17">Постоянная занятость без резерва — опасна при форс-мажоре.</text>

  <rect x="830" y="480" width="710" height="245" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="855" y="520" font-family="sans-serif" font-size="25" font-weight="700">4. Сотрудник сильнее руководителя</text>
  <text x="855" y="555" font-family="sans-serif" font-size="17">Не конкурировать: сначала понять его карьерные цели.</text>
  <text x="855" y="595" font-family="sans-serif" font-size="17">Варианты:</text>
  <text x="875" y="625" font-family="sans-serif" font-size="17">• оставить роли как есть;</text>
  <text x="875" y="655" font-family="sans-serif" font-size="17">• дать новую зону ответственности;</text>
  <text x="875" y="685" font-family="sans-serif" font-size="17">• подготовить заместителя и самому расти;</text>
  <text x="875" y="715" font-family="sans-serif" font-size="17">• расстаться, если роста внутри структуры нет.</text>

  <rect x="60" y="755" width="710" height="230" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="85" y="795" font-family="sans-serif" font-size="25" font-weight="700">5. Решения без правильного ответа</text>
  <text x="85" y="835" font-family="sans-serif" font-size="17">Управление — «одно уравнение и сто переменных».</text>
  <text x="85" y="870" font-family="sans-serif" font-size="17">Результат кадровых решений может проявляться через длительное время.</text>
  <text x="85" y="905" font-family="sans-serif" font-size="17">Поддержка: другие руководители, ментор, собственный начальник, книги, лекции.</text>
  <text x="85" y="940" font-family="sans-serif" font-size="17">Все советы субъективны; решение остается за руководителем.</text>

  <rect x="830" y="755" width="710" height="230" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="855" y="795" font-family="sans-serif" font-size="25" font-weight="700">6. Навыки</text>
  <text x="855" y="835" font-family="sans-serif" font-size="17">Быстрее развиваются обучением:</text>
  <text x="875" y="865" font-family="sans-serif" font-size="17">• публичные выступления; • оценка сроков; • собеседования.</text>
  <text x="855" y="905" font-family="sans-serif" font-size="17">Главным образом нарабатываются опытом:</text>
  <text x="875" y="935" font-family="sans-serif" font-size="17">• эмпатия; • слушание; • контакт; • развитие сильных сторон людей.</text>
  <text x="855" y="970" font-family="sans-serif" font-size="17">До повышения: наблюдать за руководителем и изучать его реальную неделю.</text>

  <rect x="60" y="1020" width="1480" height="100" rx="12" fill="#f6f6f6" stroke="#222"/>
  <text x="85" y="1060" font-family="sans-serif" font-size="24" font-weight="700">Acceptance signal</text>
  <text x="85" y="1095" font-family="sans-serif" font-size="18">Руководитель оценивает себя через работу команды, не прячет командные проблемы за личной занятостью и оставляет емкость для управления неопределенностью.</text>
</svg>