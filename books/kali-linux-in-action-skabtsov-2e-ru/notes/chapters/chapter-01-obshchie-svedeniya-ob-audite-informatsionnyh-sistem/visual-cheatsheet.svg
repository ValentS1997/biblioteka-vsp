<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" fill="#f8fafc"/><text x="44" y="60" fill="#0f172a" font-size="31" font-weight="700">Глава 01 — Допуск к аудиту ИС</text><text x="44" y="93" fill="#475569" font-size="17">Kali Linux в действии · 2-е изд. · RAG PDF pp. 10–18</text><rect x="40" y="130" width="490" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="162" font-size="21" font-weight="700" fill="#0f172a">1. Методологический подход</text><text x="60" y="192" font-size="17" fill="#334155">Понимать цель и контекст проверки</text><text x="60" y="217" font-size="17" fill="#334155">Не подменять аудит готовыми рецептами</text><rect x="565" y="130" width="490" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="585" y="162" font-size="21" font-weight="700" fill="#0f172a">2. Право и этика</text><text x="585" y="192" font-size="17" fill="#334155">Разрешение важнее «благих намерений»</text><text x="585" y="217" font-size="17" fill="#334155">Тесты только в согласованных границах</text><rect x="40" y="325" width="490" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="357" font-size="21" font-weight="700" fill="#0f172a">3. Документы и защита данных</text><text x="60" y="387" font-size="17" fill="#334155">Подписанное разрешение, NDA, договор</text><text x="60" y="412" font-size="17" fill="#334155">Роли, ограничения и допуск к результатам</text><rect x="565" y="325" width="490" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="585" y="357" font-size="21" font-weight="700" fill="#0f172a">4. Контролируемая работа</text><text x="585" y="387" font-size="17" fill="#334155">Тесты → анализ → отчёт → передача</text><text x="585" y="412" font-size="17" fill="#334155">Отклонения согласовать письменно</text><text x="44" y="540" fill="#475569" font-size="15">Основание: chunks p0010:c01–p0018:c01 · Прямых CLI-команд в главе нет</text></svg>