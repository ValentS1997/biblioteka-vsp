<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1480" viewBox="0 0 1380 1480"><rect width="1380" height="1480" fill="#f8fafc"/>
<text x="39" y="56" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Глава 17 · Полный цикл разрешённого пентеста</text>
<text x="39" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Канонический RAG PDF 375–383 · Семь фаз PETS в тексте автора</text>
<rect x="39" y="115" width="1302" height="149" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="150" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">01. Подготовка · p0377–p0379</text><text x="56" y="182" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Stakeholder meeting, критерии результата, объект, ограничения.</text><text x="56" y="208" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Договор, письменное разрешение, contingency и согласованные новые работы.</text>
<rect x="39" y="275" width="1302" height="147" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="310" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">02. Сбор информации · p0379–p0381</text><text x="56" y="342" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Источники публичных, отраслевых, сетевых и иных данных.</text><text x="56" y="368" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Три уровня глубины; исключить неразрешённое расширение scope.</text>
<rect x="39" y="434" width="1302" height="149" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="469" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">03. Моделирование угроз · p0381</text><text x="56" y="501" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Документация, пути атаки, бизнес-процессы и схема сети.</text><text x="56" y="527" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Лабораторные пробы не гарантируют последствия в продуктиве.</text>
<rect x="39" y="594" width="1302" height="147" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="629" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">04. Анализ уязвимостей · p0381</text><text x="56" y="661" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Сведения о сервисах, конфигурациях и потенциальных дефектах.</text><text x="56" y="687" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Отдельный уровень уверенности; не эксплуатировать преждевременно.</text>
<rect x="39" y="753" width="1302" height="149" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="788" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">05. Эксплуатация · p0382</text><text x="56" y="820" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Автор перечисляет password, intercept, session и buffer overflow.</text><text x="56" y="846" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Практический критерий — только заранее согласованная проверка влияния.</text>
<rect x="39" y="913" width="1302" height="147" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="948" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">06. Постэксплуатационная оценка · p0382–p0383</text><text x="56" y="980" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Книга обсуждает повышение прав, persistence, кейлоггеры и удаление логов.</text><text x="56" y="1006" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Не превращать эти действия в обязательный или скрытый workflow.</text>
<rect x="39" y="1072" width="1302" height="148" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="1107" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">07. Отчёт · p0383</text><text x="56" y="1139" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Краткое резюме, уязвимости по важности, сценарии, рекомендации.</text><text x="56" y="1165" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Документировать действия и защищать свидетельства от изменения.</text>
<rect x="39" y="1239" width="1302" height="156" rx="14" fill="#e2e8f0"/>
<text x="60" y="1281" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#0f172a">После отчёта: «Зачистка» — отдельный пункт автора</text>
<text x="60" y="1320" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Вернуть тестовые изменения, убрать созданные учётные записи и утилиты</text>
<text x="60" y="1357" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Не удалять аудитные свидетельства; полный rollback [Needs confirmation]</text>
<text x="39" y="1448" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">Глава 17 заканчивается на p0383; p0384–p0385 — отдельное авторское послесловие; 18 findings.</text></svg>