<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1270" viewBox="0 0 1320 1270"><rect width="1320" height="1270" fill="#f8fafc"/>
<text x="37" y="56" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Глава 13 · Детальная карта evidence integrity</text>
<text x="37" y="88" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Канонический RAG PDF 302–307 · Без изменения журналов</text>
<rect x="37" y="114" width="1246" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="149" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">01. Роль журналов · p0302</text><text x="55" y="180" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Отладка, аудит, производительность, расследование безопасности.</text><text x="55" y="207" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Системные и прикладные логи могут быть распределены.</text>
<rect x="37" y="271" width="1246" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="306" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">02. Локальные vs центральные · p0303</text><text x="55" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Изменение локального файла не удаляет уже отправленную копию.</text><text x="55" y="364" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Но копия и корректное оповещение — разные гарантии.</text>
<rect x="37" y="428" width="1246" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="463" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">03. Аутентификация · p0303–p0304</text><text x="55" y="494" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">SSH Failed password; sudo с TTY, PWD, USER и COMMAND.</text><text x="55" y="521" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Сверять путь журналов и полноту фильтра.</text>
<rect x="37" y="585" width="1246" height="146" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="620" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">04. Веб и приложенческие события · p0304–p0305</text><text x="55" y="651" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Повторные POST к форме входа: возможная аномалия.</text><text x="55" y="678" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">В access log примере нет POST-паролей; HTTP 200 не успех.</text>
<rect x="37" y="743" width="1246" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="778" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">05. Unit-файлы и маскировка · p0305–p0306</text><text x="55" y="809" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Работающая служба не равна записи в списке unit файлов.</text><text x="55" y="836" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Внешне правдоподобное имя не подтверждает происхождение.</text>
<rect x="37" y="900" width="1246" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="935" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">06. Hidden/dot и atime · p0307</text><text x="55" y="966" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Точка в Linux, NTFS hidden, find -atime: способы изменения видимости.</text><text x="55" y="993" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Метаданные и настройки отображения не заменяют инвентаризацию.</text>
<rect x="37" y="1059" width="1246" height="153" rx="15" fill="#e2e8f0"/>
<text x="57" y="1101" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Итог: неизменяемость источника и доказуемость вывода</text>
<text x="57" y="1142" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Проверить разрешения, корреляцию событий, службы и скрытые объекты</text>
<text x="57" y="1176" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#475569">Точный rollback и текущая среда: [Needs confirmation]</text>
<text x="37" y="1243" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">Редакторский защитный синтез; не план сокрытия и не исходные изображения книги.</text></svg>