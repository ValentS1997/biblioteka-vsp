<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1260" viewBox="0 0 1330 1260"><rect width="1330" height="1260" fill="#f8fafc"/>
<text x="38" y="54" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Глава 11 · Детальная карта передачи файлов</text>
<text x="38" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Canonical RAG PDF 287–292 · Сетевая передача в модели угроз</text>
<rect x="38" y="113" width="1252" height="141" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="148" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a" font-weight="700">01. Контекст компрометации · p0287</text><text x="55" y="182" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Злоумышленнику могут потребоваться новые файлы и утилиты.</text><text x="55" y="209" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Легитимный процесс способен участвовать в нежелательной загрузке.</text>
<rect x="38" y="270" width="1252" height="145" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="305" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a" font-weight="700">02. TFTP / atftpd · p0287–p0288</text><text x="55" y="339" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">UDP/69, нет встроенной аутентификации, неинтерактивный режим.</text><text x="55" y="366" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Риск недоверенной передачи и доступа к файлам.</text>
<rect x="38" y="430" width="1252" height="141" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="465" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a" font-weight="700">03. Pure-FTPd · p0288–p0289</text><text x="55" y="499" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Пользователи, база PureDB, права каталогов и FTP-сессия.</text><text x="55" y="526" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Наличие аккаунта не доказывает шифрование канала.</text>
<rect x="38" y="587" width="1252" height="141" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="622" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a" font-weight="700">04. Netcat и PTY · p0290–p0291</text><text x="55" y="656" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Ограниченная оболочка и интерактивная программа — разные режимы.</text><text x="55" y="683" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Удалённый shell в авторском кейсе: только классификация, не запуск.</text>
<rect x="38" y="744" width="1252" height="164" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="779" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a" font-weight="700">05. Windows · p0291–p0292</text><text x="55" y="813" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">FTP command file: неинтерактивная последовательность операций.</text><text x="55" y="840" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">VBScript / WinHttpRequest и PowerShell / WebClient: HTTP-загрузка.</text><text x="55" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Bypass и несовпадение имени скрипта: см. findings.</text>
<rect x="38" y="927" width="1252" height="244" rx="14" fill="#e2e8f0"/>
<text x="60" y="970" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Приёмка защитного анализа</text>
<text x="60" y="1009" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Разрешённая сеть, невыполняемый тестовый файл, минимальные права</text>
<text x="60" y="1047" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Разделить факт загрузки, записи и исполнения; проверить журналы</text>
<text x="60" y="1085" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Не публиковать логины, пароли, post-compromise команды и payload</text>
<text x="60" y="1123" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#475569">Текущие версии и универсальный rollback: [Needs confirmation]</text>
<text x="40" y="1230" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">Схема обобщает текст RAG; не содержит оригинальных рисунков или исполнимых атакующих команд.</text></svg>