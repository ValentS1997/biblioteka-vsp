<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1350" viewBox="0 0 1330 1350"><rect width="1330" height="1350" fill="#f8fafc"/>
<text x="38" y="54" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="30" fill="#0f172a">Глава 12 · Подробная карта persistence и туннелей</text>
<text x="38" y="85" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">РAG PDF 293–301 · Без исполняемых посткомпрометационных инструкций</text>
<rect x="38" y="110" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="144" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">01. Netcat и автозапуск · p0293–p0294</text><text x="56" y="177" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">TCP/UDP и удалённая оболочка в модели автора.</text><text x="56" y="202" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Cron @reboot / rc.d: сохранение процесса после загрузки.</text>
<rect x="38" y="265" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="299" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">02. Обратное соединение · p0294–p0295</text><text x="56" y="332" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Инициирование связи изнутри наружу и повторные попытки.</text><text x="56" y="357" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Смотреть исходящие сессии, родителя процесса и время запуска.</text>
<rect x="38" y="420" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="454" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">03. Перенаправление rinetd · p0295–p0296</text><text x="56" y="487" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Распределение TCP-трафика через внешний доступный узел.</text><text x="56" y="512" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Конфиг с четырьмя полями; изменение создаёт сетевой маршрут.</text>
<rect x="38" y="575" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="609" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">04. SSH Local Port Forwarding · p0297–p0298</text><text x="56" y="642" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Локальная точка принимает поток и проводит через SSH-сессию.</text><text x="56" y="667" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">SSH шифрует соединение, но не подтверждает end-to-end путь.</text>
<rect x="38" y="730" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="764" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">05. Remote и Dynamic forwarding · p0299–p0300</text><text x="56" y="797" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Remote: порт на сервере; Dynamic: локальный SOCKS-прокси.</text><text x="56" y="822" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Proxychains направляет TCP-трафик через прокси: риски pivot.</text>
<rect x="38" y="885" width="1252" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="919" fill="#0f172a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">06. Windows Plink · p0300–p0301</text><text x="56" y="952" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">CLI клиент PuTTY и remote forwarding к RDP в книге.</text><text x="56" y="977" fill="#334155" font-family="DejaVu Sans,sans-serif" font-size="17">Пароль в аргументе -pw — риск раскрытия секрета.</text>
<rect x="38" y="1040" width="1252" height="243" rx="15" fill="#e2e8f0"/>
<text x="60" y="1084" font-size="23" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#0f172a">Защитная приёмка</text>
<text x="60" y="1126" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#334155">1. Авторизованный baseline служб, cron, shell и SSH-сессий</text>
<text x="60" y="1164" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#334155">2. Сопоставление listening/outbound портов с change records</text>
<text x="60" y="1202" font-size="18" font-family="DejaVu Sans,sans-serif" fill="#334155">3. Отчёт без паролей, приватных ключей и рабочих backdoor-команд</text>
<text x="60" y="1240" font-size="16" font-family="DejaVu Sans,sans-serif" fill="#475569">Завершение найденного канала только по согласованному плану восстановления</text>
<text x="38" y="1321" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">Редакторская карта, не оригинальный рисунок; source-findings.md фиксирует 12 оговорок.</text></svg>