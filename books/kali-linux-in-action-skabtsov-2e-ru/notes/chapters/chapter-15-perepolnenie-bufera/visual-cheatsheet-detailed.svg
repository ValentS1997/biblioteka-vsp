<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1430" viewBox="0 0 1360 1430"><rect width="1360" height="1430" fill="#f8fafc"/>
<text x="38" y="55" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Глава 15 · Детальная карта memory-safety анализа</text><text x="38" y="88" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">PDF 332–360 · Концептуальный синтез RAG, не эксплойт</text>
<rect x="38" y="114" width="1284" height="144" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="150" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">01. Данные и границы · p0332–p0334</text><text x="56" y="182" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Строка, сеть, файл, CLI и окружение могут быть недоверенными.</text><text x="56" y="209" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Выход за границы буфера способен испортить данные или процесс.</text>
<rect x="38" y="269" width="1284" height="143" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="305" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">02. Привилегии / бинарник · p0334–p0335</text><text x="56" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Компиляция и библиотеки, пользовательские права и suid.</text><text x="56" y="364" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Повышенные привилегии увеличивают возможный ущерб ошибки.</text>
<rect x="38" y="424" width="1284" height="144" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="460" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">03. Сегменты · p0336–p0338</text><text x="56" y="492" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Text, initialized data, BSS, stack, heap; malloc/free.</text><text x="56" y="519" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Модель адресного пространства зависит от архитектуры/ОС.</text>
<rect x="38" y="580" width="1284" height="143" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="616" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">04. Стек и указатели · p0338–p0344</text><text x="56" y="648" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">BP, SP, IP, stack frame, пролог, эпилог, return address.</text><text x="56" y="675" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Описано повреждение управления, но не универсальный RCE.</text>
<rect x="38" y="735" width="1284" height="144" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="771" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">05. Разновидности · p0345–p0349</text><text x="56" y="803" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Off-by-one, return-into-libc, heap и function pointer.</text><text x="56" y="830" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">В книге есть упрощения о little-endian, слово/бит/байт.</text>
<rect x="38" y="890" width="1284" height="143" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="926" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">06. Лабораторный отказ · p0349–p0354</text><text x="56" y="958" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Easy File Sharing Web Server, Spike, Burp, OllyDbg.</text><text x="56" y="985" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Длины запроса противоречат друг другу; EIP и SEH различаются.</text>
<rect x="38" y="1045" width="1284" height="145" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="1081" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">07. Исторический exploit-кейс · p0355–p0360</text><text x="56" y="1113" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">SafeSEH/ASLR и дальнейшая попытка code execution.</text><text x="56" y="1140" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Никакие offset, gadget addresses, shellcode и HTTP payload не приводятся.</text>
<rect x="38" y="1206" width="1284" height="155" rx="14" fill="#e2e8f0"/>
<text x="60" y="1249" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Приёмка: подтверждённые факты, безопасное исправление</text>
<text x="60" y="1291" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Проверить границы, права, локализацию дефекта, граничные тесты</text>
<text x="60" y="1329" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#475569">Без запуска exploit и вмешательства в продуктивные сервисы</text>
