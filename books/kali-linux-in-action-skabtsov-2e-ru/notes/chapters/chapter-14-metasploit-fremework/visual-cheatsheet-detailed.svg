<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1395" viewBox="0 0 1340 1395"><rect width="1340" height="1395" fill="#f8fafc"/>
<text x="38" y="55" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="30" fill="#0f172a">Глава 14 · Детальная карта Metasploit Framework</text>
<text x="38" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Source RAG PDF 308–331 · Инструменты и последствия без запуска</text>
<rect x="38" y="114" width="1264" height="142" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="150" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">01. Модульная платформа · p0308–p0310</text><text x="57" y="184" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Exploit, Auxiliary, Post, Payload, NOP, Encoder, Evasion.</text><text x="57" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">msfconsole, msfvenom, DB, RPC; исторические GUI-средства.</text>
<rect x="38" y="271" width="1264" height="142" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="307" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">02. Auxiliary · p0311–p0315</text><text x="57" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Сканер TCP и FTP Auth: Required, defaults, нагрузка, THREADS.</text><text x="57" y="368" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Активные модули могут влиять на сеть и учётные записи.</text>
<rect x="38" y="427" width="1264" height="144" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="463" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">03. Payload · p0315–p0318</text><text x="57" y="497" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Singles, Stagers, Stages; генерация shellcode описана в книге.</text><text x="57" y="524" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Здесь сохраняется только классификация, не байтовые данные.</text>
<rect x="38" y="587" width="1264" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="623" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">04. Exploit / Encoder · p0318–p0322</text><text x="57" y="657" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Каталог уязвимостей и преобразование представления кода.</text><text x="57" y="684" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Rank и encoder не равны доказанному риску или обходу AV.</text>
<rect x="38" y="744" width="1264" height="143" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="780" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">05. NOP, Post, Evasion, CLI · p0323–p0326</text><text x="57" y="814" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">NOOP понятия; post-exploitation и обход обнаружения.</text><text x="57" y="841" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">help/info read-only; route/save/makerc меняют состояние.</text>
<rect x="38" y="902" width="1264" height="142" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="938" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">06. WMAP · p0327–p0328</text><text x="57" y="972" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Активный скан учебного Juice Shop, каталог результатов.</text><text x="57" y="999" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">HTTP 200/500 и найденная директория не равны exploit.</text>
<rect x="38" y="1058" width="1264" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="1094" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="22" fill="#0f172a">07. EasyFTP · p0329–p0331</text><text x="57" y="1128" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Исторический пример stack overflow в CWD и Meterpreter.</text><text x="57" y="1155" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Результат автора нельзя выдавать за нынешнюю доступность.</text>
<rect x="38" y="1218" width="1264" height="118" rx="15" fill="#e2e8f0"/>
<text x="58" y="1259" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Приёмка: scope, эффект, доказательства и отсутствие секретов</text>
<text x="58" y="1301" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Никаких новых сканирований, payload, эксплуатаций и AV-evasion испытаний</text>
<text x="38" y="1368" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">15 caveats documented in source-findings.md · Версии и rollback [Needs confirmation]</text></svg>