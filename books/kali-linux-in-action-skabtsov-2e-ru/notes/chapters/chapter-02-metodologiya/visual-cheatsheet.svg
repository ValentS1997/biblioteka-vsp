<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="40" y="53" font-size="31" font-weight="bold" fill="#0f172a">Глава 02 · Методология аудита ИС</text><text x="40" y="83" font-size="17" fill="#475569">Никита Скабцов · 2-е изд. · RAG PDF pp. 19–28</text><rect x="38" y="113" width="542" height="182" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="145" font-size="20" font-weight="bold" fill="#172334">ISSAF: 3 фазы</text><text x="56" y="177" font-size="17" fill="#334155">Подготовка → аудит ИС → отчётность</text><text x="56" y="204" font-size="17" fill="#334155">Сети, хосты, приложения, БД</text><text x="56" y="231" font-size="17" fill="#334155">Детальность аудита; оговорённое устаревание</text><rect x="617" y="113" width="542" height="182" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="635" y="145" font-size="20" font-weight="bold" fill="#172334">OSSTMM: 7 каналов</text><text x="635" y="177" font-size="17" fill="#334155">Сети / приложения / операционные системы</text><text x="635" y="204" font-size="17" fill="#334155">Физика / люди / беспроводная связь</text><text x="635" y="231" font-size="17" fill="#334155">Телекоммуникации; повторяемые модули</text><rect x="38" y="313" width="542" height="182" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="345" font-size="20" font-weight="bold" fill="#172334">Контроль scope и риска</text><text x="56" y="377" font-size="17" fill="#334155">Цель, границы, контакты, тестовая среда</text><text x="56" y="404" font-size="17" fill="#334155">Уязвимости → оценка и приоритеты</text><text x="56" y="431" font-size="17" fill="#334155">Активные проверки — только по допуску</text><rect x="617" y="313" width="542" height="182" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="635" y="345" font-size="20" font-weight="bold" fill="#172334">Измеримый результат</text><text x="635" y="377" font-size="17" fill="#334155">Анализ и повторная оценка рисков</text><text x="635" y="404" font-size="17" fill="#334155">Отчёт с целями, сроками и находками</text><text x="635" y="431" font-size="17" fill="#334155">Рекомендации; учёт тестовых файлов</text><rect x="38" y="520" width="1121" height="116" rx="14" fill="#e2e8f0"/><text x="58" y="554" font-size="21" font-weight="bold" fill="#0f172a">Метод выбирают под задачу, а не наоборот.</text><text x="58" y="584" font-size="18" fill="#334155">Конкретных CLI-команд в главе нет · Технический rollback: [Needs confirmation]</text><text x="42" y="681" font-size="15" fill="#64748b">RAG chunks p0019:c01–p0028:c01 · Только источник, без внешних правок</text></svg>