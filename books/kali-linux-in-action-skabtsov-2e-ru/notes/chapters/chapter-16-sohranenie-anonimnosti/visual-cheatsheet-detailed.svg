<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1420" viewBox="0 0 1350 1420"><rect width="1350" height="1420" fill="#f8fafc"/>
<text x="39" y="56" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Глава 16 · Детальная карта приватности</text>
<text x="39" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Канонический RAG PDF 361–374 · Без активного обхода сетевых правил</text>
<rect x="39" y="116" width="1272" height="144" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="151" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">01. Основания и пределы · p0361–p0362</text><text x="57" y="183" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Анонимность в авторском пентесте: сокрытие, доступ, защита людей.</text><text x="57" y="210" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Законные полномочия и согласованный scope остаются обязательными.</text>
<rect x="39" y="271" width="1272" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="306" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">02. Digital fingerprint · p0362–p0363</text><text x="57" y="338" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">IP, устройства, cookies, поиск, рекламные события, geo и аккаунты.</text><text x="57" y="365" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Снижение одного сигнала не устраняет остальные.</text>
<rect x="39" y="427" width="1272" height="144" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="462" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">03. Расширения Firefox · p0363–p0364</text><text x="57" y="494" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Facebook Container, Decentraleyes и AdNauseam.</text><text x="57" y="521" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Текущая поддержка и эффективность: [Needs confirmation].</text>
<rect x="39" y="582" width="1272" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="617" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">04. Proxy, mixed networks и веб-сервисы · p0364–p0369</text><text x="57" y="649" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Google Translate, Ultrasurf, JonDo, HMA, Geonode: авторские примеры.</text><text x="57" y="676" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Посредник может журналировать действия; публичные узлы ненадёжны.</text>
<rect x="39" y="738" width="1272" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="773" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">05. VPN · p0370–p0372</text><text x="57" y="805" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">L2TP/IPsec, OpenVPN и WireGuard: разные варианты защиты туннеля.</text><text x="57" y="832" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Владелец сервера и конечный ресурс сохраняют отдельные данные.</text>
<rect x="39" y="894" width="1272" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="929" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">06. Tor и I2P · p0372–p0373</text><text x="57" y="961" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Маршрутизация через промежуточные узлы и специальные сети.</text><text x="57" y="988" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Анонимность в любой модели наблюдателя не доказана.</text>
<rect x="39" y="1050" width="1272" height="145" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="1085" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">07. Tails live OS · p0373–p0374</text><text x="57" y="1117" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Tor Browser, OnionShare, Thunderbird, парольные/crypto утилиты.</text><text x="57" y="1144" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Отсутствие локальных следов не исключает следы во внешних системах.</text>
<rect x="39" y="1214" width="1272" height="136" rx="15" fill="#e2e8f0"/>
<text x="60" y="1255" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Результат: ограниченная, проверяемая модель приватности</text>
<text x="60" y="1293" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Разрешения, владелец посредника, сетевые логи и неопределённости</text>
<text x="39" y="1390" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">21 source finding · Современная совместимость и rollback [Needs confirmation]</text></svg>