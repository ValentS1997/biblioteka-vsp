<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1310" viewBox="0 0 1330 1310"><rect width="1330" height="1310" fill="#f8fafc"/><text x="38" y="54" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Глава 10 · Детальная карта анализа сетевого трафика</text><text x="38" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#475569">Canonical RAG PDF 272–286 · Без активного перехвата</text>
<rect x="38" y="113" width="1252" height="136" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="148" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">01. Топология и кадры · p0272–p0273</text><text x="57" y="180" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">MAC/broadcast/multicast, hub и switch, границы наблюдаемости.</text><text x="57" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Доступ к сетевому интерфейсу не означает доступ ко всему обмену.</text>
<rect x="38" y="262" width="1252" height="149" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="297" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#0f172a">02. Wireshark · p0273–p0277</text><text x="57" y="329" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Capture filters ограничивают запись; display filters меняют представление.</text><text x="57" y="355" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Follow HTTP stream демонстрирует риск открытых учётных данных.</text><text x="57" y="381" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">В книге имеются опечатки запуска и названия элемента UI.</text>
<rect x="38" y="424" width="1252" height="149" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="459" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#0f172a">03. tcpdump · p0278–p0282</text><text x="57" y="491" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">-w записывает живой трафик; -r читает уже полученный PCAP.</text><text x="57" y="517" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Адресные/портовые и TCP-фильтры; HEX/ASCII может открыть секреты.</text><text x="57" y="543" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#334155">Сначала минимизировать и защитить доказательства.</text>
<rect x="38" y="586" width="1252" height="135" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="621" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">04. CAM table overflow · p0282–p0283</text><text x="57" y="653" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Воздействие на таблицу MAC→порт, возможная деградация сети.</text><text x="57" y="679" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Поведение конкретного switch — [Needs confirmation].</text>
<rect x="38" y="734" width="1252" height="142" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="769" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">05. Ettercap и подмена · p0283–p0285</text><text x="57" y="801" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">ARP poisoning, DHCP spoofing, ICMP redirection, port stealing.</text><text x="57" y="827" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Это изменение обмена, не пассивное чтение данных.</text>
<rect x="38" y="889" width="1252" height="135" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="924" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#0f172a">06. MAC-контроль · p0286</text><text x="57" y="956" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">В книге обсуждается изменение адреса интерфейса и сетевые ограничения.</text><text x="57" y="982" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#334155">Обход авторизации не подтверждён, команды не воспроизводятся.</text>
<rect x="38" y="1038" width="1252" height="205" rx="14" fill="#e2e8f0"/><text x="60" y="1079" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Приёмка защитного результата</text><text x="60" y="1119" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Разрешённый PCAP + документированное происхождение</text><text x="60" y="1157" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Метаданные и обезличенные доказательства без payload/секретов</text><text x="60" y="1195" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Оценка MitM-рисков без активной подмены или нарушения связи</text>
<text x="40" y="1284" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#64748b">Интерпретация текста RAG, не рисунок из книги. Исторические CLI и rollback: [Needs confirmation].</text></svg>