<rect x="38" y="403" width="1244" height="128" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="437" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">3 · Онлайн-режим (262–265)</text><text x="58" y="468" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Medusa, Crowbar, Hydra: активные запросы и риск блокировок.</text>
<rect x="38" y="547" width="1244" height="128" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="581" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">4 · Хеш и соль (266)</text><text x="58" y="612" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Односторонность не делает слабый пароль непроверяемым.</text>
<rect x="38" y="691" width="1244" height="128" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="725" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">5 · Хранилища Windows/Unix (267–269)</text><text x="58" y="756" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">SAM, LM/NTLM, shadow; работа с чувствительными данными.</text>
