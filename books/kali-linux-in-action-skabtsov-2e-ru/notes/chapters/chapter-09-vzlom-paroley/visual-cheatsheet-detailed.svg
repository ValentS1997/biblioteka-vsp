<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1250" viewBox="0 0 1320 1250"><rect width="1320" height="1250" fill="#f8fafc"/><text x="38" y="56" font-size="31" font-weight="700" font-family="DejaVu Sans,sans-serif" fill="#0f172a">Глава 09 · Подробная карта контроля паролей</text><text x="38" y="87" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#475569">Canonical RAG PDF 258–271 · Без реальных учётных данных</text>
<rect x="38" y="115" width="1244" height="128" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="149" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#0f172a">1 · Подходы к проверкам (258–259)</text><text x="58" y="180" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#334155">Перебор вариантов и словари; время и ограничения сервиса.</text>
