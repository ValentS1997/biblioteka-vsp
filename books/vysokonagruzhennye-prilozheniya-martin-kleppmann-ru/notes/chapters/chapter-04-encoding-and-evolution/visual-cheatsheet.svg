<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#0f172a"/>
<text x="55" y="68" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 4 — encoding &amp; evolution</text>
<text x="55" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 143–178 · old/new code coexist</text>

<rect x="55" y="150" width="515" height="380" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="200" fill="#38bdf8" font-family="sans-serif" font-size="27" font-weight="700">Compatibility</text>
<text x="85" y="245" fill="#f8fafc" font-family="sans-serif" font-size="19">Backward: new reader ← old data</text>
<text x="85" y="285" fill="#f8fafc" font-family="sans-serif" font-size="19">Forward: old reader ← new data</text>
<text x="85" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="17">Thrift / Protobuf: stable field tags</text>
<text x="85" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="17">Avro: writer schema ↔ reader schema</text>
<text x="85" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="17">Defaults / unknown fields matter</text>
<text x="85" y="465" fill="#f8fafc" font-family="sans-serif" font-size="18">Rolling upgrade = real compatibility test</text>

<rect x="630" y="150" width="515" height="380" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="660" y="200" fill="#a78bfa" font-family="sans-serif" font-size="27" font-weight="700">Data-flow modes</text>
<text x="660" y="245" fill="#f8fafc" font-family="sans-serif" font-size="19">Database</text>
<text x="690" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="17">data outlives code versions</text>
<text x="660" y="325" fill="#f8fafc" font-family="sans-serif" font-size="19">REST / RPC</text>
<text x="690" y="358" fill="#cbd5e1" font-family="sans-serif" font-size="17">network call ≠ local call</text>
<text x="660" y="405" fill="#f8fafc" font-family="sans-serif" font-size="19">Async messaging / actors</text>
<text x="690" y="438" fill="#cbd5e1" font-family="sans-serif" font-size="17">producer / consumer evolve independently</text>

<rect x="55" y="575" width="1090" height="120" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="620" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Operational rule</text>
<text x="85" y="658" fill="#cbd5e1" font-family="sans-serif" font-size="19">schema/API delta → backward test → forward test → staged rollout → observe → keep/rollback</text>
</svg>