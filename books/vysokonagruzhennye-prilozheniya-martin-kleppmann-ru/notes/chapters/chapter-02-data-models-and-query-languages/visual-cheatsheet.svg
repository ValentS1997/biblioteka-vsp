<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 2 — модели данных и языки запросов</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 53–95 · relational ↔ document ↔ graph</text>

<rect x="55" y="145" width="335" height="350" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="27" font-weight="700">Relational</text>
<text x="85" y="238" fill="#f8fafc" font-family="sans-serif" font-size="19">tables · IDs · joins</text>
<text x="85" y="282" fill="#cbd5e1" font-family="sans-serif" font-size="17">many-to-one / many-to-many</text>
<text x="85" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="17">normalization ↓ duplication</text>
<text x="85" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="17">schema often on write</text>
<text x="85" y="430" fill="#f8fafc" font-family="sans-serif" font-size="18">SQL: declarative</text>

<rect x="432" y="145" width="335" height="350" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="27" font-weight="700">Document</text>
<text x="462" y="238" fill="#f8fafc" font-family="sans-serif" font-size="19">JSON · locality · trees</text>
<text x="462" y="282" fill="#cbd5e1" font-family="sans-serif" font-size="17">natural one-to-many</text>
<text x="462" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="17">weak joins → app complexity</text>
<text x="462" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="17">schema-on-read possible</text>
<text x="462" y="430" fill="#f8fafc" font-family="sans-serif" font-size="18">MapReduce / aggregation</text>

<rect x="809" y="145" width="335" height="350" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="27" font-weight="700">Graph</text>
<text x="839" y="238" fill="#f8fafc" font-family="sans-serif" font-size="19">vertices · edges · labels</text>
<text x="839" y="282" fill="#cbd5e1" font-family="sans-serif" font-size="17">dense many-to-many</text>
<text x="839" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="17">variable-length traversal</text>
<text x="839" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="17">pattern matching</text>
<text x="839" y="430" fill="#f8fafc" font-family="sans-serif" font-size="18">Cypher · SPARQL · Datalog</text>

<rect x="55" y="535" width="1089" height="145" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="580" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Query rule</text>
<text x="85" y="620" fill="#cbd5e1" font-family="sans-serif" font-size="19">Declarative: describe WHAT you want → optimizer decides HOW.</text>
<text x="85" y="653" fill="#cbd5e1" font-family="sans-serif" font-size="19">Choose by data shape + relationships + access pattern, not SQL/NoSQL label.</text>
<text x="405" y="722" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">polyglot persistence is valid</text>
</svg>