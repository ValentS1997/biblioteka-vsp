<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 6 — Секционирование</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 239–263 · range ↔ hash ↔ hybrid</text>

<rect x="55" y="145" width="335" height="385" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">Range</text>
<text x="85" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">ordered key ranges</text>
<text x="85" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="17">+ efficient range queries</text>
<text x="85" y="309" fill="#cbd5e1" font-family="sans-serif" font-size="17">− sequential hot spots</text>
<text x="85" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="17">dynamic split / merge</text>
<text x="85" y="400" fill="#f8fafc" font-family="sans-serif" font-size="18">Watch:</text>
<text x="85" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="16">data skew · request skew</text>
<text x="85" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="16">timestamp-first keys</text>

<rect x="432" y="145" width="335" height="385" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="26" font-weight="700">Hash</text>
<text x="462" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">hash(key) → partition</text>
<text x="462" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="17">+ more even distribution</text>
<text x="462" y="309" fill="#cbd5e1" font-family="sans-serif" font-size="17">− loses range locality</text>
<text x="462" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="17">avoid hash(key) mod N</text>
<text x="462" y="400" fill="#f8fafc" font-family="sans-serif" font-size="18">Hybrid:</text>
<text x="462" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="16">partition key + local sort key</text>

<rect x="809" y="145" width="335" height="385" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">Indexes &amp; routing</text>
<text x="839" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Local index</text>
<text x="839" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">cheap write · scatter/gather read</text>
<text x="839" y="315" fill="#f8fafc" font-family="sans-serif" font-size="18">Global index</text>
<text x="839" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="16">targeted read · distributed write</text>
<text x="839" y="400" fill="#f8fafc" font-family="sans-serif" font-size="18">Routing</text>
<text x="839" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="16">forwarding · routing tier · smart client</text>
<text x="839" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="16">metadata must stay current</text>

<rect x="55" y="575" width="1089" height="125" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="620" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Rebalancing rule</text>
<text x="85" y="658" fill="#cbd5e1" font-family="sans-serif" font-size="19">keep reads/writes available · move only necessary data · avoid cascading overload</text>
<text x="270" y="752" fill="#f8fafc" font-family="sans-serif" font-size="21" font-weight="700">measure distribution → change placement → remeasure</text>
</svg>