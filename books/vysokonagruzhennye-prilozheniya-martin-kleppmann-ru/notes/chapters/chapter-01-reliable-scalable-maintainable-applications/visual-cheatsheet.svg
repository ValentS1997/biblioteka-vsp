<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 1 — три оси хорошей информационной системы</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 23–51 · Клеппман</text>

  <rect x="60" y="150" width="330" height="420" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="90" y="205" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">Надежность</text>
  <text x="90" y="250" fill="#f8fafc" font-family="sans-serif" font-size="20">fault ≠ failure</text>
  <text x="90" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="18">• hardware faults</text>
  <text x="90" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="18">• software faults</text>
  <text x="90" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="18">• human errors</text>
  <text x="90" y="418" fill="#f8fafc" font-family="sans-serif" font-size="18">Цель: локальный fault</text>
  <text x="90" y="447" fill="#f8fafc" font-family="sans-serif" font-size="18">не становится failure</text>
  <text x="90" y="505" fill="#cbd5e1" font-family="sans-serif" font-size="17">isolation · testing · monitoring</text>
  <text x="90" y="535" fill="#cbd5e1" font-family="sans-serif" font-size="17">recovery · rollback</text>

  <rect x="435" y="150" width="330" height="420" rx="20" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="465" y="205" fill="#a78bfa" font-family="sans-serif" font-size="28" font-weight="700">Масштабируемость</text>
  <text x="465" y="250" fill="#f8fafc" font-family="sans-serif" font-size="20">load → measure → scale</text>
  <text x="465" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="18">• load parameters</text>
  <text x="465" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="18">• throughput / response time</text>
  <text x="465" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="18">• p50 / p95 / p99 / p999</text>
  <text x="465" y="418" fill="#f8fafc" font-family="sans-serif" font-size="18">vertical · horizontal · hybrid</text>
  <text x="465" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="17">Twitter: fan-out меняет</text>
  <text x="465" y="494" fill="#cbd5e1" font-family="sans-serif" font-size="17">стоимость read/write path</text>
  <text x="465" y="535" fill="#cbd5e1" font-family="sans-serif" font-size="17">tail latency важнее среднего</text>

  <rect x="810" y="150" width="330" height="420" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
  <text x="840" y="205" fill="#34d399" font-family="sans-serif" font-size="28" font-weight="700">Сопровождение</text>
  <text x="840" y="250" fill="#f8fafc" font-family="sans-serif" font-size="20">operability</text>
  <text x="840" y="285" fill="#f8fafc" font-family="sans-serif" font-size="20">simplicity</text>
  <text x="840" y="320" fill="#f8fafc" font-family="sans-serif" font-size="20">evolvability</text>
  <text x="840" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="18">monitoring · automation</text>
  <text x="840" y="414" fill="#cbd5e1" font-family="sans-serif" font-size="18">predictable operations</text>
  <text x="840" y="448" fill="#cbd5e1" font-family="sans-serif" font-size="18">good abstractions</text>
  <text x="840" y="482" fill="#cbd5e1" font-family="sans-serif" font-size="18">lower incidental complexity</text>
  <text x="840" y="535" fill="#cbd5e1" font-family="sans-serif" font-size="17">изменения — нормальное состояние</text>

  <path d="M225 610 H975" stroke="#64748b" stroke-width="3"/>
  <text x="330" y="660" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">baseline → controlled change → same measurement → keep / rollback</text>
</svg>