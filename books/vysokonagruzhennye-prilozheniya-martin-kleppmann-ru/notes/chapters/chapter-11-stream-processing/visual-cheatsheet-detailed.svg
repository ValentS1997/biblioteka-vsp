<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160">
<rect width="1400" height="1160" fill="#f8fafc"/>
<text x="55" y="65" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">Глава 11 — Потоковая обработка</text>
<text x="55" y="102" fill="#475569" font-family="sans-serif" font-size="18">Canonical RAG · PDF 505–561 · source SHA 495e75f185c758a8…</text>

<rect x="55" y="140" width="1290" height="110" rx="18" fill="#e2e8f0"/>
<text x="85" y="184" fill="#0f172a" font-family="sans-serif" font-size="23" font-weight="700">A replayable event log turns unbounded change into continuously maintainable derived state.</text>
<text x="85" y="220" fill="#334155" font-family="sans-serif" font-size="18">Correctness depends on ordering, offsets, event time, state recovery and sink-side duplicate semantics.</text>

<rect x="55" y="285" width="400" height="525" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="85" y="330" fill="#075985" font-family="sans-serif" font-size="26" font-weight="700">11.1 Event transport</text>
<text x="85" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">AMQP/JMS-like</text>
<text x="85" y="402" fill="#334155" font-family="sans-serif" font-size="16">acknowledge then remove</text>
<text x="85" y="432" fill="#334155" font-family="sans-serif" font-size="16">task queue / async RPC fit</text>
<text x="85" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Log-based broker</text>
<text x="85" y="502" fill="#334155" font-family="sans-serif" font-size="16">partitioned append-only log</text>
<text x="85" y="532" fill="#334155" font-family="sans-serif" font-size="16">consumer offset tracks progress</text>
<text x="85" y="562" fill="#334155" font-family="sans-serif" font-size="16">replay old retained events</text>
<text x="85" y="602" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Operational boundary</text>
<text x="85" y="632" fill="#334155" font-family="sans-serif" font-size="16">lag must remain inside retention window</text>
<text x="85" y="682" fill="#075985" font-family="sans-serif" font-size="16">Order is scoped to the log partition</text>

<rect x="500" y="285" width="400" height="525" rx="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="530" y="330" fill="#6b21a8" font-family="sans-serif" font-size="26" font-weight="700">11.2 Databases &amp; streams</text>
<text x="530" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">CDC</text>
<text x="530" y="402" fill="#334155" font-family="sans-serif" font-size="16">DB log → ordered change stream</text>
<text x="530" y="432" fill="#334155" font-family="sans-serif" font-size="16">snapshot + known log position</text>
<text x="530" y="462" fill="#334155" font-family="sans-serif" font-size="16">compaction retains latest value/key</text>
<text x="530" y="502" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Event sourcing</text>
<text x="530" y="532" fill="#334155" font-family="sans-serif" font-size="16">domain events are primary history</text>
<text x="530" y="562" fill="#334155" font-family="sans-serif" font-size="16">state is a projection</text>
<text x="530" y="602" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">CQRS</text>
<text x="530" y="632" fill="#334155" font-family="sans-serif" font-size="16">write log ≠ read representation</text>
<text x="530" y="682" fill="#6b21a8" font-family="sans-serif" font-size="16">Derived views may lag asynchronously</text>

<rect x="945" y="285" width="400" height="525" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="975" y="330" fill="#166534" font-family="sans-serif" font-size="26" font-weight="700">11.3 Stream processing</text>
<text x="975" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Time / windows</text>
<text x="975" y="402" fill="#334155" font-family="sans-serif" font-size="16">event time ≠ processing time</text>
<text x="975" y="432" fill="#334155" font-family="sans-serif" font-size="16">tumbling · hopping · sliding · session</text>
<text x="975" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Joins</text>
<text x="975" y="502" fill="#334155" font-family="sans-serif" font-size="16">stream–stream: temporal match</text>
<text x="975" y="532" fill="#334155" font-family="sans-serif" font-size="16">stream–table: enrich from current state</text>
<text x="975" y="562" fill="#334155" font-family="sans-serif" font-size="16">table–table: materialized view maintenance</text>
<text x="975" y="602" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Fault tolerance</text>
<text x="975" y="632" fill="#334155" font-family="sans-serif" font-size="16">checkpoint / transaction / idempotence</text>
<text x="975" y="662" fill="#334155" font-family="sans-serif" font-size="16">state + offset must recover consistently</text>
<text x="975" y="692" fill="#334155" font-family="sans-serif" font-size="16">dedup can store last applied offset</text>

<rect x="55" y="850" width="1290" height="220" rx="18" fill="#0f172a"/>
<text x="85" y="895" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Acceptance checklist</text>
<text x="85" y="935" fill="#cbd5e1" font-family="sans-serif" font-size="18">1. Consumer restart resumes from the expected offset and replay reproduces logical state.</text>
<text x="85" y="970" fill="#cbd5e1" font-family="sans-serif" font-size="18">2. CDC/projection bootstraps from a consistent snapshot plus matching log position.</text>
<text x="85" y="1005" fill="#cbd5e1" font-family="sans-serif" font-size="18">3. Late/out-of-order events follow explicit event-time/window correction semantics.</text>
<text x="85" y="1040" fill="#cbd5e1" font-family="sans-serif" font-size="18">4. Failure recovery restores state and offset together without duplicate visible sink effects.</text>

<text x="225" y="1130" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">Streaming is continuously replayable derived-data maintenance over an unbounded history of change.</text>
</svg>