<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 8 — Проблемы распределенных систем</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 323–373 · uncertainty is the core problem</text>

<rect x="55" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">Network</text>
<text x="85" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">no response ≠ known failure</text>
<text x="85" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="17">loss · delay · queues · pause</text>
<text x="85" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="17">request may execute; reply may vanish</text>
<text x="85" y="355" fill="#f8fafc" font-family="sans-serif" font-size="18">Timeout</text>
<text x="85" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="16">suspicion, not proof</text>
<text x="85" y="425" fill="#cbd5e1" font-family="sans-serif" font-size="16">measure latency + jitter</text>
<text x="85" y="460" fill="#cbd5e1" font-family="sans-serif" font-size="16">false positives can cascade</text>

<rect x="432" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="26" font-weight="700">Time &amp; pauses</text>
<text x="462" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Real-time clock</text>
<text x="462" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">calendar time · may jump</text>
<text x="462" y="315" fill="#f8fafc" font-family="sans-serif" font-size="18">Monotonic clock</text>
<text x="462" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="16">duration / timeout</text>
<text x="462" y="395" fill="#f8fafc" font-family="sans-serif" font-size="18">Process pause</text>
<text x="462" y="430" fill="#cbd5e1" font-family="sans-serif" font-size="16">GC · scheduling · VM pause</text>
<text x="462" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="16">lease may expire while paused</text>

<rect x="809" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">Truth &amp; safety</text>
<text x="839" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Quorum / coordination</text>
<text x="839" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">one node cannot know global truth</text>
<text x="839" y="315" fill="#f8fafc" font-family="sans-serif" font-size="18">Fencing token</text>
<text x="839" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="16">monotonic token rejects stale holder</text>
<text x="839" y="395" fill="#f8fafc" font-family="sans-serif" font-size="18">Correctness</text>
<text x="839" y="430" fill="#cbd5e1" font-family="sans-serif" font-size="16">safety: never wrong</text>
<text x="839" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="16">liveness: eventually progress</text>

<rect x="55" y="585" width="1089" height="125" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="630" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Operational rule</text>
<text x="85" y="668" fill="#cbd5e1" font-family="sans-serif" font-size="19">assumption → fault scenario → observe uncertainty → minimal control → repeat → verify safety/liveness</text>
<text x="285" y="752" fill="#f8fafc" font-family="sans-serif" font-size="21" font-weight="700">A timeout tells you that you waited long enough — nothing more.</text>
</svg>