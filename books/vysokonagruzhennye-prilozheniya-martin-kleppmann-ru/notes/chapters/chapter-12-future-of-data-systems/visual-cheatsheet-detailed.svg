<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160">
<rect width="1400" height="1160" fill="#f8fafc"/>
<text x="55" y="65" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">Глава 12 — Будущее информационных систем</text>
<text x="55" y="102" fill="#475569" font-family="sans-serif" font-size="18">Canonical RAG · PDF 563–638 · source SHA 495e75f185c758a8…</text>

<rect x="55" y="140" width="1290" height="110" rx="18" fill="#e2e8f0"/>
<text x="85" y="184" fill="#0f172a" font-family="sans-serif" font-size="23" font-weight="700">Final synthesis: compose specialized systems through replayable dataflows, preserve integrity end-to-end, and minimize coordination.</text>
<text x="85" y="220" fill="#334155" font-family="sans-serif" font-size="18">The chapter also explicitly treats human consequences of data systems as a design responsibility.</text>

<rect x="55" y="285" width="400" height="525" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="85" y="330" fill="#075985" font-family="sans-serif" font-size="26" font-weight="700">12.1–12.2 Dataflow architecture</text>
<text x="85" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Integration</text>
<text x="85" y="402" fill="#334155" font-family="sans-serif" font-size="16">specialized stores + explicit dataflows</text>
<text x="85" y="432" fill="#334155" font-family="sans-serif" font-size="16">batch = historical rebuild</text>
<text x="85" y="462" fill="#334155" font-family="sans-serif" font-size="16">stream = incremental maintenance</text>
<text x="85" y="502" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Evolution</text>
<text x="85" y="532" fill="#334155" font-family="sans-serif" font-size="16">old/new projections in parallel</text>
<text x="85" y="562" fill="#334155" font-family="sans-serif" font-size="16">replay source history into new view</text>
<text x="85" y="602" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Unbundling</text>
<text x="85" y="632" fill="#334155" font-family="sans-serif" font-size="16">federated reads vs reliable write propagation</text>
<text x="85" y="662" fill="#334155" font-family="sans-serif" font-size="16">event log + idempotent consumers</text>
<text x="85" y="712" fill="#075985" font-family="sans-serif" font-size="16">Desired abstraction: declarative distributed dataflow</text>

<rect x="500" y="285" width="400" height="525" rx="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="530" y="330" fill="#6b21a8" font-family="sans-serif" font-size="26" font-weight="700">12.3 Correctness &amp; integrity</text>
<text x="530" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">End-to-end argument</text>
<text x="530" y="402" fill="#334155" font-family="sans-serif" font-size="16">stable request ID reaches durable effect</text>
<text x="530" y="432" fill="#334155" font-family="sans-serif" font-size="16">dedup cannot stop at TCP/framework layer</text>
<text x="530" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Constraints</text>
<text x="530" y="502" fill="#334155" font-family="sans-serif" font-size="16">strict uniqueness → coordination boundary</text>
<text x="530" y="532" fill="#334155" font-family="sans-serif" font-size="16">repairable violations → compensation possible</text>
<text x="530" y="572" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Timeliness vs integrity</text>
<text x="530" y="602" fill="#334155" font-family="sans-serif" font-size="16">stale state may catch up</text>
<text x="530" y="632" fill="#334155" font-family="sans-serif" font-size="16">corruption needs detection + repair</text>
<text x="530" y="682" fill="#6b21a8" font-family="sans-serif" font-size="16">Trust but verify: audit + reconciliation</text>

<rect x="945" y="285" width="400" height="525" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="975" y="330" fill="#166534" font-family="sans-serif" font-size="26" font-weight="700">12.4 Human consequences</text>
<text x="975" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Predictive analytics</text>
<text x="975" y="402" fill="#334155" font-family="sans-serif" font-size="16">historical bias can be learned/amplified</text>
<text x="975" y="432" fill="#334155" font-family="sans-serif" font-size="16">decisions may materially affect people</text>
<text x="975" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Privacy / surveillance</text>
<text x="975" y="502" fill="#334155" font-family="sans-serif" font-size="16">collection purpose matters</text>
<text x="975" y="532" fill="#334155" font-family="sans-serif" font-size="16">retention should not be indefinite by default</text>
<text x="975" y="572" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Responsibility</text>
<text x="975" y="602" fill="#334155" font-family="sans-serif" font-size="16">human dignity and user control</text>
<text x="975" y="632" fill="#334155" font-family="sans-serif" font-size="16">engineers share responsibility for impact</text>
<text x="975" y="682" fill="#166534" font-family="sans-serif" font-size="16">Normative author position, not technical consensus</text>

<rect x="55" y="850" width="1290" height="220" rx="18" fill="#0f172a"/>
<text x="85" y="895" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Acceptance checklist</text>
<text x="85" y="935" fill="#cbd5e1" font-family="sans-serif" font-size="18">1. Every derived dataset has an authoritative source and a replay/rebuild path.</text>
<text x="85" y="970" fill="#cbd5e1" font-family="sans-serif" font-size="18">2. End-to-end request IDs and audit paths detect duplicates/corruption beyond lower-layer guarantees.</text>
<text x="85" y="1005" fill="#cbd5e1" font-family="sans-serif" font-size="18">3. Synchronous coordination is limited to invariants whose violation cannot be acceptably repaired.</text>
<text x="85" y="1040" fill="#cbd5e1" font-family="sans-serif" font-size="18">4. Personal-data purpose, retention, deletion and human impact are treated as architecture constraints.</text>

<text x="170" y="1130" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">Reliable evolution means rebuildable state, localized failures, verifiable integrity and responsibility for consequences.</text>
</svg>