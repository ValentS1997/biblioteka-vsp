<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 12 — Будущее информационных систем</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 563–638 · dataflow → integrity → responsibility</text>

<rect x="55" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">Dataflow</text>
<text x="85" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">system of record → log</text>
<text x="85" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">transform → derived state</text>
<text x="85" y="304" fill="#cbd5e1" font-family="sans-serif" font-size="16">index · cache · analytics · ML</text>
<text x="85" y="338" fill="#cbd5e1" font-family="sans-serif" font-size="16">replay / rebuild / migrate</text>
<text x="85" y="388" fill="#f8fafc" font-family="sans-serif" font-size="18">Architecture</text>
<text x="85" y="423" fill="#cbd5e1" font-family="sans-serif" font-size="16">weak coupling</text>
<text x="85" y="453" fill="#cbd5e1" font-family="sans-serif" font-size="16">minimal synchronous coordination</text>
<text x="85" y="483" fill="#cbd5e1" font-family="sans-serif" font-size="16">reversible evolution</text>

<rect x="432" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="26" font-weight="700">Correctness</text>
<text x="462" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Timeliness ≠ integrity</text>
<text x="462" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">stale may heal</text>
<text x="462" y="304" fill="#cbd5e1" font-family="sans-serif" font-size="16">corruption requires repair</text>
<text x="462" y="348" fill="#f8fafc" font-family="sans-serif" font-size="18">End-to-end</text>
<text x="462" y="383" fill="#cbd5e1" font-family="sans-serif" font-size="16">operation IDs · dedup</text>
<text x="462" y="413" fill="#cbd5e1" font-family="sans-serif" font-size="16">deterministic derivation</text>
<text x="462" y="443" fill="#cbd5e1" font-family="sans-serif" font-size="16">audit / reconciliation</text>
<text x="462" y="473" fill="#cbd5e1" font-family="sans-serif" font-size="16">compensate where acceptable</text>

<rect x="809" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">Responsibility</text>
<text x="839" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Data about people</text>
<text x="839" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">bias / discrimination</text>
<text x="839" y="304" fill="#cbd5e1" font-family="sans-serif" font-size="16">surveillance / privacy</text>
<text x="839" y="338" fill="#cbd5e1" font-family="sans-serif" font-size="16">retention / deletion</text>
<text x="839" y="388" fill="#f8fafc" font-family="sans-serif" font-size="18">Design boundary</text>
<text x="839" y="423" fill="#cbd5e1" font-family="sans-serif" font-size="16">human dignity</text>
<text x="839" y="453" fill="#cbd5e1" font-family="sans-serif" font-size="16">user control</text>
<text x="839" y="483" fill="#cbd5e1" font-family="sans-serif" font-size="16">accountability for impact</text>

<rect x="55" y="600" width="1089" height="125" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="645" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Final thesis</text>
<text x="85" y="683" fill="#cbd5e1" font-family="sans-serif" font-size="19">authoritative data → replayable transformations → derived state → end-to-end integrity → audit</text>
<text x="255" y="768" fill="#f8fafc" font-family="sans-serif" font-size="21" font-weight="700">Coordinate only what cannot safely be repaired later.</text>
</svg>