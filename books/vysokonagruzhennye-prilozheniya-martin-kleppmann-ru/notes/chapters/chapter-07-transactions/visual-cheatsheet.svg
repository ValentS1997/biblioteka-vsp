<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 7 — Транзакции</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 265–321 · isolation anomalies → serializability</text>

<rect x="55" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">ACID</text>
<text x="85" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">A — abort partial failure</text>
<text x="85" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="17">C — application invariants</text>
<text x="85" y="305" fill="#cbd5e1" font-family="sans-serif" font-size="17">I — concurrency isolation</text>
<text x="85" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="17">D — committed data durability</text>
<text x="85" y="390" fill="#f8fafc" font-family="sans-serif" font-size="18">Retry carefully:</text>
<text x="85" y="425" fill="#cbd5e1" font-family="sans-serif" font-size="16">ambiguous commit</text>
<text x="85" y="455" fill="#cbd5e1" font-family="sans-serif" font-size="16">overload / permanent errors</text>
<text x="85" y="485" fill="#cbd5e1" font-family="sans-serif" font-size="16">external side effects</text>

<rect x="432" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="26" font-weight="700">Anomalies</text>
<text x="462" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="17">dirty read / dirty write</text>
<text x="462" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="17">read skew</text>
<text x="462" y="305" fill="#cbd5e1" font-family="sans-serif" font-size="17">lost update</text>
<text x="462" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="17">write skew</text>
<text x="462" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="17">phantom</text>
<text x="462" y="425" fill="#f8fafc" font-family="sans-serif" font-size="18">Snapshot isolation:</text>
<text x="462" y="460" fill="#cbd5e1" font-family="sans-serif" font-size="16">MVCC consistent snapshot</text>
<text x="462" y="490" fill="#cbd5e1" font-family="sans-serif" font-size="16">write skew still possible</text>

<rect x="809" y="145" width="335" height="390" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">Serializable</text>
<text x="839" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Serial execution</text>
<text x="839" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">simple · throughput bounded</text>
<text x="839" y="315" fill="#f8fafc" font-family="sans-serif" font-size="18">2PL</text>
<text x="839" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="16">blocking · deadlocks · range locks</text>
<text x="839" y="395" fill="#f8fafc" font-family="sans-serif" font-size="18">SSI</text>
<text x="839" y="430" fill="#cbd5e1" font-family="sans-serif" font-size="16">snapshot + optimistic detection</text>
<text x="839" y="460" fill="#cbd5e1" font-family="sans-serif" font-size="16">abort unsafe histories</text>

<rect x="55" y="585" width="1090" height="125" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="630" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Operational rule</text>
<text x="85" y="668" fill="#cbd5e1" font-family="sans-serif" font-size="19">invariant → concurrent scenario → anomaly → minimal control → rerun → keep/rollback</text>
<text x="300" y="752" fill="#f8fafc" font-family="sans-serif" font-size="21" font-weight="700">Do not infer correctness from the word “ACID” alone.</text>
</svg>