<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#0f172a"/>
<text x="55" y="66" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">Глава 9 — Согласованность и консенсус</text>
<text x="55" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="18">RAG-only · PDF 375–444 · consistency → ordering → consensus</text>

<rect x="55" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="85" y="195" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">Consistency</text>
<text x="85" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Eventual</text>
<text x="85" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="16">converges later · stale reads possible</text>
<text x="85" y="310" fill="#f8fafc" font-family="sans-serif" font-size="18">Linearizable</text>
<text x="85" y="343" fill="#cbd5e1" font-family="sans-serif" font-size="16">one-copy atomic illusion</text>
<text x="85" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="16">real-time order · coordination cost</text>
<text x="85" y="417" fill="#f8fafc" font-family="sans-serif" font-size="18">Causal</text>
<text x="85" y="450" fill="#cbd5e1" font-family="sans-serif" font-size="16">preserve dependencies</text>
<text x="85" y="482" fill="#cbd5e1" font-family="sans-serif" font-size="16">concurrent events may branch</text>

<rect x="432" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="462" y="195" fill="#a78bfa" font-family="sans-serif" font-size="26" font-weight="700">Ordering</text>
<text x="462" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">Lamport timestamps</text>
<text x="462" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="16">total order compatible with causality</text>
<text x="462" y="302" fill="#cbd5e1" font-family="sans-serif" font-size="16">does not detect concurrency</text>
<text x="462" y="350" fill="#f8fafc" font-family="sans-serif" font-size="18">Total-order broadcast</text>
<text x="462" y="385" fill="#cbd5e1" font-family="sans-serif" font-size="16">reliable delivery</text>
<text x="462" y="417" fill="#cbd5e1" font-family="sans-serif" font-size="16">same order at all nodes</text>
<text x="462" y="465" fill="#f8fafc" font-family="sans-serif" font-size="18">Equivalent boundary:</text>
<text x="462" y="498" fill="#cbd5e1" font-family="sans-serif" font-size="16">total order ↔ linearizable CAS ↔ consensus</text>

<rect x="809" y="145" width="335" height="410" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="839" y="195" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">Consensus</text>
<text x="839" y="235" fill="#f8fafc" font-family="sans-serif" font-size="18">One irreversible decision</text>
<text x="839" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="16">agreement · integrity</text>
<text x="839" y="307" fill="#cbd5e1" font-family="sans-serif" font-size="16">validity · termination</text>
<text x="839" y="350" fill="#f8fafc" font-family="sans-serif" font-size="18">Protocols</text>
<text x="839" y="385" fill="#cbd5e1" font-family="sans-serif" font-size="16">Paxos · Raft · Zab · VSR</text>
<text x="839" y="417" fill="#cbd5e1" font-family="sans-serif" font-size="16">epoch/term + quorum</text>
<text x="839" y="465" fill="#f8fafc" font-family="sans-serif" font-size="18">Coordination</text>
<text x="839" y="498" fill="#cbd5e1" font-family="sans-serif" font-size="16">ZooKeeper / etcd</text>

<rect x="55" y="600" width="1089" height="125" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/>
<text x="85" y="645" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Operational rule</text>
<text x="85" y="683" fill="#cbd5e1" font-family="sans-serif" font-size="19">invariant → required order/decision → minimal coordination → partition test → verify safety/liveness</text>
<text x="255" y="768" fill="#f8fafc" font-family="sans-serif" font-size="21" font-weight="700">Use consensus only where multiple “truths” would violate correctness.</text>
</svg>