<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160">
<rect width="1400" height="1160" fill="#f8fafc"/>
<text x="55" y="65" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">Глава 9 — Согласованность и консенсус</text>
<text x="55" y="102" fill="#475569" font-family="sans-serif" font-size="18">Canonical RAG · PDF 375–444 · source SHA 495e75f185c758a8…</text>

<rect x="55" y="140" width="1290" height="110" rx="18" fill="#e2e8f0"/>
<text x="85" y="184" fill="#0f172a" font-family="sans-serif" font-size="23" font-weight="700">Core question: which invariants require one globally agreed order or decision?</text>
<text x="85" y="220" fill="#334155" font-family="sans-serif" font-size="18">Stronger guarantees simplify application reasoning but add coordination, latency and availability costs.</text>

<rect x="55" y="285" width="400" height="525" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="85" y="330" fill="#075985" font-family="sans-serif" font-size="26" font-weight="700">9.1–9.2 Consistency</text>
<text x="85" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Eventual</text>
<text x="85" y="402" fill="#334155" font-family="sans-serif" font-size="16">replicas converge after writes/faults stop</text>
<text x="85" y="432" fill="#334155" font-family="sans-serif" font-size="16">little guarantee before convergence</text>
<text x="85" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Linearizable</text>
<text x="85" y="502" fill="#334155" font-family="sans-serif" font-size="16">one-copy atomic semantics</text>
<text x="85" y="532" fill="#334155" font-family="sans-serif" font-size="16">real-time recency across clients</text>
<text x="85" y="562" fill="#334155" font-family="sans-serif" font-size="16">not the same as serializability</text>
<text x="85" y="602" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Trade-off</text>
<text x="85" y="632" fill="#334155" font-family="sans-serif" font-size="16">partition: preserve correctness or availability</text>
<text x="85" y="662" fill="#334155" font-family="sans-serif" font-size="16">coordination also increases normal latency</text>
<text x="85" y="712" fill="#075985" font-family="sans-serif" font-size="16">CAP is narrow; analyze concrete guarantees instead</text>

<rect x="500" y="285" width="400" height="525" rx="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="530" y="330" fill="#6b21a8" font-family="sans-serif" font-size="26" font-weight="700">9.3 Ordering</text>
<text x="530" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Causality</text>
<text x="530" y="402" fill="#334155" font-family="sans-serif" font-size="16">A causes B → A must precede B</text>
<text x="530" y="432" fill="#334155" font-family="sans-serif" font-size="16">concurrent events can remain unordered</text>
<text x="530" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Lamport timestamps</text>
<text x="530" y="502" fill="#334155" font-family="sans-serif" font-size="16">counter + node ID → compact total order</text>
<text x="530" y="532" fill="#334155" font-family="sans-serif" font-size="16">compatible with causality, not concurrency test</text>
<text x="530" y="572" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Total-order broadcast</text>
<text x="530" y="602" fill="#334155" font-family="sans-serif" font-size="16">reliable delivery + same delivery order</text>
<text x="530" y="632" fill="#334155" font-family="sans-serif" font-size="16">log enables deterministic state-machine order</text>
<text x="530" y="682" fill="#6b21a8" font-family="sans-serif" font-size="16">Total order + finality leads to consensus</text>

<rect x="945" y="285" width="400" height="525" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="975" y="330" fill="#166534" font-family="sans-serif" font-size="26" font-weight="700">9.4 Commit &amp; consensus</text>
<text x="975" y="372" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">2PC / XA</text>
<text x="975" y="402" fill="#334155" font-family="sans-serif" font-size="16">prepare → durable commit/abort decision</text>
<text x="975" y="432" fill="#334155" font-family="sans-serif" font-size="16">coordinator loss → in-doubt + held locks</text>
<text x="975" y="472" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Consensus properties</text>
<text x="975" y="502" fill="#334155" font-family="sans-serif" font-size="16">agreement · integrity · validity · termination</text>
<text x="975" y="532" fill="#334155" font-family="sans-serif" font-size="16">safety survives loss of majority; liveness may stop</text>
<text x="975" y="572" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">Protocols</text>
<text x="975" y="602" fill="#334155" font-family="sans-serif" font-size="16">Paxos · Raft · Zab · VSR</text>
<text x="975" y="632" fill="#334155" font-family="sans-serif" font-size="16">epoch/term/view + quorum intersection</text>
<text x="975" y="672" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="700">ZooKeeper / etcd</text>
<text x="975" y="702" fill="#334155" font-family="sans-serif" font-size="16">small coordination metadata</text>
<text x="975" y="732" fill="#334155" font-family="sans-serif" font-size="16">atomic ops · sessions · notifications</text>

<rect x="55" y="850" width="1290" height="220" rx="18" fill="#0f172a"/>
<text x="85" y="895" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">Acceptance checklist</text>
<text x="85" y="935" fill="#cbd5e1" font-family="sans-serif" font-size="18">1. Required guarantee is derived from an explicit application invariant.</text>
<text x="85" y="970" fill="#cbd5e1" font-family="sans-serif" font-size="18">2. Minority partition cannot produce a second successful decision when safety requires one.</text>
<text x="85" y="1005" fill="#cbd5e1" font-family="sans-serif" font-size="18">3. 2PC prepared state and consensus quorum/epoch state are observable and recoverable.</text>
<text x="85" y="1040" fill="#cbd5e1" font-family="sans-serif" font-size="18">4. Coordination service stores only the small control-plane state it is meant to coordinate.</text>

<text x="220" y="1130" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">Consensus is a boundary for irreversible shared decisions — not a default for every piece of data.</text>
</svg>