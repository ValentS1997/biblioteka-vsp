<text x="58" y="169" fill="#174b76" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">МОДУЛЬ ЯДРА</text>
<text x="58" y="231" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Makefile → .ko → modinfo</text>
<text x="58" y="280" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">insmod / modprobe / rmmod</text>
<text x="58" y="329" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">module_init / module_exit</text>
<rect x="429" y="134" width="372" height="260" rx="13" fill="#ffffff"/>
<rect x="429" y="134" width="372" height="56" rx="13" fill="#dceee7"/>
<text x="447" y="169" fill="#174b76" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">СКВОЗНОЙ ПАКЕТ</text>
<text x="447" y="231" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">sk_buff и net_device</text>
<text x="447" y="280" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">RX: IRQ / softirq / NAPI</text>
<text x="447" y="329" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">TX: ndo_start_xmit</text>
