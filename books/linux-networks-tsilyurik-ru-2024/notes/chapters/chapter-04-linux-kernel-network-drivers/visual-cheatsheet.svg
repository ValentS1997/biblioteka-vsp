<text x="836" y="169" fill="#174b76" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">ИНТЕРФЕЙСЫ И ПРОТОКОЛЫ</text>
<text x="836" y="231" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">alloc_netdev / register_netdev</text>
<text x="836" y="280" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">dev_add_pack / net_protocol</text>
<text x="836" y="329" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">netdev_priv / статистика</text>
<rect x="42" y="430" width="1116" height="207" rx="13" fill="#e7eef8"/>
<text x="65" y="473" fill="#163d60" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">БЕЗОПАСНЫЙ ПОРЯДОК</text>
<text x="65" y="518" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">Изучить ABI и состояние → проверить ownership skb → стенд VM.</text>
<text x="65" y="562" fill="#243d58" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">Сетевой модуль меняет живое ядро; перехват может нарушить сеть.</text>
<text x="65" y="602" fill="#865060" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">Проверить dmesg/lsmod/ip link; rollback текущего ядра не подтверждён.</text>
<text x="43" y="691" fill="#914852" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">Риски кода: kfree_skb → skb-&gt;len; dev_queue_xmit → skb; irq/byte.</text>
<text x="43" y="726" fill="#60778c" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400">SVG по тексту принятого RAG; не иллюстрация из PDF.</text>
