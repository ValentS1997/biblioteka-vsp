<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1380" viewBox="0 0 1740 1380">
  <rect width="1740" height="1380" fill="white"/>
  <text x="55" y="65" font-family="sans-serif" font-size="36" font-weight="700">Глава 12. Структуры данных — detailed map</text>
  <text x="55" y="102" font-family="sans-serif" font-size="18">RAG-only · p0087:c01–p0098:c01 · PDF 87–98 · source SHA ac1abb…d7db5</text>

  <rect x="55" y="140" width="1630" height="115" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="180" font-family="sans-serif" font-size="23" font-weight="700">Container choice</text>
  <text x="80" y="220" font-family="sans-serif" font-size="18">list = mutable sequence · tuple = immutable sequence · dict = key/value mapping · set = unordered collection.</text>

  <rect x="55" y="305" width="500" height="355" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="80" y="345" font-family="sans-serif" font-size="23" font-weight="700">12.1–12.3 Lists / tuples</text>
  <text x="80" y="390" font-family="monospace" font-size="17">append('рис')</text>
  <text x="80" y="430" font-family="monospace" font-size="17">sort()</text>
  <text x="80" y="470" font-family="monospace" font-size="17">del shoplist[0]</text>
  <text x="80" y="515" font-family="sans-serif" font-size="17">list mutable · tuple immutable</text>
  <text x="80" y="555" font-family="monospace" font-size="17">new_zoo[2][2]</text>
  <text x="80" y="595" font-family="monospace" font-size="17">singleton = (2,)</text>

  <rect x="620" y="305" width="500" height="355" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="645" y="345" font-family="sans-serif" font-size="23" font-weight="700">12.4 Dictionary</text>
  <text x="645" y="390" font-family="sans-serif" font-size="18">key : value pairs</text>
  <text x="645" y="430" font-family="monospace" font-size="17">del ab['Spammer']</text>
  <text x="645" y="470" font-family="monospace" font-size="17">ab['Guido'] = ...</text>
  <text x="645" y="510" font-family="monospace" font-size="17">for name,address in ab.items()</text>
  <text x="645" y="555" font-family="sans-serif" font-size="16">items/order/key wording preserved as source claims.</text>

  <rect x="1185" y="305" width="500" height="355" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="1210" y="345" font-family="sans-serif" font-size="23" font-weight="700">12.5 Sequence operations</text>
  <text x="1210" y="390" font-family="monospace" font-size="17">x[0] / x[-1]</text>
  <text x="1210" y="430" font-family="monospace" font-size="17">x[1:3]</text>
  <text x="1210" y="470" font-family="monospace" font-size="17">x[:-1]</text>
  <text x="1210" y="510" font-family="monospace" font-size="17">x[::2]</text>
  <text x="1210" y="550" font-family="monospace" font-size="17">x[::-1]</text>
  <text x="1210" y="595" font-family="sans-serif" font-size="16">start included · end excluded.</text>

  <rect x="55" y="710" width="770" height="245" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="750" font-family="sans-serif" font-size="23" font-weight="700">12.6 Set</text>
  <text x="80" y="795" font-family="monospace" font-size="17">set([...])</text>
  <text x="80" y="830" font-family="monospace" font-size="17">add / remove / issuperset</text>
  <text x="80" y="865" font-family="monospace" font-size="17">bri &amp; bric</text>
  <text x="80" y="905" font-family="sans-serif" font-size="16">Defined as unordered; output representation is not an order guarantee.</text>

  <rect x="875" y="710" width="810" height="245" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="900" y="750" font-family="sans-serif" font-size="23" font-weight="700">12.7–12.8 References / strings</text>
  <text x="900" y="795" font-family="monospace" font-size="17">mylist = shoplist → same object</text>
  <text x="900" y="830" font-family="monospace" font-size="17">mylist = shoplist[:] → copy example</text>
  <text x="900" y="870" font-family="monospace" font-size="17">startswith · in · find · join</text>
  <text x="900" y="910" font-family="sans-serif" font-size="16">String methods return/query/build values in source examples.</text>

  <rect x="55" y="1005" width="1630" height="235" rx="10" fill="#fafafa" stroke="#666" stroke-dasharray="7 5"/>
  <text x="80" y="1045" font-family="sans-serif" font-size="22" font-weight="700">Source integrity findings</text>
  <text x="80" y="1085" font-family="sans-serif" font-size="17">• dict.items() described as returning list of tuples → [Needs confirmation]</text>
