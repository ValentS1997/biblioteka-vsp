<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
  <rect width="1600" height="1260" fill="white"/>
  <text x="55" y="65" font-family="sans-serif" font-size="36" font-weight="700">Глава 6. Первые шаги — detailed map</text>
  <text x="55" y="102" font-family="sans-serif" font-size="18">RAG-only · p0035:c01–p0042:c01 · PDF 35–42 · source SHA ac1abb…d7db5</text>

  <rect x="55" y="140" width="1490" height="125" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="180" font-family="sans-serif" font-size="23" font-weight="700">6.1–6.2 Interactive path</text>
  <text x="80" y="220" font-family="monospace" font-size="19">python3 → &gt;&gt;&gt; → print(...) → immediate output</text>
  <text x="80" y="250" font-family="sans-serif" font-size="17">Exit: Ctrl-D / exit(); Windows: Ctrl-Z + Enter.</text>

  <rect x="55" y="310" width="470" height="335" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="80" y="350" font-family="sans-serif" font-size="23" font-weight="700">6.3 Editor</text>
  <text x="80" y="392" font-family="sans-serif" font-size="18">Key requirements:</text>
  <text x="80" y="430" font-family="sans-serif" font-size="17">• syntax highlighting</text>
  <text x="80" y="465" font-family="sans-serif" font-size="17">• automatic indentation</text>
  <text x="80" y="505" font-family="sans-serif" font-size="17">Source beginner choice: Komodo Edit</text>
  <text x="80" y="540" font-family="sans-serif" font-size="17">Experienced: Vim / Emacs references</text>
  <text x="80" y="590" font-family="sans-serif" font-size="16">Current tool availability: [Needs confirmation]</text>

  <rect x="565" y="310" width="470" height="335" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="590" y="350" font-family="sans-serif" font-size="23" font-weight="700">6.4 Program file</text>
  <text x="590" y="392" font-family="monospace" font-size="17">print('Привет, Мир!')</text>
  <text x="590" y="430" font-family="sans-serif" font-size="17">save → helloworld.py</text>
  <text x="590" y="468" font-family="monospace" font-size="17">cd /tmp/py</text>
  <text x="590" y="506" font-family="monospace" font-size="17">python3 helloworld.py</text>
  <text x="590" y="545" font-family="sans-serif" font-size="17">Expected: Привет, Мир!</text>
  <text x="590" y="585" font-family="sans-serif" font-size="16">Error check: exact code, case, leading whitespace.</text>

  <rect x="1075" y="310" width="470" height="335" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="1100" y="350" font-family="sans-serif" font-size="23" font-weight="700">6.4.1 Executable script</text>
  <text x="1100" y="392" font-family="monospace" font-size="17">#!/usr/bin/env python3</text>
  <text x="1100" y="430" font-family="monospace" font-size="17">chmod a+x helloworld.py</text>
  <text x="1100" y="468" font-family="monospace" font-size="17">./helloworld.py</text>
  <text x="1100" y="506" font-family="monospace" font-size="17">echo $PATH</text>
  <text x="1100" y="544" font-family="sans-serif" font-size="16">copy into PATH dir OR source PATH assignment</text>
  <text x="1100" y="582" font-family="sans-serif" font-size="16">State-changing rollback: [Needs confirmation]</text>

  <rect x="55" y="690" width="720" height="205" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="730" font-family="sans-serif" font-size="23" font-weight="700">6.5 Help</text>
  <text x="80" y="770" font-family="monospace" font-size="18">help(print)</text>
  <text x="80" y="807" font-family="monospace" font-size="18">help()</text>
  <text x="80" y="844" font-family="monospace" font-size="18">help('return')</text>
  <text x="360" y="844" font-family="sans-serif" font-size="17">q → exit help</text>

  <rect x="825" y="690" width="720" height="205" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="850" y="730" font-family="sans-serif" font-size="23" font-weight="700">6.6 Acceptance</text>
  <text x="850" y="770" font-family="sans-serif" font-size="18">Reader can:</text>
  <text x="850" y="807" font-family="sans-serif" font-size="17">• write program</text>
  <text x="1050" y="807" font-family="sans-serif" font-size="17">• save program</text>
  <text x="1270" y="807" font-family="sans-serif" font-size="17">• run program</text>
  <text x="850" y="850" font-family="sans-serif" font-size="17">Next: chapter 7 «Основы».</text>

  <rect x="55" y="940" width="1490" height="220" rx="10" fill="#fafafa" stroke="#666" stroke-dasharray="7 5"/>
  <text x="80" y="980" font-family="sans-serif" font-size="22" font-weight="700">Source / safety findings</text>
  <text x="80" y="1020" font-family="sans-serif" font-size="17">• prose uses print('Hello World'); REPL capture uses lowercase print('hello world')</text>
  <text x="80" y="1055" font-family="sans-serif" font-size="17">• chmod footnote contains damaged extraction glyph: ange mode</text>
  <text x="80" y="1090" font-family="sans-serif" font-size="17">• /home/swaroop/* paths are source-environment examples, not portable defaults</text>
  <text x="80" y="1125" font-family="sans-serif" font-size="17">• mkdir/chmod/cp/PATH assignment modify state; source rollback is not supplied</text>

  <text x="55" y="1210" font-family="sans-serif" font-size="17">Boundary: PDF 35–42. p0043:c01 / PDF 43 begins chapter 7.</text>
</svg>
