<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <rect width="1300" height="900" fill="white"/>
  <text x="55" y="62" font-family="sans-serif" font-size="34" font-weight="700">Глава 8 — «Операторы и выражения»</text>
  <text x="55" y="98" font-family="sans-serif" font-size="18">RAG PDF 53–58 · p0053:c01–p0058:c01</text>

  <rect x="55" y="140" width="360" height="190" rx="12" fill="#f3f3f3" stroke="#333"/>
  <text x="80" y="180" font-family="sans-serif" font-size="22" font-weight="700">Operators</text>
  <text x="80" y="220" font-family="sans-serif" font-size="18">Arithmetic</text>
  <text x="80" y="252" font-family="sans-serif" font-size="18">Bitwise</text>
  <text x="80" y="284" font-family="sans-serif" font-size="18">Comparison / Logical</text>

  <rect x="470" y="140" width="360" height="190" rx="12" fill="#f3f3f3" stroke="#333"/>
  <text x="495" y="180" font-family="sans-serif" font-size="22" font-weight="700">Order</text>
  <text x="495" y="220" font-family="sans-serif" font-size="18">Precedence</text>
  <text x="495" y="252" font-family="sans-serif" font-size="18">Associativity</text>
  <text x="495" y="284" font-family="sans-serif" font-size="18">Parentheses clarify/change grouping</text>

  <rect x="885" y="140" width="360" height="190" rx="12" fill="#f3f3f3" stroke="#333"/>
  <text x="910" y="180" font-family="sans-serif" font-size="22" font-weight="700">Patterns</text>
  <text x="910" y="220" font-family="monospace" font-size="18">a = a * 3</text>
  <text x="910" y="252" font-family="monospace" font-size="18">a *= 3</text>
  <text x="910" y="284" font-family="sans-serif" font-size="18">and/or short-circuit</text>

  <rect x="55" y="385" width="570" height="210" rx="12" fill="#f7f7f7" stroke="#333"/>
  <text x="80" y="425" font-family="sans-serif" font-size="22" font-weight="700">Expression evaluation</text>
  <text x="80" y="465" font-family="monospace" font-size="19">2 + 3 * 4</text>
  <text x="80" y="500" font-family="monospace" font-size="19">(2 + 3) * 4</text>
  <text x="80" y="540" font-family="sans-serif" font-size="17">Parentheses make intended grouping explicit.</text>

  <rect x="675" y="385" width="570" height="210" rx="12" fill="#f7f7f7" stroke="#333"/>
  <text x="700" y="425" font-family="sans-serif" font-size="22" font-weight="700">expression.py</text>
  <text x="700" y="465" font-family="monospace" font-size="18">area = length * breadth</text>
  <text x="700" y="500" font-family="sans-serif" font-size="18">Area → 10</text>
  <text x="700" y="535" font-family="sans-serif" font-size="18">Perimeter → 14</text>

  <rect x="55" y="650" width="1190" height="125" rx="12" fill="#fafafa" stroke="#333"/>
  <text x="80" y="690" font-family="sans-serif" font-size="22" font-weight="700">Acceptance</text>
  <text x="80" y="728" font-family="sans-serif" font-size="18">operator + operands + precedence/associativity/parentheses → expression result</text>
  <text x="80" y="758" font-family="sans-serif" font-size="17">Next: chapter 9 «Поток команд».</text>

  <text x="55" y="835" font-family="sans-serif" font-size="16">Findings: damaged False footnote; comparison-table claim [Needs confirmation]; a=(b=c) treated as source notation.</text>
