  <text x="80" y="215" font-family="sans-serif" font-size="18">Проверить существующие переводы/волонтёров → помочь текущему проекту ИЛИ прочитать инструкцию и начать новый перевод.</text>
  <text x="80" y="245" font-family="sans-serif" font-size="18">Мотивация в историях участников: снизить языковой барьер и сделать обучение Python доступнее.</text>

