<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1300" viewBox="0 0 1680 1300">
  <rect width="1680" height="1300" fill="white"/>
  <text x="55" y="65" font-family="sans-serif" font-size="36" font-weight="700">Глава 9. Поток команд — detailed map</text>
  <text x="55" y="102" font-family="sans-serif" font-size="18">RAG-only · p0059:c01–p0066:c01 · PDF 59–66 · source SHA ac1abb…d7db5</text>

  <rect x="55" y="140" width="1570" height="115" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="180" font-family="sans-serif" font-size="23" font-weight="700">From sequence to control flow</text>
  <text x="80" y="220" font-family="sans-serif" font-size="18">Instead of always top→bottom: choose a branch, repeat a block, terminate a loop, or skip one iteration.</text>

  <rect x="55" y="305" width="490" height="330" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="80" y="345" font-family="sans-serif" font-size="23" font-weight="700">9.1 if</text>
  <text x="80" y="390" font-family="monospace" font-size="17">if condition:</text>
  <text x="80" y="425" font-family="monospace" font-size="17">elif condition:</text>
  <text x="80" y="460" font-family="monospace" font-size="17">else:</text>
  <text x="80" y="510" font-family="sans-serif" font-size="17">elif / else optional</text>
  <text x="80" y="545" font-family="sans-serif" font-size="17">nested if supported</text>
  <text x="80" y="580" font-family="sans-serif" font-size="17">colon + indentation define blocks</text>

  <rect x="595" y="305" width="490" height="330" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="620" y="345" font-family="sans-serif" font-size="23" font-weight="700">9.2 while</text>
  <text x="620" y="390" font-family="sans-serif" font-size="18">condition checked repeatedly</text>
  <text x="620" y="430" font-family="monospace" font-size="17">running = True</text>
  <text x="620" y="465" font-family="monospace" font-size="17">while running:</text>
  <text x="620" y="500" font-family="monospace" font-size="17">running = False</text>
  <text x="620" y="545" font-family="sans-serif" font-size="17">optional else on normal termination</text>
  <text x="620" y="580" font-family="sans-serif" font-size="17">break → else skipped</text>

  <rect x="1135" y="305" width="490" height="330" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="1160" y="345" font-family="sans-serif" font-size="23" font-weight="700">9.3 for</text>
  <text x="1160" y="390" font-family="monospace" font-size="17">for i in range(1, 5):</text>
  <text x="1160" y="430" font-family="sans-serif" font-size="18">iterate sequence elements</text>
  <text x="1160" y="470" font-family="sans-serif" font-size="17">source output: 1 2 3 4</text>
  <text x="1160" y="510" font-family="monospace" font-size="17">range(1, 5, 2)</text>
  <text x="1160" y="545" font-family="monospace" font-size="17">list(range())</text>
  <text x="1160" y="580" font-family="sans-serif" font-size="17">optional else</text>

  <rect x="55" y="690" width="760" height="245" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="730" font-family="sans-serif" font-size="23" font-weight="700">9.4 break</text>
  <text x="80" y="775" font-family="monospace" font-size="17">while True:</text>
  <text x="80" y="810" font-family="monospace" font-size="17">if s == 'выход': break</text>
  <text x="80" y="850" font-family="sans-serif" font-size="17">Immediate loop termination.</text>
  <text x="80" y="885" font-family="sans-serif" font-size="17">Associated for/while else does not run.</text>
  <text x="80" y="915" font-family="sans-serif" font-size="16">Poetic Python is sample input content.</text>

  <rect x="865" y="690" width="760" height="245" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="890" y="730" font-family="sans-serif" font-size="23" font-weight="700">9.5 continue</text>
  <text x="890" y="775" font-family="monospace" font-size="17">if len(s) &lt; 3:</text>
  <text x="890" y="810" font-family="monospace" font-size="17">continue</text>
  <text x="890" y="850" font-family="sans-serif" font-size="17">Skip rest of current iteration.</text>
  <text x="890" y="885" font-family="sans-serif" font-size="17">Works with while and for.</text>

  <rect x="55" y="985" width="1570" height="175" rx="10" fill="#fafafa" stroke="#666" stroke-dasharray="7 5"/>
  <text x="80" y="1025" font-family="sans-serif" font-size="22" font-weight="700">Source integrity findings</text>
  <text x="80" y="1065" font-family="sans-serif" font-size="17">• while.py displayed output wording differs from code strings</text>
  <text x="80" y="1100" font-family="sans-serif" font-size="17">• if.py success punctuation differs between code and output</text>
  <text x="80" y="1135" font-family="sans-serif" font-size="17">• range and Boolean equivalence statements retained as source claims / [Needs confirmation]</text>

  <text x="55" y="1210" font-family="sans-serif" font-size="18">9.6 summary: master if, while, for, break and continue.</text>
  <text x="55" y="1245" font-family="sans-serif" font-size="17">Next boundary: p0067:c01 / PDF 67 — chapter 10 «Функции».</text>
</svg>
