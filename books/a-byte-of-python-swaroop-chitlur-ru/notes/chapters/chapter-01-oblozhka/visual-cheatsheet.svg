  <text x="460" y="432" font-family="sans-serif" font-size="18">EPUB: в источнике «готовится»</text>

  <rect x="810" y="330" width="330" height="120" rx="12" fill="#f2f2f2" stroke="#333"/>
  <text x="835" y="370" font-family="sans-serif" font-size="22" font-weight="700">Переводы</text>
  <text x="835" y="405" font-family="sans-serif" font-size="18">1.7 ведёт к странице переводов</text>
  <text x="835" y="432" font-family="sans-serif" font-size="18">Глава 2 начинается с «Переводы»</text>

  <line x1="225" y1="270" x2="600" y2="330" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="270" x2="975" y2="330" stroke="#555" stroke-width="2"/>

  <text x="60" y="530" font-family="sans-serif" font-size="22" font-weight="700">Главный вывод</text>
  <text x="60" y="565" font-family="sans-serif" font-size="20">Это «паспорт книги»: происхождение, аудитория, доверие, лицензия и способы доступа.</text>
  <text x="60" y="605" font-family="sans-serif" font-size="18">CLI/Python-команд в главе нет.</text>
  <text x="60" y="640" font-family="sans-serif" font-size="16">Source finding: в RAG есть повреждённые glyphs в точных именах/URL/названии лицензии.</text>
