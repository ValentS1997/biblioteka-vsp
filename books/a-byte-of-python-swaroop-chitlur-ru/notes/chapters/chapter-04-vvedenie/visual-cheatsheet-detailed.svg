<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <rect width="1600" height="1180" fill="white"/>
  <text x="55" y="65" font-family="sans-serif" font-size="36" font-weight="700">Глава 4. Введение — detailed map</text>
  <text x="55" y="102" font-family="sans-serif" font-size="18">RAG-only · p0027:c01–p0030:c01 · PDF 27–30 · source SHA ac1abb…d7db5</text>

  <rect x="55" y="140" width="1490" height="120" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="178" font-family="sans-serif" font-size="23" font-weight="700">Вводная формула</text>
  <text x="80" y="215" font-family="sans-serif" font-size="18">Python: простой в освоении + мощный; высокоуровневые структуры данных, ООП, динамическая типизация, интерпретируемая модель.</text>
  <text x="80" y="245" font-family="sans-serif" font-size="18">Название Python источник связывает с «Летающим цирком Монти Пайтона».</text>

  <rect x="55" y="300" width="470" height="360" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="80" y="340" font-family="sans-serif" font-size="23" font-weight="700">4.1.1–4.1.4</text>
  <text x="80" y="385" font-family="sans-serif" font-size="18">1. Простой</text>
  <text x="80" y="425" font-family="sans-serif" font-size="18">2. Лёгкий в освоении</text>
  <text x="80" y="465" font-family="sans-serif" font-size="18">3. Свободный и открытый (FLOSS)</text>
  <text x="80" y="505" font-family="sans-serif" font-size="18">4. Высокий уровень</text>
  <text x="80" y="555" font-family="sans-serif" font-size="16">Фокус: меньше языковой/низкоуровневой механики,</text>
  <text x="80" y="582" font-family="sans-serif" font-size="16">больше внимания решению задачи.</text>

  <rect x="565" y="300" width="470" height="360" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="590" y="340" font-family="sans-serif" font-size="23" font-weight="700">4.1.5–4.1.7</text>
  <text x="590" y="385" font-family="sans-serif" font-size="18">5. Портируемый</text>
  <text x="590" y="425" font-family="sans-serif" font-size="18">6. Интерпретируемый</text>
  <text x="590" y="465" font-family="sans-serif" font-size="18">7. Объектно-ориентированный</text>
  <text x="590" y="515" font-family="sans-serif" font-size="16">Оговорка portable: избегать system-dependent функций.</text>
  <text x="590" y="555" font-family="sans-serif" font-size="16">Execution source framing:</text>
  <text x="590" y="585" font-family="sans-serif" font-size="16">source → bytecode → machine language → run.</text>
  <text x="590" y="615" font-family="sans-serif" font-size="16">Поддерживаются procedural + OOP styles.</text>

  <rect x="1075" y="300" width="470" height="360" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="1100" y="340" font-family="sans-serif" font-size="23" font-weight="700">4.1.8–4.1.10</text>
  <text x="1100" y="385" font-family="sans-serif" font-size="18">8. Расширяемый</text>
  <text x="1100" y="425" font-family="sans-serif" font-size="18">9. Встраиваемый</text>
  <text x="1100" y="465" font-family="sans-serif" font-size="18">10. Обширные библиотеки</text>
  <text x="1100" y="515" font-family="sans-serif" font-size="16">Extension: C/C++ → вызывается из Python.</text>
  <text x="1100" y="545" font-family="sans-serif" font-size="16">Embedding: Python → внутри C/C++ app.</text>
  <text x="1100" y="575" font-family="sans-serif" font-size="16">Standard library: source slogan «Всё включено».</text>

  <rect x="55" y="705" width="720" height="205" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="80" y="745" font-family="sans-serif" font-size="23" font-weight="700">4.2 Python 2 против 3</text>
  <text x="80" y="785" font-family="sans-serif" font-size="18">• книга переписана для Python 3 в 2008 году</text>
  <text x="80" y="820" font-family="sans-serif" font-size="18">• книга учит Python 3</text>
  <text x="80" y="855" font-family="sans-serif" font-size="18">• источник считает освоение программирования важнее ветки версии</text>
  <text x="80" y="885" font-family="sans-serif" font-size="16">Современная актуальность historical migration claims не проверяется.</text>

  <rect x="825" y="705" width="720" height="205" rx="10" fill="#f4f4f4" stroke="#333"/>
  <text x="850" y="745" font-family="sans-serif" font-size="23" font-weight="700">4.3 Что говорят программисты</text>
  <text x="850" y="785" font-family="sans-serif" font-size="18">Эрик С. Рэймонд — Python как любимый язык</text>
  <text x="850" y="820" font-family="sans-serif" font-size="18">Брюс Экель — эффективность работы / удобство программиста</text>
  <text x="850" y="855" font-family="sans-serif" font-size="18">Питер Норвиг — Python как важная часть Google (source claim)</text>

  <rect x="55" y="955" width="1490" height="155" rx="10" fill="#fafafa" stroke="#666" stroke-dasharray="7 5"/>
  <text x="80" y="995" font-family="sans-serif" font-size="22" font-weight="700">Boundaries and integrity</text>
  <text x="80" y="1033" font-family="sans-serif" font-size="17">No CLI/Python commands. p0031:c01 / PDF 31 begins chapter 5 «Установка».</text>
  <text x="80" y="1065" font-family="sans-serif" font-size="17">Source findings preserved: Soware; «радел» [Needs confirmation]; Amiga,AROS.</text>
  <text x="80" y="1097" font-family="sans-serif" font-size="17">Section-level «Резюме» after 4.1 is not treated as a chapter-end summary artifact.</text>
</svg>
