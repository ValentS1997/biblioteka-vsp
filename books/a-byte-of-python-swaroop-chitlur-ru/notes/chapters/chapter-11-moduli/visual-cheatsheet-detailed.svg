  <text x="80" y="180" font-family="sans-serif" font-size="23" font-weight="700">Reuse model</text>
  <text x="80" y="220" font-family="sans-serif" font-size="18">functions reuse blocks inside programs → modules reuse programs/functions across programs → packages organize modules.</text>

  <rect x="55" y="305" width="500" height="350" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="80" y="345" font-family="sans-serif" font-size="23" font-weight="700">Import + environment</text>
  <text x="80" y="390" font-family="monospace" font-size="17">import sys</text>
  <text x="80" y="430" font-family="monospace" font-size="17">sys.argv</text>
  <text x="80" y="470" font-family="monospace" font-size="17">sys.path</text>
