  <text x="80" y="555" font-family="sans-serif" font-size="17">first import executes module body</text>
  <text x="80" y="590" font-family="sans-serif" font-size="16">.pyc/cache placement: source-historical claim</text>

  <rect x="610" y="305" width="500" height="350" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="635" y="345" font-family="sans-serif" font-size="23" font-weight="700">Import forms + __name__</text>
  <text x="635" y="390" font-family="monospace" font-size="17">from sys import argv</text>
  <text x="635" y="430" font-family="monospace" font-size="17">from sys import *</text>
  <text x="635" y="470" font-family="sans-serif" font-size="17">source prefers plain import</text>
  <text x="635" y="515" font-family="monospace" font-size="17">__name__ == '__main__'</text>
  <text x="635" y="555" font-family="sans-serif" font-size="17">direct run vs imported module</text>

  <rect x="1165" y="305" width="500" height="350" rx="10" fill="#fafafa" stroke="#444"/>
  <text x="1190" y="345" font-family="sans-serif" font-size="23" font-weight="700">Own module</text>
  <text x="1190" y="390" font-family="monospace" font-size="17">mymodule.py</text>
  <text x="1190" y="430" font-family="monospace" font-size="17">mymodule.sayhi()</text>
  <text x="1190" y="470" font-family="monospace" font-size="17">mymodule.__version__</text>
