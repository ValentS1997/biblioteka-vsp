<text x="852" y="952" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Cloud: IAM scope / subscription / region</text>
<text x="852" y="983" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">AWS CloudWatch cost до массового опроса</text>
<text x="852" y="1014" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Azure secret Value хранить в vault</text>
