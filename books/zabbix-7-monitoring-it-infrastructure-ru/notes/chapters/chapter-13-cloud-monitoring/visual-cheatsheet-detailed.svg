<text x="68" y="952" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Master: Docker Get info (docker.info)</text>
<text x="68" y="983" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Dependent items + preprocessing</text>
<text x="68" y="1014" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">2 LLD: containers и images</text>
<text x="68" y="1045" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">docker.containers.discovery → {#NAME}</text>
<text x="68" y="1076" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">docker.container_info → per-container master</text>
<text x="68" y="1107" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Dependent item prototypes → container stats</text>
<text x="68" y="1138" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Детали JSONPath из рисунков: RAG_MISS</text>
