<text x="593" y="406" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Проверять реальные values, а не только host</text>
<text x="593" y="455" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p497–498</text>
