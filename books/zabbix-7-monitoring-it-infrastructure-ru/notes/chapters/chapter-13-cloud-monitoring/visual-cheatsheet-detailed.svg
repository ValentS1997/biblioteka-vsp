<text x="593" y="282" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">API response → JSON → LLD</text>
<text x="593" y="313" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Три discovery rules (EC2 / RDS / S3)</text>
