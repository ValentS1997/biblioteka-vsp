<text x="852" y="762" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Template Docker by Zabbix agent 2</text>
<text x="852" y="807" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG p507–509</text>
