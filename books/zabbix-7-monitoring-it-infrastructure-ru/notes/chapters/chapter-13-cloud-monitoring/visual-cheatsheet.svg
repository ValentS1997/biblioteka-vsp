<text x="976" y="328" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">docker.info → dependent items</text>
<text x="976" y="358" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">containers.discovery → {#NAME}</text>
<text x="976" y="388" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">container_info → per-container</text>
