<text x="97" y="328" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Region macro: {$AWS.REGION}</text>
<text x="97" y="358" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Script JavaScript → AWS API</text>
<text x="97" y="388" fill="#26364c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">3 LLD: EC2 / RDS / S3</text>
