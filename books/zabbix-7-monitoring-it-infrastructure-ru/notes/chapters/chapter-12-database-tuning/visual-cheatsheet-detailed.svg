<text x="1123" y="248" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">External mysql_zbx_part.pl (not checked)</text><text x="1123" y="279" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">$db_schema, user, password, $tables</text><text x="1123" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Retention 30 days + 12 months</text><text x="1123" y="341" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Cron 55 22 * * * + journalctl</text><text x="1123" y="372" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Creates 10 future partitions</text><text x="1123" y="403" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Drops old partitions: irreversible</text>
