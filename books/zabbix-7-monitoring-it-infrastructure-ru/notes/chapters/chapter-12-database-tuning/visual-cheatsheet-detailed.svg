<line x1="856" y1="551" x2="1584" y2="551" stroke="#cbd5e1" stroke-width="2"/>
<text x="856" y="600" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Secure-db MariaDB; secure-zbx Zabbix server</text><text x="856" y="632" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">CA → certificate/key → MariaDB ssl-ca/cert/key</text><text x="856" y="664" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Zabbix DBTLSConnect=verify_full</text><text x="856" y="696" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">DBTLSCAFile + DBTLSCertFile + DBTLSKeyFile</text><text x="856" y="728" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">CA 3650d, end-entity 365d: renewal required</text><text x="856" y="760" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Frontend TLS fields only in screenshot: RAG_MISS</text>
<text x="856" y="808" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p479–489</text>
