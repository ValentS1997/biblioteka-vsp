<text x="856" y="953" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Backup and restore tested before all changes</text><text x="856" y="984" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Partition coverage and future insert verified</text><text x="856" y="1015" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Only disable housekeeper after tested script</text><text x="856" y="1046" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Extension/schema/version match, no empty chunks</text><text x="856" y="1077" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">DB TLS CA/host/user/grants match; no secrets leaked</text><text x="856" y="1108" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Zabbix server AND frontend DB paths checked</text><text x="856" y="1139" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Full rollback absent in source: Needs confirmation</text>
