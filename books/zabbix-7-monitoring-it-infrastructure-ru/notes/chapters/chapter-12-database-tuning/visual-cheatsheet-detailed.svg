<text x="455" y="645" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#263448">Hypertables / time chunks</text>
<text x="74" y="712" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">timescaledb-tune → extension → Zabbix SQL</text><text x="74" y="741" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">pg_hba.conf → server access; source line breaks</text><text x="74" y="770" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">UI retention global + possible compression</text>
