<text x="851" y="593" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Default host inventory Automatic: только новые</text><text x="851" y="626" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Существующие hosts: отдельный Inventory / Mass update</text><text x="851" y="659" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Template Item: Populates host inventory → поле</text><text x="851" y="692" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Host location latitude + longitude → Geomap widget</text><text x="851" y="725" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Tile provider: Administration → Geographical maps</text><text x="851" y="758" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Координаты из рисунков = RAG_MISS</text>
