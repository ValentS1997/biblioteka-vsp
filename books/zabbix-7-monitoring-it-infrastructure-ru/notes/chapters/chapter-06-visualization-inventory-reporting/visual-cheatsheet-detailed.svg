<text x="851" y="950" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Zabbix setup → Zabbix server / DB / frontend</text><text x="851" y="981" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Frontend → ICMP и Zabbix agent child services</text><text x="851" y="1012" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Additional rule: at least 2 children High+</text><text x="851" y="1043" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Base service status: Set status to OK</text><text x="851" y="1074" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Если agent упал, ICMP жив — SLA frontend OK</text><text x="851" y="1105" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Services → SLA report → цель 99.9% / error budget</text><text x="851" y="1136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Октябрь и ноябрь 2021 — исторический пример</text>
