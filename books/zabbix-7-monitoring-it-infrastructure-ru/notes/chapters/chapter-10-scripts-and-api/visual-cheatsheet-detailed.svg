<text x="90" y="640" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#253751">API source of truth</text>
<rect x="430" y="575" width="347" height="96" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="449" y="610" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#9a3412">/etc/hosts overwrite</text>
<text x="449" y="640" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#253751">Полная перезапись</text>
<text x="72" y="712" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">host_pull_zabbix.py — внешний код (не прочитан)</text><text x="72" y="739" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Проверка: cat /etc/hosts, SSH по имени</text><text x="72" y="766" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">cron: */15 * * * * → повторяет изменения</text><text x="72" y="793" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Путь cron /home/ не обоснован шагами</text><text x="72" y="820" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Нужны backup / restore / scope</text>
<rect x="824" y="495" width="786" height="349" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="852" y="540" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">05  MAP SCRIPT / ELEVATION</text>
<line x1="852" y1="555" x2="1584" y2="555" stroke="#cbd5e1" stroke-width="2"/>
<text x="852" y="594" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Alerts → Scripts: Host/Enable / Host/Disable</text><text x="852" y="626" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Monitoring → Maps → host → Execute</text><text x="852" y="658" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">User role кликает; elevated identity выполняет</text><text x="852" y="690" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">enable_disable-host.py из внешнего архива v2.0</text><text x="852" y="722" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Status Disabled vs maintenance — источник расходится</text><text x="852" y="754" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">{HOST.HOST} → {MANUALINPUT}</text><text x="852" y="786" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Input validation rule рисунка = RAG_MISS</text>
<text x="852" y="822" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG p427–433</text>
<rect x="40" y="868" width="764" height="321" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="68" y="914" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">06  SOURCE FINDINGS</text>
<line x1="68" y1="928" x2="779" y2="928" stroke="#cbd5e1" stroke-width="2"/>
<text x="68" y="972" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">/home/results vs /home/zabbix/results</text><text x="68" y="1003" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Endpoint apijsonrpc vs api_jsonrpc.php</text><text x="68" y="1034" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">mv enable_disable-host.py./ — слитые аргументы</text><text x="68" y="1065" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">API token literal и пробелы в token p429</text><text x="68" y="1096" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Нет кода с внешних ссылок (RAG_MISS)</text><text x="68" y="1127" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Периодическое полное удаление старых hosts-строк</text>
<rect x="824" y="868" width="786" height="321" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="852" y="914" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">07  ПРИЁМКА / SAFETY GATE</text>
<line x1="852" y1="928" x2="1584" y2="928" stroke="#cbd5e1" stroke-width="2"/>
<text x="852" y="972" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Least privilege user/token + expiry</text><text x="852" y="1003" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">host.get: корректные host/IP без секретов</text><text x="852" y="1034" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Filesystem: разрешён только lab output</text><text x="852" y="1065" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">No production /etc/hosts rewrite</text><text x="852" y="1096" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Privilege: ограничить скрипт, audit target</text><text x="852" y="1127" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">MANUALINPUT validation + code review</text>
