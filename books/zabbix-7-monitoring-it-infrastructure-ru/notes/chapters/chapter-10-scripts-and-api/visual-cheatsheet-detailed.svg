<text x="47" y="100" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#dbeafe">Права API → JSON-RPC → Python → файлы или привилегированные действия</text>
<rect x="40" y="150" width="505" height="321" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="67" y="194" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">01  АВТОРИЗАЦИЯ</text>
<line x1="67" y1="208" x2="520" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="67" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Users → User groups: API Users</text><text x="67" y="278" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Host + Template permissions</text><text x="67" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">API user → role + effective rights</text><text x="67" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Users → API tokens: API book key</text><text x="67" y="374" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Expires: установить срок и ротацию</text><text x="67" y="406" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Super admin в книге — риск</text>
<text x="67" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p413–417</text>
<rect x="564" y="150" width="506" height="321" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="592" y="194" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">02  JSON-RPC host.get</text>
<line x1="592" y1="208" x2="1044" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="592" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Python3 + requests</text><text x="592" y="278" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">POST /api_jsonrpc.php</text><text x="592" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">jsonrpc=2.0; method=host.get</text><text x="592" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">output: hostid, host</text><text x="592" y="374" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">selectInterfaces: id, ip, main</text><text x="592" y="406" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Отбор primary IP: main == 1</text>
<text x="592" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p418–422</text>
<rect x="1088" y="150" width="522" height="321" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="1115" y="194" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">03  РЕЗУЛЬТАТЫ</text>
<line x1="1115" y1="208" x2="1584" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="1115" y="246" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">get_hosts → parsed JSON</text><text x="1115" y="278" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">generate_host_file → hostname IP</text><text x="1115" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">cat /home/zabbix/results</text><text x="1115" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">p422: /home/results — расхождение</text><text x="1115" y="374" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">API read ≠ file write</text><text x="1115" y="406" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#253751">Auth token не логировать и не хранить в Git</text>
<text x="1115" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG p420–422</text>
<rect x="40" y="495" width="764" height="349" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
