<text x="47" y="99" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#dbeafe">Эксплуатация: предупреждение о работах, восстановление, обновление, производительность</text>
<rect x="40" y="150" width="507" height="329" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="67" y="195" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">01  MAINTENANCE WINDOWS</text>
<line x1="67" y1="209" x2="518" y2="209" stroke="#cbd5e1" stroke-width="2"/>
<text x="67" y="253" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Data collection → Maintenance</text><text x="67" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Active since/till + Periods</text><text x="67" y="315" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Host groups: Linux servers</text><text x="67" y="346" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">With data collection: опрос остаётся</text><text x="67" y="377" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Pause operations for suppressed problems</text><text x="67" y="408" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Пример: вторник 22–04, до 31.12.2023</text>
<text x="67" y="458" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">p435–437: противоречие типа режима</text>
<rect x="571" y="150" width="508" height="329" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="597" y="195" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">02  BACKUP: НЕ ТОЛЬКО DB</text>
<line x1="597" y1="209" x2="1052" y2="209" stroke="#cbd5e1" stroke-width="2"/>
<text x="597" y="253" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Zabbix /etc/zabbix</text><text x="597" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Web: nginx / apache + frontend files</text><text x="597" y="315" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Libraries /usr/lib/zabbix</text><text x="597" y="346" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Database: mysqldump или pg_dump</text><text x="597" y="377" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Хранить off-host / вне раздела</text><text x="597" y="408" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Restore test: в книге не показан</text>
<text x="597" y="458" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">p438–441: cron paths и passwords — риск</text>
<rect x="1104" y="150" width="506" height="329" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="1131" y="195" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">03  PHP И MARIADB</text>
<line x1="1131" y1="209" x2="1584" y2="209" stroke="#cbd5e1" stroke-width="2"/>
<text x="1131" y="253" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Check php-fpm / mysql / mariadb versions</text><text x="1131" y="284" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">RHEL8: PHP 8.2 AppStream / 8.3 REMI</text><text x="1131" y="315" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Ubuntu: PPA 8.3 — синтаксис спорный</text><text x="1131" y="346" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">MariaDB 11.4 LTS — учебный target</text><text x="1131" y="377" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">DB upgrade требует downtime + backup</text><text x="1131" y="408" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Unsupported DB bypass не рекомендован</text>
<text x="1131" y="458" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">p442–450: URLs/версии — контекст издания</text>
<rect x="40" y="506" width="768" height="331" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="67" y="549" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">04  ZABBIX 6 → 7: ОКНО ОБНОВЛЕНИЯ</text>
<line x1="67" y1="561" x2="781" y2="561" stroke="#cbd5e1" stroke-width="2"/>
<rect x="67" y="587" width="330" height="87" rx="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.6"/>
<text x="86" y="621" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#075985">1. Baseline + backups</text>
<text x="86" y="651" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#25364c">Версии, журналы, config</text>
<rect x="440" y="587" width="342" height="87" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.6"/>
<text x="457" y="621" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#3730a3">2. PHP/DB, затем Zabbix</text>
<text x="457" y="651" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#25364c">Окно, packages, migrations</text>
<text x="72" y="722" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">3. Проверить zabbix_server.log / systemctl status</text><text x="72" y="753" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">4. Проверить frontend и реальные Latest data</text><text x="72" y="784" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">5. План rollback схемы DB нужен отдельно</text>
<rect x="829" y="506" width="781" height="331" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="854" y="549" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">05  DISCOVERY PROCESS UTILIZATION</text>
<line x1="854" y1="561" x2="1583" y2="561" stroke="#cbd5e1" stroke-width="2"/>
<text x="854" y="608" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Monitoring → Hosts → Latest data: discovery</text><text x="854" y="640" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Почти 100% utilization — учебный признак</text><text x="854" y="672" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">StartDiscoverers=2 повышает concurrency</text><text x="854" y="704" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Каждый LLD rule обрабатывает один процесс</text><text x="854" y="736" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Проверить CPU/RAM/DB connections</text><text x="854" y="768" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Не всегда больше процессов = исправление</text>
<text x="854" y="812" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">p455–462 · масштабирование или proxy</text>
<rect x="40" y="867" width="768" height="336" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="67" y="912" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">06  HOUSEKEEPING И HISTORY</text>
<line x1="67" y1="926" x2="781" y2="926" stroke="#cbd5e1" stroke-width="2"/>
<text x="67" y="973" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">HousekeepingFrequency=2: каждые 2 часа</text><text x="67" y="1004" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">MaxHousekeeperDelete=20000: строки за run</text><text x="67" y="1035" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Издания: было 5000 строк каждый час</text><text x="67" y="1066" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Retention: глобально + на уровне item</text><text x="67" y="1097" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Рост DB → partitioning / TimescaleDB</text><text x="67" y="1128" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">find -delete для backup — destructive</text>
<text x="67" y="1183" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">p457–463 · изменение интервала не лечит причину</text>
<rect x="829" y="867" width="781" height="336" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="854" y="912" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">07  DB TUNING И ASYNC POLLERS</text>
<line x1="854" y1="926" x2="1584" y2="926" stroke="#cbd5e1" stroke-width="2"/>
<text x="854" y="973" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">MySQLTuner: Variables to adjust — гипотезы</text><text x="854" y="1004" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Не исполнять сторонний script без проверки</text><text x="854" y="1035" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">my.cnf правки → отдельная оценка и restart</text><text x="854" y="1066" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Agent/HTTP/SNMP get/walk: async pollers</text><text x="854" y="1097" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">MaxConcurrentChecksPerPoller: до 1000</text><text x="854" y="1128" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#25364c">Недостающие поля UI и rollback: RAG_MISS</text>
<text x="854" y="1183" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">p459–464 · validate changes before production</text>
<line x1="40" y1="1240" x2="1610" y2="1240" stroke="#cbd5e1" stroke-width="2"/>
<text x="43" y="1283" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#475569">RAG-only · PDF 434–464 · Source SHA256 07204d88…e63875a27 · 6 разделов · 7 файлов</text>
<text x="43" y="1325" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b">Destructive: cron backup deletion · Security: inline DB secrets, remote repo scripts · State-changing: package upgrades</text>
<text x="43" y="1365" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b">Не подменять исторические версии актуальными или RAG_MISS значениями из рисунков. Reading state unchanged.</text>
