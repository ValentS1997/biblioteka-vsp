<text x="88" y="635" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1d3149">Operations → recipients</text>
<rect x="405" y="565" width="300" height="97" rx="15" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="423" y="602" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#3730a3">OK / RECOVERY</text>
<text x="423" y="635" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1d3149">Recovery operations</text>
<rect x="740" y="565" width="278" height="97" rx="15" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="759" y="602" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#166534">UPDATE</text>
<text x="759" y="635" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#1d3149">Update operations</text>
<text x="77" y="711" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Alerts → Actions → Trigger actions → Create action / Enabled</text>
<text x="77" y="739" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Alerts → Media types → Email: SMTP + Message templates</text>
<text x="77" y="767" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Users → Users → Media: фактический адрес / маршрут</text>
<rect x="1070" y="482" width="538" height="322" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1095" y="525" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">05  ЭФФЕКТИВНОСТЬ</text>
<line x1="1095" y1="540" x2="1582" y2="540" stroke="#cbd5e1" stroke-width="2"/>
<text x="1095" y="576" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Понятное имя: сервис/порт/контекст</text>
<text x="1095" y="606" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Теги: component + scope</text>
<text x="1095" y="636" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">scope: availability / performance /</text>
<text x="1095" y="666" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">notification / security / capacity</text>
<text x="1095" y="696" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Шаблон email: нужные поля и формат</text>
<text x="1095" y="726" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Global severity: Not classified → Disaster</text>
<text x="1095" y="756" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Отображение приоритетов P1/P2 по желанию</text>
<rect x="42" y="828" width="756" height="340" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="67" y="872" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">06  КОНТРОЛЬ НАСТРОЙКИ</text>
