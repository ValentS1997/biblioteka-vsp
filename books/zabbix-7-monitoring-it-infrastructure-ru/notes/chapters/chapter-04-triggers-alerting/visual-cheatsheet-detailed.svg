<text x="843" y="983" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">SSH 1=UP, 0=DOWN против PROBLEM при 1</text>
<text x="843" y="1012" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Time-shift: словесный и численный порядок</text>
<text x="843" y="1041" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">SMTP поля, точные expression и рисунки: RAG_MISS</text>
<text x="843" y="1070" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">В коде не используются тестовые пароли/адреса</text>
<text x="843" y="1099" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Чужие системы: без внешнего подтверждения</text>
