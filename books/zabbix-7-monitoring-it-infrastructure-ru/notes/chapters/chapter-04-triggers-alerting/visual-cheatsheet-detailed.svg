<text x="67" y="954" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">2. PROBLEM и recovery тестируются раздельно</text>
<text x="67" y="983" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">3. Порог, severity и интервалы осмысленны</text>
<text x="67" y="1012" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">4. Action Enabled / правильные группы</text>
<text x="67" y="1041" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">5. Media type + Users Media настроены</text>
<text x="67" y="1070" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">6. Получатель проверяет сообщение</text>
<text x="67" y="1099" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">7. Naming и tags помогают отсеять шум</text>
<rect x="818" y="828" width="790" height="340" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="843" y="872" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">07  ГРАНИЦЫ БЕЗОПАСНОСТИ RAG</text>
<line x1="843" y1="886" x2="1582" y2="886" stroke="#cbd5e1" stroke-width="2"/>
<text x="843" y="925" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">iptables -A ... DROP порт 22 может лишить SSH</text>
