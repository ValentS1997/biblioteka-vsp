<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1330" viewBox="0 0 1650 1330" role="img" aria-label="Подробная учебная схема главы 4 Zabbix 7: триггеры, прогнозирование, оповещения и риски">
<rect width="1650" height="1330" fill="#f2f6fc"/>
<rect width="1650" height="126" fill="#172a47"/>
<text x="50" y="64" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#ffffff">ZABBIX 7 / ГЛАВА 04</text>
<text x="50" y="100" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#dbeafe">Триггеры, управление PROBLEM/OK и доставка оповещений · RAG PDF 161–196</text>
<rect x="42" y="150" width="495" height="310" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="67" y="193" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">01  БАЗОВЫЕ ТРИГГЕРЫ</text>
<line x1="67" y1="207" x2="511" y2="207" stroke="#cbd5e1" stroke-width="2"/>
<text x="67" y="243" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Host / item / функция / порог</text>
<text x="67" y="275" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">SSH: доступность TCP/22</text>
<text x="67" y="307" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">change: выход новой версии</text>
<text x="67" y="339" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">OR: несколько items → событие</text>
<text x="67" y="371" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Severity и Update interval</text>
<text x="67" y="403" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#1d3149">Recovery expression для OK</text>
<text x="67" y="439" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#b45309">ВНИМАНИЕ: SSH 0/1 противоречив</text>
<rect x="556" y="150" width="495" height="310" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="581" y="193" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">02  TREND / PREDICTION</text>
<line x1="581" y1="207" x2="1024" y2="207" stroke="#cbd5e1" stroke-width="2"/>
<text x="581" y="243" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">trendavg: часовые тренды</text>
<text x="581" y="274" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">1w:now-1w → прошлый период</text>
<text x="581" y="305" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Порог в примере: 800 Мбит/с</text>
<text x="581" y="336" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">timeleft: 7h → 100 % диска</text>
<text x="581" y="367" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Прогноз: меньше одной недели</text>
<text x="581" y="398" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Не прогнозировать далеко по короткой базе</text>
<text x="581" y="439" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">Исходные формулы в рисунках: RAG_MISS</text>
<rect x="1070" y="150" width="538" height="310" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1095" y="193" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">03  СДВИГ ВРЕМЕНИ</text>
<line x1="1095" y1="207" x2="1582" y2="207" stroke="#cbd5e1" stroke-width="2"/>
<text x="1095" y="243" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Прошлая неделя vs нынешняя</text>
<text x="1095" y="274" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">(80 - 50) = 30 &gt; 20 → TRUE</text>
<text x="1095" y="305" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">(80 - 70) = 10 &gt; 20 → FALSE</text>
<text x="1095" y="336" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Function + arithmetic</text>
<text x="1095" y="367" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Expression constructor → Test</text>
<text x="1095" y="398" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1d3149">Prose о порядке вычитания расходится</text>
<text x="1095" y="439" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#b45309">Проверить выражение, не догадаться</text>
<rect x="42" y="482" width="1009" height="322" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="67" y="525" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">04  ТРИ СОБЫТИЯ → ТРИ ОПЕРАЦИИ</text>
<line x1="67" y1="540" x2="1025" y2="540" stroke="#cbd5e1" stroke-width="2"/>
<rect x="70" y="565" width="300" height="97" rx="15" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
