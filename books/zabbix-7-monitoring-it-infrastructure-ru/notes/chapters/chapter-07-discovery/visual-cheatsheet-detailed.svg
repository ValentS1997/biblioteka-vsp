<line x1="851" y1="549" x2="1583" y2="549" stroke="#cbd5e1" stroke-width="2"/>
<text x="851" y="594" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Master: SNMP interfaces bulk → GetBulk</text><text x="851" y="626" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Tree .1.3.6.1.2.1.2.2.1</text><text x="851" y="658" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Dependent discovery: walk → JSON</text><text x="851" y="690" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">{#IFDESCR}: interface description</text><text x="851" y="722" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">{#SNMPINDEX}: index of each interface</text><text x="851" y="754" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#263448">Dependent item prototypes → per-interface value</text>
<text x="851" y="801" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG p320–327; preprocessing forms: RAG_MISS</text>
<rect x="40" y="846" width="764" height="366" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="67" y="890" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">06  HOSTS ИЗ JSON</text>
<line x1="67" y1="904" x2="778" y2="904" stroke="#cbd5e1" stroke-width="2"/>
<text x="67" y="943" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Validated JSON: vmname, vmip, vmlocation</text><text x="67" y="974" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">zabbix_sender → trapper lldhosts.raw</text><text x="67" y="1005" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JSONPath → {#VMNAME}, {#VMIP}, {#VMLOCATION}</text><text x="67" y="1036" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">LLD rule → Host prototype</text><text x="67" y="1067" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Custom IP interface / host group / template</text><text x="67" y="1098" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Проверить автоматически созданные hosts</text><text x="67" y="1129" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">p329 cron повреждён — НЕ выполнять</text>
<rect x="824" y="846" width="786" height="366" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="851" y="890" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">07  РИСКИ И ПРИЁМКА</text>
<line x1="851" y1="904" x2="1583" y2="904" stroke="#cbd5e1" stroke-width="2"/>
<text x="851" y="943" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Network scan: ограничить IP range / частоту</text><text x="851" y="974" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Autoreg action: ограничить по metadata/name</text><text x="851" y="1005" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Windows/JMX: проверить существующие instances</text><text x="851" y="1036" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">SNMP bulk: сравнить сырое и dependent values</text><text x="851" y="1067" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JSON source: валидировать до sender/cron</text><text x="851" y="1098" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Удаление LLD rule удаляет созданные hosts</text><text x="851" y="1129" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Backup + rollback отдельно подтвердить</text>
