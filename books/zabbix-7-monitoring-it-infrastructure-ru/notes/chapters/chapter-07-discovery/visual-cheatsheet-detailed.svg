<text x="591" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">SNMPv2 agent + community + OID</text><text x="591" y="280" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">sysName .1.3.6.1.2.1.1.5.0</text><text x="591" y="311" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Boot string .1.3.6.1.2.1.25.1.4.0</text><text x="591" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Согласовать реальную SNMP version</text><text x="591" y="373" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Discovery action → host + template</text><text x="591" y="404" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Monitoring → Discovery / Hosts</text>
<text x="591" y="448" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p298–303</text>
