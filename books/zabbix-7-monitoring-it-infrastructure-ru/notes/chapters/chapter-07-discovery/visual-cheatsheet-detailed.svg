<text x="1115" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Agent 2: ServerActive=server/proxy</text><text x="1115" y="280" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Hostname или HostMetadata</text><text x="1115" y="311" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Autoregistration actions (отдельно!)</text><text x="1115" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Operations: Linux servers +</text><text x="1115" y="373" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Linux by Zabbix agent active</text><text x="1115" y="404" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Проверка: Data collection → Hosts</text>
