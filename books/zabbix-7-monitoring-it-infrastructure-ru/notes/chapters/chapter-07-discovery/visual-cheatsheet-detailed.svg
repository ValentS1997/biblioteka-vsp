<text x="44" y="1318" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b">Fields only in screenshots are RAG_MISS; outside URLs not fetched; no secret literals or executable broken cron</text>
<text x="44" y="1354" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b">Разные механизмы обнаружения не взаимозаменяемы: IP scan ≠ active agent request ≠ dependent LLD</text>
