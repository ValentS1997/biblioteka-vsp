<text x="67" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">IP range → network discovery rule</text><text x="67" y="280" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Key: agent.hostname → lnx / win</text><text x="67" y="311" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">UP + service Zabbix Agent</text><text x="67" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Discovery actions: conditions/operations</text><text x="67" y="373" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Hosts → group + template</text><text x="67" y="404" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">5 min учебно, 1 hour экономнее</text>
<text x="67" y="448" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG p292–298</text>
