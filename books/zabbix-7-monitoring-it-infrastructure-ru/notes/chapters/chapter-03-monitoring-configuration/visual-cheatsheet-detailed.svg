<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1370" viewBox="0 0 1650 1370" role="img" aria-label="Подробная схема главы 3 Zabbix: Agent2 SNMP GetBulk trapper dependent JMX ODBC HTTP browser и preprocessing">
<rect width="1650" height="1370" fill="#f2f6fc"/>
<rect width="1650" height="126" fill="#172a47"/>
<text x="48" y="60" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#ffffff">ZABBIX 7 / ГЛАВА 3</text>
<text x="48" y="99" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#dbeafe">Практическая карта мониторинга по принятому RAG, PDF 93–160</text>
<rect x="40" y="150" width="501" height="321" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">01  AGENT 2</text>
<line x1="66" y1="208" x2="516" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="66" y="248" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">RHEL/Ubuntu: установить zabbix-agent2</text><text x="66" y="281" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Пассивный: Server=&lt;server IP&gt;</text><text x="66" y="314" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Сервер / прокси инициирует опрос</text><text x="66" y="347" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Активный: ServerActive=&lt;server&gt;</text><text x="66" y="380" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Agent собирает и отправляет значение</text><text x="66" y="413" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Hostname совпадает с Host name в Zabbix</text>
<text x="66" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">Проверка: зелёный ZBX + Latest data</text>
<rect x="560" y="150" width="501" height="321" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="586" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">02  SNMPv3 И GETBULK</text>
<line x1="586" y1="208" x2="1036" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="586" y="248" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Old: отдельные OID / интерфейс SNMP</text><text x="586" y="281" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">New: walk[] → единый GetBulk поток</text><text x="586" y="314" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Master SNMP item → dependent item</text><text x="586" y="347" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Preprocessing: OID + индекс порта</text><text x="586" y="380" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Macross: SNMPV3_AUTH / SNMPV3_PRIV</text><text x="586" y="413" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Secret text: скрывает, но не шифрует</text>
<text x="586" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">Проверка: snmpwalk + Latest data</text>
<rect x="1080" y="150" width="530" height="321" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1106" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">03  SIMPLE / TRAPPER</text>
<line x1="1106" y1="208" x2="1584" y2="208" stroke="#cbd5e1" stroke-width="2"/>
<text x="1106" y="248" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Simple check: TCP-сервис с точки Zabbix</text><text x="1106" y="281" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Брандмауэр может дать false Down</text><text x="1106" y="314" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Value mapping: 0/1 → Down/Up</text><text x="1106" y="347" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Trapper: Zabbix sender → ключ item</text><text x="1106" y="380" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">-z сервер, -s хост, -k ключ, -o value</text><text x="1106" y="413" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Проверка: получено нужное значение</text>
<text x="1106" y="449" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">Ключ simple check: см. source-findings</text>
<rect x="40" y="492" width="771" height="347" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="538" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">04  СОСТАВНЫЕ МЕТРИКИ И SCRIPT</text>
<line x1="66" y1="550" x2="786" y2="550" stroke="#cbd5e1" stroke-width="2"/>
<rect x="66" y="577" width="345" height="107" rx="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="83" y="615" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#075985">Calculated</text>
<text x="83" y="649" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">15-минутная средняя памяти</text>
<rect x="439" y="577" width="345" height="107" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="456" y="615" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#3730a3">Dependent</text>
<text x="456" y="649" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Master → preprocessing → value</text>
<text x="72" y="726" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">External check: script в каталоге ExternalScripts</text><text x="72" y="756" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Файл исполняется от имени службы Zabbix</text><text x="72" y="786" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">STDOUT/STDERR → значения элемента</text><text x="72" y="816" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">SSH item → данные MariaDB → dependent</text>
<rect x="832" y="492" width="778" height="347" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="858" y="538" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">05  JMX / ODBC / HTTP</text>
<line x1="858" y1="550" x2="1584" y2="550" stroke="#cbd5e1" stroke-width="2"/>
<text x="858" y="587" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JMX: Zabbix → Java gateway → Tomcat</text><text x="858" y="620" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JavaGateway + StartJavaPollers, порт 10052</text><text x="858" y="653" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">ODBC: драйвер/DSN → запрос MariaDB</text><text x="858" y="686" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">odbcinst -j → путь; isql -v book → тест</text><text x="858" y="719" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">HTTP agent: GET/response → JSONPath</text><text x="858" y="752" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Запрос может создавать внешнюю нагрузку</text><text x="858" y="785" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Нет универсального rollback из главы</text>
<text x="858" y="817" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">RAG: p0133–p0143</text>
<rect x="40" y="861" width="771" height="374" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="908" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#155e75">06  BROWSER ITEM</text>
<line x1="66" y1="920" x2="786" y2="920" stroke="#cbd5e1" stroke-width="2"/>
<text x="66" y="960" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Selenium standalone-chrome → WebDriver</text><text x="66" y="991" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">WebDriverURL=http://localhost:4444</text><text x="66" y="1022" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">StartBrowserPollers=2</text><text x="66" y="1053" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JS: URL → логин → Reports / System info</text><text x="66" y="1084" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Result JSON → dependent метрики</text><text x="66" y="1115" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Штатно выходить из сеанса / обрабатывать ошибки</text><text x="66" y="1146" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Исходный сервис restart с опечаткой!</text><text x="66" y="1177" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Файл внешнего JS отдельно не загружался</text>
<text x="66" y="1214" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG: p0143–p0153 • RAG_MISS по рисункам</text>
<rect x="832" y="861" width="778" height="374" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="858" y="908" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#155e75">07  PREPROCESSING + БЕЗОПАСНОСТЬ</text>
<line x1="858" y1="920" x2="1584" y2="920" stroke="#cbd5e1" stroke-width="2"/>
<text x="858" y="960" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Raw RX traffic → Regexp → группа \2</text><text x="858" y="991" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Custom on fail → Discard value</text><text x="858" y="1022" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Discard unchanged → не хранить дубли</text><text x="858" y="1053" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">system.run[*] расширяет удалённое исполнение</text><text x="858" y="1084" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">JMX authenticate=false / ssl=false — риск</text><text x="858" y="1115" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">SNMP v3 / Secret text — проверить хранение</text><text x="858" y="1146" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">CI проверяет SVG, НЕ production-пригодность</text><text x="858" y="1177" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#263448">Полный rollback: Needs confirmation</text>
<text x="858" y="1214" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#a16207">RAG: p0154–p0160 • исходные дефекты в findings</text>
<line x1="40" y1="1260" x2="1610" y2="1260" stroke="#cbd5e1" stroke-width="2"/>
<text x="42" y="1302" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#475569">Источник: accepted RAG, PDF 93–160  ·  SHA-256 07204d88…e63875a27  ·  разделы 1–11 главы 3</text>
<text x="42" y="1336" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#64748b">Точные поля только на рисунках не восстанавливаются из памяти модели — RAG_MISS; нет ZIP и внешних источников</text>
</svg>