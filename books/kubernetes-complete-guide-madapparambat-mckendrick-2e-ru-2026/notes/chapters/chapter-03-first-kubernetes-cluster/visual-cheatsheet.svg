<text x="436" y="431" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1d3b4d">Остановка</text>
<text x="436" y="468" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">minikube stop / pause</text>
<text x="436" y="496" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">возврат: start / unpause</text>
<rect x="800" y="362" width="364" height="184" rx="13" fill="#ffffff" stroke="#cddbe4" stroke-width="1.4"/>
