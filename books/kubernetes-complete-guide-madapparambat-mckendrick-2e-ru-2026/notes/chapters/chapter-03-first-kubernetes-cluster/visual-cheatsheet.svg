<text x="818" y="229" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1d3b4d">kind</text>
<text x="818" y="266" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">YAML: control-plane + workers</text>
<text x="818" y="294" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">контейнерные узлы</text>
