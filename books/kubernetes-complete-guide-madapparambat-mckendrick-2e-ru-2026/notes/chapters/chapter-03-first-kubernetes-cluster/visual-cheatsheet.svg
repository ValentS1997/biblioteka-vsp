<text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1d3b4d">Baseline</text>
<text x="54" y="266" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">kubectl, ≥2 CPU, ≥2 ГБ RAM</text>
<text x="54" y="294" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">≥20 ГБ disk; драйвер</text>
<rect x="418" y="160" width="364" height="184" rx="13" fill="#ffffff" stroke="#cddbe4" stroke-width="1.4"/>
<rect x="418" y="160" width="364" height="8" rx="4" fill="#2a7a74"/>
