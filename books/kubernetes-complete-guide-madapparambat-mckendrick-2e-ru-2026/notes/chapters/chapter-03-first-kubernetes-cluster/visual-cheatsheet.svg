<text x="54" y="468" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">context, get nodes</text>
<text x="54" y="496" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">cluster-info, readyz</text>
<rect x="418" y="362" width="364" height="184" rx="13" fill="#ffffff" stroke="#cddbe4" stroke-width="1.4"/>
