<text x="436" y="229" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1d3b4d">minikube</text>
<text x="436" y="266" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">VM / Docker / Podman</text>
<text x="436" y="294" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">start, status, профили</text>
