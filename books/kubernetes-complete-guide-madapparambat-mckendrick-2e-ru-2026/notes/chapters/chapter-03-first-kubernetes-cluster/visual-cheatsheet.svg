<text x="818" y="468" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">minikube delete / kind delete</text>
<text x="818" y="496" font-size="16" fill="#3a5a6a" font-family="DejaVu Sans, sans-serif">состояние теряется</text>
<text x="36" y="593" fill="#5b7584" font-family="DejaVu Sans, sans-serif" font-size="14">Удаление кластеров разрушает состояние · команды запуска только для разрешённой лаборатории</text>
