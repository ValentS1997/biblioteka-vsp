<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 12. Печать и CUPS</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Client → cupsd → queue → MIME/PPD → filters → backend → printer</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">CUPS pipeline</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.3" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Submit: lpr / lp / GUI</tspan><tspan x="42" dy="25">Server: cupsd</tspan><tspan x="42" dy="25">Queue: job ID + scheduling</tspan><tspan x="42" dy="25">MIME detection</tspan><tspan x="42" dy="25">PPD capabilities</tspan><tspan x="42" dy="25">Filter chain</tspan><tspan x="42" dy="25">Backend transport</tspan><tspan x="42" dy="25">Physical/network printer</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">Port/protocol context: IPP over CUPS service</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Queue control</text><text x="562" y="184" font-family="Consolas, monospace" font-size="15.2" font-weight="500" fill="#17324d"><tspan x="562" dy="0">Read-only:</tspan><tspan x="562" dy="24">lpq</tspan><tspan x="562" dy="24">lpstat -t</tspan><tspan x="562" dy="24"></tspan><tspan x="562" dy="24">Input side:</tspan><tspan x="562" dy="24">reject / accept</tspan><tspan x="562" dy="24"></tspan><tspan x="562" dy="24">Output side:</tspan><tspan x="562" dy="24">cupsdisable / cupsenable</tspan><tspan x="562" dy="24"></tspan><tspan x="562" dy="24">Short outage ≠ long outage</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Printer definition</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">lpinfo -v → visible backends/devices</tspan><tspan x="1084" dy="25">lpadmin → system-level queue config</tspan><tspan x="1084" dy="25">lpoptions → defaults / instances</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Queue definition needs:</tspan><tspan x="1084" dy="25">• name</tspan><tspan x="1084" dy="25">• URI/backend</tspan><tspan x="1084" dy="25">• PPD/model</tspan><tspan x="1084" dy="25">• access policy</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Delete: lpadmin -x</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">MIME / PPD / filters</text><text x="42" y="506" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="42" dy="0">/etc/cups/mime.types</tspan><tspan x="42" dy="28">  → identify input type</tspan><tspan x="42" dy="28">/etc/cups/mime.convs</tspan><tspan x="42" dy="28">  → conversion graph + cost</tspan><tspan x="42" dy="28">PPD</tspan><tspan x="42" dy="28">  → printer capabilities / final filter</tspan><tspan x="42" dy="28"></tspan><tspan x="42" dy="28">locate pstops</tspan><tspan x="42" dy="28">  → inspect installed filter area</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Network printing</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.1" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Client needs queue + destination</tspan><tspan x="562" dy="27">Server needs queue + authorization</tspan><tspan x="562" dy="27">Backend needs reachable printer</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Subnets:</tspan><tspan x="562" dy="27">BrowsePoll / BrowseRelay pattern</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Reachability check:</tspan><tspan x="562" dy="27">telnet &lt;host&gt; 631</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Do not copy example network values blindly.</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Troubleshooting</text><text x="1084" y="506" font-family="Consolas, monospace" font-size="15" font-weight="500" fill="#17324d"><tspan x="1084" dy="0">1. lpstat -t / lpq</tspan><tspan x="1084" dy="25">2. CUPS logs</tspan><tspan x="1084" dy="25">3. lpinfo -v</tspan><tspan x="1084" dy="25">4. PPD/filter path</tspan><tspan x="1084" dy="25">5. backend</tspan><tspan x="1084" dy="25">6. network/device</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">USB direct probe:</tspan><tspan x="1084" dy="25">/usr/lib/cups/backend/usb</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Then submit one controlled test job.</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: print failure локализуется по слоям; менять очередь, filters и device path одновременно нельзя.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">После изменения — один controlled test job и проверка фактического physical/network output.</text></svg>