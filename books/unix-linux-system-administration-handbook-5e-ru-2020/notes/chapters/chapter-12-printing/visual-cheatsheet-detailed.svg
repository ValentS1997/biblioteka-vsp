<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 12. Печать — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">CUPS/IPP, queues, PPD/MIME filters, printer backends, network printing и troubleshooting</text><rect x="12" y="100" width="430" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="430" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Architecture</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="34" dy="0">Client / CLI / GUI</tspan><tspan x="34" dy="20">  ↓</tspan><tspan x="34" dy="20">cupsd</tspan><tspan x="34" dy="20">  ↓</tspan><tspan x="34" dy="20">queue</tspan><tspan x="34" dy="20">  ↓</tspan><tspan x="34" dy="20">MIME + PPD + filters</tspan><tspan x="34" dy="20">  ↓</tspan><tspan x="34" dy="20">backend</tspan><tspan x="34" dy="20">  ↓</tspan><tspan x="34" dy="20">printer</tspan><tspan x="34" dy="20"></tspan><tspan x="34" dy="20">CUPS uses an HTTP-oriented IPP service model.</tspan></text><rect x="456" y="100" width="550" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="456" y="100" width="550" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="474" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Queue and user commands</text><text x="480" y="168" font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#17324d"><tspan x="480" dy="0">lpr / lp        → submit</tspan><tspan x="480" dy="20">lpq             → queue state</tspan><tspan x="480" dy="20">lprm / cancel   → remove job</tspan><tspan x="480" dy="20">lpstat -t       → server summary</tspan><tspan x="480" dy="20"></tspan><tspan x="480" dy="20">Default printer:</tspan><tspan x="480" dy="20">PRINTER env or lpoptions -d</tspan><tspan x="480" dy="20"></tspan><tspan x="480" dy="20">Printer instances:</tspan><tspan x="480" dy="20">lpoptions -p queue/instance -o ...</tspan><tspan x="480" dy="20"></tspan><tspan x="480" dy="20">Input: accept/reject | Output: enable/disable</tspan></text><rect x="1020" y="100" width="568" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1020" y="100" width="568" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1038" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. MIME / PPD / filter graph</text><text x="1044" y="168" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="1044" dy="0">/etc/cups/mime.types</tspan><tspan x="1044" dy="21">  identify document MIME type</tspan><tspan x="1044" dy="21"></tspan><tspan x="1044" dy="21">/etc/cups/mime.convs</tspan><tspan x="1044" dy="21">  define conversions + relative costs</tspan><tspan x="1044" dy="21"></tspan><tspan x="1044" dy="21">PPD</tspan><tspan x="1044" dy="21">  printer capabilities + final conversion info</tspan><tspan x="1044" dy="21"></tspan><tspan x="1044" dy="21">CUPS selects a valid low-cost filter chain.</tspan><tspan x="1044" dy="21">Backend receives printer-ready data.</tspan></text><rect x="12" y="416" width="650" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="650" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Printer/server configuration</text><text x="36" y="484" font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#17324d"><tspan x="36" dy="0">lpinfo -v → discover devices/backends/URI schemes</tspan><tspan x="36" dy="20">lpadmin    → create/delete/configure queues</tspan><tspan x="36" dy="20">lpoptions  → defaults / user options / instances</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Queue definition:</tspan><tspan x="36" dy="20">name + URI/backend + PPD/model + policy</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">cupsd.conf controls server/network behavior.</tspan><tspan x="36" dy="20">Manual config changes require daemon restart in chapter workflow.</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Always verify with lpstat -t before production use.</tspan></text><rect x="676" y="416" width="912" height="292" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="676" y="416" width="912" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="694" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">5. Network printing path</text><rect x="700" y="490" width="145" height="38" rx="7" fill="#fff0f6" stroke="#e46aa6" stroke-width="1"/><text x="772" y="514" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9c1651" text-anchor="middle">Client queue</text><line x1="845" y1="509" x2="890" y2="509" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="892" y="490" width="145" height="38" rx="7" fill="#fff0f6" stroke="#e46aa6" stroke-width="1"/><text x="964" y="514" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9c1651" text-anchor="middle">cupsd server</text><line x1="1037" y1="509" x2="1082" y2="509" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1084" y="490" width="145" height="38" rx="7" fill="#fff0f6" stroke="#e46aa6" stroke-width="1"/><text x="1156" y="514" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9c1651" text-anchor="middle">backend/URI</text><line x1="1229" y1="509" x2="1274" y2="509" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1276" y="490" width="150" height="38" rx="7" fill="#fff0f6" stroke="#e46aa6" stroke-width="1"/><text x="1351" y="514" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9c1651" text-anchor="middle">network printer</text><text x="700" y="566" font-family="Arial, sans-serif" font-size="13.1" font-weight="400" fill="#17324d"><tspan x="700" dy="0">Server must authorize request and publish/accept intended queues.</tspan><tspan x="700" dy="22">Across subnets chapter uses BrowsePoll / BrowseRelay pattern.</tspan><tspan x="700" dy="22">Basic remote daemon check: telnet &lt;host&gt; 631.</tspan><tspan x="700" dy="22">Printer itself still needs valid TCP/IP configuration.</tspan></text><rect x="12" y="724" width="490" height="244" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="12" y="724" width="490" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. Queue semantics</text><text x="36" y="792" font-family="Consolas, monospace" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="36" dy="0">reject</tspan><tspan x="36" dy="19">  stop accepting new jobs</tspan><tspan x="36" dy="19">accept</tspan><tspan x="36" dy="19">  resume accepting jobs</tspan><tspan x="36" dy="19"></tspan><tspan x="36" dy="19">cupsdisable</tspan><tspan x="36" dy="19">  stop printer/output side</tspan><tspan x="36" dy="19">cupsenable</tspan><tspan x="36" dy="19">  resume printer/output side</tspan><tspan x="36" dy="19"></tspan><tspan x="36" dy="19">Short outage and long outage require different choice.</tspan></text><rect x="516" y="724" width="590" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="516" y="724" width="590" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="534" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. Troubleshooting ladder</text><text x="540" y="792" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="540" dy="0">1. lpstat -t / lpq</tspan><tspan x="540" dy="20">2. page/access/error logs</tspan><tspan x="540" dy="20">3. lpinfo -v</tspan><tspan x="540" dy="20">4. inspect PPD/filter behavior</tspan><tspan x="540" dy="20">5. /usr/lib/cups/backend/usb for local USB</tspan><tspan x="540" dy="20">6. telnet &lt;host&gt; 631 for remote CUPS reachability</tspan><tspan x="540" dy="20">7. physical/network printer state</tspan><tspan x="540" dy="20"></tspan><tspan x="540" dy="20">Change one layer, then submit one controlled test job.</tspan></text><rect x="1120" y="724" width="468" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="1120" y="724" width="468" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="1138" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Symptom → layer</text><text x="1144" y="792" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="1144" dy="0">Job not queued</tspan><tspan x="1144" dy="19">→ input state / access / destination</tspan><tspan x="1144" dy="19"></tspan><tspan x="1144" dy="19">Queued, not printing</tspan><tspan x="1144" dy="19">→ output state / backend / printer</tspan><tspan x="1144" dy="19"></tspan><tspan x="1144" dy="19">Wrong output</tspan><tspan x="1144" dy="19">→ MIME / PPD / filter chain</tspan><tspan x="1144" dy="19"></tspan><tspan x="1144" dy="19">USB missing from backend</tspan><tspan x="1144" dy="19">→ physical/device layer</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#fff" text-anchor="middle">Итог: печать диагностируется как pipeline; acceptance = job проходит queue, filters, backend и физически печатается на нужном устройстве.</text></svg>