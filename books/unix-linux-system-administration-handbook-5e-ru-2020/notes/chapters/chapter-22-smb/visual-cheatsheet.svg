<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#26384d"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 22. Файловая система SMB</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">Samba • authentication • shares • UNIX permissions • mount • smbstatus • security</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">Samba architecture</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16.2" fill="#19324a">
<tspan x="48" dy="0">SMB client → smbd → filesystem</tspan>
<tspan x="48" dy="25">smbd: file service + auth + locks</tspan>
<tspan x="48" dy="25">nmbd: names + service announcements</tspan>
<tspan x="48" dy="31">Samba runs in userspace.</tspan>
<tspan x="48" dy="25">UNIX permissions remain authoritative.</tspan>
<tspan x="48" dy="25">Share policy adds another access layer.</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">Authentication</text>
<text x="572" y="184" font-family="Arial, sans-serif" font-size="16.0" fill="#19324a">
<tspan x="572" dy="0">Local:</tspan>
<tspan x="572" dy="25">UNIX account + smbpasswd hash</tspan>
<tspan x="572" dy="31">AD:</tspan>
<tspan x="572" dy="25">security=ads + realm + keytab</tspan>
<tspan x="572" dy="25">sssd / Kerberos integration</tspan>
<tspan x="572" dy="31">Keytab/password DB are sensitive.</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Share policy</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16.0" fill="#19324a">
<tspan x="1096" dy="0">[share] → path + read only</tspan>
<tspan x="1096" dy="25">[homes] → valid users = %S</tspan>
<tspan x="1096" dy="25">Project → valid users = @group</tspan>
<tspan x="1096" dy="25">force group + masks + setgid</tspan>
<tspan x="1096" dy="31">guest ok broadens access.</tspan>
<tspan x="1096" dy="25">Filesystem owner/group/mode must agree.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Client / verification</text>
<text x="48" y="512" font-family="Consolas, monospace" font-size="15.2" fill="#19324a">
<tspan x="48" dy="0">testparm -v</tspan>
<tspan x="48" dy="24">smbclient -L //server -U user</tspan>
<tspan x="48" dy="24">smbclient //server/share -U user</tspan>
<tspan x="48" dy="31">Linux: mount -t cifs</tspan>
<tspan x="48" dy="24">FreeBSD: mount -t smbfs</tspan>
<tspan x="48" dy="31">Browse/auth first; mount second.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">Troubleshooting</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16.0" fill="#19324a">
<tspan x="572" dy="0">smbstatus → sessions/shares/locks/PID</tspan>
<tspan x="572" dy="25">Then inspect Samba logs.</tspan>
<tspan x="572" dy="25">smbcontrol → temporary debug.</tspan>
<tspan x="572" dy="31">Fix lock owner on client first.</tspan>
<tspan x="572" dy="25">Do not kill smbd casually.</tspan>
<tspan x="572" dy="25">High debug can expose sensitive data.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">Network security</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16.0" fill="#19324a">
<tspan x="1096" dy="0">hosts allow → explicit clients</tspan>
<tspan x="1096" dy="25">hosts deny overrides allow</tspan>
<tspan x="1096" dy="25">UDP 137–139</tspan>
<tspan x="1096" dy="25">TCP 137, 139, 445</tspan>
<tspan x="1096" dy="31">Block external exposure.</tspan>
<tspan x="1096" dy="25">Data transport described here is unencrypted.</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#26384d"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: effective SMB access = authenticated identity + share policy + UNIX filesystem permissions + network boundary.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Verify with testparm and smbclient before mounting; troubleshoot runtime state with smbstatus and logs.</text>
</svg>