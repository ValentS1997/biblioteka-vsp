<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="16" y="16" width="1568" height="72" rx="16" fill="#173e5c"/>
  <text x="44" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff"><tspan x="44" dy="0">Глава 1. С чего начать — визуальная шпаргалка</tspan></text>
  <text x="44" y="77" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d8ebf7"><tspan x="44" dy="0">UNIX и Linux: руководство системного администратора, 5-е издание</tspan></text>
  <g filter="url(#shadow)"><rect x="20" y="108" width="500" height="338" rx="18" fill="#f8fbff" stroke="#64aaf5" stroke-width="2"/><rect x="20" y="108" width="500" height="52" rx="18" fill="#cfe8ff"/><rect x="20" y="142" width="500" height="18" fill="#cfe8ff"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Что входит в работу администратора</tspan></text><text x="44" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• Управление доступом и оборудованием</tspan><tspan x="44" dy="26">• Автоматизация повторяемых задач</tspan><tspan x="44" dy="26">• Backup + периодическая проверка restore</tspan><tspan x="44" dy="26">• Установка и обновление ПО</tspan><tspan x="44" dy="26">• Monitoring, troubleshooting, security</tspan><tspan x="44" dy="26">• Документация, performance, policy, vendors</tspan></text><rect x="540" y="108" width="500" height="338" rx="18" fill="#f6fff8" stroke="#63c98f" stroke-width="2"/><rect x="540" y="108" width="500" height="52" rx="18" fill="#ccefd9"/><rect x="540" y="142" width="500" height="18" fill="#ccefd9"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Рабочий цикл</tspan></text><text x="558" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">1. Определить задачу и владельца</tspan></text><text x="558" y="226" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">2. Найти авторитетную документацию</tspan></text><text x="558" y="260" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">3. Проверить текущее состояние</tspan></text><text x="558" y="294" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">4. Выбрать отслеживаемый способ изменения</tspan></text><text x="558" y="328" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">5. Проверить результат и документировать</tspan></text><rect x="1060" y="108" width="520" height="338" rx="18" fill="#fffaf2" stroke="#efb44c" stroke-width="2"/><rect x="1060" y="108" width="520" height="52" rx="18" fill="#ffe3a9"/><rect x="1060" y="142" width="520" height="18" fill="#ffe3a9"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">Документация и discovery</tspan></text><text x="1084" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• man / man &lt;section&gt; / man -k / apropos</tspan><tspan x="1084" dy="26">• which / whereis / locate</tspan><tspan x="1084" dy="26">• rpm -q / rpm -qf</tspan><tspan x="1084" dy="26">• pkg which / dpkg-query -S</tspan><tspan x="1084" dy="26">• Официальная документация и RFC</tspan></text><rect x="20" y="468" width="500" height="350" rx="18" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="20" y="468" width="500" height="52" rx="18" fill="#ffd1e5"/><rect x="20" y="502" width="500" height="18" fill="#ffd1e5"/><text x="38" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Установка программного обеспечения</tspan></text><text x="38" y="552" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">Предпочтительно: package-native</tspan></text><text x="44" y="586" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• apt-get / yum / pkg</tspan><tspan x="44" dy="26">• Пакет должен быть для конкретной системы</tspan></text><text x="38" y="652" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">Если пакета нет</tspan></text><text x="44" y="686" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• git clone → configure → make → install</tspan><tspan x="44" dy="26">• Web installer: сначала скачать, затем запускать</tspan></text><rect x="540" y="468" width="500" height="350" rx="18" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="468" width="500" height="52" rx="18" fill="#ddd8ff"/><rect x="540" y="502" width="500" height="18" fill="#ddd8ff"/><text x="558" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Что не делать</tspan></text><text x="564" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="564" dy="0">• Не путать одинаковый package format с совместимостью</tspan><tspan x="564" dy="26">• Не редактировать систему без проверки текущего состояния</tspan><tspan x="564" dy="26">• Не считать backup готовым без restore test</tspan><tspan x="564" dy="26">• Не передавать curl напрямую в привилегированный shell</tspan><tspan x="564" dy="26">• Не полагаться только на GUI — CLI обязателен</tspan></text><rect x="1060" y="468" width="520" height="350" rx="18" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="468" width="520" height="52" rx="18" fill="#d2f1dc"/><rect x="1060" y="502" width="520" height="18" fill="#d2f1dc"/><text x="1078" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">Профессиональные ориентиры</tspan></text><text x="1084" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Автоматизировать повторяемое</tspan><tspan x="1084" dy="26">• Поддерживать локальную документацию</tspan><tspan x="1084" dy="26">• Следить за безопасностью и производительностью</tspan><tspan x="1084" dy="26">• Оценивать жизнеспособность дистрибутива и поддержку</tspan><tspan x="1084" dy="26">• Работать вместе с DevOps/SRE, network, security, DBA, NOC</tspan><tspan x="1084" dy="26">• Решать задачи организации, а не только технические симптомы</tspan></text></g>
  <rect x="16" y="844" width="1568" height="40" rx="12" fill="#173e5c"/>
  <text x="36" y="871" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff"><tspan x="36" dy="0">Принцип: проверяемое состояние → отслеживаемое изменение → verification → документация.</tspan></text>
</svg>