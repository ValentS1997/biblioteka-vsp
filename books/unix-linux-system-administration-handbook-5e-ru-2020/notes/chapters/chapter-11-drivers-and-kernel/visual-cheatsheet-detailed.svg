<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 11. Драйверы и ядро — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Devices, sysfs/udev/devfs, sysctl, kernel builds, modules, boot traces и panic recovery</text><rect x="12" y="100" width="390" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="390" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Kernel role</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="34" dy="0">Hardware abstraction</tspan><tspan x="34" dy="21">Processes / threads</tspan><tspan x="34" dy="21">Memory protection</tspan><tspan x="34" dy="21">I/O + filesystem + network</tspan><tspan x="34" dy="21">Boot / timers / multitasking</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Admin work:</tspan><tspan x="34" dy="21">tuning • drivers • modules • boot diagnostics</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Policy: concrete benefit before kernel change.</tspan></text><rect x="416" y="100" width="580" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="416" y="100" width="580" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="434" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Linux device pipeline</text><rect x="446" y="170" width="100" height="36" rx="7" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="496" y="193" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="middle">kernel</text><line x1="546" y1="188" x2="586" y2="188" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="588" y="170" width="100" height="36" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="638" y="193" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="middle">/sys</text><line x1="688" y1="188" x2="728" y2="188" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="730" y="170" width="110" height="36" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="785" y="193" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="middle">udevd</text><line x1="840" y1="188" x2="880" y2="188" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="882" y="170" width="90" height="36" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="927" y="193" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="middle">/dev</text><text x="446" y="236" font-family="Arial, sans-serif" font-size="13.1" font-weight="400" fill="#17324d"><tspan x="446" dy="0">Observe: lsusb / dmesg / udevadm info</tspan><tspan x="446" dy="21">Rules: ACTION + ATTR/ATTRS + KERNEL + SUBSYSTEM + PROGRAM/RESULT</tspan><tspan x="446" dy="21">Actions: NAME / SYMLINK / RUN</tspan><tspan x="446" dy="21"></tspan><tspan x="446" dy="21">Local rules → /etc/udev/rules.d/</tspan><tspan x="446" dy="21">Reload rules, then test a real attach/detach event.</tspan></text><rect x="1010" y="100" width="578" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1010" y="100" width="578" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1028" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. FreeBSD device pipeline</text><text x="1034" y="168" font-family="Arial, sans-serif" font-size="13.3" font-weight="400" fill="#17324d"><tspan x="1034" dy="0">devfs → /dev filesystem</tspan><tspan x="1034" dy="21">devd → higher-level event reactions</tspan><tspan x="1034" dy="21">autofs → removable-media automount</tspan><tspan x="1034" dy="21"></tspan><tspan x="1034" dy="21">/etc/devfs.conf</tspan><tspan x="1034" dy="21">  link / owner / permission for static devices</tspan><tspan x="1034" dy="21">/etc/devfs.rules</tspan><tspan x="1034" dy="21">  dynamic/removable rules</tspan><tspan x="1034" dy="21">/etc/devd.conf</tspan><tspan x="1034" dy="21">  attach / detach / notify / nomatch / options</tspan></text><rect x="12" y="416" width="620" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="620" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Runtime tuning</text><text x="36" y="484" font-family="Consolas, monospace" font-size="12.9" font-weight="500" fill="#17324d"><tspan x="36" dy="0">Linux read:  cat /proc/sys/fs/file-max</tspan><tspan x="36" dy="20">Linux write: echo 32768 &gt; /proc/sys/fs/file-max</tspan><tspan x="36" dy="20">Persistent:  /etc/sysctl.conf</tspan><tspan x="36" dy="20">sysctl net.ipv4.ip_forward=0</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">FreeBSD: sysctl -a → inventory of runtime parameters</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Examples cover file limits, panic/oops, forwarding, ICMP, SYN cookies,</tspan><tspan x="36" dy="20">port range, memory behavior and networking.</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Do not tune one IP family and forget the other.</tspan></text><rect x="646" y="416" width="942" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="646" y="416" width="942" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="664" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">5. Kernel build paths</text><rect x="670" y="482" width="400" height="190" rx="8" fill="#f1fbf4" stroke="#79bd90" stroke-width="1.1"/><text x="870" y="506" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#145d2d" text-anchor="middle">Linux</text><text x="690" y="536" font-family="Consolas, monospace" font-size="12.7" font-weight="500" fill="#17324d"><tspan x="690" dy="0">.config</tspan><tspan x="690" dy="19">make xconfig / gconfig / menuconfig</tspan><tspan x="690" dy="19">make oldconfig for migration</tspan><tspan x="690" dy="19">make clean → make</tspan><tspan x="690" dy="19">make modules_install</tspan><tspan x="690" dy="19">make install</tspan><tspan x="690" dy="19"></tspan><tspan x="690" dy="19">Prefer distribution-supported method when available.</tspan></text><rect x="1090" y="482" width="474" height="190" rx="8" fill="#f1fbf4" stroke="#79bd90" stroke-width="1.1"/><text x="1327" y="506" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#145d2d" text-anchor="middle">FreeBSD</text><text x="1110" y="536" font-family="Consolas, monospace" font-size="12.7" font-weight="500" fill="#17324d"><tspan x="1110" dy="0">GENERIC → MYCUSTOM</tspan><tspan x="1110" dy="19">edit config in /usr/src/sys/&lt;arch&gt;/conf</tspan><tspan x="1110" dy="19">cd /usr/src</tspan><tspan x="1110" dy="19">make buildkernel KERNCONF=MYCUSTOM</tspan><tspan x="1110" dy="19">make installkernel KERNCONF=MYCUSTOM</tspan><tspan x="1110" dy="19"></tspan><tspan x="1110" dy="19">If unsure, leave GENERIC option enabled.</tspan></text><rect x="12" y="724" width="550" height="244" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="724" width="550" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">6. Loadable modules</text><text x="36" y="792" font-family="Consolas, monospace" font-size="12.9" font-weight="500" fill="#17324d"><tspan x="36" dy="0">Linux:</tspan><tspan x="36" dy="19">lsmod</tspan><tspan x="36" dy="19">modprobe &lt;module&gt;</tspan><tspan x="36" dy="19">modprobe -r &lt;module&gt;</tspan><tspan x="36" dy="19">modprobe -c</tspan><tspan x="36" dy="19"></tspan><tspan x="36" dy="19">FreeBSD:</tspan><tspan x="36" dy="19">kldload foo / kldunload foo / kldstat</tspan><tspan x="36" dy="19"></tspan><tspan x="36" dy="19">Kernel-space code: test modules and verify references before unload.</tspan></text><rect x="576" y="724" width="480" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="576" y="724" width="480" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="594" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. Boot trace / fallback</text><text x="600" y="792" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="600" dy="0">Boot messages reveal:</tspan><tspan x="600" dy="20">kernel version + command line</tspan><tspan x="600" dy="20">CPU / RAM / hypervisor</tspan><tspan x="600" dy="20">PCI / USB / SCSI</tspan><tspan x="600" dy="20">drivers / network / disks</tspan><tspan x="600" dy="20">root filesystem</tspan><tspan x="600" dy="20"></tspan><tspan x="600" dy="20">Custom kernel must have known-good fallback.</tspan><tspan x="600" dy="20">Fallback is rollback for failed boot.</tspan></text><rect x="1070" y="724" width="518" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="1070" y="724" width="518" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="1088" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Failure diagnostics</text><text x="1094" y="792" font-family="Arial, sans-serif" font-size="12.9" font-weight="400" fill="#17324d"><tspan x="1094" dy="0">Linux:</tspan><tspan x="1094" dy="20">soft lockup • hard lockup • panic • oops</tspan><tspan x="1094" dy="20">dmesg → trace/context</tspan><tspan x="1094" dy="20"></tspan><tspan x="1094" dy="20">FreeBSD:</tspan><tspan x="1094" dy="20">debug kernel → crash dump in /var/crash → kgdb</tspan><tspan x="1094" dy="20"></tspan><tspan x="1094" dy="20">Preserve beginning of trace.</tspan><tspan x="1094" dy="20">Plan dump space: crash dump can approach physical RAM.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.7" font-weight="700" fill="#fff" text-anchor="middle">Итог: observe device/kernel state first, change one layer, preserve fallback, verify, and capture diagnostics before the next change.</text></svg>