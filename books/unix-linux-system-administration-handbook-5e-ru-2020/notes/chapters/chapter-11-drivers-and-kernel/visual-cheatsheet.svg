<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 11. Драйверы и ядро</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Observe → minimal change → fallback → verify → capture diagnostics</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Kernel / driver model</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Kernel:</tspan><tspan x="42" dy="26">• hardware abstraction</tspan><tspan x="42" dy="26">• processes/threads</tspan><tspan x="42" dy="26">• memory protection</tspan><tspan x="42" dy="26">• I/O and networking</tspan><tspan x="42" dy="26">• boot/system organization</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">Driver = hardware-specific translation layer</tspan><tspan x="42" dy="26">Device file = type + major + minor</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Linux devices: sysfs + udev</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#17324d"><tspan x="562" dy="0">/sys → structured device state</tspan><tspan x="562" dy="27">udevadm info → attributes</tspan><tspan x="562" dy="27">lsusb / dmesg → detection evidence</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Rule:</tspan><tspan x="562" dy="27">MATCH → NAME/SYMLINK/RUN</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Local rules: /etc/udev/rules.d/</tspan><tspan x="562" dy="27">Reload: udevadm control --reload-rules</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Kernel tuning / build</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Runtime:</tspan><tspan x="1084" dy="25">/proc/sys + sysctl</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Persistent:</tspan><tspan x="1084" dy="25">/etc/sysctl.conf</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Linux build:</tspan><tspan x="1084" dy="25">.config → make → modules_install → install</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">FreeBSD:</tspan><tspan x="1084" dy="25">GENERIC → MYCUSTOM → buildkernel/installkernel</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Loadable modules</text><text x="42" y="506" font-family="Consolas, monospace" font-size="15.4" font-weight="500" fill="#17324d"><tspan x="42" dy="0">Linux:</tspan><tspan x="42" dy="27">lsmod</tspan><tspan x="42" dy="27">modprobe &lt;module&gt;</tspan><tspan x="42" dy="27">modprobe -r &lt;module&gt;</tspan><tspan x="42" dy="27"></tspan><tspan x="42" dy="27">FreeBSD:</tspan><tspan x="42" dy="27">kldload / kldunload / kldstat</tspan><tspan x="42" dy="27"></tspan><tspan x="42" dy="27">Risk: module code runs in kernel space</tspan><tspan x="42" dy="27">→ test and verify immediately</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Boot / fallback</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Boot log reveals:</tspan><tspan x="562" dy="28">kernel version/command line</tspan><tspan x="562" dy="28">CPU + memory</tspan><tspan x="562" dy="28">PCI/USB/SCSI</tspan><tspan x="562" dy="28">drivers + network/storage</tspan><tspan x="562" dy="28">root filesystem</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Custom kernel requires known-good fallback.</tspan><tspan x="562" dy="28">Fallback is the rollback point for boot failure.</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Kernel failure diagnostics</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Linux:</tspan><tspan x="1084" dy="28">soft lockup • hard lockup • panic • oops</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">Read trace with dmesg</tspan><tspan x="1084" dy="28">Preserve beginning of stack trace</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">FreeBSD:</tspan><tspan x="1084" dy="28">crash dump → /var/crash → kgdb</tspan><tspan x="1084" dy="28">Dump size may approach physical RAM</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: чем ближе изменение к ядру, тем обязательнее read-only baseline и known-good fallback.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Не чинить то, что не сломано: kernel changes должны иметь конкретную выгоду и acceptance check.</text></svg>