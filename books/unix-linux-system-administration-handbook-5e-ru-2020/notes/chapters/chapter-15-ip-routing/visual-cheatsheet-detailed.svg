<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient></defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 15. IP-маршрутизация — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Forwarding • routing tables • dynamic protocols • metrics • daemons • Cisco IOS operations</text><rect x="12" y="100" width="380" height="286" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="380" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Forwarding model</text><text x="34" y="166" font-family="Arial, sans-serif" font-size="12.9" font-weight="400" fill="#17324d"><tspan x="34" dy="0">IP routing = next-hop routing.</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">Lookup:</tspan><tspan x="34" dy="18">connected route</tspan><tspan x="34" dy="18">→ specific route</tspan><tspan x="34" dy="18">→ default route</tspan><tspan x="34" dy="18">→ unreachable</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">Gateway must be directly reachable.</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">Ethernet MAC changes hop by hop;</tspan><tspan x="34" dy="18">IP source/destination remain end-to-end.</tspan></text><rect x="406" y="100" width="390" height="286" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="406" y="100" width="390" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="424" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Dynamic routing</text><text x="430" y="166" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="430" dy="0">Daemon inputs:</tspan><tspan x="430" dy="18">config files • kernel table • peers</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">Daemon:</tspan><tspan x="430" dy="18">calculates preferred routes</tspan><tspan x="430" dy="18">writes kernel table</tspan><tspan x="430" dy="18">advertises when required</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">Dynamic routing adapts to topology failure.</tspan><tspan x="430" dy="18">Convergence quality depends on protocol.</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">IPv4 and IPv6 control planes stay separate.</tspan></text><rect x="810" y="100" width="378" height="286" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="810" y="100" width="378" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="828" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Distance-vector</text><text x="834" y="166" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="834" dy="0">Neighbor advertises distance/cost.</tspan><tspan x="834" dy="18">Local router adds local-link cost.</tspan><tspan x="834" dy="18"></tspan><tspan x="834" dy="18">RIP / RIPng:</tspan><tspan x="834" dy="18">hop-count metric</tspan><tspan x="834" dy="18">15-hop practical reachability limit</tspan><tspan x="834" dy="18">RIPv2 carries mask/CIDR info</tspan><tspan x="834" dy="18">RIPng is IPv6-only</tspan><tspan x="834" dy="18"></tspan><tspan x="834" dy="18">Risks:</tspan><tspan x="834" dy="18">loops • slow convergence • update traffic</tspan></text><rect x="1202" y="100" width="386" height="286" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="1202" y="100" width="386" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="1220" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Link-state / metrics</text><text x="1226" y="166" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="1226" dy="0">Routers advertise link-state/topology.</tspan><tspan x="1226" dy="18">Each router builds its own map.</tspan><tspan x="1226" dy="18"></tspan><tspan x="1226" dy="18">OSPF:</tspan><tspan x="1226" dy="18">large/complex internal networks</tspan><tspan x="1226" dy="18">areas + multiple paths</tspan><tspan x="1226" dy="18">faster convergence</tspan><tspan x="1226" dy="18"></tspan><tspan x="1226" dy="18">Path cost = sum of link metrics.</tspan><tspan x="1226" dy="18">Default metrics are usually enough;</tspan><tspan x="1226" dy="18">administrative cost changes need reason.</tspan></text><rect x="12" y="402" width="500" height="294" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="402" width="500" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">5. Autonomous systems / protocols</text><text x="36" y="470" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Interior routing → inside one autonomous system.</tspan><tspan x="36" dy="18">Exterior routing → between autonomous systems.</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">EIGRP:</tspan><tspan x="36" dy="18">Cisco proprietary; functionally similar to OSPF for many uses.</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">BGP:</tspan><tspan x="36" dy="18">exterior routing</tspan><tspan x="36" dy="18">Internet backbone / multiple upstream providers</tspan><tspan x="36" dy="18">large route tables + administrative policy</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">Single-uplink edge often needs only static default route.</tspan></text><rect x="526" y="402" width="510" height="294" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="526" y="402" width="510" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="544" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">6. Strategy ladder</text><text x="550" y="470" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="550" dy="0">1. no routing</tspan><tspan x="550" dy="18">2. static routing only</tspan><tspan x="550" dy="18">3. mostly static + RIP reception</tspan><tspan x="550" dy="18">4. dynamic routing</tspan><tspan x="550" dy="18"></tspan><tspan x="550" dy="18">Choose by topology:</tspan><tspan x="550" dy="18">one exit → default route</tspan><tspan x="550" dy="18">stable exceptions → static routes</tspan><tspan x="550" dy="18">multiple paths → dynamic</tspan><tspan x="550" dy="18">Internet multihoming → BGP</tspan><tspan x="550" dy="18"></tspan><tspan x="550" dy="18">Do not use ICMP redirects as routing policy.</tspan></text><rect x="1050" y="402" width="538" height="294" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1050" y="402" width="538" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1068" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">7. Daemons / software routers</text><text x="1074" y="470" font-family="Arial, sans-serif" font-size="12.6" font-weight="400" fill="#17324d"><tspan x="1074" dy="0">routed -q:</tspan><tspan x="1074" dy="18">passive RIP receiver</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">Quagga:</tspan><tspan x="1074" dy="18">zebra ↔ kernel table</tspan><tspan x="1074" dy="18">ripd • ripngd • ospfd • ospf6d • bgpd</tspan><tspan x="1074" dy="18">vtysh / quaggaadm</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">CLI:</tspan><tspan x="1074" dy="18">enable → config term → write</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">XORP targets broader router functions.</tspan></text><rect x="12" y="712" width="760" height="250" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="12" y="712" width="760" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="30" y="740" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Cisco IOS safe workflow</text><text x="36" y="780" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="36" dy="0">SSH → show interfaces / show running / show config</tspan><tspan x="36" dy="20">→ hostname identifies device → enable → config term</tspan><tspan x="36" dy="20">→ interface / ip address example → Ctrl+Z</tspan><tspan x="36" dy="20">→ if successful → write mem.</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Privileged mode can modify/delete configuration; hostname helps avoid wrong-router changes.</tspan><tspan x="36" dy="20">Keep config backups with scp/tftp; use NVRAM/removable copy when available.</tspan><tspan x="36" dy="20">Chapter advises SSH instead of Telnet, CLI access control and physical security.</tspan></text><rect x="786" y="712" width="802" height="250" rx="12" fill="#f4fbff" stroke="#71a6d2" stroke-width="2"/><rect x="786" y="712" width="802" height="40" rx="12" fill="#d7ecfb" stroke="#71a6d2" stroke-width="0"/><text x="804" y="740" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">9. Operations / acceptance</text><text x="810" y="780" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#17324d"><tspan x="810" dy="0">RANCID:</tspan><tspan x="810" dy="18">periodically retrieve router configs → compare → store in version control.</tspan><tspan x="810" dy="18"></tspan><tspan x="810" dy="18">Source-supported inspection:</tspan><tspan x="810" dy="18">netstat -rn / ip route → routing table</tspan><tspan x="810" dy="18">show running / show config → Cisco state</tspan><tspan x="810" dy="18">hostname/prompt → router identity</tspan><tspan x="810" dy="18"></tspan><tspan x="810" dy="18">Persistence:</tspan><tspan x="810" dy="18">write mem only after successful change</tspan><tspan x="810" dy="18"></tspan><tspan x="810" dy="18">Exact acceptance test: [Needs confirmation]</tspan><tspan x="810" dy="18">Exact rollback/restore: [Needs confirmation]</tspan></text><rect x="12" y="986" width="1576" height="52" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1018" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#fff" text-anchor="middle">Итог: forwarding uses existing routes; daemons compute/update them. Persist successful Cisco changes; keep backups/version history.</text></svg>