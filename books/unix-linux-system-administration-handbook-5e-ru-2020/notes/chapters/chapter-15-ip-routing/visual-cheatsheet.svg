<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 15. IP-маршрутизация</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Forwarding ≠ route calculation • next hop • static/dynamic • RIP/OSPF/EIGRP/BGP • Quagga/Cisco</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Packet forwarding</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="17.5" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Destination</tspan><tspan x="42" dy="24">  ↓ routing-table lookup</tspan><tspan x="42" dy="24">connected route?</tspan><tspan x="42" dy="24">specific route?</tspan><tspan x="42" dy="24">default route?</tspan><tspan x="42" dy="24">  ↓</tspan><tspan x="42" dy="24">next hop / interface</tspan><tspan x="42" dy="24">  ↓</tspan><tspan x="42" dy="24">link-layer forwarding</tspan><tspan x="42" dy="24"></tspan><tspan x="42" dy="24">Gateway must be one hop away.</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Control plane</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="17.2" font-weight="400" fill="#17324d"><tspan x="562" dy="0">config files</tspan><tspan x="562" dy="23">+ kernel table</tspan><tspan x="562" dy="23">+ peer updates</tspan><tspan x="562" dy="23">  ↓</tspan><tspan x="562" dy="23">routing daemon / protocol</tspan><tspan x="562" dy="23">  ↓</tspan><tspan x="562" dy="23">route calculation</tspan><tspan x="562" dy="23">  ↓</tspan><tspan x="562" dy="23">kernel routing table</tspan><tspan x="562" dy="23">+ advertisements</tspan><tspan x="562" dy="23"></tspan><tspan x="562" dy="23">Topology change → convergence.</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Protocol map</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="16.6" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">RIP / RIPng</tspan><tspan x="1084" dy="24">distance-vector • hop count • simple • limited scale</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">OSPF</tspan><tspan x="1084" dy="24">link-state • areas • complex/large internal networks</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">EIGRP</tspan><tspan x="1084" dy="24">Cisco proprietary • distance-vector family</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">BGP</tspan><tspan x="1084" dy="24">exterior routing • autonomous systems • multihoming</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Strategy selection</text><text x="42" y="506" font-family="Arial, sans-serif" font-size="17.2" font-weight="500" fill="#17324d"><tspan x="42" dy="0">No external path → no routing</tspan><tspan x="42" dy="28">One exit → static default route</tspan><tspan x="42" dy="28">Few stable exceptions → static routes</tspan><tspan x="42" dy="28">Multiple paths → dynamic routing</tspan><tspan x="42" dy="28">Admin boundaries → dynamic routing</tspan><tspan x="42" dy="28">Internet multihoming → BGP</tspan><tspan x="42" dy="28"></tspan><tspan x="42" dy="28">Use the lowest complexity</tspan><tspan x="42" dy="28">that satisfies topology needs.</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Daemon / CLI tools</text><text x="562" y="506" font-family="Consolas, monospace" font-size="16.9" font-weight="500" fill="#17324d"><tspan x="562" dy="0">netstat -rn / ip route → inspect</tspan><tspan x="562" dy="26">routed -q → passive RIP receiver</tspan><tspan x="562" dy="26"></tspan><tspan x="562" dy="26">Quagga:</tspan><tspan x="562" dy="26">zebra + ripd/ripngd/ospfd/ospf6d/bgpd</tspan><tspan x="562" dy="26">vtysh → enable → config term → write</tspan><tspan x="562" dy="26"></tspan><tspan x="562" dy="26">Cisco:</tspan><tspan x="562" dy="26">show* → enable → config term</tspan><tspan x="562" dy="26">verify → write mem</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Safety / operations</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="16.7" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Inspect routes/config with chapter tools.</tspan><tspan x="1084" dy="26">Verify router hostname/device identity.</tspan><tspan x="1084" dy="26">write mem only if change succeeded.</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Back up config via scp/tftp.</tspan><tspan x="1084" dy="26">Prefer SSH; disable Telnet after SSH setup.</tspan><tspan x="1084" dy="26">Restrict CLI + physical access.</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">RANCID:</tspan><tspan x="1084" dy="26">retrieve → diff → version-control configs</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: data plane использует route table; control plane ее вычисляет. Inspect: netstat -rn / ip route / show*.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Cisco: configure → if successful, write mem. Exact acceptance checks / rollback: [Needs confirmation].</text></svg>