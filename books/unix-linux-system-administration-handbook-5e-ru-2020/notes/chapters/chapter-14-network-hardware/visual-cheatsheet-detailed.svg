<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 14. Сетевые аппаратные средства — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Ethernet • cabling • switching/VLAN • wireless • SDN • testing • design • management</text><rect x="12" y="100" width="380" height="286" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="380" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Ethernet &amp; media</text><text x="34" y="166" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="34" dy="0">Ethernet dominates LAN design in chapter.</tspan><tspan x="34" dy="18">CSMA/CD = shared-medium access model.</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">UTP:</tspan><tspan x="34" dy="18">category • attenuation • NEXT/ELFEXT • termination</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">Fiber:</tspan><tspan x="34" dy="18">multimode → building/campus use</tspan><tspan x="34" dy="18">single-mode → longer-distance use</tspan><tspan x="34" dy="18"></tspan><tspan x="34" dy="18">Rule: fiber + patch + endpoint optics must match.</tspan></text><rect x="406" y="100" width="390" height="286" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="406" y="100" width="390" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="424" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Switching / segmentation</text><text x="430" y="166" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="430" dy="0">Hub = physical-layer repeater.</tspan><tspan x="430" dy="18">Switch = link-layer forwarding device.</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">Switch learns source MAC → port.</tspan><tspan x="430" dy="18">Broadcast still spans logical segment.</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">VLAN = software-defined logical Ethernet segment.</tspan><tspan x="430" dy="18">802.1Q = trunking example.</tspan><tspan x="430" dy="18"></tspan><tspan x="430" dy="18">VLAN isolation helps traffic separation,</tspan><tspan x="430" dy="18">but security still requires filtering/routing policy.</tspan></text><rect x="810" y="100" width="378" height="286" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="810" y="100" width="378" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="828" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Router / link consistency</text><text x="834" y="166" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="834" dy="0">Router separates logical segments at network layer.</tspan><tspan x="834" dy="18">Also associated with filtering / QoS / topology.</tspan><tspan x="834" dy="18"></tspan><tspan x="834" dy="18">Autonegotiation:</tspan><tspan x="834" dy="18">≥1 Gbit/s → required by chapter's rule</tspan><tspan x="834" dy="18">≤100 Mbit/s → both ends must agree</tspan><tspan x="834" dy="18"></tspan><tspan x="834" dy="18">One-sided manual speed/duplex</tspan><tspan x="834" dy="18">→ mismatch → degraded performance</tspan><tspan x="834" dy="18"></tspan><tspan x="834" dy="18">Looped switching topology is a high-risk condition.</tspan></text><rect x="1202" y="100" width="386" height="286" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="1202" y="100" width="386" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="1220" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. PoE / MTU</text><text x="1226" y="166" font-family="Arial, sans-serif" font-size="12.6" font-weight="400" fill="#17324d"><tspan x="1226" dy="0">PoE:</tspan><tspan x="1226" dy="18">data + power over Ethernet cabling</tspan><tspan x="1226" dy="18">plan powered ports and switch power budget</tspan><tspan x="1226" dy="18"></tspan><tspan x="1226" dy="18">Standard payload MTU in chapter: 1500 bytes.</tspan><tspan x="1226" dy="18"></tspan><tspan x="1226" dy="18">Jumbo frames:</tspan><tspan x="1226" dy="18">commonly ~9000 bytes in examples</tspan><tspan x="1226" dy="18">must be supported end-to-end</tspan><tspan x="1226" dy="18"></tspan><tspan x="1226" dy="18">Safe sequence:</tspan><tspan x="1226" dy="18">standard MTU → verify → enlarge consistently → verify</tspan></text><rect x="12" y="402" width="500" height="294" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="402" width="500" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">5. Wireless LAN</text><text x="36" y="470" font-family="Arial, sans-serif" font-size="12.6" font-weight="400" fill="#17324d"><tspan x="36" dy="0">WAP + clients form wireless Ethernet access.</tspan><tspan x="36" dy="18">SSID identifies wireless LAN.</tspan><tspan x="36" dy="18">Multiple SSIDs can map to separate VLANs.</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">Channel planning reduces radio interference.</tspan><tspan x="36" dy="18">Large/high-density area → multiple WAPs + placement study.</tspan><tspan x="36" dy="18">Clients may stay attached to weak APs.</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">Tools named:</tspan><tspan x="36" dy="18">ifconfig • iwlist • iwconfig • wpa_supplicant</tspan><tspan x="36" dy="18"></tspan><tspan x="36" dy="18">Source framing: WEP insecure; WPA2 baseline.</tspan></text><rect x="526" y="402" width="510" height="294" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="526" y="402" width="510" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="544" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">6. SDN / automation</text><text x="550" y="470" font-family="Arial, sans-serif" font-size="12.6" font-weight="400" fill="#17324d"><tspan x="550" dy="0">Core split:</tspan><tspan x="550" dy="18">control plane</tspan><tspan x="550" dy="18">   ↓ programs</tspan><tspan x="550" dy="18">data plane</tspan><tspan x="550" dy="18">   ↓ forwards packets</tspan><tspan x="550" dy="18"></tspan><tspan x="550" dy="18">Chapter links SDN to:</tspan><tspan x="550" dy="18">dynamic topology</tspan><tspan x="550" dy="18">performance/security/availability policy</tspan><tspan x="550" dy="18">cloud networking</tspan><tspan x="550" dy="18">API-based DevOps automation</tspan><tspan x="550" dy="18"></tspan><tspan x="550" dy="18">Risk: vendor-specific products can reduce interoperability.</tspan></text><rect x="1050" y="402" width="538" height="294" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1050" y="402" width="538" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1068" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">7. Testing / fault isolation</text><text x="1074" y="470" font-family="Arial, sans-serif" font-size="12.6" font-weight="400" fill="#17324d"><tspan x="1074" dy="0">Core troubleshooting rule:</tspan><tspan x="1074" dy="18">divide network into segments and test each.</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">Cable tester / TDR:</tspan><tspan x="1074" dy="18">physical length • open circuit • miswiring</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">Packet analyzer / Wireshark:</tspan><tspan x="1074" dy="18">frame/protocol errors • configuration evidence</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">Important boundary:</tspan><tspan x="1074" dy="18">packet analyzer cannot detect physical cable/power faults.</tspan><tspan x="1074" dy="18"></tspan><tspan x="1074" dy="18">Verify segment first, then end-to-end.</tspan></text><rect x="12" y="712" width="760" height="250" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="12" y="712" width="760" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="30" y="740" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Cabling / network design</text><text x="36" y="780" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Install correctly once: quality materials + competent termination + enough drops.</tspan><tspan x="36" dy="20">Label every connection point; keep closet drawings and electronic records.</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Design must fit building architecture, cable pathways, ventilation and fire barriers.</tspan><tspan x="36" dy="20">Plan for growth where recabling will be difficult.</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Congestion sources: overloaded switches, mismatched interfaces, slow links, heavy traffic.</tspan><tspan x="36" dy="20">Mitigation pattern: localize traffic → subnets → routers → smaller load/fault domains.</tspan></text><rect x="786" y="712" width="802" height="250" rx="12" fill="#f4fbff" stroke="#71a6d2" stroke-width="2"/><rect x="786" y="712" width="802" height="40" rx="12" fill="#d7ecfb" stroke="#71a6d2" stroke-width="0"/><text x="804" y="740" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">9. Management / acceptance</text><text x="810" y="780" font-family="Arial, sans-serif" font-size="12.4" font-weight="400" fill="#17324d"><tspan x="810" dy="0">Centralize shared concerns:</tspan><tspan x="810" dy="19">topology • backbone • naming/addressing • protocols • Internet-access policy</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">Distribute local operations only inside clear administrative boundaries.</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">Acceptance:</tspan><tspan x="810" dy="19">compatible medium/endpoints • no uncontrolled loop • intentional VLAN/routing</tspan><tspan x="810" dy="19">consistent speed/duplex • consistent MTU • sufficient PoE budget</tspan><tspan x="810" dy="19">wireless placement/security intentional • physical + packet tests passed</tspan><tspan x="810" dy="19">documentation updated.</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">Vendor-specific rollback commands: [Needs confirmation]</tspan></text><rect x="12" y="986" width="1576" height="52" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1018" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#fff" text-anchor="middle">Итог: requirements → medium → topology → segmentation → routing boundary → test → document → operate; physical и logical evidence не подменяют друг друга.</text></svg>