<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 14. Сетевые аппаратные средства</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Medium → topology → switching/WAP → segmentation → routing boundary → test → document</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Ethernet / media</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Ethernet: modern LAN baseline</tspan><tspan x="42" dy="25">CSMA/CD explains shared-medium history</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">UTP:</tspan><tspan x="42" dy="25">category • crosstalk • termination • 100 m class links</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">Fiber:</tspan><tspan x="42" dy="25">multimode vs single-mode</tspan><tspan x="42" dy="25">fiber + patching + optics must match</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Switching / VLAN / routing</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Switch learns MAC → port</tspan><tspan x="562" dy="25">and forwards only where needed.</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Large broadcast domain → scaling risk.</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">VLAN = logical Ethernet segment</tspan><tspan x="562" dy="25">802.1Q = trunking example</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">VLAN alone ≠ security boundary.</tspan><tspan x="562" dy="25">Router separates logical segments.</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Wireless LAN</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="17.3" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">WAP + clients + SSID</tspan><tspan x="1084" dy="24">multiple SSIDs can map to VLANs</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">Channel planning limits interference.</tspan><tspan x="1084" dy="24">Large coverage → multiple WAPs + placement study.</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">Client tools named by chapter:</tspan><tspan x="1084" dy="24">ifconfig • iwlist • iwconfig • wpa_supplicant</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">WEP rejected; WPA2 is chapter baseline.</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Consistency / controlled change</text><text x="42" y="506" font-family="Arial, sans-serif" font-size="17.8" font-weight="500" fill="#17324d"><tspan x="42" dy="0">Autonegotiation:</tspan><tspan x="42" dy="25">≥1 Gbit/s → use it</tspan><tspan x="42" dy="25">≤100 Mbit/s → both ends must agree</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">PoE:</tspan><tspan x="42" dy="25">plan powered ports + power budget</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">Jumbo frames:</tspan><tspan x="42" dy="25">all devices on path must support same MTU</tspan><tspan x="42" dy="25">prove standard MTU first, then enlarge</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Troubleshooting / cabling</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="17.4" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Divide network into segments.</tspan><tspan x="562" dy="25">Test each segment until fault is isolated.</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Cable tester → physical/electrical faults</tspan><tspan x="562" dy="25">Packet analyzer → frame/protocol evidence</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Wireshark cannot prove cable/power health.</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Label cables, keep closet diagrams,</tspan><tspan x="562" dy="25">maintain electronic documentation.</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Design / SDN / management</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="17.2" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Design for building constraints + growth.</tspan><tspan x="1084" dy="26">Localize traffic with subnets/routers.</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">SDN:</tspan><tspan x="1084" dy="26">control plane programs data plane</tspan><tspan x="1084" dy="26">API control enables automation</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Centralize shared topology/backbone/policy;</tspan><tspan x="1084" dy="26">distribute local operations carefully.</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: физический слой и логическая конфигурация проверяются раздельно; изменение — только после локализации fault domain.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Acceptance = segment-level test + end-to-end test + updated documentation.</text></svg>