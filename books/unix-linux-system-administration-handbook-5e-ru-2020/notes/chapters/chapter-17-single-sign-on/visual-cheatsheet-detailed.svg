<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#213a59"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 17. Система единого входа — подробная шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f5" text-anchor="middle">Identity store • LDAP • Kerberos • sssd • NSS • PAM • domain join • legacy alternatives</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5a98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. SSO component model</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">Central identity and authorization store</tspan>
<tspan x="36" dy="19">→ LDAP / Active Directory</tspan>
<tspan x="36" dy="19">Authentication → LDAP or Kerberos</tspan>
<tspan x="36" dy="19">sssd aggregates providers</tspan>
<tspan x="36" dy="19">NSS supplies account attributes</tspan>
<tspan x="36" dy="19">PAM supplies auth/account/session/password</tspan>
<tspan x="36" dy="24">Applications no longer own auth logic.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. LDAP data model</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="430" dy="0">entry = attributes + values</tspan>
<tspan x="430" dy="19">DN = unique logical path</tspan>
<tspan x="430" dy="19">objectClass defines schema</tspan>
<tspan x="430" dy="19">LDIF = text representation</tspan>
<tspan x="430" dy="24">Directory workload:</tspan>
<tspan x="430" dy="19">many reads/searches, fewer writes</tspan>
<tspan x="430" dy="19">replication and caching are expected</tspan>
<tspan x="430" dy="24">TCP port 389 is shown for LDAP.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. LDAP implementations</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="824" dy="0">OpenLDAP:</tspan>
<tspan x="824" dy="19">slapd • slapd.conf • ldap.conf</tspan>
<tspan x="824" dy="19">suffix/base defines namespace root</tspan>
<tspan x="824" dy="24">389 Directory Server:</tspan>
<tspan x="824" dy="19">multi-master capability</tspan>
<tspan x="824" dy="19">AD user/group/password synchronization</tspan>
<tspan x="824" dy="19">GUI, CLI and web management</tspan>
<tspan x="824" dy="24">ldapsearch = CLI query/debug tool</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. Kerberos dependencies</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="1218" dy="0">Ticket-based symmetric-key authentication</tspan>
<tspan x="1218" dy="24">Critical prerequisites:</tspan>
<tspan x="1218" dy="19">DNS name resolution</tspan>
<tspan x="1218" dy="19">synchronized time / NTP</tspan>
<tspan x="1218" dy="24">FreeBSD flow:</tspan>
<tspan x="1218" dy="19">krb5.conf → kinit → klist</tspan>
<tspan x="1218" dy="19">→ net ads join</tspan>
<tspan x="1218" dy="24">kdestroy removes local ticket.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Linux Active Directory join</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="36" dy="0">Before join verify:</tspan>
<tspan x="36" dy="19">realmd installed • sssd installed</tspan>
<tspan x="36" dy="19">ntpd running • correct AD domain</tspan>
<tspan x="36" dy="19">account can join systems</tspan>
<tspan x="36" dy="24">Change:</tspan>
<tspan x="36" dy="19">sudo realm join --user=user DOMAIN</tspan>
<tspan x="36" dy="24">Acceptance:</tspan>
<tspan x="36" dy="19">realm list shows configured membership</tspan>
<tspan x="36" dy="24">Leave/rollback command: [Needs confirmation]</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. sssd and NSS</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="550" dy="0">sssd providers:</tspan>
<tspan x="550" dy="19">AD or LDAP for identity/authentication</tspan>
<tspan x="550" dy="24">LDAP path must be encrypted.</tspan>
<tspan x="550" dy="19">Example uses certificate validation.</tspan>
<tspan x="550" dy="24">nsswitch.conf:</tspan>
<tspan x="550" dy="19">passwd: files sss</tspan>
<tspan x="550" dy="19">group: files sss</tspan>
<tspan x="550" dy="19">shadow: files sss</tspan>
<tspan x="550" dy="24">Verify with getent passwd.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. PAM stack semantics</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="1064" dy="0">Module types:</tspan>
<tspan x="1064" dy="19">auth • account • session • password</tspan>
<tspan x="1064" dy="24">Control flags:</tspan>
<tspan x="1064" dy="19">required → final failure, keep running</tspan>
<tspan x="1064" dy="19">requisite → immediate failure</tspan>
<tspan x="1064" dy="19">sufficient → success can stop stack</tspan>
<tspan x="1064" dy="19">optional / include</tspan>
<tspan x="1064" dy="24">Order matters; bad config can deny login.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Verification chain</text>
<text x="36" y="760" font-family="Consolas, monospace" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">ldapsearch ...                    → directory data</tspan>
<tspan x="36" dy="19">kinit user@REALM                 → acquire ticket</tspan>
<tspan x="36" dy="19">klist                            → verify ticket cache</tspan>
<tspan x="36" dy="19">realm list                       → verify Linux realm membership</tspan>
<tspan x="36" dy="19">net ads join -U user             → domain join path</tspan>
<tspan x="36" dy="19">getent passwd                    → verify NSS sees directory users</tspan>
<tspan x="36" dy="24">Only after upstream checks: inspect PAM stack behavior.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Legacy approaches and risks</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="808" dy="0">NIS: chapter advises against new deployments.</tspan>
<tspan x="808" dy="19">Reasons stated: security and scalability weaknesses.</tspan>
<tspan x="808" dy="24">rsync can distribute passwd/shadow efficiently.</tspan>
<tspan x="808" dy="19">Shown transport: ssh.</tspan>
<tspan x="808" dy="19">But passwordless remote execution violates security policy.</tspan>
<tspan x="808" dy="24">PAM edits and passwd/shadow copies are high-impact changes.</tspan>
<tspan x="808" dy="24">General rollback: [Needs confirmation]</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#213a59"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core diagnostic order: provider reachability and prerequisites → ticket/directory check → sssd → NSS → PAM.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f5" text-anchor="middle">Identity lookup and authentication are separate paths; both must converge correctly for reliable SSO.</text>
</svg>