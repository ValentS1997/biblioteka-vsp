<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#203a56"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 19. Веб-хостинг</text>
<text x="800" y="75" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">HTTP • TLS/SNI • proxies • cache/CDN • Apache • NGINX • HAProxy</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">Request path</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16.7" fill="#19324a">
<tspan x="48" dy="0">client → DNS → TLS/SNI</tspan>
<tspan x="48" dy="25">→ load balancer / proxy / cache</tspan>
<tspan x="48" dy="25">→ web server → application</tspan>
<tspan x="48" dy="25">→ database/backend → response</tspan>
<tspan x="48" dy="32">HTTP: request + response</tspan>
<tspan x="48" dy="25">80 = HTTP • 443 = HTTPS</tspan>
<tspan x="48" dy="25">Host selects name-based virtual host.</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">HTTP / curl</text>
<text x="572" y="184" font-family="Consolas, monospace" font-size="15.5" fill="#19324a">
<tspan x="572" dy="0">curl -s -v -o /dev/null URL</tspan>
<tspan x="572" dy="24">curl -H "Host: name" ... IP</tspan>
<tspan x="572" dy="24">curl -H "Cache-Control: no-cache" URL</tspan>
<tspan x="572" dy="31">2xx success • 3xx redirect</tspan>
<tspan x="572" dy="24">4xx request/client problem</tspan>
<tspan x="572" dy="24">5xx server/runtime problem</tspan>
<tspan x="572" dy="24">Compare origin and each cache layer.</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Security boundaries</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16.1" fill="#19324a">
<tspan x="1096" dy="0">Basic Auth only with HTTPS.</tspan>
<tspan x="1096" dy="25">Do not put secrets in URLs/query strings.</tspan>
<tspan x="1096" dy="25">Protect TLS private keys.</tspan>
<tspan x="1096" dy="25">Disable obsolete SSL protocols.</tspan>
<tspan x="1096" dy="31">TLS termination creates a trust boundary.</tspan>
<tspan x="1096" dy="25">Logs can fill disk.</tspan>
<tspan x="1096" dy="25">Health checks should test real app state.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Apache httpd</text>
<text x="48" y="512" font-family="Consolas, monospace" font-size="15.5" fill="#19324a">
<tspan x="48" dy="0">httpd -t</tspan>
<tspan x="48" dy="24">apachectl status</tspan>
<tspan x="48" dy="24">apachectl graceful</tspan>
<tspan x="48" dy="31">VirtualHost + Include + modules</tspan>
<tspan x="48" dy="24">htpasswd → Basic Auth account file</tspan>
<tspan x="48" dy="24">Master may bind 80/443 as root;</tspan>
<tspan x="48" dy="24">workers run less privileged.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">NGINX</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16.1" fill="#19324a">
<tspan x="572" dy="0">Event-driven master + workers.</tspan>
<tspan x="572" dy="25">main → events / http → server → location</tspan>
<tspan x="572" dy="25">server_name + listen select vhost.</tspan>
<tspan x="572" dy="25">proxy_pass → reverse proxy.</tspan>
<tspan x="572" dy="31">nginx -t → syntax check.</tspan>
<tspan x="572" dy="25">upstream + health checks → load balancing.</tspan>
<tspan x="572" dy="25">HUP reload is documented; shell form omitted.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">HAProxy / availability</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16.1" fill="#19324a">
<tspan x="1096" dy="0">frontend → backend → server pool</tspan>
<tspan x="1096" dy="25">Health check removes failed backend.</tspan>
<tspan x="1096" dy="25">Recovery returns it to rotation.</tspan>
<tspan x="1096" dy="25">Sticky cookie can preserve backend affinity.</tspan>
<tspan x="1096" dy="31">TLS can terminate at HAProxy.</tspan>
<tspan x="1096" dy="25">PEM bundle needs strict permissions.</tspan>
<tspan x="1096" dy="25">Rollback: [Needs confirmation]</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#203a56"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: identify the failing HTTP layer before changing server, proxy, cache or load-balancer configuration.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Read-only first: curl → syntax checks → health/logs → controlled change → direct verification.</text>
</svg>