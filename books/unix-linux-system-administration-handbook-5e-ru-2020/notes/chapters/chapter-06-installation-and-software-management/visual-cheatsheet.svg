<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Глава 6. Инсталляция и управление программным обеспечением</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Provisioning → packages → repositories → localization → testing → rollout</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Автоматизированная установка</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d"><tspan x="42" dy="0">PXE:</tspan><tspan x="42" dy="28">DHCP → TFTP → boot config → image server</tspan><tspan x="42" dy="28"></tspan><tspan x="42" dy="28">Red Hat/CentOS: Kickstart / ks.cfg</tspan><tspan x="42" dy="28">Debian/Ubuntu: preseed / debconf</tspan><tspan x="42" dy="28">Cobbler: DHCP + DNS + TFTP + images + templates</tspan><tspan x="42" dy="28">FreeBSD: custom ISO / bsdinstall</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Package model</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Пакет = files + dependencies + config templates</tspan><tspan x="562" dy="27">+ install/remove scripts</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Low level:</tspan><tspan x="562" dy="27">RPM → rpm</tspan><tspan x="562" dy="27">DEB → dpkg</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">High level:</tspan><tspan x="562" dy="27">APT / yum → repositories + dependency resolution</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">FreeBSD software management</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">base system → freebsd-update</tspan><tspan x="1084" dy="29">binary packages → pkg</tspan><tspan x="1084" dy="29">source builds → ports</tspan><tspan x="1084" dy="29"></tspan><tspan x="1084" dy="29">Preferred: pkg when package exists</tspan><tspan x="1084" dy="29">Ports: when no package or compile-time options</tspan><tspan x="1084" dy="29"></tspan><tspan x="1084" dy="29">Protect package database → pkg backup</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Repositories и mirrors</text><text x="42" y="510" font-family="Arial, sans-serif" font-size="15.7" font-weight="400" fill="#17324d"><tspan x="42" dy="0">release → component → architecture → package</tspan><tspan x="42" dy="29"></tspan><tspan x="42" dy="29">APT/yum/pkg используют repository metadata</tspan><tspan x="42" dy="29">Local mirror полезен для большого fleet</tspan><tspan x="42" dy="29"></tspan><tspan x="42" dy="29">Риски:</tspan><tspan x="42" dy="29">• simultaneous updates → network spike</tspan><tspan x="42" dy="29">• untrusted source → download first, inspect later</tspan><tspan x="42" dy="29">• package version ≠ app version всегда</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Localization и rollout</text><text x="562" y="508" font-family="Arial, sans-serif" font-size="15.8" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Local config должна быть:</tspan><tspan x="562" dy="28">• structured</tspan><tspan x="562" dy="28">• reproducible</tspan><tspan x="562" dy="28">• under change control</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Rollout:</tspan><tspan x="562" dy="28">candidate → test host → limited group</tspan><tspan x="562" dy="28">→ wider group → critical systems last</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Не обновлять весь fleet одним шагом.</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Ключевые правила</text><text x="1084" y="508" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Не обходить dependencies через force без причины</tspan><tspan x="1084" dy="31">• Unattended install: не хранить plaintext secrets</tspan><tspan x="1084" dy="31">• Сначала test, потом массовый upgrade</tspan><tspan x="1084" dy="31">• Critical hosts не подключать слепо к auto-update</tspan><tspan x="1084" dy="31">• Документировать local changes</tspan><tspan x="1084" dy="31">• Пользователям дать канал feedback</tspan><tspan x="1084" dy="31">• Тестировать, пока изменение ещё можно отменить</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Главный pipeline: provision → dependency-aware package management → test → staged rollout → verify</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Автоматизация ценна только вместе с reproducibility, change control и ограниченным blast radius.</text></svg>