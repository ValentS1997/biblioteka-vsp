<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Глава 6. Инсталляция и управление программным обеспечением — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">От PXE и unattended install до repositories, FreeBSD, localization и staged rollout</text><rect x="12" y="100" width="500" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="500" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Provisioning / PXE</text><rect x="38" y="158" width="140" height="32" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="108" y="179" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Client</text><text x="198" y="179" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">PXE boot</text><line x1="108" y1="190" x2="108" y2="201" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="38" y="201" width="140" height="32" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="108" y="222" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">DHCP</text><text x="198" y="222" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">boot server + filename</text><line x1="108" y1="233" x2="108" y2="244" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="38" y="244" width="140" height="32" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="108" y="265" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">TFTP</text><text x="198" y="265" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">bootloader/config</text><line x1="108" y1="276" x2="108" y2="287" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="38" y="287" width="140" height="32" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="108" y="308" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Image server</text><text x="198" y="308" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">HTTP / NFS / FTP</text><line x1="108" y1="319" x2="108" y2="330" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="38" y="330" width="140" height="32" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="108" y="351" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Installer</text><text x="198" y="351" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">OS + packages</text><text x="40" y="377" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#17324d" text-anchor="start">DHCP/TFTP/file server могут быть разными hosts.</text><rect x="526" y="100" width="520" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="526" y="100" width="520" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="544" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Unattended installers</text><rect x="550" y="160" width="120" height="36" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="610" y="183" font-family="Arial, sans-serif" font-size="13.3" font-weight="700" fill="#17324d" text-anchor="middle">Kickstart</text><text x="688" y="183" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">ks.cfg: commands / %packages / %pre / %post</text><rect x="550" y="213" width="120" height="36" rx="6" fill="#e9f8ed" stroke="#62ae7b" stroke-width="1"/><text x="610" y="236" font-family="Arial, sans-serif" font-size="13.3" font-weight="700" fill="#17324d" text-anchor="middle">Preseed</text><text x="688" y="236" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">debconf answers + preseed/url</text><rect x="550" y="266" width="120" height="36" rx="6" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="610" y="289" font-family="Arial, sans-serif" font-size="13.3" font-weight="700" fill="#17324d" text-anchor="middle">Cobbler</text><text x="688" y="289" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">templates/snippets + DHCP/DNS/TFTP/images</text><rect x="550" y="319" width="120" height="36" rx="6" fill="#e9f8ed" stroke="#62ae7b" stroke-width="1"/><text x="610" y="342" font-family="Arial, sans-serif" font-size="13.3" font-weight="700" fill="#17324d" text-anchor="middle">FreeBSD</text><text x="688" y="342" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d" text-anchor="start">custom ISO + installerconfig + bsdinstall</text><rect x="550" y="374" width="470" height="18" rx="6" fill="#ffe1e1" stroke="#d86666" stroke-width="1"/><text x="785" y="388" font-family="Arial, sans-serif" font-size="11.8" font-weight="700" fill="#7a2525" text-anchor="middle">Secrets: hashed password лучше plaintext в unattended config</text><rect x="1060" y="100" width="528" height="300" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="1060" y="100" width="528" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="1078" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">3. Package layers</text><text x="1084" y="166" font-family="Arial, sans-serif" font-size="13.8" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Package:</tspan><tspan x="1084" dy="22">• files/binaries</tspan><tspan x="1084" dy="22">• dependency metadata</tspan><tspan x="1084" dy="22">• configuration templates</tspan><tspan x="1084" dy="22">• install/remove scripts</tspan><tspan x="1084" dy="22"></tspan><tspan x="1084" dy="22">Low-level tools:</tspan><tspan x="1084" dy="22">RPM → rpm      DEB → dpkg</tspan><tspan x="1084" dy="22"></tspan><tspan x="1084" dy="22">High-level:</tspan><tspan x="1084" dy="22">APT / yum → repos + dependencies + upgrade</tspan></text><rect x="12" y="416" width="600" height="292" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="12" y="416" width="600" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">4. Repository model</text><rect x="38" y="486" width="110" height="36" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="93" y="510" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#463a93" text-anchor="middle">release</text><line x1="148" y1="504" x2="190" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="192" y="486" width="120" height="36" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="252" y="510" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#463a93" text-anchor="middle">component</text><line x1="312" y1="504" x2="354" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="356" y="486" width="120" height="36" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="416" y="510" font-family="Arial, sans-serif" font-size="13.2" font-weight="700" fill="#463a93" text-anchor="middle">architecture</text><line x1="476" y1="504" x2="518" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="486" width="70" height="36" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="555" y="510" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#463a93" text-anchor="middle">pkg</text><text x="38" y="554" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="38" dy="0">Local mirror → меньше внешних fetch, удобнее controlled distribution</tspan><tspan x="38" dy="27">Но fleet jobs нужно разнести по времени: simultaneous update = network spike.</tspan><tspan x="38" dy="27">Недоверенный source: download-only → inspect → install.</tspan><tspan x="38" dy="27">Dependency metadata не нужно обходить force-опциями без серьёзной причины.</tspan></text><rect x="626" y="416" width="460" height="292" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="626" y="416" width="460" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="644" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">5. FreeBSD</text><text x="650" y="484" font-family="Consolas, monospace" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="650" dy="0">base system</tspan><tspan x="650" dy="19">  uname -r</tspan><tspan x="650" dy="19">  freebsd-update fetch install</tspan><tspan x="650" dy="19"></tspan><tspan x="650" dy="19">binary packages</tspan><tspan x="650" dy="19">  pkg info / search / audit / upgrade</tspan><tspan x="650" dy="19">  pkg backup → сохранить package DB</tspan><tspan x="650" dy="19"></tspan><tspan x="650" dy="19">ports</tspan><tspan x="650" dy="19">  portsnap → make install clean</tspan><tspan x="650" dy="19">  portmaster -L / -a</tspan><tspan x="650" dy="19"></tspan><tspan x="650" dy="19">Preferred: pkg; ports — если package нет</tspan><tspan x="650" dy="19">или нужны compile-time options.</tspan></text><rect x="1100" y="416" width="488" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1100" y="416" width="488" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1118" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. Localization / change control</text><text x="1124" y="484" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="1124" dy="0">Local config должна быть reproducible.</tspan><tspan x="1124" dy="21">Исходные данные → change-control system.</tspan><tspan x="1124" dy="21"></tspan><tspan x="1124" dy="21">Разделять:</tspan><tspan x="1124" dy="21">• global settings</tspan><tspan x="1124" dy="21">• group-specific settings</tspan><tspan x="1124" dy="21">• host-specific exceptions</tspan><tspan x="1124" dy="21"></tspan><tspan x="1124" dy="21">Цель — не «все hosts одинаковы»,</tspan><tspan x="1124" dy="21">а управляемое число конфигураций.</tspan><tspan x="1124" dy="21"></tspan><tspan x="1124" dy="21">Документация должна быть актуальной и доступной.</tspan></text><rect x="12" y="724" width="920" height="244" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="724" width="920" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">7. Testing и staged rollout</text><rect x="40" y="794" width="140" height="38" rx="7" fill="#fff0f6" stroke="#d39bb5" stroke-width="1"/><text x="110" y="818" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#7a254b" text-anchor="middle">Candidate change</text><line x1="180" y1="813" x2="204" y2="813" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="205" y="794" width="140" height="38" rx="7" fill="#f8f1fb" stroke="#d39bb5" stroke-width="1"/><text x="275" y="818" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#7a254b" text-anchor="middle">Test host</text><line x1="345" y1="813" x2="369" y2="813" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="794" width="140" height="38" rx="7" fill="#f8f1fb" stroke="#d39bb5" stroke-width="1"/><text x="440" y="818" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#7a254b" text-anchor="middle">Limited group</text><line x1="510" y1="813" x2="534" y2="813" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="535" y="794" width="140" height="38" rx="7" fill="#f8f1fb" stroke="#d39bb5" stroke-width="1"/><text x="605" y="818" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#7a254b" text-anchor="middle">Wider rollout</text><line x1="675" y1="813" x2="699" y2="813" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="794" width="140" height="38" rx="7" fill="#f8f1fb" stroke="#d39bb5" stroke-width="1"/><text x="770" y="818" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#7a254b" text-anchor="middle">Critical systems</text><text x="40" y="858" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="40" dy="0">Тестировать изменения, пока их ещё можно отменить.</tspan><tspan x="40" dy="22">Critical systems не подключать слепо к vendor auto-update.</tspan><tspan x="40" dy="22">Сообщать пользователям о planned changes и давать быстрый feedback channel.</tspan><tspan x="40" dy="22">Региональные/языковые настройки тоже входят в acceptance testing.</tspan></text><rect x="946" y="724" width="642" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="946" y="724" width="642" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="964" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Командные ориентиры</text><text x="970" y="790" font-family="Consolas, monospace" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="970" dy="0">rpm -qa / rpm -q / rpm -U</tspan><tspan x="970" dy="20">dpkg -l / dpkg --install</tspan><tspan x="970" dy="20">apt update / apt install / apt upgrade</tspan><tspan x="970" dy="20">yum install / yum update / yum makecache</tspan><tspan x="970" dy="20">pkg info / pkg audit -F / pkg upgrade</tspan><tspan x="970" dy="20">freebsd-update fetch install</tspan><tspan x="970" dy="20">portsnap fetch update / portmaster -L</tspan><tspan x="970" dy="20"></tspan><tspan x="970" dy="20">Сначала read-only query → затем change → verify.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Итог: source → dependency model → controlled install/update → localization → test → staged rollout → verify/document.</text></svg>