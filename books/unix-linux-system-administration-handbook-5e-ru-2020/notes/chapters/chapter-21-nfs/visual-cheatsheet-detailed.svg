<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#26384d"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 21. NFS — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Versions • RPC • exports • security • client mounts • identity mapping • nfsstat • automount</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. Architecture</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="36" dy="0">NFS exposes remote files via normal file API.</tspan>
<tspan x="36" dy="19">RPC carries remote filesystem operations.</tspan>
<tspan x="36" dy="24">v2/v3: stateless-oriented; external locking.</tspan>
<tspan x="36" dy="19">v4: stateful; integrated locking/recovery.</tspan>
<tspan x="36" dy="24">v3: UDP or TCP.</tspan>
<tspan x="36" dy="19">v4: TCP, usually port 2049.</tspan>
<tspan x="36" dy="24">NFS is file-level, not block-level storage.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Export policy</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="430" dy="0">Linux /etc/exports:</tspan>
<tspan x="430" dy="19">path client(options) client(options)</tspan>
<tspan x="430" dy="24">exportfs -a → exportfs -v</tspan>
<tspan x="430" dy="24">FreeBSD syntax differs.</tspan>
<tspan x="430" dy="19">nfsd restart; mountd reload for v3.</tspan>
<tspan x="430" dy="24">Always restrict client/network scope.</tspan>
<tspan x="430" dy="19">Whitespace can alter Linux access semantics.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. Security boundary</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="824" dy="0">AUTH_SYS: client supplies UID/GID.</tspan>
<tspan x="824" dy="19">Identity consistency helps but does not authenticate.</tspan>
<tspan x="824" dy="24">root_squash: remote root → anonymous.</tspan>
<tspan x="824" dy="19">no_root_squash: dangerous.</tspan>
<tspan x="824" dy="24">RPCSEC_GSS / Kerberos:</tspan>
<tspan x="824" dy="19">krb5 auth • krb5i integrity • krb5p privacy.</tspan>
<tspan x="824" dy="24">async risks corruption on server crash.</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. Client workflow</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="1218" dy="0">v2/v3: showmount -e server</tspan>
<tspan x="1218" dy="19">v4: showmount is not equivalent discovery.</tspan>
<tspan x="1218" dy="24">Manual mount first; then test access.</tspan>
<tspan x="1218" dy="19">df verifies mounted filesystem response.</tspan>
<tspan x="1218" dy="24">Persist later in fstab/autofs.</tspan>
<tspan x="1218" dy="19">Busy umount → fuser/lsof first.</tspan>
<tspan x="1218" dy="24">umount -f = last resort.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Mount failure semantics</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">hard: I/O waits until server returns.</tspan>
<tspan x="36" dy="19">Risk: blocked processes during outage.</tspan>
<tspan x="36" dy="24">soft: returns application errors after retries.</tspan>
<tspan x="36" dy="19">Use only when that failure model is acceptable.</tspan>
<tspan x="36" dy="24">bg: retry mount in background.</tspan>
<tspan x="36" dy="19">intr: permit interrupt of blocked operation.</tspan>
<tspan x="36" dy="24">nfsvers/sec/proto make protocol/security explicit.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. Identity mapping</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="550" dy="0">NFSv4 names: user@nfs-domain / group@nfs-domain.</tspan>
<tspan x="550" dy="19">Linux: rpc.idmapd + /etc/idmapd.conf.</tspan>
<tspan x="550" dy="19">FreeBSD: nfsuserd + rc.conf flags.</tspan>
<tspan x="550" dy="24">All participants need same NFS domain.</tspan>
<tspan x="550" dy="24">Mapping affects file ownership attributes.</tspan>
<tspan x="550" dy="19">It does NOT decide authentication/access.</tspan>
<tspan x="550" dy="24">Mismatched IDs can produce misleading ownership.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Observe before tuning</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="1064" dy="0">nfsstat -s → server statistics</tspan>
<tspan x="1064" dy="19">nfsstat -c → client statistics</tspan>
<tspan x="1064" dy="19">netstat → network context</tspan>
<tspan x="1064" dy="24">low badxid + high timeout → packet loss suspected</tspan>
<tspan x="1064" dy="19">badxid ≈ timeout → slow server suspected</tspan>
<tspan x="1064" dy="24">rsize/wsize/timeo/thread count are tuning.</tspan>
<tspan x="1064" dy="19">Keep old values and verify after one change.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Automount</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">autofs intercepts access and mounts on demand.</tspan>
<tspan x="36" dy="19">Maps: indirect • direct • master.</tspan>
<tspan x="36" dy="24">Linux master: /etc/auto.master.</tspan>
<tspan x="36" dy="19">FreeBSD master: /etc/auto_master.</tspan>
<tspan x="36" dy="24">automount -L → dry-run.</tspan>
<tspan x="36" dy="19">automount -v → verbose apply.</tspan>
<tspan x="36" dy="24">Replicated sources are appropriate for read-only data.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Operational acceptance</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="808" dy="0">1. Explicit server path + client/network scope.</tspan>
<tspan x="808" dy="19">2. Explicit security mode where required.</tspan>
<tspan x="808" dy="19">3. Apply one server-side change.</tspan>
<tspan x="808" dy="19">4. Verify active export.</tspan>
<tspan x="808" dy="19">5. Manual client mount + real read/write test.</tspan>
<tspan x="808" dy="19">6. Check nfsstat before tuning.</tspan>
<tspan x="808" dy="19">7. Persist in fstab/autofs only after manual success.</tspan>
<tspan x="808" dy="19">8. Rollback by restoring prior config; otherwise [Needs confirmation].</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#26384d"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core: NFS reliability comes from explicit export scope, explicit security, understood mount failure semantics, and measured diagnostics.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Automount is the final convenience layer; it should not be used to hide an export or mount that was never verified manually.</text>
</svg>