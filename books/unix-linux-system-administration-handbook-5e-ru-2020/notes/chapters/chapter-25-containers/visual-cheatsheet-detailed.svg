<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#26384d"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 25. Контейнеры — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">kernel isolation • Docker runtime • images • volumes • networking • logging • security • schedulers</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. Kernel isolation</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="36" dy="0">Container = isolated process group.</tspan>
<tspan x="36" dy="19">Host kernel is shared.</tspan>
<tspan x="36" dy="24">Namespaces isolate OS views.</tspan>
<tspan x="36" dy="19">cgroups constrain resources.</tspan>
<tspan x="36" dy="19">Capabilities split privileged operations.</tspan>
<tspan x="36" dy="19">seccomp restricts system calls.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Images / copy-on-write</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="430" dy="0">Image = read-only layered filesystem.</tspan>
<tspan x="430" dy="19">Containers share immutable base layers.</tspan>
<tspan x="430" dy="19">Each container gets writable layer.</tspan>
<tspan x="430" dy="24">Dockerfile should define reproducible image.</tspan>
<tspan x="430" dy="19">Smaller base image reduces dependencies.</tspan>
<tspan x="430" dy="19">Inspect base Dockerfile before trust.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. dockerd boundary</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="824" dy="0">docker CLI → privileged dockerd.</tspan>
<tspan x="824" dy="19">Local UNIX socket by default.</tspan>
<tspan x="824" dy="24">docker group access can become host root.</tspan>
<tspan x="824" dy="19">Prefer controlled sudo access.</tspan>
<tspan x="824" dy="24">Remote daemon requires TLS.</tspan>
<tspan x="824" dy="19">DOCKER_CONTENT_TRUST validates trusted images.</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. Lifecycle / diagnosis</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="1218" dy="0">pull → run → ps → logs / inspect.</tspan>
<tspan x="1218" dy="19">exec only for targeted diagnosis.</tspan>
<tspan x="1218" dy="19">stop/start changes runtime state.</tspan>
<tspan x="1218" dy="24">PID 1 exit stops container.</tspan>
<tspan x="1218" dy="19">Fix image/build automation, then replace.</tspan>
<tspan x="1218" dy="24">Do not treat container as a pet server.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Persistent data</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">Writable container layer is disposable.</tspan>
<tspan x="36" dy="19">Volume persists independently.</tspan>
<tspan x="36" dy="19">Bind mount maps host path directly.</tspan>
<tspan x="36" dy="24">Bind mount couples workload to host/storage.</tspan>
<tspan x="36" dy="19">Volume inventory matters before deletion.</tspan>
<tspan x="36" dy="24">Orphaned volumes can fill disk.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. Network / logging</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="550" dy="0">bridge → docker0 + veth + published ports.</tspan>
<tspan x="550" dy="19">host → shared host stack, lower isolation.</tspan>
<tspan x="550" dy="19">none → no automatic network config.</tspan>
<tspan x="550" dy="24">Normal logs → STDOUT; errors → STDERR.</tspan>
<tspan x="550" dy="19">Docker logging driver routes messages.</tspan>
<tspan x="550" dy="24">Configure rotation to avoid disk exhaustion.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Least privilege / supply chain</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.3" fill="#19324a">
<tspan x="1064" dy="0">Run process as unprivileged USER.</tspan>
<tspan x="1064" dy="19">Read-only root when application allows.</tspan>
<tspan x="1064" dy="19">Drop all capabilities, add only required ones.</tspan>
<tspan x="1064" dy="24">Avoid privileged mode.</tspan>
<tspan x="1064" dy="19">Unsigned/unmaintained images are untrusted.</tspan>
<tspan x="1064" dy="19">Private registry should use TLS/authentication.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Cleanup / daemon changes</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">Inventory first: ps -a • images • volume ls • network ls.</tspan>
<tspan x="36" dy="19">system prune / image prune / volume rm are destructive.</tspan>
<tspan x="36" dy="24">dockerd storage/network changes affect the whole host.</tspan>
<tspan x="36" dy="19">Save previous systemd override before edit.</tspan>
<tspan x="36" dy="19">Restart → status → docker info verification.</tspan>
<tspan x="36" dy="24">Deletion without backup baseline: [Needs confirmation]</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Cluster management</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="808" dy="0">Scheduler → placement + health + routing + capacity.</tspan>
<tspan x="808" dy="19">Kubernetes: pods + services + control components.</tspan>
<tspan x="808" dy="19">Mesos: masters + agents + frameworks; Marathon deploys apps.</tspan>
<tspan x="808" dy="19">Swarm: Docker-integrated desired-state manager.</tspan>
<tspan x="808" dy="19">ECS: AWS-managed coordination around EC2 agents.</tspan>
<tspan x="808" dy="24">Learn single-host runtime before orchestration.</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#26384d"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core: containers are disposable processes built from immutable images; persistent state and privileges must be explicit external boundaries.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Book context: Docker 1.13.1. Treat version-specific daemon syntax as historical unless independently confirmed.</text>
</svg>