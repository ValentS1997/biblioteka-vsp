<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f8f3ff"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Глава 3. Управление доступом и привилегии суперпользователя</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">UNIX и Linux: руководство системного администратора, 5-е издание</text><rect x="20" y="112" width="500" height="310" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">База UNIX: кто имеет доступ?</text><text x="42" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d"><tspan x="42" dy="0">• UID/GID определяют identity процесса</tspan><tspan x="42" dy="31">• Файл имеет владельца и группу</tspan><tspan x="42" dy="31">• Owner задаёт permissions</tspan><tspan x="42" dy="31">• Root = эффективный UID 0</tspan><tspan x="42" dy="31">• setuid/setgid временно меняют effective ID</tspan><tspan x="42" dy="31">• Устройства в /dev подчиняются filesystem access</tspan></text><rect x="540" y="112" width="500" height="310" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Root и sudo: preferred workflow</text><rect x="596" y="178" width="390" height="52" rx="8" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.4"/><text x="791" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">Нужна конкретная admin-операция</text><text x="791" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="middle">не общий root shell</text><line x1="791" y1="230" x2="791" y2="252" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="254" width="350" height="48" rx="8" fill="#e6f8ec" stroke="#53aa72" stroke-width="1.4"/><text x="791" y="284" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#17324d" text-anchor="middle">sudo &lt;command&gt; / sudo -u &lt;user&gt; ...</text><line x1="791" y1="302" x2="791" y2="324" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="326" width="350" height="62" rx="8" fill="#fff2cf" stroke="#d4a42c" stroke-width="1.4"/><text x="791" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17324d" text-anchor="middle">visudo + exact paths</text><text x="791" y="372" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="middle">audit + simple policy</text><rect x="1060" y="112" width="520" height="310" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Расширения традиционной модели</text><rect x="1082" y="180" width="150" height="34" rx="7" fill="#f5efff" stroke="#b38bd1" stroke-width="1"/><text x="1157" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4e2f62" text-anchor="middle">PAM</text><text x="1252" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">authentication abstraction</text><rect x="1082" y="225" width="150" height="34" rx="7" fill="#f5efff" stroke="#b38bd1" stroke-width="1"/><text x="1157" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4e2f62" text-anchor="middle">Kerberos</text><text x="1252" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">network authentication</text><rect x="1082" y="270" width="150" height="34" rx="7" fill="#f5efff" stroke="#b38bd1" stroke-width="1"/><text x="1157" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4e2f62" text-anchor="middle">ACL</text><text x="1252" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">несколько users/groups</text><rect x="1082" y="315" width="150" height="34" rx="7" fill="#f5efff" stroke="#b38bd1" stroke-width="1"/><text x="1157" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4e2f62" text-anchor="middle">Capabilities</text><text x="1252" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">дробление root privileges</text><rect x="1082" y="360" width="150" height="34" rx="7" fill="#f5efff" stroke="#b38bd1" stroke-width="1"/><text x="1157" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4e2f62" text-anchor="middle">Namespaces</text><text x="1252" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#17324d" text-anchor="start">скрытие объектов / isolation</text><rect x="20" y="446" width="500" height="330" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="20" y="446" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="38" y="476" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Опасные паттерны</text><text x="42" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d"><tspan x="42" dy="0">• Прямой root login без необходимости</tspan><tspan x="42" dy="31">• Дополнительные UID 0 accounts</tspan><tspan x="42" dy="31">• Лишние setuid-root программы</tspan><tspan x="42" dy="31">• sudo policy «ALL, кроме ...» как security boundary</tspan><tspan x="42" dy="31">• NOPASSWD: ALL</tspan><tspan x="42" dy="31">• Слишком широкий env_keep</tspan><tspan x="42" dy="31">• nobody не должен владеть файлами</tspan></text><rect x="540" y="446" width="500" height="330" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="540" y="446" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="558" y="476" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">MAC / RBAC / LSM</text><text x="562" y="518" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d"><tspan x="562" dy="0">LSM — kernel API для security modules</tspan><tspan x="562" dy="31">DAC — владелец сам делегирует права</tspan><tspan x="562" dy="31">MAC — централизованная policy поверх DAC</tspan><tspan x="562" dy="31">RBAC — permissions → roles → users</tspan><tspan x="562" dy="31">SELinux — мощная MAC/RBAC-система</tspan><tspan x="562" dy="31">AppArmor — path-based профили приложений</tspan></text><rect x="1060" y="446" width="520" height="330" rx="14" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="446" width="520" height="44" rx="14" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1078" y="476" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Ключевые принципы главы</text><text x="1084" y="518" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">1. Least privilege вместо монолитного root.</tspan><tspan x="1084" dy="31">2. Делегировать конкретную операцию, не shell.</tspan><tspan x="1084" dy="31">3. Сохранять audit trail.</tspan><tspan x="1084" dy="31">4. Authentication ≠ authorization.</tspan><tspan x="1084" dy="31">5. Чем сложнее policy, тем важнее logging.</tspan><tspan x="1084" dy="31">6. Перед MAC rollout понимать troubleshooting.</tspan><tspan x="1084" dy="31">7. Простая понятная policy лучше сложной.</tspan></text><rect x="20" y="802" width="1560" height="66" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="832" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Эволюция: owner/group → root/setuid → sudo → PAM/Kerberos/ACL/capabilities/namespaces → LSM/MAC/RBAC → SELinux/AppArmor</text><text x="800" y="856" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Главный вывод: минимальные полномочия + проверяемая policy + аудит.</text></svg>