<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f8f3ff"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bgd)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 3. Управление доступом и привилегии суперпользователя — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">UNIX и Linux: руководство системного администратора, 5-е издание</text><rect x="12" y="100" width="490" height="566" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="490" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0c3e74" text-anchor="start">Стек контроля доступа</text><rect x="34" y="158" width="446" height="76" rx="9" fill="#edf6ff" stroke="#9eb5c6" stroke-width="1.2"/><text x="54" y="183" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="start">1. UNIX DAC</text><text x="54" y="207" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">UID/GID</text><text x="206" y="207" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">owner/group</text><text x="340" y="207" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">mode bits</text><line x1="257" y1="234" x2="257" y2="252" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="252" width="446" height="76" rx="9" fill="#fff2d8" stroke="#9eb5c6" stroke-width="1.2"/><text x="54" y="277" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="start">2. Root / setuid</text><text x="54" y="301" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">UID 0</text><text x="206" y="301" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">setuid/setgid</text><text x="340" y="301" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">широкая privilege domain</text><line x1="257" y1="328" x2="257" y2="346" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="346" width="446" height="76" rx="9" fill="#e7f8ec" stroke="#9eb5c6" stroke-width="1.2"/><text x="54" y="371" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="start">3. sudo delegation</text><text x="54" y="395" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">user + host</text><text x="206" y="395" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">target user + command</text><text x="340" y="395" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">audit/logging</text><line x1="257" y1="422" x2="257" y2="440" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="440" width="446" height="76" rx="9" fill="#f2edff" stroke="#9eb5c6" stroke-width="1.2"/><text x="54" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="start">4. Extensions</text><text x="54" y="489" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">PAM / Kerberos / ACL</text><text x="206" y="489" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">capabilities</text><text x="340" y="489" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">namespaces</text><line x1="257" y1="516" x2="257" y2="534" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="534" width="446" height="76" rx="9" fill="#ffeef7" stroke="#9eb5c6" stroke-width="1.2"/><text x="54" y="559" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="start">5. Policy frameworks</text><text x="54" y="583" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">LSM / MAC / RBAC</text><text x="206" y="583" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">SELinux</text><text x="340" y="583" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">AppArmor</text><rect x="516" y="100" width="500" height="566" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="516" y="100" width="500" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="534" y="128" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#145d2d" text-anchor="start">sudo: практический workflow</text><rect x="548" y="158" width="436" height="44" rx="7" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.3"/><text x="766" y="186" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Определить минимальную admin-операцию</text><line x1="766" y1="202" x2="766" y2="218" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="218" width="436" height="44" rx="7" fill="#eef8ff" stroke="#5c9ee6" stroke-width="1.3"/><text x="766" y="246" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Проверить policy: user / host / target / command</text><line x1="766" y1="262" x2="766" y2="278" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="278" width="436" height="44" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1.3"/><text x="766" y="306" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Редактировать через visudo</text><line x1="766" y1="322" x2="766" y2="338" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="338" width="436" height="44" rx="7" fill="#fff2cf" stroke="#d4a42c" stroke-width="1.3"/><text x="766" y="366" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Использовать полные пути команд</text><line x1="766" y1="382" x2="766" y2="398" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="398" width="436" height="44" rx="7" fill="#fff2cf" stroke="#d4a42c" stroke-width="1.3"/><text x="766" y="426" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Сохранить очищенное environment</text><line x1="766" y1="442" x2="766" y2="458" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="458" width="436" height="44" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1.3"/><text x="766" y="486" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Проверить audit trail / central logging</text><line x1="766" y1="502" x2="766" y2="518" stroke="#172737" stroke-width="2" marker-end="url(#arrow)"/><rect x="548" y="518" width="436" height="44" rx="7" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.3"/><text x="766" y="546" font-family="Arial, sans-serif" font-size="14.2" font-weight="700" fill="#17324d" text-anchor="middle">Для staged sudoers: visudo -c -f candidate</text><rect x="548" y="590" width="436" height="54" rx="8" fill="#ffe1e1" stroke="#d86666" stroke-width="1.4"/><text x="766" y="612" font-family="Arial, sans-serif" font-size="13.8" font-weight="700" fill="#7a2525" text-anchor="middle">Не считать «ALL, кроме ...» настоящей изоляцией</text><text x="766" y="632" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#7a2525" text-anchor="middle">и избегать NOPASSWD: ALL без необходимости</text><rect x="1030" y="100" width="558" height="566" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1030" y="100" width="558" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1048" y="128" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#552078" text-anchor="start">Что добавляют расширения</text><rect x="1050" y="158" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="188" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">PAM</text><text x="1194" y="177" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как подтвердить identity?</text><text x="1194" y="198" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">Framework аутентификации</text><rect x="1050" y="230" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="260" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">Kerberos</text><text x="1194" y="249" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как доказать identity в сети?</text><text x="1194" y="270" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">Trusted third party + crypto</text><rect x="1050" y="302" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="332" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">ACL</text><text x="1194" y="321" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как дать file access нескольким субъектам?</text><text x="1194" y="342" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">Расширение owner/group/other</text><rect x="1050" y="374" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="404" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">Capabilities</text><text x="1194" y="393" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как не давать весь root?</text><text x="1194" y="414" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">Дробные privileges</text><rect x="1050" y="446" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="476" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">Namespaces</text><text x="1194" y="465" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как скрыть часть системы?</text><text x="1194" y="486" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">Visibility/isolation boundary</text><rect x="1050" y="518" width="128" height="50" rx="7" fill="#f6f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1114" y="548" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4e2f62" text-anchor="middle">RBAC</text><text x="1194" y="537" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Как управлять правами через роли?</text><text x="1194" y="558" font-family="Arial, sans-serif" font-size="12.3" font-weight="400" fill="#17324d" text-anchor="start">permissions → roles → users</text><rect x="12" y="680" width="720" height="260" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="680" width="720" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="708" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#684b00" text-anchor="start">Современный policy layer: SELinux и AppArmor</text><rect x="34" y="738" width="326" height="178" rx="9" fill="#fff8df" stroke="#d1a936" stroke-width="1.2"/><text x="197" y="765" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#684b00" text-anchor="middle">SELinux</text><text x="52" y="792" font-family="Arial, sans-serif" font-size="13.3" font-weight="400" fill="#17324d"><tspan x="52" dy="0">• LSM-based MAC/RBAC</tspan><tspan x="52" dy="22">• /etc/selinux/config</tspan><tspan x="52" dy="22">• enforcing / permissive / disabled</tspan><tspan x="52" dy="22">• targeted policy — типичный Red Hat path</tspan><tspan x="52" dy="22">• audit2allow генерирует policy из logs</tspan><tspan x="52" dy="22">• auto-generated policy может быть неполной</tspan></text><rect x="382" y="738" width="326" height="178" rx="9" fill="#f3edff" stroke="#a47bd1" stroke-width="1.2"/><text x="545" y="765" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#552078" text-anchor="middle">AppArmor</text><text x="400" y="792" font-family="Arial, sans-serif" font-size="13.3" font-weight="400" fill="#17324d"><tspan x="400" dy="0">• MAC поверх UNIX-модели</tspan><tspan x="400" dy="22">• application-specific profiles</tspan><tspan x="400" dy="22">• default deny для profiled процесса</tspan><tspan x="400" dy="22">• /etc/apparmor.d</tspan><tspan x="400" dy="22">• path-based и читаемая policy</tspan><tspan x="400" dy="22">• hard links — ограничение модели</tspan></text><rect x="748" y="680" width="400" height="260" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="748" y="680" width="400" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="766" y="708" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9c1651" text-anchor="start">Риски и anti-patterns</text><text x="770" y="748" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="770" dy="0">• Direct root login без нужды</tspan><tspan x="770" dy="23">• Несколько UID 0 accounts</tspan><tspan x="770" dy="23">• Лишние setuid-root binaries</tspan><tspan x="770" dy="23">• NOPASSWD: ALL</tspan><tspan x="770" dy="23">• «ALL, кроме shell» как security boundary</tspan><tspan x="770" dy="23">• Широкий env_keep</tspan><tspan x="770" dy="23">• nobody владеет файлами</tspan><tspan x="770" dy="23">• MAC rollout без понимания logs</tspan></text><rect x="1164" y="680" width="424" height="260" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1164" y="680" width="424" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1182" y="708" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#145d2d" text-anchor="start">Финальные принципы</text><text x="1186" y="748" font-family="Arial, sans-serif" font-size="13.6" font-weight="400" fill="#17324d"><tspan x="1186" dy="0">1. Least privilege.</tspan><tspan x="1186" dy="24">2. Делегировать действие, не root shell.</tspan><tspan x="1186" dy="24">3. Auditability важна не меньше доступа.</tspan><tspan x="1186" dy="24">4. Authentication ≠ authorization.</tspan><tspan x="1186" dy="24">5. Простая policy легче проверяется.</tspan><tspan x="1186" dy="24">6. Чем мощнее MAC, тем важнее troubleshooting.</tspan><tspan x="1186" dy="24">7. Boundary должна быть понятна до rollout.</tspan></text><rect x="12" y="958" width="1576" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="988" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Итог главы: UNIX DAC остаётся базой, sudo решает делегирование, а современные механизмы добавляют точность, изоляцию и централизованные политики.</text><text x="800" y="1015" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Управляйте не максимальными правами, а минимально достаточными полномочиями — с понятной policy и журналом.</text></svg>