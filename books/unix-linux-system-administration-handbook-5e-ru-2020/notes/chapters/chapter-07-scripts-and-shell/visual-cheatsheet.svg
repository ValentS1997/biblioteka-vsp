<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 7. Сценарии и командная оболочка</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Команды → pipelines → scripts → environments → Git</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Automation mindset</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d"><tspan x="42" dy="0">• Автоматизировать не только большие задачи</tspan><tspan x="42" dy="29">• Alias/function → micro-script → full script</tspan><tspan x="42" dy="29">• Script = executable documentation</tspan><tspan x="42" dy="29">• Сначала понять manual operation</tspan><tspan x="42" dy="29">• Ясность и reproducibility важнее premature tuning</tspan><tspan x="42" dy="29"></tspan><tspan x="42" dy="29">Вопрос: «Что делать, если задача повторится?»</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Shell: streams и pipelines</text><text x="562" y="184" font-family="Consolas, monospace" font-size="16" font-weight="500" fill="#17324d"><tspan x="562" dy="0">0 STDIN   1 STDOUT   2 STDERR</tspan><tspan x="562" dy="29"></tspan><tspan x="562" dy="29">&gt;   overwrite       &gt;&gt; append</tspan><tspan x="562" dy="29">2&gt;  errors          | pipeline</tspan><tspan x="562" dy="29">&amp;&amp;  next on success</tspan><tspan x="562" dy="29">||  next on failure</tspan><tspan x="562" dy="29"></tspan><tspan x="562" dy="29">Filters: cut sort uniq wc tee grep tail</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Safe scripting workflow</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.9" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">1. Найти candidates</tspan><tspan x="1084" dy="27">2. Отфильтровать</tspan><tspan x="1084" dy="27">3. Сгенерировать commands в STDOUT</tspan><tspan x="1084" dy="27">4. Проверить визуально</tspan><tspan x="1084" dy="27">5. Только затем выполнить</tspan><tspan x="1084" dy="27"></tspan><tspan x="1084" dy="27">Validation + STDERR + nonzero exit on failure</tspan><tspan x="1084" dy="27">bash -n = syntax; -x = execution trace</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Regex ≠ shell glob</text><text x="42" y="506" font-family="Consolas, monospace" font-size="15.4" font-weight="500" fill="#17324d"><tspan x="42" dy="0">Glob:   *.log</tspan><tspan x="42" dy="25">Regex:  ^foo.*bar$</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">Regex:</tspan><tspan x="42" dy="25">.  []  ()  |  * + ?  {m,n}  ^ $</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">• captures</tspan><tspan x="42" dy="25">• greedy vs lazy</tspan><tspan x="42" dy="25">• .* требует осторожности</tspan><tspan x="42" dy="25">• ambiguous patterns → catastrophic backtracking</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Python / Ruby / environments</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.7" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Shell — simple command composition</tspan><tspan x="562" dy="28">Python/Ruby — richer logic and data</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Python: requirements.txt, pip, virtualenv</tspan><tspan x="562" dy="28">Ruby: Gemfile, Bundler, RVM</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Pattern:</tspan><tspan x="562" dy="28">declare deps → isolate → reproduce</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Git как часть администрирования</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15.6" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">working tree → git add → index</tspan><tspan x="1084" dy="28">index → git commit → history</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">Read-only: git status / git diff</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">Git tracks content + executable bit</tspan><tspan x="1084" dy="28">не owner/group/обычные permission bits</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">Secrets в repository запрещены</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный pipeline: interactive command → observable pipeline → validated script → reproducible environment → version control</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Автоматизация должна уменьшать ручной риск, а не скрывать его.</text></svg>