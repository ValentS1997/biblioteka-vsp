<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 7. Сценарии и командная оболочка — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Shell, filters, sh, regex, Python/Ruby, environments и Git как единая automation chain</text><rect x="12" y="100" width="380" height="298" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="380" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Automation mindset</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.8" font-weight="500" fill="#17324d"><tspan x="34" dy="0">Повторяемая работа → кандидат на automation</tspan><tspan x="34" dy="22"></tspan><tspan x="34" dy="22">alias / function</tspan><tspan x="34" dy="22">  ↓</tspan><tspan x="34" dy="22">micro-script</tspan><tspan x="34" dy="22">  ↓</tspan><tspan x="34" dy="22">pipeline</tspan><tspan x="34" dy="22">  ↓</tspan><tspan x="34" dy="22">sh / Python / Ruby</tspan><tspan x="34" dy="22"></tspan><tspan x="34" dy="22">Script фиксирует процедуру как code.</tspan></text><rect x="406" y="100" width="570" height="298" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="406" y="100" width="570" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="424" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Shell dataflow</text><rect x="434" y="160" width="132" height="38" rx="7" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="500" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17324d" text-anchor="middle">STDIN 0</text><line x1="566" y1="179" x2="612" y2="179" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="614" y="160" width="142" height="38" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="685" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17324d" text-anchor="middle">command</text><line x1="756" y1="179" x2="802" y2="179" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="804" y="160" width="142" height="38" rx="7" fill="#eef7ff" stroke="#83acd1" stroke-width="1"/><text x="875" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17324d" text-anchor="middle">STDOUT 1</text><text x="685" y="224" font-family="Arial, sans-serif" font-size="13.3" font-weight="600" fill="#7a254b" text-anchor="middle">STDERR 2 → отдельный diagnostic channel</text><text x="434" y="254" font-family="Consolas, monospace" font-size="13.3" font-weight="500" fill="#17324d"><tspan x="434" dy="0">&gt; overwrite     &gt;&gt; append      2&gt; errors</tspan><tspan x="434" dy="21">| pipeline      &amp;&amp; on success  || on failure</tspan><tspan x="434" dy="21"></tspan><tspan x="434" dy="21">Composition beats monolith:</tspan><tspan x="434" dy="21">cut → sort → uniq → wc</tspan><tspan x="434" dy="21">tail -f → grep --line-buffered</tspan></text><rect x="990" y="100" width="598" height="298" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="990" y="100" width="598" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1008" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">3. Shell script: observe before change</text><rect x="1020" y="170" width="100" height="38" rx="7" fill="#fff0f6" stroke="#d39bb5" stroke-width="1"/><text x="1070" y="194" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#7a254b" text-anchor="middle">find candidates</text><line x1="1120" y1="189" x2="1122" y2="189" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1130" y="170" width="100" height="38" rx="7" fill="#fff0f6" stroke="#d39bb5" stroke-width="1"/><text x="1180" y="194" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#7a254b" text-anchor="middle">filter</text><line x1="1230" y1="189" x2="1232" y2="189" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1240" y="170" width="100" height="38" rx="7" fill="#fff0f6" stroke="#d39bb5" stroke-width="1"/><text x="1290" y="194" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#7a254b" text-anchor="middle">print commands</text><line x1="1340" y1="189" x2="1352" y2="189" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1360" y="170" width="100" height="38" rx="7" fill="#fff0f6" stroke="#d39bb5" stroke-width="1"/><text x="1410" y="194" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#7a254b" text-anchor="middle">verify</text><line x1="1460" y1="189" x2="1462" y2="189" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1470" y="170" width="90" height="38" rx="7" fill="#ffe1e1" stroke="#d39bb5" stroke-width="1"/><text x="1515" y="194" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#7a254b" text-anchor="middle">execute</text><text x="1018" y="244" font-family="Consolas, monospace" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="1018" dy="0">#!/bin/sh</tspan><tspan x="1018" dy="20">chmod +x script   /   sh script</tspan><tspan x="1018" dy="20">source script → current shell state</tspan><tspan x="1018" dy="20"></tspan><tspan x="1018" dy="20">Validation:</tspan><tspan x="1018" dy="20">$# args • file tests • STDERR • exit codes</tspan><tspan x="1018" dy="20"></tspan><tspan x="1018" dy="20">bash -n = parse only</tspan><tspan x="1018" dy="20">bash/sh -x = trace + real execution</tspan></text><rect x="12" y="414" width="505" height="286" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="414" width="505" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Filters и safe filenames</text><text x="34" y="480" font-family="Consolas, monospace" font-size="13.3" font-weight="500" fill="#17324d"><tspan x="34" dy="0">cut    fields/columns</tspan><tspan x="34" dy="20">sort   ordering / -n / -h / -u</tspan><tspan x="34" dy="20">uniq   count/duplicate filtering</tspan><tspan x="34" dy="20">wc     line/word/char counts</tspan><tspan x="34" dy="20">tee    stdout + file</tspan><tspan x="34" dy="20">head   beginning</tspan><tspan x="34" dy="20">tail   end / live follow</tspan><tspan x="34" dy="20">grep   regex filter</tspan><tspan x="34" dy="20"></tspan><tspan x="34" dy="20">Filename with spaces:</tspan><tspan x="34" dy="20">quote it OR use find -print0 | xargs -0</tspan></text><rect x="531" y="414" width="520" height="286" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="531" y="414" width="520" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="549" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">5. Regular expressions</text><text x="555" y="480" font-family="Consolas, monospace" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="555" dy="0">Shell glob ≠ regex</tspan><tspan x="555" dy="20"></tspan><tspan x="555" dy="20">Core syntax:</tspan><tspan x="555" dy="20">. [] () | * + ? {m,n} ^ $</tspan><tspan x="555" dy="20"></tspan><tspan x="555" dy="20">Captures = parenthesized matched text</tspan><tspan x="555" dy="20">Greedy quantifiers expand, then backtrack</tspan><tspan x="555" dy="20">Lazy: *? and +?</tspan><tspan x="555" dy="20"></tspan><tspan x="555" dy="20">Warnings:</tspan><tspan x="555" dy="20">• suspicious .*</tspan><tspan x="555" dy="20">• prefer smaller/hierarchical matches</tspan><tspan x="555" dy="20">• ambiguous groups may backtrack catastrophically</tspan></text><rect x="1065" y="414" width="523" height="286" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1065" y="414" width="523" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1083" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. Python и Ruby</text><text x="1089" y="480" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="1089" dy="0">Python:</tspan><tspan x="1089" dy="20">• indentation = block structure</tspan><tspan x="1089" dy="20">• sys.argv / os.path / re</tspan><tspan x="1089" dy="20">• lists, dicts, files, iteration</tspan><tspan x="1089" dy="20"></tspan><tspan x="1089" dy="20">Ruby:</tspan><tspan x="1089" dy="20">• objects, hashes, blocks</tspan><tspan x="1089" dy="20">• method pipelines</tspan><tspan x="1089" dy="20">• built-in regex notation</tspan><tspan x="1089" dy="20">• ruby -pe / -ane as text filters</tspan><tspan x="1089" dy="20"></tspan><tspan x="1089" dy="20">Chapter: move beyond shell when logic/data grows.</tspan></text><rect x="12" y="716" width="760" height="252" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="12" y="716" width="760" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="30" y="744" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">7. Reproducible language environments</text><rect x="34" y="778" width="338" height="160" rx="8" fill="#f7efff" stroke="#b27bd9" stroke-width="1.2"/><text x="203" y="803" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#552078" text-anchor="middle">Python</text><text x="52" y="830" font-family="Consolas, monospace" font-size="12.9" font-weight="500" fill="#17324d"><tspan x="52" dy="0">pip install / --user</tspan><tspan x="52" dy="20">requirements.txt</tspan><tspan x="52" dy="20">pip freeze</tspan><tspan x="52" dy="20">virtualenv &lt;path&gt;</tspan><tspan x="52" dy="20">source venv/bin/activate</tspan><tspan x="52" dy="20">deactivate</tspan></text><rect x="392" y="778" width="356" height="160" rx="8" fill="#f7efff" stroke="#b27bd9" stroke-width="1.2"/><text x="570" y="803" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#552078" text-anchor="middle">Ruby</text><text x="410" y="830" font-family="Consolas, monospace" font-size="12.9" font-weight="500" fill="#17324d"><tspan x="410" dy="0">gem install</tspan><tspan x="410" dy="20">Gemfile + Gemfile.lock</tspan><tspan x="410" dy="20">Bundler dependency resolution</tspan><tspan x="410" dy="20">bundle install --deployment</tspan><tspan x="410" dy="20">RVM: Ruby versions + gemsets</tspan><tspan x="410" dy="20">rvm install / rvm list</tspan></text><rect x="786" y="716" width="802" height="252" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="786" y="716" width="802" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="804" y="744" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Git: history for operational code</text><rect x="812" y="790" width="154" height="38" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="889" y="814" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#684b00" text-anchor="middle">working tree</text><line x1="966" y1="809" x2="1010" y2="809" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1012" y="790" width="118" height="38" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="1071" y="814" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#684b00" text-anchor="middle">index</text><line x1="1130" y1="809" x2="1174" y2="809" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1176" y="790" width="160" height="38" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="1256" y="814" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#684b00" text-anchor="middle">repository</text><text x="812" y="852" font-family="Consolas, monospace" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="812" dy="0">git status / git diff → inspect</tspan><tspan x="812" dy="20">git add → stage; git commit → history</tspan><tspan x="812" dy="20">.gitignore — tracked ignore policy</tspan><tspan x="812" dy="20"></tspan><tspan x="812" dy="20">Limits: content + executable bit, не owner/group.</tspan><tspan x="812" dy="20">Never store plaintext secrets in repository.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Итог: автоматизируй только понятное действие; проверяй input/output; фиксируй dependencies; храни историю изменений.</text></svg>