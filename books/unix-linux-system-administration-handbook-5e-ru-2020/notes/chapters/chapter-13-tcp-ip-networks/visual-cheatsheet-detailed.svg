<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 13. Сети TCP/IP — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Protocol stack, addressing, routing, DHCP, Linux/FreeBSD, diagnostics, firewall/NAT и cloud networking</text><rect x="12" y="100" width="380" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="380" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Protocol model</text><text x="34" y="166" font-family="Arial, sans-serif" font-size="13.1" font-weight="400" fill="#17324d"><tspan x="34" dy="0">Application</tspan><tspan x="34" dy="19">   ↓</tspan><tspan x="34" dy="19">TCP / UDP</tspan><tspan x="34" dy="19">   ↓</tspan><tspan x="34" dy="19">IP / ICMP</tspan><tspan x="34" dy="19">   ↓</tspan><tspan x="34" dy="19">ARP/ND + link</tspan><tspan x="34" dy="19">   ↓</tspan><tspan x="34" dy="19">physical</tspan><tspan x="34" dy="19"></tspan><tspan x="34" dy="19">Encapsulation adds headers downward;</tspan><tspan x="34" dy="19">receiver removes them upward.</tspan><tspan x="34" dy="19">MTU constrains packet/frame size.</tspan></text><rect x="406" y="100" width="390" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="406" y="100" width="390" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="424" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Addressing</text><text x="430" y="166" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="430" dy="0">MAC → local link</tspan><tspan x="430" dy="19">IP → interface in routed topology</tspan><tspan x="430" dy="19">hostname → name mapping</tspan><tspan x="430" dy="19">port → TCP/UDP endpoint</tspan><tspan x="430" dy="19"></tspan><tspan x="430" dy="19">IPv4:</tspan><tspan x="430" dy="19">prefix/netmask, subnet, CIDR</tspan><tspan x="430" dy="19"></tspan><tspan x="430" dy="19">IPv6:</tspan><tspan x="430" dy="19">16-byte addresses, ND/SLAAC</tspan><tspan x="430" dy="19">separate config from IPv4</tspan><tspan x="430" dy="19"></tspan><tspan x="430" dy="19">ipcalc verifies subnet math.</tspan></text><rect x="810" y="100" width="778" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="810" y="100" width="778" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="828" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Neighbor resolution, routing and DHCP</text><rect x="842" y="174" width="128" height="36" rx="7" fill="#f6edff" stroke="#b881d0" stroke-width="1"/><text x="906" y="197" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#552078" text-anchor="middle">ARP / ND</text><line x1="970" y1="192" x2="1014" y2="192" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1016" y="174" width="150" height="36" rx="7" fill="#f6edff" stroke="#b881d0" stroke-width="1"/><text x="1091" y="197" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#552078" text-anchor="middle">next-hop MAC</text><text x="842" y="236" font-family="Arial, sans-serif" font-size="13.1" font-weight="400" fill="#17324d"><tspan x="842" dy="0">Routing table: destination prefix → gateway/interface</tspan><tspan x="842" dy="21">Selection: longest-prefix match → default → unreachable</tspan><tspan x="842" dy="21"></tspan><tspan x="842" dy="21">DHCP lease can supply:</tspan><tspan x="842" dy="21">IP • mask • gateway • DNS • service addresses</tspan><tspan x="842" dy="21"></tspan><tspan x="842" dy="21">Relay extends centralized DHCP across broadcast domains.</tspan><tspan x="842" dy="21">DHCP naming must be coordinated with DNS.</tspan></text><rect x="12" y="416" width="500" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="500" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Security-sensitive behavior</text><text x="36" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Forwarding</tspan><tspan x="36" dy="20">ICMP redirects</tspan><tspan x="36" dy="20">source routing</tspan><tspan x="36" dy="20">directed broadcast</tspan><tspan x="36" dy="20">IP spoofing / reverse-path validation</tspan><tspan x="36" dy="20">VPN tunnels</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Ordinary host should not forward traffic accidentally.</tspan><tspan x="36" dy="20">Redirect/source-routing control input is not inherently trusted.</tspan><tspan x="36" dy="20">Boundary filtering matters for spoofed addresses.</tspan></text><rect x="526" y="416" width="520" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="526" y="416" width="520" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="544" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">5. Host configuration</text><text x="550" y="484" font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#17324d"><tspan x="550" dy="0">Linux:</tspan><tspan x="550" dy="20">ip link / ip address / ip route</tspan><tspan x="550" dy="20">ethtool → speed/duplex/offload</tspan><tspan x="550" dy="20">sysctl + /proc/sys/net → runtime tunables</tspan><tspan x="550" dy="20"></tspan><tspan x="550" dy="20">FreeBSD:</tspan><tspan x="550" dy="20">ifconfig / route</tspan><tspan x="550" dy="20">/etc/rc.conf → persistent interface/default route</tspan><tspan x="550" dy="20">sysctl → kernel network parameters</tspan><tspan x="550" dy="20"></tspan><tspan x="550" dy="20">Runtime state ≠ persistent boot state.</tspan></text><rect x="1060" y="416" width="528" height="292" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="1060" y="416" width="528" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1078" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">6. Diagnostics / monitoring</text><text x="1084" y="484" font-family="Arial, sans-serif" font-size="12.9" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Layered ladder:</tspan><tspan x="1084" dy="20">interface → address → neighbor → route</tspan><tspan x="1084" dy="20">→ ping → traceroute → packet capture → app</tspan><tspan x="1084" dy="20"></tspan><tspan x="1084" dy="20">tcpdump/Wireshark = actual packet evidence</tspan><tspan x="1084" dy="20">SmokePing = latency/loss history</tspan><tspan x="1084" dy="20">iPerf = active throughput load test</tspan><tspan x="1084" dy="20">Cacti = graphing/long-term observation</tspan><tspan x="1084" dy="20"></tspan><tspan x="1084" dy="20">ping success does not prove service health.</tspan></text><rect x="12" y="724" width="760" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="12" y="724" width="760" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. Firewall and NAT</text><text x="36" y="792" font-family="Arial, sans-serif" font-size="12.9" font-weight="400" fill="#17324d"><tspan x="36" dy="0">iptables:</tspan><tspan x="36" dy="19">filter table → INPUT / OUTPUT / FORWARD</tspan><tspan x="36" dy="19">ordered rules → ACCEPT / DROP / REJECT / LOG</tspan><tspan x="36" dy="19">default-deny example + explicit permits</tspan><tspan x="36" dy="19">state tracking → ESTABLISHED,RELATED</tspan><tspan x="36" dy="19">NAT → separate nat table / POSTROUTING SNAT</tspan><tspan x="36" dy="19"></tspan><tspan x="36" dy="19">Debug: iptables -L -v counters.</tspan><tspan x="36" dy="19">IPFilter: file rules; last match wins unless quick; supports state/NAT.</tspan><tspan x="36" dy="19">Rule order and remote management path are critical.</tspan></text><rect x="786" y="724" width="802" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="786" y="724" width="802" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="804" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Cloud networking</text><text x="810" y="792" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="810" dy="0">AWS VPC:</tspan><tspan x="810" dy="19">CIDR • subnets • route tables • Internet/NAT gateways</tspan><tspan x="810" dy="19">security groups (stateful) • NACL (stateless) • peering/VPN</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">GCP:</tspan><tspan x="810" dy="19">global private network + regional subnets + firewall policy</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">DigitalOcean chapter-era model:</tspan><tspan x="810" dy="19">public/private/IPv6 interfaces; private network not VPC-equivalent</tspan><tspan x="810" dy="19"></tspan><tspan x="810" dy="19">Terraform: version-controlled, repeatable network topology.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.7" font-weight="700" fill="#fff" text-anchor="middle">Итог: verify link/address/neighbor/route/policy in order; apply one controlled change; prove the complete packet path afterward.</text></svg>