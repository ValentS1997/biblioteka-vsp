<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 13. Сети TCP/IP</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Link → address → neighbor → route → transport/service → policy → verification</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Stack / encapsulation</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.1" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Applications</tspan><tspan x="42" dy="23">      ↓</tspan><tspan x="42" dy="23">TCP / UDP</tspan><tspan x="42" dy="23">      ↓</tspan><tspan x="42" dy="23">IP / ICMP</tspan><tspan x="42" dy="23">      ↓</tspan><tspan x="42" dy="23">ARP/ND + link driver</tspan><tspan x="42" dy="23">      ↓</tspan><tspan x="42" dy="23">physical medium</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">Each layer adds/removes its own header.</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Addressing / subnetting</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="562" dy="0">MAC → local link identity</tspan><tspan x="562" dy="25">IP → network interface</tspan><tspan x="562" dy="25">hostname → name mapping</tspan><tspan x="562" dy="25">port → TCP/UDP service</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">IPv4: prefix/netmask + CIDR</tspan><tspan x="562" dy="25">IPv6: separate address family</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Check arithmetic:</tspan><tspan x="562" dy="25">ipcalc &lt;address&gt;/&lt;prefix&gt;</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Neighbor / routing / DHCP</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.1" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">ARP/ND resolves next-hop MAC</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Routing:</tspan><tspan x="1084" dy="25">longest-prefix match</tspan><tspan x="1084" dy="25">specific route → default route → unreachable</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">DHCP leases:</tspan><tspan x="1084" dy="25">IP • mask • gateway • DNS • other options</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Relay enables centralized DHCP across subnets.</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Linux / FreeBSD controls</text><text x="42" y="506" font-family="Consolas, monospace" font-size="15" font-weight="500" fill="#17324d"><tspan x="42" dy="0">Linux:</tspan><tspan x="42" dy="25">ip link / ip address / ip route</tspan><tspan x="42" dy="25">ethtool</tspan><tspan x="42" dy="25">/proc/sys + sysctl</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">FreeBSD:</tspan><tspan x="42" dy="25">ifconfig / route</tspan><tspan x="42" dy="25">/etc/rc.conf</tspan><tspan x="42" dy="25">sysctl</tspan><tspan x="42" dy="25"></tspan><tspan x="42" dy="25">Remote changes require recovery path.</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Troubleshooting / monitoring</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#17324d"><tspan x="562" dy="0">ping → IP-level reachability</tspan><tspan x="562" dy="28">traceroute → routed path</tspan><tspan x="562" dy="28">tcpdump/Wireshark → packet evidence</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">SmokePing → latency/loss history</tspan><tspan x="562" dy="28">iPerf → generated throughput test</tspan><tspan x="562" dy="28">Cacti → graphed metrics</tspan><tspan x="562" dy="28"></tspan><tspan x="562" dy="28">Successful ping ≠ healthy application.</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Firewall / NAT / cloud</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">iptables:</tspan><tspan x="1084" dy="26">ordered chains + default policy + state</tspan><tspan x="1084" dy="26">NAT is separate from filtering</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">IPFilter:</tspan><tspan x="1084" dy="26">file rules + quick + state</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Cloud:</tspan><tspan x="1084" dy="26">VPC/subnet/route/policy stay networking primitives</tspan><tspan x="1084" dy="26">Terraform makes network state reproducible.</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: локализуй слой до изменения; routing/firewall/interface state не меняй вслепую через единственный SSH-сеанс.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Acceptance = expected packet path verified end-to-end, not merely one successful command.</text></svg>