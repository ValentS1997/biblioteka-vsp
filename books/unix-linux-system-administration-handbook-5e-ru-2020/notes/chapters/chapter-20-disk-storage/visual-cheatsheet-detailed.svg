<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#26384d"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 20. Дисковая память — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Discovery • GPT • LVM • RAID • filesystems • swap • ZFS • Btrfs • backup</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. Device discovery</text>
<text x="36" y="164" font-family="Consolas, monospace" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">lsblk</tspan>
<tspan x="36" dy="19">lsblk -o +MODEL,SERIAL</tspan>
<tspan x="36" dy="19">geom disk list</tspan>
<tspan x="36" dy="19">hdparm -I / camcontrol devlist</tspan>
<tspan x="36" dy="24">Confirm model + serial + size.</tspan>
<tspan x="36" dy="19">Do not persist transient /dev names.</tspan>
<tspan x="36" dy="19">Prefer LABEL/UUID/PARTLABEL.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Partition / filesystem</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="430" dy="0">GPT preferred over MBR in chapter guidance.</tspan>
<tspan x="430" dy="19">Linux: fdisk → mkfs → mount.</tspan>
<tspan x="430" dy="19">FreeBSD: gpart → newfs → mount.</tspan>
<tspan x="430" dy="24">fstab should use stable identity.</tspan>
<tspan x="430" dy="19">mount/df verify upper layer.</tspan>
<tspan x="430" dy="24">Partition/mkfs can destroy old data.</tspan>
<tspan x="430" dy="19">Rollback may not exist.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. LVM2</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="824" dy="0">PV → VG → LV → filesystem</tspan>
<tspan x="824" dy="19">pvcreate • vgcreate • lvcreate</tspan>
<tspan x="824" dy="19">vgdisplay / lvdisplay → verify</tspan>
<tspan x="824" dy="24">Grow: LV first, filesystem second.</tspan>
<tspan x="824" dy="19">Shrink: filesystem first.</tspan>
<tspan x="824" dy="24">Snapshots reserve fixed COW space.</tspan>
<tspan x="824" dy="19">Exhausted snapshot space → invalid snapshot.</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. RAID / mdadm</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="1218" dy="0">RAID0: performance, no redundancy</tspan>
<tspan x="1218" dy="19">RAID1: mirror • RAID5/6: parity</tspan>
<tspan x="1218" dy="24">mdadm --create → /proc/mdstat</tspan>
<tspan x="1218" dy="19">-f fail • -r remove • -a add/rebuild</tspan>
<tspan x="1218" dy="24">Monitor degraded arrays.</tspan>
<tspan x="1218" dy="19">Rebuild may run for hours/days.</tspan>
<tspan x="1218" dy="24">RAID ≠ backup.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Traditional FS / swap</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="36" dy="0">UFS • ext4 • XFS</tspan>
<tspan x="36" dy="19">journaling → fast consistency recovery</tspan>
<tspan x="36" dy="19">fsck → check/repair metadata</tspan>
<tspan x="36" dy="19">mount/umount/fstab → namespace</tspan>
<tspan x="36" dy="24">resize2fs / xfs_growfs / growfs</tspan>
<tspan x="36" dy="24">mkswap → swapon → swapon -s</tspan>
<tspan x="36" dy="24">Use stable labels/UUID in fstab.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. ZFS</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="550" dy="0">zpool → vdevs → datasets/zvols</tspan>
<tspan x="550" dy="19">COW + checksums + integrated RAID</tspan>
<tspan x="550" dy="19">zpool list/status → pool health</tspan>
<tspan x="550" dy="19">zfs set/get → hierarchical properties</tspan>
<tspan x="550" dy="24">snapshot = read-only point in time</tspan>
<tspan x="550" dy="19">clone = writable branch</tspan>
<tspan x="550" dy="24">destroy/rollback have destructive boundaries.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Btrfs</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="1064" dy="0">mkfs.btrfs → mount → filesystem usage</tspan>
<tspan x="1064" dy="19">device add → new device enters pool</tspan>
<tspan x="1064" dy="19">balance → relocate chunks</tspan>
<tspan x="1064" dy="19">balance can convert RAID profiles online</tspan>
<tspan x="1064" dy="24">subvolume → snapshot</tspan>
<tspan x="1064" dy="19">snapshot writable by default</tspan>
<tspan x="1064" dy="24">-r creates read-only snapshot.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Monitoring / destructive boundary</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="36" dy="0">SMART: smartd monitors, smartctl queries.</tspan>
<tspan x="36" dy="19">Monitor trends; SMART is not certainty.</tspan>
<tspan x="36" dy="24">Irreversible/high-impact:</tspan>
<tspan x="36" dy="19">secure erase • mkfs • partition rewrite • pool destroy</tspan>
<tspan x="36" dy="19">RAID creation/rebuild • Btrfs balance/conversion</tspan>
<tspan x="36" dy="24">Before change: identify exact device + verify backup boundary.</tspan>
<tspan x="36" dy="19">After change: verify lower layer, then upper layer.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Backup strategy</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="808" dy="0">RAID/replication handles hardware failure, not all data loss.</tspan>
<tspan x="808" dy="19">Compromise/malware can replicate corrupted data.</tspan>
<tspan x="808" dy="24">Plan: scope • location • encryption • retention • cost</tspan>
<tspan x="808" dy="19">People: access • key ownership • verification responsibility</tspan>
<tspan x="808" dy="19">Protection: backups must resist deletion/modification.</tspan>
<tspan x="808" dy="24">Acceptance: periodic restore test.</tspan>
<tspan x="808" dy="19">Unverified restore = unverified backup.</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#26384d"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core: identify the storage object before touching it; change one layer; verify it before moving upward.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Redundancy, snapshots and checksums improve resilience; only independent tested backups complete the recovery strategy.</text>
</svg>