<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 4. Управление процессами — визуальная шпаргалка</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">UNIX и Linux: руководство системного администратора, 5-е издание</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Что такое процесс</text><text x="42" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d"><tspan x="42" dy="0">• Address space + kernel metadata</tspan><tspan x="42" dy="31">• PID / PPID — identity и ancestry</tspan><tspan x="42" dy="31">• UID/EUID, GID/EGID — права процесса</tspan><tspan x="42" dy="31">• State + priority + controlling terminal</tspan><tspan x="42" dy="31">• Open files / ports / signal mask</tspan><tspan x="42" dy="31">• Threads делят address space процесса</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Жизненный цикл</text><rect x="590" y="178" width="180" height="44" rx="8" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.2"/><text x="680" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">parent</text><line x1="770" y1="200" x2="812" y2="200" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="814" y="178" width="180" height="44" rx="8" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.2"/><text x="904" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">fork / clone</text><line x1="904" y1="222" x2="904" y2="250" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="814" y="252" width="180" height="44" rx="8" fill="#e6f8ec" stroke="#53aa72" stroke-width="1.2"/><text x="904" y="279" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">exec</text><line x1="814" y1="274" x2="772" y2="274" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="252" width="180" height="44" rx="8" fill="#e6f8ec" stroke="#53aa72" stroke-width="1.2"/><text x="680" y="279" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">new program</text><line x1="680" y1="296" x2="680" y2="326" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="328" width="180" height="44" rx="8" fill="#fff2cf" stroke="#d4a42c" stroke-width="1.2"/><text x="680" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d" text-anchor="middle">_exit → wait</text><text x="800" y="326" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="800" dy="0">orphan → PID 1</tspan><tspan x="800" dy="23">adopts + wait</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Signals: сначала graceful</text><rect x="1084" y="178" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1094" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">TERM</text><text x="1156" y="203" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">cleanup + exit</text><rect x="1322" y="178" width="220" height="38" rx="7" fill="#ffe1e1" stroke="#d86666" stroke-width="1"/><text x="1332" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">KILL</text><text x="1394" y="203" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">force; uncatchable</text><rect x="1084" y="228" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1094" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">STOP/CONT</text><text x="1156" y="253" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">pause / resume</text><rect x="1322" y="228" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1332" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">INT</text><text x="1394" y="253" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">Ctrl+C</text><rect x="1084" y="278" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1094" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">TSTP</text><text x="1156" y="303" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">Ctrl+Z request</text><rect x="1322" y="278" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1332" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">HUP</text><text x="1394" y="303" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">hangup / daemon reload</text><rect x="1084" y="328" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1094" y="353" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">QUIT</text><text x="1156" y="353" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">terminate + core</text><rect x="1322" y="328" width="220" height="38" rx="7" fill="#f8f1fb" stroke="#c7a9d4" stroke-width="1"/><text x="1332" y="353" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">USR1/2</text><text x="1394" y="353" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d" text-anchor="start">app-defined</text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Инструменты наблюдения</text><text x="42" y="510" font-family="Consolas, monospace" font-size="16.5" font-weight="500" fill="#17324d"><tspan x="42" dy="0">ps aux      — snapshot, CPU/RAM/state</tspan><tspan x="42" dy="32">ps lax      — PPID, NI, WCHAN</tspan><tspan x="42" dy="32">top         — continuous system view</tspan><tspan x="42" dy="32">uptime      — load averages</tspan><tspan x="42" dy="32">/proc/PID   — direct kernel/process data</tspan><tspan x="42" dy="32">strace/truss — syscalls, signals, errors</tspan><tspan x="42" dy="32">df -h / du -h — runaway disk usage</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Runaway process: evidence-first</text><circle cx="574" cy="504" r="14" fill="#6f65c7"/><text x="574" y="509" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="602" y="509" font-family="Arial, sans-serif" font-size="15.5" font-weight="500" fill="#17324d" text-anchor="start">ps/top/uptime</text><circle cx="574" cy="543" r="14" fill="#6f65c7"/><text x="574" y="548" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="602" y="548" font-family="Arial, sans-serif" font-size="15.5" font-weight="500" fill="#17324d" text-anchor="start">CPU / RAM / disk?</text><circle cx="574" cy="582" r="14" fill="#6f65c7"/><text x="574" y="587" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="602" y="587" font-family="Arial, sans-serif" font-size="15.5" font-weight="500" fill="#17324d" text-anchor="start">/proc + logs</text><circle cx="574" cy="621" r="14" fill="#6f65c7"/><text x="574" y="626" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="602" y="626" font-family="Arial, sans-serif" font-size="15.5" font-weight="500" fill="#17324d" text-anchor="start">strace/truss if needed</text><circle cx="574" cy="660" r="14" fill="#6f65c7"/><text x="574" y="665" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="602" y="665" font-family="Arial, sans-serif" font-size="15.5" font-weight="500" fill="#17324d" text-anchor="start">confirm root cause</text><circle cx="574" cy="699" r="14" fill="#6f65c7"/><text x="574" y="704" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="602" y="704" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#9c1651" text-anchor="start">renice / TERM / KILL</text><text x="790" y="736" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9c1651" text-anchor="middle">Не убивайте процесс до сбора evidence.</text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Периодические задачи</text><text x="1084" y="508" font-family="Arial, sans-serif" font-size="15.8" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">cron:</tspan><tspan x="1084" dy="25">• crontab -e / -l; полный PATH</tspan><tspan x="1084" dy="25">• sh без login environment</tspan><tspan x="1084" dy="25">• cron.allow / cron.deny</tspan><tspan x="1084" dy="25">• избегать синхронного запуска на сотнях hosts</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">systemd:</tspan><tspan x="1084" dy="25">• .timer = schedule, .service = action</tspan><tspan x="1084" dy="25">• list-timers / enable / start</tspan><tspan x="1084" dy="25">• systemd-run = transient timer</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Главный workflow: identify → inspect → trace → confirm → change → verify</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Управление процессами начинается с наблюдаемости; kill и priority changes — только после понимания состояния.</text></svg>