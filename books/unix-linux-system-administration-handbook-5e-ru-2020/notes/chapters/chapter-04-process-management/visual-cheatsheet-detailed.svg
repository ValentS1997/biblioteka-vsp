<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Глава 4. Управление процессами — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">От process anatomy до signals, tracing, runaway diagnostics и schedulers</text><rect x="12" y="100" width="390" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="390" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Анатомия процесса</text><text x="34" y="168" font-family="Consolas, monospace" font-size="13.8" font-weight="500" fill="#17324d"><tspan x="34" dy="0">PID       unique process ID</tspan><tspan x="34" dy="24">PPID      parent process</tspan><tspan x="34" dy="24">UID/EUID  identity / effective access</tspan><tspan x="34" dy="24">GID/EGID  group identity</tspan><tspan x="34" dy="24">STAT      running / sleep / stop / zombie</tspan><tspan x="34" dy="24">NI        nice factor / CPU priority</tspan><tspan x="34" dy="24">TTY       controlling terminal</tspan><tspan x="34" dy="24">fd/maps   files + memory mappings</tspan><tspan x="34" dy="24">threads   execution contexts</tspan></text><rect x="416" y="100" width="570" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="416" y="100" width="570" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="434" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Lifecycle + signals</text><rect x="442" y="158" width="104" height="38" rx="7" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1"/><text x="494" y="182" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">parent</text><line x1="546" y1="177" x2="584" y2="177" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="586" y="158" width="110" height="38" rx="7" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1"/><text x="641" y="182" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">fork</text><line x1="696" y1="177" x2="734" y2="177" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="736" y="158" width="110" height="38" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="791" y="182" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">exec</text><line x1="846" y1="177" x2="884" y2="177" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="886" y="158" width="76" height="38" rx="7" fill="#fff2cf" stroke="#d4a42c" stroke-width="1"/><text x="924" y="182" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">exit</text><text x="448" y="224" font-family="Arial, sans-serif" font-size="13.6" font-weight="500" fill="#17324d" text-anchor="start">Parent calls wait; orphan is adopted by PID 1.</text><text x="446" y="246" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">TERM</text><text x="555" y="246" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">graceful request</text><text x="446" y="270" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">KILL</text><text x="555" y="270" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">force; cannot catch/block</text><text x="446" y="294" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">STOP / CONT</text><text x="555" y="294" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">pause / resume</text><text x="446" y="318" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">INT / TSTP</text><text x="555" y="318" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">terminal Ctrl+C / Ctrl+Z</text><text x="446" y="342" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">HUP</text><text x="555" y="342" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">hangup; often daemon reload</text><text x="446" y="366" font-family="Consolas, monospace" font-size="13.4" font-weight="700" fill="#7d2850" text-anchor="start">QUIT</text><text x="555" y="366" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d" text-anchor="start">terminate; default core dump</text><rect x="1000" y="100" width="588" height="300" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="1000" y="100" width="588" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="1018" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">3. Лестница наблюдаемости</text><rect x="1024" y="158" width="168" height="30" rx="6" fill="#eef7ff" stroke="#b7b078" stroke-width="1"/><text x="1108" y="178" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">ps aux</text><text x="1210" y="178" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">snapshot: PID/CPU/RAM/state</text><rect x="1024" y="197" width="168" height="30" rx="6" fill="#eef7ff" stroke="#b7b078" stroke-width="1"/><text x="1108" y="217" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">ps lax</text><text x="1210" y="217" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">PPID/NI/WCHAN</text><rect x="1024" y="236" width="168" height="30" rx="6" fill="#eef7ff" stroke="#b7b078" stroke-width="1"/><text x="1108" y="256" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">top + uptime</text><text x="1210" y="256" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">dynamic load/resources</text><rect x="1024" y="275" width="168" height="30" rx="6" fill="#fff8df" stroke="#b7b078" stroke-width="1"/><text x="1108" y="295" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">/proc/&lt;PID&gt;</text><text x="1210" y="295" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">raw process/kernel state</text><rect x="1024" y="314" width="168" height="30" rx="6" fill="#fff8df" stroke="#b7b078" stroke-width="1"/><text x="1108" y="334" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">strace / truss</text><text x="1210" y="334" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">syscalls + signals + errors</text><rect x="1024" y="353" width="168" height="30" rx="6" fill="#fff8df" stroke="#b7b078" stroke-width="1"/><text x="1108" y="373" font-family="Consolas, monospace" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">fuser / lsof</text><text x="1210" y="373" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d" text-anchor="start">open-file ownership</text><rect x="12" y="416" width="630" height="292" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="416" width="630" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">4. Runaway process: локализовать ресурс</text><rect x="30" y="468" width="190" height="28" rx="0" fill="#ffe7f1" stroke="#d3a1b7" stroke-width="1"/><text x="36" y="487" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Симптом</text><rect x="220" y="468" width="190" height="28" rx="0" fill="#ffe7f1" stroke="#d3a1b7" stroke-width="1"/><text x="226" y="487" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Проверить</text><rect x="410" y="468" width="210" height="28" rx="0" fill="#ffe7f1" stroke="#d3a1b7" stroke-width="1"/><text x="416" y="487" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Следующий шаг</text><rect x="30" y="496" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="518" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">High load / CPU</text><rect x="220" y="496" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="518" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">uptime, top, ps</text><rect x="410" y="496" width="210" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="518" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">подтвердить CPU-bound</text><rect x="30" y="530" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="552" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">Memory growth</text><rect x="220" y="530" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="552" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">top: VIRT/RES/DATA</text><rect x="410" y="530" width="210" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="552" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">смотреть рост во времени</text><rect x="30" y="564" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="586" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">Filesystem full</text><rect x="220" y="564" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="586" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">df -h → du -h</text><rect x="410" y="564" width="210" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="586" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">найти large subtree</text><rect x="30" y="598" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="620" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">df ≠ du</text><rect x="220" y="598" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="620" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">fuser / lsof</text><rect x="410" y="598" width="210" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="620" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">open deleted file?</text><rect x="30" y="632" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="654" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">Unknown behavior</text><rect x="220" y="632" width="190" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="654" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">/proc + logs</text><rect x="410" y="632" width="210" height="34" rx="0" fill="#fff0f6" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="654" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">затем strace/truss</text><rect x="30" y="666" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="36" y="688" font-family="Arial, sans-serif" font-size="12.1" font-weight="700" fill="#17324d" text-anchor="start">D state</text><rect x="220" y="666" width="190" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="226" y="688" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">underlying I/O/NFS</text><rect x="410" y="666" width="210" height="34" rx="0" fill="#fffafc" stroke="#e4c4d1" stroke-width="0.8"/><text x="416" y="688" font-family="Arial, sans-serif" font-size="12.1" font-weight="400" fill="#17324d" text-anchor="start">fix root cause / reboot</text><rect x="656" y="416" width="440" height="292" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="656" y="416" width="440" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="674" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">5. Priority и tracing</text><text x="680" y="482" font-family="Consolas, monospace" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="680" dy="0">nice -n 5 /bin/longtask</tspan><tspan x="680" dy="20">sudo renice -5 &lt;PID&gt;</tspan><tspan x="680" dy="20">sudo renice 5 -u &lt;user&gt;</tspan><tspan x="680" dy="20"></tspan><tspan x="680" dy="20">Higher nice → lower CPU priority.</tspan><tspan x="680" dy="20">Nice не управляет memory/I/O.</tspan><tspan x="680" dy="20"></tspan><tspan x="680" dy="20">strace -f      — follow children</tspan><tspan x="680" dy="20">strace -e trace=file</tspan><tspan x="680" dy="20">truss &lt;command&gt; — FreeBSD</tspan><tspan x="680" dy="20"></tspan><tspan x="680" dy="20">Tracing обычно observational,</tspan><tspan x="680" dy="20">но может прерывать syscalls.</tspan></text><rect x="1110" y="416" width="478" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1110" y="416" width="478" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1128" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. /proc: что читать</text><text x="1134" y="482" font-family="Consolas, monospace" font-size="12.8" font-weight="500" fill="#17324d"><tspan x="1134" dy="0">/proc/PID/cmdline   command args</tspan><tspan x="1134" dy="20">/proc/PID/cwd       current dir</tspan><tspan x="1134" dy="20">/proc/PID/environ   environment</tspan><tspan x="1134" dy="20">/proc/PID/exe       executable link</tspan><tspan x="1134" dy="20">/proc/PID/fd/       open descriptors</tspan><tspan x="1134" dy="20">/proc/PID/maps      memory mappings</tspan><tspan x="1134" dy="20">/proc/PID/ns/       namespaces</tspan><tspan x="1134" dy="20">/proc/PID/stat      process state</tspan><tspan x="1134" dy="20">/proc/PID/statm     memory usage</tspan><tspan x="1134" dy="20"></tspan><tspan x="1134" dy="20">cmdline/environ: NUL-separated → tr</tspan></text><rect x="12" y="724" width="980" height="244" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="724" width="980" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">7. Scheduled work: cron vs systemd timers</text><rect x="34" y="780" width="448" height="164" rx="9" fill="#fffaf2" stroke="#e1b53b" stroke-width="1.2"/><text x="258" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#684b00" text-anchor="middle">cron / crontab</text><text x="52" y="833" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="52" dy="0">minute hour day month weekday command</tspan><tspan x="52" dy="20">crontab -e / -l / -r</tspan><tspan x="52" dy="20">sh, но не login shell → PATH/env задавать явно</tspan><tspan x="52" dy="20">не редактировать spool напрямую</tspan><tspan x="52" dy="20">cron.allow / cron.deny</tspan><tspan x="52" dy="20">разнести heavy jobs по времени</tspan></text><rect x="504" y="780" width="466" height="164" rx="9" fill="#f5fff7" stroke="#58b879" stroke-width="1.2"/><text x="737" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#145d2d" text-anchor="middle">systemd timer</text><text x="522" y="833" font-family="Arial, sans-serif" font-size="12.7" font-weight="400" fill="#17324d"><tspan x="522" dy="0">.timer = schedule; .service = action</tspan><tspan x="522" dy="20">OnBootSec / OnCalendar / OnUnitActiveSec</tspan><tspan x="522" dy="20">AccuracySec распределяет activation window</tspan><tspan x="522" dy="20">systemctl list-timers / enable / start</tspan><tspan x="522" dy="20">systemd-run — transient timer</tspan><tspan x="522" dy="20">transient units исчезают после reboot</tspan></text><rect x="1006" y="724" width="582" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="1006" y="724" width="582" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="1024" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Правила, которые стоит запомнить</text><text x="1030" y="792" font-family="Arial, sans-serif" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="1030" dy="0">1. Сначала evidence — потом kill.</tspan><tspan x="1030" dy="22">2. TERM предпочтительнее KILL.</tspan><tspan x="1030" dy="22">3. D-state требует устранения I/O root cause.</tspan><tspan x="1030" dy="22">4. ps = snapshot; top = dynamics.</tspan><tspan x="1030" dy="22">5. /proc и tracing — следующий уровень детализации.</tspan><tspan x="1030" dy="22">6. nice влияет на CPU, не на RAM/I/O.</tspan><tspan x="1030" dy="22">7. Cron job должна работать вне интерактивного env.</tspan><tspan x="1030" dy="22">8. Timer/service легче тестировать раздельно.</tspan></text><rect x="12" y="986" width="1576" height="52" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1018" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Итог: процесс — наблюдаемый объект. Идентифицируйте → измерьте → трассируйте → вмешивайтесь минимально → проверяйте результат.</text></svg>