<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="16" y="16" width="1568" height="72" rx="16" fill="#173e5c"/>
  <text x="44" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff"><tspan x="44" dy="0">Глава 2. Загрузка и системные демоны — визуальная шпаргалка</tspan></text>
  <text x="44" y="77" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d8ebf7"><tspan x="44" dy="0">UNIX и Linux: руководство системного администратора, 5-е издание</tspan></text>
  <g filter="url(#shadow)"><rect x="20" y="108" width="500" height="338" rx="18" fill="#f8fbff" stroke="#64aaf5" stroke-width="2"/><rect x="20" y="108" width="500" height="52" rx="18" fill="#cfe8ff"/><rect x="20" y="142" width="500" height="18" fill="#cfe8ff"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Цепочка загрузки</tspan></text><text x="38" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">Firmware / UEFI</tspan></text><text x="38" y="226" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">↓ Bootloader: GRUB / loader</tspan></text><text x="38" y="260" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">↓ Kernel + root filesystem</tspan></text><text x="38" y="294" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">↓ PID 1: systemd / init / rc</tspan></text><text x="38" y="328" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="38" dy="0">↓ Targets / services</tspan></text><rect x="540" y="108" width="500" height="338" rx="18" fill="#f6fff8" stroke="#63c98f" stroke-width="2"/><rect x="540" y="108" width="500" height="52" rx="18" fill="#ccefd9"/><rect x="540" y="142" width="500" height="18" fill="#ccefd9"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Read-only диагностика</tspan></text><text x="564" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="564" dy="0">• efibootmgr -v — UEFI BootOrder</tspan><tspan x="564" dy="26">• systemctl status -l &lt;unit&gt;</tspan><tspan x="564" dy="26">• systemctl get-default</tspan><tspan x="564" dy="26">• journalctl -b -1</tspan><tspan x="564" dy="26">• journalctl -u &lt;unit&gt;</tspan><tspan x="564" dy="26">• fdisk -l / gpart show / camcontrol devlist</tspan></text><rect x="1060" y="108" width="520" height="338" rx="18" fill="#fffaf2" stroke="#efb44c" stroke-width="2"/><rect x="1060" y="108" width="520" height="52" rx="18" fill="#ffe3a9"/><rect x="1060" y="142" width="520" height="18" fill="#ffe3a9"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">systemd: что важно понимать</tspan></text><text x="1084" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Unit — управляемый объект</tspan><tspan x="1084" dy="26">• Target — режим работы</tspan><tspan x="1084" dy="26">• Wants/Requires — зависимости</tspan><tspan x="1084" dy="26">• Before/After — порядок, это отдельная логика</tspan><tspan x="1084" dy="26">• Vendor units не редактировать напрямую</tspan><tspan x="1084" dy="26">• Local overrides — /etc/systemd/system</tspan></text><rect x="20" y="468" width="500" height="350" rx="18" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="20" y="468" width="500" height="52" rx="18" fill="#ffd1e5"/><rect x="20" y="502" width="500" height="18" fill="#ffd1e5"/><text x="38" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Controlled change</tspan></text><text x="44" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• systemctl start/stop/restart</tspan><tspan x="44" dy="26">• systemctl enable/disable</tspan><tspan x="44" dy="26">• systemctl isolate &lt;target&gt;</tspan><tspan x="44" dy="26">• systemctl set-default &lt;target&gt;</tspan><tspan x="44" dy="26">• systemctl edit &lt;unit&gt;</tspan><tspan x="44" dy="26">• daemon-reload после изменения unit files</tspan></text><rect x="540" y="468" width="500" height="350" rx="18" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="468" width="500" height="52" rx="18" fill="#ddd8ff"/><rect x="540" y="502" width="500" height="18" fill="#ddd8ff"/><text x="558" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Recovery path</tspan></text><text x="564" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="564" dy="0">• Попробовать previous kernel</tspan><tspan x="564" dy="26">• single / rescue.target / emergency.target</tspan><tspan x="564" dy="26">• Root RO → remount RW при необходимости</tspan><tspan x="564" dy="26">• fsck — только осознанно</tspan><tspan x="564" dy="26">• Cloud: known-good snapshot / recovery instance</tspan><tspan x="564" dy="26">• После ремонта проверить реальный reboot</tspan></text><rect x="1060" y="468" width="520" height="350" rx="18" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="468" width="520" height="52" rx="18" fill="#d2f1dc"/><rect x="1060" y="502" width="520" height="18" fill="#d2f1dc"/><text x="1078" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">Высокий риск</tspan></text><text x="1084" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Изменение UEFI BootOrder</tspan><tspan x="1084" dy="26">• Перегенерация GRUB</tspan><tspan x="1084" dy="26">• dd в EFI System Partition</tspan><tspan x="1084" dy="26">• fsck с исправлением filesystem</tspan><tspan x="1084" dy="26">• isolate target может остановить units</tspan><tspan x="1084" dy="26">• Terminate в облаке ≠ reboot; возможна потеря root storage</tspan></text></g>
  <rect x="16" y="844" width="1568" height="40" rx="12" fill="#173e5c"/>
  <text x="36" y="871" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff"><tspan x="36" dy="0">Принцип: локализуйте слой сбоя до изменения. Firmware → bootloader → kernel → PID 1 → services.</tspan></text>
</svg>