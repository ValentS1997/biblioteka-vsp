<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Глава 8. Управление учетными записями пользователей — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">UID/passwd/shadow/groups, provisioning, offboarding, PAM и centralized identity</text><rect x="12" y="100" width="500" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="500" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Account record / UID</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="34" dy="0">UID = system identity; login name = human-readable mapping</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">/etc/passwd fields:</tspan><tspan x="34" dy="21">login | placeholder | UID | GID | GECOS | home | shell</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Consistency rules:</tspan><tspan x="34" dy="21">• same UID → same person across relevant hosts</tspan><tspan x="34" dy="21">• do not reuse UID after account deletion</tspan><tspan x="34" dy="21">• central directory helps avoid collisions</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Directory services may extend/replace local source.</tspan></text><rect x="526" y="100" width="520" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="526" y="100" width="520" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="544" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Credentials / password aging</text><text x="550" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="550" dy="0">Linux: /etc/shadow</tspan><tspan x="550" dy="21">FreeBSD: /etc/master.passwd</tspan><tspan x="550" dy="21"></tspan><tspan x="550" dy="21">Shadow lifecycle fields:</tspan><tspan x="550" dy="21">last change • min age • max age • warning</tspan><tspan x="550" dy="21">inactive/grace • account expiry</tspan><tspan x="550" dy="21"></tspan><tspan x="550" dy="21">Policy change does not rehash existing credentials.</tspan><tspan x="550" dy="21">chage -d 0 &lt;user&gt; → require password change</tspan><tspan x="550" dy="21"></tspan><tspan x="550" dy="21">passwd + shadow must remain synchronized.</tspan></text><rect x="1060" y="100" width="528" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="100" width="528" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Groups / authorization context</text><text x="1084" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">/etc/group:</tspan><tspan x="1084" dy="21">name | password | GID | member list</tspan><tspan x="1084" dy="21"></tspan><tspan x="1084" dy="21">Primary group → default group context</tspan><tspan x="1084" dy="21">Supplementary groups → extra access</tspan><tspan x="1084" dy="21">Personal group → safer restrictive default</tspan><tspan x="1084" dy="21">Shared/project groups → deliberate collaboration</tspan><tspan x="1084" dy="21"></tspan><tspan x="1084" dy="21">FreeBSD:</tspan><tspan x="1084" dy="21">pw groupmod ...</tspan><tspan x="1084" dy="21">pw groupshow ...</tspan></text><rect x="12" y="416" width="710" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="710" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Provisioning: create → configure → verify</text><rect x="38" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="84" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">Authorize</text><line x1="130" y1="504" x2="138" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="191" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">UID/GID</text><line x1="237" y1="504" x2="245" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="252" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="298" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">Account</text><line x1="344" y1="504" x2="352" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="359" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="405" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">Credential</text><line x1="451" y1="504" x2="459" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="466" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="512" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">Home</text><line x1="558" y1="504" x2="566" y2="504" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="573" y="486" width="92" height="36" rx="7" fill="#fff8df" stroke="#d1a936" stroke-width="1"/><text x="619" y="509" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#684b00" text-anchor="middle">Roles</text><text x="36" y="554" font-family="Arial, sans-serif" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="36" dy="0">Manual-safe tools: vipw / vipw -s / vigr / vigr -s</tspan><tspan x="36" dy="22">High-level tools: useradd / adduser / pw / newusers</tspan><tspan x="36" dy="22"></tspan><tspan x="36" dy="22">Home flow: startup files → chown → login as user → pwd + ls -la</tspan><tspan x="36" dy="22"></tspan><tspan x="36" dy="22">Risk: chown -R user:group ~user/.* may include .. and touch parent directory.</tspan></text><rect x="736" y="416" width="852" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="736" y="416" width="852" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="754" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">5. Operational command map</text><text x="760" y="484" font-family="Consolas, monospace" font-size="12.8" font-weight="500" fill="#17324d"><tspan x="760" dy="0">READ / VERIFY</tspan><tspan x="760" dy="19">useradd -D</tspan><tspan x="760" dy="19">pw groupshow staff</tspan><tspan x="760" dy="19">pwd</tspan><tspan x="760" dy="19">ls -la</tspan><tspan x="760" dy="19">find &lt;filesystem&gt; -xdev -nouser</tspan><tspan x="760" dy="19"></tspan><tspan x="760" dy="19">CHANGE</tspan><tspan x="760" dy="19">passwd &lt;user&gt;</tspan><tspan x="760" dy="19">useradd / adduser / newusers</tspan><tspan x="760" dy="19">pw groupmod / usermod -L|-U / pw lock</tspan><tspan x="760" dy="19">chown -R &lt;user&gt;:&lt;group&gt; ~&lt;user&gt;</tspan><tspan x="760" dy="19"></tspan><tspan x="760" dy="19">Bulk newusers input contains initial plaintext password → protect the file.</tspan></text><rect x="12" y="724" width="760" height="244" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="724" width="760" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">6. Safe disable / offboarding</text><text x="36" y="792" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Temporary suspension: password lock first if appropriate.</tspan><tspan x="36" dy="21">BUT: password lock may not block non-password access paths.</tspan><tspan x="36" dy="21"></tspan><tspan x="36" dy="21">Offboarding scope:</tspan><tspan x="36" dy="21">identity DB • mail aliases • cron/at/print jobs • processes</tspan><tspan x="36" dy="21">groups • home/mail • shared data • external services</tspan><tspan x="36" dy="21"></tspan><tspan x="36" dy="21">Preserve potentially needed data before destructive removal.</tspan><tspan x="36" dy="21">After removal: find -xdev -nouser → inspect orphaned ownership.</tspan></text><rect x="786" y="724" width="802" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="786" y="724" width="802" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="804" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. PAM + centralized identity</text><text x="810" y="792" font-family="Arial, sans-serif" font-size="13.1" font-weight="400" fill="#17324d"><tspan x="810" dy="0">PAM: common authentication-policy layer for login/sudo/passwd/su.</tspan><tspan x="810" dy="20">Local defaults may be overridden by PAM configuration.</tspan><tspan x="810" dy="20"></tspan><tspan x="810" dy="20">LDAP: centralized hierarchical identity repository; UID/GID consistency.</tspan><tspan x="810" dy="20">Active Directory: LDAP + Kerberos in mixed environments.</tspan><tspan x="810" dy="20">SSO: easier credential use, but larger compromise blast radius and critical auth dependency.</tspan><tspan x="810" dy="20">IAM: provisioning/deprovisioning + RBAC + admin audit + HR synchronization.</tspan><tspan x="810" dy="20"></tspan><tspan x="810" dy="20">Target state: unique identity + rapid propagation + traceable changes.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.7" font-weight="700" fill="#fff" text-anchor="middle">Итог: account lifecycle должен оставаться согласованным между UID/GID, credentials, groups, home ownership и centralized identity systems.</text></svg>