<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Глава 8. Управление учетными записями пользователей</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Identity → credentials → groups/home → verification → disable/offboard → centralization</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Identity model</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.7" font-weight="400" fill="#17324d"><tspan x="42" dy="0">UID — базовая системная identity</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">/etc/passwd:</tspan><tspan x="42" dy="26">login : placeholder : UID : GID : GECOS : home : shell</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">Критично:</tspan><tspan x="42" dy="26">• unique login</tspan><tspan x="42" dy="26">• organization-wide UID consistency</tspan><tspan x="42" dy="26">• UID не переиспользовать после offboarding</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Credentials и shadow</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Linux: /etc/shadow</tspan><tspan x="562" dy="25">FreeBSD: /etc/master.passwd</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Shadow хранит:</tspan><tspan x="562" dy="25">• hash</tspan><tspan x="562" dy="25">• last change / min / max age</tspan><tspan x="562" dy="25">• warning / inactive / expiry</tspan><tspan x="562" dy="25"></tspan><tspan x="562" dy="25">Policy change ≠ rehash existing passwords</tspan><tspan x="562" dy="25">chage -d 0 &lt;user&gt; → force change</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Groups и home</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">/etc/group → name : passwd : GID : members</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Primary group → default ownership context</tspan><tspan x="1084" dy="25">Supplementary groups → additional access</tspan><tspan x="1084" dy="25">Personal group → restrictive default</tspan><tspan x="1084" dy="25"></tspan><tspan x="1084" dy="25">Home:</tspan><tspan x="1084" dy="25">startup files → chown → login verify</tspan><tspan x="1084" dy="25">Опасно: recursive chown через ~/.*</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Provisioning workflow</text><text x="42" y="506" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="42" dy="0">1. authorize account creation</tspan><tspan x="42" dy="27">2. allocate login + UID/GID</tspan><tspan x="42" dy="27">3. create records + groups</tspan><tspan x="42" dy="27">4. set credential</tspan><tspan x="42" dy="27">5. create home/startup files</tspan><tspan x="42" dy="27">6. set ownership/roles</tspan><tspan x="42" dy="27">7. login as user</tspan><tspan x="42" dy="27">8. pwd + ls -la verification</tspan><tspan x="42" dy="27">9. record in admin source of truth</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Disable / offboard safely</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.3" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Lock ≠ delete</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Handle before removal:</tspan><tspan x="562" dy="27">mail • cron • at • processes • groups</tspan><tspan x="562" dy="27">home/mail data • shared files • external refs</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">After removal:</tspan><tspan x="562" dy="27">find &lt;filesystem&gt; -xdev -nouser</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Password lock may not block every access path</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">PAM / LDAP / AD / SSO / IAM</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">PAM → centralized authentication policy</tspan><tspan x="1084" dy="28">LDAP → centralized identity repository</tspan><tspan x="1084" dy="28">AD → LDAP + Kerberos integration</tspan><tspan x="1084" dy="28">SSO → one credential, larger compromise radius</tspan><tspan x="1084" dy="28">IAM → provisioning + RBAC + audit</tspan><tspan x="1084" dy="28"></tspan><tspan x="1084" dy="28">Goal:</tspan><tspan x="1084" dy="28">rapid propagation + unique identity + traceability</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: account = coordinated lifecycle across identity, authentication, groups, filesystem ownership and external systems.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Создать запись недостаточно; проверять нужно фактический доступ, environment и следы после удаления.</text></svg>