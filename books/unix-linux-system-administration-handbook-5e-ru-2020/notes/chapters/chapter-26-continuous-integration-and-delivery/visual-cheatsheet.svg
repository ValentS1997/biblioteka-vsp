<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#26384d"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 26. Непрерывная интеграция и доставка</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">version control • build once • tests • promotion • Jenkins • Packer • Terraform • containers</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">CI / Delivery / Deployment</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">CI: merge → build → test.</tspan>
<tspan x="48" dy="25">Delivery: deploy to non-production.</tspan>
<tspan x="48" dy="25">Deployment: automatic production release.</tspan>
<tspan x="48" dy="31">Human approval may remain a gate.</tspan>
<tspan x="48" dy="25">Failed tests block promotion.</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">Canonical flow</text>
<text x="572" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">VCS → build once → artifact</tspan>
<tspan x="572" dy="25">→ automated tests</tspan>
<tspan x="572" dy="25">→ dev → staging → production</tspan>
<tspan x="572" dy="31">Promote the same tested artifact.</tspan>
<tspan x="572" dy="25">Pipeline/config are versioned.</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Tests and environments</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">Static • unit • integration</tspan>
<tspan x="1096" dy="25">acceptance • performance • infrastructure</tspan>
<tspan x="1096" dy="31">Environment parity reduces surprises.</tspan>
<tspan x="1096" dy="25">Copied production data must be anonymized.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Deployment strategies</text>
<text x="48" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">Immutable: replace, do not mutate.</tspan>
<tspan x="48" dy="25">Blue-green: validate, then switch traffic.</tspan>
<tspan x="48" dy="25">Rolling: update one system at a time.</tspan>
<tspan x="48" dy="25">Canary: small traffic share first.</tspan>
<tspan x="48" dy="31">Telemetry is required for safe canary.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">Jenkins pipeline as code</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">Jenkins orchestrates external tools.</tspan>
<tspan x="572" dy="25">Jenkinsfile lives in version control.</tspan>
<tspan x="572" dy="25">Agents can be containers, VMs or cloud.</tspan>
<tspan x="572" dy="31">go test → go build → Packer → Terraform</tspan>
<tspan x="572" dy="25">→ integration checks → production.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">Security and rollback</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">Never store API secrets in VCS.</tspan>
<tspan x="1096" dy="25">Use Jenkins credential storage.</tspan>
<tspan x="1096" dy="25">Terraform destroy is destructive.</tspan>
<tspan x="1096" dy="31">Recreate from versioned config and artifact.</tspan>
<tspan x="1096" dy="25">Exact instance restore: Needs confirmation.</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#26384d"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: source of truth → one artifact → automated gates → promote same artifact → observe deployment.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Broken pipeline is priority work; production must not bypass failed tests.</text>
</svg>