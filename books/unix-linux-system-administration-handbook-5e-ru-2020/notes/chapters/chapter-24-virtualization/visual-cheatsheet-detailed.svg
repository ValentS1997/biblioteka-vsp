<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#26384d"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 24. Виртуализация — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">modes • hypervisors • images • VM vs containers • Xen • KVM • VirtualBox • Packer • Vagrant</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. Hypervisor model</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="36" dy="0">Hypervisor mediates guest ↔ hardware.</tspan>
<tspan x="36" dy="19">Resources: CPU, memory, I/O, devices.</tspan>
<tspan x="36" dy="24">Guests can run different operating systems.</tspan>
<tspan x="36" dy="19">Type 1 vs type 2 is not always operationally clear.</tspan>
<tspan x="36" dy="24">KVM is a boundary-blurring example.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Virtualization modes</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="430" dy="0">Full: emulate hardware; unmodified guest.</tspan>
<tspan x="430" dy="19">Para: virtualization-aware guest.</tspan>
<tspan x="430" dy="19">Hardware: Intel VT / AMD-V.</tspan>
<tspan x="430" dy="24">Modern systems combine modes.</tspan>
<tspan x="430" dy="19">Paravirtualized device drivers reduce emulation.</tspan>
<tspan x="430" dy="24">Default modern mode is normally preferred.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. VM lifecycle concepts</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="824" dy="0">Live migration synchronizes memory state.</tspan>
<tspan x="824" dy="19">Uses: HA, DR, load balance, maintenance.</tspan>
<tspan x="824" dy="24">Image = configured bootable OS template.</tspan>
<tspan x="824" dy="19">Snapshots can become image baselines.</tspan>
<tspan x="824" dy="24">Image formats can be hypervisor-specific.</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. VM vs container</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="1218" dy="0">VM: own kernel + full boot.</tspan>
<tspan x="1218" dy="19">Container: shared host kernel.</tspan>
<tspan x="1218" dy="19">VM image typically larger.</tspan>
<tspan x="1218" dy="19">Container startup/overhead typically lower.</tspan>
<tspan x="1218" dy="24">Common chapter pattern:</tspan>
<tspan x="1218" dy="19">hardware → VM → containers.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Xen</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="36" dy="0">Standalone hypervisor.</tspan>
<tspan x="36" dy="19">dom0: privileged management + drivers.</tspan>
<tspan x="36" dy="19">domU: unprivileged guests.</tspan>
<tspan x="36" dy="24">/etc/xen → guest configs; /var/log/xen → logs.</tspan>
<tspan x="36" dy="19">xl list → current IDs/state.</tspan>
<tspan x="36" dy="19">xl console ID → guest console.</tspan>
<tspan x="36" dy="24">Guest config change requires reboot guest.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. KVM</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="550" dy="0">Linux kernel acts as hypervisor.</tspan>
<tspan x="550" dy="19">Guest VMs are Linux processes.</tspan>
<tspan x="550" dy="19">Requires Intel VT / AMD-V.</tspan>
<tspan x="550" dy="24">QEMU supplies virtual hardware.</tspan>
<tspan x="550" dy="19">virt-install creates guests.</tspan>
<tspan x="550" dy="19">virsh lists/starts/shuts down domains.</tspan>
<tspan x="550" dy="24">top/ps can observe VM processes.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Other platforms</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="1064" dy="0">bhyve: FreeBSD-integrated; immature in book context.</tspan>
<tspan x="1064" dy="19">VMware ESXi: mature commercial ecosystem.</tspan>
<tspan x="1064" dy="24">VirtualBox: cross-platform type 2.</tspan>
<tspan x="1064" dy="19">Strong fit: desktop/developer/test environments.</tspan>
<tspan x="1064" dy="19">Chapter says it is usually not production choice.</tspan>
<tspan x="1064" dy="24">VBoxHeadless exists for non-GUI operation.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Packer image-as-code</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">JSON spec → builder → temporary instance → provisioner.</tspan>
<tspan x="36" dy="19">Provisioning uses SSH/scp in chapter example.</tspan>
<tspan x="36" dy="19">Build creates new image and cleans temporary instance.</tspan>
<tspan x="36" dy="24">packer build custom_ami.json</tspan>
<tspan x="36" dy="19">-debug pauses stages for troubleshooting.</tspan>
<tspan x="36" dy="24">Versioned spec gives repeatability and audit trail.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Vagrant / operational flow</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="808" dy="0">Vagrant wraps VMware / VirtualBox / Docker providers.</tspan>
<tspan x="808" dy="19">It is not a hypervisor.</tspan>
<tspan x="808" dy="24">Packer builds standardized base image.</tspan>
<tspan x="808" dy="19">Vagrant gives developers portable controlled environments.</tspan>
<tspan x="808" dy="24">Before lifecycle action: inspect current guest state/ID.</tspan>
<tspan x="808" dy="19">Rollback without image/snapshot baseline: [Needs confirmation]</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#26384d"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core: separate isolation choice, hypervisor lifecycle and image construction; automate repeatable images instead of relying on manual VM mutation.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Read current VM state before start/shutdown/console actions; treat image builds as workload-generating changes.</text>
</svg>