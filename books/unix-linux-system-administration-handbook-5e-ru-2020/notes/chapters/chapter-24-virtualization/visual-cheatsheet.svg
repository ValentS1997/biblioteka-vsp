<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#26384d"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 24. Виртуализация</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">hypervisors • VM vs containers • Xen • KVM • Packer • Vagrant</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">Virtualization model</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">hardware → hypervisor → guest OS</tspan>
<tspan x="48" dy="25">CPU • memory • I/O are virtualized.</tspan>
<tspan x="48" dy="25">Guests are isolated and independently booted.</tspan>
<tspan x="48" dy="31">Full / para / hardware-assisted modes</tspan>
<tspan x="48" dy="25">can be combined in modern systems.</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">VM vs container</text>
<text x="572" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">VM: own kernel + full OS boot.</tspan>
<tspan x="572" dy="25">Container: shared host kernel.</tspan>
<tspan x="572" dy="25">Container overhead is lower.</tspan>
<tspan x="572" dy="31">Common pattern:</tspan>
<tspan x="572" dy="25">physical host → VM → containers</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Xen / KVM</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">Xen: hypervisor + dom0 + domU.</tspan>
<tspan x="1096" dy="25">xl list / xl console</tspan>
<tspan x="1096" dy="31">KVM: Linux kernel is hypervisor.</tspan>
<tspan x="1096" dy="25">Guests appear as Linux processes.</tspan>
<tspan x="1096" dy="25">virsh manages guest lifecycle.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Lifecycle / images</text>
<text x="48" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">virt-install → create guest</tspan>
<tspan x="48" dy="25">image → reusable configured OS</tspan>
<tspan x="48" dy="25">live migration → move running VM</tspan>
<tspan x="48" dy="31">Verify current ID/state before action.</tspan>
<tspan x="48" dy="25">Abrupt kill can terminate guest.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">Packer</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">JSON spec → builder → provisioner</tspan>
<tspan x="572" dy="25">→ temporary VM → new image → cleanup</tspan>
<tspan x="572" dy="31">packer build custom_ami.json</tspan>
<tspan x="572" dy="25">Image specification belongs in repository.</tspan>
<tspan x="572" dy="25">-debug pauses build stages.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">Platforms / scope</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">VMware: mature ecosystem.</tspan>
<tspan x="1096" dy="25">VirtualBox: workstation/test focus.</tspan>
<tspan x="1096" dy="25">bhyve: limited in chapter context.</tspan>
<tspan x="1096" dy="31">Vagrant wraps providers for portable</tspan>
<tspan x="1096" dy="25">development environments.</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#26384d"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: choose the isolation boundary first, then lifecycle tooling; make images reproducible instead of manually mutable.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">VM lifecycle and image build are state-changing operations: inspect current state before acting.</text>
</svg>