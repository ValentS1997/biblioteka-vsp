<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="16" y="16" width="1568" height="72" rx="16" fill="#173e5c"/>
  <text x="44" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff"><tspan x="44" dy="0">Глава 29. Анализ производительности — визуальная шпаргалка</tspan></text>
  <text x="44" y="77" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d8ebf7"><tspan x="44" dy="0">UNIX и Linux: руководство системного администратора, 5-е издание</tspan></text>
  <g filter="url(#shadow)"><rect x="20" y="108" width="500" height="338" rx="18" fill="#f8fbff" stroke="#64aaf5" stroke-width="2"/><rect x="20" y="108" width="500" height="52" rx="18" fill="#cfe8ff"/><rect x="20" y="142" width="500" height="18" fill="#cfe8ff"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Основные команды</tspan></text><text x="44" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• uptime / top / ps auxww</tspan><tspan x="44" dy="26">• vmstat 5 5 / mpstat -P ALL</tspan><tspan x="44" dy="26">• iostat / lsof / fuser</tspan><tspan x="44" dy="26">• sar / sar -d / sar -n DEV / sar -A</tspan><tspan x="44" dy="26">• perf top</tspan><tspan x="44" dy="26">• fio &lt;job&gt;.fio — active benchmark</tspan></text><rect x="540" y="108" width="500" height="338" rx="18" fill="#f6fff8" stroke="#63c98f" stroke-width="2"/><rect x="540" y="108" width="500" height="52" rx="18" fill="#ccefd9"/><rect x="540" y="142" width="500" height="18" fill="#ccefd9"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Процесс диагностики</tspan></text><text x="558" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">1. Определить симптом</tspan></text><text x="558" y="226" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">2. Собрать baseline</tspan></text><text x="558" y="260" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">3. Найти bottleneck</tspan></text><text x="558" y="294" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">4. Проверить гипотезу измерениями</tspan></text><text x="558" y="328" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">5. Внести одно изменение</tspan></text><text x="558" y="362" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24496b"><tspan x="558" dy="0">6. Повторно измерить / rollback</tspan></text><rect x="1060" y="108" width="520" height="338" rx="18" fill="#fffaf2" stroke="#efb44c" stroke-width="2"/><rect x="1060" y="108" width="520" height="52" rx="18" fill="#ffe3a9"/><rect x="1060" y="142" width="520" height="18" fill="#ffe3a9"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">Где искать узкое место</tspan></text><text x="1084" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• CPU: высокий load, много процессов, steal time</tspan><tspan x="1084" dy="26">• Memory: paging / swap, нехватка RAM</tspan><tspan x="1084" dy="26">• Disk: latency, IOPS, очереди, scheduler</tspan><tspan x="1084" dy="26">• Network: latency, throughput</tspan><tspan x="1084" dy="26">• External: DNS / NFS / Kerberos</tspan><tspan x="1084" dy="26">• Virtualization/cloud: конкуренция за ресурсы</tspan></text><rect x="20" y="468" width="500" height="350" rx="18" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="20" y="468" width="500" height="52" rx="18" fill="#ffd1e5"/><rect x="20" y="502" width="500" height="18" fill="#ffd1e5"/><text x="38" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="38" dy="0">Быстрый triage</tspan></text><text x="44" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="44" dy="0">• Высокий load → top / ps / mpstat</tspan><tspan x="44" dy="26">• Система медленно отвечает → vmstat / iostat / sar</tspan><tspan x="44" dy="26">• Постоянный swap → vmstat + meminfo</tspan><tspan x="44" dy="26">• Дисковая задержка → iostat / fio / lsof</tspan><tspan x="44" dy="26">• Сеть → ss / netstat / sar -n DEV</tspan><tspan x="44" dy="26">• Неясная причина → perf top + исторические данные</tspan></text><rect x="540" y="468" width="500" height="350" rx="18" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="468" width="500" height="52" rx="18" fill="#ddd8ff"/><rect x="540" y="502" width="500" height="18" fill="#ddd8ff"/><text x="558" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="558" dy="0">Изменения — только после подтверждения</tspan></text><text x="564" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="564" dy="0">• kill -STOP &lt;PID&gt; — временная проверка</tspan><tspan x="564" dy="26">• renice — CPU priority</tspan><tspan x="564" dy="26">• ionice -c 3 -p &lt;PID&gt; — I/O priority</tspan><tspan x="564" dy="26">• I/O scheduler — только с измерением до/после</tspan><tspan x="564" dy="26">• fio создаёт реальную нагрузку</tspan><tspan x="564" dy="26">• После изменения повторить те же метрики</tspan></text><rect x="1060" y="468" width="520" height="350" rx="18" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1060" y="468" width="520" height="52" rx="18" fill="#d2f1dc"/><rect x="1060" y="502" width="520" height="18" fill="#d2f1dc"/><text x="1078" y="502" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43"><tspan x="1078" dy="0">Ключевые принципы</tspan></text><text x="1084" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Не тюнить на глаз</tspan><tspan x="1084" dy="26">• Baseline важнее одиночного snapshot</tspan><tspan x="1084" dy="26">• Менять один параметр за раз</tspan><tspan x="1084" dy="26">• История sar помогает сравнивать норму и проблему</tspan><tspan x="1084" dy="26">• Часто лучше RAM/SSD/исправление приложения, чем kernel tuning</tspan><tspan x="1084" dy="26">• Документировать результат и быть готовым к rollback</tspan></text></g>
  <rect x="16" y="844" width="1568" height="40" rx="12" fill="#173e5c"/>
  <text x="36" y="871" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff"><tspan x="36" dy="0">Принцип: измеряйте → локализуйте → меняйте по одному → повторно измеряйте → откатывайте при ухудшении.</tspan></text>
</svg>