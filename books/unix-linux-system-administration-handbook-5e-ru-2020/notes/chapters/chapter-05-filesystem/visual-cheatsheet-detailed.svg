<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Глава 5. Файловая система — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Namespace, mounts, file types, links, permissions, attributes и ACL на одной карте</text><rect x="12" y="100" width="390" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="390" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Namespace и paths</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.8" font-weight="500" fill="#17324d"><tspan x="34" dy="0">Filesystem = namespace + API + security + implementation</tspan><tspan x="34" dy="22"></tspan><tspan x="34" dy="22">Единое дерево начинается с /</tspan><tspan x="34" dy="22">absolute: /var/log/app</tspan><tspan x="34" dy="22">relative: book5/filesystem</tspan><tspan x="34" dy="22">current directory — attribute каждого process</tspan><tspan x="34" dy="22"></tspan><tspan x="34" dy="22">Path limits:</tspan><tspan x="34" dy="22">• component ≤ 255 chars</tspan><tspan x="34" dy="22">• kernel pathname limit finite</tspan><tspan x="34" dy="22">• слишком длинный path → cd + relative path</tspan></text><rect x="416" y="100" width="570" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="416" y="100" width="570" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="434" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Mount и системное дерево</text><rect x="442" y="158" width="190" height="42" rx="7" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1"/><text x="537" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">filesystem root</text><line x1="632" y1="179" x2="680" y2="179" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="682" y="158" width="190" height="42" rx="7" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="777" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">mount point</text><line x1="777" y1="200" x2="777" y2="228" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="230" width="234" height="44" rx="7" fill="#fff2cf" stroke="#d4a42c" stroke-width="1"/><text x="777" y="257" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d" text-anchor="middle">visible subtree</text><text x="444" y="304" font-family="Consolas, monospace" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="444" dy="0">/etc  configs          /bin,/sbin important tools</tspan><tspan x="444" dy="20">/lib  libraries        /usr programs/docs/libs</tspan><tspan x="444" dy="20">/var  growing state    /tmp temporary data</tspan><tspan x="444" dy="20">/dev  device namespace</tspan><tspan x="444" dy="20"></tspan><tspan x="444" dy="20">Не переносить system packages произвольно:</tspan><tspan x="444" dy="20">в дереве много hidden dependencies.</tspan></text><rect x="1000" y="100" width="588" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1000" y="100" width="588" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1018" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Типы объектов и links</text><rect x="1026" y="158" width="242" height="34" rx="6" fill="#eef7ff" stroke="#80abd2" stroke-width="1"/><text x="1044" y="181" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">-</text><text x="1076" y="181" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">regular</text><rect x="1026" y="201" width="242" height="34" rx="6" fill="#eef7ff" stroke="#80abd2" stroke-width="1"/><text x="1044" y="224" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">d</text><text x="1076" y="224" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">directory</text><rect x="1026" y="244" width="242" height="34" rx="6" fill="#eef7ff" stroke="#80abd2" stroke-width="1"/><text x="1044" y="267" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">c</text><text x="1076" y="267" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">char device</text><rect x="1026" y="287" width="242" height="34" rx="6" fill="#eef7ff" stroke="#80abd2" stroke-width="1"/><text x="1044" y="310" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">b</text><text x="1076" y="310" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">block device</text><rect x="1292" y="158" width="242" height="34" rx="6" fill="#f7f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1310" y="181" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">s</text><text x="1342" y="181" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">local socket</text><rect x="1292" y="201" width="242" height="34" rx="6" fill="#f7f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1310" y="224" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">p</text><text x="1342" y="224" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">FIFO</text><rect x="1292" y="244" width="242" height="34" rx="6" fill="#f7f0ff" stroke="#b38bd1" stroke-width="1"/><text x="1310" y="267" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#17324d" text-anchor="start">l</text><text x="1342" y="267" font-family="Arial, sans-serif" font-size="13.5" font-weight="500" fill="#17324d" text-anchor="start">symlink</text><text x="1028" y="340" font-family="Arial, sans-serif" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="1028" dy="0">Hard link = дополнительное имя того же inode/object; same FS.</tspan><tspan x="1028" dy="21">Symlink = отдельный object с literal target path; может быть dangling/cross-FS.</tspan></text><rect x="12" y="416" width="650" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="650" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Traditional permissions: effective semantics</text><rect x="32" y="470" width="190" height="28" rx="0" fill="#fff6d8" stroke="#d5c68a" stroke-width="1"/><text x="38" y="489" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">Object</text><rect x="222" y="470" width="135" height="28" rx="0" fill="#fff6d8" stroke="#d5c68a" stroke-width="1"/><text x="228" y="489" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">r</text><rect x="357" y="470" width="135" height="28" rx="0" fill="#fff6d8" stroke="#d5c68a" stroke-width="1"/><text x="363" y="489" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">w</text><rect x="492" y="470" width="150" height="28" rx="0" fill="#fff6d8" stroke="#d5c68a" stroke-width="1"/><text x="498" y="489" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17324d" text-anchor="start">x</text><rect x="32" y="498" width="190" height="40" rx="0" fill="#fff9e8" stroke="#ddd4b5" stroke-width="0.8"/><text x="38" y="523" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#17324d" text-anchor="start">regular file</text><rect x="222" y="498" width="135" height="40" rx="0" fill="#fff9e8" stroke="#ddd4b5" stroke-width="0.8"/><text x="228" y="523" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">read data</text><rect x="357" y="498" width="135" height="40" rx="0" fill="#fff9e8" stroke="#ddd4b5" stroke-width="0.8"/><text x="363" y="523" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">modify data</text><rect x="492" y="498" width="150" height="40" rx="0" fill="#fff9e8" stroke="#ddd4b5" stroke-width="0.8"/><text x="498" y="523" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">execute</text><rect x="32" y="538" width="190" height="40" rx="0" fill="#fffdf7" stroke="#ddd4b5" stroke-width="0.8"/><text x="38" y="563" font-family="Arial, sans-serif" font-size="12.2" font-weight="700" fill="#17324d" text-anchor="start">directory</text><rect x="222" y="538" width="135" height="40" rx="0" fill="#fffdf7" stroke="#ddd4b5" stroke-width="0.8"/><text x="228" y="563" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">list names</text><rect x="357" y="538" width="135" height="40" rx="0" fill="#fffdf7" stroke="#ddd4b5" stroke-width="0.8"/><text x="363" y="563" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">change entries</text><rect x="492" y="538" width="150" height="40" rx="0" fill="#fffdf7" stroke="#ddd4b5" stroke-width="0.8"/><text x="498" y="563" font-family="Arial, sans-serif" font-size="12.2" font-weight="400" fill="#17324d" text-anchor="start">search/traverse</text><text x="34" y="596" font-family="Arial, sans-serif" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="34" dy="0">Delete/rename regular file определяется permissions parent directory.</tspan><tspan x="34" dy="22">Special bits: setuid=4000 • setgid=2000 • sticky=1000</tspan><tspan x="34" dy="22">setgid directory → new files inherit directory group</tspan><tspan x="34" dy="22">sticky directory → delete/rename только owner dir/file или root</tspan></text><rect x="676" y="416" width="440" height="292" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="676" y="416" width="440" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="694" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">5. Изменение state</text><text x="700" y="482" font-family="Consolas, monospace" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="700" dy="0">chmod 711 file</tspan><tspan x="700" dy="20">chmod -R g+w mydir</tspan><tspan x="700" dy="20">chown user:group file</tspan><tspan x="700" dy="20">umask 027</tspan><tspan x="700" dy="20">lsattr / chattr</tspan><tspan x="700" dy="20"></tspan><tspan x="700" dy="20">Проверки:</tspan><tspan x="700" dy="20">• recursive chmod: file ≠ directory semantics</tspan><tspan x="700" dy="20">• recursive chown: не использовать . * pattern</tspan><tspan x="700" dy="20">• immutable flag не заменяет config mgmt</tspan><tspan x="700" dy="20">• после change повторно ls -l / lsattr</tspan></text><rect x="1130" y="416" width="458" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1130" y="416" width="458" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1148" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. Busy filesystem / safe handling</text><text x="1154" y="482" font-family="Consolas, monospace" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="1154" dy="0">mount             — inspect mounts</tspan><tspan x="1154" dy="20">fuser -cv &lt;mnt&gt;   — holders</tspan><tspan x="1154" dy="20">lsof              — open files</tspan><tspan x="1154" dy="20"></tspan><tspan x="1154" dy="20">umount normal path</tspan><tspan x="1154" dy="20">↓</tspan><tspan x="1154" dy="20">если busy → понять processes</tspan><tspan x="1154" dy="20">↓</tspan><tspan x="1154" dy="20">только затем решать force/lazy</tspan><tspan x="1154" dy="20"></tspan><tspan x="1154" dy="20">Странное filename:</tspan><tspan x="1154" dy="20">ls -b + rm -i pattern</tspan><tspan x="1154" dy="20">filename '-f' → rm -- -f</tspan></text><rect x="12" y="724" width="1050" height="250" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="12" y="724" width="1050" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. ACL: POSIX и NFSv4</text><rect x="34" y="782" width="490" height="166" rx="8" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1.2"/><text x="279" y="807" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#463a93" text-anchor="middle">POSIX ACL</text><text x="52" y="834" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="52" dy="0">user:: / user:name / group:: / group:name / mask:: / other::</tspan><tspan x="52" dy="21">mask = upper bound effective rights для group-class entries</tspan><tspan x="52" dy="21">getfacl → inspect; setfacl -m → modify</tspan><tspan x="52" dy="21">chmod на extended ACL меняет mask/group-class</tspan><tspan x="52" dy="21">default ACL копируется новым children, но связь не сохраняется</tspan></text><rect x="546" y="782" width="490" height="166" rx="8" fill="#f7efff" stroke="#b27bd9" stroke-width="1.2"/><text x="791" y="807" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#552078" text-anchor="middle">NFSv4 ACL</text><text x="564" y="834" font-family="Arial, sans-serif" font-size="12.8" font-weight="400" fill="#17324d"><tspan x="564" dy="0">ACE = principal + permissions + inheritance flags + allow/deny</tspan><tspan x="564" dy="21">owner@ / group@ / everyone@</tspan><tspan x="564" dy="21">order ACE имеет значение</tspan><tspan x="564" dy="21">каждая ACE может иметь inheritance flags</tspan><tspan x="564" dy="21">safer edit: getfacl backup → edit file → setfacl replace</tspan></text><rect x="1076" y="724" width="512" height="250" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="1076" y="724" width="512" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="1094" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Что помнить</text><text x="1100" y="792" font-family="Arial, sans-serif" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="1100" dy="0">1. Определите layer до изменения.</tspan><tspan x="1100" dy="22">2. Effective access важнее внешнего ls mode.</tspan><tspan x="1100" dy="22">3. Hard link ≠ symlink.</tspan><tspan x="1100" dy="22">4. Directory x — traverse, не «execute file».</tspan><tspan x="1100" dy="22">5. Force unmount — не first step.</tspan><tspan x="1100" dy="22">6. Recursive ownership/mode changes требуют scope.</tspan><tspan x="1100" dy="22">7. ACL мощнее, но сложнее и менее прозрачны.</tspan><tspan x="1100" dy="22">8. Перед сложным ACL edit сохраните known-good copy.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Итог: path → mount → object/link → mode/owner → flags → ACL. Чем выше слой, тем важнее проверять effective state после изменения.</text></svg>