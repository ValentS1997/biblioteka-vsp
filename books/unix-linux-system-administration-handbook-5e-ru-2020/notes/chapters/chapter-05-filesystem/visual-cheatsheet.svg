<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 5. Файловая система — визуальная шпаргалка</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">UNIX и Linux: руководство системного администратора, 5-е издание</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Модель файловой системы</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="16.2" font-weight="400" fill="#17324d"><tspan x="42" dy="0">4 компонента:</tspan><tspan x="42" dy="27">• namespace — имена и единая иерархия</tspan><tspan x="42" dy="27">• API — операции над объектами</tspan><tspan x="42" dy="27">• security model — защита и sharing</tspan><tspan x="42" dy="27">• implementation — связь логики с storage</tspan><tspan x="42" dy="27"></tspan><tspan x="42" dy="27">UNIX представляет и files, и devices, sockets,</tspan><tspan x="42" dy="27">kernel objects через filesystem-like интерфейсы.</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Mount / unmount</text><rect x="594" y="178" width="392" height="46" rx="8" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1.2"/><text x="790" y="206" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#17324d" text-anchor="middle">mount &lt;device&gt; &lt;mountpoint&gt;</text><line x1="790" y1="224" x2="790" y2="252" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="618" y="254" width="344" height="46" rx="8" fill="#fff2cf" stroke="#d4a42c" stroke-width="1.2"/><text x="790" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#17324d" text-anchor="middle">mount point hides previous content</text><line x1="790" y1="300" x2="790" y2="328" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="330" width="380" height="52" rx="8" fill="#ffe1e1" stroke="#d86666" stroke-width="1.2"/><text x="790" y="352" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7a2525" text-anchor="middle">Busy? → fuser / lsof first</text><text x="790" y="372" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#7a2525" text-anchor="middle">не начинать с umount -f / -l</text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Типы файлов и ссылки</text><text x="1084" y="180" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">regular / directory</tspan><tspan x="1084" dy="23">character device / block device</tspan><tspan x="1084" dy="23">local socket / FIFO / symbolic link</tspan><tspan x="1084" dy="23"></tspan><tspan x="1084" dy="23">Hard link:</tspan><tspan x="1084" dy="23">• то же object/inode; same filesystem</tspan><tspan x="1084" dy="23"></tspan><tspan x="1084" dy="23">Symlink:</tspan><tspan x="1084" dy="23">• отдельный object; target = literal path</tspan><tspan x="1084" dy="23">• может пересекать filesystem boundary</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Permissions и ownership</text><text x="42" y="506" font-family="Consolas, monospace" font-size="15.6" font-weight="500" fill="#17324d"><tspan x="42" dy="0">owner   group   other</tspan><tspan x="42" dy="23"> rwx     rwx     rwx</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">r=4  w=2  x=1</tspan><tspan x="42" dy="23">setuid=4000  setgid=2000  sticky=1000</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">Directory semantics:</tspan><tspan x="42" dy="23">r = list; x = traverse/search</tspan><tspan x="42" dy="23">w+x = create/delete/rename entries</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">chmod / chown / chgrp / umask</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">ACL: когда 9 bits мало</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="562" dy="0">POSIX ACL:</tspan><tspan x="562" dy="24">• extra users/groups + rwx</tspan><tspan x="562" dy="24">• mask = ceiling of effective rights</tspan><tspan x="562" dy="24">• chmod может менять mask</tspan><tspan x="562" dy="24">• default ACL копируются новым children</tspan><tspan x="562" dy="24"></tspan><tspan x="562" dy="24">NFSv4 ACL:</tspan><tspan x="562" dy="24">• allow/deny ACE; order matters</tspan><tspan x="562" dy="24">• owner@ / group@ / everyone@</tspan><tspan x="562" dy="24">• richer permissions + inheritance flags</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Риски и anti-patterns</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15.7" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">• Force/lazy unmount без анализа holders</tspan><tspan x="1084" dy="30">• rm wildcard без -i на странных именах</tspan><tspan x="1084" dy="30">• chmod -R без различения file/dir</tspan><tspan x="1084" dy="30">• chown -R .../.* → может захватить ..</tspan><tspan x="1084" dy="30">• immutable flag вместо исправления config mgmt</tspan><tspan x="1084" dy="30">• верить только ls -l при extended ACL</tspan><tspan x="1084" dy="30">• сложный ACL edit без saved known-good copy</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Слои: path → mount → object/link → mode/owner → filesystem flags → ACL</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Главный принцип: сначала определить слой и effective semantics, затем менять один контролируемый объект и перепроверять состояние.</text></svg>