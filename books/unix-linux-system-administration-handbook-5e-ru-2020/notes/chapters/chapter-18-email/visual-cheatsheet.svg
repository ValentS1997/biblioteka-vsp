<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#243b55"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 18. Электронная почта</text>
<text x="800" y="75" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">MUA → MSA → MTA → LDA → store • SMTP • aliases • security • sendmail / Exim / Postfix</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">Mail flow</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16.8" fill="#19324a">
<tspan x="48" dy="0">MUA → MSA :587 → MTA</tspan>
<tspan x="48" dy="25">→ remote MTA :25 → DA/LDA</tspan>
<tspan x="48" dy="25">→ message store → IMAPS / POP3S</tspan>
<tspan x="48" dy="32">MSA: authenticated submission</tspan>
<tspan x="48" dy="25">MTA: transport/routing</tspan>
<tspan x="48" dy="25">LDA: local delivery</tspan>
<tspan x="48" dy="25">Store: mbox / Maildir / other backends</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">SMTP essentials</text>
<text x="572" y="184" font-family="Consolas, monospace" font-size="16.2" fill="#19324a">
<tspan x="572" dy="0">EHLO / HELO</tspan>
<tspan x="572" dy="24">MAIL FROM:</tspan>
<tspan x="572" dy="24">RCPT TO:</tspan>
<tspan x="572" dy="24">DATA ... .</tspan>
<tspan x="572" dy="24">QUIT</tspan>
<tspan x="572" dy="32">2xx success • 4xx temporary</tspan>
<tspan x="572" dy="24">5xx permanent • DSN = X.X.X</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Identity and confidentiality</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16.2" fill="#19324a">
<tspan x="1096" dy="0">Visible From is not proof of identity.</tspan>
<tspan x="1096" dy="25">SPF uses DNS sender policy.</tspan>
<tspan x="1096" dy="25">Forwarding can break SPF checks.</tspan>
<tspan x="1096" dy="25">DKIM adds cryptographic signatures.</tspan>
<tspan x="1096" dy="32">STARTTLS protects one transport hop.</tspan>
<tspan x="1096" dy="25">PGP/GPG or S/MIME protect content.</tspan>
<tspan x="1096" dy="25">Use IMAPS / POP3S for user access.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Aliases and queues</text>
<text x="48" y="512" font-family="Arial, sans-serif" font-size="16.4" fill="#19324a">
<tspan x="48" dy="0">Aliases → users / lists / files / programs</tspan>
<tspan x="48" dy="25">File and program targets are sensitive.</tspan>
<tspan x="48" dy="25">After alias edit → newaliases</tspan>
<tspan x="48" dy="32">mailq → inspect queue</tspan>
<tspan x="48" dy="25">Queue IDs tie messages to logs.</tspan>
<tspan x="48" dy="25">Watch deferred reasons and queue age.</tspan>
<tspan x="48" dy="25">Queue filesystem exhaustion is a risk.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">Three MTAs</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16.2" fill="#19324a">
<tspan x="572" dy="0">sendmail:</tspan>
<tspan x="572" dy="23">mailq • -bv • -q • -q -v</tspan>
<tspan x="572" dy="31">Exim:</tspan>
<tspan x="572" dy="23">-bv • -bp • -bt • -q</tspan>
<tspan x="572" dy="31">Postfix:</tspan>
<tspan x="572" dy="23">postconf • postmap • mailq • qshape</tspan>
<tspan x="572" dy="31">Do not mix flags between MTAs.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">Troubleshooting order</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16.1" fill="#19324a">
<tspan x="1096" dy="0">1. headers / queue ID</tspan>
<tspan x="1096" dy="24">2. SMTP response</tspan>
<tspan x="1096" dy="24">3. queue</tspan>
<tspan x="1096" dy="24">4. logs</tspan>
<tspan x="1096" dy="24">5. DNS MX + firewall</tspan>
<tspan x="1096" dy="24">6. aliases / lookup tables</tspan>
<tspan x="1096" dy="24">7. local delivery / store</tspan>
<tspan x="1096" dy="30">Rollback: [Needs confirmation]</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#243b55"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: trace the actual message path before changing configuration.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Submission auth, relay policy, TLS, DNS MX, queue state and local delivery are separate failure domains.</text>
</svg>