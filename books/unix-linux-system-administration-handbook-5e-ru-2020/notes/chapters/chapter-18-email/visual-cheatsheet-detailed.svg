<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#243b55"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 18. Электронная почта — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Architecture • SMTP • message anatomy • sender controls • encryption • aliases • sendmail • Exim • Postfix</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. Mail-system roles</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">MUA → compose/read</tspan>
<tspan x="36" dy="19">MSA → submission on 587</tspan>
<tspan x="36" dy="19">MTA → transport on 25</tspan>
<tspan x="36" dy="19">DA/LDA → local delivery</tspan>
<tspan x="36" dy="19">message store → mbox/Maildir/etc.</tspan>
<tspan x="36" dy="19">access agent → IMAP/POP</tspan>
<tspan x="36" dy="24">Use IMAPS/POP3S for encrypted access.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Message anatomy</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="430" dy="0">Envelope → transport sender/recipient</tspan>
<tspan x="430" dy="19">Headers → visible metadata and hop history</tspan>
<tspan x="430" dy="19">Body → message content</tspan>
<tspan x="430" dy="24">Envelope can differ from From/To headers.</tspan>
<tspan x="430" dy="19">Read Received headers bottom-up.</tspan>
<tspan x="430" dy="19">Some header fields can be forged.</tspan>
<tspan x="430" dy="24">Queue ID is key for log correlation.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. SMTP state machine</text>
<text x="824" y="164" font-family="Consolas, monospace" font-size="12.8" fill="#19324a">
<tspan x="824" dy="0">EHLO / HELO</tspan>
<tspan x="824" dy="19">MAIL FROM:</tspan>
<tspan x="824" dy="19">RCPT TO:</tspan>
<tspan x="824" dy="19">DATA ... .</tspan>
<tspan x="824" dy="19">QUIT</tspan>
<tspan x="824" dy="24">2xx = success</tspan>
<tspan x="824" dy="19">4xx = temporary failure / retry</tspan>
<tspan x="824" dy="19">5xx = permanent failure</tspan>
<tspan x="824" dy="19">DSN = X.X.X</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. Sender identity / spam</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="1218" dy="0">Visible sender identity is spoofable.</tspan>
<tspan x="1218" dy="24">SPF:</tspan>
<tspan x="1218" dy="19">DNS publishes authorized senders.</tspan>
<tspan x="1218" dy="19">Forwarding can create false failures.</tspan>
<tspan x="1218" dy="24">DKIM:</tspan>
<tspan x="1218" dy="19">domain cryptographic signatures</tspan>
<tspan x="1218" dy="19">plus DNS-published keys.</tspan>
<tspan x="1218" dy="24">Avoid open relay.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Encryption boundaries</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="36" dy="0">SMTP AUTH identifies submission clients.</tspan>
<tspan x="36" dy="19">TLS/STARTTLS protects one transport hop.</tspan>
<tspan x="36" dy="19">A later hop may be unencrypted.</tspan>
<tspan x="36" dy="24">Content-oriented mechanisms:</tspan>
<tspan x="36" dy="19">PGP/GPG • S/MIME • centralized encryption</tspan>
<tspan x="36" dy="24">DLP scans outgoing mail for sensitive data.</tspan>
<tspan x="36" dy="19">User access should use IMAPS/POP3S.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. Aliases / local delivery</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.6" fill="#19324a">
<tspan x="550" dy="0">Aliases support roles, forwarding and lists.</tspan>
<tspan x="550" dy="19">.forward provides user-controlled routing.</tspan>
<tspan x="550" dy="24">Targets can include:</tspan>
<tspan x="550" dy="19">users • include files • files • programs</tspan>
<tspan x="550" dy="24">File/program delivery is security-sensitive.</tspan>
<tspan x="550" dy="19">Alias loops can cause repeated bounces.</tspan>
<tspan x="550" dy="24">After edit → newaliases.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. MTA-specific operations</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="1064" dy="0">sendmail:</tspan>
<tspan x="1064" dy="18">mailq • -bv • -q • -q -v • HUP after config change</tspan>
<tspan x="1064" dy="24">Exim:</tspan>
<tspan x="1064" dy="18">-bv syntax • -bp queue • -bt route • -q queue run</tspan>
<tspan x="1064" dy="24">Postfix:</tspan>
<tspan x="1064" dy="18">postconf • postmap • postalias • postcat • postsuper</tspan>
<tspan x="1064" dy="18">mailq • qshape</tspan>
<tspan x="1064" dy="24">Do not mix command semantics across MTAs.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Postfix queue / config model</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="36" dy="0">main.cf → main parameters • master.cf → services</tspan>
<tspan x="36" dy="19">Queues: incoming • active • deferred • hold • corrupt</tspan>
<tspan x="36" dy="19">mailq → delayed messages</tspan>
<tspan x="36" dy="19">qshape deferred → queue age and destination distribution</tspan>
<tspan x="36" dy="19">postconf -n → local non-default config delta</tspan>
<tspan x="36" dy="19">postmap -q → lookup-table verification</tspan>
<tspan x="36" dy="24">soft_bounce=yes helps testing; disable afterwards.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Troubleshooting / risks</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="808" dy="0">Trace: headers/queue ID → SMTP code → queue → logs.</tspan>
<tspan x="808" dy="19">Then verify DNS MX, firewall, aliases/maps, local delivery.</tspan>
<tspan x="808" dy="24">Risks:</tspan>
<tspan x="808" dy="19">open relay • cleartext credentials • queue filesystem fill</tspan>
<tspan x="808" dy="19">unsafe file/program aliases • forced queue workload</tspan>
<tspan x="808" dy="19">SPF forwarding false failures • soft_bounce left enabled</tspan>
<tspan x="808" dy="24">Universal MTA rollback: [Needs confirmation]</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#243b55"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Operational core: identify the message and the failed hop before changing routing, relay, alias or queue configuration.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Mail flow crosses independent trust and failure domains: submission, SMTP transport, queueing, DNS, policy, delivery and storage.</text>
</svg>