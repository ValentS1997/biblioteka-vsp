<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 9. Облачные вычисления</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Abstraction → region/network/IAM → provision → verify state → monitor cost → scale/destroy</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Service models</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="42" dy="0">IaaS:</tspan><tspan x="42" dy="23">provider → physical + virtualization</tspan><tspan x="42" dy="23">user → network/storage + OS + app</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">PaaS:</tspan><tspan x="42" dy="23">user → application/code</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">SaaS:</tspan><tspan x="42" dy="23">provider → почти весь stack</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">Чем выше abstraction, тем меньше user-managed layers.</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">Cloud primitives</text><text x="562" y="184" font-family="Arial, sans-serif" font-size="15.6" font-weight="400" fill="#17324d"><tspan x="562" dy="0">Region → availability zones</tspan><tspan x="562" dy="27">Instance/VPS → image + compute + network</tspan><tspan x="562" dy="27">Virtual network → subnets/routes/firewall/VPN</tspan><tspan x="562" dy="27">Storage:</tspan><tspan x="562" dy="27">• object</tspan><tspan x="562" dy="27">• block</tspan><tspan x="562" dy="27">• ephemeral</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">IAM → least privilege users/groups/roles</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Control plane / automation</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Web UI → useful for first actions</tspan><tspan x="1084" dy="24">API / CLI / SDK → repeatable automation</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">SSH public-key auth for UNIX/Linux</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">IaC:</tspan><tspan x="1084" dy="24">CloudFormation</tspan><tspan x="1084" dy="24">Troposphere</tspan><tspan x="1084" dy="24">Terraform</tspan><tspan x="1084" dy="24"></tspan><tspan x="1084" dy="24">Keep infrastructure definition in version control.</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">CLI quick reference</text><text x="42" y="506" font-family="Consolas, monospace" font-size="14.7" font-weight="500" fill="#17324d"><tspan x="42" dy="0">AWS:</tspan><tspan x="42" dy="23">aws configure</tspan><tspan x="42" dy="23">aws ec2 run-instances / describe-instances</tspan><tspan x="42" dy="23">aws ec2 get-console-output / stop-instances</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">GCP:</tspan><tspan x="42" dy="23">gcloud init</tspan><tspan x="42" dy="23">gcloud compute images list</tspan><tspan x="42" dy="23">gcloud compute instances create / ssh</tspan><tspan x="42" dy="23"></tspan><tspan x="42" dy="23">DigitalOcean chapter-era: tugboat</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Security + state traps</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.4" font-weight="400" fill="#17324d"><tspan x="562" dy="0">• Minimize Internet-exposed perimeter</tspan><tspan x="562" dy="29">• Private hosts → bastion or VPN</tspan><tspan x="562" dy="29">• Public IP ≠ open firewall</tspan><tspan x="562" dy="29">• Credentials/tokens are sensitive</tspan><tspan x="562" dy="29">• Instance state changes are asynchronous</tspan><tspan x="562" dy="29">• Ephemeral storage disappears with instance</tspan><tspan x="562" dy="29">• Stop ≠ destroy/terminate</tspan><tspan x="562" dy="29">• Destructive delete needs recovery point</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Cost control</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">Bill = compute + traffic + storage + snapshots + I/O</tspan><tspan x="1084" dy="27"></tspan><tspan x="1084" dy="27">High-cost patterns:</tspan><tspan x="1084" dy="27">• oversized always-on instances</tspan><tspan x="1084" dy="27">• inter-zone/inter-region replication</tspan><tspan x="1084" dy="27">• high-performance storage/IOPS</tspan><tspan x="1084" dy="27">• forgotten resources</tspan><tspan x="1084" dy="27"></tspan><tspan x="1084" dy="27">Loop: measure → monitor → right-size → scale down → remeasure</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: cloud = programmable resource lifecycle with explicit security, state and cost feedback.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Гибкость полезна только тогда, когда ресурс можно воспроизводимо создать, проверить и удалить.</text></svg>