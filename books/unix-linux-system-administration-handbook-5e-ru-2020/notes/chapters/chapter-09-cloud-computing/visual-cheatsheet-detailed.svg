<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 9. Облачные вычисления — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Service models, regions/zones, VPS/network/storage/IAM, IaC, cloud CLI и cost control</text><rect x="12" y="100" width="430" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="430" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Abstraction boundary</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="34" dy="0">On-prem → manage everything</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">IaaS:</tspan><tspan x="34" dy="21">provider: physical + virtualization</tspan><tspan x="34" dy="21">user: virtual net/storage + OS + app</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">PaaS:</tspan><tspan x="34" dy="21">provider also manages OS/platform</tspan><tspan x="34" dy="21">user focuses on code/app</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">SaaS:</tspan><tspan x="34" dy="21">provider runs complete application service</tspan></text><rect x="456" y="100" width="550" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="456" y="100" width="550" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="474" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. Region / zone / network</text><rect x="482" y="166" width="110" height="34" rx="6" fill="#e8f3ff" stroke="#5c9ee6" stroke-width="1"/><text x="537" y="188" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Provider</text><line x1="592" y1="183" x2="630" y2="183" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="632" y="166" width="110" height="34" rx="6" fill="#e6f8ec" stroke="#53aa72" stroke-width="1"/><text x="687" y="188" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Region</text><line x1="742" y1="183" x2="780" y2="183" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="782" y="166" width="110" height="34" rx="6" fill="#fff2cf" stroke="#d4a42c" stroke-width="1"/><text x="837" y="188" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#17324d" text-anchor="middle">Zone</text><text x="482" y="230" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="482" dy="0">Virtual network:</tspan><tspan x="482" dy="21">address ranges • subnets • routes • firewall • VPN</tspan><tspan x="482" dy="21"></tspan><tspan x="482" dy="21">Private host access:</tspan><tspan x="482" dy="21">bastion/jump host OR VPN</tspan><tspan x="482" dy="21"></tspan><tspan x="482" dy="21">Multi-zone/region improves resilience but adds</tspan><tspan x="482" dy="21">latency, replication complexity and traffic cost.</tspan></text><rect x="1020" y="100" width="568" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1020" y="100" width="568" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1038" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Compute / storage / IAM</text><text x="1044" y="166" font-family="Arial, sans-serif" font-size="13.4" font-weight="400" fill="#17324d"><tspan x="1044" dy="0">Instance/VPS:</tspan><tspan x="1044" dy="21">image + CPU + memory + disk + network</tspan><tspan x="1044" dy="21"></tspan><tspan x="1044" dy="21">Storage:</tspan><tspan x="1044" dy="21">object → network objects / durability</tspan><tspan x="1044" dy="21">block → attachable virtual disk</tspan><tspan x="1044" dy="21">ephemeral → local, lost with instance deletion</tspan><tspan x="1044" dy="21"></tspan><tspan x="1044" dy="21">IAM:</tspan><tspan x="1044" dy="21">users + groups + machine roles + policies</tspan><tspan x="1044" dy="21">least privilege is the target model</tspan></text><rect x="12" y="416" width="620" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="620" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Control plane and IaC</text><text x="36" y="484" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Web UI → manual discovery/bootstrap</tspan><tspan x="36" dy="22">API/CLI/SDK → repeatable automation</tspan><tspan x="36" dy="22"></tspan><tspan x="36" dy="22">Raw API becomes awkward for resource graphs.</tspan><tspan x="36" dy="22">CloudFormation: template → dependency ordering → AWS resources</tspan><tspan x="36" dy="22">Troposphere: generate CloudFormation templates</tspan><tspan x="36" dy="22">Terraform: provider-independent infrastructure definition</tspan><tspan x="36" dy="22"></tspan><tspan x="36" dy="22">Store infrastructure configuration under version control.</tspan></text><rect x="646" y="416" width="942" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="646" y="416" width="942" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="664" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">5. CLI lifecycle examples from the chapter</text><text x="670" y="484" font-family="Consolas, monospace" font-size="12.7" font-weight="500" fill="#17324d"><tspan x="670" dy="0">AWS</tspan><tspan x="670" dy="19">pip install awscli → aws configure</tspan><tspan x="670" dy="19">describe-images / describe-instances → run-instances</tspan><tspan x="670" dy="19">get-console-output → stop-instances</tspan><tspan x="670" dy="19"></tspan><tspan x="670" dy="19">GCP</tspan><tspan x="670" dy="19">gcloud init → images list → instances create → compute ssh</tspan><tspan x="670" dy="19"></tspan><tspan x="670" dy="19">DigitalOcean (chapter-era tugboat)</tspan><tspan x="670" dy="19">authorize → images/keys → create → ssh → snapshot → destroy</tspan><tspan x="670" dy="19"></tspan><tspan x="670" dy="19">Automation must verify target state after control-plane request.</tspan></text><rect x="12" y="724" width="700" height="244" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="12" y="724" width="700" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">6. Security and state checks</text><text x="36" y="792" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="36" dy="0">• Public IP does not equal permitted inbound traffic.</tspan><tspan x="36" dy="21">• Security group/firewall must match intended sources/ports.</tspan><tspan x="36" dy="21">• SSH public key and correct image username are required.</tspan><tspan x="36" dy="21">• API credentials/tokens must remain secret.</tspan><tspan x="36" dy="21">• Browser console helps with broken SSH, not BIOS/physical-console debugging.</tspan><tspan x="36" dy="21">• stop ≠ destroy/terminate.</tspan><tspan x="36" dy="21">• Ephemeral storage disappears with instance deletion.</tspan><tspan x="36" dy="21">• Transitional states must be handled by scripts.</tspan></text><rect x="726" y="724" width="862" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="726" y="724" width="862" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="744" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. Cost feedback loop</text><rect x="756" y="800" width="110" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="811" y="824" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#463a93" text-anchor="middle">Measure</text><line x1="866" y1="819" x2="910" y2="819" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="912" y="800" width="110" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="967" y="824" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#463a93" text-anchor="middle">Monitor</text><line x1="1022" y1="819" x2="1066" y2="819" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1068" y="800" width="120" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1128" y="824" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#463a93" text-anchor="middle">Right-size</text><line x1="1188" y1="819" x2="1232" y2="819" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1234" y="800" width="120" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1294" y="824" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#463a93" text-anchor="middle">Scale down</text><line x1="1354" y1="819" x2="1398" y2="819" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1400" y="800" width="150" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1475" y="824" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#463a93" text-anchor="middle">Re-measure</text><text x="756" y="864" font-family="Arial, sans-serif" font-size="13.2" font-weight="400" fill="#17324d"><tspan x="756" dy="0">Bill components: compute + traffic + storage + snapshots + I/O.</tspan><tspan x="756" dy="21">Watch inter-zone/inter-region replication, oversized always-on instances,</tspan><tspan x="756" dy="21">high-performance storage and forgotten resources.</tspan><tspan x="756" dy="21">Observe actual usage before long commitments; autoscale down when demand falls.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.8" font-weight="700" fill="#fff" text-anchor="middle">Итог: cloud resource должен иметь owner, security boundary, observed state, recovery semantics и cost signal.</text></svg>