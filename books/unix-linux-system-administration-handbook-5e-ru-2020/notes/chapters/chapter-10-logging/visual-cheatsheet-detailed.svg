<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="1060" fill="url(#bg2)"/>
<rect x="10" y="10" width="1580" height="74" rx="15" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Глава 10. Журналирование — итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">systemd journal, Syslog/Rsyslog, kernel logs, rotation, central analysis и retention policy</text><rect x="12" y="100" width="430" height="300" rx="12" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="12" y="100" width="430" height="40" rx="12" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="30" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0c3e74" text-anchor="start">1. Event sources</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17324d"><tspan x="34" dy="0">kernel</tspan><tspan x="34" dy="21">system daemons</tspan><tspan x="34" dy="21">applications</tspan><tspan x="34" dy="21">startup scripts</tspan><tspan x="34" dy="21">audit subsystem</tspan><tspan x="34" dy="21">login/session records</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Storage forms:</tspan><tspan x="34" dy="21">text files • binary journal • wtmp/lastlog</tspan><tspan x="34" dy="21"></tspan><tspan x="34" dy="21">Question: where is event generated and who collects it?</tspan></text><rect x="456" y="100" width="560" height="300" rx="12" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="456" y="100" width="560" height="40" rx="12" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="474" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">2. systemd-journald</text><text x="480" y="168" font-family="Consolas, monospace" font-size="13.2" font-weight="500" fill="#17324d"><tspan x="480" dy="0">Inputs:</tspan><tspan x="480" dy="20">/dev/log • /dev/kmsg • stdout interface • native API • audit</tspan><tspan x="480" dy="20"></tspan><tspan x="480" dy="20">Queries:</tspan><tspan x="480" dy="20">journalctl -u ssh</tspan><tspan x="480" dy="20">--list-boots / -b 0 / --since / --until / -n</tspan><tspan x="480" dy="20">journalctl -k / --dmesg</tspan><tspan x="480" dy="20"></tspan><tspan x="480" dy="20">Storage:</tspan><tspan x="480" dy="20">volatile | persistent | auto | none</tspan><tspan x="480" dy="20">local overrides → journald.conf.d/*.conf</tspan></text><rect x="1030" y="100" width="558" height="300" rx="12" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1030" y="100" width="558" height="40" rx="12" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1048" y="128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#552078" text-anchor="start">3. Rsyslog stream model</text><rect x="1056" y="176" width="116" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1114" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#463a93" text-anchor="middle">INPUT</text><line x1="1172" y1="195" x2="1214" y2="195" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1216" y="176" width="126" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1279" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#463a93" text-anchor="middle">FILTER</text><line x1="1342" y1="195" x2="1384" y2="195" stroke="#172737" stroke-width="2" marker-end="url(#a)"/><rect x="1386" y="176" width="150" height="38" rx="7" fill="#eef1ff" stroke="#8b7cf6" stroke-width="1"/><text x="1461" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#463a93" text-anchor="middle">ACTION</text><text x="1056" y="246" font-family="Arial, sans-serif" font-size="13.3" font-weight="400" fill="#17324d"><tspan x="1056" dy="0">facility / severity / message properties</tspan><tspan x="1056" dy="22">local socket • UDP • TCP • file modules</tspan><tspan x="1056" dy="22">file output • remote collector • other modules</tspan><tspan x="1056" dy="22"></tspan><tspan x="1056" dy="22">RainerScript expresses modules, inputs, filters, actions.</tspan><tspan x="1056" dy="22">TLS can protect remote log transport.</tspan></text><rect x="12" y="416" width="650" height="292" rx="12" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="12" y="416" width="650" height="40" rx="12" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="30" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">4. Journal/Syslog integration + kernel</text><text x="36" y="484" font-family="Arial, sans-serif" font-size="13.3" font-weight="400" fill="#17324d"><tspan x="36" dy="0">journald → Syslog socket forwarding</tspan><tspan x="36" dy="21">  simpler compatibility, some journal metadata lost</tspan><tspan x="36" dy="21"></tspan><tspan x="36" dy="21">rsyslog → journal API</tspan><tspan x="36" dy="21">  richer metadata preserved</tspan><tspan x="36" dy="21"></tspan><tspan x="36" dy="21">Kernel ring buffer:</tspan><tspan x="36" dy="21">journalctl -k / journalctl --dmesg / dmesg</tspan><tspan x="36" dy="21"></tspan><tspan x="36" dy="21">dmesg -n 2 changes console threshold, not log collection.</tspan></text><rect x="676" y="416" width="440" height="292" rx="12" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="676" y="416" width="440" height="40" rx="12" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="694" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9c1651" text-anchor="start">5. Rotation</text><text x="700" y="484" font-family="Consolas, monospace" font-size="13.1" font-weight="500" fill="#17324d"><tspan x="700" dy="0">logrotate:</tspan><tspan x="700" dy="20">daily / weekly / monthly</tspan><tspan x="700" dy="20">rotate N / size</tspan><tspan x="700" dy="20">compress / delaycompress</tspan><tspan x="700" dy="20">prerotate / postrotate</tspan><tspan x="700" dy="20">sharedscripts / notifempty</tspan><tspan x="700" dy="20"></tspan><tspan x="700" dy="20">Open file hazard:</tspan><tspan x="700" dy="20">rotate → daemon HUP/reopen → verify</tspan><tspan x="700" dy="20"></tspan><tspan x="700" dy="20">FreeBSD default: newsyslog</tspan></text><rect x="1130" y="416" width="458" height="292" rx="12" fill="#f5fff7" stroke="#58b879" stroke-width="2"/><rect x="1130" y="416" width="458" height="40" rx="12" fill="#d2f1dc" stroke="#58b879" stroke-width="0"/><text x="1148" y="444" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#145d2d" text-anchor="start">6. End-to-end verification</text><text x="1154" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="1154" dy="0">Generate known event:</tspan><tspan x="1154" dy="20">logger -p local5.warning "test message"</tspan><tspan x="1154" dy="20"></tspan><tspan x="1154" dy="20">Then verify:</tspan><tspan x="1154" dy="20">1. source emits</tspan><tspan x="1154" dy="20">2. collector receives</tspan><tspan x="1154" dy="20">3. filter matches</tspan><tspan x="1154" dy="20">4. action routes</tspan><tspan x="1154" dy="20">5. destination stores</tspan><tspan x="1154" dy="20">6. central search can find</tspan><tspan x="1154" dy="20">7. rotation/retention still preserve policy</tspan></text><rect x="12" y="724" width="760" height="244" rx="12" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="12" y="724" width="760" height="40" rx="12" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="30" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#463a93" text-anchor="start">7. Large-scale analysis</text><text x="36" y="792" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="36" dy="0">Filebeat → ship</tspan><tspan x="36" dy="20">Logstash → ingest / parse / filter / route</tspan><tspan x="36" dy="20">Elasticsearch → indexed storage / search</tspan><tspan x="36" dy="20">Kibana → query / visualization</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Graylog → alternative centralized stack/UI with RBAC/LDAP features</tspan><tspan x="36" dy="20">Managed logging → shifts operational burden but changes cost/trust model</tspan><tspan x="36" dy="20"></tspan><tspan x="36" dy="20">Warning: centralized stack itself requires operations and can lose data.</tspan></text><rect x="786" y="724" width="802" height="244" rx="12" fill="#fffdf4" stroke="#d5ad37" stroke-width="2"/><rect x="786" y="724" width="802" height="40" rx="12" fill="#fff0bc" stroke="#d5ad37" stroke-width="0"/><text x="804" y="752" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#684b00" text-anchor="start">8. Retention / access / policy</text><text x="810" y="792" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#17324d"><tspan x="810" dy="0">Policy inputs:</tspan><tspan x="810" dy="20">business • security • compliance • storage limits • event value</tspan><tspan x="810" dy="20"></tspan><tspan x="810" dy="20">Collect at least:</tspan><tspan x="810" dy="20">user/ID • success/failure • source address • accurate time</tspan><tspan x="810" dy="20">important data changes • event details</tspan><tspan x="810" dy="20"></tspan><tspan x="810" dy="20">Central log access should be restricted and itself audited.</tspan><tspan x="810" dy="20">Monitor pipeline health: disk growth, stopped logs, forwarding, rotation.</tspan></text><rect x="12" y="992" width="1576" height="46" rx="10" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="1021" font-family="Arial, sans-serif" font-size="15.8" font-weight="700" fill="#fff" text-anchor="middle">Итог: событие полезно только если его можно надежно собрать, найти, сохранить нужное время и доказать целостность пути.</text></svg>