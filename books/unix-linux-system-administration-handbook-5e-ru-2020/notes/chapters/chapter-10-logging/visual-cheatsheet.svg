<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#172737"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="14" y="14" width="1572" height="76" rx="16" fill="#173e5c" stroke="#173e5c" stroke-width="0"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Глава 10. Журналирование</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#dcebf5" text-anchor="middle">Source → collect → filter/route → store → analyze → rotate/archive → expire</text><rect x="20" y="112" width="500" height="300" rx="14" fill="#f7fbff" stroke="#57a9e8" stroke-width="2"/><rect x="20" y="112" width="500" height="44" rx="14" fill="#cfeaff" stroke="#57a9e8" stroke-width="0"/><text x="38" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0c3e74" text-anchor="start">Logging pipeline</text><text x="42" y="184" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="42" dy="0">Sources:</tspan><tspan x="42" dy="26">kernel • daemons • apps • scripts • audit</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">Collectors:</tspan><tspan x="42" dy="26">systemd-journald • rsyslog • direct files</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">Destinations:</tspan><tspan x="42" dy="26">local files • central server • indexed cluster</tspan><tspan x="42" dy="26"></tspan><tspan x="42" dy="26">Проверять всю цепочку, а не один файл.</tspan></text><rect x="540" y="112" width="500" height="300" rx="14" fill="#f6fff8" stroke="#61c58a" stroke-width="2"/><rect x="540" y="112" width="500" height="44" rx="14" fill="#ccefd9" stroke="#61c58a" stroke-width="0"/><text x="558" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145d2d" text-anchor="start">systemd journal</text><text x="562" y="184" font-family="Consolas, monospace" font-size="15" font-weight="500" fill="#17324d"><tspan x="562" dy="0">journalctl -u ssh</tspan><tspan x="562" dy="24">journalctl -f</tspan><tspan x="562" dy="24">journalctl --disk-usage</tspan><tspan x="562" dy="24">journalctl --list-boots</tspan><tspan x="562" dy="24">journalctl -b 0 -u ssh</tspan><tspan x="562" dy="24">journalctl --since=... --until=...</tspan><tspan x="562" dy="24"></tspan><tspan x="562" dy="24">Storage: volatile / persistent / auto / none</tspan><tspan x="562" dy="24">Overrides: /etc/systemd/journald.conf.d/</tspan></text><rect x="1060" y="112" width="520" height="300" rx="14" fill="#fff9ff" stroke="#c16ce2" stroke-width="2"/><rect x="1060" y="112" width="520" height="44" rx="14" fill="#f0d9ff" stroke="#c16ce2" stroke-width="0"/><text x="1078" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#552078" text-anchor="start">Syslog / Rsyslog</text><text x="1084" y="184" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">event stream:</tspan><tspan x="1084" dy="26">INPUT → FILTER → ACTION</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Filter dimensions:</tspan><tspan x="1084" dy="26">facility • severity • properties</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Inputs: local socket / UDP / TCP / files</tspan><tspan x="1084" dy="26">Outputs: files / remote collectors</tspan><tspan x="1084" dy="26"></tspan><tspan x="1084" dy="26">Central transport can use TLS.</tspan></text><rect x="20" y="438" width="500" height="320" rx="14" fill="#fffaf2" stroke="#e1b53b" stroke-width="2"/><rect x="20" y="438" width="500" height="44" rx="14" fill="#fff0bc" stroke="#e1b53b" stroke-width="0"/><text x="38" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#684b00" text-anchor="start">Kernel + diagnostics</text><text x="42" y="508" font-family="Consolas, monospace" font-size="15.4" font-weight="500" fill="#17324d"><tspan x="42" dy="0">journalctl -k</tspan><tspan x="42" dy="28">journalctl --dmesg</tspan><tspan x="42" dy="28">dmesg</tspan><tspan x="42" dy="28"></tspan><tspan x="42" dy="28">Console level ≠ collection level</tspan><tspan x="42" dy="28">dmesg -n 2 changes console verbosity only</tspan><tspan x="42" dy="28"></tspan><tspan x="42" dy="28">Test Syslog route:</tspan><tspan x="42" dy="28">logger -p local5.warning "test message"</tspan></text><rect x="540" y="438" width="500" height="320" rx="14" fill="#fff7fb" stroke="#e46aa6" stroke-width="2"/><rect x="540" y="438" width="500" height="44" rx="14" fill="#ffd1e5" stroke="#e46aa6" stroke-width="0"/><text x="558" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c1651" text-anchor="start">Rotation / retention</text><text x="562" y="506" font-family="Arial, sans-serif" font-size="15.2" font-weight="400" fill="#17324d"><tspan x="562" dy="0">logrotate:</tspan><tspan x="562" dy="27">rotate N • size • daily/weekly/monthly</tspan><tspan x="562" dy="27">compress • delaycompress</tspan><tspan x="562" dy="27">prerotate/postrotate • sharedscripts</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">FreeBSD: newsyslog</tspan><tspan x="562" dy="27"></tspan><tspan x="562" dy="27">Risk: open file rotated/compressed without daemon reopen</tspan><tspan x="562" dy="27">→ use HUP/reopen semantics</tspan></text><rect x="1060" y="438" width="520" height="320" rx="14" fill="#f7f7ff" stroke="#8b7cf6" stroke-width="2"/><rect x="1060" y="438" width="520" height="44" rx="14" fill="#ddd8ff" stroke="#8b7cf6" stroke-width="0"/><text x="1078" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#463a93" text-anchor="start">Scale + policy</text><text x="1084" y="506" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#17324d"><tspan x="1084" dy="0">ELK: Logstash → Elasticsearch → Kibana</tspan><tspan x="1084" dy="27">Filebeat → shipper</tspan><tspan x="1084" dy="27">Graylog → alternative centralized UI/platform</tspan><tspan x="1084" dy="27">Managed logging → less ops, different cost/trust</tspan><tspan x="1084" dy="27"></tspan><tspan x="1084" dy="27">Policy questions:</tspan><tspan x="1084" dy="27">what events? how long? where stored? who can read?</tspan><tspan x="1084" dy="27"></tspan><tspan x="1084" dy="27">Access to central logs should itself be logged.</tspan></text><rect x="20" y="790" width="1560" height="78" rx="12" fill="#173e5c" stroke="#173e5c" stroke-width="0"/><text x="800" y="821" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Главный принцип: reliable logging = verified end-to-end path plus explicit rotation, retention and access policy.</text><text x="800" y="849" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="middle">Отсутствие ожидаемых событий тоже сигнал: monitoring должен проверять сам logging pipeline.</text></svg>