<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<rect width="1600" height="1060" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="74" rx="14" fill="#26384d"/>
<text x="800" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 27. Безопасность — подробная итоговая шпаргалка</text>
<text x="800" y="68" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">CIA • threats • hardening • accounts • detection • crypto • SSH • firewalls/VPN • standards • incident response</text>

<rect x="14" y="104" width="382" height="278" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. CIA / threat model</text>
<text x="36" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">Confidentiality: authorized disclosure only.</tspan>
<tspan x="36" dy="19">Integrity: authentic, unmodified data/source.</tspan>
<tspan x="36" dy="19">Availability: service/data when needed.</tspan>
<tspan x="36" dy="24">Threats: people, bugs, DDoS, insiders, config.</tspan>
<tspan x="36" dy="19">Social engineering requires user education.</tspan>
</text>

<rect x="408" y="104" width="382" height="278" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="426" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">2. Hardening principles</text>
<text x="430" y="164" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="430" dy="0">Least privilege minimizes blast radius.</tspan>
<tspan x="430" dy="19">Defense in depth avoids single boundaries.</tspan>
<tspan x="430" dy="19">Minimize attack surface and packages.</tspan>
<tspan x="430" dy="24">Patch with inventory, test and rollback plan.</tspan>
<tspan x="430" dy="19">Automate reproducible secure configuration.</tspan>
</text>

<rect x="802" y="104" width="382" height="278" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="820" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">3. Accounts / MFA</text>
<text x="824" y="164" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="824" dy="0">Long unique passphrases; no reuse.</tspan>
<tspan x="824" dy="19">Avoid shared/group accounts.</tspan>
<tspan x="824" dy="19">Vault organizational passwords.</tspan>
<tspan x="824" dy="24">Disable direct remote root login.</tspan>
<tspan x="824" dy="19">MFA for Internet-facing admin access.</tspan>
</text>

<rect x="1196" y="104" width="390" height="278" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="1214" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">4. Detection tools</text>
<text x="1218" y="164" font-family="Arial, sans-serif" font-size="12.2" fill="#19324a">
<tspan x="1218" dy="0">nmap/Nessus: external exposure/vulnerabilities.</tspan>
<tspan x="1218" dy="19">Lynis: host-local security audit.</tspan>
<tspan x="1218" dy="19">Bro/Snort: network intrusion detection.</tspan>
<tspan x="1218" dy="19">OSSEC: host IDS + integrity/log analysis.</tspan>
<tspan x="1218" dy="19">Fail2Ban: react to brute-force patterns.</tspan>
<tspan x="1218" dy="24">Active testing requires explicit authorization.</tspan>
</text>

<rect x="14" y="398" width="502" height="286" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">5. Cryptography / PKI / TLS</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="36" dy="0">Symmetric crypto → efficient shared-secret data protection.</tspan>
<tspan x="36" dy="19">Public-key crypto → identity, signatures, key exchange.</tspan>
<tspan x="36" dy="19">PKI → CA signs identity/key binding.</tspan>
<tspan x="36" dy="19">TLS secures application traffic over network connections.</tspan>
<tspan x="36" dy="24">SHA-2/SHA-3 preferred; SHA-1/MD5 not cryptographic trust.</tspan>
<tspan x="36" dy="19">Use kernel entropy; never homegrown cryptography.</tspan>
</text>

<rect x="528" y="398" width="502" height="286" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. OpenSSH trust boundaries</text>
<text x="550" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="550" dy="0">Verify host-key fingerprint before trust.</tspan>
<tspan x="550" dy="19">Private keys remain secret; use passphrases for privileged IDs.</tspan>
<tspan x="550" dy="19">~/.ssh 0700 • private 0600 • authorized_keys 0600.</tspan>
<tspan x="550" dy="24">Agent forwarding trusts intermediate host.</tspan>
<tspan x="550" dy="19">Port forwarding can bypass firewall policy.</tspan>
<tspan x="550" dy="19">Reload sshd while retaining known-good session.</tspan>
</text>

<rect x="1042" y="398" width="544" height="286" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Network security</text>
<text x="1064" y="458" font-family="Arial, sans-serif" font-size="12.4" fill="#19324a">
<tspan x="1064" dy="0">Firewall default-deny, then allow required services.</tspan>
<tspan x="1064" dy="19">Use DMZ for Internet-facing systems.</tspan>
<tspan x="1064" dy="19">Host controls remain necessary behind firewall.</tspan>
<tspan x="1064" dy="24">VPN/IPsec protects the transport path.</tspan>
<tspan x="1064" dy="19">VPN endpoint can still be compromised.</tspan>
<tspan x="1064" dy="19">Treat remote VPN endpoint as external unless justified.</tspan>
</text>

<rect x="14" y="700" width="760" height="250" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Security operations / standards</text>
<text x="36" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="36" dy="0">Central logs preserve visibility and evidence.</tspan>
<tspan x="36" dy="19">Encrypted, controlled backups support availability/recovery.</tspan>
<tspan x="36" dy="19">Monitor vendor security advisories continuously.</tspan>
<tspan x="36" dy="24">Frameworks surveyed: ISO 27001, PCI DSS, NIST SP 800,</tspan>
<tspan x="36" dy="19">Common Criteria, OWASP and CIS benchmarks.</tspan>
<tspan x="36" dy="24">Apply a recognized methodology consistently.</tspan>
</text>

<rect x="786" y="700" width="800" height="250" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="730" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Compromise / recovery workflow</text>
<text x="808" y="760" font-family="Arial, sans-serif" font-size="12.5" fill="#19324a">
<tspan x="808" dy="0">Stay controlled → define responders → preserve evidence/logs.</tspan>
<tspan x="808" dy="19">Assess scope/data exposure → isolate where appropriate.</tspan>
<tspan x="808" dy="19">Close discovered gaps → develop recovery strategy.</tspan>
<tspan x="808" dy="19">Communicate impact/plan → recover → report as required.</tspan>
<tspan x="808" dy="24">Rootkit/serious compromise: rebuild from clean trusted state.</tspan>
<tspan x="808" dy="19">Do not destroy forensic evidence through premature cleanup.</tspan>
</text>

<rect x="14" y="978" width="1572" height="58" rx="10" fill="#26384d"/>
<text x="800" y="1002" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">Core: prevent with least privilege and hardening; detect with logs/IDS; recover from protected, known-good state.</text>
<text x="800" y="1026" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Authorization matters: active scans and password audits belong only on systems you own or are explicitly allowed to test.</text>
</svg>