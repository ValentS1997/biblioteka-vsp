<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="76" rx="14" fill="#26384d"/>
<text x="800" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Глава 27. Безопасность</text>
<text x="800" y="74" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">CIA • least privilege • hardening • detection • crypto • SSH • firewall/VPN • incident response</text>

<rect x="24" y="116" width="500" height="300" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">Security model</text>
<text x="48" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">Confidentiality • Integrity • Availability</tspan>
<tspan x="48" dy="28">Least privilege.</tspan>
<tspan x="48" dy="25">Defense in depth.</tspan>
<tspan x="48" dy="25">Minimize attack surface.</tspan>
<tspan x="48" dy="31">Security is a continuous process.</tspan>
</text>

<rect x="548" y="116" width="500" height="300" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">Hardening / detection</text>
<text x="572" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">Patch on a controlled schedule.</tspan>
<tspan x="572" dy="25">Remove unnecessary services.</tspan>
<tspan x="572" dy="25">Centralize logs and protect backups.</tspan>
<tspan x="572" dy="25">MFA for administrative access.</tspan>
<tspan x="572" dy="31">NIDS/HIDS + file-integrity monitoring.</tspan>
</text>

<rect x="1072" y="116" width="504" height="300" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">Security tooling boundary</text>
<text x="1096" y="184" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">nmap → authorized networks only.</tspan>
<tspan x="1096" dy="25">John → approved password audit only.</tspan>
<tspan x="1096" dy="25">Protect recovered credentials.</tspan>
<tspan x="1096" dy="31">OSSEC / Snort / Bro detect anomalies.</tspan>
</text>

<rect x="24" y="444" width="500" height="316" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">Crypto / SSH</text>
<text x="48" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">Use established cryptographic libraries.</tspan>
<tspan x="48" dy="25">PKI binds identity to public keys.</tspan>
<tspan x="48" dy="25">SHA-2/SHA-3 for cryptographic hashing.</tspan>
<tspan x="48" dy="25">Verify SSH host keys.</tspan>
<tspan x="48" dy="25">Protect private keys; restrict forwarding.</tspan>
</text>

<rect x="548" y="444" width="500" height="316" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">Network boundaries</text>
<text x="572" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">Firewall: default deny, open what is needed.</tspan>
<tspan x="572" dy="25">Internet-facing services belong in a DMZ.</tspan>
<tspan x="572" dy="25">VPN protects the path, not the endpoint.</tspan>
<tspan x="572" dy="31">Firewall/VPN are layers, not complete security.</tspan>
</text>

<rect x="1072" y="444" width="504" height="316" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="478" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">Incident response</text>
<text x="1096" y="512" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">Preserve evidence before remediation.</tspan>
<tspan x="1096" dy="25">Assess scope and impact.</tspan>
<tspan x="1096" dy="25">Isolate affected hosts when appropriate.</tspan>
<tspan x="1096" dy="25">Recover from known-good state.</tspan>
<tspan x="1096" dy="25">Communicate and report.</tspan>
</text>

<rect x="24" y="790" width="1552" height="78" rx="12" fill="#26384d"/>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Core: reduce exposure, authenticate strongly, monitor continuously, preserve evidence, recover from trusted state.</text>
<text x="800" y="849" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">No single firewall, VPN, IDS or crypto tool replaces layered security and operational discipline.</text>
</svg>