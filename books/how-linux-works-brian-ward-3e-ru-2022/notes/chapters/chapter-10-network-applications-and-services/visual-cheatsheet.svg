<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 10 — Сетевые приложения и службы</title>
<desc id="desc">Compact application protocols, SSH, diagnostics, security and sockets overview.</desc>
<rect x="0" y="0" width="1600" height="900" rx="16" fill="#f2f6fb"/><rect x="0" y="0" width="1600" height="132" rx="0" fill="#182b43"/>
<text x="48" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">ГЛАВА 10 · СЕТЕВЫЕ ПРИЛОЖЕНИЯ И СЛУЖБЫ</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fb">HTTP • SSH • listeners • packet diagnostics • sockets • IPC</text><rect x="45" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="160" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">01 · APP PROTOCOLS</text><text x="68" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">TCP carries byte streams</text><text x="68" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">HTTP semantics live in user space</text><text x="68" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">curl traces request/response</text><text x="68" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">telnet can probe raw TCP</text><rect x="555" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="160" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">02 · SERVERS / SSH</text><text x="578" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Listener + worker model</text><text x="578" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">sshd is secure remote service</text><text x="578" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Host keys define server identity</text><text x="578" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">known_hosts protects clients</text><rect x="1065" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1065" y="160" width="486" height="9" rx="5" fill="#7256a3"/><text x="1088" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7256a3">03 · DIAGNOSTICS</text><text x="1088" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">netstat: ports/connections</text><text x="1088" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">lsof: process ↔ endpoint</text><text x="1088" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">tcpdump: packets</text><text x="1088" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">netcat / Nmap: active probes</text><rect x="45" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="438" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">04 · SECURITY</text><text x="68" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Run only needed services</text><text x="68" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Filter unnecessary exposure</text><text x="68" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Patch public services</text><text x="68" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Avoid plaintext legacy login</text><rect x="555" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="438" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">05 · SOCKETS</text><text x="578" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Socket = user/kernel boundary</text><text x="578" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">accept() creates connected socket</text><text x="578" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">SOCK_STREAM / SOCK_DGRAM</text><text x="578" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Unix sockets for local IPC</text><rect x="1065" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1065" y="438" width="486" height="9" rx="5" fill="#b45d42"/><text x="1088" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d42">06 · OPERATOR RULE</text><text x="1088" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Open port ≠ healthy app</text><text x="1088" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Host-key mismatch = security event</text><text x="1088" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Capture/scan only with authorization</text><text x="1088" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Preserve remote recovery path</text><rect x="45" y="733" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#bb6449" stroke-width="2"/><text x="70" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#963e2d">SECURITY: verify SSH host identity; do not scan or capture networks without authorization.</text><text x="70" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Start with process/listener evidence, then transport/application probes, then packet capture if needed.</text><text x="48" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56697e">Уорд · глава 10 · PDF/печатные с. 320–343 · RAG p0320:c01–p0343:c01 · source-grounded</text></svg>