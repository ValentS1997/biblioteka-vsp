<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 10 — Подробная карта сетевых приложений и служб</title>
<desc id="desc">Detailed application protocols, SSH, diagnostics, security and socket internals overview.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fb"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#172a42"/>
<text x="52" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#ffffff">ГЛАВА 10 · ПОЛНАЯ КАРТА NETWORK APPLICATIONS / SERVICES</text>
<text x="52" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5e8fb">HTTP • servers • OpenSSH • diagnostics • security • sockets • Unix IPC</text><rect x="43" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="163" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">01 · APPLICATION LAYER</text><text x="66" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">HTTP request/response is user-space logic</text><text x="66" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">TCP only transports the byte stream</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">curl trace separates connect/header/data</text><text x="66" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Protocol failure can exist above working TCP</text><rect x="626" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="163" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">02 · SERVER MODEL</text><text x="649" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Listener owns a service port</text><text x="649" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">accept() yields connected socket</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Workers/children handle clients</text><text x="649" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">UDP has no per-connection accept model</text><rect x="1209" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="163" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">03 · OPENSSH SERVER</text><text x="1232" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">sshd config under /etc/ssh</text><text x="1232" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Host keys identify the server</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Enable/start are separate state changes</text><text x="1232" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Private host keys must stay secret</text><rect x="43" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="445" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">04 · SSH CLIENT TRUST</text><text x="66" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">known_hosts stores remote identity</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Mismatch may signal rebuild or MITM</text><text x="66" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Verify new key out-of-band first</text><text x="66" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">scp/sftp reuse SSH transport</text><rect x="626" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="445" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">05 · SERVICE DISCOVERY</text><text x="649" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">netstat shows transport endpoints</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">lsof maps endpoint ↔ process/user</text><text x="649" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">LISTEN vs ESTABLISHED matters</text><text x="649" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Loopback binding limits exposure</text><rect x="1209" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="445" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">06 · ACTIVE DIAGNOSTICS</text><text x="1232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">telnet/netcat exercise transport</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">curl exercises application protocol</text><text x="1232" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Nmap observes exposed ports</text><text x="1232" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">tcpdump observes packet path</text><rect x="43" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="727" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">07 · SECURITY MODEL</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Minimize enabled services</text><text x="66" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Firewall unnecessary exposure</text><text x="66" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Patch internet-facing daemons</text><text x="66" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Avoid plaintext legacy remote login</text><rect x="626" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="727" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">08 · RPC / LEGACY</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">rpcbind maps RPC program numbers</text><text x="649" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">inetd/xinetd multiplex services</text><text x="649" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">TCP wrappers are historical</text><text x="649" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Source mechanisms may be legacy today</text><rect x="1209" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1209" y="727" width="548" height="9" rx="16" fill="#b45d42"/><text x="1232" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b45d42">09 · SOCKET / IPC</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Socket is user↔kernel interface</text><text x="1232" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">SOCK_STREAM and SOCK_DGRAM</text><text x="1232" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Unix sockets stay local</text><text x="1232" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Filesystem permissions can gate IPC</text><rect x="43" y="1025" width="1714" height="176" rx="16" fill="#ffece7" stroke="#c77357" stroke-width="2"/><text x="70" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983f2d">OPERATOR ACCEPTANCE</text><text x="70" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Confirm process → listener → transport → application semantics; each layer proves a different thing.</text><text x="70" y="1145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Before SSH identity/config changes, preserve a verified access path and independently confirm host keys.</text><text x="70" y="1182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#223a50">Packet capture / port scan require authorization; unknown ownership or identity → [Needs confirmation].</text><text x="47" y="1277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#55687d">Источник: Уорд · глава 10 · PDF/печатные с. 320–343 · RAG p0320:c01–p0343:c01 · fig. 10.1 not reconstructed</text></svg>