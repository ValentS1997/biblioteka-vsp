<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 14 — Рабочий стол Linux и печать</title>
<desc id="desc">Compact overview of Wayland, X, D-Bus and CUPS printing.</desc>
<rect x="0" y="0" width="1600" height="900" rx="16" fill="#f2f6fb"/><rect x="0" y="0" width="1600" height="132" rx="0" fill="#182b43"/>
<text x="48" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">ГЛАВА 14 · РАБОЧИЙ СТОЛ LINUX И ПЕЧАТЬ</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fb">Wayland • X • libinput • D-Bus • CUPS • printing pipeline</text><rect x="45" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="160" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">01 · DESKTOP STACK</text><text x="68" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Framebuffer</text><text x="68" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">X or Wayland</text><text x="68" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Window manager/compositor</text><text x="68" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Toolkit → desktop → apps</text><rect x="555" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="160" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">02 · WAYLAND</text><text x="578" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Client-owned buffers</text><text x="578" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Compositor combines frames</text><text x="578" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">libinput normalizes input</text><text x="578" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Xwayland keeps X apps working</text><rect x="1065" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1065" y="160" width="486" height="9" rx="5" fill="#7256a3"/><text x="1088" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7256a3">03 · X</text><text x="1088" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">X server mediates display/input</text><text x="1088" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">xwininfo / xev / xinput</text><text x="1088" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Display managers start sessions</text><text x="1088" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Network TCP mode is insecure</text><rect x="45" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="438" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">04 · D-BUS</text><text x="68" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">System bus</text><text x="68" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Session bus</text><text x="68" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Event/message relay</text><text x="68" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">dbus-monitor observes traffic</text><rect x="555" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="438" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">05 · PRINTING</text><text x="578" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">CUPS + IPP</text><text x="578" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Queue → filters → driver</text><text x="578" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Ghostscript / PPD</text><text x="578" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Backend sends to printer</text><rect x="1065" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1065" y="438" width="486" height="9" rx="5" fill="#b45d42"/><text x="1088" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d42">06 · OPERATOR RULE</text><text x="1088" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Identify owner layer</text><text x="1088" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Observe before changing</text><text x="1088" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Input/event monitors are sensitive</text><text x="1088" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Verify in fresh session/device</text><rect x="45" y="733" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#bb6449" stroke-width="2"/><text x="70" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#963e2d">OPERATOR RULE: identify Wayland/X and the owning component before changing input or display state.</text><text x="70" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Key/event monitoring and D-Bus observation can expose user activity; use only on authorized systems.</text><text x="48" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56697e">Уорд · глава 14 · PDF/печатные с. 402–418 · RAG p0402:c01–p0418:c01 · source-grounded</text></svg>