<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 14 — Подробная карта рабочего стола Linux и печати</title>
<desc id="desc">Detailed Wayland, X, libinput, D-Bus and CUPS map.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fb"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#172a42"/>
<text x="52" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 14 · ПОЛНАЯ КАРТА DESKTOP / PRINTING</text>
<text x="52" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5e8fb">Wayland • X/Xwayland • libinput • D-Bus • CUPS • print pipeline</text><rect x="43" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="163" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">01 · COMPONENTS</text><text x="66" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Framebuffer is final display memory</text><text x="66" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Window system mediates graphics/input</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Toolkits provide widgets/libraries</text><text x="66" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Desktop environment integrates apps</text><rect x="626" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="163" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">02 · WAYLAND</text><text x="649" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Clients render own buffers</text><text x="649" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Compositor combines buffers</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">WAYLAND_DISPLAY names socket</text><text x="649" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Weston is reference compositor</text><rect x="1209" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="163" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">03 · LIBINPUT</text><text x="1232" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Reads /dev/input events</text><text x="1232" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Normalizes kernel input</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Used by Wayland and many X systems</text><text x="1232" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">debug-events exposes key activity</text><rect x="43" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="445" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">04 · XWAYLAND</text><text x="66" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">X server runs as Wayland client</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Keeps X-only apps usable</text><text x="66" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Adds compatibility layer</text><text x="66" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Reverse model is not symmetric</text><rect x="626" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="445" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">05 · X SERVER</text><text x="649" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">X/Xorg owns display/input mediation</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">DISPLAY identifies X display</text><text x="649" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Display manager starts full session</text><text x="649" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">startx/xinit use different startup path</text><rect x="1209" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="445" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">06 · X DIAGNOSTICS</text><text x="1232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xwininfo → window ID/geometry</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xlsclients → clients/windows</text><text x="1232" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xev → X events</text><text x="1232" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xinput → devices/properties</text><rect x="43" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="727" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">07 · X SETTINGS</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xinput properties can be changed</text><text x="66" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">xmodmap/setxkbmap alter keys</text><text x="66" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Desktop may override low-level tools</text><text x="66" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Capture baseline before modifications</text><rect x="626" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="727" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">08 · D-BUS</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">System + session instances</text><text x="649" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">dbus-daemon relays messages</text><text x="649" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">System socket under /var/run/dbus</text><text x="649" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Monitor bus; do not edit system.conf</text><rect x="1209" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1209" y="727" width="548" height="9" rx="16" fill="#b45d42"/><text x="1232" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b45d42">09 · PRINTING</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">CUPS queue via IPP/631</text><text x="1232" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Filters/RIP transform documents</text><text x="1232" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Ghostscript + PPD guide raster output</text><text x="1232" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Backend delivers to printer</text><rect x="43" y="1025" width="1714" height="176" rx="16" fill="#ffece7" stroke="#c77357" stroke-width="2"/><text x="70" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983f2d">ACCEPTANCE / CHANGE CONTROL</text><text x="70" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Identify session stack and owning layer before changing display/input preferences.</text><text x="70" y="1145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Input-event and D-Bus monitors can reveal user/system activity; authorize and scope observation.</text><text x="70" y="1182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#223a50">For printer changes, prefer the owning GUI/CUPS path and verify queue → device end-to-end.</text><text x="47" y="1277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#55687d">Источник: Уорд · глава 14 · PDF/печатные с. 402–418 · RAG p0402:c01–p0418:c01 · source-grounded</text></svg>