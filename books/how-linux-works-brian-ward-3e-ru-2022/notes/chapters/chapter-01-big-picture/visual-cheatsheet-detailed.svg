<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" width="1800" height="1320" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Подробная карта Linux</title>
  <desc id="desc">Слои Linux; планирование CPU, MMU, драйверы, fork/exec, UID/root.</desc>
  <rect x="0" y="0" width="1800" height="1320" fill="#f1f6fc" rx="0" />
  <rect x="0" y="0" width="1800" height="133" fill="#172941" rx="0" />
  <text x="54" y="55" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="37" font-weight="750">Глава 1 — Подробная карта Linux</text>
  <text x="54" y="99" fill="#d7e7ff" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">Общая картина · абстракции → механизмы ядра → пользователи</text>
  <rect x="48" y="174" width="540" height="230" fill="#ffffff" rx="18" stroke="#22688a" stroke-width="2" />
  <rect x="48" y="174" width="540" height="10" fill="#22688a" rx="5" />
  <text x="72" y="225" fill="#22688a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">01 · USER SPACE</text>
  <text x="72" y="270" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Программы и процессы в user mode</text>
  <text x="72" y="304" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Примеры: браузер, службы и syslog</text>
  <text x="72" y="338" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Сервисы могут зависеть друг от друга</text>
  <text x="72" y="372" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Слои внутри user space условны</text>
  <rect x="632" y="174" width="540" height="230" fill="#ffffff" rx="18" stroke="#66529b" stroke-width="2" />
  <rect x="632" y="174" width="540" height="10" fill="#66529b" rx="5" />
  <text x="656" y="225" fill="#66529b" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">02 · KERNEL</text>
  <text x="656" y="270" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Посредник между программой и hardware</text>
  <text x="656" y="304" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Управляет процессами и RAM</text>
  <text x="656" y="338" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Драйверы, системные вызовы</text>
  <text x="656" y="372" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Kernel mode / защищённая область</text>
  <rect x="1216" y="174" width="536" height="230" fill="#ffffff" rx="18" stroke="#277452" stroke-width="2" />
  <rect x="1216" y="174" width="536" height="10" fill="#277452" rx="5" />
  <text x="1240" y="225" fill="#277452" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">03 · HARDWARE</text>
  <text x="1240" y="270" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">CPU: инструкции и вычисления</text>
  <text x="1240" y="304" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">RAM: состояние ядра и процессов</text>
  <text x="1240" y="338" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Диски, сетевые интерфейсы</text>
  <text x="1240" y="372" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Разграничение операций — через ядро</text>
  <text x="595" y="302" fill="#4e6480" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">↔</text>
  <text x="1176" y="302" fill="#4e6480" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">↔</text>
  <text x="48" y="458" fill="#193650" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">ОСНОВНЫЕ ФУНКЦИИ ЯДРА</text>
  <rect x="48" y="479" width="401" height="255" fill="#ffffff" rx="18" stroke="#22688a" stroke-width="2" />
  <rect x="48" y="479" width="401" height="10" fill="#22688a" rx="5" />
  <text x="72" y="530" fill="#22688a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ПРОЦЕССЫ</text>
  <text x="72" y="575" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Временные кванты CPU</text>
  <text x="72" y="610" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Таймерное прерывание</text>
  <text x="72" y="645" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Сохранение контекста</text>
  <text x="72" y="680" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Выбор следующего процесса</text>
  <rect x="481" y="479" width="401" height="255" fill="#ffffff" rx="18" stroke="#66529b" stroke-width="2" />
  <rect x="481" y="479" width="401" height="10" fill="#66529b" rx="5" />
  <text x="505" y="530" fill="#66529b" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ПАМЯТЬ</text>
  <text x="505" y="575" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Изоляция и разделение</text>
  <text x="505" y="610" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Виртуальные адреса → MMU</text>
  <text x="505" y="645" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Таблицы страниц</text>
  <text x="505" y="680" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Ядро обновляет отображения</text>
  <rect x="914" y="479" width="401" height="255" fill="#ffffff" rx="18" stroke="#277452" stroke-width="2" />
  <rect x="914" y="479" width="401" height="10" fill="#277452" rx="5" />
  <text x="938" y="530" fill="#277452" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ДРАЙВЕРЫ</text>
  <text x="938" y="575" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Устройства обычно через ядро</text>
  <text x="938" y="610" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Унификация интерфейсов</text>
  <text x="938" y="645" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Диски / сетевые адаптеры</text>
  <text x="938" y="680" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Скрытие аппаратных различий</text>
  <rect x="1347" y="479" width="405" height="255" fill="#ffffff" rx="18" stroke="#a8662a" stroke-width="2" />
  <rect x="1347" y="479" width="405" height="10" fill="#a8662a" rx="5" />
  <text x="1371" y="530" fill="#a8662a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">SYSTEM CALLS</text>
  <text x="1371" y="575" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Запрос процесса к ядру</text>
  <text x="1371" y="610" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Чтение / запись файлов</text>
  <text x="1371" y="645" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">fork() создаёт копию процесса</text>
  <text x="1371" y="680" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">exec() запускает программу</text>
  <text x="48" y="787" fill="#193650" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">ПРИМЕРЫ ПОВЕДЕНИЯ И ГРАНИЦ</text>
  <rect x="48" y="807" width="827" height="303" fill="#ffffff" rx="18" stroke="#22688a" stroke-width="2" />
  <rect x="48" y="807" width="827" height="10" fill="#22688a" rx="5" />
  <text x="72" y="858" fill="#22688a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ПЕРЕКЛЮЧЕНИЕ КОНТЕКСТА</text>
  <text x="72" y="903" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">1. Таймер завершает квант; вход в kernel mode</text>
  <text x="72" y="942" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">2. Ядро сохраняет состояние и выполняет задачи</text>
  <text x="72" y="981" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">3. Планировщик выбирает готовый процесс</text>
  <text x="72" y="1020" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">4. Подготавливаются память, CPU и новый квант</text>
  <text x="72" y="1059" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">5. Возврат в user mode — продолжение процесса</text>
  <rect x="925" y="807" width="827" height="303" fill="#ffffff" rx="18" stroke="#a8662a" stroke-width="2" />
  <rect x="925" y="807" width="827" height="10" fill="#a8662a" rx="5" />
  <text x="949" y="858" fill="#a8662a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ЗАПУСК ПРОЦЕССА И ПРАВА</text>
  <text x="949" y="903" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Shell → fork() → дочерний процесс → exec(ls)</text>
  <text x="949" y="942" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">fork()/exec() — API, не shell-команды</text>
  <text x="949" y="981" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">UID связывает пользователя с процессами и файлами</text>
  <text x="949" y="1020" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">groups позволяют совместный доступ к файлам</text>
  <text x="949" y="1059" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">root обладает особыми правами, остаётся user mode</text>
  <rect x="48" y="1142" width="1704" height="116" fill="#e0eaf5" rx="16" />
  <text x="77" y="1180" fill="#24415c" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">OPERATIONAL BOUNDARY</text>
  <text x="77" y="1214" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">В главе нет диагностического runbook и действий по изменению конфигурации.</text>
  <text x="77" y="1243" fill="#21344a" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">ls — пример read-only команды; рисунки 1.1–1.3 не воспроизведены из графики PDF.</text>
  <text x="51" y="1297" fill="#5a6d81" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">Уорд · глава 1 · PDF/печатные с. 28–38 · p0028:c01–p0038:c01 · текстовая схема, не копия рисунков</text>
</svg>