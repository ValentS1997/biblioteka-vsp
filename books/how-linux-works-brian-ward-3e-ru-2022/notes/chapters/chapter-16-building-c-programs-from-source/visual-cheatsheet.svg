<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 16 — Компиляция программ из исходного кода на языке C</title>
<desc id="desc">Compact source-build workflow with Autoconf, make, pkg-config and patch safety boundaries.</desc>
<rect x="0" y="0" width="1600" height="900" rx="16" fill="#f2f6fb"/><rect x="0" y="0" width="1600" height="132" rx="0" fill="#182b43"/>
<text x="48" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#ffffff">ГЛАВА 16 · СБОРКА ПРОГРАММ ИЗ ИСХОДНОГО КОДА</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fb">archive • configure • make • pkg-config • patch • install</text><rect x="45" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="160" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">01 · INSPECT</text><text x="68" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">List archive before extract</text><text x="68" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Read README / INSTALL</text><text x="68" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Use isolated source tree</text><text x="68" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Absolute paths = trust warning</text><rect x="555" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="160" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">02 · CONFIGURE</text><text x="578" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">./configure probes host</text><text x="578" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">--prefix controls install root</text><text x="578" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">CPPFLAGS / CFLAGS / LDFLAGS</text><text x="578" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">config.log explains failures</text><rect x="1065" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1065" y="160" width="486" height="9" rx="5" fill="#7256a3"/><text x="1088" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7256a3">03 · BUILD / TEST</text><text x="1088" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">make builds targets</text><text x="1088" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">make check runs tests</text><text x="1088" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">distclean resets generated state</text><text x="1088" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Recursive make errors propagate</text><rect x="45" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="438" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">04 · INSTALL</text><text x="68" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">make -n install first</text><text x="68" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Then make install</text><text x="68" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">/usr/local for local software</text><text x="68" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Package wrapper can track files</text><rect x="555" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="438" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">05 · DEPENDENCIES</text><text x="578" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">pkg-config reads .pc metadata</text><text x="578" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">PKG_CONFIG_PATH adds search path</text><text x="578" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">rpath affects runtime linking</text><text x="578" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Patch paths depend on -p level</text><rect x="1065" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1065" y="438" width="486" height="9" rx="5" fill="#b45d42"/><text x="1088" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d42">06 · OPERATOR RULE</text><text x="1088" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Find first causal error</text><text x="1088" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Change narrow flag/path</text><text x="1088" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Prefer isolated prefix</text><text x="1088" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Unknown rollback → STOP</text><rect x="45" y="733" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#bb6449" stroke-width="2"/><text x="70" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#963e2d">OPERATOR RULE: inspect → configure → build/test → dry-run install → apply → verify.</text><text x="70" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Use isolated prefixes and read config.log before guessing at configure failures.</text><text x="48" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56697e">Уорд · глава 16 · PDF/печатные с. 442–457 · RAG p0442:c01–p0457:c01 · source-grounded</text></svg>