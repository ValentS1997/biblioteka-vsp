<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 4 — Подробная карта дисков и файловых систем</title>
<desc id="desc">Девять блоков: partitioning, VFS, mount, capacity, fsck, swap, LVM, inode, safety.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fc"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#162941"/>
<text x="52" y="56" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 4 · ПОЛНАЯ КАРТА ХРАНЕНИЯ LINUX</text>
<text x="52" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fc">Разметка → FS → mount → LVM → inode • диагностика / риск / rollback</text>
<rect x="43" y="162" width="548" height="248" rx="16" fill="#ffffff" stroke="#2b6d9e" stroke-width="2"/><rect x="43" y="162" width="548" height="10" rx="16" fill="#2b6d9e"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#2b6d9e">01 · PARTITION TABLE</text><text x="66" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">MBR / GPT задают границы блоков</text><text x="66" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">parted -l; fdisk -l; lsblk</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">fdisk q ≠ fdisk w</text><text x="66" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">parted меняет таблицу сразу</text><rect x="626" y="162" width="548" height="248" rx="16" fill="#ffffff" stroke="#227e65" stroke-width="2"/><rect x="626" y="162" width="548" height="10" rx="16" fill="#227e65"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#227e65">02 · FILESYSTEM + VFS</text><text x="649" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">mkfs — новая структура FS</text><text x="649" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">ext2/3/4, Btrfs, XFS и FAT</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">VFS — единый интерфейс приложений</text><text x="649" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Повторный mkfs уничтожает данные</text><rect x="1209" y="162" width="548" height="248" rx="16" fill="#ffffff" stroke="#7057a3" stroke-width="2"/><rect x="1209" y="162" width="548" height="10" rx="16" fill="#7057a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7057a3">03 · MOUNT + FSTAB</text><text x="1232" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">mount → текущее состояние</text><text x="1232" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">/etc/fstab → постоянные записи</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">UUID через blkid, а не букву sdX</text><text x="1232" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">ro/rw, noexec, nosuid, noauto</text><rect x="43" y="445" width="548" height="248" rx="16" fill="#ffffff" stroke="#2b6d9e" stroke-width="2"/><rect x="43" y="445" width="548" height="10" rx="16" fill="#2b6d9e"/><text x="66" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#2b6d9e">04 · SPACE / CACHE</text><text x="66" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">df → ёмкость FS; du → каталоги</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Reserved blocks могут скрывать место</text><text x="66" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">sync записывает грязные буферы</text><text x="66" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">swap: free, swapon, swapoff</text><rect x="626" y="445" width="548" height="248" rx="16" fill="#ffffff" stroke="#b35e42" stroke-width="2"/><rect x="626" y="445" width="548" height="10" rx="16" fill="#b35e42"/><text x="649" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b35e42">05 · FSCK / REPAIR</text><text x="649" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Отмонтировать FS перед проверкой</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">fsck -n: оценка без исправления</text><text x="649" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Backup superblocks: отдельный риск</text><text x="649" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">lost+found: осиротевшие inode</text><rect x="1209" y="445" width="548" height="248" rx="16" fill="#ffffff" stroke="#227e65" stroke-width="2"/><rect x="1209" y="445" width="548" height="10" rx="16" fill="#227e65"/><text x="1232" y="494" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#227e65">06 · PV / VG / LV</text><text x="1232" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">PV — физический том</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">VG — пул физических экстентов</text><text x="1232" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">LV — блочное устройство из VG</text><text x="1232" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">pvs / vgs / lvs → baseline</text><rect x="43" y="728" width="548" height="248" rx="16" fill="#ffffff" stroke="#7057a3" stroke-width="2"/><rect x="43" y="728" width="548" height="10" rx="16" fill="#7057a3"/><text x="66" y="777" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7057a3">07 · LVM / DEVICE MAPPER</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">LVM анализирует метаданные в user space</text><text x="66" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Kernel dm переводит logical blocks</text><text x="66" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">dmsetup info / table: mapping</text><text x="66" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">lvresize и resize FS — разные шаги</text><rect x="626" y="728" width="548" height="248" rx="16" fill="#ffffff" stroke="#2b6d9e" stroke-width="2"/><rect x="626" y="728" width="548" height="10" rx="16" fill="#2b6d9e"/><text x="649" y="777" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#2b6d9e">08 · INODE + HARD LINK</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Каталог: имя → номер inode</text><text x="649" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">inode → права и data blocks</text><text x="649" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">ln создаёт второе имя same inode</text><text x="649" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">rm уменьшает link count</text><rect x="1209" y="728" width="548" height="248" rx="16" fill="#ffffff" stroke="#b35e42" stroke-width="2"/><rect x="1209" y="728" width="548" height="10" rx="16" fill="#b35e42"/><text x="1232" y="777" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b35e42">09 · ROLLBACK FIRST</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Знать target и отсутствие users</text><text x="1232" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Backup подтверждён до изменения</text><text x="1232" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">mkfs / lvremove / fsck: особый риск</text><text x="1232" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#233b53">Нет плана → [Needs confirmation]</text><rect x="43" y="1030" width="1714" height="172" rx="16" fill="#ffece7" stroke="#c67458" stroke-width="2"/><text x="70" y="1070" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983e2b">ACCEPTANCE / CHANGE CONTROL</text><text x="70" y="1110" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#233b53">До работы: lsblk + parted/blkid + mount + pvs/vgs/lvs; подтверждён backup и идентификатор диска.</text><text x="70" y="1147" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#233b53">После работы: повторный readback таблицы / mount / df / LVM; рискованное исправление — не автоматическое.</text><text x="70" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#983e2b">При неизвестных данных или rollback: STOP — [Needs confirmation].</text><text x="47" y="1274" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#54667d">Источник: Уорд · глава 4 · PDF/печатные с. 102–155 · RAG p0102:c01–p0155:c01 · не копия рисунков автора</text>
</svg>