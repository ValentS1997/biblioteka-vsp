<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 4 — Диски и файловые системы Linux</title><desc id="desc">Шесть ключевых блоков: разделы, файловые системы, занятость, LVM, inode и опасные операции.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f2f6fc"/><rect x="0" y="0" width="1600" height="130" rx="0" fill="#182a42"/>
<text x="48" y="56" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 4 · ДИСКИ И ФАЙЛОВЫЕ СИСТЕМЫ</text>
<text x="48" y="99" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#d3e6fa">Partition → Filesystem → Mount → LVM → Inode</text>
<rect x="45" y="162" width="487" height="243" rx="17" fill="#ffffff" stroke="#276fa2" stroke-width="2"/><rect x="45" y="162" width="487" height="10" rx="5" fill="#276fa2"/><text x="68" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#276fa2">01 · DISK / PARTITIONS</text><text x="68" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">Block device → MBR / GPT</text><text x="68" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">parted -l; fdisk -l; lsblk</text><text x="68" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">Изменение границ опасно</text><rect x="557" y="162" width="487" height="243" rx="17" fill="#ffffff" stroke="#207963" stroke-width="2"/><rect x="557" y="162" width="487" height="10" rx="5" fill="#207963"/><text x="580" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#207963">02 · FILESYSTEM / VFS</text><text x="580" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">mkfs создаёт структуру файлов</text><text x="580" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">mount связывает каталог и FS</text><text x="580" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">UUID / blkid; fstab для boot</text><rect x="1069" y="162" width="487" height="243" rx="17" fill="#ffffff" stroke="#7855a6" stroke-width="2"/><rect x="1069" y="162" width="487" height="10" rx="5" fill="#7855a6"/><text x="1092" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7855a6">03 · SPACE / RECOVERY</text><text x="1092" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">df / du / free; swap</text><text x="1092" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">fsck только при безопасном state</text><text x="1092" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">Сохранить backup до repair</text><rect x="45" y="439" width="487" height="243" rx="17" fill="#ffffff" stroke="#276fa2" stroke-width="2"/><rect x="45" y="439" width="487" height="10" rx="5" fill="#276fa2"/><text x="68" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#276fa2">04 · PV → VG → LV</text><text x="68" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">LVM объединяет блочные тома</text><text x="68" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">pvs / vgs / lvs для проверки</text><text x="68" y="622" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">dmsetup показывает mapping</text><rect x="557" y="439" width="487" height="243" rx="17" fill="#ffffff" stroke="#207963" stroke-width="2"/><rect x="557" y="439" width="487" height="10" rx="5" fill="#207963"/><text x="580" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#207963">05 · INODE / DIRECTORY</text><text x="580" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">Имя каталога → inode → blocks</text><text x="580" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">ln: два имени одного inode</text><text x="580" y="622" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">ls -i / stat: номер и links</text><rect x="1069" y="439" width="487" height="243" rx="17" fill="#ffffff" stroke="#b45d3f" stroke-width="2"/><rect x="1069" y="439" width="487" height="10" rx="5" fill="#b45d3f"/><text x="1092" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d3f">06 · CHANGE BOUNDARY</text><text x="1092" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">fdisk w / parted: запись</text><text x="1092" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">mkfs / lvremove: потеря данных</text><text x="1092" y="622" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">Rollback [Needs confirmation]</text><rect x="45" y="734" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#b65e42" stroke-width="2"/><text x="72" y="772" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#993d2e">SAFETY: сначала определить устройство и mount state; затем backup и проверенный rollback.</text><text x="72" y="810" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#23384f">fsck на mounted RW FS запрещён; fdisk w, mkfs, lvremove и resize требуют отдельного change plan.</text><text x="48" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6b80">Уорд · глава 4 · PDF/печатные с. 102–155 · RAG p0102:c01–p0155:c01 · текстовая схема</text>
</svg>