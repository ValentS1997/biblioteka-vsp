<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 13 — Подробная карта пользовательского окружения</title>
<desc id="desc">Detailed startup-file map covering PATH, prompt, aliases, umask, bash startup order, defaults and rollout validation.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fb"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#172a42"/>
<text x="52" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 13 · ПОЛНАЯ КАРТА USER ENVIRONMENT</text>
<text x="52" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5e8fb">startup files • PATH • prompt • umask • bash modes • defaults • rollout</text><rect x="43" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="163" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">01 · DESIGN</text><text x="66" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Startup files are executable policy</text><text x="66" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Keep few, short and readable</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Comment shared defaults</text><text x="66" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Only edit for a clear reason</text><rect x="626" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="163" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">02 · PATH</text><text x="649" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Order controls executable precedence</text><text x="649" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/usr/local before system paths</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">User bin may precede system paths</text><text x="649" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Do not put . in PATH</text><rect x="1209" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="163" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">03 · PROMPT / ALIASES</text><text x="1232" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Prompt should show useful context only</text><text x="1232" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Avoid shell metacharacters</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Aliases can hide standard behavior</text><text x="1232" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Functions/scripts are clearer</text><rect x="43" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="445" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">04 · UMASK</text><text x="66" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">077 favors privacy</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">022 favors shared readability</text><text x="66" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Creation mode still matters</text><text x="66" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Applications may override</text><rect x="626" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="445" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">05 · BASH LOGIN</text><text x="649" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/etc/profile first</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Then first user login file</text><text x="649" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">.bash_profile/.bash_login/.profile</text><text x="649" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Source model is mode-dependent</text><rect x="1209" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="445" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">06 · BASH NON-LOGIN</text><text x="1232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/etc/bash.bashrc then ~/.bashrc</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">$0 helps identify login shell</text><text x="1232" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">$- can distinguish interactive</text><text x="1232" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Shared bashrc reduces divergence</text><rect x="43" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="727" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">07 · DEFAULT ENV</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">EDITOR / VISUAL</text><text x="66" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">PAGER / LESS</text><text x="66" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">PATH + PS1 + umask</text><text x="66" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Values are policy, not universal</text><rect x="626" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="727" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">08 · ROLLOUT</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Create clean test user</text><text x="649" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Test console/remote/GUI paths</text><text x="649" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Create second clean user</text><text x="649" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Distribute only after repeatability</text><rect x="1209" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1209" y="727" width="548" height="9" rx="16" fill="#b45d42"/><text x="1232" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b45d42">09 · PITFALLS</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">No GUI commands in generic rc</text><text x="1232" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Do not set DISPLAY/terminal type</text><text x="1232" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Do not emit stdout</text><text x="1232" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Do not set LD_LIBRARY_PATH</text><rect x="43" y="1025" width="1714" height="176" rx="16" fill="#ffece7" stroke="#c77357" stroke-width="2"/><text x="70" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983f2d">ACCEPTANCE / ROLLBACK</text><text x="70" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Capture current startup file and environment; verify in fresh login and non-login sessions.</text><text x="70" y="1145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Shared defaults require clean-user tests across every supported login path before rollout.</text><text x="70" y="1182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#223a50">Unknown startup ownership/order or distro behavior → [Needs confirmation].</text><text x="47" y="1277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#55687d">Источник: Уорд · глава 13 · PDF/печатные с. 390–401 · RAG p0390:c01–p0401:c01 · source-grounded</text></svg>