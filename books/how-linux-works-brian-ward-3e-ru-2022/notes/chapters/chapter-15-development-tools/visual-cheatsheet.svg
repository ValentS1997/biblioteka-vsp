<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 15 — Инструменты разработки</title>
<desc id="desc">Compact overview of C compilation, shared libraries, make, scripting languages and Java.</desc>
<rect x="0" y="0" width="1600" height="900" rx="16" fill="#f2f6fb"/><rect x="0" y="0" width="1600" height="132" rx="0" fill="#182b43"/>
<text x="48" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 15 · ИНСТРУМЕНТЫ РАЗРАБОТКИ</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fb">compiler • linker • shared libraries • make • scripts • Java</text><rect x="45" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="160" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">01 · C BUILD</text><text x="68" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">.c → preprocessor → compiler</text><text x="68" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">-c creates .o</text><text x="68" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Linker combines objects/libs</text><text x="68" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">-I / -L / -l control search</text><rect x="555" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="160" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">02 · SHARED LIBS</text><text x="578" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">.so resolved at runtime</text><text x="578" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">ldd shows dependencies</text><text x="578" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">ld.so cache/rpath matter</text><text x="578" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Avoid global LD_LIBRARY_PATH</text><rect x="1065" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1065" y="160" width="486" height="9" rx="5" fill="#7256a3"/><text x="1088" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7256a3">03 · MAKE</text><text x="1088" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Targets + dependencies + rules</text><text x="1088" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Built-in rules compile .c → .o</text><text x="1088" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Timestamp-driven rebuilds</text><text x="1088" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">make -n previews commands</text><rect x="45" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="438" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">04 · SAFE INSTALL</text><text x="68" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Inspect install target</text><text x="68" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Run make -n install</text><text x="68" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Then apply if expected</text><text x="68" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Verify installed files/runtime</text><rect x="555" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="438" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">05 · OTHER TOOLS</text><text x="578" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">flex / bison</text><text x="578" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Python / Perl / others</text><text x="578" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Java source → bytecode</text><text x="578" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">JRE/JDK separate roles</text><rect x="1065" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1065" y="438" width="486" height="9" rx="5" fill="#b45d42"/><text x="1088" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d42">06 · OPERATOR RULE</text><text x="1088" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Diagnose exact build stage</text><text x="1088" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Change narrow dependency/flag</text><text x="1088" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Treat Makefiles as executable code</text><text x="1088" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Unknown global impact → STOP</text><rect x="45" y="733" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#bb6449" stroke-width="2"/><text x="70" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#963e2d">OPERATOR RULE: classify preprocess/compile/link/runtime stage before changing flags or paths.</text><text x="70" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Use make -n install before installation; avoid global loader-path hacks.</text><text x="48" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56697e">Уорд · глава 15 · PDF/печатные с. 419–441 · RAG p0419:c01–p0441:c01 · source-grounded</text></svg>