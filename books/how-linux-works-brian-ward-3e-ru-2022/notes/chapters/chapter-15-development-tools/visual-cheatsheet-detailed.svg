<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 15 — Подробная карта инструментов разработки</title>
<desc id="desc">Detailed compiler, linker, shared-library, make, scripting and Java overview.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fb"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#172a42"/>
<text x="52" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 15 · ПОЛНАЯ КАРТА DEVELOPMENT TOOLS</text>
<text x="52" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5e8fb">C compiler • linker • shared libraries • make • interpreters • Java</text><rect x="43" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="163" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">01 · SOURCE → OBJECT</text><text x="66" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">.c source goes through preprocessor</text><text x="66" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Compiler emits .o with -c</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Object is not final runnable program</text><text x="66" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Multiple objects feed final link</text><rect x="626" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="163" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">02 · LINKING</text><text x="649" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">cc can invoke linker for final executable</text><text x="649" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">-l selects library name</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">-L adds link-time library path</text><text x="649" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Undefined reference needs stage diagnosis</text><rect x="1209" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="163" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">03 · SHARED LIBRARIES</text><text x="1232" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">.a copies code into executable</text><text x="1232" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">.so leaves runtime references</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">ldd shows resolved dependencies</text><text x="1232" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">ld.so resolves at program start</text><rect x="43" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="445" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">04 · LOADER SEARCH</text><text x="66" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">rpath can be embedded at build time</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">System cache comes from loader config</text><text x="66" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">ldconfig rebuilds cache</text><text x="66" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Global LD_LIBRARY_PATH is discouraged</text><rect x="626" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="445" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">05 · HEADERS / CPP</text><text x="649" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">-I adds include directory</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">#include inserts headers</text><text x="649" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">#define creates macros</text><text x="649" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">#if/#ifdef gate source fragments</text><rect x="1209" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="445" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">06 · MAKE MODEL</text><text x="1232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Target depends on prerequisites</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Rule recipe updates target</text><text x="1232" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Timestamp changes trigger rebuilds</text><text x="1232" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Built-in rules know common transforms</text><rect x="43" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="727" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">07 · MAKE VARIABLES</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">CC / CFLAGS / CPPFLAGS</text><text x="66" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">LDFLAGS / LDLIBS / CXXFLAGS</text><text x="66" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">$@ target, $&lt; first prerequisite</text><text x="66" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">First target is default</text><rect x="626" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="727" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">08 · STANDARD TARGETS</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">clean/distclean remove build outputs</text><text x="649" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">install copies into system locations</text><text x="649" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">test/check validate build</text><text x="649" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">make -n install is safety preview</text><rect x="1209" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1209" y="727" width="548" height="9" rx="16" fill="#b45d42"/><text x="1232" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b45d42">09 · OTHER LANGUAGES</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">flex/bison generate parser-related code</text><text x="1232" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Scripts depend on shebang interpreter</text><text x="1232" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Python/Perl and others run via interpreters</text><text x="1232" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Java source → bytecode → JRE</text><rect x="43" y="1025" width="1714" height="176" rx="16" fill="#ffece7" stroke="#c77357" stroke-width="2"/><text x="70" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983f2d">ACCEPTANCE / CHANGE CONTROL</text><text x="70" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Classify failure stage first; inspect dependency/path evidence before changing build flags.</text><text x="70" y="1145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Shared-library config and make install can affect the wider system; preview and capture baseline.</text><text x="70" y="1182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#223a50">Unknown loader path, package ownership or install rollback → [Needs confirmation].</text><text x="47" y="1277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#55687d">Источник: Уорд · глава 15 · PDF/печатные с. 419–441 · RAG p0419:c01–p0441:c01 · fig. 15.1 not reconstructed</text></svg>