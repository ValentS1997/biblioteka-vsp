<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1310" role="img" aria-labelledby="title desc">
<title id="title">Глава 9 — Подробная карта сети Linux</title>
<desc id="desc">Detailed network layers, routing, DNS, transport, managers, firewall and Wi-Fi overview.</desc>
<rect x="0" y="0" width="1800" height="1310" rx="16" fill="#f1f6fb"/><rect x="0" y="0" width="1800" height="132" rx="16" fill="#172a42"/>
<text x="52" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 9 · ПОЛНАЯ КАРТА NETWORKING</text>
<text x="52" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5e8fb">layers • IPv4/IPv6 • routing • DNS • TCP/UDP • NAT/firewall • Wi-Fi</text><rect x="43" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="163" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">01 · NETWORK STACK</text><text x="66" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Application: HTTP/TLS/DNS</text><text x="66" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Transport: TCP/UDP</text><text x="66" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Network: IPv4/IPv6</text><text x="66" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Physical: Ethernet/Wi-Fi</text><rect x="626" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="163" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">02 · IP / CIDR</text><text x="649" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Address + prefix define subnet</text><text x="649" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/24 is common example</text><text x="649" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">IPv6 uses 128-bit addresses</text><text x="649" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Dual stack keeps v4/v6 independent</text><rect x="1209" y="163" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="163" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">03 · ROUTING</text><text x="1232" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Kernel routing table</text><text x="1232" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Longest matching prefix wins</text><text x="1232" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Default route is catch-all</text><text x="1232" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Gateway must be locally reachable</text><rect x="43" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="445" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">04 · INTERFACES</text><text x="66" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Kernel interface joins link/IP</text><text x="66" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Predictable names such as enp*</text><text x="66" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">MAC belongs to Ethernet layer</text><text x="66" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Live state via ip</text><rect x="626" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="445" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">05 · CONFIG OWNERSHIP</text><text x="649" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Netplan YAML can feed backends</text><text x="649" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">NetworkManager is dynamic manager</text><text x="649" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">networkd fits simpler/server roles</text><text x="649" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Do not mix owners blindly</text><rect x="1209" y="445" width="548" height="247" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1209" y="445" width="548" height="9" rx="16" fill="#7256a3"/><text x="1232" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#7256a3">06 · NAME RESOLUTION</text><text x="1232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">NSS chooses lookup order</text><text x="1232" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/etc/hosts local override</text><text x="1232" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Resolver/DNS + caching daemon</text><text x="1232" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">resolv.conf may be generated</text><rect x="43" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#286e9d" stroke-width="2"/><rect x="43" y="727" width="548" height="9" rx="16" fill="#286e9d"/><text x="66" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#286e9d">07 · TRANSPORT</text><text x="66" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">TCP connection = address+port pair</text><text x="66" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Listener exposes local service port</text><text x="66" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">UDP sends independent datagrams</text><text x="66" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">/etc/services maps common ports</text><rect x="626" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="626" y="727" width="548" height="9" rx="16" fill="#247d61"/><text x="649" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#247d61">08 · ROUTER / FIREWALL</text><text x="649" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Forwarding joins subnets</text><text x="649" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">NAT translates private IPv4</text><text x="649" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">INPUT/OUTPUT/FORWARD chains</text><text x="649" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Rules are ordered; first match wins</text><rect x="1209" y="727" width="548" height="247" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1209" y="727" width="548" height="9" rx="16" fill="#b45d42"/><text x="1232" y="775" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#b45d42">09 · NEIGHBOR / WI-FI</text><text x="1232" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">ARP resolves IPv4 neighbor MAC</text><text x="1232" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">NDP serves IPv6 neighbor discovery</text><text x="1232" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">Wi-Fi adds SSID/auth/encryption</text><text x="1232" y="927" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#223a50">iw and wpa_supplicant handle link</text><rect x="43" y="1025" width="1714" height="176" rx="16" fill="#ffece7" stroke="#c77357" stroke-width="2"/><text x="70" y="1067" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#983f2d">ACCEPTANCE / CHANGE CONTROL</text><text x="70" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">Before change: capture addresses, routes, resolver, listeners and owning network manager.</text><text x="70" y="1145" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#223a50">For remote firewall/routing work, preserve a known-good alternate access/recovery path.</text><text x="70" y="1182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#223a50">Unknown interface, gateway, manager or rollback → [Needs confirmation].</text><text x="47" y="1277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#55687d">Источник: Уорд · глава 9 · PDF/печатные с. 270–319 · RAG p0270:c01–p0319:c01 · figures 9.1–9.7 not reconstructed</text></svg>