<title id="title">Глава 9 — Сеть и ее конфигурация</title>
<desc id="desc">Compact network stack, IP routing, DNS, transport, firewall and Wi-Fi overview.</desc>
<rect x="0" y="0" width="1600" height="900" rx="16" fill="#f2f6fb"/><rect x="0" y="0" width="1600" height="132" rx="0" fill="#182b43"/>
<text x="48" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">ГЛАВА 9 · СЕТЬ И ЕЕ КОНФИГУРАЦИЯ</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#d4e7fb">layers • IP/CIDR • routing • DNS • TCP/UDP • firewall • Wi-Fi</text><rect x="45" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="160" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">01 · STACK</text><text x="68" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Application → transport</text><text x="68" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Transport → network</text><text x="68" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Network → physical/link</text><text x="68" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Troubleshoot by layer</text><rect x="555" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="160" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">02 · IP / ROUTES</text><text x="578" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Address + CIDR</text><text x="578" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Longest-prefix route</text><text x="578" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Default gateway</text><text x="578" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">IPv4 + IPv6 dual stack</text><rect x="1065" y="160" width="486" height="242" rx="16" fill="#ffffff" stroke="#7256a3" stroke-width="2"/><rect x="1065" y="160" width="486" height="9" rx="5" fill="#7256a3"/><text x="1088" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#7256a3">03 · DNS / PORTS</text><text x="1088" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">NSS → hosts → DNS</text><text x="1088" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">TCP/UDP ports</text><text x="1088" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Listeners vs connections</text><text x="1088" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Loopback 127/8 and ::1</text><rect x="45" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#286f9d" stroke-width="2"/><rect x="45" y="438" width="486" height="9" rx="5" fill="#286f9d"/><text x="68" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#286f9d">04 · MANAGERS</text><text x="68" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">NetworkManager</text><text x="68" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Netplan / networkd</text><text x="68" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Runtime vs persistent state</text><text x="68" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Identify owner before edit</text><rect x="555" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#247d61" stroke-width="2"/><rect x="555" y="438" width="486" height="9" rx="5" fill="#247d61"/><text x="578" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#247d61">05 · ROUTER POLICY</text><text x="578" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Forwarding</text><text x="578" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Private IPv4 + NAT</text><text x="578" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Firewall chains</text><text x="578" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">First matching rule wins</text><rect x="1065" y="438" width="486" height="242" rx="16" fill="#ffffff" stroke="#b45d42" stroke-width="2"/><rect x="1065" y="438" width="486" height="9" rx="5" fill="#b45d42"/><text x="1088" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b45d42">06 · ETHERNET / WI-FI</text><text x="1088" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">MAC + frames</text><text x="1088" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">ARP / NDP neighbors</text><text x="1088" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">SSID/auth/encryption</text><text x="1088" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">iw + wpa_supplicant</text><rect x="45" y="733" width="1510" height="104" rx="16" fill="#ffeae4" stroke="#bb6449" stroke-width="2"/><text x="70" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#963e2d">OPERATOR RULE: prove link → address → route → DNS → transport before changing policy.</text><text x="70" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#22394f">Remote route/firewall changes require a known recovery path; unknown owner/target → STOP.</text><text x="48" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56697e">Уорд · глава 9 · PDF/печатные с. 270–319 · RAG p0270:c01–p0319:c01 · source-grounded</text></svg>