<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f4f6f8"/>
<rect width="1400" height="110" fill="#1e293b"/>
<text x="45" y="50" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">ГЛАВА 9 · БИБЛИОГРАФИЯ</text>
<text x="45" y="86" font-family="Arial,sans-serif" font-size="19" fill="#dbe5ef">153 references • provenance map • chapters 1–8 → original sources</text>
<g font-family="Arial,sans-serif" fill="#243447">
<rect x="40" y="145" width="410" height="230" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="65" y="190" font-size="22" font-weight="700" fill="#365f91">SCOPE</text>
<text x="65" y="235" font-size="18">PDF 699–707</text>
<text x="65" y="270" font-size="18">p0699:c01–p0707:c01</text>
<text x="65" y="305" font-size="18">entries 1–153</text>
<text x="65" y="340" font-size="18">p0708 → Appendix A</text>

<rect x="495" y="145" width="410" height="230" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/>
<text x="520" y="190" font-size="22" font-weight="700" fill="#2d7d63">PURPOSE</text>
<text x="520" y="235" font-size="18">trace textbook citations</text>
<text x="520" y="270" font-size="18">identify author/title/year</text>
<text x="520" y="305" font-size="18">locate deeper source</text>
<text x="520" y="340" font-size="18">separate citation from verification</text>

<rect x="950" y="145" width="410" height="230" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/>
<text x="975" y="190" font-size="22" font-weight="700" fill="#7656a5">DOMAINS</text>
<text x="975" y="235" font-size="18">CPU / microarchitecture</text>
<text x="975" y="270" font-size="18">OS / memory / storage</text>
<text x="975" y="305" font-size="18">parallel / distributed systems</text>
<text x="975" y="340" font-size="18">I/O / security / history</text>

<rect x="40" y="415" width="630" height="230" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/>
<text x="65" y="460" font-size="22" font-weight="700" fill="#b15d45">CORRECT USE</text>
<text x="65" y="505" font-size="18">chapter claim → cited author → bibliography entry</text>
<text x="65" y="540" font-size="18">→ external paper/book only in separate research workflow</text>
<text x="65" y="575" font-size="18">bibliography metadata is a locator, not external proof</text>
<text x="65" y="610" font-size="18">do not invent DOI / URL / corrected metadata</text>

<rect x="710" y="415" width="650" height="230" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="735" y="460" font-size="22" font-weight="700" fill="#365f91">CHAPTER EXCEPTION</text>
<text x="735" y="505" font-size="18">no instructional summary</text>
<text x="735" y="540" font-size="18">no review questions</text>
<text x="735" y="575" font-size="18">no operational commands</text>
<text x="735" y="610" font-size="18">required artifacts mark N/A instead of inventing content</text>

<rect x="40" y="685" width="1320" height="90" rx="14" fill="#e8eef5" stroke="#9aa9ba"/>
<text x="65" y="725" font-size="19" font-weight="700">CORE RULE</text>
<text x="65" y="757" font-size="18">Use chapter 9 to find what the authors cited; use a separate verification workflow to determine what that external source actually says.</text>
</g>
