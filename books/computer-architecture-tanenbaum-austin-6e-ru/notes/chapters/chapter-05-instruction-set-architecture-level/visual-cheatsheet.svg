<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f4f6f8"/>
<rect width="1400" height="110" fill="#1e293b"/>
<text x="45" y="50" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="white">ГЛАВА 5 · УРОВЕНЬ АРХИТЕКТУРЫ НАБОРА КОМАНД</text>
<text x="45" y="86" font-family="Arial,sans-serif" font-size="19" fill="#dbe5ef">ISA contract • formats • addressing • control flow • I/O • EPIC</text>
<g font-family="Arial,sans-serif" fill="#243447">
<rect x="40" y="145" width="410" height="230" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="65" y="190" font-size="22" font-weight="700" fill="#365f91">ISA CONTRACT</text>
<text x="65" y="235" font-size="18">memory • registers • instructions</text>
<text x="65" y="270" font-size="18">flags • privilege • exceptions</text>
<text x="65" y="305" font-size="18">compiler-visible semantics</text>
<text x="65" y="340" font-size="18">implementation may change underneath</text>

<rect x="495" y="145" width="410" height="230" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/>
<text x="520" y="190" font-size="22" font-weight="700" fill="#2d7d63">FORMAT / ADDRESSING</text>
<text x="520" y="235" font-size="18">opcode bits ↔ operand bits</text>
<text x="520" y="270" font-size="18">immediate • register • indirect</text>
<text x="520" y="305" font-size="18">indexed • PC-relative • stack</text>
<text x="520" y="340" font-size="18">opcode expansion saves encoding space</text>

<rect x="950" y="145" width="410" height="230" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/>
<text x="975" y="190" font-size="22" font-weight="700" fill="#7656a5">INSTRUCTION CLASSES</text>
<text x="975" y="235" font-size="18">move • arithmetic • logic • shifts</text>
<text x="975" y="270" font-size="18">compare • branch • call • return</text>
<text x="975" y="305" font-size="18">loops • I/O • interrupt</text>
<text x="975" y="340" font-size="18">signed / unsigned semantics matter</text>

<rect x="40" y="415" width="410" height="230" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/>
<text x="65" y="460" font-size="22" font-weight="700" fill="#b15d45">CONTROL FLOW</text>
<text x="65" y="505" font-size="18">branches redirect sequential execution</text>
<text x="65" y="540" font-size="18">stack frames enable recursion</text>
<text x="65" y="575" font-size="18">exceptions / interrupts save state</text>
<text x="65" y="610" font-size="18">priority protects urgent devices</text>

<rect x="495" y="415" width="410" height="230" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="520" y="460" font-size="22" font-weight="700" fill="#365f91">I/O</text>
<text x="520" y="505" font-size="18">polling → CPU busy-wait</text>
<text x="520" y="540" font-size="18">interrupt → asynchronous service</text>
<text x="520" y="575" font-size="18">DMA → block transfer bus master</text>
<text x="520" y="610" font-size="18">cycle stealing competes with CPU</text>

<rect x="950" y="415" width="410" height="230" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/>
<text x="975" y="460" font-size="22" font-weight="700" fill="#2d7d63">ISA STYLES</text>
<text x="975" y="505" font-size="18">x86 → compatibility / CISC</text>
<text x="975" y="540" font-size="18">ARM → regular load/store RISC</text>
<text x="975" y="575" font-size="18">AVR → compact embedded ISA</text>
<text x="975" y="610" font-size="18">IA-64 → EPIC / compiler scheduling</text>

<rect x="40" y="685" width="1320" height="90" rx="14" fill="#e8eef5" stroke="#9aa9ba"/>
<text x="65" y="725" font-size="19" font-weight="700">CORE RULE</text>
<text x="65" y="757" font-size="18">ISA must satisfy software clarity, efficient hardware implementation and long-term compatibility.</text>
</g>
</svg>