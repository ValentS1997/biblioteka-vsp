<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#f4f6f8"/><rect width="1600" height="120" fill="#1e293b"/>
<text x="45" y="52" font-family="Arial" font-size="32" font-weight="700" fill="white">APPENDIX B · FLOATING-POINT DATA PATH</text>
<text x="45" y="88" font-family="Arial" font-size="19" fill="#dbe5ef">classify → align → operate → normalize → round</text>
<g font-family="Arial" fill="#243447">
<rect x="40" y="150" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="65" y="192" font-size="21" font-weight="700" fill="#365f91">DECOMPOSE</text><text x="65" y="235" font-size="17">sign × significand × radix^exponent</text><text x="65" y="266" font-size="17">range and precision are independent knobs</text>
<rect x="560" y="150" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="585" y="192" font-size="21" font-weight="700" fill="#2d7d63">NORMALIZE</text><text x="585" y="235" font-size="17">shift significand</text><text x="585" y="266" font-size="17">compensate exponent</text>
<rect x="1080" y="150" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="1105" y="192" font-size="21" font-weight="700" fill="#7656a5">ROUND</text><text x="1105" y="235" font-size="17">real line is dense; float set is discrete</text><text x="1105" y="266" font-size="17">nearest representable value is chosen</text>
<rect x="40" y="395" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="65" y="437" font-size="21" font-weight="700" fill="#b15d45">IEEE SINGLE</text><text x="65" y="480" font-size="17">S:1 • E:8 • F:23</text><text x="65" y="511" font-size="17">bias 127 • normalized 1.F</text>
<rect x="560" y="395" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="585" y="437" font-size="21" font-weight="700" fill="#365f91">IEEE DOUBLE</text><text x="585" y="480" font-size="17">S:1 • E:11 • F:52</text><text x="585" y="511" font-size="17">bias 1023</text>
<rect x="1080" y="395" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="1105" y="437" font-size="21" font-weight="700" fill="#2d7d63">SPECIAL CLASSES</text><text x="1105" y="480" font-size="17">±0 • denormal • ±∞ • NaN</text><text x="1105" y="511" font-size="17">exponent pattern controls interpretation</text>
<rect x="40" y="640" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="65" y="682" font-size="21" font-weight="700" fill="#7656a5">ALIGN</text><text x="65" y="725" font-size="17">shift smaller significand right</text><text x="65" y="756" font-size="17">match exponents before add/subtract</text>
<rect x="560" y="640" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="585" y="682" font-size="21" font-weight="700" fill="#b15d45">CANCELLATION</text><text x="585" y="725" font-size="17">nearly equal magnitudes subtract</text><text x="585" y="756" font-size="17">leading significant bits disappear</text>
<rect x="1080" y="640" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="1105" y="682" font-size="21" font-weight="700" fill="#365f91">SQRT</text><text x="1105" y="725" font-size="17">halve exponent</text><text x="1105" y="756" font-size="17">approximate/refine significand</text>
<rect x="40" y="890" width="1520" height="150" rx="14" fill="#e8eef5" stroke="#9aa9ba"/><text x="65" y="935" font-size="21" font-weight="700">SYSTEMS TAKEAWAY</text><text x="65" y="973" font-size="18">Never compare floating-point bit patterns without first identifying format, bias, normalization and special-value rules.</text>
</g></svg>