<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f4f6f8"/><rect width="1400" height="110" fill="#1e293b"/>
<text x="45" y="50" font-family="Arial" font-size="32" font-weight="700" fill="white">APPENDIX B · FLOATING POINT</text>
<text x="45" y="86" font-family="Arial" font-size="19" fill="#dbe5ef">sign • exponent • significand • normalization • IEEE 754</text>
<g font-family="Arial" fill="#243447">
<rect x="40" y="145" width="410" height="220" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="65" y="190" font-size="22" font-weight="700" fill="#365f91">RANGE</text><text x="65" y="235" font-size="18">exponent bits set dynamic range</text><text x="65" y="270" font-size="18">bias encodes signed exponent</text>
<rect x="495" y="145" width="410" height="220" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/>
<text x="520" y="190" font-size="22" font-weight="700" fill="#2d7d63">PRECISION</text><text x="520" y="235" font-size="18">significand bits set spacing</text><text x="520" y="270" font-size="18">rounding selects nearest value</text>
<rect x="950" y="145" width="410" height="220" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/>
<text x="975" y="190" font-size="22" font-weight="700" fill="#7656a5">IEEE SINGLE</text><text x="975" y="235" font-size="18">1 sign • 8 exponent • 23 fraction</text><text x="975" y="270" font-size="18">bias 127 • implicit leading 1</text>
<rect x="40" y="405" width="640" height="230" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/>
<text x="65" y="450" font-size="22" font-weight="700" fill="#b15d45">SPECIAL VALUES</text><text x="65" y="495" font-size="18">zero • denormal • infinity • NaN</text><text x="65" y="530" font-size="18">reserved exponent patterns select class</text>
<rect x="720" y="405" width="640" height="230" rx="14" fill="white" stroke="#365f91" stroke-width="2"/>
<text x="745" y="450" font-size="22" font-weight="700" fill="#365f91">ADD</text><text x="745" y="495" font-size="18">align exponent → add/sub significands</text><text x="745" y="530" font-size="18">normalize → round → repack</text>
<rect x="40" y="685" width="1320" height="90" rx="14" fill="#e8eef5" stroke="#9aa9ba"/>
<text x="65" y="725" font-size="19" font-weight="700">CORE RULE</text><text x="65" y="757" font-size="18">Floating point trades exactness for huge range; exponent controls scale and significand controls precision.</text>
</g></svg>