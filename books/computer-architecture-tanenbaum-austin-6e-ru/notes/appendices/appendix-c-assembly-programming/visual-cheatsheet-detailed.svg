<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#f4f6f8"/><rect width="1600" height="120" fill="#1e293b"/>
<text x="45" y="52" font-family="Arial" font-size="32" font-weight="700" fill="white">APPENDIX C · 8088 PROGRAMMING MODEL</text>
<text x="45" y="88" font-family="Arial" font-size="19" fill="#dbe5ef">ISA → segmented memory → ABI → assembler → tracer</text>
<g font-family="Arial" fill="#243447">
<rect x="40" y="150" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="65" y="192" font-size="21" font-weight="700" fill="#365f91">REGISTERS</text><text x="65" y="235" font-size="17">AX BX CX DX</text><text x="65" y="266" font-size="17">SP BP SI DI • CS DS SS ES</text><text x="65" y="297" font-size="17">IP + FLAGS</text>
<rect x="560" y="150" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="585" y="192" font-size="21" font-weight="700" fill="#2d7d63">SEGMENTATION</text><text x="585" y="235" font-size="17">16-bit segment shifted left 4</text><text x="585" y="266" font-size="17">+ 16-bit offset → 20-bit address</text>
<rect x="1080" y="150" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="1105" y="192" font-size="21" font-weight="700" fill="#7656a5">ADDRESSING</text><text x="1105" y="235" font-size="17">register / immediate / memory</text><text x="1105" y="266" font-size="17">BX/SI/DI/BP combinations</text>
<rect x="40" y="395" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="65" y="437" font-size="21" font-weight="700" fill="#b15d45">INSTRUCTIONS</text><text x="65" y="480" font-size="17">move • arithmetic • logic • shifts</text><text x="65" y="511" font-size="17">strings • branches • CALL/RET • SYS</text>
<rect x="560" y="395" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="585" y="437" font-size="21" font-weight="700" fill="#365f91">CALL FRAME</text><text x="585" y="480" font-size="17">args pushed reverse</text><text x="585" y="511" font-size="17">BP anchors return/args/locals</text><text x="585" y="542" font-size="17">AX/DX caller-sensitive in source convention</text>
<rect x="1080" y="395" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="1105" y="437" font-size="21" font-weight="700" fill="#2d7d63">SYSCALL ABI</text><text x="1105" y="480" font-size="17">push args → push call number → SYS</text><text x="1105" y="511" font-size="17">AX / DX:AX return values</text>
<rect x="40" y="640" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="65" y="682" font-size="21" font-weight="700" fill="#7656a5">AS88</text><text x="65" y="725" font-size="17">symbol table + two passes</text><text x="65" y="756" font-size="17">TEXT / DATA / BSS sections</text>
<rect x="560" y="640" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="585" y="682" font-size="21" font-weight="700" fill="#b15d45">T88</text><text x="585" y="725" font-size="17">step / run / breakpoints</text><text x="585" y="756" font-size="17">observe registers, stack, memory, I/O</text>
<rect x="1080" y="640" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="1105" y="682" font-size="21" font-weight="700" fill="#365f91">EXAMPLES</text><text x="1105" y="725" font-size="17">Hello World • vectors • strings</text><text x="1105" y="756" font-size="17">dispatch table • file buffering / seek</text>
<rect x="40" y="890" width="1520" height="150" rx="14" fill="#e8eef5" stroke="#9aa9ba"/><text x="65" y="935" font-size="21" font-weight="700">SYSTEMS TAKEAWAY</text><text x="65" y="973" font-size="18">Low-level debugging is state accounting: register values, effective addresses, stack layout, flags and the next control-flow edge.</text>
</g></svg>