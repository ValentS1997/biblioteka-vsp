<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#f4f6f8"/><rect width="1600" height="120" fill="#1e293b"/>
<text x="45" y="52" font-family="Arial" font-size="32" font-weight="700" fill="white">APPENDIX A · INTEGER REPRESENTATION PIPELINE</text>
<text x="45" y="88" font-family="Arial" font-size="19" fill="#dbe5ef">radix → encoding → arithmetic → overflow</text>
<g font-family="Arial" fill="#243447">
<rect x="40" y="150" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="65" y="192" font-size="21" font-weight="700" fill="#365f91">FINITE PRECISION</text><text x="65" y="235" font-size="17">fixed width limits representable values</text><text x="65" y="266" font-size="17">operation order can change results</text>
<rect x="560" y="150" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="585" y="192" font-size="21" font-weight="700" fill="#2d7d63">RADIX</text><text x="585" y="235" font-size="17">binary 2 • octal 8 • decimal 10 • hex 16</text><text x="585" y="266" font-size="17">powers determine positional weight</text>
<rect x="1080" y="150" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="1105" y="192" font-size="21" font-weight="700" fill="#7656a5">CONVERSION</text><text x="1105" y="235" font-size="17">powers-of-two decomposition</text><text x="1105" y="266" font-size="17">repeated division / accumulation</text>
<rect x="40" y="395" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="65" y="437" font-size="21" font-weight="700" fill="#b15d45">SIGN-MAGNITUDE</text><text x="65" y="480" font-size="17">MSB = sign</text><text x="65" y="511" font-size="17">two zero encodings</text>
<rect x="560" y="395" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="585" y="437" font-size="21" font-weight="700" fill="#365f91">ONES' COMPLEMENT</text><text x="585" y="480" font-size="17">flip bits</text><text x="585" y="511" font-size="17">end-around carry</text>
<rect x="1080" y="395" width="480" height="210" rx="14" fill="white" stroke="#2d7d63" stroke-width="2"/><text x="1105" y="437" font-size="21" font-weight="700" fill="#2d7d63">TWO'S COMPLEMENT</text><text x="1105" y="480" font-size="17">flip + 1</text><text x="1105" y="511" font-size="17">single zero • asymmetric range</text>
<rect x="40" y="640" width="480" height="210" rx="14" fill="white" stroke="#7656a5" stroke-width="2"/><text x="65" y="682" font-size="21" font-weight="700" fill="#7656a5">BIASED</text><text x="65" y="725" font-size="17">stored = value + bias</text>
<rect x="560" y="640" width="480" height="210" rx="14" fill="white" stroke="#b15d45" stroke-width="2"/><text x="585" y="682" font-size="21" font-weight="700" fill="#b15d45">ARITHMETIC</text><text x="585" y="725" font-size="17">binary add/subtract uses fixed width</text><text x="585" y="756" font-size="17">carry is not signed overflow</text>
<rect x="1080" y="640" width="480" height="210" rx="14" fill="white" stroke="#365f91" stroke-width="2"/><text x="1105" y="682" font-size="21" font-weight="700" fill="#365f91">OVERFLOW</text><text x="1105" y="725" font-size="17">same signs → changed result sign</text><text x="1105" y="756" font-size="17">carry-in ≠ carry-out of sign bit</text>
<rect x="40" y="890" width="1520" height="150" rx="14" fill="#e8eef5" stroke="#9aa9ba"/><text x="65" y="935" font-size="21" font-weight="700">SYSTEMS TAKEAWAY</text><text x="65" y="973" font-size="18">For register dumps, masks, counters and addresses: identify width + radix + signedness first.</text>
</g></svg>