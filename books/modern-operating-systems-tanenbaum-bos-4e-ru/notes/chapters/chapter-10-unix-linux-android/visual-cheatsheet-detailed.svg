<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1100" viewBox="0 0 1460 1100">
  <rect width="1460" height="1100" fill="white"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="40" y="52" font-size="32" font-weight="700">Chapter 10 - Detailed Unix/Linux/Android Map</text>
    <text x="40" y="78" font-size="13">RAG | PDF 784-930 | boundary verified | 67 review questions</text>

    <rect x="55" y="125" width="320" height="205" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="215" y="164" text-anchor="middle" font-size="18" font-weight="700">Process / Task</text>
    <text x="80" y="202" font-size="14">fork → copy-on-write</text>
    <text x="80" y="232" font-size="14">exec → replace address space</text>
    <text x="80" y="262" font-size="14">clone → selective sharing</text>
    <text x="80" y="292" font-size="14">PID / TID | task_struct</text>

    <rect x="400" y="125" width="320" height="205" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="560" y="164" text-anchor="middle" font-size="18" font-weight="700">Scheduling</text>
    <text x="425" y="202" font-size="14">RT FIFO / round-robin</text>
    <text x="425" y="232" font-size="14">O(1): priority arrays</text>
    <text x="425" y="262" font-size="14">CFS: red-black tree + vruntime</text>
    <text x="425" y="292" font-size="14">per-CPU runqueues + balancing</text>

    <rect x="745" y="125" width="320" height="205" rx="12" fill="#fef3c7" stroke="#a16207"/>
    <text x="905" y="164" text-anchor="middle" font-size="18" font-weight="700">Memory</text>
    <text x="770" y="202" font-size="14">VMA | page tables | mmap</text>
    <text x="770" y="232" font-size="14">buddy → physical page blocks</text>
    <text x="770" y="262" font-size="14">slab → kernel objects</text>
    <text x="770" y="292" font-size="14">PFRA | swap | pdflush</text>

    <rect x="1090" y="125" width="320" height="205" rx="12" fill="#f8fafc" stroke="#475569"/>
    <text x="1250" y="164" text-anchor="middle" font-size="18" font-weight="700">I/O / Files</text>
    <text x="1115" y="202" font-size="14">special files | major/minor</text>
    <text x="1115" y="232" font-size="14">sockets | skbuff | modules</text>
    <text x="1115" y="262" font-size="14">fd → file → dentry → inode</text>
    <text x="1115" y="292" font-size="14">VFS | ext2/ext4 | NFS</text>

    <rect x="90" y="425" width="360" height="215" rx="12" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="270" y="464" text-anchor="middle" font-size="18" font-weight="700">Linux Protection</text>
    <text x="115" y="502" font-size="14">UID / GID ownership</text>
    <text x="115" y="532" font-size="14">owner / group / others: rwx</text>
    <text x="115" y="562" font-size="14">SETUID / effective identity</text>
    <text x="115" y="592" font-size="14">permission checked when opened</text>

    <rect x="550" y="425" width="360" height="215" rx="12" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="730" y="464" text-anchor="middle" font-size="18" font-weight="700">Android Runtime</text>
    <text x="575" y="502" font-size="14">init → zygote → app process</text>
    <text x="575" y="532" font-size="14">Dalvik runtime (source-era model)</text>
    <text x="575" y="562" font-size="14">per-app Linux UID sandbox</text>
    <text x="575" y="592" font-size="14">saved state ≠ process lifetime</text>

    <rect x="1010" y="425" width="360" height="215" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="1190" y="464" text-anchor="middle" font-size="18" font-weight="700">Binder / Components</text>
    <text x="1035" y="502" font-size="14">Binder transaction = protected RPC</text>
    <text x="1035" y="532" font-size="14">handles preserve object identity</text>
    <text x="1035" y="562" font-size="14">activity | service | receiver | provider</text>
    <text x="1035" y="592" font-size="14">intent = late-bound activation</text>

    <rect x="190" y="770" width="460" height="190" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="420" y="808" text-anchor="middle" font-size="18" font-weight="700">Diagnostic Boundary</text>
    <text x="215" y="846" font-size="14">process ≠ address space | fd ≠ inode</text>
    <text x="215" y="876" font-size="14">page fault ≠ always error</text>
    <text x="215" y="906" font-size="14">path permission ≠ existing open access</text>

    <rect x="810" y="770" width="460" height="190" rx="12" fill="#fef3c7" stroke="#a16207"/>
    <text x="1040" y="808" text-anchor="middle" font-size="18" font-weight="700">Android Memory Policy</text>
    <text x="835" y="846" font-size="14">ActivityManager classifies importance</text>
    <text x="835" y="876" font-size="14">CACHED → HOME → SERVICE → …</text>
    <text x="835" y="906" font-size="14">foreground/system work survives longer</text>

    <text x="40" y="1040" font-size="13">Engineering rule: locate the abstraction boundary first, then inspect identity, sharing and lifecycle state.</text>
  </g>
</svg>