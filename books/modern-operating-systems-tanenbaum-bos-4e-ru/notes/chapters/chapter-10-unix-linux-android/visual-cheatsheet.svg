<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="white"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="40" y="52" font-size="32" font-weight="700">Chapter 10 - Unix, Linux and Android</text>
    <text x="40" y="78" font-size="13">RAG | PDF 784-930 | 147 chunks</text>

    <rect x="70" y="140" width="300" height="180" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="220" y="178" text-anchor="middle" font-size="20" font-weight="700">UNIX / POSIX</text>
    <text x="95" y="216" font-size="15">portable C core</text>
    <text x="95" y="246" font-size="15">shell | library | syscalls</text>
    <text x="95" y="276" font-size="15">files + descriptors</text>

    <rect x="450" y="140" width="300" height="180" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="600" y="178" text-anchor="middle" font-size="20" font-weight="700">Linux Execution</text>
    <text x="475" y="216" font-size="15">task_struct | fork | exec</text>
    <text x="475" y="246" font-size="15">clone | copy-on-write</text>
    <text x="475" y="276" font-size="15">O(1) | CFS | waitqueues</text>

    <rect x="830" y="140" width="300" height="180" rx="12" fill="#fef3c7" stroke="#a16207"/>
    <text x="980" y="178" text-anchor="middle" font-size="20" font-weight="700">Memory / I/O / VFS</text>
    <text x="855" y="216" font-size="15">mmap | paging | buddy/slab</text>
    <text x="855" y="246" font-size="15">special files | sockets</text>
    <text x="855" y="276" font-size="15">VFS | inode | NFS</text>

    <rect x="170" y="440" width="360" height="190" rx="12" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="350" y="478" text-anchor="middle" font-size="20" font-weight="700">Protection</text>
    <text x="195" y="516" font-size="15">UID / GID | rwx | SETUID</text>
    <text x="195" y="546" font-size="15">open-time permission check</text>
    <text x="195" y="576" font-size="15">existing fd is a separate boundary</text>

    <rect x="670" y="440" width="360" height="190" rx="12" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="850" y="478" text-anchor="middle" font-size="20" font-weight="700">Android on Linux</text>
    <text x="695" y="516" font-size="15">zygote | per-app UID sandbox</text>
    <text x="695" y="546" font-size="15">Binder | intents | components</text>
    <text x="695" y="576" font-size="15">ActivityManager | oom_adj</text>

    <text x="40" y="750" font-size="13">Same Linux primitives, reused to build a substantially different application platform.</text>
  </g>
</svg>