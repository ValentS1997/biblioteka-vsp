<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px sans-serif;fill:#0f172a}.h{font:700 19px sans-serif;fill:#0f172a}
      .t{font:14px sans-serif;fill:#1e293b}.s{font:12px sans-serif;fill:#475569}
      .b{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:14}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;rx:14}
      .green{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:14}.amber{fill:#fef3c7;stroke:#a16207;stroke-width:2;rx:14}
      .red{fill:#fee2e2;stroke:#b91c1c;stroke-width:2;rx:14}.ln{stroke:#475569;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="860" fill="#fff"/>
  <text x="45" y="55" class="title">Глава 7 — Виртуализация и облако</text>
  <text x="45" y="82" class="s">RAG-grounded · PDF 527–575 · 50 chunks</text>

  <rect x="425" y="115" width="350" height="92" class="blue"/>
  <text x="600" y="150" text-anchor="middle" class="h">Guest workload</text>
  <text x="600" y="178" text-anchor="middle" class="t">CPU · memory · I/O · OS</text>

  <rect x="50" y="290" width="310" height="165" class="amber"/>
  <text x="205" y="325" text-anchor="middle" class="h">CPU virtualization</text>
  <text x="205" y="357" text-anchor="middle" class="t">trap/VM exit · hypercall</text>
  <text x="205" y="385" text-anchor="middle" class="t">binary translation · VT</text>
  <text x="205" y="415" text-anchor="middle" class="s">direct execution when safe</text>

  <rect x="445" y="290" width="310" height="165" class="green"/>
  <text x="600" y="325" text-anchor="middle" class="h">Memory</text>
  <text x="600" y="357" text-anchor="middle" class="t">shadow tables · EPT/nested</text>
  <text x="600" y="385" text-anchor="middle" class="t">ballooning · dedup · COW</text>
  <text x="600" y="415" text-anchor="middle" class="s">guest physical ≠ machine physical</text>

  <rect x="840" y="290" width="310" height="165" class="red"/>
  <text x="995" y="325" text-anchor="middle" class="h">I/O</text>
  <text x="995" y="357" text-anchor="middle" class="t">emulation · device domain</text>
  <text x="995" y="385" text-anchor="middle" class="t">I/O MMU · SR-IOV</text>
  <text x="995" y="415" text-anchor="middle" class="s">DMA + interrupt isolation</text>

  <line x1="500" y1="207" x2="280" y2="290" class="ln"/>
  <line x1="600" y1="207" x2="600" y2="290" class="ln"/>
  <line x1="700" y1="207" x2="920" y2="290" class="ln"/>

  <rect x="50" y="575" width="310" height="165" class="b"/>
  <text x="205" y="610" text-anchor="middle" class="h">Hypervisor placement</text>
  <text x="205" y="642" text-anchor="middle" class="t">Type 1: hardware</text>
  <text x="205" y="670" text-anchor="middle" class="t">Type 2: host OS</text>
  <text x="205" y="698" text-anchor="middle" class="s">control · equivalence · efficiency</text>

  <rect x="445" y="575" width="310" height="165" class="blue"/>
  <text x="600" y="610" text-anchor="middle" class="h">Cloud</text>
  <text x="600" y="642" text-anchor="middle" class="t">IaaS · PaaS · SaaS</text>
  <text x="600" y="670" text-anchor="middle" class="t">pooling · elasticity · metering</text>
  <text x="600" y="698" text-anchor="middle" class="s">provider trust + lock-in remain</text>

  <rect x="840" y="575" width="310" height="165" class="green"/>
  <text x="995" y="610" text-anchor="middle" class="h">VM operations</text>
  <text x="995" y="642" text-anchor="middle" class="t">live migration · checkpoint</text>
  <text x="995" y="670" text-anchor="middle" class="t">VMware world switch</text>
  <text x="995" y="698" text-anchor="middle" class="s">state must stay coherent</text>

  <text x="45" y="810" class="s">Operational boundary: guest app ≠ guest kernel ≠ VMM ≠ host/device domain ≠ physical hardware.</text>
</svg>