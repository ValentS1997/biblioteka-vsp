<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1100" viewBox="0 0 1460 1100"><rect width="1460" height="1100" fill="white"/><g font-family="sans-serif" fill="#111827"><text x="40" y="52" font-size="32" font-weight="700">Chapter 11 - Detailed Windows Map</text><text x="40" y="78" font-size="13">RAG | PDF 931-1057 | boundary verified | 42 review questions</text><rect x="55" y="125" width="320" height="205" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="215" y="164" text-anchor="middle" font-size="18" font-weight="700">API / Object Layer</text><text x="80" y="202" font-size="14">Win32 / WinRT → Native NT</text><text x="80" y="232" font-size="14">Object Manager + handles</text><text x="80" y="262" font-size="14">namespace + reference counting</text><text x="80" y="292" font-size="14">registry hives</text><rect x="400" y="125" width="320" height="205" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="560" y="164" text-anchor="middle" font-size="18" font-weight="700">Scheduling</text><text x="425" y="202" font-size="14">32 thread priorities</text><text x="425" y="232" font-size="14">base + current priority</text><text x="425" y="262" font-size="14">Autoboost | DFSS</text><text x="425" y="292" font-size="14">ideal CPU / NUMA locality</text><rect x="745" y="125" width="320" height="205" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="905" y="164" text-anchor="middle" font-size="18" font-weight="700">Memory / Cache</text><text x="770" y="202" font-size="14">VAD | reserve / commit</text><text x="770" y="232" font-size="14">working sets | soft/hard faults</text><text x="770" y="262" font-size="14">free / zero / standby / modified</text><text x="770" y="292" font-size="14">Cache Manager file views</text><rect x="1090" y="125" width="320" height="205" rx="12" fill="#f8fafc" stroke="#475569"/><text x="1250" y="164" text-anchor="middle" font-size="18" font-weight="700">I/O</text><text x="1115" y="202" font-size="14">I/O Manager | Plug-and-Play</text><text x="1115" y="232" font-size="14">IRP through device stack</text><text x="1115" y="262" font-size="14">filters | async completion</text><text x="1115" y="292" font-size="14">filesystem volumes as devices</text><rect x="90" y="425" width="360" height="215" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="270" y="464" text-anchor="middle" font-size="18" font-weight="700">NTFS</text><text x="115" y="502" font-size="14">MFT records + attributes</text><text x="115" y="532" font-size="14">resident / nonresident data</text><text x="115" y="562" font-size="14">named streams | reparse points</text><text x="115" y="592" font-size="14">compression | journal | EFS</text><rect x="550" y="425" width="360" height="215" rx="12" fill="#ede9fe" stroke="#6d28d9"/><text x="730" y="464" text-anchor="middle" font-size="18" font-weight="700">Power</text><text x="575" y="502" font-size="14">hibernate + restore memory</text><text x="575" y="532" font-size="14">HiberBoot fast startup</text><text x="575" y="562" font-size="14">Connected Standby</text><text x="575" y="592" font-size="14">coalesced timers / brokers</text><rect x="1010" y="425" width="360" height="215" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="1190" y="464" text-anchor="middle" font-size="18" font-weight="700">Security</text><text x="1035" y="502" font-size="14">SID + access token</text><text x="1035" y="532" font-size="14">DACL / SACL / integrity</text><text x="1035" y="562" font-size="14">impersonation</text><text x="1035" y="592" font-size="14">NX / ASLR / /GS / code integrity</text><rect x="190" y="770" width="460" height="190" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="420" y="808" text-anchor="middle" font-size="18" font-weight="700">Diagnostic Boundary</text><text x="215" y="846" font-size="14">handle ≠ pointer | reserve ≠ commit</text><text x="215" y="876" font-size="14">process ≠ scheduled entity</text><text x="215" y="906" font-size="14">soft fault ≠ storage I/O</text><rect x="810" y="770" width="460" height="190" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="1040" y="808" text-anchor="middle" font-size="18" font-weight="700">Operational Rule</text><text x="835" y="846" font-size="14">locate owning manager</text><text x="835" y="876" font-size="14">inspect object + token + state</text><text x="835" y="906" font-size="14">change one layer and verify</text><text x="40" y="1040" font-size="13">Windows architecture is a cooperating set of managers built around objects, handles and explicit policy boundaries.</text></g></svg>