e" font-size="20" font-weight="700">Project / Future</text><text x="695" y="516" font-size="15">Brooks | team structure</text><text x="695" y="546" font-size="15">integration | experience</text><text x="695" y="576" font-size="15">cloud | multicore | embedded</text><text x="40" y="750" font-size="13">Primary rule: control complexity before chasing features or micro-optimizations.</text></g></svg>