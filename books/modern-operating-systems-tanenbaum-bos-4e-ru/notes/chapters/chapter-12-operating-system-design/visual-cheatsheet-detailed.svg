<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1100" viewBox="0 0 1460 1100"><rect width="1460" height="1100" fill="white"/><g font-family="sans-serif" fill="#111827"><text x="40" y="52" font-size="32" font-weight="700">Chapter 12 - Detailed OS Design Map</text><text x="40" y="78" font-size="13">RAG | PDF 1058-1109 | boundary verified | 28 review questions</text><rect x="55" y="125" width="320" height="205" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="215" y="164" text-anchor="middle" font-size="18" font-weight="700">Interface</text><text x="80" y="202" font-size="14">goals and non-goals</text><text x="80" y="232" font-size="14">simplicity + completeness</text><text x="80" y="262" font-size="14">efficient implementation</text><text x="80" y="292" font-size="14">consistent paradigms</text><rect x="400" y="125" width="320" height="205" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="560" y="164" text-anchor="middle" font-size="18" font-weight="700">System Structure</text><text x="425" y="202" font-size="14">layers</text><text x="425" y="232" font-size="14">microkernel client-server</text><text x="425" y="262" font-size="14">exokernel / end-to-end</text><text x="425" y="292" font-size="14">failure isolation</text><rect x="745" y="125" width="320" height="205" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="905" y="164" text-anchor="middle" font-size="18" font-weight="700">Internal Design</text><text x="770" y="202" font-size="14">mechanism vs policy</text><text x="770" y="232" font-size="14">orthogonality</text><text x="770" y="262" font-size="14">naming + indirection</text><text x="770" y="292" font-size="14">binding + static/dynamic</text><rect x="1090" y="125" width="320" height="205" rx="12" fill="#f8fafc" stroke="#475569"/><text x="1250" y="164" text-anchor="middle" font-size="18" font-weight="700">Implementation</text><text x="1115" y="202" font-size="14">hide hardware early</text><text x="1115" y="232" font-size="14">conditional compilation</text><text x="1115" y="262" font-size="14">reuse + reentrancy</text><text x="1115" y="292" font-size="14">validate before allocate</text><rect x="90" y="425" width="360" height="215" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="270" y="464" text-anchor="middle" font-size="18" font-weight="700">Concurrency</text><text x="115" y="502" font-size="14">blocking / threads</text><text x="115" y="532" font-size="14">events / async state</text><text x="115" y="562" font-size="14">coarse vs fine locks</text><text x="115" y="592" font-size="14">no universal winner</text><rect x="550" y="425" width="360" height="215" rx="12" fill="#ede9fe" stroke="#6d28d9"/><text x="730" y="464" text-anchor="middle" font-size="18" font-weight="700">Performance</text><text x="575" y="502" font-size="14">profile before optimize</text><text x="575" y="532" font-size="14">time / memory tradeoff</text><text x="575" y="562" font-size="14">cache != hint</text><text x="575" y="592" font-size="14">locality + common case</text><rect x="1010" y="425" width="360" height="215" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="1190" y="464" text-anchor="middle" font-size="18" font-weight="700">Project Management</text><text x="1035" y="502" font-size="14">planning before coding</text><text x="1035" y="532" font-size="14">module interfaces</text><text x="1035" y="562" font-size="14">integration + system testing</text><text x="1035" y="592" font-size="14">people != interchangeable time</text><rect x="190" y="770" width="460" height="190" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="420" y="808" text-anchor="middle" font-size="18" font-weight="700">Acceptance Boundary</text><text x="215" y="846" font-size="14">simple != incomplete | cache != hint</text><text x="215" y="876" font-size="14">reuse != reentrancy</text><text x="215" y="906" font-size="14">optimization requires measurement</text><rect x="810" y="770" width="460" height="190" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="1040" y="808" text-anchor="middle" font-size="18" font-weight="700">Future Constraints</text><text x="835" y="846" font-size="14">hypervisors / cloud / multicore</text><text x="835" y="876" font-size="14">large address spaces / mobility</text><text x="835" y="906" font-size="14">battery-powered / embedded systems</text><text x="40" y="1040" font-size="13">Engineering objective: preserve understandable structure while meeting correctness, performance and project-scale constraints.</text></g></svg>