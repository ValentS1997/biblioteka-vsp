<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 34px sans-serif;fill:#0f172a}
      .h{font:700 20px sans-serif;fill:#0f172a}
      .t{font:15px sans-serif;fill:#1e293b}
      .s{font:13px sans-serif;fill:#475569}
      .b{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:14}
      .blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;rx:14}
      .amber{fill:#fef3c7;stroke:#a16207;stroke-width:2;rx:14}
      .green{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:14}
      .ln{stroke:#475569;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="45" y="55" class="title">Глава 3 — Управление памятью</text>
  <text x="45" y="83" class="s">RAG-grounded · PDF 214–300 · 87 chunks</text>

  <rect x="420" y="120" width="360" height="95" class="blue"/>
  <text x="600" y="154" text-anchor="middle" class="h">Адресное пространство</text>
  <text x="600" y="184" text-anchor="middle" class="t">виртуальные адреса отделены от физической памяти</text>

  <rect x="80" y="300" width="300" height="125" class="b"/>
  <text x="230" y="335" text-anchor="middle" class="h">Swapping</text>
  <text x="230" y="365" text-anchor="middle" class="t">целый процесс RAM ↔ disk</text>
  <text x="230" y="394" text-anchor="middle" class="s">дорогой I/O, освобождает всю память процесса</text>

  <rect x="450" y="300" width="300" height="125" class="green"/>
  <text x="600" y="335" text-anchor="middle" class="h">Virtual memory / paging</text>
  <text x="600" y="365" text-anchor="middle" class="t">page → frame через MMU / page table</text>
  <text x="600" y="394" text-anchor="middle" class="s">TLB ускоряет повторные преобразования</text>

  <rect x="820" y="300" width="300" height="125" class="b"/>
  <text x="970" y="335" text-anchor="middle" class="h">Segmentation</text>
  <text x="970" y="365" text-anchor="middle" class="t">логические variable-size пространства</text>
  <text x="970" y="394" text-anchor="middle" class="s">sharing/protection · external fragmentation</text>

  <line x1="500" y1="215" x2="290" y2="300" class="ln"/>
  <line x1="600" y1="215" x2="600" y2="300" class="ln"/>
  <line x1="700" y1="215" x2="910" y2="300" class="ln"/>

  <rect x="80" y="535" width="310" height="145" class="amber"/>
  <text x="235" y="570" text-anchor="middle" class="h">Page fault</text>
  <text x="235" y="600" text-anchor="middle" class="t">minor: mapping missing, page resident</text>
  <text x="235" y="628" text-anchor="middle" class="t">major: page must be read from disk</text>
  <text x="235" y="655" text-anchor="middle" class="s">invalid/protection fault is a different class</text>

  <rect x="445" y="535" width="310" height="145" class="blue"/>
  <text x="600" y="570" text-anchor="middle" class="h">Replacement</text>
  <text x="600" y="600" text-anchor="middle" class="t">NRU · FIFO · clock · LRU · aging</text>
  <text x="600" y="628" text-anchor="middle" class="t">working set · WSClock</text>
  <text x="600" y="655" text-anchor="middle" class="s">chapter favors aging + WSClock as practical</text>

  <rect x="810" y="535" width="310" height="145" class="green"/>
  <text x="965" y="570" text-anchor="middle" class="h">Working set / load control</text>
  <text x="965" y="600" text-anchor="middle" class="t">locality keeps active pages small</text>
  <text x="965" y="628" text-anchor="middle" class="t">Σ working sets &gt; RAM → thrashing</text>
  <text x="965" y="655" text-anchor="middle" class="s">reduce competing processes if necessary</text>

  <line x1="390" y1="607" x2="445" y2="607" class="ln"/>
  <line x1="755" y1="607" x2="810" y2="607" class="ln"/>

  <text x="45" y="750" class="s">Диагностика: protection ≠ TLB miss ≠ minor fault ≠ major fault ≠ thrashing.</text>
</svg>