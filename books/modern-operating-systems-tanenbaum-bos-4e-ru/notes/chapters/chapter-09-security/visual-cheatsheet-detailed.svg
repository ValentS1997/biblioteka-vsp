<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1100" viewBox="0 0 1460 1100"><rect width="1460" height="1100" fill="white"/><g font-family="sans-serif" fill="#111827"><text x="40" y="52" font-size="32" font-weight="700">Chapter 9 - Detailed Security Map</text><text x="40" y="78" font-size="13">RAG | PDF 659-783 | boundary verified</text><rect x="70" y="130" width="350" height="190" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="245" y="168" text-anchor="middle" font-size="19" font-weight="700">Security Goal</text><text x="95" y="205" font-size="14">Confidentiality</text><text x="95" y="235" font-size="14">Integrity</text><text x="95" y="265" font-size="14">Availability</text><rect x="555" y="130" width="350" height="190" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="730" y="168" text-anchor="middle" font-size="19" font-weight="700">Protection Model</text><text x="580" y="205" font-size="14">small TCB | reference monitor</text><text x="580" y="235" font-size="14">domains | POLA</text><text x="580" y="265" font-size="14">ACL | capabilities</text><rect x="1040" y="130" width="350" height="190" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="1215" y="168" text-anchor="middle" font-size="19" font-weight="700">Identity / Trust</text><text x="1065" y="205" font-size="14">password + salt</text><text x="1065" y="235" font-size="14">OTP | challenge-response</text><text x="1065" y="265" font-size="14">smart card | biometrics</text><rect x="40" y="410" width="310" height="220" rx="12" fill="#f8fafc" stroke="#475569"/><text x="195" y="448" text-anchor="middle" font-size="18" font-weight="700">Information Flow</text><text x="65" y="485" font-size="14">Bell-LaPadula</text><text x="65" y="515" font-size="14">Biba</text><text x="65" y="545" font-size="14">covert channels</text><text x="65" y="575" font-size="14">steganography</text><rect x="390" y="410" width="310" height="220" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="545" y="448" text-anchor="middle" font-size="18" font-weight="700">Cryptography</text><text x="415" y="485" font-size="14">symmetric key</text><text x="415" y="515" font-size="14">public key</text><text x="415" y="545" font-size="14">hash | signature | certificate</text><text x="415" y="575" font-size="14">key protection</text><rect x="740" y="410" width="310" height="220" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="895" y="448" text-anchor="middle" font-size="18" font-weight="700">Software Failure</text><text x="765" y="485" font-size="14">bounds | format | lifetime</text><text x="765" y="515" font-size="14">integer | injection</text><text x="765" y="545" font-size="14">TOCTOU</text><text x="765" y="575" font-size="14">canary | DEP | ASLR</text><rect x="1090" y="410" width="310" height="220" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="1245" y="448" text-anchor="middle" font-size="18" font-weight="700">Malware / Persistence</text><text x="1115" y="485" font-size="14">trojan | virus | worm</text><text x="1115" y="515" font-size="14">spyware | rootkit</text><text x="1115" y="545" font-size="14">insider | backdoor</text><text x="1115" y="575" font-size="14">restore trust boundary</text><rect x="120" y="760" width="360" height="190" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="300" y="798" text-anchor="middle" font-size="18" font-weight="700">Preventive Layers</text><text x="145" y="835" font-size="14">firewall | least privilege</text><text x="145" y="865" font-size="14">signed code | sandbox</text><text x="145" y="895" font-size="14">safe language / runtime checks</text><rect x="550" y="760" width="360" height="190" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="730" y="798" text-anchor="middle" font-size="18" font-weight="700">Detection / Containment</text><text x="575" y="835" font-size="14">antimalware | integrity check</text><text x="575" y="865" font-size="14">IDS | honeypot | jail</text><text x="575" y="895" font-size="14">mobile-code reference monitor</text><rect x="980" y="760" width="360" height="190" rx="12" fill="#dbeafe" stroke="#1d4ed8"/><text x="1160" y="798" text-anchor="middle" font-size="18" font-weight="700">Recovery Rule</text><text x="1005" y="835" font-size="14">contain first</text><text x="1005" y="865" font-size="14">recover from known-good state</text><text x="1005" y="895" font-size="14">rotate affected credentials / keys</text><text x="40" y="1040" font-size="13">Security = policy + trustworthy enforcement + safe implementation + independent defensive layers.</text></g></svg>