<title id="title">Глава 1 — Начало работы с Git: компактная RAG-сводка</title>
<desc id="desc">Git: проверка и установка, автор, локальный репозиторий, состояние, выбор файлов, коммит, удалённый репозиторий, SSH. Источник RAG PDF 10–16.</desc>
