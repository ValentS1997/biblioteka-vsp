<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-label="Глава 2 · Подробная схема сетевого администрирования"><rect width="1600" height="1480" fill="#f8fafc"/><rect width="1600" height="112" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="50" y="45" font-size="31" font-weight="bold" fill="#ffffff">Глава 2 · Подробная схема сетевого администрирования</text><text x="50" y="81" font-size="18" fill="#cbd5e1">RAG-only · PDF страницы 51–85 · главы учебного пособия Бобынцева и др.</text><g><rect x="50" y="140" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 65 140 H 765 Q 780 140 780 155 V 182 H 50 V 155 Q 50 140 65 140Z" fill="#dbeafe"/><text x="69" y="170" font-size="22" font-weight="bold" fill="#0f172a">01 · Топологии и среда (§2.1)</text><text x="69" y="211" font-size="19" fill="#334155">Активное: обработка сигналов; пассивное: тракты.</text><text x="69" y="243" font-size="19" fill="#334155">Шина: общий сегмент и терминаторы.</text><text x="69" y="275" font-size="19" fill="#334155">Звезда: центральное устройство — точка отказа.</text><text x="69" y="307" font-size="19" fill="#334155">Кольцо: маркер, непрерывный путь.</text><text x="69" y="339" font-size="19" fill="#334155">Дерево/гибрид: сочетание базовых топологий.</text></g>
<g><rect x="820" y="140" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 835 140 H 1535 Q 1550 140 1550 155 V 182 H 820 V 155 Q 820 140 835 140Z" fill="#dcfce7"/><text x="839" y="170" font-size="22" font-weight="bold" fill="#0f172a">02 · Эталонная OSI (§2.2–2.9)</text><text x="839" y="211" font-size="19" fill="#334155">L1 физический: сигнал, среда и кабель.</text><text x="839" y="243" font-size="19" fill="#334155">L2 канальный: MAC, кадр, CRC, доступ.</text><text x="839" y="275" font-size="19" fill="#334155">L3 сетевой: IP, маршрут, дейтаграмма.</text><text x="839" y="307" font-size="19" fill="#334155">L4 транспорт: TCP/UDP, соединение, порты.</text><text x="839" y="339" font-size="19" fill="#334155">L5–L7: сеанс, представление, приложение.</text></g>
<g><rect x="50" y="447" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 65 447 H 765 Q 780 447 780 462 V 489 H 50 V 462 Q 50 447 65 447Z" fill="#fef3c7"/><text x="69" y="477" font-size="22" font-weight="bold" fill="#0f172a">03 · Инкапсуляция и кадры</text><text x="69" y="518" font-size="19" fill="#334155">Передача: данные → заголовки и трейлер.</text><text x="69" y="550" font-size="19" fill="#334155">Получатель: обратная обработка уровней.</text><text x="69" y="582" font-size="19" fill="#334155">MAC определяется для канального перехода.</text><text x="69" y="614" font-size="19" fill="#334155">Канал обнаруживает ошибки по CRC.</text><text x="69" y="646" font-size="19" fill="#334155">Стек протоколов не обязан точно повторять OSI.</text></g>
<g><rect x="820" y="447" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 835 447 H 1535 Q 1550 447 1550 462 V 489 H 820 V 462 Q 820 447 835 447Z" fill="#f3e8ff"/><text x="839" y="477" font-size="22" font-weight="bold" fill="#0f172a">04 · Адресация IPv4/IPv6 (§2.10)</text><text x="839" y="518" font-size="19" fill="#334155">IP адрес узла и маска сети/хоста.</text><text x="839" y="550" font-size="19" fill="#334155">IPv4: 32 бита; IPv6: 128 бит.</text><text x="839" y="582" font-size="19" fill="#334155">ARP: поиск адреса следующего локального узла.</text><text x="839" y="614" font-size="19" fill="#334155">ICMP echo в примере ping через маршрутизатор.</text><text x="839" y="646" font-size="19" fill="#334155">Любые аномальные сведения: source-findings.md.</text></g>
<g><rect x="50" y="754" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 65 754 H 765 Q 780 754 780 769 V 796 H 50 V 769 Q 50 754 65 754Z" fill="#ffe4e6"/><text x="69" y="784" font-size="22" font-weight="bold" fill="#0f172a">05 · Маршруты и next hop (§2.10)</text><text x="69" y="825" font-size="19" fill="#334155">Маршрутизатор выбирает маршрут по таблице.</text><text x="69" y="857" font-size="19" fill="#334155">Сохранение конечного сетевого назначения.</text><text x="69" y="889" font-size="19" fill="#334155">На новом канале создаётся новое обрамление.</text><text x="69" y="921" font-size="19" fill="#334155">Статика: записи администратора; динамика: обмен.</text><text x="69" y="953" font-size="19" fill="#334155">Метрики: нагрузка, задержка, пропускная способность.</text></g>
<g><rect x="820" y="754" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 835 754 H 1535 Q 1550 754 1550 769 V 796 H 820 V 769 Q 820 754 835 754Z" fill="#ccfbf1"/><text x="839" y="784" font-size="22" font-weight="bold" fill="#0f172a">06 · Интернет-протоколы (§2.11)</text><text x="839" y="825" font-size="19" fill="#334155">TCP/IP — совокупность сетевых протоколов.</text><text x="839" y="857" font-size="19" fill="#334155">FTP, SMTP, Telnet, SIP, HTTP описаны в тексте.</text><text x="839" y="889" font-size="19" fill="#334155">SSL и SET названы как защитные технологии.</text><text x="839" y="921" font-size="19" fill="#334155">Названия не означают наличие CLI-команд.</text><text x="839" y="953" font-size="19" fill="#334155">Разночтение FTP сохранено отдельно.</text></g>
<g><rect x="50" y="1061" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 65 1061 H 765 Q 780 1061 780 1076 V 1103 H 50 V 1076 Q 50 1061 65 1061Z" fill="#dbeafe"/><text x="69" y="1091" font-size="22" font-weight="bold" fill="#0f172a">07 · Безопасность (§2.12)</text><text x="69" y="1132" font-size="19" fill="#334155">Рабочая группа: локальная SAM на каждом узле.</text><text x="69" y="1164" font-size="19" fill="#334155">Домен: централизованная база учётных записей.</text><text x="69" y="1196" font-size="19" fill="#334155">DC: контроллеры, хранение и репликация БД.</text><text x="69" y="1228" font-size="19" fill="#334155">LDAP назван для доступа к информации каталога.</text><text x="69" y="1260" font-size="19" fill="#334155">Права зависят от учетных записей/групп.</text></g>
<g><rect x="820" y="1061" width="730" height="278" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 835 1061 H 1535 Q 1550 1061 1550 1076 V 1103 H 820 V 1076 Q 820 1061 835 1061Z" fill="#dcfce7"/><text x="839" y="1091" font-size="22" font-weight="bold" fill="#0f172a">08 · Операционные границы</text><text x="839" y="1132" font-size="19" fill="#334155">Read-only: выяснить топологию, адреса, маршрут.</text><text x="839" y="1164" font-size="19" fill="#334155">Workload: разрешённый ping &lt;TARGET_IP&gt;.</text><text x="839" y="1196" font-size="19" fill="#334155">State-changing: маршрут, доступ, конфигурация.</text><text x="839" y="1228" font-size="19" fill="#334155">Проверка: связность/права против baseline.</text><text x="839" y="1260" font-size="19" fill="#334155">Rollback и команды изменений: [Needs confirmation].</text></g><text x="50" y="1456" font-size="15" fill="#475569">Источник p0051–p0085. 46 вопросов в конце; нет одобрения изменений в реальной сети.</text></g></svg>
