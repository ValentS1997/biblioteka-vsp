<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Глава 2 · Администрирование сетей"><rect width="1200" height="850" fill="#f8fafc"/><rect width="1200" height="112" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="44" y="45" font-size="31" font-weight="bold" fill="#ffffff">Глава 2 · Администрирование сетей</text><text x="44" y="81" font-size="18" fill="#cbd5e1">Компактный RAG-обзор · PDF 51–85 · 12 разделов</text><g><rect x="44" y="136" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 59 136 H 573 Q 588 136 588 151 V 178 H 44 V 151 Q 44 136 59 136Z" fill="#dbeafe"/><text x="63" y="166" font-size="21" font-weight="bold" fill="#0f172a">1. Оборудование и топология</text><text x="63" y="207" font-size="18" fill="#334155">Активное: коммутатор, маршрутизатор.</text><text x="63" y="236" font-size="18" fill="#334155">Пассивное: кабель, розетки, панели.</text><text x="63" y="265" font-size="18" fill="#334155">Шина · звезда · кольцо · дерево.</text></g>
<g><rect x="612" y="136" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 627 136 H 1141 Q 1156 136 1156 151 V 178 H 612 V 151 Q 612 136 627 136Z" fill="#dcfce7"/><text x="631" y="166" font-size="21" font-weight="bold" fill="#0f172a">2. Модель OSI</text><text x="631" y="207" font-size="18" fill="#334155">7 уровней: от физического до прикладного.</text><text x="631" y="236" font-size="18" fill="#334155">Инкапсуляция → передача → приём.</text><text x="631" y="265" font-size="18" fill="#334155">OSI — модель, не точный стек протоколов.</text></g>
<g><rect x="44" y="354" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 59 354 H 573 Q 588 354 588 369 V 396 H 44 V 369 Q 44 354 59 354Z" fill="#fef3c7"/><text x="63" y="384" font-size="21" font-weight="bold" fill="#0f172a">3. Адресация и кадры</text><text x="63" y="425" font-size="18" fill="#334155">MAC: адрес текущего канального обмена.</text><text x="63" y="454" font-size="18" fill="#334155">IP: адрес назначения в сети.</text><text x="63" y="483" font-size="18" fill="#334155">IPv4 32 бита; IPv6 128 бит.</text></g>
<g><rect x="612" y="354" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 627 354 H 1141 Q 1156 354 1156 369 V 396 H 612 V 369 Q 612 354 627 354Z" fill="#f3e8ff"/><text x="631" y="384" font-size="21" font-weight="bold" fill="#0f172a">4. Маршрутизация</text><text x="631" y="425" font-size="18" fill="#334155">Таблица маршрутов → следующий шаг.</text><text x="631" y="454" font-size="18" fill="#334155">Статическая: вручную; динамическая: протокол.</text><text x="631" y="483" font-size="18" fill="#334155">При переходе меняется канальный кадр.</text></g>
<g><rect x="44" y="572" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 59 572 H 573 Q 588 572 588 587 V 614 H 44 V 587 Q 44 572 59 572Z" fill="#ffe4e6"/><text x="63" y="602" font-size="21" font-weight="bold" fill="#0f172a">5. Диагностика</text><text x="63" y="643" font-size="18" fill="#334155">Проверить среду → кадр → IP/маршрут.</text><text x="63" y="672" font-size="18" fill="#334155">ping &lt;TARGET_IP&gt; = ICMP-нагрузка.</text><text x="63" y="701" font-size="18" fill="#334155">Конфигурационные команды не даны.</text></g>
<g><rect x="612" y="572" width="544" height="199" rx="15" fill="#ffffff" stroke="#94a3b8"/><path d="M 627 572 H 1141 Q 1156 572 1156 587 V 614 H 612 V 587 Q 612 572 627 572Z" fill="#ccfbf1"/><text x="631" y="602" font-size="21" font-weight="bold" fill="#0f172a">6. Модели безопасности</text><text x="631" y="643" font-size="18" fill="#334155">Рабочая группа: локальные SAM.</text><text x="631" y="672" font-size="18" fill="#334155">Домен: общая БД и контроллеры.</text><text x="631" y="701" font-size="18" fill="#334155">Учет доступа централизован в домене.</text></g><text x="44" y="826" font-size="15" fill="#475569">RAG p0051-c01–p0085-c01 · Не использовать как runbook · Source findings отдельно</text></g></svg>
