<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-label="Глава 1 · Администрирование ИС">
<rect x="0" y="0" width="1200" height="835" fill="#f8fafc"/>
<rect x="0" y="0" width="1200" height="113" fill="#0f172a"/>
<text x="48" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Глава 1 · Администрирование ИС</text>
<text x="48" y="83" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Компактная RAG-сводка • PDF 24–50 • §1.1–1.4</text>
<g><rect x="48" y="135" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="135" width="540" height="47" rx="15" fill="#dbeafe"/><rect x="48" y="166" width="540" height="16" fill="#dbeafe"/><text x="70" y="167" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">01. Администратор (§1.1)</text><text x="70" y="212" font-family="Arial, sans-serif" font-size="19" fill="#334155">Поддерживает ИВС, ПО, серверы и сеть.</text><text x="70" y="240" font-family="Arial, sans-serif" font-size="19" fill="#334155">Контролирует безопасность, копии и доступ.</text><text x="70" y="268" font-family="Arial, sans-serif" font-size="19" fill="#334155">Мониторинг, восстановление, документация.</text></g>
<g><rect x="612" y="135" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="612" y="135" width="540" height="47" rx="15" fill="#dcfce7"/><rect x="612" y="166" width="540" height="16" fill="#dcfce7"/><text x="634" y="167" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">02. Идентификация и доступ</text><text x="634" y="212" font-family="Arial, sans-serif" font-size="19" fill="#334155">Учётная запись → аутентификация.</text><text x="634" y="240" font-family="Arial, sans-serif" font-size="19" fill="#334155">ACL и права → авторизация.</text><text x="634" y="268" font-family="Arial, sans-serif" font-size="19" fill="#334155">Аудит фиксирует попытки обращения.</text></g>
<g><rect x="48" y="348" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="348" width="540" height="47" rx="15" fill="#fef3c7"/><rect x="48" y="379" width="540" height="16" fill="#fef3c7"/><text x="70" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">03. КИС и обеспечение (§1.2)</text><text x="70" y="425" font-family="Arial, sans-serif" font-size="19" fill="#334155">Информация · техника · математика · ПО.</text><text x="70" y="453" font-family="Arial, sans-serif" font-size="19" fill="#334155">Организация и правовое обеспечение.</text><text x="70" y="481" font-family="Arial, sans-serif" font-size="19" fill="#334155">Модульность, интеграция, доступность.</text></g>
<g><rect x="612" y="348" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="612" y="348" width="540" height="47" rx="15" fill="#f3e8ff"/><rect x="612" y="379" width="540" height="16" fill="#f3e8ff"/><text x="634" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">04. Компоненты ИВС (§1.3)</text><text x="634" y="425" font-family="Arial, sans-serif" font-size="19" fill="#334155">Серверы, станции, сетевое оборудование.</text><text x="634" y="453" font-family="Arial, sans-serif" font-size="19" fill="#334155">Кабели, периферия, ИБП, ПО.</text><text x="634" y="481" font-family="Arial, sans-serif" font-size="19" fill="#334155">Отказоустойчивость, масштабируемость.</text></g>
<g><rect x="48" y="561" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="561" width="540" height="47" rx="15" fill="#ffe4e6"/><rect x="48" y="592" width="540" height="16" fill="#ffe4e6"/><text x="70" y="593" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">05. Распределение (§1.4)</text><text x="70" y="638" font-family="Arial, sans-serif" font-size="19" fill="#334155">Центральная схема — один узел обработки.</text><text x="70" y="666" font-family="Arial, sans-serif" font-size="19" fill="#334155">Файл-сервер — клиент обрабатывает данные.</text><text x="70" y="694" font-family="Arial, sans-serif" font-size="19" fill="#334155">3 звена: клиент → приложение → БД.</text></g>
<g><rect x="612" y="561" width="540" height="194" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="612" y="561" width="540" height="47" rx="15" fill="#ccfbf1"/><rect x="612" y="592" width="540" height="16" fill="#ccfbf1"/><text x="634" y="593" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0f172a">06. Границы безопасной работы</text><text x="634" y="638" font-family="Arial, sans-serif" font-size="19" fill="#334155">До изменения — полная резервная копия.</text><text x="634" y="666" font-family="Arial, sans-serif" font-size="19" fill="#334155">Записывать действия в журнал.</text><text x="634" y="694" font-family="Arial, sans-serif" font-size="19" fill="#334155">Команды и точный rollback: не даны.</text></g>
<text x="48" y="807" font-family="Arial, sans-serif" font-size="15" fill="#475569">Источник: p0024-c01–p0050-c01. Дефекты p0043/p0046/p0050: source-findings.md.</text>
</svg>
