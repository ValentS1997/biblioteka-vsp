<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1312" viewBox="0 0 1580 1312" role="img" aria-label="Глава 1 · Подробная карта администрирования ИС">
<rect x="0" y="0" width="1580" height="1312" fill="#f8fafc"/>
<rect x="0" y="0" width="1580" height="113" fill="#0f172a"/>
<text x="49" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Глава 1 · Подробная карта администрирования ИС</text>
<text x="49" y="83" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Только канонический RAG · источник PDF p. 24–50 · chapter-artifact-collection v1.8</text>
<g><rect x="49" y="144" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="49" y="144" width="725" height="47" rx="15" fill="#dbeafe"/><rect x="49" y="175" width="725" height="16" fill="#dbeafe"/><text x="71" y="176" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">01. Обязанности и ответственность (§1.1)</text><text x="71" y="221" font-family="Arial, sans-serif" font-size="21" fill="#334155">Эксплуатация серверов, сети, приложений.</text><text x="71" y="255" font-family="Arial, sans-serif" font-size="21" fill="#334155">Обслуживание пользователей и учёт доступов.</text><text x="71" y="289" font-family="Arial, sans-serif" font-size="21" fill="#334155">Резервное копирование и восстановление.</text><text x="71" y="323" font-family="Arial, sans-serif" font-size="21" fill="#334155">Информационная безопасность и аудит.</text><text x="71" y="357" font-family="Arial, sans-serif" font-size="21" fill="#334155">Регламенты, журнал действий, коммуникация.</text></g>
<g><rect x="806" y="144" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="806" y="144" width="725" height="47" rx="15" fill="#dcfce7"/><rect x="806" y="175" width="725" height="16" fill="#dcfce7"/><text x="828" y="176" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">02. Доступ к ресурсам (§1.1)</text><text x="828" y="221" font-family="Arial, sans-serif" font-size="21" fill="#334155">Учётная запись: имя, пароль, группы, профиль.</text><text x="828" y="255" font-family="Arial, sans-serif" font-size="21" fill="#334155">Аутентификация: установление подлинности.</text><text x="828" y="289" font-family="Arial, sans-serif" font-size="21" fill="#334155">Авторизация: проверка запрошенных прав.</text><text x="828" y="323" font-family="Arial, sans-serif" font-size="21" fill="#334155">ACL: перечень разрешений на ресурс.</text><text x="828" y="357" font-family="Arial, sans-serif" font-size="21" fill="#334155">Аудит: контроль использования и попыток.</text></g>
<g><rect x="49" y="423" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="49" y="423" width="725" height="47" rx="15" fill="#fef3c7"/><rect x="49" y="454" width="725" height="16" fill="#fef3c7"/><text x="71" y="455" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">03. Корпоративная ИС (§1.2)</text><text x="71" y="500" font-family="Arial, sans-serif" font-size="21" fill="#334155">КИС поддерживает управление организацией.</text><text x="71" y="534" font-family="Arial, sans-serif" font-size="21" fill="#334155">Информационное: данные и потоки.</text><text x="71" y="568" font-family="Arial, sans-serif" font-size="21" fill="#334155">Техническое: устройства и документация.</text><text x="71" y="602" font-family="Arial, sans-serif" font-size="21" fill="#334155">Математическое и программное обеспечение.</text><text x="71" y="636" font-family="Arial, sans-serif" font-size="21" fill="#334155">Организационные регламенты и правовые нормы.</text></g>
<g><rect x="806" y="423" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="806" y="423" width="725" height="47" rx="15" fill="#f3e8ff"/><rect x="806" y="454" width="725" height="16" fill="#f3e8ff"/><text x="828" y="455" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">04. Аппаратные компоненты (§1.3)</text><text x="828" y="500" font-family="Arial, sans-serif" font-size="21" fill="#334155">Серверы: общие ресурсы и отказоустойчивость.</text><text x="828" y="534" font-family="Arial, sans-serif" font-size="21" fill="#334155">Рабочие станции: точка входа пользователя.</text><text x="828" y="568" font-family="Arial, sans-serif" font-size="21" fill="#334155">Коаксиал, витая пара, оптоволокно.</text><text x="828" y="602" font-family="Arial, sans-serif" font-size="21" fill="#334155">Сетевое оборудование, периферия, ИБП.</text><text x="828" y="636" font-family="Arial, sans-serif" font-size="21" fill="#334155">Hot swap, ECC, RAID, кластеры названы в книге.</text></g>
<g><rect x="49" y="702" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="49" y="702" width="725" height="47" rx="15" fill="#ffe4e6"/><rect x="49" y="733" width="725" height="16" fill="#ffe4e6"/><text x="71" y="734" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">05. Программные компоненты (§1.3)</text><text x="71" y="779" font-family="Arial, sans-serif" font-size="21" fill="#334155">Серверная и клиентская ОС, СУБД, почта.</text><text x="71" y="813" font-family="Arial, sans-serif" font-size="21" fill="#334155">Сетевые, прикладные и вспомогательные ПО.</text><text x="71" y="847" font-family="Arial, sans-serif" font-size="21" fill="#334155">Слои: представление, логика, идентификация.</text><text x="71" y="881" font-family="Arial, sans-serif" font-size="21" fill="#334155">Безопасность, оптимизация, хранение.</text><text x="71" y="915" font-family="Arial, sans-serif" font-size="21" fill="#334155">Модели: локальная и распределённая.</text></g>
<g><rect x="806" y="702" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="806" y="702" width="725" height="47" rx="15" fill="#ccfbf1"/><rect x="806" y="733" width="725" height="16" fill="#ccfbf1"/><text x="828" y="734" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">06. Распределённая ИС (§1.4)</text><text x="828" y="779" font-family="Arial, sans-serif" font-size="21" fill="#334155">Связанные независимые узлы и каналы связи.</text><text x="828" y="813" font-family="Arial, sans-serif" font-size="21" fill="#334155">Коммуникационная и управляющая подсистемы.</text><text x="828" y="847" font-family="Arial, sans-serif" font-size="21" fill="#334155">Приложение делится по функциональным частям.</text><text x="828" y="881" font-family="Arial, sans-serif" font-size="21" fill="#334155">Распределение влияет на нагрузку и доступность.</text><text x="828" y="915" font-family="Arial, sans-serif" font-size="21" fill="#334155">Текст p0043 повреждён: см. source-findings.</text></g>
<g><rect x="49" y="981" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="49" y="981" width="725" height="47" rx="15" fill="#e0e7ff"/><rect x="49" y="1012" width="725" height="16" fill="#e0e7ff"/><text x="71" y="1013" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">07. Выбор архитектуры (§1.4)</text><text x="71" y="1058" font-family="Arial, sans-serif" font-size="21" fill="#334155">Централизация: проще, один критичный узел.</text><text x="71" y="1092" font-family="Arial, sans-serif" font-size="21" fill="#334155">Файл-сервер: клиенту нужна мощность и сеть.</text><text x="71" y="1126" font-family="Arial, sans-serif" font-size="21" fill="#334155">Клиент–сервер: сервер выполняет операции БД.</text><text x="71" y="1160" font-family="Arial, sans-serif" font-size="21" fill="#334155">Три звена: клиент / приложение / база данных.</text><text x="71" y="1194" font-family="Arial, sans-serif" font-size="21" fill="#334155">Middleware: сообщения, вызовы, брокеры.</text></g>
<g><rect x="806" y="981" width="725" height="252" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="806" y="981" width="725" height="47" rx="15" fill="#fae8ff"/><rect x="806" y="1012" width="725" height="16" fill="#fae8ff"/><text x="828" y="1013" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">08. Эксплуатационные границы</text><text x="828" y="1058" font-family="Arial, sans-serif" font-size="21" fill="#334155">Не экспериментировать без резервной копии.</text><text x="828" y="1092" font-family="Arial, sans-serif" font-size="21" fill="#334155">Перед изменением серверной конфигурации — backup.</text><text x="828" y="1126" font-family="Arial, sans-serif" font-size="21" fill="#334155">Фиксировать действия в журнале администратора.</text><text x="828" y="1160" font-family="Arial, sans-serif" font-size="21" fill="#334155">Для практических CLI, SLA, RTO/RPO: нет данных.</text><text x="828" y="1194" font-family="Arial, sans-serif" font-size="21" fill="#334155">Rollback-процедура: [Needs confirmation].</text></g>
<text x="49" y="1284" font-family="Arial, sans-serif" font-size="15" fill="#475569">RAG chunks p0024–p0050. Контрольные вопросы PDF p. 49–50. Нет внешних команд и фактов.</text>
</svg>
