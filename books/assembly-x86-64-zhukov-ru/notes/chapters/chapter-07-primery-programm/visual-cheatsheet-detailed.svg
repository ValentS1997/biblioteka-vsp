<g font-size="17" fill="#29445d">
<text x="53" y="184">SI/DI → BUF; CLD; CX=SIZE</text><text x="53" y="214">LODSB; AH=0; PUSH CX; CX=8</text><text x="53" y="244">SHR AL,1; ADC AH,0; LOOP L2</text><text x="53" y="274">POP CX; STOSB; LOOP L1</text>
<text x="703" y="184">CLC перед первым ADC AH,0</text><text x="703" y="214">SHR AL,1; JNZ L2 до AL=0</text><text x="703" y="244">После выхода ADC AL,0</text><text x="703" y="274">Без вложенного счётного CX</text>
<text x="53" y="407">STDIN: BX=0, CX=лимит, DX=BUF</text><text x="53" y="437">INT 021 / 03F: C=ошибка, AX=длина</text><text x="53" y="467">MAKE in situ; STDOUT BX=1 / 040</text><text x="53" y="497">04C: завершение с кодом 0 или 1</text>
<text x="703" y="407">LEA не требует типа элемента BYTE/WORD</text><text x="703" y="437">MOV неизвестного приёмника неоднозначен</text><text x="703" y="467">EXTRN BUF:BYTE сообщает тип заранее</text><text x="703" y="497">JMP локальной метки может быть SHORT</text>
<text x="53" y="629">Коды 6 и 8 → 01101000</text><text x="53" y="659">SHL AL,4; SHR DL; RCR AL × 4</text><text x="53" y="689">Альтернатива: AH/AL и SHR AX,4</text><text x="53" y="719">Сверка битов в форматах d86 =e1</text>
<text x="703" y="629">15 заданий: массивы, ASCII, арифметика</text><text x="703" y="659">12 заданий: коды Грея, битовые пакеты</text><text x="703" y="689">RADIX-50, матрицы, спираль, сглаживание</text><text x="703" y="719">Рис. 7.1 не закодирован мультимодально</text>
