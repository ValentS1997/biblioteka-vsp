<text x="55" y="818" font-size="24" font-weight="bold" fill="#9b4e27">Границы ответственности и проверки</text>
<text x="55" y="850" font-size="17" fill="#7d492d">Файл после &gt; создаётся заново или обнуляется. Работать с копиями.</text>
<text x="55" y="882" font-size="17" fill="#7d492d">Проверять C/AX после DOS 03F и 040; достаточность одного чтения не доказана.</text>
<text x="55" y="913" font-size="17" fill="#7d492d">Для двух массивов и массива слов проверять кратность входной длины.</text>
<text x="55" y="942" font-size="16" fill="#7d492d">Табл. 7.1: конфликт '.' в таблице и списке допустимых символов; см. source-findings.</text>
