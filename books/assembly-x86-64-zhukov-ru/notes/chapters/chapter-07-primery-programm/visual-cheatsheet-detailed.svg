<text x="53" y="148">01 · Подсчёт битов: 7.1</text><text x="703" y="148">02 · Оптимизация: 7.2</text>
<text x="53" y="370">03 · Ввод-вывод DOS: 7.3–7.5</text><text x="703" y="370">04 · Ссылки и длины: 7.6–7.8</text>
