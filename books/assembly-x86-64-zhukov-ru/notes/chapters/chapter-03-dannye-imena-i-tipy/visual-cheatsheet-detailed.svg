<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" role="img" aria-label="Подробная схема главы 3: выражения типы имена и два прохода a86">
<rect width="1320" height="1030" fill="#f8fafc"/>
<text x="38" y="56" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#12263c">Глава 3 · Двухпроходная трансляция и типы a86</text>
<text x="38" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#52677b">Канонический RAG: PDF p. 31–55 | листинги 3.1–3.20</text>
<rect x="38" y="120" width="590" height="166" rx="12" fill="#e4efff" stroke="#9caecc"/><text x="55" y="151" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">01 · Исходный текст</text><text x="55" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">COM: jmp start → данные → метка start: → код</text><text x="55" y="204" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">db / dw / dd распределяют 1/2/4 байта</text><text x="55" y="229" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">equ: константное выражение, без данных</text><text x="55" y="254" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Старт $ = 0100 из-за PSP</text>
<rect x="691" y="120" width="590" height="166" rx="12" fill="#e5f3ff" stroke="#9caecc"/><text x="708" y="151" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">02 · Числа и выражения</text><text x="708" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Ведущий 0 → hex в правилах a86</text><text x="708" y="204" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">b/q/d/h; x перед суффиксом; k = 1024</text><text x="708" y="229" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">bit, shl/shr, low/high, by, mod</text><text x="708" y="254" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Отрицательные операнды требуют скобок</text>
<rect x="38" y="318" width="590" height="177" rx="12" fill="#e5f8ec" stroke="#9caecc"/><text x="55" y="349" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">03 · Проход 1</text><text x="55" y="377" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Для каждого имени: числовое значение + тип</text><text x="55" y="402" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Метки / equ: abs; данные: byte/word/dword</text><text x="55" y="427" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Счётчик $ растёт по длине операндов</text><text x="55" y="452" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Длина dup должна быть известна уже сейчас</text>
<rect x="691" y="318" width="590" height="177" rx="12" fill="#e6f8ee" stroke="#9caecc"/><text x="708" y="349" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">04 · Проход 2</text><text x="708" y="377" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Вычисление фактических байтов и кодов</text><text x="708" y="402" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">COM = результат без служебного заголовка</text><text x="708" y="427" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">По .lst: адреса, значения, типы, размеры</text><text x="708" y="452" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">В d86: b/w/e/r окна, символьные адреса</text>
<rect x="38" y="530" width="590" height="178" rx="12" fill="#ede9ff" stroke="#9caecc"/><text x="55" y="561" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">05 · Тип и операция</text><text x="55" y="589" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">not area1 → байт, not area2 → слово</text><text x="55" y="614" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">b/w/d или word ptr — временная типизация</text><text x="55" y="639" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">mov ax, area2: содержимое по адресу</text><text x="55" y="664" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">mov ax, offset area2: сам адрес</text>
<rect x="691" y="530" width="590" height="178" rx="12" fill="#f0ecff" stroke="#9caecc"/><text x="708" y="561" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">06 · Правила имён</text><text x="708" y="589" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Обычное повторение: тот же тип и значение</text><text x="708" y="614" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">l1 и &gt;l1: локальное последующее определение</text><text x="708" y="639" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">ax, mov, b/w/d — встроенные имена</text><text x="708" y="664" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">end: неявно означает конец программы</text>
<path d="M628 404 H688 M678 397 L688 404 L678 411" stroke="#50748d" stroke-width="3" fill="none"/>
<rect x="38" y="753" width="1243" height="181" rx="14" fill="#fff0e5" stroke="#db905e" stroke-width="2"/>
<text x="58" y="790" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#9e4a20">Контрольные дефекты и опасности</text>
<text x="58" y="823" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#773b20">a86 v4.05: bit 16…31 даёт 0; −129 обрабатывается необычно; −4*-2 даёт неожиданный результат.</text>
<text x="58" y="852" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#773b20">Таблица 3.7 указывает для Pixels 128 байт, тогда как код и соседний текст говорят 256 байт.</text>
<text x="58" y="881" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#773b20">not w start изменяет машинный код; jmp end может перескочить за пределы последней инструкции.</text>
<text x="58" y="909" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#773b20">Регистрировать расхождения в source-findings.md, не исправлять авторский исходник молча.</text>
