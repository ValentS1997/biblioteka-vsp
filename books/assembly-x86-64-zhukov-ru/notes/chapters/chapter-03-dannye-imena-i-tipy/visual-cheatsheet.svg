<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625" role="img" aria-label="Краткая визуальная памятка главы 3 Данные имена и типы">
<rect width="1100" height="625" fill="#f8fafc"/>
<text x="35" y="56" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold" fill="#0f253b">Глава 3 · Данные, имена и типы</text>
<text x="35" y="88" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#526475">a86: имя = значение + тип · COM · первый/второй проход</text>
<rect x="35" y="120" width="325" height="135" rx="12" fill="#e1f0ff" stroke="#9caecc"/><text x="52" y="151" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">Данные</text><text x="52" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">db: 1 байт; dw: 2; dd: 4</text><text x="52" y="204" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">dup: повтор; equ: имя без байтов</text>
<rect x="389" y="120" width="325" height="135" rx="12" fill="#e2f6ed" stroke="#9caecc"/><text x="406" y="151" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">Имена и адреса</text><text x="406" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Метка: abs; переменная: адрес</text><text x="406" y="204" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">byte / word / dword: 1 / 2 / 4</text>
<rect x="742" y="120" width="325" height="135" rx="12" fill="#e9e5ff" stroke="#9caecc"/><text x="759" y="151" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">Тип операции</text><text x="759" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">not area1: размер по типу</text><text x="759" y="204" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">offset: получить числовой адрес</text>
<rect x="35" y="285" width="496" height="138" rx="12" fill="#e9f0ff" stroke="#9caecc"/><text x="52" y="316" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">Первый проход</text><text x="52" y="344" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">0100: начальный счётчик $ для COM</text><text x="52" y="369" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Вычислить имена и размеры; dup известен</text><text x="52" y="394" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Проверить атрибуты / повторные имена</text>
<rect x="565" y="285" width="502" height="138" rx="12" fill="#e5f8ee" stroke="#9caecc"/><text x="582" y="316" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#183f69">Второй проход</text><text x="582" y="344" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Сгенерировать данные и машинный код</text><text x="582" y="369" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Сверить байты и таблицу имён в .lst</text><text x="582" y="394" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172d44">Проверить адреса в d86</text>
<path d="M532 354 H563 M555 348 L563 354 L555 360" stroke="#4b647f" stroke-width="3" fill="none"/>
<rect x="35" y="455" width="1032" height="106" rx="12" fill="#fff0e7" stroke="#d88d55"/>
<text x="53" y="483" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#934a21">Риски из главы</text>
<text x="53" y="512" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#743e24">Не запускать COM из одних данных. not изменяет память; w start может изменить код.</text>
<text x="53" y="540" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#743e24">Не определять end явно; bit 16 и отрицательные выражения проверять по .lst.</text>
<text x="35" y="598" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#627487">Provenance: RAG PDF p. 31–55, чанки p0031:c01–p0055:c01 · inventory 0017</text>
</svg>