<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1120" viewBox="0 0 1360 1120" role="img" aria-label="Подробная схема: IVT, вход и выход ISR, trap fault, NASM и точки останова">
<rect width="1360" height="1120" fill="#f7fafc"/><g font-family="DejaVu Sans,sans-serif">
<text x="35" y="57" font-size="31" font-weight="bold" fill="#16364d">Глава 10 · Архитектура исключений и отладчика</text>
<text x="35" y="87" font-size="17" fill="#627d90">Схема по RAG PDF 177–196 · листинги 10.1–10.18</text>
<g stroke-width="2">
<rect x="35" y="115" width="627" height="211" rx="14" fill="#e3efff" stroke="#5d82b9"/>
<rect x="697" y="115" width="627" height="211" rx="14" fill="#e4f7ed" stroke="#439770"/>
<rect x="35" y="355" width="627" height="212" rx="14" fill="#e8f0ff" stroke="#5d82b9"/>
<rect x="697" y="355" width="627" height="212" rx="14" fill="#e9f8f0" stroke="#439770"/>
<rect x="35" y="597" width="627" height="212" rx="14" fill="#eee9ff" stroke="#8872bf"/>
<rect x="697" y="597" width="627" height="212" rx="14" fill="#f0ecff" stroke="#8872bf"/></g>
<g fill="#244d70" font-size="22" font-weight="bold">
<text x="54" y="152">01 · Таблица 256 векторов</text><text x="716" y="152">02 · Кадр INT и возврат</text>
<text x="54" y="394">03 · Исключения 0 / 4 / 5 / 13</text><text x="716" y="394">04 · Цепочка ISR и DOS</text>
<text x="54" y="636">05 · NASM против A86</text><text x="716" y="636">06 · Отладочные события 1 / 3</text>
</g>
<g fill="#2a455e" font-size="17">
<text x="54" y="189">Начало линейной памяти: 00000h</text><text x="54" y="219">256 адресов × 4 байта = 1024 байта</text><text x="54" y="249">20h → 80h; 21h → 84h</text><text x="54" y="279">80h → 200h; IP младшее, CS старшее</text>
<text x="716" y="189">INT n: сохранить FLAGS, CS, IP</text><text x="716" y="219">Взять дальний адрес из IVT[n]</text><text x="716" y="249">IRET: вернуть IP, CS и FLAGS</text><text x="716" y="279">Ручной вызов ISR: PUSHF + FAR CALL</text>
<text x="54" y="432">INTO → 4 только при OF=1</text><text x="54" y="463">BOUND → 5 вне [-3, 2]</text><text x="54" y="493">DIV/IDIV → 0: адрес выяснить</text><text x="54" y="523">EDI за 0FFFFh → GP 13 в примере</text>
<text x="716" y="432">Сохранить старый вектор до подмены</text><text x="716" y="463">CHAIN: дальний JMP → прежний ISR</text><text x="716" y="493">или PUSHF / FAR CALL и свой IRET</text><text x="716" y="523">Восстановить IVT до выхода</text>
<text x="54" y="673">A86 типизирует имена, NASM — нет</text><text x="54" y="703">X адрес, [X] содержимое памяти</text><text x="54" y="733">ORG 100h; явная BYTE/WORD/DWORD</text><text x="54" y="763">.TEXT/.DATA и .BSS с RESW</text>
<text x="716" y="673">INT 3 занимает один байт кода</text><text x="716" y="703">INT 80h занимает два байта кода</text><text x="716" y="733">T=1 → исключение 1 после команды</text><text x="716" y="763">IRET восстанавливает сохранённый T</text>
</g>
<rect x="35" y="845" width="1289" height="187" rx="14" fill="#fff0e7" stroke="#d08b5d" stroke-width="2"/>
<text x="56" y="882" font-size="24" font-weight="bold" fill="#944d2c">Проверка и риск изменения системной памяти</text>
<text x="56" y="916" font-size="17" fill="#7a472c">Свободность IVT[80h], адрес 0070:0029 и значение 00700233 относятся к снимку книги.</text>
<text x="56" y="950" font-size="17" fill="#7a472c">Без исправления BOUND может повторяться; буфер TRACE требует проверки границы.</text>
<text x="56" y="984" font-size="17" fill="#7a472c">Не запускать подмену DOS 21h, fault-генераторы и запись IVT на действующей системе.</text>
<text x="35" y="1080" font-size="14" fill="#677d90">Provenance: p0177:c01–p0196:c01 · Source SHA f65a7ec…d2c · новые схемы, не иллюстрации из PDF</text>
</g></svg>