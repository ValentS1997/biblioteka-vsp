<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1030" viewBox="0 0 1160 1030"><rect width="1160" height="1030" fill="#f8fafc"/><g font-family="sans-serif" fill="#19364c"><text x="35" y="58" font-size="31">Глава 13. Protected mode — подробная схема</text><text x="35" y="88" font-size="17">RAG PDF 219–234 · A386 / NASM · листинги 13.1–13.6</text><rect x="35" y="120" width="526" height="219" rx="12" fill="#dbeafe"/><rect x="599" y="120" width="526" height="219" rx="12" fill="#dcfce7"/><text x="55" y="165" font-size="24">01. Descriptor table</text><text x="55" y="213" font-size="19">GDTR: linear base + limit</text><text x="55" y="261" font-size="19">GDT entries: 8 bytes each</text><text x="55" y="309" font-size="19">Null 0, code selector 8</text><text x="619" y="165" font-size="24">02. Mode transition</text><text x="619" y="213" font-size="19">Build base from real CS*16</text><text x="619" y="261" font-size="19">LGDT → PE=1</text><text x="619" y="309" font-size="19">Far JMP → CS=8, USE32</text><rect x="35" y="366" width="526" height="220" rx="12" fill="#e0e7ff"/><rect x="599" y="366" width="526" height="220" rx="12" fill="#e5f5ef"/><text x="55" y="412" font-size="24">03. Descriptor bits</text><text x="55" y="460" font-size="19">P: present · R: readable</text><text x="55" y="508" font-size="19">A: accessed · G: granularity</text><text x="55" y="556" font-size="19">D: 16/32-bit decoding</text><text x="619" y="412" font-size="24">04. Privilege checks</text><text x="619" y="460" font-size="19">DPL: descriptor level</text><text x="619" y="508" font-size="19">CPL: current code level</text><text x="619" y="556" font-size="19">RPL: selector request level</text><rect x="35" y="612" width="526" height="220" rx="12" fill="#ede9fe"/><rect x="599" y="612" width="526" height="220" rx="12" fill="#f3e8ff"/><text x="55" y="657" font-size="24">05. Direct FAR CALL</text><text x="55" y="705" font-size="19">Return EIP + CS: 8 bytes</text><text x="55" y="753" font-size="19">EBP+12 / +14: word args</text><text x="55" y="801" font-size="19">Uncleared args leak stack</text><text x="619" y="657" font-size="24">06. Call Gate and return</text><text x="619" y="705" font-size="19">S=0: target selector / offset</text><text x="619" y="753" font-size="19">Far CALL offset ignored</text><text x="619" y="801" font-size="19">Return to real: PE=0 + far JMP</text><rect x="35" y="862" width="1090" height="106" rx="12" fill="#ffedd5"/><text x="55" y="903" font-size="19">Important: DS cache survives until selector reload in author example.</text><text x="55" y="943" font-size="18">Fault experiments and PE changes were not executed.</text><text x="35" y="1005" font-size="14">Analytical SVG; no recovery from original diagrams or external sources</text></g></svg>