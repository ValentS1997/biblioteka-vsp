<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f8fafc"/><g font-family="sans-serif" fill="#17364f"><text x="32" y="60" font-size="31">Глава 13. Код в защищенном режиме</text><rect x="32" y="100" width="504" height="167" rx="12" fill="#dbeafe"/><rect x="568" y="100" width="504" height="167" rx="12" fill="#dcfce7"/><text x="52" y="142" font-size="24">GDT / GDTR</text><text x="52" y="188" font-size="19">Selector CS → descriptor</text><text x="52" y="230" font-size="19">Base · Limit · Access</text><text x="588" y="142" font-size="24">Mode switch</text><text x="588" y="188" font-size="19">CR0.PE → far JMP</text><text x="588" y="230" font-size="19">CS=8 · USE32</text><rect x="32" y="303" width="504" height="175" rx="12" fill="#e0e7ff"/><rect x="568" y="303" width="504" height="175" rx="12" fill="#ede9fe"/><text x="52" y="343" font-size="24">Attributes and privilege</text><text x="52" y="389" font-size="19">P · R · A · G · D</text><text x="52" y="435" font-size="19">DPL · CPL · RPL</text><text x="588" y="343" font-size="24">Far call / Call Gate</text><text x="588" y="389" font-size="19">EIP + CS = 8 bytes</text><text x="588" y="435" font-size="19">Gate holds target address</text><rect x="32" y="513" width="1040" height="78" rx="12" fill="#ffedd5"/><text x="52" y="548" font-size="19">No execution: invalid descriptors and mode switching can halt a VM.</text><text x="32" y="629" font-size="15">Canonical RAG PDF 219–234 · analytical diagram · inventory 0017</text></g></svg>