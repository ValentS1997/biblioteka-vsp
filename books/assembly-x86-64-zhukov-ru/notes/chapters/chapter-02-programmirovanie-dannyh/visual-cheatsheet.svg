<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Краткая RAG-памятка главы 2: программирование данных через a86 и BMP">
<rect width="1080" height="620" fill="#f7fafc"/>
<text x="34" y="54" fill="#10263d" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="30">Глава 2 · Программирование данных</text>
<text x="34" y="82" fill="#516575" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="17">a86 · директивы данных · проверка размеров · bitmap</text>
<rect x="30" y="112" width="322" height="135" rx="15" fill="#dbeafe" stroke="#3476c0" stroke-width="2"/><text x="47" y="144" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">01 · Данные → байты</text><text x="47" y="173" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">db — байт, dw — слово, dd — 4 байта</text><text x="47" y="199" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">equ — константа без выделения места</text>
<rect x="379" y="112" width="322" height="135" rx="15" fill="#e8f1ff" stroke="#5276cc" stroke-width="2"/><text x="396" y="144" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">02 · Повтор и размер</text><text x="396" y="173" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">dup — повтор блока</text><text x="396" y="199" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">$ — счётчик; equ сверяет объём</text>
<rect x="728" y="112" width="322" height="135" rx="15" fill="#e4ebff" stroke="#6562c2" stroke-width="2"/><text x="745" y="144" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">03 · Результат a86</text><text x="745" y="173" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Успех: .com, .sym</text><text x="745" y="199" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Ошибки: .old и/или .und</text>
<rect x="30" y="271" width="322" height="140" rx="15" fill="#dcfce7" stroke="#22955c" stroke-width="2"/><text x="47" y="303" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">04 · Последовательность</text><text x="47" y="332" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">1k/8 = 128 байт</text><text x="47" y="358" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">sz/2 dup (0,1): 64 пары</text><text x="47" y="384" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Контроль: sz equ $ - seq</text>
<rect x="379" y="271" width="322" height="140" rx="15" fill="#dcfce7" stroke="#22955c" stroke-width="2"/><text x="396" y="303" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">05 · BMP 64×32×1</text><text x="396" y="332" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">8 байт/строка, 256 байт растра</text><text x="396" y="358" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Palette + Pixels + заголовки</text><text x="396" y="384" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Биты: слева направо, старший первым</text>
<rect x="728" y="271" width="322" height="140" rx="15" fill="#e4f9f1" stroke="#399b77" stroke-width="2"/><text x="745" y="303" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">06 · Встроенные проверки</text><text x="745" y="332" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Colors: число цветов</text><text x="745" y="358" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">zero: палитра кратна 4</text><text x="745" y="384" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">byteCount: фактический растр</text>
<rect x="30" y="434" width="1020" height="103" rx="14" fill="#fff1e9" stroke="#db773b" stroke-width="2"/>
<text x="48" y="464" fill="#944118" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="21">Важные границы</text>
<text x="48" y="491" fill="#703718" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="17">Data-only .com НЕ запускать; a86 может переписать исходник .8 при ошибке.</text>
<text x="48" y="517" fill="#703718" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="17">Проверка результата: fc /b (байты) либо bitmap + F5 (изображение).</text>
<text x="34" y="579" fill="#596b7a" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="14">Источник: canonical RAG p0021:c01–p0030:c01 · PDF c. 21–30 · source SHA f65a7ec…d2c</text>
</svg>