<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Подробная схема главы 2: трансляция последовательностей и bitmap с автоматическими проверками">
<rect width="1280" height="960" fill="#f8fafc"/>
<text x="40" y="58" fill="#10263d" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="29">Глава 2 · Подробная схема программирования данных</text>
<text x="40" y="88" fill="#506474" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="17">Генерация байтов без машинных команд · a86 / FreeDOS · PDF 21–30</text>
<rect x="40" y="120" width="565" height="173" rx="15" fill="#e3efff" stroke="#3c79c0" stroke-width="2"/><text x="57" y="152" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">A · Последовательности</text><text x="57" y="181" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Исходник .8 → db/dw/dd и повторения dup</text><text x="57" y="207" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">equ задаёт размер; $ фиксирует текущий адрес</text><text x="57" y="233" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">var_0a.8: 64 повторения (0,1) = 128 байт</text><text x="57" y="259" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">sz equ $ - seq проверяет длину</text>
<rect x="675" y="120" width="565" height="173" rx="15" fill="#dff8ed" stroke="#32886e" stroke-width="2"/><text x="692" y="152" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">B · Структура BMP</text><text x="692" y="181" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">iWidth = 64, iHeight = 32, bitsPerPixel = 1</text><text x="692" y="207" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">pixelsPerByte = 8; bytesPerLine = 8</text><text x="692" y="233" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">byteCount = 256; заголовки + Palette + Pixels</text><text x="692" y="259" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Биты идут от старшего к младшему</text>
<rect x="40" y="320" width="565" height="182" rx="15" fill="#e9f1ff" stroke="#3c79c0" stroke-width="2"/><text x="57" y="352" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">A1 · Трансляция a86</text><text x="57" y="381" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">a86 test1.8 → test1.com + test1.sym</text><text x="57" y="407" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Bad String: сообщения внутри исходного .8</text><text x="57" y="433" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">.old — копия исходника; .und — имена без определения</text><text x="57" y="459" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Conflicting multiple definition: разные значения</text><text x="57" y="485" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Object Overflow: переполнение COM</text>
<rect x="675" y="320" width="565" height="182" rx="15" fill="#e2f6f0" stroke="#32886e" stroke-width="2"/><text x="692" y="352" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">B1 · Инварианты BMP</text><text x="692" y="381" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Colors: требуемое число записей палитры</text><text x="692" y="407" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Colors = ($ - Palette) / 4: фактическое</text><text x="692" y="433" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">zero = ($ - Palette) mod 4: выравнивание</text><text x="692" y="459" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">byteCount = $ - Pixels: длина растра</text><text x="692" y="485" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Несовпадение ловится во время трансляции</text>
<rect x="40" y="530" width="565" height="163" rx="15" fill="#edf4fe" stroke="#3c79c0" stroke-width="2"/><text x="57" y="562" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">A2 · Проверить последовательность</text><text x="57" y="591" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">fc /b var_&lt;n&gt;.com var_&lt;n&gt;.dat</text><text x="57" y="617" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Младший байт слова размещается первым</text><text x="57" y="643" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Успех: набор байтов совпал с эталоном</text><text x="57" y="669" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Данные .com не выполнять как команды</text>
<rect x="675" y="530" width="565" height="163" rx="15" fill="#e7f9ed" stroke="#32886e" stroke-width="2"/><text x="692" y="562" fill="#143f6b" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="20">B2 · Проверить изображение</text><text x="692" y="591" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">a86 bmp_0.8 TO bmp_0.bmp</text><text x="692" y="617" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">bitmap bmp_0.bmp, затем F5 для цвета</text><text x="692" y="643" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">В примере: две красные линии, синий фон</text><text x="692" y="669" fill="#163047" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="15">Строки идут от низа изображения к верху</text>
<rect x="40" y="726" width="1200" height="137" rx="16" fill="#fff1e6" stroke="#d77d3f" stroke-width="2"/>
<text x="60" y="757" fill="#8a3c17" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="21">Эксперименты и риски</text>
<text x="60" y="786" fill="#75401e" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="16">1 → 4 → 8 бит/пиксель: меняются палитра и объём Pixels; не только константа bitsPerPixel.</text>
<text x="60" y="812" fill="#75401e" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="16">a86 способен менять/повреждать исходник; при проблеме восстановить из сохранённого .old.</text>
<text x="60" y="839" fill="#75401e" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="16">Источник p. 23 содержит несогласованность «284 − 256 = 128»; см. source-findings.md.</text>
<text x="40" y="917" fill="#586d7b" font-family="DejaVu Sans,sans-serif" font-weight="normal" font-size="14">Provenance: 10 адресуемых RAG-чанков p0021:c01–p0030:c01 · Отдельный исходный PDF не читался.</text>
</svg>