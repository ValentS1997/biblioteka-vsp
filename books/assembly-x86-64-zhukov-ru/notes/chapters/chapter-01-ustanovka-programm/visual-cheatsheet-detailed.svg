<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-label="Подробная схема главы 1: Bochs FreeDOS рабочий и отладочный запуск">
 <rect width="1200" height="830" fill="#f8fafc"/>
 <text x="38" y="55" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" fill="#0f172a">Глава 1 · Подготовка Bochs–FreeDOS</text>
 <text x="38" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#475569">Детальная RAG-схема: PDF с. 15–19 | книга №0017 | версия среды в источнике: Bochs 2.7</text>
 <g font-family="DejaVu Sans, sans-serif">
  <rect x="38" y="117" width="530" height="137" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="57" y="147" font-size="20" font-weight="bold" fill="#1e3a8a">01 · Стартовый каталог</text>
  <text x="57" y="177" font-size="16" fill="#1e3a8a">arch/01 → __work.bat, __debug.bat, bochsrc</text>
  <text x="57" y="203" font-size="16" fill="#1e3a8a">Добавить BIOS, VGA BIOS и оба Bochs EXE</text>
  <text x="57" y="230" font-size="15" fill="#1e3a8a">-f: файл параметров · -q: без диалога</text>
  <rect x="632" y="117" width="530" height="137" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="651" y="147" font-size="20" font-weight="bold" fill="#3730a3">02 · Создать FreeDOS-образ</text>
  <text x="651" y="177" font-size="16" fill="#3730a3">fdosmini.img → disk_c.img</text>
  <text x="651" y="203" font-size="16" fill="#3730a3">__work.bat → загрузка → C:\&gt;</text>
  <text x="651" y="230" font-size="15" fill="#3730a3">Без образа Bochs сообщает о disk_c.img</text>
  <path d="M569 187 H621 M611 180 L622 187 L611 194" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="38" y="292" width="530" height="154" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="57" y="325" font-size="20" font-weight="bold" fill="#065f46">03 · Наполнить образ</text>
  <text x="57" y="354" font-size="16" fill="#065f46">Резервная копия → DOS-утилиты</text>
  <text x="57" y="382" font-size="16" fill="#065f46">WinImage: tools, work, autoexec.bat</text>
  <text x="57" y="414" font-size="15" fill="#065f46">Рекурсивное удаление dos — отдельный риск</text>
  <rect x="632" y="292" width="530" height="154" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="651" y="325" font-size="20" font-weight="bold" fill="#166534">04 · Проверить рабочий запуск</text>
  <text x="651" y="354" font-size="16" fill="#166534">__work.bat → FreeDOS → Volkov Commander</text>
  <text x="651" y="382" font-size="16" fill="#166534">Вызвать a86, nasm, bitmap</text>
  <text x="651" y="414" font-size="15" fill="#166534">Не должно быть Bad command or filename</text>
  <path d="M895 254 V283 M889 273 L895 284 L901 273 M569 373 H621 M611 366 L622 373 L611 380" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="38" y="485" width="1124" height="122" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="57" y="519" font-size="20" font-weight="bold" fill="#5b21b6">05 · Проверить отладочный запуск</text>
  <text x="57" y="547" font-size="16" fill="#5b21b6">__debug.bat формирует параметры из bochsrc + debug_on.txt (display_library: gui_debug).</text>
  <text x="57" y="574" font-size="16" fill="#5b21b6">bochsdbg.exe → графический debugger → останов по fffffff0 → Continue.</text>
  <path d="M897 446 V475 M891 465 L897 476 L903 465" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="38" y="637" width="1124" height="123" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="57" y="668" font-size="20" font-weight="bold" fill="#9a3412">Риски и rollback boundary</text>
  <text x="57" y="696" font-size="16" fill="#7c2d12">WinImage: в примечаниях описаны ошибки при массовом удалении (версии 10.0/11.0).</text>
  <text x="57" y="722" font-size="16" fill="#7c2d12">Сохранять копии disk_c.img; перед форматированием USB — backup. Точные шаги восстановления: [Needs confirmation].</text>
  <text x="38" y="797" font-size="13" fill="#64748b">RAG chunks p0015:c01, p0016:c01, p0017:c01, p0018:c01, p0019:c01 · Без внешних дополнений.</text>
 </g>
</svg>
