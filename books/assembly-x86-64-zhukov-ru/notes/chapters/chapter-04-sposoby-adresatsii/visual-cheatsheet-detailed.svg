<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960" role="img" aria-label="Подробная визуальная памятка главы 4: регистровая, непосредственная, прямая и косвенная адресация">
<rect width="1300" height="960" fill="#f8fafc"/>
<g font-family="DejaVu Sans,sans-serif">
<text x="34" y="53" font-size="30" font-weight="bold" fill="#112942">Глава 4 · Способы адресации · подробная схема</text>
<text x="34" y="84" font-size="16" fill="#597083">RAG PDF 57–68 · a86 / i8086/286 · регистры, память, размеры, ограничения</text>
<rect x="34" y="115" width="596" height="165" rx="14" fill="#e4efff" stroke="#4177bd" stroke-width="2"/>
<text x="52" y="146" font-size="22" font-weight="bold" fill="#174a79">01 · Регистры и операнды</text>
<text x="52" y="179" font-size="17" fill="#223c58">ax bx cx dx sp bp si di — 16 бит</text>
<text x="52" y="207" font-size="16" fill="#223c58">ah/al, bh/bl, ch/cl, dh/dl — байтовые части</text>
<text x="52" y="236" font-size="16" fill="#223c58">mov ax,10 / add al,bl / shl ax,cl</text>
<text x="52" y="261" font-size="15" fill="#365975">Источник: листинги 4.1–4.3 · с. 57–60</text>
<rect x="670" y="115" width="596" height="165" rx="14" fill="#e4f8ed" stroke="#30946d" stroke-width="2"/>
<text x="688" y="146" font-size="22" font-weight="bold" fill="#13654e">02 · Immediate и direct</text>
<text x="688" y="179" font-size="17" fill="#254f3f">add ax,1 — константа внутри инструкции</text>
<text x="688" y="207" font-size="16" fill="#254f3f">not byte [082] — прямой адрес памяти</text>
<text x="688" y="236" font-size="16" fill="#254f3f">not [082] — неизвестна ширина; inc 7 — ошибка</text>
<text x="688" y="261" font-size="15" fill="#39745c">Источник: листинги 4.4–4.5 · с. 60–62</text>
<rect x="34" y="309" width="596" height="182" rx="14" fill="#eaf2ff" stroke="#477cbd" stroke-width="2"/>
<text x="52" y="342" font-size="22" font-weight="bold" fill="#174a79">03 · Косвенная и указатель</text>
<text x="52" y="376" font-size="17" fill="#223c58">mov si, offset area</text>
<text x="52" y="404" font-size="17" fill="#223c58">inc b[si] → инкремент памяти по адресу si</text>
<text x="52" y="432" font-size="16" fill="#223c58">inc si → следующий байт</text>
<text x="52" y="467" font-size="15" fill="#365975">Для i8086/286: только si/di/bx/bp · с. 63–64</text>
<rect x="670" y="309" width="596" height="182" rx="14" fill="#e8f8ef" stroke="#30946d" stroke-width="2"/>
<text x="688" y="342" font-size="22" font-weight="bold" fill="#13654e">04 · Индекс со смещением</text>
<text x="688" y="376" font-size="17" fill="#254f3f">mov si, 0; inc [si+area]</text>
<text x="688" y="404" font-size="16" fill="#254f3f">area[si] = [si]area = [area+si]</text>
<text x="688" y="432" font-size="16" fill="#254f3f">dw / w[si] / add si,2 → массив слов</text>
<text x="688" y="467" font-size="15" fill="#39745c">Источник: листинги 4.9–4.12 · с. 64–65</text>
<rect x="34" y="522" width="596" height="174" rx="14" fill="#eee9ff" stroke="#816bce" stroke-width="2"/>
<text x="52" y="556" font-size="22" font-weight="bold" fill="#5c438f">05 · Базово-индексная</text>
<text x="52" y="588" font-size="17" fill="#443567">База: bx / bp · индекс: si / di</text>
<text x="52" y="618" font-size="16" fill="#443567">inc b[bx+si] · inc b[bp+di+2]</text>
<text x="52" y="649" font-size="16" fill="#443567">inc b[si+di] — недопустимая пара</text>
<text x="52" y="677" font-size="15" fill="#62548b">Источник: листинг 4.13 · с. 66</text>
<rect x="670" y="522" width="596" height="174" rx="14" fill="#f1ecff" stroke="#816bce" stroke-width="2"/>
<text x="688" y="556" font-size="22" font-weight="bold" fill="#5c438f">06 · Ширина и ограничения</text>
<text x="688" y="588" font-size="17" fill="#443567">b / w либо byte ptr / word ptr</text>
<text x="688" y="618" font-size="16" fill="#443567">Не более одного явного операнда памяти</text>
<text x="688" y="649" font-size="16" fill="#443567">movsw: неявные [si] и [di]</text>
<text x="688" y="677" font-size="15" fill="#62548b">Источник: листинги 4.5, 4.14–4.15</text>
<rect x="34" y="727" width="1232" height="147" rx="15" fill="#fff0e6" stroke="#d78650" stroke-width="2"/>
<text x="54" y="762" font-size="22" font-weight="bold" fill="#8d4420">Эксперименты · проверка · границы безопасности</text>
<text x="54" y="792" font-size="16" fill="#754325">a86 +L: проверить коды и диагностику размера; d86 F1: наблюдать только нужную память.</text>
<text x="54" y="820" font-size="16" fill="#754325">Командная строка в PSP с 082 изменяется инструкциями inc; jmp l1 не проверяет конец массива.</text>
<text x="54" y="848" font-size="16" fill="#754325">Пояснение not как «инкремент» в p. 61 — источник требует явной оговорки.</text>
<text x="34" y="921" font-size="14" fill="#697b8a">Provenance: p0057:c01–p0068:c01 · inventory 0017 · source SHA f65a7ec…d2c</text>
</g>
</svg>
