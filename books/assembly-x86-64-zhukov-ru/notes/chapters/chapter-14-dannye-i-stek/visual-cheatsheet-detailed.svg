<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"><rect width="960" height="720" fill="#f8fafc"/><g font-family="sans-serif" fill="#18364b"><text x="30" y="55" font-size="29">Chapter 14 - Detailed Data Diagram</text><rect x="30" y="88" width="900" height="91" rx="10" fill="#dbeafe"/><text x="50" y="135" font-size="22">14.1 - Local data and flat data selectors</text><rect x="30" y="191" width="900" height="91" rx="10" fill="#dcfce7"/><text x="50" y="238" font-size="22">14.2-14.3 - Expand-down limits E and B</text><rect x="30" y="294" width="900" height="91" rx="10" fill="#e0e7ff"/><text x="50" y="341" font-size="22">14.4 - Stack segment, bounds and saved registers</text><rect x="30" y="397" width="900" height="91" rx="10" fill="#ede9fe"/><text x="50" y="444" font-size="22">14.5-14.7 - Unreal mode, A20 and address aliasing</text><rect x="30" y="500" width="900" height="91" rx="10" fill="#f3e8ff"/><text x="50" y="547" font-size="22">14.8-14.11 - Privileges, GDT output and stack</text><text x="30" y="645" font-size="18">Data: max(CPL,RPL) &lt;= DPL ; SS: CPL=DPL=RPL</text><text x="30" y="684" font-size="14">RAG pages 235-252. Visual interpretation, no execution.</text></g></svg>