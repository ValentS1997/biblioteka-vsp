<text x="53" y="487" font-size="21" font-weight="bold" fill="#8e421b">Два правила безопасного исследования</text>
<text x="53" y="518" font-size="17" fill="#77452b">JMP/CALL могут обойти INT 3 буфера: исследовать только в exa2.8 с m1–m7.</text>
<text x="53" y="547" font-size="17" fill="#77452b">INC/DEC не меняют C; REPNE SCASB при CX=0 может завершиться совпадением.</text>
