<g font-size="16" fill="#274158">
<text x="55" y="192">CX=size; SI=array-1</text><text x="55" y="222">INC SI → CMP b[SI],7 → LOOPNE</text><text x="55" y="252">JNE miss: решение по Z, не CX</text><text x="55" y="282">INC после CMP — намеренный дефект 6.2</text>
<text x="705" y="192">DW → CX=size/2; шаг два байта</text><text x="705" y="222">DI=array; AX=7; CLD; SCASW</text><text x="705" y="252">REPNE SCASW совмещает цикл</text><text x="705" y="282">JNE miss после REPNE (6.5)</text>
<text x="55" y="405">CMP b[SI], X → JG found</text><text x="55" y="435">LOOP l1 для оставшихся элементов</text><text x="55" y="465">Нет LOOPNG и REPNG в источнике</text><text x="55" y="493">Листинг 6.7: SCASB и неясный DI/AL</text>
<text x="705" y="405">LODSB → AL</text><text x="705" y="435">CMP AL,10 / JB skip</text><text x="705" y="465">CMP AL,99 / JA skip</text><text x="705" y="493">INC DX; MOV AX,DX в конце</text>
<text x="55" y="618">MAP: 0 на 0–9, 1 на 10–99</text><text x="55" y="648">0 на 100–255, всего 256 байтов</text><text x="55" y="678">BX=MAP; LODSB; XLAT; ADD DX,AX</text><text x="55" y="708">AH должен быть нулём до сложения</text>
<text x="705" y="618">Случай 1: найдено последним (Z=1, CX=0)</text><text x="705" y="648">Случай 2: искомого нет (Z=0)</text><text x="705" y="678">Случай 3: найдено первым (CX не ноль)</text><text x="705" y="708">Тесты диапазона: 9,10,99,100</text></g>
