<text x="56" y="795" font-size="22" font-weight="bold" fill="#91451f">Контроль источника и безопасности</text>
<text x="56" y="826" font-size="16" fill="#77472b">6.2: INC SI после CMP перезаписывает Z; нарушение порядка — часть учебного примера.</text>
<text x="56" y="855" font-size="16" fill="#77472b">6.7: в исходном фрагменте LEA SI,array, хотя SCASB требует DI/AL — source finding.</text>
<text x="56" y="884" font-size="16" fill="#77472b">Изменение тестового массива в d86 меняет данные; восстановление не описано.</text>
<text x="36" y="983" font-size="14" fill="#657b8b">Provenance: p0085:c01–p0092:c01 · SHA f65a7ec…d2c · аналитическая схема без запуска A86</text></g></svg>