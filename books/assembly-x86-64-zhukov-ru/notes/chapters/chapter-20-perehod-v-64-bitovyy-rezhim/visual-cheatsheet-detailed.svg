<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="1040" viewBox="0 0 1190 1040" role="img" aria-label="Подробная визуальная карта листингов 20.1–20.6 и инвариантов long mode"><rect width="1190" height="1040" fill="#f8fafc"/><g font-family="sans-serif" fill="#17354c"><text x="35" y="54" font-size="30">Глава 20 · Подробная карта 64-bit переходов</text><text x="35" y="88" font-size="18">Canonical RAG PDF 331–340 · листинги 20.1–20.6</text><rect x="35" y="119" width="538" height="212" rx="13" fill="#dbeafe"/><rect x="610" y="119" width="545" height="212" rx="13" fill="#dcfce7"/><text x="54" y="159" font-size="23">01. Загрузчик LD0</text><text x="54" y="201" font-size="18">BIN из stdin в буфер</text><text x="54" y="243" font-size="18">Непустой файл меньше буфера</text><text x="54" y="285" font-size="18">Копия в 0:0100: IVT под угрозой</text><text x="630" y="159" font-size="23">02. Дескриптор кода</text><text x="630" y="201" font-size="18">Compatibility: Code32 L=0</text><text x="630" y="243" font-size="18">USE64: Code64 L=1, D=0</text><text x="630" y="285" font-size="18">Paging, FS/GS исключение</text><rect x="35" y="357" width="538" height="212" rx="13" fill="#e0e7ff"/><rect x="610" y="357" width="545" height="212" rx="13" fill="#e5f5ef"/><text x="54" y="397" font-size="23">03. Far JMP</text><text x="54" y="439" font-size="18">Code32 → selector Code64</text><text x="54" y="481" font-size="18">Code64 → indirect far JMP</text><text x="54" y="523" font-size="18">Память: offset 64 + selector 16</text><text x="630" y="397" font-size="23">04. Вентиль CG1</text><text x="630" y="439" font-size="18">16 байт, 64-bit target offset</text><text x="630" y="481" font-size="18">CALL из compatibility mode</text><text x="630" y="523" font-size="18">RETFQ: offset и selector</text><rect x="35" y="594" width="538" height="211" rx="13" fill="#ede9fe"/><rect x="610" y="594" width="545" height="211" rx="13" fill="#f3e8ff"/><text x="54" y="635" font-size="23">05. Вложенный вызов</text><text x="54" y="677" font-size="18">iter начинается с 8</text><text x="54" y="719" font-size="18">В USE64 косвенный far call</text><text x="54" y="761" font-size="18">LOOP по умолчанию через RCX</text><text x="630" y="635" font-size="23">06. Числа Q32.32</text><text x="630" y="677" font-size="18">Старшие 32 — целая часть</text><text x="630" y="719" font-size="18">Младшие 32 — доля</text><text x="630" y="761" font-size="18">3.625 = 3 + 5/8</text><rect x="35" y="834" width="1120" height="138" rx="13" fill="#ffedd5"/><text x="54" y="875" font-size="21">Ограничения доказательства</text><text x="54" y="916" font-size="18">Не все строки подготовки 20.3–20.6 сохранены в RAG; Bochs не запускался.</text><text x="54" y="952" font-size="18">Утверждения о скорости fixed point не измерены, rollback LD0 не подтверждён.</text><text x="35" y="1010" font-size="15">Original explanatory SVG, not reconstructed book illustration · source SHA f65a7ec…d2c</text></g></svg>