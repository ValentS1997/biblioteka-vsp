<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-label="Подробная схема главы 18: переход кольца, права, conforming, TSS, IOPB, paging">
<rect width="1200" height="1010" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" fill="#19384f"><text x="33" y="55" font-size="30" font-weight="bold">Глава 18 · Модель привилегий protected mode</text><text x="33" y="87" font-size="17">Канонический RAG PDF 307–320 · листинги 18.1–18.9</text>
<rect x="33" y="118" width="546" height="232" rx="14" fill="#dbeafe"/><rect x="618" y="118" width="546" height="232" rx="14" fill="#dcfce7"/>
<rect x="33" y="380" width="546" height="232" rx="14" fill="#e0e7ff"/><rect x="618" y="380" width="546" height="232" rx="14" fill="#e6f5ee"/>
<rect x="33" y="643" width="546" height="220" rx="14" fill="#ede9fe"/><rect x="618" y="643" width="546" height="220" rx="14" fill="#f4e8ff"/>
<g font-size="22" font-weight="bold"><text x="54" y="159">01 · Уровни доступа</text><text x="639" y="159">02 · RETF, CPL 0 → 3</text><text x="54" y="421">03 · Конформный код</text><text x="639" y="421">04 · Call Gate и TSS</text><text x="54" y="684">05 · IOPL, IOPB</text><text x="639" y="684">06 · Страничные права</text></g>
<g font-size="18"><text x="54" y="202">CPL — младшие 2 бита CS</text><text x="54" y="240">DPL — дескриптор; RPL — запрос</text><text x="54" y="278">Уровень 0 выше уровня 3</text><text x="54" y="316">Данные: max(CPL,RPL) ≤ DPL</text>
<text x="639" y="202">Стек: SS3, ESP3, CS3, EIP3</text><text x="639" y="240">RETF → CS=0013h, CPL=3</text><text x="639" y="278">ESP=0100h, SS=0023h</text><text x="639" y="316">DS/ES могут стать нулевыми</text>
<text x="54" y="465">DPL0, бит C=1: доступен из CPL3</text><text x="54" y="503">CPL остаётся 3, стек тот же</text><text x="54" y="541">Ring0 data не становится доступной</text><text x="54" y="579">Любой допустимый кодовый offset</text>
<text x="639" y="465">Gate DPL3 → обычный код DPL0</text><text x="639" y="503">CPL становится 0</text><text x="639" y="541">SS0:ESP0 загружаются из TSS</text><text x="639" y="579">LTR связывает TSS с TR</text>
<text x="54" y="727">Если CPL ≤ IOPL: допуск</text><text x="54" y="765">Иначе IOPB в TSS</text><text x="54" y="803">Бит 1 или выход за карту: отказ</text>
<text x="639" y="727">User CPL3, supervisor CPL0–2</text><text x="639" y="765">P=1, User=1, RW=0</text><text x="639" y="803">Нулевая page: читать, не писать</text></g>
<rect x="33" y="894" width="1131" height="78" rx="12" fill="#ffedd5"/><text x="54" y="927" font-size="18">PDF p317 содержит несогласованные результаты IOPL; не считать их проверенным тестом.</text><text x="54" y="955" font-size="16">Системные переключения, запреты I/O и fault-тесты не исполнялись.</text><text x="33" y="993" font-size="13">Поясняющая схема создана заново, а не извлечена из рисунков книги</text></g></svg>