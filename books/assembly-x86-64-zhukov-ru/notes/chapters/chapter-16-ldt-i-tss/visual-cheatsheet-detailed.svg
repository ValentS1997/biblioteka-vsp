<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1050" viewBox="0 0 1160 1050"><rect width="1160" height="1050" fill="#f8fafc"/><g font-family="sans-serif" fill="#18354e"><text x="34" y="60" font-size="32">Глава 16 — подробная схема LDT / TSS</text><text x="34" y="89" font-size="18">Канонический RAG PDF 269–286 · листинги 16.1–16.8</text><rect x="34" y="125" width="527" height="204" rx="13" fill="#dbeafe"/><rect x="599" y="125" width="527" height="204" rx="13" fill="#dcfce7"/><text x="54" y="167" font-size="24">01. Две таблицы</text><text x="54" y="210" font-size="19">LDTR → LDT descriptor in GDT</text><text x="54" y="254" font-size="19">Selector TI=1 → LDT entry</text><text x="54" y="298" font-size="18">LLDT requires protected mode</text><text x="619" y="167" font-size="24">02. Software switch</text><text x="619" y="210" font-size="19">INT: FLAGS, CS, IP</text><text x="619" y="254" font-size="19">PUSH ES / PUSHAD → SP swap</text><text x="619" y="298" font-size="19">POPAD / POP ES / IRET</text><rect x="34" y="361" width="527" height="204" rx="13" fill="#e0e7ff"/><rect x="599" y="361" width="527" height="204" rx="13" fill="#e5f5ef"/><text x="54" y="402" font-size="24">03. TSS fields</text><text x="54" y="445" font-size="19">EIP / EFLAGS / GPR / segments</text><text x="54" y="489" font-size="19">CR3 / LDT / prior link / IOPB</text><text x="54" y="533" font-size="19">Privileged stacks SS0–2 / ESP0–2</text><text x="619" y="402" font-size="24">04. Hardware switch</text><text x="619" y="445" font-size="19">LTR → TR; Far JMP to TSS</text><text x="619" y="489" font-size="19">Available 1001 ↔ Busy 1011</text><text x="619" y="533" font-size="19">New EIP, ESP and selectors</text><rect x="34" y="597" width="527" height="204" rx="13" fill="#ede9fe"/><rect x="599" y="597" width="527" height="204" rx="13" fill="#f3e8ff"/><text x="54" y="638" font-size="24">05. Bochs vs physical PC</text><text x="54" y="682" font-size="19">HW2 passed in Bochs</text><text x="54" y="726" font-size="19">FS/GS inherited invalid selectors</text><text x="54" y="770" font-size="19">HW3 clears unused FS/GS</text><text x="619" y="638" font-size="24">06. Scope of measurements</text><text x="619" y="682" font-size="19">10 million author iterations</text><text x="619" y="726" font-size="19">SW 72 s vs HW 39 s</text><text x="619" y="770" font-size="19">Core 2 Duo E8400, 3.00 GHz</text><rect x="34" y="835" width="1092" height="142" rx="12" fill="#ffedd5"/><text x="54" y="878" font-size="22">Boundary conditions</text><text x="54" y="919" font-size="19">Software sample omits DS, SS, FS, GS and FPU context.</text><text x="54" y="952" font-size="19">Shared ESP is safe only when no stack data survives a switch.</text><text x="34" y="1023" font-size="15">All results source-derived; author figures 16.1–16.3 not reconstructed</text></g></svg>