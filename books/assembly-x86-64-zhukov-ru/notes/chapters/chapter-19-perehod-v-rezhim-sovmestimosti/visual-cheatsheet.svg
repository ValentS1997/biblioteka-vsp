<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f8fafc"/><g font-family="sans-serif" fill="#16374d"><text x="33" y="59" font-size="31">Глава 19. Режим совместимости</text><text x="33" y="93" font-size="18">Long mode: поддержка, разрешение, активация, кодовый режим</text><rect x="33" y="125" width="505" height="164" rx="12" fill="#dbeafe"/><rect x="565" y="125" width="502" height="164" rx="12" fill="#dcfce7"/><text x="52" y="167" font-size="23">CPU: CPUID, EDX[29]</text><text x="52" y="213" font-size="19">EFER: LME bit 8</text><text x="52" y="255" font-size="19">LME не равно LMA</text><text x="585" y="167" font-size="23">Активация long mode</text><text x="585" y="213" font-size="19">PAE + CR3 + paging</text><text x="585" y="255" font-size="19">EFER.LMA = 1</text><rect x="33" y="316" width="505" height="157" rx="12" fill="#e0e7ff"/><rect x="565" y="316" width="502" height="157" rx="12" fill="#ede9fe"/><text x="52" y="356" font-size="23">Страничная таблица</text><text x="52" y="401" font-size="19">PML4 → PDP → DIR → PT0</text><text x="52" y="443" font-size="19">512 × 4 KiB = 2 MiB</text><text x="585" y="356" font-size="23">Кодовый дескриптор</text><text x="585" y="401" font-size="19">L = 0 → compatibility</text><text x="585" y="443" font-size="19">L = 1 → 64-bit code</text><rect x="33" y="506" width="1034" height="95" rx="12" fill="#ffedd5"/><text x="52" y="544" font-size="19">Call gate к L=0 дал сбой Bochs после активации long mode.</text><text x="52" y="577" font-size="17">Опыты не выполнялись, настройки CPU не менялись.</text><text x="33" y="631" font-size="15">RAG PDF 323–330 · inventory 0017 · самостоятельная аналитическая схема</text></g></svg>