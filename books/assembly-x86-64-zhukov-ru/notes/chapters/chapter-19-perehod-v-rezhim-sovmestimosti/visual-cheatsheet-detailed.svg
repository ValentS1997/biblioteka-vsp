<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1010" viewBox="0 0 1160 1010"><rect width="1160" height="1010" fill="#f7fafc"/><g font-family="sans-serif" fill="#17374c"><text x="32" y="56" font-size="31">Глава 19. Long mode — подробная схема</text><text x="32" y="88" font-size="17">RAG PDF 323–330 · исходные листинги 19.1–19.4</text><rect x="32" y="122" width="525" height="216" rx="13" fill="#dbeafe"/><rect x="591" y="122" width="537" height="216" rx="13" fill="#dcfce7"/><text x="52" y="166" font-size="23">01. Capability — CPUID</text><text x="52" y="215" font-size="19">Leaf 80000000h: max leaf</text><text x="52" y="260" font-size="19">Leaf 80000001h: EDX[29]</text><text x="52" y="305" font-size="19">Положительный ответ: CF=1</text><text x="611" y="166" font-size="23">02. Разрешение и активация</text><text x="611" y="215" font-size="19">EFER.LME = bit 8</text><text x="611" y="260" font-size="19">PAE + CR3 + paging</text><text x="611" y="305" font-size="19">EFER.LMA = bit 10</text><rect x="32" y="370" width="525" height="216" rx="13" fill="#e0e7ff"/><rect x="591" y="370" width="537" height="216" rx="13" fill="#e3f3ed"/><text x="52" y="413" font-size="23">03. Четыре уровня страниц</text><text x="52" y="458" font-size="19">PML4 100000h → PDP 101000h</text><text x="52" y="505" font-size="19">DIR 102000h → PT0 103000h</text><text x="52" y="552" font-size="19">512 PTE × 4096 = 2 MiB</text><text x="611" y="413" font-size="23">04. Выбор кода</text><text x="611" y="458" font-size="19">Дескриптор: L=0 → 32-bit</text><text x="611" y="505" font-size="19">Дескриптор: L=1 → 64-bit</text><text x="611" y="552" font-size="19">LMA=1 не означает L=1</text><rect x="32" y="620" width="525" height="203" rx="13" fill="#ede9fe"/><rect x="591" y="620" width="537" height="203" rx="13" fill="#f3e8ff"/><text x="52" y="663" font-size="23">05. Call Gate в GDT</text><text x="52" y="710" font-size="19">Descriptor: 8 + 8 = 16 bytes</text><text x="52" y="757" font-size="19">Смещения от начала GDT</text><text x="611" y="663" font-size="23">06. Ошибка по источнику</text><text x="611" y="710" font-size="19">До long mode: вызов работает</text><text x="611" y="757" font-size="19">После: отказ gate к L=0</text><rect x="32" y="857" width="1096" height="94" rx="12" fill="#ffedd5"/><text x="52" y="892" font-size="20">Интерпретация ограничена примером и логом Bochs.</text><text x="52" y="928" font-size="17">MSR/CR/paging не изменялись; среда не запускалась.</text><text x="32" y="987" font-size="14">Источник: canonical RAG · SVG не восстанавливает рисунки 19.1–19.3</text></g></svg>