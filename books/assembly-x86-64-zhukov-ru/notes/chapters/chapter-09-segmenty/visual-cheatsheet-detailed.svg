<g font-size="17" fill="#2e465d">
<text x="54" y="190">16-битный номер параграфа × 16</text><text x="54" y="220">Плюс 16-битное смещение EA</text><text x="54" y="250">06312:0107 → 063227</text><text x="54" y="280">0b800:0c80 = 0b8c8:0000</text>
<text x="718" y="190">Код: CS:IP; данные: DS:BX/SI/DI</text><text x="718" y="220">Стек: SS:SP и SS:BP</text><text x="718" y="250">Строковый источник: DS:SI</text><text x="718" y="280">Строковый приемник: ES:DI</text>
<text x="54" y="428">COM: PSP 0000–00ff; IP=0100</text><text x="54" y="458">STOSW пишет в B8000 через ES</text><text x="54" y="488">SS:SP переносится согласованно</text><text x="54" y="518">Дальний JMP изменяет CS и IP</text>
<text x="718" y="428">SEGMENT: C1/C2, D1/D2, STACK</text><text x="718" y="458">A86 +O → OBJ; WARPLINK → EXE</text><text x="718" y="488">PUBLIC / EXTRN связывают модули</text><text x="718" y="518">CALL FAR / RETF между секциями</text>
<text x="54" y="666">BP обычно использует SS, BX — DS</text><text x="54" y="696">CS: префикс переопределяет чтение</text><text x="54" y="726">ES:DI у STOS/MOVS не заменить</text><text x="54" y="756">ENTER 2; [BP-2], [BP+4/+6], LEAVE</text>
<text x="718" y="666">Проверить CS, DS, SS, ES, IP и SP</text><text x="718" y="696">Дамп Bochs обновлять через F7</text><text x="718" y="726">PSP / TSR / MCB / вектор 0 рискованны</text><text x="718" y="756">Запуск не выполнялся, rollback неизвестен</text>
</g>
