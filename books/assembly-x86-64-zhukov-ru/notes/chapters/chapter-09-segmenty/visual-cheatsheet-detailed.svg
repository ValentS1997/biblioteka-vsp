<text x="56" y="865" font-size="23" font-weight="bold" fill="#934e2a">Разбор исходника и контроль результата</text>
<text x="56" y="900" font-size="17" fill="#7a462a">Четыре авторских итоговых задания, листинги 9.15 и 9.16 требуют анализа адресов и префиксов.</text>
<text x="56" y="935" font-size="17" fill="#7a462a">В тексте есть расхождение vid_1.com / vid_3.8; см. реестр source findings.</text>
<text x="56" y="968" font-size="17" fill="#7a462a">Не реконструировать исходные рисунки 9.1–9.4 по текстовому RAG без визуального объекта.</text>
