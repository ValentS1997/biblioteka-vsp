<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-label="Глава 17: paging 4K, PSE 4M, PAE 2M, TLB и flat model"><rect width="1120" height="680" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" fill="#18364f"><text x="34" y="60" font-size="31" font-weight="bold">Глава 17 · Преобразование адресов</text><text x="34" y="89" font-size="17">Линейный адрес → таблицы страниц → физический адрес</text><rect x="34" y="118" width="1052" height="104" rx="14" fill="#dbeafe"/><text x="56" y="154" font-size="24" font-weight="bold">Обычная 32-битная трансляция</text><text x="56" y="191" font-size="19">10 бит PDE  |  10 бит PTE  |  12 бит offset  →  страница 4 Кбайт</text><rect x="34" y="257" width="325" height="183" rx="14" fill="#dcfce7"/><rect x="396" y="257" width="325" height="183" rx="14" fill="#e0e7ff"/><rect x="759" y="257" width="327" height="183" rx="14" fill="#ede9fe"/><text x="53" y="294" font-size="23" font-weight="bold">PSE</text><text x="415" y="294" font-size="23" font-weight="bold">PAE</text><text x="778" y="294" font-size="23" font-weight="bold">TLB</text><g font-size="18"><text x="53" y="336">CR4.PSE + PDE.PS</text><text x="53" y="380">Страница 4 Мбайт</text><text x="415" y="336">PDPT, 64-битные записи</text><text x="415" y="380">Страница 2 Мбайт / 4 Кбайт</text><text x="778" y="336">Кеш трансляций</text><text x="778" y="380">INVLPG → очистка страницы</text></g><rect x="34" y="477" width="1052" height="117" rx="14" fill="#ffedd5"/><text x="55" y="516" font-size="23" font-weight="bold">Flat model: линейный 0x100 → физический 0x37100</text><text x="55" y="550" font-size="18">Нулевая база CS/DS/SS + PTE[0] → другой физический кадр</text><text x="34" y="649" font-size="15">RAG PDF 287–306 · аналитическая схема, не оригинальные рисунки 17.1–17.6</text></g></svg>