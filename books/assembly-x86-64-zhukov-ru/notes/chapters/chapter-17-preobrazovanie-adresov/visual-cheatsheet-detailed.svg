<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1100" viewBox="0 0 1360 1100" role="img" aria-label="Подробная схема адресных преобразований главы 17, структура таблиц, TLB, PSE/PAE и flat model"><rect width="1360" height="1100" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" fill="#19384f"><text x="36" y="56" font-size="30" font-weight="bold">Глава 17 · Виртуальная адресация: от PDE до физической страницы</text><text x="36" y="84" font-size="17">Канонический RAG PDF 287–306 · 13 нумерованных листингов</text><rect x="35" y="114" width="628" height="222" rx="14" fill="#dbeafe"/><rect x="699" y="114" width="625" height="222" rx="14" fill="#dcfce7"/><rect x="35" y="364" width="628" height="220" rx="14" fill="#e0e7ff"/><rect x="699" y="364" width="625" height="220" rx="14" fill="#e6f7ef"/><rect x="35" y="612" width="628" height="216" rx="14" fill="#ede9fe"/><rect x="699" y="612" width="625" height="216" rx="14" fill="#f3e8ff"/><g font-size="23" font-weight="bold"><text x="54" y="153">01 · Классическая схема</text><text x="718" y="153">02 · TLB и перенаправление</text><text x="54" y="404">03 · PSE / Page Fault</text><text x="718" y="404">04 · PAE / PDPT</text><text x="54" y="651">05 · Измерение результата</text><text x="718" y="651">06 · Flat model</text></g><g font-size="18"><text x="54" y="198">CR3 → каталог 1024 × 4 байта</text><text x="54" y="237">PDE → таблица 1024 × 4 байта</text><text x="54" y="276">10 + 10 + 12 бит → кадр + offset</text><text x="718" y="198">Линейная страница 0x12 → физическая 0xB8</text><text x="718" y="237">Кешированный старый PTE может сохраниться</text><text x="718" y="276">INVLPG удаляет запись всей страницы</text><text x="54" y="450">CR4.PSE=1 и PDE.PS=1 → 4 Мбайт</text><text x="54" y="490">CR2 при #PF 14 содержит fault address</text><text x="54" y="530">Пример: boundary 0x400000, code 2/0</text><text x="718" y="450">CR4.PAE=1, PDPT → PD → PT</text><text x="718" y="490">Записи 64 бита, 512 на страницу</text><text x="718" y="530">PDE.PS=1 → 2 Мбайт, иначе 4 Кбайт</text><text x="54" y="697">Bochs View/Page Table может ошибаться</text><text x="54" y="737">PAE-large: тест физической памяти проходит</text><text x="54" y="777">Не смешивать UI и реальную адресацию</text><text x="718" y="697">TSR8K содержит выровненные 4 Кбайт</text><text x="718" y="737">PTE[0] → physical frame 0x37000</text><text x="718" y="777">Linear EIP 0x100 → physical 0x37100</text></g><rect x="35" y="859" width="1289" height="155" rx="14" fill="#ffedd5"/><text x="57" y="900" font-size="23" font-weight="bold">Проверка: адреса и права — по RAG, не по фактическому запуску</text><text x="57" y="938" font-size="18">Подмена PTE, CR0/CR3/CR4, сбои страниц и запись в память у нуля не выполнялись.</text><text x="57" y="975" font-size="18">Источник сообщает о расхождении в отображении Bochs при PAE больших страниц.</text><text x="35" y="1064" font-size="15">Source SHA f65a7ec…d2c · новые аналитические схемы, не оригинальные изображения</text></g></svg>