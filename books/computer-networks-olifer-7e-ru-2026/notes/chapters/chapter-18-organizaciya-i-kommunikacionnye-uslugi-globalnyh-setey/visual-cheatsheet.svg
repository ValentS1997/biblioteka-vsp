<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Глава 18  •  Глобальные проводные сети"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#60A5FA"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#0E1727" stroke="none"/><text x="48" y="57" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Глава 18  •  Глобальные проводные сети</text><text x="49" y="92" fill="#91A8C5" font-family="Arial, sans-serif" font-size="17" font-weight="400">Олиферы, 7-е изд.  |  PDF 556–564  |  RAG grounded</text><rect x="44" y="130" width="352" height="310" rx="16" fill="#17243A" stroke="#33455F"/><rect x="64" y="154" width="6" height="30" rx="3" fill="#34D399" stroke="none"/><text x="83" y="177" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="23" font-weight="700">РОЛИ</text><text x="69" y="221" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Оператор: владеет сетью</text><text x="69" y="255" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">и поддерживает инфраструктуру.</text><text x="69" y="289" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Провайдер: продаёт услугу.</text><text x="69" y="323" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Роли могут совпадать.</text><text x="69" y="357" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Инфраструктура может</text><text x="69" y="391" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">арендоваться у партнёра.</text><rect x="423" y="130" width="354" height="310" rx="16" fill="#17243A" stroke="#33455F"/><rect x="443" y="154" width="6" height="30" rx="3" fill="#FBBF24" stroke="none"/><text x="462" y="177" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="23" font-weight="700">УСЛУГА ≠ ТЕХНОЛОГИЯ</text><text x="448" y="221" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Услуги: доступ, VPN, связь,</text><text x="448" y="255" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">информационные сервисы.</text><text x="448" y="289" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">IP, Ethernet, MPLS —</text><text x="448" y="323" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">возможные основы услуги.</text><text x="448" y="357" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">SDH / OTN / DWDM —</text><text x="448" y="391" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">первичная сеть.</text><rect x="803" y="130" width="354" height="310" rx="16" fill="#17243A" stroke="#33455F"/><rect x="823" y="154" width="6" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="842" y="177" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="23" font-weight="700">АРХИТЕКТУРА</text><text x="828" y="221" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Клиент → UNI / PoP</text><text x="828" y="255" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">→ доступ → агрегация</text><text x="828" y="289" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">→ IP-магистраль.</text><text x="828" y="323" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">ЦОД: магистраль / edge.</text><text x="828" y="357" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Edge — для задач с</text><text x="828" y="391" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="18" font-weight="400">низкой задержкой.</text><rect x="44" y="468" width="1113" height="185" rx="18" fill="#17243A" stroke="#33455F"/><text x="69" y="513" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="23" font-weight="700">ИНТЕРНЕТ = НЕЗАВИСИМЫЕ ISP И ДОГОВОРНЫЕ СВЯЗИ</text><text x="69" y="553" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="19" font-weight="400">Пиринг / транзит связывают операторов; Tier 1/2/3 — неофициальная градация.</text><rect x="68" y="581" width="1065" height="48" rx="10" fill="#3B2B27" stroke="#A46B43"/><text x="88" y="611" fill="#FDE8B9" font-family="Arial, sans-serif" font-size="19" font-weight="700">IXP — точка встречи, но не автоматический пиринг: нужны соглашение и подключение.</text><text x="47" y="712" fill="#91A8C5" font-family="Arial, sans-serif" font-size="16" font-weight="400">Источник: p0556:c01 – p0564:c01   •   Отмеченные противоречия: source-findings.md</text></svg>