<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1075" viewBox="0 0 1400 1075" role="img" aria-label="Глава 18  •  Организация глобальных сетей"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#60A5FA"/></marker></defs><rect x="0" y="0" width="1400" height="1075" rx="0" fill="#0E1727" stroke="none"/><text x="48" y="57" fill="#F3F6FC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Глава 18  •  Организация глобальных сетей</text><text x="49" y="92" fill="#91A8C5" font-family="Arial, sans-serif" font-size="17" font-weight="400">Концептуальная модель из RAG; не топология реального провайдера</text><text x="55" y="140" fill="#A9C9F5" font-family="Arial, sans-serif" font-size="24" font-weight="700">I. ТРАНСПОРТ И ТОЧКИ ПОДКЛЮЧЕНИЯ</text><rect x="54" y="165" width="228" height="115" rx="13" fill="#23334D" stroke="#476080"/><rect x="68" y="178" width="5" height="30" rx="3" fill="#34D399" stroke="none"/><text x="85" y="200" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">КЛИЕНТ</text><text x="72" y="236" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="16" font-weight="400">Частный / корпоративный</text><rect x="314" y="165" width="228" height="115" rx="13" fill="#23334D" stroke="#476080"/><rect x="328" y="178" width="5" height="30" rx="3" fill="#34D399" stroke="none"/><text x="345" y="200" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">UNI / PoP</text><text x="332" y="236" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="16" font-weight="400">Граница подключения</text><rect x="574" y="165" width="228" height="115" rx="13" fill="#23334D" stroke="#476080"/><rect x="588" y="178" width="5" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="605" y="200" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">ДОСТУП</text><text x="592" y="236" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="16" font-weight="400">Абонентские сети</text><rect x="834" y="165" width="228" height="115" rx="13" fill="#23334D" stroke="#476080"/><rect x="848" y="178" width="5" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="865" y="200" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">АГРЕГАЦИЯ</text><text x="852" y="236" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="16" font-weight="400">Сбор трафика</text><rect x="1094" y="165" width="254" height="115" rx="13" fill="#23334D" stroke="#476080"/><rect x="1108" y="178" width="5" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="1125" y="200" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="18" font-weight="700">IP-МАГИСТРАЛЬ</text><text x="1112" y="236" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="16" font-weight="400">Транзит / стыки</text><line x1="281" y1="222" x2="308" y2="222" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><line x1="541" y1="222" x2="568" y2="222" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><line x1="801" y1="222" x2="828" y2="222" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><line x1="1061" y1="222" x2="1088" y2="222" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><rect x="54" y="309" width="1294" height="80" rx="14" fill="#1B3145" stroke="#315B74"/><text x="79" y="341" fill="#BEF7E0" font-family="Arial, sans-serif" font-size="20" font-weight="700">ОСНОВА ТРАНСПОРТА: SDH / OTN / DWDM</text><text x="79" y="372" fill="#D9E4F4" font-family="Arial, sans-serif" font-size="17" font-weight="400">ЦОД в магистрали и на периферии: edge приближает задержко-чувствительную обработку к устройствам.</text><rect x="54" y="421" width="620" height="280" rx="18" fill="#17243A" stroke="#33455F"/><text x="81" y="462" fill="#FDE68A" font-family="Arial, sans-serif" font-size="23" font-weight="700">II. УСЛУГИ И ПОТРЕБИТЕЛИ</text><text x="81" y="510" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Массовые: стоимость, доступ по имеющимся линиям.</text><text x="81" y="550" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Корпоративные: филиалы, VPN, хостинг.</text><text x="81" y="591" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Услуга ≠ способ реализации: IP, Ethernet, MPLS.</text><text x="81" y="631" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Carrier ≠ provider: ресурсы можно арендовать.</text><text x="81" y="672" fill="#FDBA74" font-family="Arial, sans-serif" font-size="17" font-weight="700">Облака: конфликт классификаций → source-findings.</text><rect x="704" y="421" width="644" height="280" rx="18" fill="#17243A" stroke="#33455F"/><text x="731" y="462" fill="#B7C7FF" font-family="Arial, sans-serif" font-size="23" font-weight="700">III. ОПЕРАТОРЫ И МАСШТАБ</text><text x="731" y="510" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Локальные → региональные → национальные</text><text x="731" y="550" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">→ транснациональные: география и транзит.</text><text x="731" y="591" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">«Оператор операторов» продаёт ресурсы ISP.</text><text x="731" y="631" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Строгая иерархия связей не обязательна.</text><text x="731" y="671" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="19" font-weight="400">Роль PoP: площадка доступа и стыков.</text><rect x="54" y="731" width="1294" height="270" rx="18" fill="#17243A" stroke="#33455F"/><text x="81" y="776" fill="#93C5FD" font-family="Arial, sans-serif" font-size="23" font-weight="700">IV. МЕЖОПЕРАТОРСКОЕ ВЗАИМОДЕЙСТВИЕ</text><rect x="80" y="804" width="380" height="76" rx="12" fill="#23334D" stroke="none"/><text x="101" y="840" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="20" font-weight="700">ISP A</text><text x="101" y="866" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="16" font-weight="400">собственная сеть и политика</text><rect x="511" y="804" width="380" height="76" rx="12" fill="#23334D" stroke="none"/><text x="531" y="840" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="20" font-weight="700">IXP / NAP</text><text x="531" y="866" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="16" font-weight="400">площадка, не договор</text><rect x="942" y="804" width="380" height="76" rx="12" fill="#23334D" stroke="none"/><text x="961" y="840" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="20" font-weight="700">ISP B</text><text x="961" y="866" fill="#E7EDF7" font-family="Arial, sans-serif" font-size="16" font-weight="400">собственная сеть и политика</text><line x1="460" y1="840" x2="506" y2="840" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><line x1="892" y1="840" x2="938" y2="840" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/><text x="81" y="921" fill="#DCE8F9" font-family="Arial, sans-serif" font-size="19" font-weight="400">Пиринг = соглашение + реализованные соединения. Транзит = договорная передача трафика.</text><text x="81" y="957" fill="#FDE68A" font-family="Arial, sans-serif" font-size="18" font-weight="400">Tier 1 / 2 / 3: неофициальная градация оплаты транзита; не характеристика SLA.</text><text x="55" y="1040" fill="#91A8C5" font-family="Arial, sans-serif" font-size="16" font-weight="400">RAG: p0556:c01 – p0564:c01   |   PDF pp. 556–564   |   Источник: издание 2026   |   Не использовать как live-диагностику</text></svg>