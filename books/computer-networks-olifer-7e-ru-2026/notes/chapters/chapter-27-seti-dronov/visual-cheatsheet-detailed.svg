ica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Reverse-route to origin</text><rect x="519" y="938" width="402" height="141" rx="12" fill="#243B55" stroke="#587796"/><text x="534" y="968" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DCCAFF">RREP / ROUTE TABLE</text><text x="535" y="996" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Unicast reverse path</text><text x="535" y="1021" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Next hop, hops, SN freshness</text><text x="535" y="1046" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Первый RREQ не всегда shortest</text><rect x="967" y="938" width="400" height="141" rx="12" fill="#243B55" stroke="#587796"/><text x="982" y="968" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DCCAFF">LINK FAILURE</text><text x="983" y="996" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">RERR invalidation, optional HELLO</text><text x="983" y="1021" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Reactive overhead vs discovery delay</text><text x="983" y="1046" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Geo/energy routing — расширения</text><rect x="42" y="1131" width="1355" height="242" rx="17" fill="#152940" stroke="#496481"/><rect x="61" y="1149" width="7" height="28" rx="3" fill="#38BDF8" stroke="none"/><text x="86" y="1174" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFDFF">V. DTN: СВЯЗЬ В РАЗДЕЛЁННОЙ СЕТИ</text><rect x="70" y="1199" width="403" height="141" rx="12" fill="#243B55" stroke="#587796"/><text x="85" y="1229" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9DE9FF">STORE–CARRY–FORWARD</text><text x="86" y="1257" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Нет постоянного end-to-end пути</text><text x="86" y="1282" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Временное хранение в больших буферах</text><text x="86" y="1307" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Передача, когда возникает контакт</text><rect x="519" y="1199" width="402" height="141" rx="12" fill="#243B55" stroke="#587796"/><text x="534" y="1229" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9DE9FF">EPIDEMIC / PROPHET</text><text x="535" y="1257" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Replicate messages vs network load</text><text x="535" y="1282" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Probability from encounter history</text><text x="535" y="1307" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">No universal delivery/latency guarantee</text><rect x="967" y="1199" width="400" height="141" rx="12" fill="#243B55" stroke="#587796"/><text x="982" y="1229" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9DE9FF">MOBILE FERRY</text><text x="983" y="1257" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Специализированный мобильный relay</text><text x="983" y="1282" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Доставляет между разными partitions</text><text x="983" y="1307" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Не пригоден как real-time flight link</text><rect x="43" y="1400" width="1353" height="221" rx="13" fill="#41302D" stroke="#A87A57"/><text x="67" y="1443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFEBD2">SOURCE FINDINGS</text><text x="67" y="1480" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F8D9BC">Iridium orbit label, 802.11s/OCR, LoRaWAN D2D, RFC 9854 и AODV scheme — source-only.</text><text x="67" y="1518" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F8D9BC">Live radios, flight permissions, positions, compatibility, safety and rollback = [Needs confirmation].</text><text x="67" y="1556" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F8D9BC">Вопросы к части VI начинаются PDF 884 — за пределами главы 27.</text><text x="44" y="1669" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#A8C1D8">Book: computer-networks-olifer-7e-ru-2026  |  Source: p0844:c01–p0883:c01</text></svg>