s</text><text x="535" y="528" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Self-discovery и cluster changes</text><rect x="967" y="420" width="400" height="137" rx="12" fill="#243B55" stroke="#587796"/><text x="982" y="450" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9BF1C4">ONBOARD SYSTEMS</text><text x="983" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Airframe, autopilot, payload</text><text x="983" y="503" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Radio forwarding and onboard CPU</text><text x="983" y="528" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Ground operator — отдельный контур</text><rect x="42" y="611" width="1355" height="239" rx="17" fill="#152940" stroke="#496481"/><rect x="61" y="629" width="7" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="86" y="654" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFDFF">III. КОММУНИКАЦИОННЫЙ СТЕК И ТИПЫ ЛИНКОВ</text><rect x="70" y="680" width="403" height="133" rx="12" fill="#243B55" stroke="#587796"/><text x="85" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">DRONE↔DRONE</text><text x="86" y="738" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Wi-Fi mesh / CSMA-CA</text><text x="86" y="763" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">LTE/NR Sidelink D2D</text><text x="86" y="788" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E4EFFA">Локальная низкая задержка</text><rect x="519" y="680" width="402" height="133" rx="12" fill="#243B55" stroke="#587796"/><text x="534" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A"