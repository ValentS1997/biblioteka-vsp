<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="856" viewBox="0 0 1320 856" role="img" aria-label="Глава 27: краткая визуальная сводка FANET, архитектуры, AODV и DTN"><rect x="0" y="0" width="1320" height="856" rx="0" fill="#0D1B2E" stroke="none"/><text x="44" y="59" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#F9FBFF">Глава 27 • Сети дронов (FANET)</text><text x="44" y="97" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#AEC8E2">Олиферы, 7-е изд.  |  PDF 844–883  |  RAG grounded</text><rect x="43" y="134" width="602" height="233" rx="14" fill="#20334D" stroke="#516B88"/><rect x="61" y="152" width="6" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="177" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">АРХИТЕКТУРА FANET</text><text x="66" y="219" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Assisted: БПЛА дополняют инфраструктуру</text><text x="66" y="250" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Supported: дроны сами образуют сеть</text><text x="66" y="281" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Central star / Ad Hoc mesh / multicluster</text><text x="66" y="312" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Gateway + cluster head связывают группы</text><rect x="675" y="134" width="601" height="233" rx="14" fill="#20334D" stroke="#516B88"/><rect x="693" y="152" width="6" height="30" rx="3" fill="#34D399" stroke="none"/><text x="713" y="177" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">3D MOBILITY + STACK</text><text x="698" y="219" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">GNSS / навигация меняют граф связности</text><text x="698" y="250" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Drone↔drone / gateway↔gateway / ground</text><text x="698" y="281" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Wi-Fi mesh, Sidelink, mmWave, SATCOM</text><text x="698" y="312" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">IP, UDP/TCP/QUIC, приложения миссии</text><rect x="43" y="396" width="602" height="229" rx="14" fill="#20334D" stroke="#516B88"/><rect x="61" y="414" width="6" height="30" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="439" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">AODV: МАРШРУТ ПО ЗАПРОСУ</text><text x="66" y="481" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">RREQ + TTL/B-ID → поиск соседей</text><text x="66" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">RREP → reverse path и SN</text><text x="66" y="543" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">RERR → инвалидизация сломанных путей</text><text x="66" y="574" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Reactive снижает постоянный overhead</text><rect x="675" y="396" width="601" height="229" rx="14" fill="#20334D" stroke="#516B88"/><rect x="693" y="414" width="6" height="30" rx="3" fill="#A78BFA" stroke="none"/><text x="713" y="439" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">DTN: КОГДА СЕТЬ РАЗДЕЛЕНА</text><text x="698" y="481" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Нет непрерывного IP end-to-end пути</text><text x="698" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Store–carry–forward и буферы</text><text x="698" y="543" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Epidemic / PROPHET / mobile ferry</text><text x="698" y="574" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E3EFFB">Большая задержка, не real-time управление</text><rect x="43" y="658" width="1233" height="128" rx="13" fill="#42302B" stroke="#AA7756"/><text x="66" y="695" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE9CB">SOURCE BOUNDARY: спутниковая схема, RFC, mmWave и AODV — учебные описания.</text><text x="66" y="740" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F3D6BA">Полетная безопасность, интерфейсы и регуляторные ограничения: [Needs confirmation].</text><text x="44" y="835" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A4BFD9">RAG p0844:c01–p0883:c01   •   вопросы к части VI с PDF 884 вынесены отдельно</text></svg>