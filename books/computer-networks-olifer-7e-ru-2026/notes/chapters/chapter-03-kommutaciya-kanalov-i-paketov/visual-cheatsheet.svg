<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930">
<rect width="1500" height="930" fill="#f8fafb"/>
<text x="50" y="58" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#183247">Глава 3 · Коммутация каналов и пакетов</text>
<text x="50" y="92" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52697a">RAG p0081:c01–p0107:c01 · PDF 81–107 · printed 80–106</text>

<rect x="70" y="140" width="610" height="255" rx="18" fill="#e9f0f6" stroke="#b9cbd8"/>
<text x="102" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#234b64">Circuit switching</text>
<text x="102" y="233" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#35576a">① route + resource check</text>
<text x="102" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#35576a">② reserve elementary channels end-to-end</text>
<text x="102" y="307" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#35576a">③ fixed composite circuit during session</text>
<text x="102" y="344" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#35576a">Predictable · no packet queues · idle capacity during pauses</text>
<text x="102" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#5c7281">p0081–p0089</text>

<rect x="820" y="140" width="610" height="255" rx="18" fill="#eef4e8" stroke="#c3d4b8"/>
<text x="852" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#365b31">Packet switching</text>
<text x="852" y="233" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#496449">① split into packets + headers</text>
<text x="852" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#496449">② store-and-forward + buffers</text>
<text x="852" y="307" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#496449">③ dynamic sharing → queues / possible loss</text>
<text x="852" y="344" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#496449">Efficient for bursty traffic · variable delay</text>
<text x="852" y="378" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#65775e">p0089–p0104</text>

<text x="715" y="265" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#6c7e8a">vs</text>

<rect x="70" y="455" width="430" height="205" rx="16" fill="#f8efe2" stroke="#ddc9aa"/>
<text x="98" y="498" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#78532e">Datagram</text>
<text x="98" y="540" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">Packet independent</text>
<text x="98" y="575" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">Full destination address</text>
<text x="98" y="610" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">Best effort · paths may differ</text>

<rect x="535" y="455" width="430" height="205" rx="16" fill="#eee8f6" stroke="#c9bad9"/>
<text x="563" y="498" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#593f73">Logical connection</text>
<text x="563" y="540" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#624f74">Endpoint state / parameters</text>
<text x="563" y="575" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#624f74">Reliability / security features</text>
<text x="563" y="610" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#624f74">Packets can take different paths</text>

<rect x="1000" y="455" width="430" height="205" rx="16" fill="#e5edf7" stroke="#bdcce0"/>
<text x="1028" y="498" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2b4e78">Virtual circuit</text>
<text x="1028" y="540" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#3c5878">Fixed path + flow label</text>
<text x="1028" y="575" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#3c5878">Compact forwarding state</text>
<text x="1028" y="610" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#3c5878">Still packet switching</text>

<rect x="180" y="715" width="1140" height="135" rx="18" fill="#fff3dd" stroke="#dfca9b"/>
<text x="212" y="760" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#785f2d">Delay decomposition</text>
<text x="212" y="802" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#6c5c3a">propagation + serialization + packetization + queueing + switching · queueing is load-dependent</text>
<text x="50" y="895" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#63798a">No executable CLI in chapter · Ethernet pp.105–107 grounds the abstractions in a concrete packet technology</text>
</svg>