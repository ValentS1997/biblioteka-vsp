<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-label="Краткий визуальный конспект главы 25 Wi-Fi и Bluetooth"><rect x="0" y="0" width="1320" height="850" rx="0" fill="#0D1A2D" stroke="none"/><text x="44" y="61" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F8FCFF">Глава 25 • Технологии Wi-Fi и Bluetooth</text><text x="45" y="95" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ABC6E0">Олиферы, 7-е изд.  |  PDF 784–820  |  RAG grounded</text><rect x="43" y="133" width="600" height="234" rx="14" fill="#192E48" stroke="#496685"/><rect x="60" y="151" width="7" height="27" rx="3" fill="#60A5FA" stroke="none"/><text x="82" y="175" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F8FAFF">BSS / ASSOC</text><text x="67" y="219" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">AP — логическая звезда для станций STA</text><text x="67" y="251" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">SSID — сеть; BSSID — конкретная AP/BSS</text><text x="67" y="283" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Beacon / Probe → authentication → AID</text><text x="67" y="315" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">DS / DHCP / IP — отдельная стадия</text><rect x="677" y="133" width="600" height="234" rx="14" fill="#192E48" stroke="#496685"/><rect x="694" y="151" width="7" height="27" rx="3" fill="#34D399" stroke="none"/><text x="716" y="175" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F8FAFF">MAC / QoS / OFDMA</text><text x="701" y="219" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">CSMA/CA: DIFS + CW + backoff + ACK</text><text x="701" y="251" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">RTS/CTS + NAV при hidden station</text><text x="701" y="283" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">WMM: AC_VO / VI / BE / BK, TXOP</text><text x="701" y="315" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Wi-Fi 6: RU, trigger, Block ACK</text><rect x="43" y="394" width="600" height="231" rx="14" fill="#192E48" stroke="#496685"/><rect x="60" y="412" width="7" height="27" rx="3" fill="#FBBF24" stroke="none"/><text x="82" y="436" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F8FAFF">ESS / 802.11s MESH</text><text x="67" y="480" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">ESS: несколько AP, общий SSID, разные BSSID</text><text x="67" y="512" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Roaming: клиент + помощь 802.11k/v/r</text><text x="67" y="544" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">802.11s: Mesh STA / AP / Portal</text><text x="67" y="576" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">PLMP peer link; HWMP к portal и on demand</text><rect x="677" y="394" width="600" height="231" rx="14" fill="#192E48" stroke="#496685"/><rect x="694" y="412" width="7" height="27" rx="3" fill="#A78BFA" stroke="none"/><text x="716" y="436" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F8FAFF">BLUETOOTH CLASSIC / LE</text><text x="701" y="480" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Piconet / scatternet; SCO / ACL</text><text x="701" y="512" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Classic FHSS: 79 × 1 MHz; слоты 625 μs</text><text x="701" y="544" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">BLE: 40 × 2 MHz и low-energy режимы</text><text x="701" y="576" font-size="17.7" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#DFEAF8">Coexistence с Wi-Fi: adaptive hopping</text><rect x="43" y="657" width="1234" height="124" rx="12" fill="#42302B" stroke="#AD7955"/><text x="67" y="701" font-size="18.2" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FFE8C7">SOURCE FINDINGS: конфликт частот каналов, RU 242/252, единиц TX и BLE rates.</text><text x="67" y="737" font-size="17.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#F6D8B9">Проверка норм страны, оборудования, измерений и rollback — [Needs confirmation].</text><text x="44" y="826" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#9FBAD5">RAG p0784:c01–p0820:c01   •   текстовая интерпретация, не восстановленный рисунок PDF</text></svg>