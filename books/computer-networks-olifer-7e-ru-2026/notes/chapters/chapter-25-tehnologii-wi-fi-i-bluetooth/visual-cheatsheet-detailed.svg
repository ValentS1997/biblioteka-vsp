amily="Arial,Helvetica,sans-serif">CLASSIC PICONET</text><text x="88" y="1223" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Главное / подчинённые, scatternet</text><text x="88" y="1249" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">SCO: голос; ACL: данные; profiles</text><text x="88" y="1275" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Discovery и pairing в модели книги</text><rect x="517" y="1165" width="403" height="136" rx="12" fill="#243B54" stroke="#597A9A"/><text x="533" y="1195" font-size="18.5" font-weight="700" fill="#A5F3FC" font-family="Arial,Helvetica,sans-serif">FHSS / BLE</text><text x="533" y="1223" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Classic 79 × 1 MHz, слот 625 μs</text><text x="533" y="1249" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Bluetooth LE 40 × 2 MHz</text><text x="533" y="1275" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Разные варианты PHY и энергорежима</text><rect x="963" y="1165" width="402" height="136" rx="12" fill="#243B54" stroke="#597A9A"/><text x="979" y="1195" font-size="18.5" font-weight="700" fill="#A5F3FC" font-family="Arial,Helvetica,sans-serif">ADAPTIVE FHSS</text><text x="979" y="1223" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Wi-Fi и Bluetooth делят 2.4 GHz</text><text x="979" y="1249" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Bluetooth исключает занятые каналы</text><text x="979" y="1275" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Нормы и performance не проверены</text><rect x="44" y="1356" width="1351" height="182" rx="12" fill="#41312E" stroke="#A97755"/><text x="66" y="1394" font-size="18" fon