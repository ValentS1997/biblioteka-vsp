<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1630" viewBox="0 0 1440 1630" role="img" aria-label="Подробная глава 25 Wi-Fi BSS ESS CSMA CA OFDMA 802.11s Bluetooth"><rect x="0" y="0" width="1440" height="1630" rx="0" fill="#0D1C30" stroke="none"/><text x="44" y="59" font-size="35" font-weight="700" fill="#FAFDFF" font-family="Arial,Helvetica,sans-serif">Глава 25 — Wi-Fi и Bluetooth: архитектуры и MAC</text><text x="44" y="98" font-size="18" font-weight="400" fill="#A9C7E1" font-family="Arial,Helvetica,sans-serif">Подробная RAG-сводка  |  PDF 784–820  |  учебная модель, не конфигурация</text><rect x="44" y="121" width="1351" height="215" rx="17" fill="#16283E" stroke="#41617E"/><rect x="62" y="138" width="7" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="86" y="164" font-size="22" font-weight="700" fill="#FAFCFF" font-family="Arial,Helvetica,sans-serif">I. BSS: АРХИТЕКТУРА, ПРИСОЕДИНЕНИЕ, АДРЕСАЦИЯ</text><rect x="72" y="187" width="402" height="116" rx="12" fill="#243B54" stroke="#597A9A"/><text x="88" y="217" font-size="18.5" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">BSS = STA + AP</text><text x="88" y="245" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Single hop к AP; логическая звезда</text><text x="88" y="271" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">DS = внешняя L2 связь, если присутствует</text><rect x="517" y="187" width="403" height="116" rx="12" fill="#243B54" stroke="#597A9A"/><text x="533" y="217" font-size="18.5" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">DISCOVERY / JOIN</text><text x="533" y="245" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">SSID vs BSSID, beacon и probe</text><text x="533" y="271" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Authentication → association → AID</text><rect x="963" y="187" width="402" height="116" rx="12" fill="#243B54" stroke="#597A9A"/><text x="979" y="217" font-size="18.5" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">L2 → IP</text><text x="979" y="245" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Кадры To AP / From AP, 3–4 адреса</text><text x="979" y="271" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">DHCP и IP — отдельно от join</text><rect x="44" y="353" width="1351" height="235" rx="17" fill="#16283E" stroke="#41617E"/><rect x="62" y="370" width="7" height="28" rx="3" fill="#34D399" stroke="none"/><text x="86" y="396" font-size="22" font-weight="700" fill="#FAFCFF" font-family="Arial,Helvetica,sans-serif">II. CSMA/CA: КОНКУРЕНЦИЯ, ACK, HIDDEN TERMINAL</text><rect x="72" y="419" width="402" height="136" rx="12" fill="#243B54" stroke="#597A9A"/><text x="88" y="449" font-size="18.5" font-weight="700" fill="#A7F3D0" font-family="Arial,Helvetica,sans-serif">DCF / CSMA/CA</text><text x="88" y="477" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Carrier sense → DIFS → random CW</text><text x="88" y="503" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">При занятости: freeze / resume backoff</text><text x="88" y="529" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">При отсутствии ACK: попытка повтора</text><rect x="517" y="419" width="403" height="136" rx="12" fill="#243B54" stroke="#597A9A"/><text x="533" y="449" font-size="18.5" font-weight="700" fill="#A7F3D0" font-family="Arial,Helvetica,sans-serif">NAV И RTS/CTS</text><text x="533" y="477" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Duration резервирует радиоэфир</text><text x="533" y="503" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">RTS → CTS → DATA → ACK</text><text x="533" y="529" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">SIFS обеспечивает очередность ответов</text><rect x="963" y="419" width="402" height="136" rx="12" fill="#243B54" stroke="#597A9A"/><text x="979" y="449" font-size="18.5" font-weight="700" fill="#A7F3D0" font-family="Arial,Helvetica,sans-serif">QOS / AGGREGATION</text><text x="979" y="477" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">WMM AC_VO/VI/BE/BK → TXOP</text><text x="979" y="503" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">A-MSDU и A-MPDU</text><text x="979" y="529" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Block ACK и повтор нужных кадров</text><rect x="44" y="606" width="1351" height="232" rx="17" fill="#16283E" stroke="#41617E"/><rect x="62" y="623" width="7" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="86" y="649" font-size="22" font-weight="700" fill="#FAFCFF" font-family="Arial,Helvetica,sans-serif">III. WI-FI 6/7: ЦЕНТРАЛИЗОВАННАЯ OFDMA</text><rect x="72" y="674" width="402" height="132" rx="12" fill="#243B54" stroke="#597A9A"/><text x="88" y="704" font-size="18.5" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">RESOURCE UNITS</text><text x="88" y="732" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">20 MHz → 256 tones (по источнику)</text><text x="88" y="758" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">RU 26/52/106 и спорное 242/252</text><text x="88" y="784" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">AP планирует ресурс в TXOP</text><rect x="517" y="674" width="403" height="132" rx="12" fill="#243B54" stroke="#597A9A"/><text x="533" y="704" font-size="18.5" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">DOWNLINK</text><text x="533" y="732" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">AP выбирает AID → RU и посылает PPDU</text><text x="533" y="758" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">MU-BAR → STA Block ACK</text><text x="533" y="784" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Legacy STAs работают через CSMA/CA</text><rect x="963" y="674" width="402" height="132" rx="12" fill="#243B54" stroke="#597A9A"/><text x="979" y="704" font-size="18.5" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">UPLINK</text><text x="979" y="732" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">AP: BSRP → BSR → Basic Trigger</text><text x="979" y="758" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">STA передают в своих RU</text><text x="979" y="784" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">AP: Multi-STA Block ACK</text><rect x="44" y="855" width="1351" height="224" rx="17" fill="#16283E" stroke="#41617E"/><rect x="62" y="872" width="7" height="28" rx="3" fill="#A78BFA" stroke="none"/><text x="86" y="898" font-size="22" font-weight="700" fill="#FAFCFF" font-family="Arial,Helvetica,sans-serif">IV. ESS ROAMING И 802.11s MESH</text><rect x="72" y="921" width="402" height="127" rx="12" fill="#243B54" stroke="#597A9A"/><text x="88" y="951" font-size="18.5" font-weight="700" fill="#DDD0FE" font-family="Arial,Helvetica,sans-serif">ESS / ROAMING</text><text x="88" y="979" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">AP1, AP2 и Ethernet DS в одном L2</text><text x="88" y="1005" font-size="16.5" font-weight="400" fill="#E4EEF9" font-family="Arial,Helvetica,sans-serif">Смена BSSID по решению STA</text><tex