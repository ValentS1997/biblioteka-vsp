<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-label="Глава 23: краткий визуальный обзор физического уровня беспроводных сетей"><rect x="0" y="0" width="1320" height="850" rx="0" fill="#0D182A" stroke="none"/><text x="45" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FAFDFF">Глава 23 • Физический уровень беспроводных сетей</text><text x="45" y="97" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ABC5DD">Олиферы, 7-е изд.  |  PDF 687–720  |  RAG grounded</text><rect x="43" y="135" width="610" height="233" rx="15" fill="#1B2B43" stroke="#3C597B"/><rect x="62" y="153" width="6" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#F9FBFF">РАДИОТРАКТ / PROPAGATION</text><text x="66" y="218" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Модулятор → ЦАП → смеситель → антенна</text><text x="66" y="250" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Отражение, дифракция, рассеяние</text><text x="66" y="282" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">LoS / NLoS / BLoS; fading / Doppler</text><text x="66" y="314" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">UL / DL — разные направления</text><rect x="680" y="135" width="597" height="233" rx="15" fill="#1B2B43" stroke="#3C597B"/><rect x="699" y="153" width="6" height="28" rx="3" fill="#34D399" stroke="none"/><text x="718" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#F9FBFF">АНТЕННЫ / MIMO</text><text x="703" y="218" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">dBi: направленный gain, не новая энергия</text><text x="703" y="250" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">SISO / SIMO / MISO / MIMO / MU-MIMO</text><text x="703" y="282" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Diversity улучшает приём; SM — потоки</text><text x="703" y="314" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">CSI, beamforming, precoding</text><rect x="43" y="394" width="610" height="236" rx="15" fill="#1B2B43" stroke="#3C597B"/><rect x="62" y="412" width="6" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="437" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#F9FBFF">LINK BUDGET</text><text x="66" y="477" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">EIRP = Ptx − Ltx + Gtx</text><text x="66" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Prx = EIRP − FSPL + Grx − Lrx</text><text x="66" y="541" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Пример из книги: FSPL 100,04 dB</text><text x="66" y="573" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">Prx −72,04 dBm; margin около 10 dB</text><rect x="680" y="394" width="597" height="236" rx="15" fill="#1B2B43" stroke="#3C597B"/><rect x="699" y="412" width="6" height="28" rx="3" fill="#A78BFA" stroke="none"/><text x="718" y="437" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#F9FBFF">СПЕКТР И MULTIACCESS</text><text x="703" y="477" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">FHSS: перестройка частоты</text><text x="703" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">DSSS: chips; CDMA: codes</text><text x="703" y="541" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">OFDM: параллельные поднесущие</text><text x="703" y="573" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#DEEAF7">OFDMA: деление поднесущих по users</text><rect x="43" y="665" width="1234" height="119" rx="13" fill="#43302D" stroke="#AA7858"/><text x="67" y="706" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE5C2">ОГРАНИЧЕНИЕ: нормативы мощности/частот и радиозапас требуют проверки в реальной сети.</text><text x="67" y="743" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#FAD7B9">Source findings: «20 dBm (100 мВ)», «6 МГц», противоречие OFDMA C6.</text><text x="44" y="825" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A2BED8">RAG p0687:c01–p0720:c01 • визуальная интерпретация текста, не оригинальные рисунки</text></svg>