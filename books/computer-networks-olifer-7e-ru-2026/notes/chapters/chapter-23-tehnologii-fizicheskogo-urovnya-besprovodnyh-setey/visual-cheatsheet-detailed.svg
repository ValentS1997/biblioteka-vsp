<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1630" viewBox="0 0 1440 1630" role="img" aria-label="Глава 23: подробная визуальная карта радиолинии, MIMO, link budget и OFDMA"><rect x="0" y="0" width="1440" height="1630" rx="0" fill="#0B192B" stroke="none"/><text x="43" y="54" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Глава 23 — Радиофизика, MIMO и спектральные методы</text><text x="44" y="89" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ACC8E4">RAG PDF 687–720  |  Концептуальная карта, не измерения и не RF runbook</text><rect x="42" y="111" width="1356" height="215" rx="17" fill="#14253B" stroke="#3F597B"/><rect x="61" y="129" width="8" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="85" y="153" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFE">I. ПЕРЕДАТЧИК И ПРИЁМНИК</text><rect x="72" y="177" width="405" height="119" rx="11" fill="#243952" stroke="#50718F"/><text x="87" y="206" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#BFDBFE">TX PATH</text><text x="89" y="234" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Bits → BPSK/QPSK/QAM</text><text x="89" y="260" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">DAC → mixer → amplifier</text><text x="89" y="286" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Antenna → radio channel</text><rect x="516" y="177" width="405" height="119" rx="11" fill="#243952" stroke="#50718F"/><text x="531" y="206" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#BFDBFE">RX PATH</text><text x="533" y="234" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Antenna → LNA → detector</text><text x="533" y="260" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">ADC → demux/demod</text><text x="533" y="286" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Recovered bits</text><rect x="960" y="177" width="409" height="119" rx="11" fill="#243952" stroke="#50718F"/><text x="975" y="206" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#BFDBFE">RF CHANNEL</text><text x="977" y="234" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">UL / DL в сетях с инфраструктурой</text><text x="977" y="260" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Reflection, diffraction, scattering</text><text x="977" y="286" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Multipath/ISI и Doppler</text><rect x="42" y="345" width="1356" height="219" rx="17" fill="#14253B" stroke="#3F597B"/><rect x="61" y="363" width="8" height="28" rx="3" fill="#34D399" stroke="none"/><text x="85" y="387" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFE">II. СПЕКТР, РАСПРОСТРАНЕНИЕ И РЕГУЛИРОВАНИЕ</text><rect x="72" y="411" width="405" height="125" rx="11" fill="#243952" stroke="#50718F"/><text x="87" y="440" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#86EFAC">ЧАСТОТА / BANDWIDTH</text><text x="89" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Скорость зависит от полосы и SNR</text><text x="89" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Несущая ≠ сама по себе битовая скорость</text><text x="89" y="520" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">RF аппаратные ограничения</text><rect x="516" y="411" width="405" height="125" rx="11" fill="#243952" stroke="#50718F"/><text x="531" y="440" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#86EFAC">LOS / NLOS / BLOS</text><text x="533" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Поверхностные и ионосферные волны</text><text x="533" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Прямые и тропосферные волны</text><text x="533" y="520" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Препятствия и затухание</text><rect x="960" y="411" width="409" height="125" rx="11" fill="#243952" stroke="#50718F"/><text x="975" y="440" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#86EFAC">LICENSED / ISM</text><text x="977" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Спектр регулируется по регионам</text><text x="977" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">EIRP, диапазон, duty cycle</text><text x="977" y="520" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Точные нормы: Needs confirmation</text><rect x="42" y="583" width="1356" height="252" rx="17" fill="#14253B" stroke="#3F597B"/><rect x="61" y="601" width="8" height="28" rx="3" fill="#C4B5FD" stroke="none"/><text x="85" y="625" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFE">III. АНТЕННЫ, MIMO И УСИЛЕНИЕ КАНАЛА</text><rect x="72" y="651" width="405" height="148" rx="11" fill="#243952" stroke="#50718F"/><text x="87" y="680" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#D8C7FF">АНТЕННЫ</text><text x="89" y="708" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Gain dBi: направленное излучение</text><text x="89" y="734" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Pattern, beam width, dipole</text><text x="89" y="760" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Параболическая направленная антенна</text><rect x="516" y="651" width="405" height="148" rx="11" fill="#243952" stroke="#50718F"/><text x="531" y="680" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#D8C7FF">SPATIAL DIVERSITY</text><text x="533" y="708" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">SIMO/MISO и реплики сигнала</text><text x="533" y="734" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">MRC/CSI для улучшения качества</text><text x="533" y="760" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Повышение надёжности, не числа потоков</text><rect x="960" y="651" width="409" height="148" rx="11" fill="#243952" stroke="#50718F"/><text x="975" y="680" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#D8C7FF">SPATIAL MULTIPLEXING</text><text x="977" y="708" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">MIMO: независимые пространственные потоки</text><text x="977" y="734" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">MU-MIMO: нескольких users</text><text x="977" y="760" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Beamforming и precoding по CSI</text><rect x="42" y="855" width="1356" height="223" rx="17" fill="#14253B" stroke="#3F597B"/><rect x="61" y="873" width="8" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="85" y="897" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFE">IV. LINK BUDGET — ИДЕАЛИЗИРОВАННЫЙ РАСЧЁТ</text><rect x="72" y="920" width="405" height="124" rx="11" fill="#243952" stroke="#50718F"/><text x="87" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FDE68A">EIRP</text><text x="89" y="977" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Ptx − Ltx + Gtx, dBm</text><text x="89" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">TX antenna gain и cable losses</text><rect x="516" y="920" width="405" height="124" rx="11" fill="#243952" stroke="#50718F"/><text x="531" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FDE68A">FREE SPACE LOSS</text><text x="533" y="977" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">FSPL = 32,44 + 20log(d_km) + 20log(f_MHz)</text><text x="533" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Учебник: 100,04 dB (1 km / 2400 MHz)</text><rect x="960" y="920" width="409" height="124" rx="11" fill="#243952" stroke="#50718F"/><text x="975" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FDE68A">RECEIVED SIGNAL</text><text x="977" y="977" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Prx = EIRP − FSPL + Grx − Lrx</text><text x="977" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">−72,04 dBm; RX sensitivity −82 dBm</text><text x="977" y="1029" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Запас ≈10 dB в модели автора</text><rect x="42" y="1095" width="1356" height="283" rx="17" fill="#14253B" stroke="#3F597B"/><rect x="61" y="1113" width="8" height="28" rx="3" fill="#38BDF8" stroke="none"/><text x="85" y="1137" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFE">V. FHSS, DSSS, CDMA, OFDM, OFDMA</text><rect x="72" y="1162" width="405" height="182" rx="11" fill="#243952" stroke="#50718F"/><text x="87" y="1191" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8BE1FF">FHSS / DSSS / CDMA</text><text x="89" y="1219" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">FHSS: hopping pseudorandom frequencies</text><text x="89" y="1245" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">DSSS: bit → chips / spreading</text><text x="89" y="1271" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">CDMA: раздельные codes у users</text><text x="89" y="1297" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Не криптографическая гарантия</text><rect x="516" y="1162" width="405" height="182" rx="11" fill="#243952" stroke="#50718F"/><text x="531" y="1191" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8BE1FF">OFDM</text><text x="533" y="1219" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Single user stream → parallel subcarriers</text><text x="533" y="1245" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Orthogonality enables dense carriers</text><text x="533" y="1271" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">S/P → Mod → IFFT → DAC</text><text x="533" y="1297" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">RX: ADC → FFT → Demod</text><rect x="960" y="1162" width="409" height="182" rx="11" fill="#243952" stroke="#50718F"/><text x="975" y="1191" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8BE1FF">OFDMA</text><text x="977" y="1219" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Scheduler делит subcarriers между users</text><text x="977" y="1245" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Динамика по периодам планирования</text><text x="977" y="1271" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">AP / base station выбирает allocation</text><text x="977" y="1297" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#E6EFF9">Ошибка C6 в источнике</text><rect x="44" y="1401" width="1351" height="160" rx="14" fill="#3C2D2C" stroke="#AC7555"/><text x="65" y="1439" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE7C7">SAFETY: линейные оценки, номинальные лимиты и исходные числа НЕ подтверждают live RF performance.</text><text x="65" y="1474" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#FDD9B6">20 dBm «100 мВ» — конфликт единиц. «6 МГц» в списке ISM требует визуальной сверки.</text><text x="65" y="1509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#FDD9B6">Для радиоизменений: access / regulatory compliance / precheck / rollback — Needs confirmation.</text><text x="45" y="1602" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#9FBAD5">RAG: p0687:c01–p0720:c01  |  source-findings.md  |  не реконструкция рисунков 23.1–23.20</text></svg>