<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1700" viewBox="0 0 1440 1700" role="img" aria-label="Подробная визуальная карта главы 28: доступ, безопасность, риски, эшелонирование и криптография"><rect x="0" y="0" width="1440" height="1700" rx="0" fill="#0D1A2C" stroke="none"/><text x="44" y="57" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#FCFEFF">Глава 28 — Информационная безопасность: от риска к ключам</text><text x="44" y="94" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ACC8E0">Олиферы, 7-е изд.  |  PDF 892–924  |  RAG p0892:c01–p0924:c01</text><rect x="44" y="116" width="1352" height="218" rx="16" fill="#152940" stroke="#486681"/><rect x="61" y="133" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="86" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">I. ACCESS CONTROL И МОДЕЛИ БЕЗОПАСНОСТИ</text><rect x="72" y="182" width="403" height="122" rx="12" fill="#243A53" stroke="#5A7593"/><text x="88" y="212" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BBD8FF">ACCESS MODEL</text><text x="88" y="242" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Subject → operation → object</text><text x="88" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Identification / Authentication</text><text x="88" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Authorization: allow or deny</text><rect x="521" y="182" width="403" height="122" rx="12" fill="#243A53" stroke="#5A7593"/><text x="537" y="212" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BBD8FF">CIA / КЦД</text><text x="537" y="242" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Confidentiality: no unauthorized read</text><text x="537" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Integrity: no unauthorized changes</text><text x="537" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Availability: reliable timely service</text><rect x="969" y="182" width="402" height="122" rx="12" fill="#243A53" stroke="#5A7593"/><text x="985" y="212" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BBD8FF">PARKER / TRUST</text><text x="985" y="242" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">CIA + authenticity, possession, utility</text><text x="985" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Non-repudiation: отдельное требование</text><text x="985" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Не смешивать identity и proof of action</text><rect x="44" y="357" width="1352" height="227" rx="16" fill="#152940" stroke="#486681"/><rect x="61" y="374" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="86" y="400" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">II. VULNERABILITY → THREAT → ATTACK → IMPACT</text><rect x="72" y="425" width="403" height="126" rx="12" fill="#243A53" stroke="#5A7593"/><text x="88" y="455" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9BECC9">VULNERABILITY / THREAT</text><text x="88" y="485" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Software defects, permissions, configs</text><text x="88" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Threat: потенциальный путь нарушения</text><text x="88" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Attack: реализованная угроза</text><rect x="521" y="425" width="403" height="126" rx="12" fill="#243A53" stroke="#5A7593"/><text x="537" y="455" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9BECC9">ATTACK TYPES</text><text x="537" y="485" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Passive: observation / interception</text><text x="537" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Active: change or disruption</text><text x="537" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">DoS/DDoS, malware, phishing</text><rect x="969" y="425" width="402" height="126" rx="12" fill="#243A53" stroke="#5A7593"/><text x="985" y="455" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#9BECC9">RISK RESPONSE</text><text x="985" y="485" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">{Impact, probability} + business value</text><text x="985" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Accept / eliminate / reduce / transfer</text><text x="985" y="535" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Назначить priority и owner</text><rect x="44" y="607" width="1352" height="237" rx="16" fill="#152940" stroke="#486681"/><rect x="61" y="624" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="86" y="650" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">III. 4 УРОВНЯ СРЕДСТВ И ПРИНЦИПЫ ЗАЩИТЫ</text><rect x="72" y="673" width="403" height="140" rx="12" fill="#243A53" stroke="#5A7593"/><text x="88" y="703" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">GOVERNANCE</text><text x="88" y="733" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Legislative: rules / standards</text><text x="88" y="758" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Administrative: policy + budget</text><text x="88" y="783" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Procedural: people, backups, controls</text><text x="88" y="808" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Technical: access, IDS, firewall, crypto</text><rect x="521" y="673" width="403" height="140" rx="12" fill="#243A53" stroke="#5A7593"/><text x="537" y="703" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">CONTINUOUS PROCESS</text><text x="537" y="733" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Top-down decisions from business</text><text x="537" y="758" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Analyze assets → assess risks</text><text x="537" y="783" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Implement controls → review again</text><text x="537" y="808" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Proactive rather than purely reactive</text><rect x="969" y="673" width="402" height="140" rx="12" fill="#243A53" stroke="#5A7593"/><text x="985" y="703" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">DEFENSE IN DEPTH</text><text x="985" y="733" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Organizational → physical → network</text><text x="985" y="758" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Perimeter → host → data</text><text x="985" y="783" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Weakest link / balanced strength</text><text x="985" y="808" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Costs vs residual risks vs usability</text><rect x="44" y="864" width="1352" height="240" rx="16" fill="#152940" stroke="#486681"/><rect x="61" y="881" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="86" y="907" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">IV. SYMMETRIC CRYPTO, KEY DISTRIBUTION, DIFFIE–HELLMAN</text><rect x="72" y="933" width="403" height="139" rx="12" fill="#243A53" stroke="#5A7593"/><text x="88" y="963" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FE">SYMMETRIC</text><text x="88" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Same secret for encryption/decryption</text><text x="88" y="1018" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Kerckhoffs: secrecy belongs to key</text><text x="88" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">DES/3DES/AES — исходные примеры</text><text x="88" y="1068" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">n(n−1)/2 pairwise secrets</text><rect x="521" y="933" width="403" height="139" rx="12" fill="#243A53" stroke="#5A7593"/><text x="537" y="963" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FE">DIFFIE–HELLЛMAN</text><text x="537" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Public D/P; private A/B</text><text x="537" y="1018" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">a=D^A mod P; b=D^B mod P</text><text x="537" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">K=b^A mod P=a^B mod P</text><text x="537" y="1068" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Toy P=13: not secure</text><rect x="969" y="933" width="402" height="139" rx="12" fill="#243A53" stroke="#5A7593"/><text x="985" y="963" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FE">TRUST / OPERATIONS</text><text x="985" y="993" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Неопределённая authentication сторон</text><text x="985" y="1018" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">No verified cipher modes or parameters</text><text x="985" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Security policy: Needs confirmation</text><text x="985" y="1068" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">No production key generation</text><rect x="44" y="1126" width="1352" height="241" rx="16" fill="#152940" stroke="#486681"/><rect x="61" y="1143" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="86" y="1169" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">V. ASYMMETRIC CRYPTO И HASH / INTEGRITY</text><rect x="72" y="1195" width="403" height="138" rx="12" fill="#243A53" stroke="#5A7593"/><text x="88" y="1225" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A9EDFF">PUBLIC / PRIVATE KEY</text><text x="88" y="1255" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Public E encrypts for recipient</text><text x="88" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Private D decrypts</text><text x="88" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">RSA: textbook tiny numbers only</text><text x="88" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Certificates bind identity to public key</text><rect x="521" y="1195" width="403" height="138" rx="12" fill="#243A53" stroke="#5A7593"/><text x="537" y="1225" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A9EDFF">RSA TOY / FORMULAS</text><text x="537" y="1255" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">P=7, Q=13, N=91, E=5, D=29</text><text x="537" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">C=X^E mod N (X=82 → C=10)</text><text x="537" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">No modern implementation/mode implied</text><text x="537" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">Protect public key against substitution</text><rect x="969" y="1195" width="402" height="138" rx="12" fill="#243A53" stroke="#5A7593"/><text x="985" y="1225" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A9EDFF">KEYED DIGEST</text><text x="985" y="1255" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">M=H(X,K), receiver compares M'</text><text x="985" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">x mod n is not crypto validation</text><text x="985" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">MD2/MD4/MD5 &amp; generic SHA are dated</text><text x="985" y="1330" font-family="Arial,Helvetica,sans-serif" font-size="16.6" font-weight="400" fill="#E9F1FB">No algorithm-level assurance established</text><rect x="44" y="1400" width="1352" height="203" rx="13" fill="#42302B" stroke="#AD7A54"/><text x="68" y="1444" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#FFE6C7">SOURCE FINDINGS: не подменять учебные формулы современной спецификацией.</text><text x="68" y="1480" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F9D7B9">Точки риска: non-repudiation/authenticity, x mod n, key substitution, DH toy, MD-family.</text><text x="68" y="1515" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F9D7B9">Risk, incident indicators, proof of compliance, current ciphers and rollback = [Needs confirmation].</text><text x="68" y="1551" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F9D7B9">Figures 28.1–28.11 / таблицы RAG повреждены: это концептуальная визуализация текста.</text><text x="44" y="1668" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#A8C1D9">Source: computer-networks-olifer-7e-ru-2026:p0892:c01–p0924:c01  |  source-findings.md</text></svg>