<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-label="Краткий визуальный конспект главы 28: информационная безопасность, AAA, CIA, риск и криптография"><rect x="0" y="0" width="1320" height="850" rx="0" fill="#0B1729" stroke="none"/><text x="44" y="59" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#F8FBFF">Глава 28 • Принципы информационной безопасности</text><text x="44" y="97" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#AEC9E1">Олиферы, 7-е издание  |  PDF 892–924  |  strict RAG-only</text><rect x="43" y="136" width="607" height="233" rx="14" fill="#20334D" stroke="#55718F"/><rect x="60" y="154" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="82" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">ДОСТУП И СВОЙСТВА</text><text x="67" y="221" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Subject / object / operation → доступ</text><text x="67" y="253" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Identification → Authentication → Authorization</text><text x="67" y="285" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">CIA/КЦД: C • I • A</text><text x="67" y="317" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Hexad: + authenticity, possession, utility</text><rect x="677" y="136" width="600" height="233" rx="14" fill="#20334D" stroke="#55718F"/><rect x="694" y="154" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="716" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">УГРОЗЫ И РИСКИ</text><text x="701" y="221" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Vulnerability + threat → attack → impact</text><text x="701" y="253" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Risk: ущерб + вероятность</text><text x="701" y="285" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Реакция: принять / устранить / снизить / передать</text><text x="701" y="317" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">DoS/DDoS, malware, phishing, passive/active</text><rect x="43" y="397" width="607" height="232" rx="14" fill="#20334D" stroke="#55718F"/><rect x="60" y="415" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="82" y="441" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">ПРОЦЕСС ЗАЩИТЫ</text><text x="67" y="482" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">4 уровня: legal / admin / procedural / technical</text><text x="67" y="514" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Top-down + continuous proactive cycle</text><text x="67" y="546" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Defense in depth + weakest link</text><text x="67" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Разумная достаточность и стоимость риска</text><rect x="677" y="397" width="600" height="232" rx="14" fill="#20334D" stroke="#55718F"/><rect x="694" y="415" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="716" y="441" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFCFF">КРИПТОГРАФИЯ</text><text x="701" y="482" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Симметричная: secret key + distribution</text><text x="701" y="514" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">DH: согласование общего секрета</text><text x="701" y="546" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">RSA: public/private, проверка подлинности key</text><text x="701" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17.7" font-weight="400" fill="#E7EFFB">Keyed digest: H(X,K) для integrity</text><rect x="44" y="660" width="1233" height="122" rx="13" fill="#41302D" stroke="#A97A54"/><text x="65" y="701" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE9CC">SOURCE RISKS: toy DH/RSA, mod n, DES/3DES, MD2/MD4/MD5 и общий SHA.</text><text x="65" y="741" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#F8DABF">Не считать учебную схему подтверждённой современной crypto policy или аудитом.</text><text x="44" y="827" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A4BFD8">Источник RAG p0892:c01–p0924:c01  •  концептуальная сводка, не реконструкция PDF</text></svg>