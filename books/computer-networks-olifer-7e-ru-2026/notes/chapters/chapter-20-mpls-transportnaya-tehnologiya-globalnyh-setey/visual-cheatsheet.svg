<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="810" viewBox="0 0 1300 810" role="img" aria-label="Компактная схема главы 20 — MPLS и Traffic Engineering"><rect x="0" y="0" width="1300" height="810" rx="0" fill="#0B1728" stroke="none" /><text x="45" y="57" font-size="35" font-weight="700" fill="#FAFCFF" font-family="Arial,Helvetica,sans-serif">Глава 20  •  MPLS и инженерия трафика</text><text x="45" y="93" font-size="17" font-weight="400" fill="#B0C6E0" font-family="Arial,Helvetica,sans-serif">Олиферы, 7-е издание  |  PDF 608–638  |  RAG grounded</text><rect x="46" y="133" width="575" height="228" rx="15" fill="#17243A" stroke="#334B6D" /><rect x="65" y="153" width="6" height="26" rx="3" fill="#60A5FA" stroke="none" /><text x="84" y="175" font-size="22" font-weight="700" fill="#F4F8FE" font-family="Arial,Helvetica,sans-serif">FORWARDING: FEC → LSP</text><text x="70" y="215" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Ingress LER классифицирует поток (FEC)</text><text x="70" y="244" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">FTN связывает FEC с исходящим LSP</text><text x="70" y="273" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">LSR: LFIB и верхняя метка в стеке</text><text x="70" y="302" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Push / Swap / Pop; PHP на предпоследнем hop</text><rect x="658" y="133" width="596" height="228" rx="15" fill="#17243A" stroke="#334B6D" /><rect x="677" y="153" width="6" height="26" rx="3" fill="#34D399" stroke="none" /><text x="696" y="175" font-size="22" font-weight="700" fill="#F4F8FE" font-family="Arial,Helvetica,sans-serif">CONTROL: LDP и TE</text><text x="682" y="215" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">LDP строит LSP по IGP-маршруту</text><text x="682" y="244" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">TE: OSPF/IS-IS-TE → TED → CSPF</text><text x="682" y="273" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">RSVP-TE: сигнализация + резерв полосы</text><text x="682" y="302" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">SR-MPLS: список SID как SR-Policy</text><rect x="46" y="387" width="575" height="221" rx="15" fill="#17243A" stroke="#334B6D" /><rect x="65" y="407" width="6" height="26" rx="3" fill="#FBBF24" stroke="none" /><text x="84" y="429" font-size="22" font-weight="700" fill="#F4F8FE" font-family="Arial,Helvetica,sans-serif">СТЕК МЕТОК</text><text x="70" y="469" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Shim: label 20 bit + CoS 3 + S 1 + TTL 8</text><text x="70" y="498" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Активна метка на вершине стека</text><text x="70" y="527" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Node-SID глобален; Adj-SID локален</text><text x="70" y="556" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Иерархия: междоменные LSP / VPN</text><rect x="658" y="387" width="596" height="221" rx="15" fill="#17243A" stroke="#334B6D" /><rect x="677" y="407" width="6" height="26" rx="3" fill="#A78BFA" stroke="none" /><text x="696" y="429" font-size="22" font-weight="700" fill="#F4F8FE" font-family="Arial,Helvetica,sans-serif">FAILOVER / ЗАЩИТА</text><text x="682" y="469" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">LDP: восстановление через IGP</text><text x="682" y="498" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">TE: link / node / path protection</text><text x="682" y="527" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">FRR: заранее проложенный detour</text><text x="682" y="556" font-size="18" font-weight="400" fill="#DFEAF8" font-family="Arial,Helvetica,sans-serif">Стек меток возвращает в основной LSP</text><rect x="46" y="640" width="1208" height="103" rx="12" fill="#382A2B" stroke="#A97851" /><text x="69" y="680" font-size="18" font-weight="700" fill="#FDE2BF" font-family="Arial,Helvetica,sans-serif">ГРАНИЦА: пример меток не является конфигурацией, FRR 50 мс — не гарантированный SLA.</text><text x="69" y="714" font-size="18" font-weight="400" fill="#F9D8BC" font-family="Arial,Helvetica,sans-serif">Обнаружены конфликты в таблицах меток p0609 и p0632 — см. source-findings.md.</text><text x="46" y="780" font-size="17" font-weight="400" fill="#9FBAD7" font-family="Arial,Helvetica,sans-serif">Источник: p0608:c01–p0638:c01  •  концептуальная схема по текстовому RAG</text></svg>