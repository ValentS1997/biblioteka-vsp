<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1520" viewBox="0 0 1440 1520" role="img" aria-label="Подробная визуальная сводка MPLS, LDP, Segment Routing и fast reroute главы 20"><rect x="0" y="0" width="1440" height="1520" rx="0" fill="#0B1728" stroke="none"/><text x="46" y="54" font-size="33" font-weight="700" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif">Глава 20  •  MPLS: forwarding, TE и отказоустойчивость</text><text x="46" y="88" font-size="18" font-weight="400" fill="#ABC8E2" font-family="Arial,Helvetica,sans-serif">Подробная RAG-сводка  |  PDF 608–638  |  схемы не являются реальной топологией</text><rect x="45" y="115" width="1350" height="186" rx="17" fill="#15263B" stroke="#405D7D"/><rect x="66" y="135" width="7" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="87" y="158" font-size="24" font-weight="700" fill="#F0F8FF" font-family="Arial,Helvetica,sans-serif">I. DATA PLANE: КЛАССИФИКАЦИЯ, МЕТКА И ПУТЬ</text><rect x="73" y="184" width="283" height="96" rx="12" fill="#203450" stroke="#47688C"/><text x="89" y="213" font-size="19" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">INGRESS LER</text><text x="89" y="242" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">IP packet → FEC</text><text x="89" y="268" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">FTN: FEC → LSP</text><rect x="414" y="184" width="283" height="96" rx="12" fill="#203450" stroke="#47688C"/><text x="430" y="213" font-size="19" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">LSR / LFIB</text><text x="430" y="242" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Incoming label, next hop</text><text x="430" y="268" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Swap / Push / Pop</text><rect x="754" y="184" width="283" height="96" rx="12" fill="#203450" stroke="#47688C"/><text x="770" y="213" font-size="19" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">PENULTIMATE LSR</text><text x="770" y="242" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">PHP: Pop labels</text><text x="770" y="268" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">before egress LER</text><rect x="1095" y="184" width="273" height="96" rx="12" fill="#203450" stroke="#47688C"/><text x="1111" y="213" font-size="19" font-weight="700" fill="#BFDBFE" font-family="Arial,Helvetica,sans-serif">EGRESS LER</text><text x="1111" y="242" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">IP / next-domain</text><text x="1111" y="268" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">forwarding</text><line x1="356" y1="234" x2="407" y2="234" stroke="#89BDF8" stroke-width="3"/><path d="M395 227 L407 234 L395 241" fill="none" stroke="#89BDF8" stroke-width="3"/><line x1="698" y1="234" x2="747" y2="234" stroke="#89BDF8" stroke-width="3"/><path d="M735 227 L747 234 L735 241" fill="none" stroke="#89BDF8" stroke-width="3"/><line x1="1039" y1="234" x2="1088" y2="234" stroke="#89BDF8" stroke-width="3"/><path d="M1076 227 L1088 234 L1076 241" fill="none" stroke="#89BDF8" stroke-width="3"/><rect x="45" y="320" width="1350" height="254" rx="17" fill="#15263B" stroke="#405D7D"/><rect x="66" y="340" width="7" height="28" rx="3" fill="#34D399" stroke="none"/><text x="87" y="363" font-size="24" font-weight="700" fill="#F0F8FF" font-family="Arial,Helvetica,sans-serif">II. CONTROL PLANE: ТРИ ВАРИАНТА УСТАНОВКИ ПУТЕЙ</text><rect x="73" y="388" width="405" height="154" rx="12" fill="#203450" stroke="#47688C"/><text x="89" y="417" font-size="19" font-weight="700" fill="#86EFAC" font-family="Arial,Helvetica,sans-serif">LDP / MPLS IGP</text><text x="89" y="446" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">IGP определяет next-hop</text><text x="89" y="472" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">LDP Hello / TCP 646 / mapping</text><text x="89" y="498" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Labels от downstream → upstream</text><text x="89" y="524" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Путь совпадает с IGP</text><rect x="517" y="388" width="405" height="154" rx="12" fill="#203450" stroke="#47688C"/><text x="533" y="417" font-size="19" font-weight="700" fill="#86EFAC" font-family="Arial,Helvetica,sans-serif">RSVP-TE</text><text x="533" y="446" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">OSPF/IS-IS TE → TED → CSPF</text><text x="533" y="472" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Установка TE-LSP по constraints</text><text x="533" y="498" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Резервирование пропускной полосы</text><text x="533" y="524" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Состояние резервирования на LSR</text><rect x="960" y="388" width="409" height="154" rx="12" fill="#203450" stroke="#47688C"/><text x="976" y="417" font-size="19" font-weight="700" fill="#86EFAC" font-family="Arial,Helvetica,sans-serif">SR-MPLS</text><text x="976" y="446" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Node-SID global / Adj-SID local</text><text x="976" y="472" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">SR-Policy задаёт последовательность</text><text x="976" y="498" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">LFIB forwarding по верхней метке</text><text x="976" y="524" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">TE без per-path RSVP-состояния</text><rect x="45" y="594" width="1350" height="220" rx="17" fill="#15263B" stroke="#405D7D"/><rect x="66" y="614" width="7" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="87" y="637" font-size="24" font-weight="700" fill="#F0F8FF" font-family="Arial,Helvetica,sans-serif">III. MPLS SHIM И ИЕРАРХИЧЕСКИЙ СТЕК</text><rect x="74" y="659" width="1286" height="53" rx="9" fill="#263952" stroke="#6A7F9B"/><rect x="79" y="667" width="559" height="36" rx="6" fill="#3A526F" stroke="none"/><text x="91" y="692" font-size="16" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">LABEL (20 bits)</text><rect x="648" y="667" width="165" height="36" rx="6" fill="#3A526F" stroke="none"/><text x="660" y="692" font-size="16" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">CoS (3 bits)</text><rect x="819" y="667" width="100" height="36" rx="6" fill="#3A526F" stroke="none"/><text x="831" y="692" font-size="16" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">S (1 bits)</text><rect x="925" y="667" width="420" height="36" rx="6" fill="#3A526F" stroke="none"/><text x="937" y="692" font-size="16" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">TTL (8 bits)</text><text x="76" y="744" font-size="19" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Активная метка — верхняя; Push добавляет метку, Swap заменяет, Pop удаляет.</text><text x="76" y="782" font-size="18" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Bottom-of-stack S=1. Стек позволяет независимые уровни внутридоменного и междоменного LSP.</text><rect x="45" y="834" width="1350" height="230" rx="17" fill="#15263B" stroke="#405D7D"/><rect x="66" y="854" width="7" height="28" rx="3" fill="#A78BFA" stroke="none"/><text x="87" y="877" font-size="24" font-weight="700" fill="#F0F8FF" font-family="Arial,Helvetica,sans-serif">IV. TE: ВЫЧИСЛЕНИЕ ПУТИ / КОНТРОЛЛЕРЫ</text><rect x="73" y="902" width="390" height="130" rx="12" fill="#203450" stroke="#47688C"/><text x="89" y="931" font-size="19" font-weight="700" fill="#C4B5FD" font-family="Arial,Helvetica,sans-serif">OSPF-TE / IS-IS-TE</text><text x="89" y="960" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Объявления с bandwidth, delay, color</text><text x="89" y="986" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">TED = граф с расширенными метриками</text><text x="89" y="1012" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">CSPF исключает неподходящие links</text><rect x="517" y="902" width="390" height="130" rx="12" fill="#203450" stroke="#47688C"/><text x="533" y="931" font-size="19" font-weight="700" fill="#C4B5FD" font-family="Arial,Helvetica,sans-serif">Вычисление TE</text><text x="533" y="960" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Ingress LER либо PCE/controller</text><text x="533" y="986" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">CSPF строит путь с ограничениями</text><text x="533" y="1012" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">SR-Policy задаёт Node-/Adj-SID</text><rect x="960" y="902" width="409" height="130" rx="12" fill="#203450" stroke="#47688C"/><text x="976" y="931" font-size="19" font-weight="700" fill="#C4B5FD" font-family="Arial,Helvetica,sans-serif">Доставка SR-Policy</text><text x="976" y="960" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">PCEP/PCC либо BGP-LS</text><text x="976" y="986" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Контроллер → ingress LER</text><text x="976" y="1012" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">В source упомянут BGP SR</text><rect x="45" y="1084" width="1350" height="221" rx="17" fill="#15263B" stroke="#405D7D"/><rect x="66" y="1104" width="7" height="28" rx="3" fill="#F59E0B" stroke="none"/><text x="87" y="1127" font-size="24" font-weight="700" fill="#F0F8FF" font-family="Arial,Helvetica,sans-serif">V. PROTECTION: ЛОКАЛЬНЫЙ ОБХОД ≠ ПОЛНОЕ ВОССТАНОВЛЕНИЕ</text><rect x="73" y="1151" width="390" height="124" rx="12" fill="#203450" stroke="#47688C"/><text x="89" y="1180" font-size="19" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">Отказ link/node</text><text x="89" y="1209" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Обнаружение: RSVP Hello / BFD / LSP Ping</text><text x="89" y="1235" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Наличие обходного LSP до аварии</text><rect x="517" y="1151" width="390" height="124" rx="12" fill="#203450" stroke="#47688C"/><text x="533" y="1180" font-size="19" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">Fast reroute</text><text x="533" y="1209" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Локальный временный detour</text><text x="533" y="1235" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Верхняя bypass-метка + нижняя LSP</text><rect x="960" y="1151" width="409" height="124" rx="12" fill="#203450" stroke="#47688C"/><text x="976" y="1180" font-size="19" font-weight="700" fill="#FDE68A" font-family="Arial,Helvetica,sans-serif">Restoration</text><text x="976" y="1209" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Возврат в исходный LSP</text><text x="976" y="1235" font-size="17" font-weight="400" fill="#DCE9F7" font-family="Arial,Helvetica,sans-serif">Затем полное пересоздание пути</text><rect x="46" y="1330" width="1349" height="116" rx="11" fill="#3D302F" stroke="#A76F54"/><text x="70" y="1368" font-size="18" font-weight="700" fill="#FCE7C8" font-family="Arial,Helvetica,sans-serif">SAFETY BOUNDARY: численные метки, SID и пример 50 мс — сведения учебника, не измерения в production.</text><text x="70" y="1402" font-size="18" font-weight="400" fill="#F9D4B5" font-family="Arial,Helvetica,sans-serif">Противоречия p0609/p0632 отмечены отдельно. Нет конфигурационных команд, precheck или rollback.</text><text x="45" y="1492" font-size="17" font-weight="400" fill="#A2BCD9" font-family="Arial,Helvetica,sans-serif">RAG: computer-networks-olifer-7e-ru-2026:p0608:c01–p0638:c01  |  source-findings.md</text></svg>