<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="853" viewBox="0 0 1320 853" role="img" aria-label="Краткая сводка главы 31: транспортные протоколы, DNS, BGP и IPsec"><rect x="0" y="0" width="1320" height="853" rx="0" fill="#0C192A" stroke="none"/><text x="44" y="56" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">Глава 31 • Безопасность транспортной инфраструктуры</text><text x="45" y="94" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#B4C9DE">Олиферы, 7-е изд.  |  PDF 991–1022  |  RAG 33 чанка</text><rect x="43" y="132" width="603" height="225" rx="14" fill="#1D324A" stroke="#4D6B8A"/><rect x="60" y="150" width="6" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="175" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">TCP / ICMP / UDP / IP</text><text x="65" y="216" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">SYN flood, RST, reflection: риски доступности</text><text x="65" y="246" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">ICMP redirect и фрагментация: поверхность</text><text x="65" y="276" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Source verification и мониторинг — основа</text><text x="65" y="306" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Исторические случаи ≠ текущие уязвимости</text><rect x="674" y="132" width="603" height="225" rx="14" fill="#1D324A" stroke="#4D6B8A"/><rect x="691" y="150" width="6" height="29" rx="3" fill="#34D399" stroke="none"/><text x="712" y="175" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">DNS И BGP</text><text x="696" y="216" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">DNS spoofing и доступность DNS-ответов</text><text x="696" y="246" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">DNSSEC: подлинность данных, не защита DDoS</text><text x="696" y="276" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">BGP prefix/origin/path: риск ошибки маршрута</text><text x="696" y="306" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Инцидент не всегда является атакой</text><rect x="43" y="387" width="603" height="228" rx="14" fill="#1D324A" stroke="#4D6B8A"/><rect x="60" y="405" width="6" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="430" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">ЗАЩИЩЁННЫЙ КАНАЛ</text><text x="65" y="471" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Authentication, integrity, confidentiality</text><text x="65" y="501" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Host–host, gateway–gateway, host–gateway</text><text x="65" y="531" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Transport использует исходный IP header</text><text x="65" y="561" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">Tunnel помещает packet во внешний IP</text><rect x="674" y="387" width="603" height="228" rx="14" fill="#1D324A" stroke="#4D6B8A"/><rect x="691" y="405" width="6" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="712" y="430" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">IPsec: AH / ESP / IKE</text><text x="696" y="471" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">AH — integrity; ESP — encryption</text><text x="696" y="501" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">IKE согласует SA и секреты</text><text x="696" y="531" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">SPD: selector/policy; SAD: действующие SA</text><text x="696" y="561" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E7F0FB">SPI + SN: выбор SA, контроль повторов</text><rect x="43" y="645" width="1234" height="139" rx="13" fill="#403029" stroke="#AF825B"/><text x="67" y="685" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FFE8C9">SOURCE FINDINGS: DNS rates, BGP /17, устаревшие MD5/SHA-1/DES.</text><text x="67" y="727" font-size="17.7" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F5D9BF">Никаких live probes, ключей или команд конфигурирования.</text><text x="43" y="835" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#A9C2D6">Источник: p0991:c01–p1022:c01 + p1019:c02  •  концептуальный SVG</text></svg>