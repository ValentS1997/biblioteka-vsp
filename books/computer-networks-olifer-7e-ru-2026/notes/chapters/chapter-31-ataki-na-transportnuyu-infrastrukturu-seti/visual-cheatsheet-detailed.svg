<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1705" viewBox="0 0 1440 1705" role="img" aria-label="Развёрнутая сводка главы 31: безопасность TCP IP, DNS, BGP, TLS и IPsec"><rect x="0" y="0" width="1440" height="1705" rx="0" fill="#0D1A2B" stroke="none"/><text x="44" y="56" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">Глава 31 — Безопасность сетевой инфраструктуры</text><text x="45" y="92" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#AEC7DE">Канонический RAG · PDF 991–1022 · 33 чанка · source-only</text><rect x="44" y="118" width="1352" height="221" rx="16" fill="#14283E" stroke="#456381"/><rect x="63" y="135" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="87" y="161" font-size="21.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">I. TCP/IP: НАРУШЕНИЯ ДОСТУПНОСТИ И КОНТРОЛЬ</text><rect x="72" y="184" width="402" height="126" rx="12" fill="#263D56" stroke="#577591"/><text x="88" y="214" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#BCDDFE">TCP</text><text x="88" y="241" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Half-open SYN: ресурсный риск</text><text x="88" y="267" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">RST, session data integrity</text><text x="88" y="293" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Наблюдать counters, reconnect</text><text x="88" y="319" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">SYN cookies — defensive concept</text><rect x="520" y="184" width="402" height="126" rx="12" fill="#263D56" stroke="#577591"/><text x="536" y="214" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#BCDDFE">ICMP / UDP</text><text x="536" y="241" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">ICMP redirect и flooding</text><text x="536" y="267" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Reflection и старые echo/chargen</text><text x="536" y="293" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Проверка входного source policy</text><text x="536" y="319" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Smurf/PoD — исторические cases</text><rect x="968" y="184" width="400" height="126" rx="12" fill="#263D56" stroke="#577591"/><text x="984" y="214" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#BCDDFE">IP PACKETS</text><text x="984" y="241" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">IPv4 options, IPv6 ext headers</text><text x="984" y="267" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Fragments / reassembly differences</text><text x="984" y="293" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Slow path может зависеть от платформы</text><text x="984" y="319" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Baseline и log context обязательны</text><rect x="44" y="357" width="1352" height="234" rx="16" fill="#14283E" stroke="#456381"/><rect x="63" y="374" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="87" y="400" font-size="21.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">II. DNS: ПОДЛИННОСТЬ И ДОСТУПНОСТЬ</text><rect x="72" y="426" width="402" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="88" y="456" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A0EDC8">ANSWER TRUST</text><text x="88" y="483" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">DNS spoofing изменяет resolution</text><text x="88" y="509" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Endpoint trust требует доп. защиты</text><text x="88" y="535" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">DNSSEC — подпись DNS данных</text><rect x="520" y="426" width="402" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="536" y="456" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A0EDC8">DNS HARDENING</text><text x="536" y="483" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Restricted recursive service</text><text x="536" y="509" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Zone transfer only trusted peers</text><text x="536" y="535" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">OS hardening и monitoring</text><rect x="968" y="426" width="400" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="984" y="456" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A0EDC8">HISTORICAL EVENTS</text><text x="984" y="483" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">2002, 2007: DNS root incidents</text><text x="984" y="509" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">2013: отражённый DNS traffic</text><text x="984" y="535" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Числа из книги требуют проверки</text><rect x="44" y="609" width="1352" height="234" rx="16" fill="#14283E" stroke="#456381"/><rect x="63" y="626" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="87" y="652" font-size="21.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">III. BGP И ЗАЩИЩЁННЫЕ КАНАЛЫ</text><rect x="72" y="679" width="402" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="88" y="709" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FCE29B">BGP CONTROL PLANE</text><text x="88" y="736" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Origin, prefix, AS path</text><text x="88" y="762" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">More-specific route может победить</text><text x="88" y="788" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">AS7007 / YouTube: historical</text><text x="88" y="814" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Error ≠ always intentional attack</text><rect x="520" y="679" width="402" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="536" y="709" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FCE29B">TRUST BOUNDARY</text><text x="536" y="736" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Host–host, gateway–gateway</text><text x="536" y="762" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Host–gateway for remote access</text><text x="536" y="788" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Protected segment not always end-to-end</text><rect x="968" y="679" width="400" height="133" rx="12" fill="#263D56" stroke="#577591"/><text x="984" y="709" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FCE29B">PROTOCOL FAMILY</text><text x="984" y="736" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">S/MIME, TLS, PPTP, IPsec</text><text x="984" y="762" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Different layers and assumptions</text><text x="984" y="788" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Historic suite ≠ recommended default</text><rect x="44" y="862" width="1352" height="232" rx="16" fill="#14283E" stroke="#456381"/><rect x="63" y="879" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="87" y="905" font-size="21.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">IV. IPsec SA И РЕЖИМЫ ЗАЩИТЫ</text><rect x="72" y="931" width="402" height="129" rx="12" fill="#263D56" stroke="#577591"/><text x="88" y="961" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FF">AH / ESP / IKE</text><text x="88" y="988" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">AH: integrity, authenticity</text><text x="88" y="1014" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">ESP: confidentiality, optional auth</text><text x="88" y="1040" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">IKE: negotiation, key agreement</text><rect x="520" y="931" width="402" height="129" rx="12" fill="#263D56" stroke="#577591"/><text x="536" y="961" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FF">ASSOCIATIONS</text><text x="536" y="988" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">SA — однонаправленный контекст</text><text x="536" y="1014" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Для duplex нужны 2 направления</text><text x="536" y="1040" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Parameters/keys are sensitive</text><rect x="968" y="931" width="400" height="129" rx="12" fill="#263D56" stroke="#577591"/><text x="984" y="961" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FF">PACKET MODE</text><text x="984" y="988" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Transport: original IP header</text><text x="984" y="1014" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Tunnel: new outer IP header</text><text x="984" y="1040" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Host и SG задают trust boundary</text><rect x="44" y="1112" width="1352" height="232" rx="16" fill="#14283E" stroke="#456381"/><rect x="63" y="1129" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="87" y="1155" font-size="21.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">V. SPD, SAD, SPI И ВХОДЯЩИЙ ТРАФИК</text><rect x="72" y="1181" width="402" height="132" rx="12" fill="#263D56" stroke="#577591"/><text x="88" y="1211" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#AAF0FA">SPD SELECTOR</text><text x="88" y="1238" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">IP source/dest, protocol, ports</text><text x="88" y="1264" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Policy: bypass / discard / protect</text><text x="88" y="1290" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Outgoing match selects treatment</text><rect x="520" y="1181" width="402" height="132" rx="12" fill="#263D56" stroke="#577591"/><text x="536" y="1211" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#AAF0FA">SAD / SPI</text><text x="536" y="1238" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">SAD: active SA, algorithms/keys</text><text x="536" y="1264" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Inbound SPI identifies association</text><text x="536" y="1290" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Данные ключей не выводить</text><rect x="968" y="1181" width="400" height="132" rx="12" fill="#263D56" stroke="#577591"/><text x="984" y="1211" font-size="18.6" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#AAF0FA">SN / ANTI-REPLAY</text><text x="984" y="1238" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Sequence numbers on protected packets</text><text x="984" y="1264" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Window detects repeats</text><text x="984" y="1290" font-size="16.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E8F1FB">Not a reliable delivery protocol</text><rect x="44" y="1381" width="1352" height="228" rx="14" fill="#433129" stroke="#AC7C55"/><text x="69" y="1424" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FFE7CC">SOURCE FINDINGS — исторические оценки, не current operational facts</text><text x="69" y="1463" font-size="17.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F7D9BF">SYN/Smurf/fragment claims; DNS отражение и арифметика rates; неверные BGP /17.</text><text x="69" y="1500" font-size="17.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F7D9BF">SSL/TLS mutual-auth overclaim, устаревшие MD5/SHA-1/DES/3DES, ESP choices.</text><text x="69" y="1537" font-size="17.2" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F7D9BF">Live BGP/DNS/IPsec, keys, policies, CI, rendered visuals: [Needs confirmation].</text><text x="44" y="1680" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#A9C0D5">RAG p0991:c01–p1022:c01 + p1019:c02   •   защитный конспект, не сетевой runbook</text></svg>