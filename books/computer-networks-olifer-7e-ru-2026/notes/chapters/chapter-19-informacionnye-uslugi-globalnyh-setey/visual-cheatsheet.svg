<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" role="img" aria-label="Глава 19 — информационные услуги глобальных сетей: компактная визуальная сводка"><rect x="0" y="0" width="1320" height="830" rx="0" fill="#0B1626" stroke="none" /><text x="45" y="61" font-size="34" font-weight="700" fill="#F3F7FD" font-family="Arial,Helvetica,sans-serif">Глава 19  •  Информационные услуги глобальных сетей</text><text x="45" y="95" font-size="18" font-weight="400" fill="#A3BDD9" font-family="Arial,Helvetica,sans-serif">Олиферы · 7-е издание · PDF 565–607 · RAG grounded</text><rect x="45" y="137" width="598" height="245" rx="16" fill="#19263C" stroke="#415372" /><rect x="67" y="160" width="6" height="32" rx="4" fill="#60A5FA" stroke="none" /><text x="88" y="185" font-size="23" font-weight="700" fill="#E7EDF8" font-family="Arial,Helvetica,sans-serif">ВЕБ / HTTP</text><text x="70" y="230" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">URL → браузер → сервер → ответ</text><text x="70" y="264" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">HTTP/1.0 → 1.1 → HTTP/2 → HTTP/3</text><text x="70" y="298" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">HTTP/2: multiplex + TCP HoL</text><text x="70" y="332" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">HTTP/3: QUIC / UDP + TLS</text><rect x="676" y="137" width="598" height="245" rx="16" fill="#19263C" stroke="#415372" /><rect x="698" y="160" width="6" height="32" rx="4" fill="#34D399" stroke="none" /><text x="719" y="185" font-size="23" font-weight="700" fill="#E7EDF8" font-family="Arial,Helvetica,sans-serif">ПОЧТОВАЯ СЛУЖБА</text><text x="701" y="230" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">SMTP: отправка и relay</text><text x="701" y="264" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">DNS MX: сервер домена</text><text x="701" y="298" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">POP3 / IMAP: доступ к письмам</text><text x="701" y="332" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">SMTP accepted ≠ delivered</text><rect x="45" y="414" width="598" height="250" rx="16" fill="#19263C" stroke="#415372" /><rect x="67" y="437" width="6" height="32" rx="4" fill="#FBBF24" stroke="none" /><text x="88" y="462" font-size="23" font-weight="700" fill="#E7EDF8" font-family="Arial,Helvetica,sans-serif">ОБЛАЧНЫЕ СЕРВИСЫ</text><text x="70" y="507" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">Разделяемые ресурсы, elastic, on-demand</text><text x="70" y="541" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">Развёртывание: public / private / hybrid</text><text x="70" y="575" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">Модели: IaaS / PaaS / SaaS</text><text x="70" y="609" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">Провайдер ≠ клиент: зоны контроля</text><rect x="676" y="414" width="598" height="250" rx="16" fill="#19263C" stroke="#415372" /><rect x="698" y="437" width="6" height="32" rx="4" fill="#A78BFA" stroke="none" /><text x="719" y="462" font-size="23" font-weight="700" fill="#E7EDF8" font-family="Arial,Helvetica,sans-serif">УПРАВЛЕНИЕ СЕТЬЮ</text><text x="701" y="507" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">NMS: оператор → менеджер → агент</text><text x="701" y="541" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">SNMP Get / Trap / Set + MIB</text><text x="701" y="575" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">Streaming: устройство → коллектор</text><text x="701" y="609" font-size="19" font-weight="400" fill="#D9E5F6" font-family="Arial,Helvetica,sans-serif">YANG + gRPC; in-band / out-of-band</text><rect x="45" y="700" width="1229" height="73" rx="13" fill="#3B2E2A" stroke="#B07455" /><text x="68" y="732" font-size="18" font-weight="700" fill="#FFE7BC" font-family="Arial,Helvetica,sans-serif">ГРАНИЦА РИСКА:  Telnet передаёт пароль открыто; SNMP Set и HTTP PUT/DELETE меняют состояние.</text><text x="69" y="756" font-size="16" font-weight="400" fill="#FAD7A8" font-family="Arial,Helvetica,sans-serif">Глава не содержит готовых безопасных production CLI-команд; source-findings фиксирует ограничения.</text><text x="45" y="805" font-size="15" font-weight="400" fill="#9BB5D1" font-family="Arial,Helvetica,sans-serif">Provenance: p0565:c01–p0607:c01  •  Схема пересказывает текстовый RAG, не оригинальные рисунки PDF</text></svg>