-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Tree / mesh / beacon superframe</text><rect x="520" y="431" width="399" height="153" rx="11" fill="#263E58" stroke="#577595"/><text x="536" y="460" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#86EFAC">ZIGBEE</text><text x="537" y="489" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Собственный NWK и APS</text><text x="537" y="515" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Tree: иерархические поддиапазоны</text><text x="537" y="541" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Mesh: table-based маршрутизация</text><text x="537" y="567" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Application: switch → lamp</text><rect x="968" y="431" width="399" height="153" rx="11" fill="#263E58" stroke="#577595"/><text x="984" y="460" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#86EFAC">THREAD / WI-SUN FAN</text><text x="985" y="489" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">IPv6 → 6LoWPAN → 802.15.4</text><text x="985" y="515" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">RPL: low-power lossy routing</text><text x="985" y="541" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Thread: Matter/CoAP по автору</text><text x="985" y="567" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Wi-SUN: протяжённые коммунальные сети</text><rect x="43" y="638" width="1355" height="256" rx="16" fill="#152940" stroke="#455F7C"/><rect x="62" y="655" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="85" y="681" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">III. LoRaWAN: STAR-OF-STARS, СЕРВЕРЫ, БЕЗОПАСНОСТЬ</text><rect x="72" y="708" width="399" height="150" rx="11" fill="#263E58" stroke="#577595"/><text x="88" y="737" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FDE68A">END DEVICE / GATEWAY</text><text x="89" y="766" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">ALOHA uplink, нет fixed AP association</text><text x="89" y="792" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Несколько gateways могут принять кадр</text><text x="89" y="818" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Gateway пересылает его по IP/UDP</text><text x="89" y="844" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Нагрузка на эфир остаётся разделяемой</text><rect x="520" y="708" width="399" height="150" rx="11" fill="#263E58" stroke="#577595"/><text x="536" y="737" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FDE68A">NETWORK / JOIN SERVER</text><text x="537" y="766" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Network: dedup, RX quality, ADR</text><text x="537" y="792" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Join: MIC verification, session keys</text><text x="537" y="818" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Device ID и sequence для дублей</text><text x="537" y="844" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Отдельное управление соединением</text><rect x="968" y="708" width="399" height="150" rx="11" fill="#263E58" stroke="#577595"/><text x="984" y="737" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FDE68A">APPLICATION / SECURITY</text><text x="985" y="766" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Application server получает payload</text><text x="985" y="792" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Сеть и приложения имеют key domains</text><text x="985" y="818" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Реальная security policy неизвестна</text><text x="985" y="844" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Частоты/допуски зависят от региона</text><rect x="43" y="916" width="1355" height="230" rx="16" fill="#152940" stroke="#455F7C"/><rect x="62" y="933" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="85" y="959" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">IV. КЛАССЫ КОНЕЧНЫХ УСТРОЙСТВ</text><rect x="72" y="984" width="399" height="128" rx="11" fill="#263E58" stroke="#577595"/><text x="88" y="1013" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FE">CLASS A</text><text x="89" y="1042" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Uplink → RX1 → RX2 → sleep</text><text x="89" y="1068" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Минимальный RX / большие задержки</text><text x="89" y="1094" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Приём запускается после uplink</text><rect x="520" y="984" width="399" height="128" rx="11" fill="#263E58" stroke="#577595"/><text x="536" y="1013" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FE">CLASS B</text><text x="537" y="1042" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Периодические окна приёма</text><text x="537" y="1068" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Компромисс downlink и батареи</text><text x="537" y="1094" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Точные интервалы: Needs confirmation</text><rect x="968" y="984" width="399" height="128" rx="11" fill="#263E58" stroke="#577595"/><text x="984" y="1013" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#DDD0FE">CLASS C</text><text x="985" y="1042" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Почти постоянный RX</text><text x="985" y="1068" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Быстрее реакция на downlink</text><text x="985" y="1094" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Высокий расход энергии</text><rect x="43" y="1168" width="1355" height="229" rx="16" fill="#152940" stroke="#455F7C"/><rect x="62" y="1185" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="85" y="1211" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFDFF">V. LoRa CSS: SPREAD FACTOR И ПРИЁМ</text><rect x="72" y="1234" width="399" height="126" rx="11" fill="#263E58" stroke="#577595"/><text x="88" y="1263" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A5F3FC">TRANSMIT</text><text x="89" y="1292" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Up-chirp покрывает всю B</text><text x="89" y="1318" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Частотный сдвиг кодирует символ</text><text x="89" y="1344" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">M=2^SF; T_sym=M/B</text><rect x="520" y="1234" width="399" height="126" rx="11" fill="#263E58" stroke="#577595"/><text x="536" y="1263" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A5F3FC">RECEIVE</text><text x="537" y="1292" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Синхронизация + reference down-chirp</text><text x="537" y="1318" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Dechirp → преобразование Фурье</text><text x="537" y="1344" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Пик в частотном спектре → symbol</text><rect x="968" y="1234" width="399" height="126" rx="11" fill="#263E58" stroke="#577595"/><text x="984" y="1263" font-size="18.5" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A5F3FC">ОШИБКИ В RAG</text><text x="985" y="1292" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">SF: шесть против семи значений</text><text x="985" y="1318" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">SF=9: 1024 Hz vs 488.28 Hz</text><text x="985" y="1344" font-size="16.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E5EEF8">Формула s(n) и знаки B расходятся</text><rect x="45" y="1418" width="1352" height="155" rx="12" fill="#3F302C" stroke="#AC7C56"/><text x="68" y="1456" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FFE8C9">SOURCE BOUNDARY: EUI-64 / «65 537», dBm / мВ, SF и LoRa chirp формулы.</text><text x="68" y="1491" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F5D4B5">Изолировано в source-findings.md; исправления оригинальных рисунков и формул не выполнялись.</text><text x="68" y="1528" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F5D4B5">Live metrics, radio compliance, secrets, platform CLI, verification и rollback = [Needs confirmation].</text><text x="44" y="1621" font-size="17" font-weight="400" font-family=