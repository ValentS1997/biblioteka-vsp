<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="846" viewBox="0 0 1320 846" role="img" aria-label="Краткая визуальная сводка главы 26: IEEE 802.15.4, ZigBee, Thread, Wi-SUN FAN, LoRaWAN, CSS"><rect x="0" y="0" width="1320" height="846" rx="0" fill="#0D192C" stroke="none"/><text x="43" y="58" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">Глава 26 • Беспроводные технологии НЭ</text><text x="43" y="97" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#AAC4DC">Олиферы, 7-е изд.  |  PDF 821–843  |  RAG grounded</text><rect x="43" y="133" width="604" height="231" rx="14" fill="#1B2F47" stroke="#45607D"/><rect x="59" y="153" width="6" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="177" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">ENERGY / IEEE 802.15.4</text><text x="67" y="217" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Редкие короткие пакеты, долгий sleep</text><text x="67" y="248" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">PHY + MAC; кадр до 127 байт</text><text x="67" y="279" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">FFD / RFD; PAN coordinator; tree / mesh</text><text x="67" y="310" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Малый duty cycle против latency</text><rect x="674" y="133" width="603" height="231" rx="14" fill="#1B2F47" stroke="#45607D"/><rect x="690" y="153" width="6" height="28" rx="3" fill="#34D399" stroke="none"/><text x="712" y="177" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">ZIGBEE / THREAD / WI-SUN</text><text x="698" y="217" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">ZigBee: NWK, APS, application bindings</text><text x="698" y="248" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Thread: IPv6, 6LoWPAN, RPL, Matter</text><text x="698" y="279" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Wi-SUN FAN: IPv6/mesh для коммунальных сетей</text><text x="698" y="310" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Свойства зависят от режима PHY</text><rect x="43" y="389" width="604" height="235" rx="14" fill="#1B2F47" stroke="#45607D"/><rect x="59" y="409" width="6" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="433" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">LORAWAN: СЕРВИС И КЛАССЫ</text><text x="67" y="473" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Device → gateways → network server → app</text><text x="67" y="504" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Join server: MIC / ключи; dedup / ADR</text><text x="67" y="535" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Class A: RX1/RX2 после uplink</text><text x="67" y="566" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">B: периодический RX; C: почти постоянный</text><rect x="674" y="389" width="603" height="235" rx="14" fill="#1B2F47" stroke="#45607D"/><rect x="690" y="409" width="6" height="28" rx="3" fill="#A78BFA" stroke="none"/><text x="712" y="433" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FAFCFF">LORA CSS И SPREAD FACTOR</text><text x="698" y="473" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Up-chirp, циклическое начальное смещение</text><text x="698" y="504" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">M = 2^SF, T_sym = M / B</text><text x="698" y="535" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">Dechirp + DFT → принятый символ</text><text x="698" y="566" font-size="17.5" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#E6EFF9">SF=9: ошибка шага частоты в книге</text><rect x="43" y="657" width="1234" height="125" rx="13" fill="#3F302E" stroke="#A67B5A"/><text x="66" y="695" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FFE9CB">SOURCE FINDINGS: EUI-64/65 537, dBm/мВ, SF 6 vs 7, ошибочные Δf и s(n).</text><text x="66" y="738" font-size="17.8" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#F6D8BF">Дальность, батарея и регуляторные частоты не подтверждены в работающей сети.</text><text x="44" y="823" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#A5BED5">Источник: p0821:c01–p0843:c01  •  концептуальные схемы, не копии оригинальных рисунков</text></svg>