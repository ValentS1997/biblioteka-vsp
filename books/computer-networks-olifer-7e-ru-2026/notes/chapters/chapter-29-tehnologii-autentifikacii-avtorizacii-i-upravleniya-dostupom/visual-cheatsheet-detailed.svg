<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1730" viewBox="0 0 1440 1730" role="img" aria-label="Подробная визуальная глава 29: пароли, OTP, цифровые подписи, PKI, ACL, DAC, MAC, RBAC, SSO"><rect x="0" y="0" width="1440" height="1730" rx="0" fill="#0B192C" stroke="none"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#FAFDFF">Глава 29 — Аутентификация, авторизация, контроль доступа</text><text x="45" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ACC7E1">RAG p0925:c01–p0954:c01 | 30 PDF-страниц | источник-only, не security audit</text><rect x="44" y="121" width="1352" height="238" rx="16" fill="#142B43" stroke="#486985"/><rect x="63" y="139" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="88" y="166" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FCFEFF">I. ИДЕНТИЧНОСТЬ И ПОДТВЕРЖДЕНИЕ ПОДЛИННОСТИ</text><rect x="72" y="191" width="402" height="138" rx="12" fill="#243B56" stroke="#597B9D"/><text x="88" y="222" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BCDDFE">FACTORS</text><text x="88" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Knowledge: password / PIN</text><text x="88" y="278" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Possession: hardware token</text><text x="88" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Inherence: biometrics</text><text x="88" y="330" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">2 шага knowledge ≠ 2 фактора</text><rect x="520" y="191" width="402" height="138" rx="12" fill="#243B56" stroke="#597B9D"/><text x="536" y="222" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BCDDFE">PASSWORD / CHALLENGE</text><text x="536" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Reusable vs одноразовый пароль</text><text x="536" y="278" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">SAM digest / new challenge</text><text x="536" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">PPP PAP vs CHAP</text><text x="536" y="330" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Учет блокировки / доступности</text><rect x="968" y="191" width="401" height="138" rx="12" fill="#243B56" stroke="#597B9D"/><text x="984" y="222" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BCDDFE">HARDWARE OTP</text><text x="984" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Общий secret + time / clock drift</text><text x="984" y="278" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Короткое окно действия кода</text><text x="984" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Аппаратный challenge-response</text><text x="984" y="330" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Исторические параметры не default</text><rect x="44" y="379" width="1352" height="242" rx="16" fill="#142B43" stroke="#486985"/><rect x="63" y="397" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="88" y="424" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FCFEFF">II. ПОДПИСИ, СЕРТИФИКАТЫ И PKI</text><rect x="72" y="449" width="402" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="88" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A4F0C9">DIGITAL SIGNATURE</text><text x="88" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Подтверждает author и integrity</text><text x="88" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Сама по себе не скрывает документ</text><text x="88" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">RSA и digest — учебные формулы</text><text x="88" y="588" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Нет полного signature encoding</text><rect x="520" y="449" width="402" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="536" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A4F0C9">CERTIFICATE / CA</text><text x="536" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Identity ↔ public key</text><text x="536" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">CA signature + trust anchors</text><text x="536" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Issuer, expiry, revocation</text><text x="536" y="588" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">RA verifies applicant before CA</text><rect x="968" y="449" width="401" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="984" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A4F0C9">LIFECYCLE / CODE</text><text x="984" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Issuance, renewal, invalidation</text><text x="984" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">PKI repositories и доверие CA</text><text x="984" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Authenticode: signing software</text><text x="984" y="588" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">License proof — отдельная задача</text><rect x="44" y="642" width="1352" height="243" rx="16" fill="#142B43" stroke="#486985"/><rect x="63" y="660" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="88" y="687" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FCFEFF">III. AUTHORIZATION: ХРАНЕНИЕ И ПРОВЕРКА ПРАВ</text><rect x="72" y="711" width="402" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="88" y="742" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">ACCESS MATRIX</text><text x="88" y="772" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Субъект × объект × операция</text><text x="88" y="798" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Большая и разрежённая матрица</text><text x="88" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Least privilege; context/content</text><text x="88" y="850" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Решение allow/deny</text><rect x="520" y="711" width="402" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="536" y="742" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">OBJECT VIEW: ACL</text><text x="536" y="772" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Разрешения рядом с объектом</text><text x="536" y="798" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Subject + permitted operations</text><text x="536" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Хранение ненулевых matrix entries</text><text x="536" y="850" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Owner may update policy</text><rect x="968" y="711" width="401" height="140" rx="12" fill="#243B56" stroke="#597B9D"/><text x="984" y="742" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">SUBJECT VIEW: CAPABILITY</text><text x="984" y="772" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Список permissions субъекта</text><text x="984" y="798" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Эквивалентный взгляд на matrix</text><text x="984" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Groups / rules compact policy</text><text x="984" y="850" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Наличие UI не обеспечивает rights</text><rect x="44" y="906" width="1352" height="243" rx="16" fill="#142B43" stroke="#486985"/><rect x="63" y="924" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="88" y="951" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FCFEFF">IV. DAC, MAC, RBAC — ПОЛИТИКА НАЗНАЧЕНИЯ</text><rect x="72" y="976" width="402" height="139" rx="12" fill="#243B56" stroke="#597B9D"/><text x="88" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">DAC</text><text x="88" y="1037" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Владелец выдаёт права на объект</text><text x="88" y="1063" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Flexible granularity; local policy</text><text x="88" y="1089" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Риск распространения данных копией</text><text x="88" y="1115" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Важен owner accountability</text><rect x="520" y="976" width="402" height="139" rx="12" fill="#243B56" stroke="#597B9D"/><text x="536" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">MAC</text><text x="536" y="1037" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Центральное управление labels</text><text x="536" y="1063" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Classification + categories</text><text x="536" y="1089" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">В книге: ≥ уровень и 1 category</text><text x="536" y="1115" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Не универсальная реализация MAC</text><rect x="968" y="976" width="401" height="139" rx="12" fill="#243B56" stroke="#597B9D"/><text x="984" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">RBAC</text><text x="984" y="1037" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Admin: permissions → role</text><text x="984" y="1063" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">User receives one or more roles</text><text x="984" y="1089" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Rights of active roles combine</text><text x="984" y="1115" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Trade-off role complexity</text><rect x="44" y="1167" width="1352" height="241" rx="16" fill="#142B43" stroke="#486985"/><rect x="63" y="1185" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="88" y="1212" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FCFEFF">V. ЛОКАЛЬНЫЙ/ДОМЕННЫЙ ДОСТУП И SSO</text><rect x="72" y="1237" width="402" height="136" rx="12" fill="#243B56" stroke="#597B9D"/><text x="88" y="1268" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A3EAFD">OS / APPLICATION</text><text x="88" y="1298" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Local account vs domain DB</text><text x="88" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">App identity может быть отдельной</text><text x="88" y="1350" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">SELinux: MAC-like features in Linux</text><text x="88" y="1376" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">No vendor CLI in source</text><rect x="520" y="1237" width="402" height="136" rx="12" fill="#243B56" stroke="#597B9D"/><text x="536" y="1268" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A3EAFD">IDENTITY PROVIDER</text><text x="536" y="1298" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">One sign-in at IdP</text><text x="536" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">IdP issues protected token</text><text x="536" y="1350" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Token has limited lifetime</text><text x="536" y="1376" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Trust relationship to SP</text><rect x="968" y="1237" width="401" height="136" rx="12" fill="#243B56" stroke="#597B9D"/><text x="984" y="1268" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A3EAFD">SERVICE PROVIDER</text><text x="984" y="1298" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Проверяет token / identity claim</text><text x="984" y="1324" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Сам применяет access control</text><text x="984" y="1350" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">Kerberos: conceptually SSO</text><text x="984" y="1376" font-family="Arial,Helvetica,sans-serif" font-size="16.3" font-weight="400" fill="#E8F1FB">SSO ≠ доступ ко всем ресурсам</text><rect x="44" y="1432" width="1352" height="197" rx="13" fill="#40302D" stroke="#A97B57"/><text x="69" y="1473" font-family="Arial,Helvetica,sans-serif" font-size="19.5" font-weight="700" fill="#FFE6C6">SOURCE FINDINGS — не превращать примеры в готовые политики.</text><text x="69" y="1511" font-family="Arial,Helvetica,sans-serif" font-size="17.3" font-weight="400" fill="#F9D9BF">Password table; MD5/CHAP; OTP replay window; raw RSA; CA certainty; CAPTCHA claims.</text><text x="69" y="1547" font-family="Arial,Helvetica,sans-serif" font-size="17.3" font-weight="400" fill="#F9D9BF">MAC «1 общая категория» и RBAC scalability — конкретные формулировки источника.</text><text x="69" y="1586" font-family="Arial,Helvetica,sans-serif" font-size="17.3" font-weight="400" fill="#F9D9BF">Реальные секреты, параметры, версии и rollback: [Needs confirmation].</text><text x="44" y="1692" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#ABC1D6">Source: computer-networks-olifer-7e-ru-2026:p0925:c01–p0954:c01 | source-findings.md</text></svg>