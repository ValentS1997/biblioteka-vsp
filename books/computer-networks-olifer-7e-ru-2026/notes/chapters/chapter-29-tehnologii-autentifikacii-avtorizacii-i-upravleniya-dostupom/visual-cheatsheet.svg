<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="856" viewBox="0 0 1320 856" role="img" aria-label="Краткий визуальный конспект главы 29: аутентификация, цифровые сертификаты, DAC MAC RBAC и SSO"><rect x="0" y="0" width="1320" height="856" fill="#0C192C" stroke="none" rx="0"/><text x="43" y="59" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#FAFDFF">Глава 29 • Аутентификация и управление доступом</text><text x="44" y="98" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ABC7E0">Олиферы, 7-е изд. | PDF 925–954 | RAG grounded</text><rect x="43" y="134" width="601" height="232" fill="#20344E" stroke="#4D6987" rx="14"/><rect x="60" y="154" width="6" height="28" fill="#60A5FA" stroke="none" rx="3"/><text x="81" y="177" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFDFF">IDENTITY / FACTORS</text><text x="68" y="218" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Знаю / имею / являюсь: три разных фактора</text><text x="68" y="249" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Пароли, challenge-response, CHAP</text><text x="68" y="280" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">OTP по времени или аппаратному challenge</text><text x="68" y="311" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Authentication не означает authorization</text><rect x="676" y="134" width="601" height="232" fill="#20344E" stroke="#4D6987" rx="14"/><rect x="693" y="154" width="6" height="28" fill="#34D399" stroke="none" rx="3"/><text x="714" y="177" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFDFF">SIGNATURE / CERTIFICATE / PKI</text><text x="701" y="218" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Подпись: origin + integrity, не secrecy</text><text x="701" y="249" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Certificate связывает owner + public key</text><text x="701" y="280" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">CA / RA / validity / revocation / trust</text><text x="701" y="311" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Code signing отдельно от лицензии</text><rect x="43" y="393" width="601" height="235" fill="#20344E" stroke="#4D6987" rx="14"/><rect x="60" y="413" width="6" height="28" fill="#FBBF24" stroke="none" rx="3"/><text x="81" y="436" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFDFF">POLICY / ACCESS CONTROL</text><text x="68" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Least privilege; субъект / объект / операция</text><text x="68" y="508" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Access matrix → ACL или capabilities</text><text x="68" y="539" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">DAC: owner; MAC: labels/classification</text><text x="68" y="570" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">RBAC: role → permissions → user</text><rect x="676" y="393" width="601" height="235" fill="#20344E" stroke="#4D6987" rx="14"/><rect x="693" y="413" width="6" height="28" fill="#A78BFA" stroke="none" rx="3"/><text x="714" y="436" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FAFDFF">SSO / TRUST</text><text x="701" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">IdP подтверждает пользователя и даёт token</text><text x="701" y="508" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">SP принимает token в модели доверия</text><text x="701" y="539" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Expiry/renewal и отдельная access policy</text><text x="701" y="570" font-family="Arial,Helvetica,sans-serif" font-size="17.4" font-weight="400" fill="#E4F0FB">Kerberos упомянут как вариант SSO</text><rect x="43" y="660" width="1234" height="125" fill="#42312E" stroke="#A87B58" rx="13"/><text x="66" y="699" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE7CC">SOURCE RISKS: устаревшие цифры, PAP/CHAP, raw RSA, CAPTCHA, MAC/SSO overclaims.</text><text x="66" y="740" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#F8D8BD">Учебное изложение ≠ безопасная современная конфигурация IAM/PKI.</text><text x="44" y="834" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A7BFD8">Источник: p0925:c01–p0954:c01 • без прямого восстановления рисунков 29.1–29.16</text></svg>