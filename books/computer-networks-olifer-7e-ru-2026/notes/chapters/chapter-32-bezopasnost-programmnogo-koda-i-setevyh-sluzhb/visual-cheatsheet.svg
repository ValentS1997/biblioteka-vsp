<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-label="Глава 32: компактная визуальная сводка по безопасности кода, веба, почты и облаков"><rect x="0" y="0" width="1320" height="860" rx="0" fill="#0D1A2E" stroke="none"/><text x="44" y="61" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FAFCFF">Глава 32 • Безопасность кода и сетевых служб</text><text x="45" y="97" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#B0C7DE">Олиферы · 7-е изд. · PDF 1023–1049 · 27 RAG chunks</text><rect x="43" y="136" width="603" height="228" rx="13" fill="#20354E" stroke="#506F8C"/><rect x="60" y="153" width="6" height="31" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFEFF">КОД И ВРЕДОНОСНОЕ ПО</text><text x="66" y="221" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Проверять недоверенный ввод и память</text><text x="66" y="252" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Trojan / worm / virus / botnet</text><text x="66" y="283" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Antivirus: signatures, heuristics, sandbox</text><text x="66" y="314" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Isolation и quarantine: ограничения</text><rect x="674" y="136" width="603" height="228" rx="13" fill="#20354E" stroke="#506F8C"/><rect x="691" y="153" width="6" height="31" rx="3" fill="#34D399" stroke="none"/><text x="712" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFEFF">ВЕБ / ПРИВАТНОСТЬ</text><text x="697" y="221" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Браузер: execution + personal privacy</text><text x="697" y="252" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Cookies: SID, domain, lifetime</text><text x="697" y="283" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">HTTPS: доверие к сертификату сервера</text><text x="697" y="314" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Сторонний динамический код требует контроля</text><rect x="43" y="394" width="603" height="231" rx="13" fill="#20354E" stroke="#506F8C"/><rect x="60" y="411" width="6" height="31" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="438" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFEFF">ПОЧТА / METADATA</text><text x="66" y="479" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">SMTP AUTH vs S/MIME signature</text><text x="66" y="510" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">PKCS-7 / PGP: подпись и шифрование</text><text x="66" y="541" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Hop-by-hop ≠ end-to-end secrecy</text><text x="66" y="572" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Metadata, DNSBL, unsafe attachments</text><rect x="674" y="394" width="603" height="231" rx="13" fill="#20354E" stroke="#506F8C"/><rect x="691" y="411" width="6" height="31" rx="3" fill="#A78BFA" stroke="none"/><text x="712" y="438" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FCFEFF">ОБЛАКО / ОТВЕТСТВЕННОСТЬ</text><text x="697" y="479" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">SaaS / PaaS / IaaS: разные границы</text><text x="697" y="510" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Tenancy, audit, identity, data residency</text><text x="697" y="541" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Redundancy и anycast против перегрузки</text><text x="697" y="572" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#E4EFFA">Security и SLA зависят от провайдера</text><rect x="43" y="658" width="1234" height="124" rx="13" fill="#42302D" stroke="#A57A56"/><text x="67" y="697" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE6C7">SOURCE LIMITS: cookies, TSL/HTTPS, sandbox, подпись почты, спам, cloud law.</text><text x="67" y="738" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="400" fill="#F6D8BA">Историческая книга не заменяет текущую crypto/privacy/security policy.</text><text x="44" y="835" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A8BED4">RAG p1023:c01–p1049:c01 · part VII questions с PDF 1050 — вне главы</text></svg>