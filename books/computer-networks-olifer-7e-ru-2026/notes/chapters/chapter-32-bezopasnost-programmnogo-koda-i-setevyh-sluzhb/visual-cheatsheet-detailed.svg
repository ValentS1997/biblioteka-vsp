<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1725" viewBox="0 0 1440 1725" role="img" aria-label="Глава 32: подробная карта безопасности кода, вредоносных программ, браузера, почты и облачных сервисов"><rect x="0" y="0" width="1440" height="1725" rx="0" fill="#0C192B" stroke="none"/><text x="44" y="57" font-size="33" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">Глава 32 — Защита кода, сетевых сервисов и облака</text><text x="44" y="95" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ADC7DE">PDF 1023–1049 | RAG p1023:c01–p1049:c01 | только книга</text><rect x="44" y="119" width="1352" height="231" rx="15" fill="#172B42" stroke="#4C6985"/><rect x="60" y="136" width="7" height="28" rx="3" fill="#60A5FA" stroke="none"/><text x="85" y="163" font-size="21.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">I. НЕДОВЕРЕННЫЙ ВВОД И УЯЗВИМОСТИ</text><rect x="71" y="186" width="405" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="86" y="216" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#B4D9FC">CODE / MEMORY</text><text x="86" y="246" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Stack and buffer bounds</text><text x="86" y="271" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Input format / length / value checks</text><text x="86" y="296" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Не доверять данным извне</text><text x="86" y="321" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Разделять баг и подтверждённый риск</text><rect x="520" y="186" width="405" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="535" y="216" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#B4D9FC">MALWARE TYPES</text><text x="535" y="246" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Trojan: disguised program</text><text x="535" y="271" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Worm: self-propagation in network</text><text x="535" y="296" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Virus: attachment to files</text><text x="535" y="321" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Undeclared functionality</text><rect x="969" y="186" width="400" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="984" y="216" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#B4D9FC">DETECTION</text><text x="984" y="246" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Signatures &amp; updates</text><text x="984" y="271" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Heuristics, static / dynamic analysis</text><text x="984" y="296" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Sandbox / quarantine</text><text x="984" y="321" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Защитное ПО тоже требует review</text><rect x="44" y="370" width="1352" height="231" rx="15" fill="#172B42" stroke="#4C6985"/><rect x="60" y="387" width="7" height="28" rx="3" fill="#34D399" stroke="none"/><text x="85" y="414" font-size="21.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">II. БРАУЗЕР И HTTPS: ДВЕ ГРАНИЦЫ ДОВЕРИЯ</text><rect x="71" y="437" width="405" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="86" y="467" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A2EDC7">DEVICE SECURITY</text><text x="86" y="497" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Динамический код, plugins</text><text x="86" y="522" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">ActiveX/Java examples historical</text><text x="86" y="547" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Browser execution boundaries</text><text x="86" y="572" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Signed component ≠ harmless</text><rect x="520" y="437" width="405" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="535" y="467" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A2EDC7">COOKIES / PRIVACY</text><text x="535" y="497" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">SID → session continuity</text><text x="535" y="522" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Domain, duration, third-party access</text><text x="535" y="547" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">History, preferences &amp; tracking</text><text x="535" y="572" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">SID can be security-sensitive</text><rect x="969" y="437" width="400" height="130" rx="12" fill="#243B56" stroke="#577896"/><text x="984" y="467" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A2EDC7">HTTPS / CERTIFICATE</text><text x="984" y="497" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Browser ↔ server protected channel</text><text x="984" y="522" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Server identity + confidentiality</text><text x="984" y="547" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Client cert may be an option</text><text x="984" y="572" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">TSL wording in source needs review</text><rect x="44" y="621" width="1352" height="236" rx="15" fill="#172B42" stroke="#4C6985"/><rect x="60" y="638" width="7" height="28" rx="3" fill="#FBBF24" stroke="none"/><text x="85" y="665" font-size="21.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">III. ПОЧТА: АВТОРСТВО, ШИФРОВАНИЕ, ПРИВАТНОСТЬ</text><rect x="71" y="688" width="405" height="140" rx="12" fill="#243B56" stroke="#577896"/><text x="86" y="718" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCE49B">SENDER AUTHENTICATION</text><text x="86" y="748" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">SMTP AUTH authenticates submitter</text><text x="86" y="773" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Provider checks ≠ signed end-to-end</text><text x="86" y="798" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">PKCS-7 &amp; PGP trust models</text><text x="86" y="823" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Validate certificate trust</text><rect x="520" y="688" width="405" height="140" rx="12" fill="#243B56" stroke="#577896"/><text x="535" y="718" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCE49B">CONTENT / CHANNEL</text><text x="535" y="748" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">S/MIME signature → provenance</text><text x="535" y="773" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">E2E encryption → content secrecy</text><text x="535" y="798" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Hop encryption protects segments</text><text x="535" y="823" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Old SHA1 MIME example not default</text><rect x="969" y="688" width="400" height="140" rx="12" fill="#243B56" stroke="#577896"/><text x="984" y="718" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCE49B">METADATA / SPAM</text><text x="984" y="748" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">From, To, subject, time and IDs</text><text x="984" y="773" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Metadata may remain visible</text><text x="984" y="798" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">DNSBL + attachment review</text><text x="984" y="823" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Privacy and legal status unknown</text><rect x="44" y="879" width="1352" height="236" rx="15" fill="#172B42" stroke="#4C6985"/><rect x="60" y="896" width="7" height="28" rx="3" fill="#A78BFA" stroke="none"/><text x="85" y="923" font-size="21.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">IV. ОБЛАКО: РАЗДЕЛЕНИЕ ОТВЕТСТВЕННОСТИ</text><rect x="71" y="946" width="405" height="138" rx="12" fill="#243B56" stroke="#577896"/><text x="86" y="976" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#E2D1FF">SERVICE MODELS</text><text x="86" y="1006" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">SaaS: provider manages most layers</text><text x="86" y="1031" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">PaaS: shared application platform</text><text x="86" y="1056" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">IaaS: client manages apps / OS</text><text x="86" y="1081" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Precise roles depend on contract</text><rect x="520" y="946" width="405" height="138" rx="12" fill="#243B56" stroke="#577896"/><text x="535" y="976" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#E2D1FF">RISKS</text><text x="535" y="1006" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Shared tenancy / virtualization</text><text x="535" y="1031" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Remote admin and identity</text><text x="535" y="1056" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Cross-border data &amp; personnel info</text><text x="535" y="1081" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Audit access and service contract</text><rect x="969" y="946" width="400" height="138" rx="12" fill="#243B56" stroke="#577896"/><text x="984" y="976" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#E2D1FF">OPPORTUNITIES</text><text x="984" y="1006" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Replication / failover / spare capacity</text><text x="984" y="1031" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Anycast / distributed mitigation</text><text x="984" y="1056" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Specialist security operators</text><text x="984" y="1081" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Do not infer automatic SLA</text><rect x="44" y="1137" width="1352" height="226" rx="15" fill="#172B42" stroke="#4C6985"/><rect x="60" y="1154" width="7" height="28" rx="3" fill="#38BDF8" stroke="none"/><text x="85" y="1181" font-size="21.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FCFDFF">V. ПРАКТИКА READ-ONLY REVIEW</text><rect x="71" y="1204" width="405" height="131" rx="12" fill="#243B56" stroke="#577896"/><text x="86" y="1234" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A5EDFA">BASELINE</text><text x="86" y="1264" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Assets, inputs, code ownership</text><text x="86" y="1289" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Web session and certificate scopes</text><text x="86" y="1314" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Email protection and metadata</text><text x="86" y="1339" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Cloud roles and data residency</text><rect x="520" y="1204" width="405" height="131" rx="12" fill="#243B56" stroke="#577896"/><text x="535" y="1234" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A5EDFA">INTERPRETATION</text><text x="535" y="1264" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Separate source vs actual observations</text><text x="535" y="1289" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Validate version and context</text><text x="535" y="1314" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Minimal audit information</text><text x="535" y="1339" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">No credentials or personal messages</text><rect x="969" y="1204" width="400" height="131" rx="12" fill="#243B56" stroke="#577896"/><text x="984" y="1234" font-size="18.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#A5EDFA">CHANGE CONTROL</text><text x="984" y="1264" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">No unapproved changes or probes</text><text x="984" y="1289" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Quarantine/trust/IAM may break access</text><text x="984" y="1314" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Test plan, owner, acceptance checks</text><text x="984" y="1339" font-size="16.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#EAF2FA">Rollback: [Needs confirmation]</text><rect x="43" y="1393" width="1354" height="221" rx="13" fill="#42302C" stroke="#AC7B56"/><text x="68" y="1435" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FFE7CB">SOURCE FINDINGS — сохраняем формулировки, не делаем silent correction.</text><text x="68" y="1474" font-size="17.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#F7DABD">TSL + browser certificate claim; cookie «harmless» vs session hijack; sandbox claims.</text><text x="68" y="1512" font-size="17.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#F7DABD">Historical SMTP/PGP/SHA1, spam 80–85%, metadata laws, cloud residency and DDoS.</text><text x="68" y="1552" font-size="17.2" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#F7DABD">Questions to part VII begin PDF 1050: not chapter-specific review items.</text><text x="44" y="1692" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ABC2D7">Source: computer-networks-olifer-7e-ru-2026 · chapter 32 · v1.7</text></svg>