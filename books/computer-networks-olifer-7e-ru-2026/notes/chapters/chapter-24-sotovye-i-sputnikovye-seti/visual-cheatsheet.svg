<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="846" viewBox="0 0 1320 846" role="img" aria-label="Глава 24 — LTE, 5G и спутниковые сети: компактная визуальная сводка"><rect x="0" y="0" width="1320" height="846" fill="#0B1728" stroke="none" rx="0"/><text x="44" y="58" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#FAFDFF">Глава 24  •  Сотовые и спутниковые сети</text><text x="44" y="95" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#AEC5DD">Олиферы, 7-е издание  |  PDF 721–783  |  strict RAG-only</text><rect x="44" y="134" width="600" height="229" fill="#1D3049" stroke="#496484" rx="14"/><rect x="61" y="152" width="6" height="29" fill="#60A5FA" stroke="none" rx="3"/><text x="82" y="176" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFF">LTE: radio + EPC</text><text x="67" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">UE → base station → SGW → PGW → IP</text><text x="67" y="248" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">MME + HSS: mobility / authentication</text><text x="67" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">GTP-C управляет; GTP-U переносит</text><text x="67" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">TEID локален, не идентификатор UE</text><rect x="677" y="134" width="600" height="229" fill="#1D3049" stroke="#496484" rx="14"/><rect x="694" y="152" width="6" height="29" fill="#34D399" stroke="none" rx="3"/><text x="715" y="176" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFF">Handover + IMS</text><text x="700" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">Attach: cell → C-RNTI → authentication</text><text x="700" y="248" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">Handover: base station + GTP update</text><text x="700" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">SIP/IMS: регистрация и установка вызова</text><text x="700" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">RTP: передача медиа после setup</text><rect x="44" y="390" width="600" height="230" fill="#1D3049" stroke="#496484" rx="14"/><rect x="61" y="408" width="6" height="29" fill="#FBBF24" stroke="none" rx="3"/><text x="82" y="432" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFF">5G: services + architecture</text><text x="67" y="472" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">eMBB / URLLC / MIoT / V2X</text><text x="67" y="504" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">Network slices поверх общей инфраструктуры</text><text x="67" y="536" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">AMF / SMF / UPF / AUSF; 5G NR</text><text x="67" y="568" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">SBA / NFV / edge, dual connectivity</text><rect x="677" y="390" width="600" height="230" fill="#1D3049" stroke="#496484" rx="14"/><rect x="694" y="408" width="6" height="29" fill="#A78BFA" stroke="none" rx="3"/><text x="715" y="432" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F8FBFF">Спутники + 5G NTN</text><text x="700" y="472" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">GEO / MEO / LEO: охват и задержка</text><text x="700" y="504" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">LEO: движущиеся соты + Doppler</text><text x="700" y="536" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">Iridium / Starlink: примеры из книги</text><text x="700" y="568" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#E1ECFA">NTN: transparent / regenerative</text><rect x="44" y="657" width="1233" height="122" fill="#3E302C" stroke="#AD7753" rx="13"/><text x="68" y="698" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFE7C8">SOURCE RISKS: GTP 2151/2152, перестановка S1/S5-S8, Starlink handover.</text><text x="68" y="734" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#F9DCBE">Исторические показатели не равны current SLA. См. source-findings.md.</text><text x="44" y="823" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#A2BFDB">Источник: p0721:c01–p0783:c01  •  концептуальная карта по RAG, не восстановление рисунков PDF</text></svg>