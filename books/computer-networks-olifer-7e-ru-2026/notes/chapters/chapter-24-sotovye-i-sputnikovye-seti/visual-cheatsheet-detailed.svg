<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1710" viewBox="0 0 1440 1710" role="img" aria-label="Глава 24 — подробная концептуальная карта LTE mobility, GTP, SIP/IMS, 5G slicing и спутников NTN"><rect x="0" y="0" width="1440" height="1710" rx="0" fill="#0C1A2C" stroke="none"/><text x="44" y="57" fill="#FAFCFF" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">Глава 24 — LTE, 5G, спутники и NTN</text><text x="44" y="94" fill="#AFC8DF" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Подробная визуальная сводка  |  PDF 721–783  |  RAG p0721:c01–p0783:c01</text><rect x="42" y="120" width="1356" height="223" rx="16" fill="#15283F" stroke="#47627F"/><rect x="63" y="137" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="85" y="162" fill="#F8FBFF" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">I. LTE: СЕТЬ РАДИОДОСТУПА И МАГИСТРАЛЬ</text><rect x="73" y="188" width="390" height="121" rx="11" fill="#253A55" stroke="#537495"/><text x="88" y="217" fill="#BFDBFE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">UE / RADIO ACCESS</text><text x="89" y="247" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Соты, base station, C-RNTI, DCI</text><text x="89" y="272" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">OFDMA DL / SC-FDMA UL</text><text x="89" y="297" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Мобильный узел не равен IP-router</text><rect x="524" y="188" width="389" height="121" rx="11" fill="#253A55" stroke="#537495"/><text x="539" y="217" fill="#BFDBFE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">EPC USER PLANE</text><text x="540" y="247" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Base station → SGW → PGW</text><text x="540" y="272" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">GTP-U + TEID по IP/UDP</text><text x="540" y="297" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">PGW: граница внешней IP-сети</text><rect x="971" y="188" width="395" height="121" rx="11" fill="#253A55" stroke="#537495"/><text x="986" y="217" fill="#BFDBFE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">EPC CONTROL PLANE</text><text x="987" y="247" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">MME: attach / mobility</text><text x="987" y="272" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">HSS: данные абонента / authentication</text><text x="987" y="297" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">GTP-C создаёт контекст туннеля</text><rect x="42" y="366" width="1356" height="231" rx="16" fill="#15283F" stroke="#47627F"/><rect x="63" y="383" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="85" y="408" fill="#F8FBFF" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">II. ПРИСОЕДИНЕНИЕ, ЭСТАФЕТНАЯ ПЕРЕДАЧА И ЗВОНОК</text><rect x="73" y="438" width="390" height="127" rx="11" fill="#253A55" stroke="#537495"/><text x="88" y="467" fill="#A6EFCE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">ATTACH</text><text x="89" y="497" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Cell search → preamble → C-RNTI</text><text x="89" y="522" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">MME/HSS authentication</text><text x="89" y="547" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">IP + двухуровневые туннели</text><rect x="524" y="438" width="389" height="127" rx="11" fill="#253A55" stroke="#537495"/><text x="539" y="467" fill="#A6EFCE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">HANDOVER</text><text x="540" y="497" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">UE reports / source+target base stations</text><text x="540" y="522" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Новый локальный ID / ключи</text><text x="540" y="547" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Меняются GTP mappings при mobility</text><rect x="971" y="438" width="395" height="127" rx="11" fill="#253A55" stroke="#537495"/><text x="986" y="467" fill="#A6EFCE" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">IMS / VOICE</text><text x="987" y="497" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">P-/S-/I-CSCF + HSS</text><text x="987" y="522" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">SIP REGISTER / INVITE / BYE</text><text x="987" y="547" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">RTP несёт голос и видео</text><rect x="42" y="618" width="1356" height="254" rx="16" fill="#15283F" stroke="#47627F"/><rect x="63" y="635" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="85" y="660" fill="#F8FBFF" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">III. 5G: NETWORK SLICING И SERVICE-BASED ARCHITECTURE</text><rect x="73" y="686" width="390" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="88" y="715" fill="#FDE68A" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">SERVICE REQUIREMENTS</text><text x="89" y="745" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">eMBB: broadband throughput</text><text x="89" y="770" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">URLLC: latency/reliability</text><text x="89" y="795" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">MIoT: massive device scale</text><text x="89" y="820" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">V2X: vehicle communications</text><rect x="524" y="686" width="389" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="539" y="715" fill="#FDE68A" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">SLICE / VIRTUALIZATION</text><text x="540" y="745" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Logical slices, общая инфраструктура</text><text x="540" y="770" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">SDN/NFV и orchestration</text><text x="540" y="795" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">NSSF: выбор нужного слайса</text><text x="540" y="820" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Edge application near UE</text><rect x="971" y="686" width="395" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="986" y="715" fill="#FDE68A" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">5G CORE / NR</text><text x="987" y="745" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">AMF / SMF / UPF / AUSF / NRF</text><text x="987" y="770" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Control vs user forwarding</text><text x="987" y="795" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">OFDMA / MU-MIMO / FR2 NR</text><text x="987" y="820" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Dual connectivity / mobility</text><rect x="42" y="894" width="1356" height="253" rx="16" fill="#15283F" stroke="#47627F"/><rect x="63" y="911" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="85" y="936" fill="#F8FBFF" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">IV. СПУТНИКОВЫЕ СЕТИ: ФИЗИКА + МАРШРУТИЗАЦИЯ</text><rect x="73" y="963" width="390" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="88" y="992" fill="#DDD0FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">ORBIT</text><text x="89" y="1022" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">GEO: высокий охват и задержка</text><text x="89" y="1047" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">MEO: промежуточные параметры</text><text x="89" y="1072" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">LEO: меньший RTT, mobile footprint</text><text x="89" y="1097" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Doppler и handover</text><rect x="524" y="963" width="389" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="539" y="992" fill="#DDD0FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">NETWORK LINKS</text><text x="540" y="1022" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">L/S/C и Ku/Ka/V диапазоны</text><text x="540" y="1047" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Ground gateway ↔ satellite</text><text x="540" y="1072" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Опциональные inter-satellite links</text><text x="540" y="1097" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Iridium / Starlink — примеры</text><rect x="971" y="963" width="395" height="151" rx="11" fill="#253A55" stroke="#537495"/><text x="986" y="992" fill="#DDD0FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">5G NTN / DIRECT-TO-PHONE</text><text x="987" y="1022" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Transparent: relay к земной базе</text><text x="987" y="1047" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Regenerative: функции base station</text><text x="987" y="1072" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">HAPS + LEO/GEO/MEO платформы</text><text x="987" y="1097" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Открытый вопрос routing mesh</text><rect x="42" y="1170" width="1356" height="265" rx="16" fill="#15283F" stroke="#47627F"/><rect x="63" y="1187" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="85" y="1212" fill="#F8FBFF" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">V. OPERATIONAL CHECKPOINTS И SOURCE BOUNDARY</text><rect x="73" y="1240" width="390" height="150" rx="11" fill="#253A55" stroke="#537495"/><text x="88" y="1269" fill="#9BE6FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">READ-ONLY QUESTIONS</text><text x="89" y="1299" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">UE attached? GTP established?</text><text x="89" y="1324" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Handover successful? SIP registered?</text><text x="89" y="1349" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Slice chosen? Gateway reachable?</text><text x="89" y="1374" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Orbit, Doppler, gateway visibility?</text><rect x="524" y="1240" width="389" height="150" rx="11" fill="#253A55" stroke="#537495"/><text x="539" y="1269" fill="#9BE6FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">NO AUTOMATIC ASSUMPTIONS</text><text x="540" y="1299" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Signal ≠ authorization / GTP</text><text x="540" y="1324" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">IP data ≠ IMS voice</text><text x="540" y="1349" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Network slice ≠ guaranteed SLA</text><text x="540" y="1374" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">LEO coverage ≠ fixed physical cell</text><rect x="971" y="1240" width="395" height="150" rx="11" fill="#253A55" stroke="#537495"/><text x="986" y="1269" fill="#9BE6FF" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">SOURCE FINDINGS</text><text x="987" y="1299" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">GTP 2152 vs 2151 (pp.733/739)</text><text x="987" y="1324" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">S-B / P-S ↔ S1/S5 naming (p735)</text><text x="987" y="1349" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Starlink 15 s vs 10–15 min</text><text x="987" y="1374" fill="#E3EEF8" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Historical stats not current</text><rect x="44" y="1461" width="1351" height="166" rx="12" fill="#40302D" stroke="#A67958"/><text x="68" y="1500" fill="#FFE8CC" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">CHANGE CONTROL: никакой конфигурации SGW/PGW, IMS, 5G NR, слайсов или спутникового доступа.</text><text x="68" y="1540" fill="#FBD6B5" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Реальные параметры, версии, владелец, наблюдения, post-check и rollback — [Needs confirmation].</text><text x="68" y="1580" fill="#FBD6B5" font-size="17" font-weight="400" font-family="Arial,Helvetica,sans-serif">Диаграмма основана на тексте RAG; не является реконструкцией рисунков 24.x или рабочей схемой оператора.</text><text x="44" y="1681" fill="#A5C0D9" font-size="17" font-weight="400" font-family="Arial,Helvetica,sans-serif">Источник: computer-networks-olifer-7e-ru-2026:p0721:c01–p0783:c01  |  source-findings.md</text></svg>