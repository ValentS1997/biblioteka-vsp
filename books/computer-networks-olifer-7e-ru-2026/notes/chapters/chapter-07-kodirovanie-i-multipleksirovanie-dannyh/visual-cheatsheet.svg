<rect x="95" y="420" width="620" height="205" rx="18" fill="#eee8f6" stroke="#c9bad9"/>
<text x="125" y="465" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#593f73">Analog → digital</text>
<text x="125" y="510" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#624f74">sampling + quantization → ADC → PCM</text>
<text x="125" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#624f74">DAC reconstructs signal at receiver</text>
<text x="125" y="590" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#756486">sampling condition from Kotelnikov–Nyquist theorem</text>

<rect x="785" y="420" width="620" height="205" rx="18" fill="#e5edf7" stroke="#bdcce0"/>
<text x="815" y="465" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#2b4e78">Multiplexing</text>
<text x="815" y="510" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#3c5878">FDM → frequency · WDM → wavelength</text>
<text x="815" y="550" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#3c5878">TDM → time slots</text>
<text x="815" y="590" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#5c7290">sync TDM: slot position identifies channel</text>

<rect x="180" y="690" width="1140" height="155" rx="18" fill="#fff3dd" stroke="#dfca9b"/>
