<text x="50" y="92" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#52697a">RAG p0242:c01–p0267:c01 · PDF 242–267 · printed 241–266 · 30 chunks</text>

<rect x="55" y="135" width="420" height="215" rx="18" fill="#e8eff5" stroke="#b9cbd8"/>
<text x="83" y="178" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#234b64">1 · Transport network</text>
<text x="83" y="220" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#35576a">static point-to-point circuits</text>
<text x="83" y="255" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#35576a">TM · ADM · DXC · regenerator</text>
<text x="83" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#35576a">tributary → aggregate ports</text>
<text x="83" y="325" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#5a7180">provisioned capacity, not packet routing</text>

<rect x="540" y="135" width="420" height="215" rx="18" fill="#eef4e8" stroke="#c4d4b9"/>
<text x="568" y="178" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#365b31">2 · OTN blocks</text>
<text x="568" y="220" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#496449">OPU → client mapping/alignment</text>
<text x="568" y="255" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#496449">ODU → end-to-end + multiplexing</text>
<text x="568" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#496449">OTU → section + FEC</text>
<text x="568" y="325" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#63755d">photonic layer → DWDM channel</text>

<rect x="1025" y="135" width="420" height="215" rx="18" fill="#f8efe2" stroke="#ddc9aa"/>
<text x="1053" y="178" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#78532e">3 · Client adaptation</text>
<text x="1053" y="220" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">sync vs asynchronous mapping</text>
<text x="1053" y="255" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">GFP-F / GFP-T</text>
<text x="1053" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#6b573c">rate alignment + transparency</text>

