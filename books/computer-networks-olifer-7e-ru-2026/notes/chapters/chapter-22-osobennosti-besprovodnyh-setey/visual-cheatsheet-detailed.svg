y="186" width="409" height="112" rx="12" fill="#273D56" stroke="#547797"/><text x="977" y="217" font-size="18" font-weight="700" fill="#A5D1FF" font-family="Arial,Helvetica,sans-serif">COVERAGE / REACHABILITY</text><text x="977" y="247" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Взаимная зона досягаемости</text><text x="977" y="273" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Граница зависит от помех и мощности</text><rect x="43" y="352" width="1354" height="235" rx="17" fill="#182B42" stroke="#486080"/><rect x="65" y="371" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="88" y="397" font-size="23" font-weight="700" fill="#F9FBFF" font-family="Arial,Helvetica,sans-serif">II. ТОПОЛОГИЯ: ФИЗИЧЕСКИЕ И ЛОГИЧЕСКИЕ СВЯЗИ</text><rect x="72" y="423" width="410" height="131" rx="12" fill="#273D56" stroke="#547797"/><text x="89" y="454" font-size="18" font-weight="700" fill="#9FF2C0" font-family="Arial,Helvetica,sans-serif">ФИЗИЧЕСКИЙ ГРАФ</text><text x="89" y="484" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Радиосигнал потенциально соединяет узлы</text><text x="89" y="510" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Зона покрытия меняется со временем</text><text x="89" y="536" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Круги/шестиугольники — лишь абстракции</text><rect x="516" y="423" width="410" height="131" rx="12" fill="#273D56" stroke="#547797"/><text x="533" y="454" font-size="18" font-weight="700" fill="#9FF2C0" font-family="Arial,Helvetica,sans-serif">ЛОГИЧЕСКИЙ ГРАФ</text><text x="533" y="484" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">AP-star может ограничить прямой обмен</text><text x="533" y="510" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Mesh: multi-hop и динамические маршруты</text><text x="533" y="536" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Single-hop: все связаны напрямую</text><rect x="960" y="423" width="409" height="131" rx="12" fill="#273D56" stroke="#547797"/><text x="977" y="454" font-size="18" font-weight="700" fill="#9FF2C0" font-family="Arial,Helvetica,sans-serif">COMMUNICATION ROLES</text><text x="977" y="484" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Хост, router, AP/BS, bridge, repeater</text><text x="977" y="510" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Repeater повторяет кадр в радиосегмент</text><text x="977" y="536" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Cluster head агрегирует трафик</text><rect x="43" y="607" width="1354" height="243" rx="17" fill="#182B42" stroke="#486080"/><rect x="65" y="626" width="7" height="29" rx="3" fill="#C4B5FD" stroke="none"/><text x="88" y="652" font-size="23" font-weight="700" fill="#F9FBFF" font-family="Arial,Helvetica,sans-serif">III. INFRASTRUCTURELESS И AD HOC — НЕ СИНОНИМЫ</text><rect x="72" y="677" width="410" height="143" rx="12" fill="#273D56" stroke="#547797"/><text x="89" y="708" font-size="18" font-weight="700" fill="#D8C7FF" font-family="Arial,Helvetica,sans-serif">INFRASTRUCTURE</text><text x="89" y="738" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Предустановленный AP/BS и сервисы</text><text x="89" y="764" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Логическая звезда / wired backbone</text><text x="89" y="790" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Управление и маршруты у инфраструктуры</text><rect x="516" y="677" width="410" height="143" rx="12" fill="#273D56" stroke="#547797"/><text x="533" y="708" font-size="18" font-weight="700" fill="#D8C7FF" font-family="Arial,Helvetica,sans-serif">БЕЗ ИНФРАСТРУКТУРЫ</text><text x="533" y="738" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Координация распределена по хостам</text><text x="533" y="764" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Может быть заранее спланирована</text><text x="533" y="790" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Sensor network не обязательно Ad Hoc</text><rect x="960" y="677" width="409" height="143" rx="12" fill="#273D56" stroke="#547797"/><text x="977" y="708" font-size="18" font-weight="700" fill="#D8C7FF" font-family="Arial,Helvetica,sans-serif">AD HOC</text><text x="977" y="738" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Спонтанный neighbor discovery и join</text><text x="977" y="764" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Address self-config + route discovery</text><text x="977" y="790" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">MANET / VANET / FANET — примеры</text><rect x="43" y="871" width="1354" height="231" rx="17" fill="#182B42" stroke="#486080"/><rect x="65" y="890" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="88" y="916" font-size="23" font-weight="700" fill="#F9FBFF" font-family="Arial,Helvetica,sans-serif">IV. MOBILITY И SECURITY — РАЗНЫЕ ЦЕЛИ</text><rect x="72" y="936" width="634" height="136" rx="12" fill="#273D56" stroke="#547797"/><text x="89" y="967" font-size="18" font-weight="700" fill="#FFE39C" font-family="Arial,Helvetica,sans-serif">MOBILITY = НЕ ПРЕРВАТЬ РАБОТУ</text><text x="89" y="997" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Устранение проблем при перемещении узла</text><text x="89" y="1023" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Компенсация на PHY / IP / transport / application</text><text x="89" y="1049" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Movement не всегда требует handover/нового IP</text><rect x="745" y="936" width="624" height="136" rx="12" fill="#273D56" stroke="#547797"/><text x="762" y="967" font-size="18" font-weight="700" fill="#FFE39C" font-family="Arial,Helvetica,sans-serif">SECURITY = CONFIDENTIALITY + AUTH + AVAILABILITY</text><text x="762" y="997" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Пассивное прослушивание, rogue AP, jamming</text><text x="762" y="1023" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Взаимная аутентификация и шифрование — отдельные меры</text><text x="762" y="1049" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Глушение направлено на доступность радиоканала</text><rect x="43" y="1122" width="1354" height="231" rx="17" fill="#182B42" stroke="#486080"/><rect x="65" y="1141" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="88" y="1167" font-size="23" font-weight="700" fill="#F9FBFF" font-family="Arial,Helvetica,sans-serif">V. БАТАРЕЯ / ENERGY-AWARE ROUTING</text><rect x="72" y="1187" width="410" height="134" rx="12" fill="#273D56" stroke="#547797"/><text x="89" y="1218" font-size="18" font-weight="700" fill="#8BE1FF" font-family="Arial,Helvetica,sans-serif">TX / RX / SLEEP</text><text x="89" y="1248" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Duty cycle и настройка мощности</text><text x="89" y="1274" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Сравнивать эффективную энергию/пакет</text><text x="89" y="1300" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Повторы передачи также тратят заряд</text><rect x="516" y="1187" width="410" height="134" rx="12" fill="#273D56" stroke="#547797"/><text x="533" y="1218" font-size="18" font-weight="700" fill="#8BE1FF" font-family="Arial,Helvetica,sans-serif">МНОГОШАГОВОСТЬ</text><text x="533" y="1248" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Short hops могут экономить TX</text><text x="533" y="1274" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Нужно учитывать нагрузку relay</text><text x="533" y="1300" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Наименьшее число hops не всегда цель</text><rect x="960" y="1187" width="409" height="134" rx="12" fill="#273D56" stroke="#547797"/><text x="977" y="1218" font-size="18" font-weight="700" fill="#8BE1FF" font-family="Arial,Helvetica,sans-serif">RESIDUAL CHARGE / CLUSTERS</text><text x="977" y="1248" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Щадить узлы с низким зарядом</text><text x="977" y="1274" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Cluster heads агрегируют данные</text><text x="977" y="1300" font-size="16.8" font-weight="400" fill="#E2EFFB" font-family="Arial,Helvetica,sans-serif">Цель — дольше сохранить связность сети</text><rect x="44" y="1375" width="1352" height="133" rx="13" fill="#3B302E" stroke="#A8795D"/><text x="66" y="1411" font-size="18" font-weight="700" fill="#FFE6C7" font-family="Arial,Helvetica,sans-serif">VI. КЛАССИФИКАЦИЯ ИОТ: WBAN / WPAN / WLAN / WMAN / WWAN; Wi-Fi, 5G, LoRaWAN, satellite.</text><text x="66" y="1446" font-size="18" font-weight="400" fill="#F8D7B9" font-family="Arial,Helvetica,sans-serif">IoT может быть локальным (без прямого интернета), через gateway или с прямым доступом.</text><text x="66" y="1480" font-size="17" font-weight="400" fill="#F8D7B9" font-family="Arial,Helvetica,sans-serif">SOURCE LIMIT: отсутствуют live RF measurements, vendor CLI, production SLA и rollback.</text><text x="44" y="1550" font-size="17" font-weight="400" fill="#A8C0DA" font-family="Arial,Helvetica,sans-serif">Источник: p0662:c01–p0686:c01  |  источниковые расхождения: source-findings.md</text></svg>