<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="828" viewBox="0 0 1300 828" role="img" aria-label="Глава 22: компактная концептуальная карта беспроводных сетей"><rect x="0" y="0" width="1300" height="828" rx="0" fill="#0C1B2C" stroke="none"/><text x="43" y="60" fill="#F7FAFF" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Глава 22 • Особенности беспроводных сетей</text><text x="44" y="95" fill="#B1C5DB" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Олиферы 7e · PDF 662–686 · source policy: rag_only</text><rect x="43" y="134" width="590" height="223" rx="16" fill="#1D3047" stroke="#48617D"/><rect x="61" y="156" width="6" height="30" rx="3" fill="#60A5FA" stroke="none"/><text x="83" y="180" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">РАДИОКАНАЛ И COVERAGE</text><text x="67" y="222" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Помехи / затухание / препятствия</text><text x="67" y="254" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Радиопокрытие ≠ логическая связность</text><text x="67" y="286" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Shared medium, hidden/exposed station</text><text x="67" y="318" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">PHY скорость ≠ реальный throughput</text><rect x="668" y="134" width="589" height="223" rx="16" fill="#1D3047" stroke="#48617D"/><rect x="686" y="156" width="6" height="30" rx="3" fill="#34D399" stroke="none"/><text x="708" y="180" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">ТОПОЛОГИЯ / AD HOC</text><text x="692" y="222" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Infrastructure: AP/BS, логическая звезда</text><text x="692" y="254" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Без инфраструктуры ≠ всегда Ad Hoc</text><text x="692" y="286" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Ad Hoc: self-discovery + self-routing</text><text x="692" y="318" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Mesh / single-hop / multi-hop</text><rect x="43" y="387" width="590" height="227" rx="16" fill="#1D3047" stroke="#48617D"/><rect x="61" y="409" width="6" height="30" rx="3" fill="#FBBF24" stroke="none"/><text x="83" y="433" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">МОБИЛЬНОСТЬ / SECURITY</text><text x="67" y="475" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Mobility = сохранение требуемой услуги</text><text x="67" y="507" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Возможны механизмы PHY/IP/application</text><text x="67" y="539" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Радиоэфир: перехват / rogue AP / jamming</text><text x="67" y="571" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Authentication и availability — разное</text><rect x="668" y="387" width="589" height="227" rx="16" fill="#1D3047" stroke="#48617D"/><rect x="686" y="409" width="6" height="30" rx="3" fill="#A78BFA" stroke="none"/><text x="708" y="433" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">ЭНЕРГИЯ / КЛАССИФИКАЦИЯ</text><text x="692" y="475" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">TX power, retries, sleep, charge-aware route</text><text x="692" y="507" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">WBAN / WPAN / WLAN / WMAN / WWAN</text><text x="692" y="539" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">MANET, VANET, FANET, WSN, IoT</text><text x="692" y="571" fill="#E2EDF8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">IoT ≠ обязателен прямой доступ в интернет</text><rect x="43" y="650" width="1214" height="114" rx="12" fill="#382C2A" stroke="#B17B54"/><text x="65" y="692" fill="#FFEACA" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">BOUNDARY: исторические скорости и время работы батарей — не измерения вашей сети.</text><text x="65" y="730" fill="#F9DBBE" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Конфликты исходника: AWHA/ALOHA, hidden station, CDMA/CD и диапазон 5,7–575.</text><text x="43" y="805" fill="#9DBAD6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">RAG p0662:c01–p0686:c01 • схема по тексту, не копия иллюстраций PDF</text></svg>