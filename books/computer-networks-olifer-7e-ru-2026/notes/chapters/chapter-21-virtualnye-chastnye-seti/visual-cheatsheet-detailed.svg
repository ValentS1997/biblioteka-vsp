<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1490" viewBox="0 0 1440 1490" role="img" aria-label="Подробная концептуальная карта главы 21 VPN, Ethernet MEF, MPLS pseudowire и VPLS"><rect x="0" y="0" width="1440" height="1490" rx="0" fill="#0C182B" stroke="none"/><text x="43" y="58" font-size="35" fill="#FFFFFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">Глава 21  •  VPN: свойства, Ethernet, pseudowire</text><text x="44" y="95" font-size="18" fill="#B2CAE3" font-weight="400" font-family="Arial,Helvetica,sans-serif">RAG p0639:c01–p0654:c01  |  PDF 639–654  |  концептуальные схемы</text><rect x="40" y="122" width="1360" height="215" rx="17" fill="#152438" stroke="#415775"/><rect x="62" y="140" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="86" y="165" font-size="23" fill="#F7FAFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">I. ПРИВАТНОСТЬ: ИЗОЛЯЦИЯ, ШИФРОВАНИЕ, SLA</text><rect x="69" y="187" width="405" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="84" y="216" font-size="19" fill="#BFDBFE" font-weight="700" font-family="Arial,Helvetica,sans-serif">PRIVATE / LEASED</text><text x="85" y="243" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Выделенная полоса / собственная сеть</text><text x="85" y="269" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Дорогое расширение на новые сайты</text><rect x="518" y="187" width="405" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="533" y="216" font-size="19" fill="#BFDBFE" font-weight="700" font-family="Arial,Helvetica,sans-serif">PROVIDER-MANAGED VPN</text><text x="534" y="243" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Оператор контролирует сеть и туннели</text><text x="534" y="269" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Возможны управляемые QoS/TE</text><rect x="966" y="187" width="408" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="981" y="216" font-size="19" fill="#BFDBFE" font-weight="700" font-family="Arial,Helvetica,sans-serif">CLIENT-MANAGED VPN</text><text x="982" y="243" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Клиентский защищённый канал</text><text x="982" y="269" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Шифрование ≠ гарантия полосы</text><rect x="40" y="354" width="1360" height="215" rx="17" fill="#152438" stroke="#415775"/><rect x="62" y="372" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="86" y="397" font-size="23" fill="#F7FAFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">II. L2/L3 VPN И СТАНДАРТИЗАЦИЯ MEF</text><rect x="69" y="420" width="405" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="84" y="449" font-size="19" fill="#86EFAC" font-weight="700" font-family="Arial,Helvetica,sans-serif">L2VPN: E-LINE</text><text x="85" y="476" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">EVC: point-to-point; VPWS</text><text x="85" y="502" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">EPL по порту; EVPL по C-VID</text><rect x="518" y="420" width="405" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="533" y="449" font-size="19" fill="#86EFAC" font-weight="700" font-family="Arial,Helvetica,sans-serif">L2VPN: E-LAN</text><text x="534" y="476" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">EVC: any-to-any; VPLS</text><text x="534" y="502" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">EPLAN / EVPLAN; MAC semantics</text><rect x="966" y="420" width="408" height="116" rx="11" fill="#21354F" stroke="#4F7291"/><text x="981" y="449" font-size="19" fill="#86EFAC" font-weight="700" font-family="Arial,Helvetica,sans-serif">E-TREE / L3VPN</text><text x="982" y="476" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">E-TREE: root/leaf, leaves не связаны</text><text x="982" y="502" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">L3VPN: IP-подсети (в главе обзор)</text><rect x="40" y="589" width="1360" height="241" rx="17" fill="#152438" stroke="#415775"/><rect x="62" y="607" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="86" y="632" font-size="23" fill="#F7FAFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">III. VPWS / MPLS PSEUDOWIRE: ДВЕ МЕТКИ, ДВА НАПРАВЛЕНИЯ</text><rect x="69" y="657" width="241" height="110" rx="11" fill="#21354F" stroke="#4F7291"/><text x="84" y="686" font-size="19" fill="#FDE68A" font-weight="700" font-family="Arial,Helvetica,sans-serif">CE-A / UNI</text><text x="85" y="713" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Attachment circuit</text><text x="85" y="739" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Порт или VLAN</text><rect x="360" y="657" width="242" height="110" rx="11" fill="#21354F" stroke="#4F7291"/><text x="375" y="686" font-size="19" fill="#FDE68A" font-weight="700" font-family="Arial,Helvetica,sans-serif">PE-A</text><text x="376" y="713" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Bridge B → NSP → VS</text><text x="376" y="739" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Inner label: PW</text><rect x="651" y="657" width="241" height="110" rx="11" fill="#21354F" stroke="#4F7291"/><text x="666" y="686" font-size="19" fill="#FDE68A" font-weight="700" font-family="Arial,Helvetica,sans-serif">MPLS CORE</text><text x="667" y="713" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Outer label: LSP</text><text x="667" y="739" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Transit P</text><rect x="941" y="657" width="242" height="110" rx="11" fill="#21354F" stroke="#4F7291"/><text x="956" y="686" font-size="19" fill="#FDE68A" font-weight="700" font-family="Arial,Helvetica,sans-serif">PE-B</text><text x="957" y="713" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Service demux</text><text x="957" y="739" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">PW → AC</text><rect x="1232" y="657" width="141" height="110" rx="11" fill="#21354F" stroke="#4F7291"/><text x="1247" y="686" font-size="19" fill="#FDE68A" font-weight="700" font-family="Arial,Helvetica,sans-serif">CE-B</text><text x="1248" y="713" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">LAN B</text><text x="1248" y="739" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Ethernet</text><line x1="310" y1="714" x2="354" y2="714" stroke="#93C5FD" stroke-width="3"/><path d="M342 707 L354 714 L342 721" stroke="#93C5FD" stroke-width="3" fill="none"/><line x1="603" y1="714" x2="645" y2="714" stroke="#93C5FD" stroke-width="3"/><path d="M633 707 L645 714 L633 721" stroke="#93C5FD" stroke-width="3" fill="none"/><line x1="894" y1="714" x2="935" y2="714" stroke="#93C5FD" stroke-width="3"/><path d="M923 707 L935 714 L923 721" stroke="#93C5FD" stroke-width="3" fill="none"/><line x1="1184" y1="714" x2="1226" y2="714" stroke="#93C5FD" stroke-width="3"/><path d="M1214 707 L1226 714 L1214 721" stroke="#93C5FD" stroke-width="3" fill="none"/><text x="75" y="800" font-size="18" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">PW сигнализируется независимо от LSP; Ethernet PW двунаправлен через два направленных LSP.</text><rect x="40" y="848" width="1360" height="226" rx="17" fill="#152438" stroke="#415775"/><rect x="62" y="866" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="86" y="891" font-size="23" fill="#F7FAFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">IV. VPLS: FULL-MESH ПСЕВДОКАНАЛОВ, MAC И SPLIT HORIZON</text><rect x="69" y="919" width="405" height="119" rx="11" fill="#21354F" stroke="#4F7291"/><text x="84" y="948" font-size="19" fill="#D8B4FE" font-weight="700" font-family="Arial,Helvetica,sans-serif">PE1 + virtual switch</text><text x="85" y="975" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Отдельный instance на VPLS</text><text x="85" y="1001" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Изучение MAC и forwarding</text><rect x="518" y="919" width="405" height="119" rx="11" fill="#21354F" stroke="#4F7291"/><text x="533" y="948" font-size="19" fill="#D8B4FE" font-weight="700" font-family="Arial,Helvetica,sans-serif">PW full mesh между PE</text><text x="534" y="975" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Unknown/broadcast → flood внутри VPN</text><text x="534" y="1001" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Known MAC → конкретный PW</text><rect x="966" y="919" width="408" height="119" rx="11" fill="#21354F" stroke="#4F7291"/><text x="981" y="948" font-size="19" fill="#D8B4FE" font-weight="700" font-family="Arial,Helvetica,sans-serif">Split horizon</text><text x="982" y="975" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Принят из PW → не пересылать PW</text><text x="982" y="1001" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Защита от петель в full mesh</text><rect x="40" y="1092" width="1360" height="203" rx="17" fill="#152438" stroke="#415775"/><rect x="62" y="1110" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="86" y="1135" font-size="23" fill="#F7FAFF" font-weight="700" font-family="Arial,Helvetica,sans-serif">V. СМЕЖНЫЕ ТЕХНОЛОГИИ И ИСТОЧНИКОВЫЕ ГРАНИЦЫ</text><rect x="69" y="1157" width="405" height="104" rx="11" fill="#21354F" stroke="#4F7291"/><text x="84" y="1186" font-size="19" fill="#7DD3FC" font-weight="700" font-family="Arial,Helvetica,sans-serif">BGP EVPN</text><text x="85" y="1213" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Назван как альтернатива PW</text><text x="85" y="1239" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">MPLS либо IP/VXLAN/GRE</text><rect x="518" y="1157" width="405" height="104" rx="11" fill="#21354F" stroke="#4F7291"/><text x="533" y="1186" font-size="19" fill="#7DD3FC" font-weight="700" font-family="Arial,Helvetica,sans-serif">IPsec / TLS</text><text x="534" y="1213" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Защита encrypted VPN</text><text x="534" y="1239" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Детали отложены до главы 31</text><rect x="966" y="1157" width="408" height="104" rx="11" fill="#21354F" stroke="#4F7291"/><text x="981" y="1186" font-size="19" fill="#7DD3FC" font-weight="700" font-family="Arial,Helvetica,sans-serif">MPLS L3VPN</text><text x="982" y="1213" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Обзор на уровне IP-подсетей</text><text x="982" y="1239" font-size="17" fill="#E5EDF8" font-weight="400" font-family="Arial,Helvetica,sans-serif">Детали вне текста главы 21</text><rect x="42" y="1316" width="1355" height="108" rx="12" fill="#3C302C" stroke="#AC8061"/><text x="66" y="1352" font-size="18" fill="#FFE9CC" font-weight="700" font-family="Arial,Helvetica,sans-serif">SAFETY: изоляция трафика не гарантирует шифрования; любые QoS/SLA требуют отдельной проверки.</text><text x="66" y="1386" font-size="18" fill="#FAD9BD" font-weight="400" font-family="Arial,Helvetica,sans-serif">Источник содержит спорный PW-W1 в «сером» VPLS и NSP/NCP. CLI и rollback не предоставлены.</text><text x="43" y="1463" font-size="17" fill="#A5BFDA" font-weight="400" font-family="Arial,Helvetica,sans-serif">Источник: Олиферы, глава 21; p0639:c01–p0654:c01  |  «Вопросы к части V» с p0655 — отдельно</text></svg>