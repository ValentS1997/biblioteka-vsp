<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="828" viewBox="0 0 1320 828" role="img" aria-label="Глава 21 — Виртуальные частные сети: краткий конспект VPN, MEF, VPWS, VPLS"><rect x="0" y="0" width="1320" height="828" rx="0" fill="#0C1627" stroke="none"/><text x="44" y="60" fill="#F8FAFF" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif">Глава 21  •  Виртуальные частные сети (VPN)</text><text x="45" y="94" fill="#B3C9DF" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Олиферы, 7-е издание  |  PDF 639–654  |  RAG grounded</text><rect x="44" y="134" width="597" height="234" rx="15" fill="#1B2942" stroke="#436182"/><rect x="62" y="155" width="6" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="82" y="179" fill="#F5F8FD" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">VPN: свойства и ответственность</text><text x="68" y="218" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Provider-managed / client-managed</text><text x="68" y="249" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Traffic separation ≠ encryption</text><text x="68" y="280" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">IPsec/TLS: защита данных; QoS не следует</text><text x="68" y="311" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Нужны отдельные границы и SLA</text><rect x="676" y="134" width="597" height="234" rx="15" fill="#1B2942" stroke="#436182"/><rect x="694" y="155" width="6" height="29" rx="3" fill="#34D399" stroke="none"/><text x="714" y="179" fill="#F5F8FD" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">MEF / EVC: топологии Ethernet</text><text x="700" y="218" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">E-LINE: point-to-point (EPL / EVPL)</text><text x="700" y="249" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">E-LAN: any-to-any (EPLAN / EVPLAN)</text><text x="700" y="280" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">E-TREE: roots ↔ leaves, no leaf ↔ leaf</text><text x="700" y="311" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">UNI целиком или C-VID на одном UNI</text><rect x="44" y="397" width="597" height="229" rx="15" fill="#1B2942" stroke="#436182"/><rect x="62" y="418" width="6" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="82" y="442" fill="#F5F8FD" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">MPLS L2VPN: VPWS</text><text x="68" y="481" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">CE → AC/UNI → PE → PW → PE → CE</text><text x="68" y="512" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Outer label: транспорт по LSP</text><text x="68" y="543" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Inner label: сервисный pseudowire</text><text x="68" y="574" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Port- или VLAN-based Ethernet circuit</text><rect x="676" y="397" width="597" height="229" rx="15" fill="#1B2942" stroke="#436182"/><rect x="694" y="418" width="6" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="714" y="442" fill="#F5F8FD" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">VPLS: многоточечная L2-сеть</text><text x="700" y="481" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">PW full mesh между участвующими PE</text><text x="700" y="512" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Виртуальный bridge и MAC learning</text><text x="700" y="543" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Flood неизвестного / broadcast трафика</text><text x="700" y="574" fill="#E4EDF9" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif">Split horizon блокирует PW → PW</text><rect x="44" y="659" width="1229" height="107" rx="13" fill="#3B302C" stroke="#A87B4E"/><text x="66" y="698" fill="#FFEBCC" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">SECURITY: логическая изоляция VPN не доказывает криптографическую конфиденциальность.</text><text x="66" y="733" fill="#FADCB8" font-size="17" font-weight="400" font-family="Arial,Helvetica,sans-serif">В RAG обнаружены ошибки имён PW и NSP/NCP: см. source-findings.md. Нет CLI или rollback.</text><text x="45" y="803" fill="#9FB7D4" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">Источник: p0639:c01–p0654:c01   •   Вопросы к части V вынесены отдельно, PDF 655–659</text></svg>