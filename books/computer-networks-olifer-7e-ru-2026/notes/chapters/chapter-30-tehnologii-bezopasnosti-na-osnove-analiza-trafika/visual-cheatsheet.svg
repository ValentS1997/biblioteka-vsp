<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-label="Краткий визуальный конспект главы 30: фильтрация, межсетевые экраны, proxy, NAT, NetFlow, IDS и зоны"><rect x="0" y="0" width="1320" height="860" rx="0" fill="#0B1A2C" stroke="none"/><text x="43" y="60" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FBFDFF">Глава 30 • Безопасность на основе анализа трафика</text><text x="44" y="98" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#A9C8DF">Олиферы, 7-е изд.  |  PDF 955–990  |  RAG 37 чанков</text><rect x="43" y="136" width="603" height="233" rx="14" fill="#20354E" stroke="#54728F"/><rect x="60" y="155" width="7" height="27" rx="3" fill="#60A5FA" stroke="none"/><text x="81" y="179" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F9FCFF">ФИЛЬТРАЦИЯ / FIREWALL</text><text x="67" y="221" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Cisco ACL: порядок правил / ingress, egress</text><text x="67" y="252" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Stateless: пакет; stateful: история сеанса</text><text x="67" y="283" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Application level: контроль содержимого</text><text x="67" y="314" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Избыточная блокировка снижает availability</text><rect x="675" y="136" width="602" height="233" rx="14" fill="#20354E" stroke="#54728F"/><rect x="692" y="155" width="7" height="27" rx="3" fill="#34D399" stroke="none"/><text x="713" y="179" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F9FCFF">PROXY / NAT / NAPT</text><text x="699" y="221" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Proxy завершает client-server взаимодействие</text><text x="699" y="252" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Basic NAT: private IP ↔ public IP</text><text x="699" y="283" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">NAPT: IP и порт, обратные соответствия</text><text x="699" y="314" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">DHCP-адреса и политики должны совпадать</text><rect x="43" y="397" width="603" height="232" rx="14" fill="#20354E" stroke="#54728F"/><rect x="60" y="416" width="7" height="27" rx="3" fill="#FBBF24" stroke="none"/><text x="81" y="440" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F9FCFF">TRAFFIC MONITORING</text><text x="67" y="482" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">PCAP / Wireshark: захваченные пакеты</text><text x="67" y="513" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Port mirroring + promiscuous прием</text><text x="67" y="544" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">NetFlow: exporter → collector → analyzer</text><text x="67" y="575" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Baseline, Top N, SYN/ICMP аномалии</text><rect x="675" y="397" width="602" height="232" rx="14" fill="#20354E" stroke="#54728F"/><rect x="692" y="416" width="7" height="27" rx="3" fill="#A78BFA" stroke="none"/><text x="713" y="440" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#F9FCFF">IDS / AUDIT / ZONES</text><text x="699" y="482" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">IDS: выявить/оповестить; IPS: блокировать</text><text x="699" y="513" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">Protected logs: события, время, субъект</text><text x="699" y="544" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">DMZ отделяет public ресурсы от internal</text><text x="699" y="575" font-size="17.6" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#E3EFFB">6 зон: public, portal, extranet, users и др.</text><rect x="44" y="657" width="1233" height="126" rx="12" fill="#443129" stroke="#A9805A"/><text x="67" y="699" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#FFE7C5">SOURCE FINDINGS: ACL «established», iptables state, NAT-адреса, NetFlow v5.</text><text x="67" y="739" font-size="17.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#F7DABA">Примеры Cisco/Linux и показатели детекции — не готовая production policy.</text><text x="44" y="836" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ADC5D9">RAG p0955:c01–p0990:c01 + p0978:c02  •  концептуальный SVG, не копия PDF</text></svg>