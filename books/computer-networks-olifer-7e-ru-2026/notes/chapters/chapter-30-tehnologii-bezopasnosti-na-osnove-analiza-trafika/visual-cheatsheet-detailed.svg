<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1735" viewBox="0 0 1440 1735" role="img" aria-label="Подробная сводка главы 30: ACL, файерволы, прокси, NAT, мониторинг, IDS IPS, аудит и DMZ"><rect x="0" y="0" width="1440" height="1735" rx="0" fill="#0D1B2E" stroke="none"/><text x="44" y="59" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#FBFDFF">Глава 30 — Анализ трафика и защита сетевых зон</text><text x="44" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#ACC8E2">Канонический RAG: PDF 955–990  |  37 адресуемых chunks  |  source-only</text><rect x="44" y="118" width="1352" height="222" rx="16" fill="#152A40" stroke="#486984"/><rect x="62" y="135" width="7" height="29" rx="3" fill="#60A5FA" stroke="none"/><text x="87" y="162" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FAFDFF">I. ФИЛЬТРАЦИЯ И МЕЖСЕТЕВОЙ ЭКРАН</text><rect x="72" y="185" width="402" height="127" rx="12" fill="#253C57" stroke="#587A98"/><text x="88" y="215" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BAD9FF">ACL / PACKET RULE</text><text x="88" y="244" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">IP/MAC + protocol + TCP/UDP ports</text><text x="88" y="269" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Ingress/egress; first matching rule</text><text x="88" y="294" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Cisco ACL — только source syntax</text><rect x="520" y="185" width="402" height="127" rx="12" fill="#253C57" stroke="#587A98"/><text x="536" y="215" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BAD9FF">STATEFUL / STATELESS</text><text x="536" y="244" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Stateless: нет истории сеанса</text><text x="536" y="269" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Stateful: table state, capacity limits</text><text x="536" y="294" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">ACK flag ≠ session state validation</text><rect x="968" y="185" width="400" height="127" rx="12" fill="#253C57" stroke="#587A98"/><text x="984" y="215" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#BAD9FF">APPLICATION / HOST</text><text x="984" y="244" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">HTTP/SMTP/FTP content inspection</text><text x="984" y="269" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Host INPUT/OUTPUT/FORWARD</text><text x="984" y="294" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">iptables sample содержит state NEW</text><rect x="44" y="358" width="1352" height="247" rx="16" fill="#152A40" stroke="#486984"/><rect x="62" y="375" width="7" height="29" rx="3" fill="#34D399" stroke="none"/><text x="87" y="402" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FAFDFF">II. PROXY, DHCP, BASIC NAT И NAPT</text><rect x="72" y="427" width="402" height="143" rx="12" fill="#253C57" stroke="#587A98"/><text x="88" y="457" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6F0C9">PROXY APPLICATION</text><text x="88" y="486" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Client → proxy → external service</text><text x="88" y="511" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">User/content policy, cache</text><text x="88" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Прямой bypass нужно исключить</text><text x="88" y="561" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Proxy ≠ универсальный firewall</text><rect x="520" y="427" width="402" height="143" rx="12" fill="#253C57" stroke="#587A98"/><text x="536" y="457" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6F0C9">BASIC NAT</text><text x="536" y="486" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Private address ↔ global address</text><text x="536" y="511" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Translation table / inbound mapping</text><text x="536" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">DHCP address binding влияет на policy</text><text x="536" y="561" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Нельзя путать NAT и авторизацию</text><rect x="968" y="427" width="400" height="143" rx="12" fill="#253C57" stroke="#587A98"/><text x="984" y="457" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6F0C9">NAPT</text><text x="984" y="486" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Private IP:port → public IP:port</text><text x="984" y="511" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Shared public IP, unique ports</text><text x="984" y="536" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Reply lookup по таблице mappings</text><text x="984" y="561" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Source diagram 30.6 адресно спорен</text><rect x="44" y="623" width="1352" height="247" rx="16" fill="#152A40" stroke="#486984"/><rect x="62" y="640" width="7" height="29" rx="3" fill="#FBBF24" stroke="none"/><text x="87" y="667" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FAFDFF">III. PACKET CAPTURE И FLOW TELEMETRY</text><rect x="72" y="690" width="402" height="145" rx="12" fill="#253C57" stroke="#587A98"/><text x="88" y="720" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">PACKET ANALYZER</text><text x="88" y="749" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">SPAN/mirroring даёт пакеты на порт</text><text x="88" y="774" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Promiscuous mode принимает кадры</text><text x="88" y="799" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Wireshark: capture vs display filter</text><text x="88" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">PCAP: данные требуют защиты</text><rect x="520" y="690" width="402" height="145" rx="12" fill="#253C57" stroke="#587A98"/><text x="536" y="720" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">NETFLOW PIPELINE</text><text x="536" y="749" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Exporter → collector → analyzer</text><text x="536" y="774" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Src/dst IP, ports, interface, ToS</text><text x="536" y="799" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Sampling ↔ overhead/visibility</text><text x="536" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Fields source NetFlow v5</text><rect x="968" y="690" width="400" height="145" rx="12" fill="#253C57" stroke="#587A98"/><text x="984" y="720" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#FDE68A">BASELINE / ALERT</text><text x="984" y="749" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Weeks/months reference baseline</text><text x="984" y="774" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Top N sessions/data, SYN/ICMP</text><text x="984" y="799" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Outlier требует расследования</text><text x="984" y="824" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Detection ≠ доказанный incident</text><rect x="44" y="889" width="1352" height="243" rx="16" fill="#152A40" stroke="#486984"/><rect x="62" y="906" width="7" height="29" rx="3" fill="#A78BFA" stroke="none"/><text x="87" y="933" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FAFDFF">IV. IDS / IPS И АУДИТ</text><rect x="72" y="956" width="402" height="142" rx="12" fill="#253C57" stroke="#587A98"/><text x="88" y="986" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">IDS SENSORS</text><text x="88" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Sensor → analyzer → manager</text><text x="88" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Signature / protocol / anomaly</text><text x="88" y="1065" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Alert + event journaling</text><text x="88" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">False positives возможны</text><rect x="520" y="956" width="402" height="142" rx="12" fill="#253C57" stroke="#587A98"/><text x="536" y="986" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">IPS RESPONSE</text><text x="536" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">May block via firewall/routing</text><text x="536" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Автодействия могут лишить сервиса</text><text x="536" y="1065" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Authorization и rollback обязательны</text><text x="536" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">IDS без IPS — уведомление</text><rect x="968" y="956" width="400" height="142" rx="12" fill="#253C57" stroke="#587A98"/><text x="984" y="986" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#DDD0FF">ACCOUNTABILITY</text><text x="984" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Protected event and actor logs</text><text x="984" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Time and identity correlation</text><text x="984" y="1065" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Storage / CPU / retention tradeoff</text><text x="984" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Evidence needs integrity</text><rect x="44" y="1153" width="1352" height="228" rx="16" fill="#152A40" stroke="#486984"/><rect x="62" y="1170" width="7" height="29" rx="3" fill="#38BDF8" stroke="none"/><text x="87" y="1197" font-family="Arial,Helvetica,sans-serif" font-size="21.5" font-weight="700" fill="#FAFDFF">V. DMZ И СЕГМЕНТАЦИЯ КОРПОРАТИВНОЙ СЕТИ</text><rect x="72" y="1220" width="402" height="133" rx="12" fill="#253C57" stroke="#587A98"/><text x="88" y="1250" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6EDFF">ZONE 1 / 2 / 3</text><text x="88" y="1279" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">1 DMZ: public web, DNS, mail</text><text x="88" y="1304" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">2 Internal applications and DB</text><text x="88" y="1329" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">3 Partner extranet / controlled VPN</text><text x="88" y="1354" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Internet not allowed into portal</text><rect x="520" y="1220" width="402" height="133" rx="12" fill="#253C57" stroke="#587A98"/><text x="536" y="1250" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6EDFF">ZONE 4 / 5 / 6</text><text x="536" y="1279" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">4 Internal workstations</text><text x="536" y="1304" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">5 Remote mobile staff / VPN</text><text x="536" y="1329" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">6 Security administration</text><text x="536" y="1354" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">IDS on critical zone segments</text><rect x="968" y="1220" width="400" height="133" rx="12" fill="#253C57" stroke="#587A98"/><text x="984" y="1250" font-family="Arial,Helvetica,sans-serif" font-size="18.5" font-weight="700" fill="#A6EDFF">ZONE FIREWALL</text><text x="984" y="1279" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Interzone least privileges</text><text x="984" y="1304" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">Outer/inner firewall and bastion hosts</text><text x="984" y="1329" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">HA / multiple providers: source model</text><text x="984" y="1354" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" fill="#E9F3FB">No universal trust between zones</text><rect x="44" y="1410" width="1352" height="210" rx="12" fill="#43302B" stroke="#AD7D59"/><text x="69" y="1450" font-family="Arial,Helvetica,sans-serif" font-size="19.5" font-weight="700" fill="#FFE9CB">SOURCE FINDINGS — не применять книжные конфигурации без верификации.</text><text x="69" y="1486" font-family="Arial,Helvetica,sans-serif" font-size="17.6" font-weight="400" fill="#F7D7BC">Cisco «access-list 1 in», «established»/ACK, iptables state contradiction, NAT diagram.</text><text x="69" y="1522" font-family="Arial,Helvetica,sans-serif" font-size="17.6" font-weight="400" fill="#F7D7BC">NetFlow v5, исторические IOC, IDS/IPS обобщения, six-zone DMZ, HA assurances.</text><text x="69" y="1560" font-family="Arial,Helvetica,sans-serif" font-size="17.6" font-weight="400" fill="#F7D7BC">Live services, configs, audit authorizations, privacy и rollback: [Needs confirmation].</text><text x="44" y="1698" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#ADC6DB">RAG computer-networks-olifer-7e-ru-2026:p0955:c01–p0990:c01 + p0978:c02 | source-findings.md</text></svg>