<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 5</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">files • directories • JSON • persistence • build/config • game save/load</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Files</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">Create/Open/Stat/Rename/Remove</tspan>
<tspan x="48" dy="27">OpenFile flags + permissions</tspan>
<tspan x="48" dy="27">Read/Write/Scanner</tspan>
<tspan x="48" dy="27">Copy + formatted I/O</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. Directories / JSON</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">Mkdir/MkdirAll/MkdirTemp/ReadDir</tspan>
<tspan x="572" dy="27">Marshal / Unmarshal</tspan>
<tspan x="572" dy="27">tags / omitempty / null</tspan>
<tspan x="572" dy="27">struct preferred when schema is known</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Persistence</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">linked-list DB + text files</tspan>
<tspan x="1096" dy="27">JSON key:value store</tspan>
<tspan x="1096" dy="27">typed getters</tspan>
<tspan x="1096" dy="27">repack []any / map[string]any</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. Build / config</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">go build • -o • -v • -x • -race</tspan>
<tspan x="48" dy="27">runtime: package flag</tspan>
<tspan x="48" dy="27">compile-time: -ldflags -X</tspan>
<tspan x="48" dy="27">go:embed • .env</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Game v.3</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">IGameLoader / IGameSaver</tspan>
<tspan x="572" dy="27">JsonGameStorage</tspan>
<tspan x="572" dy="27">save/load session</tspan>
<tspan x="572" dy="27">runtime-only fields excluded from JSON</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Game v.4</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">board / player / game / model / storage</tspan>
<tspan x="1096" dy="27">GameSnapshot breaks import-cycle pressure</tspan>
<tspan x="1096" dy="27">PvP / PvC</tspan>
<tspan x="1096" dy="27">easy / medium / minimax</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: raw filesystem → structured persistence → build/config → application-level save/load</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: overwrite flags • permissions • null vs zero • .env exposure • import cycles</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 213–307 • summary p0306 • questions p0307</text>
</svg>