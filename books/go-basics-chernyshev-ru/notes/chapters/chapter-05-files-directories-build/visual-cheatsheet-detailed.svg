<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<rect width="1600" height="1120" fill="#f4f7fb"/>
<rect x="12" y="12" width="1576" height="78" rx="14" fill="#26384d"/>
<text x="800" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 5: detailed map</text>
<text x="800" y="72" font-family="Arial, sans-serif" font-size="15.5" fill="#dce8f4" text-anchor="middle">file I/O → directories → JSON → persistent stores → build/config → game persistence/refactoring</text>
<rect x="14" y="110" width="382" height="270" rx="12" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="32" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d64">1. File lifecycle</text>
<text x="36" y="171" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">Create/Open/Stat/Rename/Remove.</tspan>
<tspan x="36" dy="20">Files are byte-oriented in source framing.</tspan>
<tspan x="36" dy="20">Scanner supports line/word iteration.</tspan>
<tspan x="36" dy="20">io.Copy copies stream; Sync flushes.</tspan>
<tspan x="36" dy="20">Close resources with defer.</tspan>
</text>
<rect x="408" y="110" width="382" height="270" rx="12" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="426" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">2. OpenFile / permissions</text>
<text x="430" y="171" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="430" dy="0">RDONLY / WRONLY / RDWR.</tspan>
<tspan x="430" dy="20">APPEND / CREATE / EXCL / SYNC / TRUNC.</tspan>
<tspan x="430" dy="20">Wrong write mode can overwrite existing bytes.</tspan>
<tspan x="430" dy="20">0644 / 0666 / 0755 / 0777 shown.</tspan>
<tspan x="430" dy="20">Choose access deliberately.</tspan>
</text>
<rect x="802" y="110" width="382" height="270" rx="12" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="820" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">3. Directories</text>
<text x="824" y="171" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="824" dy="0">Mkdir / Remove.</tspan>
<tspan x="824" dy="20">MkdirTemp creates unique temp path.</tspan>
<tspan x="824" dy="20">MkdirAll creates parents.</tspan>
<tspan x="824" dy="20">ReadDir lists entries.</tspan>
<tspan x="824" dy="20">Stat + IsNotExist checks existence.</tspan>
</text>
<rect x="1196" y="110" width="390" height="270" rx="12" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="1214" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#474092">4. JSON model</text>
<text x="1218" y="171" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="1218" dy="0">Object = key:value collection.</tspan>
<tspan x="1218" dy="20">Array = ordered values.</tspan>
<tspan x="1218" dy="20">Marshal/MarshalIndent encode.</tspan>
<tspan x="1218" dy="20">Unmarshal decodes into pointer target.</tspan>
<tspan x="1218" dy="20">Tags map Go fields to JSON keys/options.</tspan>
</text>
<rect x="14" y="398" width="502" height="290" rx="12" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="32" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#842044">5. JSON edge cases / storage</text>
<text x="36" y="459" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="36" dy="0">Pointer field distinguishes null/missing from zero value.</tspan>
<tspan x="36" dy="20">omitempty suppresses zero-value output.</tspan>
<tspan x="36" dy="20">map[string]any is for unknown shape.</tspan>
<tspan x="36" dy="20">Typed structs are safer for known schema in source.</tspan>
<tspan x="36" dy="20">Nested structs/slices model nested JSON.</tspan>
</text>
<rect x="528" y="398" width="502" height="290" rx="12" fill="#f5fff7" stroke="#58ad79" stroke-width="2"/>
<text x="546" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18572f">6. Persistent stores</text>
<text x="550" y="459" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="550" dy="0">Generic singly-linked Table stores IAttribute records.</tspan>
<tspan x="550" dy="20">Text files persist database state.</tspan>
<tspan x="550" dy="20">JSONFile + JSONStore implement key:value store.</tspan>
<tspan x="550" dy="20">Typed getters wrap generic any-based JSON data.</tspan>
<tspan x="550" dy="20">Collections may need explicit repacking.</tspan>
</text>
<rect x="1042" y="398" width="544" height="290" rx="12" fill="#fffdf3" stroke="#d5ad37" stroke-width="2"/>
<text x="1060" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#714500">7. Build / configuration</text>
<text x="1064" y="459" font-family="Arial, sans-serif" font-size="12.8" fill="#19324a">
<tspan x="1064" dy="0">go build produces executable; -o controls target.</tspan>
<tspan x="1064" dy="20">-v / -x / -race / -ldflags are highlighted.</tspan>
<tspan x="1064" dy="20">flag package handles runtime CLI config.</tspan>
<tspan x="1064" dy="20">-ldflags -X injects package variables at build time.</tspan>
<tspan x="1064" dy="20">go:embed bundles config; .env loads at runtime.</tspan>
</text>
<rect x="14" y="706" width="760" height="278" rx="12" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="32" y="736" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174d70">8. Tic-tac-toe v.3</text>
<text x="36" y="768" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="36" dy="0">IGameLoader + IGameSaver compose IGameStorage.</tspan>
<tspan x="36" dy="20">JsonGameStorage serializes/deserializes sessions.</tspan>
<tspan x="36" dy="20">Game depends only on saver interface for save action.</tspan>
<tspan x="36" dy="20">JSON tags expose state; reader/saver runtime fields are excluded.</tspan>
<tspan x="36" dy="20">User can save, leave, load and continue session.</tspan>
</text>
<rect x="786" y="706" width="800" height="278" rx="12" fill="#fff8f2" stroke="#d17e4f" stroke-width="2"/>
<text x="804" y="736" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7b3e1e">9. Tic-tac-toe v.4</text>
<text x="808" y="768" font-family="Arial, sans-serif" font-size="12.7" fill="#19324a">
<tspan x="808" dy="0">Refactor into board/player/game/model/storage packages.</tspan>
<tspan x="808" dy="20">GameSnapshot avoids circular import pressure.</tspan>
<tspan x="808" dy="20">HumanPlayer and ComputerPlayer satisfy IPlayer.</tspan>
<tspan x="808" dy="20">Computer levels: random, block-threat, minimax.</tspan>
<tspan x="808" dy="20">Storage implementation is injected through interface boundary.</tspan>
</text>
<rect x="14" y="1004" width="1572" height="88" rx="10" fill="#26384d"/>
<text x="800" y="1031" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Acceptance: choose filesystem APIs safely, model JSON correctly, build/configure binaries, and explain persistence boundaries.</text>
<text x="800" y="1058" font-family="Arial, sans-serif" font-size="14.5" fill="#dce8f4" text-anchor="middle">Source warnings: overwrite mode • broad permissions • null vs zero • commit .env • import cycles.</text>
<text x="800" y="1082" font-family="Arial, sans-serif" font-size="13.5" fill="#dce8f4" text-anchor="middle">RAG-only • PDF 213–307 • summary p0306 • questions p0307</text>
</svg>