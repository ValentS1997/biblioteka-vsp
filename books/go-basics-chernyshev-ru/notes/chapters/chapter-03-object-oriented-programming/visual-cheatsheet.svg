<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 3</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">struct • methods • composition • interfaces • generics • tic-tac-toe v.2</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. State</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">struct = domain state</tspan>
<tspan x="48" dy="27">nested / anonymous fields</tspan>
<tspan x="48" dy="27">pointer to struct</tspan>
<tspan x="48" dy="27">Uppercase = exported boundary</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. Behavior</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">method = function + receiver</tspan>
<tspan x="572" dy="27">value receiver = copy</tspan>
<tspan x="572" dy="27">pointer receiver = mutate instance</tspan>
<tspan x="572" dy="27">New... = constructor function</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Abstraction</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">encapsulation + hiding</tspan>
<tspan x="1096" dy="27">composition via embedding</tspan>
<tspan x="1096" dy="27">interfaces = common method set</tspan>
<tspan x="1096" dy="27">interface field = swappable implementation</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. Interface mechanics</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">implicit satisfaction</tspan>
<tspan x="48" dy="27">argument / return / slice</tspan>
<tspan x="48" dy="27">type assertion: v, ok := i.(T)</tspan>
<tspan x="48" dy="27">type switch for concrete type</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Generics</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">T any</tspan>
<tspan x="572" dy="27">K comparable</tspan>
<tspan x="572" dy="27">union constraints: int | float64</tspan>
<tspan x="572" dy="27">~int includes named underlying types</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.2</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">Board → field state + rules</tspan>
<tspan x="1096" dy="27">Player → current symbol</tspan>
<tspan x="1096" dy="27">Game → input + orchestration</tspan>
<tspan x="1096" dy="27">procedural v.1 → object-oriented layout</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: bind state + behavior, hide internals, depend on interfaces, reuse implementation with generics</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: receiver semantics • invariants • interface size • failed assertions • generic constraints</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 153–198 • summary p0197 • questions p0197–p0198</text>
</svg>