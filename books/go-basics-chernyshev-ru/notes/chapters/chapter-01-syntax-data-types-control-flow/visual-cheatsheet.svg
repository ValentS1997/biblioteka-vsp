<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 1</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">syntax • types • collections • control flow • conversions • I/O • first project</text>

<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Start</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">go version → verify toolchain</tspan>
<tspan x="48" dy="27">go mod init → create module</tspan>
<tspan x="48" dy="27">package main + func main()</tspan>
<tspan x="48" dy="27">go run main.go → execute</tspan>
</text>

<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. Data model</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">numbers • byte • rune • string • bool</tspan>
<tspan x="572" dy="27">array = fixed/value semantics</tspan>
<tspan x="572" dy="27">slice = ptr + len + cap</tspan>
<tspan x="572" dy="27">map = key:value • pointer = address</tspan>
</text>

<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Control</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">if / else</tspan>
<tspan x="1096" dy="27">switch / case / fallthrough</tspan>
<tspan x="1096" dy="27">for / range / break / continue</tspan>
<tspan x="1096" dy="27">goto exists, but source discourages it</tspan>
</text>

<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. Explicitness</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">different numeric types → explicit conversion</tspan>
<tspan x="48" dy="27">narrowing → possible data loss</tspan>
<tspan x="48" dy="27">fixed-width arithmetic → overflow risk</tspan>
<tspan x="48" dy="27">UTF-8 text → byte index ≠ rune index</tspan>
</text>

<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Standard library</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">fmt / bufio / os.Stdin / strconv</tspan>
<tspan x="572" dy="27">strings → trim/split/case/builder</tspan>
<tspan x="572" dy="27">slices → clone/sort/search/edit</tspan>
<tspan x="572" dy="27">maps → clone/copy/filter/keys/values</tspan>
</text>

<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.0</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">board size 3..9</tspan>
<tspan x="1096" dy="27">validate coordinates / occupied cells</tspan>
<tspan x="1096" dy="27">rows + columns + diagonals</tspan>
<tspan x="1096" dy="27">win / draw / quit</tspan>
</text>

<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: small explicit language primitives → predictable code → one complete console project</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: slice aliasing • UTF-8 bytes/runes • narrowing/overflow • loop termination • goto readability</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 16–100 • summary p0098 • questions p0099–p0100</text>
</svg>