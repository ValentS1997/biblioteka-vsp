<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 8</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">UDP/TCP • HTTP/REST • OpenAPI • ToDo service • Tic-tac-toe v.7</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. UDP / TCP</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">UDP: DialUDP / ListenUDP</tspan>
<tspan x="48" dy="27">TCP: Dial / Listen / Accept</tspan>
<tspan x="48" dy="27">network exchange = bytes</tspan>
<tspan x="48" dy="27">goroutine per TCP connection</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. TCP chat</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">client send goroutine</tspan>
<tspan x="572" dy="27">client receive goroutine</tspan>
<tspan x="572" dy="27">server connection list + Mutex</tspan>
<tspan x="572" dy="27">broadcast to other clients</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. REST / HTTP</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">GET • PUT • POST • DELETE</tspan>
<tspan x="1096" dy="27">headers + optional body</tspan>
<tspan x="1096" dy="27">status codes: 200/201/4xx/500</tspan>
<tspan x="1096" dy="27">resource nouns + API versioning</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. OpenAPI v3</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">info • paths • components</tspan>
<tspan x="48" dy="27">path/query parameters</tspan>
<tspan x="48" dy="27">requestBody + JSON schema</tspan>
<tspan x="48" dy="27">responses + examples</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. ToDo REST service</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">gorilla/mux router</tspan>
<tspan x="572" dy="27">route registry → handlers</tspan>
<tspan x="572" dy="27">GORM/SQLite repository</tspan>
<tspan x="572" dy="27">JSON + documented status codes</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.7</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">TCP + JSON command protocol</tspan>
<tspan x="1096" dy="27">server rooms: PvP / PvC</tspan>
<tspan x="1096" dy="27">client state machine</tspan>
<tspan x="1096" dy="27">async readFromServer goroutine</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: sockets → multi-client server → REST contract → service implementation → final client-server game</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: blocking I/O • shared state races • protocol mismatch • route/status drift • missing API versioning</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 417–507 • summary p0506–p0507 • questions p0507</text>
</svg>