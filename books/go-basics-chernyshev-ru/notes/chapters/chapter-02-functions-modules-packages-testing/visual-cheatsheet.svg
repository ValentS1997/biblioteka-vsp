<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 2</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">functions • packages • modules • dependencies • testing • refactoring</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Functions</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">arguments • returns • variadic</tspan>
<tspan x="48" dy="27">value vs pointer</tspan>
<tspan x="48" dy="27">function values • anonymous • closures</tspan>
<tspan x="48" dy="27">recursion • generator • defer</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. Packages / modules</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">main vs utility package</tspan>
<tspan x="572" dy="27">go.mod / go.sum</tspan>
<tspan x="572" dy="27">exported identifier = Uppercase</tspan>
<tspan x="572" dy="27">local module via replace</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Dependency flow</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">go mod init → get/download</tspan>
<tspan x="1096" dy="27">tidy removes unused requirements</tspan>
<tspan x="1096" dy="27">vendor keeps dependency copies</tspan>
<tspan x="1096" dy="27">semver: major.minor.patch</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. Testing</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">TestXxx(t *testing.T)</tspan>
<tspan x="48" dy="27">table-driven cases</tspan>
<tspan x="48" dy="27">subtests via t.Run</tspan>
<tspan x="48" dy="27">check boundary cases</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Measure</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">coverage: -cover / coverprofile</tspan>
<tspan x="572" dy="27">HTML: go tool cover</tspan>
<tspan x="572" dy="27">BenchmarkXxx(b *testing.B)</tspan>
<tspan x="572" dy="27">b.N • -benchmem • benchtime</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.1</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">monolithic main → package game</tspan>
<tspan x="1096" dy="27">InitBoard / Play = public entry points</tspan>
<tspan x="1096" dy="27">private helpers split responsibilities</tspan>
<tspan x="1096" dy="27">procedural refactoring, behavior preserved</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: decompose → package → manage dependencies → test → measure → refactor safely</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: pointer side effects • scope/shadowing • export boundary • unused deps • recursion exit • test edge cases</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 101–152 • summary p0150–p0151 • questions p0151–p0152</text>
</svg>