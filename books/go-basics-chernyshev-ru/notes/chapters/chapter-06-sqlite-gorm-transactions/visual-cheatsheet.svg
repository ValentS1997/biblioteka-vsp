<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 6</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">SQLite • database/sql • GORM • transactions • DryRun • repository</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Classic SQLite</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">sql.Open + go-sqlite3</tspan>
<tspan x="48" dy="27">DDL CREATE TABLE</tspan>
<tspan x="48" dy="27">Exec / Query / Scan</tspan>
<tspan x="48" dy="27">parameterized SQL with ? placeholders</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. GORM</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">gorm.Open + sqlite driver</tspan>
<tspan x="572" dy="27">struct tags + AutoMigrate</tspan>
<tspan x="572" dy="27">Create / Delete / Find / Where / Save</tspan>
<tspan x="572" dy="27">shorter code, generated SQL trade-off</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Transactions</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">atomic change set</tspan>
<tspan x="1096" dy="27">return nil → commit</tspan>
<tspan x="1096" dy="27">return error → rollback</tspan>
<tspan x="1096" dy="27">nested + manual Begin/Commit/Rollback</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. DryRun</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">DryRun: true</tspan>
<tspan x="48" dy="27">generate SQL, do not execute</tspan>
<tspan x="48" dy="27">Statement.SQL.String()</tspan>
<tspan x="48" dy="27">inspect/optimize ORM queries</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Data model</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">entity = POD</tspan>
<tspan x="572" dy="27">model may extend entity</tspan>
<tspan x="572" dy="27">PK/FK relationship</tspan>
<tspan x="572" dy="27">RowsAffected verifies writes</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.5</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">JSON files → SQLite repository</tspan>
<tspan x="1096" dy="27">IRepository abstraction</tspan>
<tspan x="1096" dy="27">snapshots + finished games</tspan>
<tspan x="1096" dy="27">load/list by player nickname</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: explicit SQL first → ORM abstraction → transactions → repository-backed application storage</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: unparameterized SQL • unchecked RowsAffected • transaction integrity • ORM-generated query cost</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 308–362 • summary p0361 • questions p0361–p0362</text>
</svg>