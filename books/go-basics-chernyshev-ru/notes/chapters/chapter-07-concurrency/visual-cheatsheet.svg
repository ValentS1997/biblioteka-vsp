<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 7</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">goroutines • channels • synchronization • patterns • tic-tac-toe v.6</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Goroutines</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">go function() / go func(){...}()</tspan>
<tspan x="48" dy="27">scheduler decides execution order</tspan>
<tspan x="48" dy="27">WaitGroup = Add / Done / Wait</tspan>
<tspan x="48" dy="27">sleep is not synchronization</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">2. Channels</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">buffered / unbuffered</tspan>
<tspan x="572" dy="27">send / receive / close</tspan>
<tspan x="572" dy="27">&lt;-chan / chan&lt;-</tspan>
<tspan x="572" dy="27">select • timeout • nil • range</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. Shared state</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">go run -race</tspan>
<tspan x="1096" dy="27">Mutex = exclusive critical section</tspan>
<tspan x="1096" dy="27">RWMutex = many readers / one writer</tspan>
<tspan x="1096" dy="27">sync/atomic for supported simple values</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">4. Runtime</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">GOMAXPROCS</tspan>
<tspan x="48" dy="27">logical CPUs influence throughput</tspan>
<tspan x="48" dy="27">more threads is not always better</tspan>
<tspan x="48" dy="27">measure the workload</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Patterns</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">Generator • Pipeline • Queuing</tspan>
<tspan x="572" dy="27">Fan-in • Fan-out</tspan>
<tspan x="572" dy="27">Worker Pool</tspan>
<tspan x="572" dy="27">channels connect producers/consumers</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Tic-tac-toe v.6</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">parallel AI move evaluation</tspan>
<tspan x="1096" dy="27">parallel win checks for large boards</tspan>
<tspan x="1096" dy="27">async DB save/load</tspan>
<tspan x="1096" dy="27">result channels aggregate outcomes</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: start goroutines → coordinate completion/data → protect shared state → structure work with patterns</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: races • deadlocks • WaitGroup mismatch • unclosed ranged channels • unsafe shared copies</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 363–416 • summary p0415 • questions p0415–p0416</text>
</svg>