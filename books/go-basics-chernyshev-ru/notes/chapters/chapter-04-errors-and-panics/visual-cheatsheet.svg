<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="16" y="16" width="1568" height="78" rx="14" fill="#26384d"/>
<text x="800" y="49" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">Основы Go — глава 4</text>
<text x="800" y="76" font-family="Arial, sans-serif" font-size="17" fill="#dce8f4" text-anchor="middle">error • panic • defer/recover • Is/As • wrapping</text>
<rect x="24" y="120" width="500" height="280" rx="14" fill="#f7fbff" stroke="#5b98cf" stroke-width="2"/>
<text x="44" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d64">1. Ordinary error</text>
<text x="48" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">return value + error</tspan>
<tspan x="48" dy="27">if err != nil → handle</tspan>
<tspan x="48" dy="27">errors.New / fmt.Errorf</tspan>
<tspan x="48" dy="27">program may continue</tspan>
</text>
<rect x="548" y="120" width="500" height="280" rx="14" fill="#fff7fb" stroke="#cf6d99" stroke-width="2"/>
<text x="568" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842044">2. Panic path</text>
<text x="572" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">index out of range / nil pointer</tspan>
<tspan x="572" dy="27">panic(v) for explicit panic</tspan>
<tspan x="572" dy="27">stack trace locates failure</tspan>
<tspan x="572" dy="27">without recovery app may terminate</tspan>
</text>
<rect x="1072" y="120" width="504" height="280" rx="14" fill="#fff9f4" stroke="#d49a4c" stroke-width="2"/>
<text x="1092" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#714500">3. defer / recover</text>
<text x="1096" y="188" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">register defer before panic point</tspan>
<tspan x="1096" dy="27">deferred cleanup still runs</tspan>
<tspan x="1096" dy="27">recover() in deferred function</tspan>
<tspan x="1096" dy="27">handler may re-panic to upper level</tspan>
</text>
<rect x="24" y="430" width="500" height="290" rx="14" fill="#f6fff8" stroke="#58ad79" stroke-width="2"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18572f">4. Identify errors</text>
<text x="48" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="48" dy="0">package-level Err... values</tspan>
<tspan x="48" dy="27">errors.Is → known error branch</tspan>
<tspan x="48" dy="27">custom struct implements Error()</tspan>
<tspan x="48" dy="27">errors.As → structured error fields</tspan>
</text>
<rect x="548" y="430" width="500" height="290" rx="14" fill="#f7f7ff" stroke="#8179d6" stroke-width="2"/>
<text x="568" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#474092">5. Wrap context</text>
<text x="572" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="572" dy="0">fmt.Errorf("context: %w", err)</tspan>
<tspan x="572" dy="27">keep low-level cause</tspan>
<tspan x="572" dy="27">add higher-level context</tspan>
<tspan x="572" dy="27">errors.Unwrap → lower-level error</tspan>
</text>
<rect x="1072" y="430" width="504" height="290" rx="14" fill="#f4fbff" stroke="#6d9fc8" stroke-width="2"/>
<text x="1092" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174d70">6. Decision rule</text>
<text x="1096" y="498" font-family="Arial, sans-serif" font-size="16" fill="#19324a">
<tspan x="1096" dy="0">recoverable? → return error</tspan>
<tspan x="1096" dy="27">panic-level failure? → panic path</tspan>
<tspan x="1096" dy="27">need cleanup? → defer first</tspan>
<tspan x="1096" dy="27">need cause chain? → wrap with %w</tspan>
</text>
<rect x="24" y="755" width="1552" height="112" rx="12" fill="#26384d"/>
<text x="800" y="792" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea: make failure explicit, preserve cause/context, and keep panic handling deliberate</text>
<text x="800" y="822" font-family="Arial, sans-serif" font-size="16" fill="#dce8f4" text-anchor="middle">Watch: ignored err • defer after panic • unchecked assertion-like classification • lost wrapped cause</text>
<text x="800" y="848" font-family="Arial, sans-serif" font-size="14" fill="#dce8f4" text-anchor="middle">RAG: PDF 199–212 • summary/questions p0212</text>
</svg>