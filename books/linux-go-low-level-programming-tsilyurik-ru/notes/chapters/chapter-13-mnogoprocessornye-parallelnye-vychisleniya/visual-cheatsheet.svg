<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:30px;font-weight:700}.t{font-size:20px;font-weight:700}.b{font-size:16px}.box{fill:#f7f7f7;stroke:#333;stroke-width:2}</style>
<text x="50" y="55" class="h">Глава 13 — Многопроцессорные параллельные вычисления</text>
<text x="50" y="88" class="b">RAG: PDF 258–279 · activation → races → sync → scaling → timers → anti-pattern</text>

<rect x="50" y="125" width="340" height="195" rx="14" class="box"/>
<text x="75" y="165" class="t">1. Activation cost</text>
<text x="75" y="200" class="b">fork / pthread / goroutine</text>
<text x="75" y="230" class="b">large N stresses host limits</text>
<text x="75" y="260" class="b">goroutines cheapest in source test</text>
<text x="75" y="290" class="b">limits ≠ application throughput</text>

<rect x="430" y="125" width="340" height="195" rx="14" class="box"/>
<text x="455" y="165" class="t">2. Races</text>
<text x="455" y="200" class="b">shared counter++</text>
<text x="455" y="230" class="b">nondeterministic result</text>
<text x="455" y="260" class="b">go build -race</text>
<text x="455" y="290" class="b">diagnostic overhead</text>

<rect x="810" y="125" width="340" height="195" rx="14" class="box"/>
<text x="835" y="165" class="t">3. Synchronization</text>
<text x="835" y="200" class="b">sync/atomic</text>
<text x="835" y="230" class="b">sync.Mutex</text>
<text x="835" y="260" class="b">channels</text>
<text x="835" y="290" class="b">correctness costs time</text>

<rect x="50" y="365" width="340" height="210" rx="14" class="box"/>
<text x="75" y="405" class="t">4. Scaling</text>
<text x="75" y="440" class="b">independent CPU work can scale</text>
<text x="75" y="470" class="b">benefit saturates near CPU capacity</text>
<text x="75" y="500" class="b">toy local hash workload</text>
<text x="75" y="530" class="b">security claims remain scoped</text>

<rect x="430" y="365" width="340" height="210" rx="14" class="box"/>
<text x="455" y="405" class="t">5. Async patterns</text>
<text x="455" y="440" class="b">channel pipeline</text>
<text x="455" y="470" class="b">Timer / AfterFunc</text>
<text x="455" y="500" class="b">Ticker</text>
<text x="455" y="530" class="b">lifecycle matters</text>

<rect x="810" y="365" width="340" height="210" rx="14" class="box"/>
<text x="835" y="405" class="t">6. Anti-pattern</text>
<text x="835" y="440" class="b">tiny work per goroutine</text>
<text x="835" y="470" class="b">mutex per term</text>
<text x="835" y="500" class="b">parallel Basel slower</text>
<text x="835" y="530" class="b">granularity beats worker count</text>

<text x="50" y="650" class="t">Acceptance</text>
<text x="50" y="685" class="b">Correct result → race-free design → enough useful work per task → measured speedup over sequential baseline.</text>
<text x="50" y="725" class="b">High-risk resource-limit tuning is not benchmark boilerplate.</text>
<text x="50" y="765" class="b">Source mismatches are recorded separately; no silent correction.</text>
</svg>