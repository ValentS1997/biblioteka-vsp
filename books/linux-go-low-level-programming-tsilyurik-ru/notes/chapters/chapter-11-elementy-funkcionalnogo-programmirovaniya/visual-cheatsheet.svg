<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
<rect width="1200" height="790" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:31px;font-weight:700}.t{font-size:20px;font-weight:700}.b{font-size:16px}.box{fill:#f7f7f7;stroke:#333;stroke-width:2}</style>
<text x="50" y="55" class="h">Глава 11 — Элементы функционального программирования</text>
<text x="50" y="88" class="b">RAG: PDF 233–243 · functions → closures → currying → recursion → memoization → pure style</text>

<rect x="50" y="125" width="340" height="195" rx="14" class="box"/>
<text x="75" y="165" class="t">1. Functions as values</text>
<text x="75" y="200" class="b">pass as argument</text>
<text x="75" y="230" class="b">return as result</text>
<text x="75" y="260" class="b">higher-order functions</text>
<text x="75" y="290" class="b">anonymous functions</text>

<rect x="430" y="125" width="340" height="195" rx="14" class="box"/>
<text x="455" y="165" class="t">2. Closures</text>
<text x="455" y="200" class="b">makeAdder</text>
<text x="455" y="230" class="b">captured state</text>
<text x="455" y="260" class="b">accumulating transform</text>
<text x="455" y="290" class="b">cross-language comparison</text>

<rect x="810" y="125" width="340" height="195" rx="14" class="box"/>
<text x="835" y="165" class="t">3. Currying</text>
<text x="835" y="200" class="b">func(a,b) → func(a)(b)</text>
<text x="835" y="230" class="b">mkAdd</text>
<text x="835" y="260" class="b">returned function</text>
<text x="835" y="290" class="b">state bound in closure</text>

<rect x="50" y="365" width="340" height="210" rx="14" class="box"/>
<text x="75" y="405" class="t">4. Recursion</text>
<text x="75" y="440" class="b">binary tree traversal</text>
<text x="75" y="470" class="b">nil termination</text>
<text x="75" y="500" class="b">callback per node</text>
<text x="75" y="530" class="b">in-order result</text>

<rect x="430" y="365" width="340" height="210" rx="14" class="box"/>
<text x="455" y="405" class="t">5. Memoization</text>
<text x="455" y="440" class="b">map cache</text>
<text x="455" y="470" class="b">reuse prior results</text>
<text x="455" y="500" class="b">same Fibonacci result</text>
<text x="455" y="530" class="b">algorithmic speedup</text>

<rect x="810" y="365" width="340" height="210" rx="14" class="box"/>
<text x="835" y="405" class="t">6. Pure style</text>
<text x="835" y="440" class="b">Point.Add returns value</text>
<text x="835" y="470" class="b">no mutation in example</text>
<text x="835" y="500" class="b">chain transformations</text>
<text x="835" y="530" class="b">reduce shared-state risk</text>

<text x="50" y="640" class="t">Takeaway</text>
<text x="50" y="675" class="b">Make state location and lifetime explicit; optimize repeated work with data reuse before adding parallelism.</text>
<text x="50" y="710" class="b">Broad closure/runtime claims remain source-scoped.</text>
</svg>