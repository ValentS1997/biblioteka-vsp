<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 12 — Передача файлов по сети и доступ к ним</title>
<desc id="desc">Network file transfer, rsync, Samba, SSHFS, NFS, cloud/FUSE, performance and security.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 12 — Передача файлов по сети и доступ к ним</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">copy · rsync · SMB/CIFS · SSHFS · NFS · cloud/FUSE</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">rsync</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">-n = dry run · -a = archive</tspan>
<tspan x="72" dy="31">dir ≠ dir/</tspan>
<tspan x="72" dy="31">--delete is destructive</tspan>
<tspan x="72" dy="39" font-weight="700">Preview uncertain transfers first.</tspan>
</text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Performance</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">network storage adds latency</tspan>
<tspan x="588" dy="31">sequential access buffers well</tspan>
<tspan x="588" dy="31">random/many-file access suffers</tspan>
<tspan x="588" dy="39">Local storage may fit demanding workloads better.</tspan>
</text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Security</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">authenticate + authorize</tspan>
<tspan x="1103" dy="31">encrypt on untrusted networks</tspan>
<tspan x="1103" dy="31">simple sharing is often least secure</tspan>
<tspan x="1103" dy="39">Treat file sharing as a security boundary.</tspan>
</text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Samba / CIFS</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">SMB interoperability with Windows</tspan>
<tspan x="72" dy="31">smb.conf → access/share policy</tspan>
<tspan x="72" dy="31">smbpasswd → credential state</tspan>
<tspan x="72" dy="39">Avoid guest + writable exposure.</tspan>
</text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">SSHFS / NFS</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">SSHFS = easy + encrypted + FUSE</tspan>
<tspan x="588" dy="31">NFS = classic Unix/NAS sharing</tspan>
<tspan x="588" dy="31">NFS security needs explicit design</tspan>
<tspan x="588" dy="39">Automount reduces boot dependencies.</tspan>
</text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Cloud / FUSE</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">cloud storage trades speed for service</tspan>
<tspan x="1103" dy="31">FUSE moves client logic to user space</tspan>
<tspan x="1103" dy="31">auth/encryption become more flexible</tspan>
<tspan x="1103" dy="39">No universal network filesystem wins everywhere.</tspan>
</text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Choose by goal first: one-time copy → sync → mounted share; then evaluate latency, security and failure behavior.</text>
</svg>