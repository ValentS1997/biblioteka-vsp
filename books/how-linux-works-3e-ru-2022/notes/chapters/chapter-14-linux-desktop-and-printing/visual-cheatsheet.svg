<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 14 — Рабочий стол Linux и печать</title>
<desc id="desc">Wayland, X Window, input, D-Bus and CUPS printing overview.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 14 — Рабочий стол Linux и печать</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">Wayland · X Window · libinput · D-Bus · CUPS</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Wayland</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="72">client-owned buffers</tspan><tspan x="72" dy="31">compositor combines + routes input</tspan><tspan x="72" dy="31">WAYLAND_DISPLAY → socket name</tspan><tspan x="72" dy="39">ss -xlp can reveal compositor process.</tspan></text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">X Window</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="588">X server owns display/input path</tspan><tspan x="588" dy="31">window manager is an X client</tspan><tspan x="588" dy="31">DISPLAY identifies X display</tspan><tspan x="588" dy="39">xwininfo · xev · xinput</tspan></text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Input</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1103">kernel /dev/input</tspan><tspan x="1103" dy="31">libinput normalizes events</tspan><tspan x="1103" dy="31">X input adds device properties</tspan><tspan x="1103" dy="39">Capture baseline before remapping.</tspan></text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Compatibility</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="72">X application → Xwayland → Wayland</tspan><tspan x="72" dy="31">extra translation layer</tspan><tspan x="72" dy="31">X direct TCP historically unencrypted</tspan><tspan x="72" dy="39">Use secure tunneling rather than raw X TCP.</tspan></text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">D-Bus</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="588">system bus + session bus</tspan><tspan x="588" dy="31">dbus-daemon brokers messages</tspan><tspan x="588" dy="31">dbus-monitor observes events</tspan><tspan x="588" dy="39">Do not edit system.conf casually.</tspan></text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Printing</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1103">application → CUPS queue</tspan><tspan x="1103" dy="31">filters → RIP/Ghostscript</tspan><tspan x="1103" dy="31">PPD/driver → backend → printer</tspan><tspan x="1103" dy="39">IPP uses TCP/631.</tspan></text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Diagnosis: identify protocol/session → server/compositor → input/client events → D-Bus; printing: queue → filter → driver → backend.</text>
</svg>