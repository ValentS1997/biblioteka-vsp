<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 6 — Запуск пользовательского пространства</title>
<desc id="desc">systemd units, dependencies, initramfs, shutdown and rescue boot.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 6 — Запуск пользовательского пространства</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">PID 1 · systemd · dependencies · initramfs · rescue</text>
<rect x="50" y="150" width="470" height="240" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
<text x="78" y="190" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Startup</text>
<text x="78" y="230" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">Kernel → init/PID 1</tspan><tspan x="78" dy="32">low-level services → network</tspan><tspan x="78" dy="32">higher services → login/UI/apps</tspan></text>
<rect x="565" y="150" width="470" height="240" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
<text x="593" y="190" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">systemd</text>
<text x="593" y="230" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">service · target · socket · mount</tspan><tspan x="593" dy="32">status → cgroup → journal</tspan><tspan x="593" dy="32">local config: /etc/systemd/system</tspan></text>
<rect x="1080" y="150" width="470" height="240" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
<text x="1108" y="190" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Dependencies</text>
<text x="1108" y="230" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">Requires · Wants · Requisite · Conflicts</tspan><tspan x="1108" dy="32">Before / After = ordering</tspan><tspan x="1108" dy="32">enable != start</tspan></text>
<rect x="50" y="430" width="470" height="250" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
<text x="78" y="470" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Resource activation</text>
<text x="78" y="510" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78" dy="0">resource unit monitors/listens</tspan><tspan x="78" dy="32">request → buffer → service start</tspan><tspan x="78" dy="32">service takes over resource</tspan></text>
<rect x="565" y="430" width="470" height="250" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
<text x="593" y="470" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Initramfs</text>
<text x="593" y="510" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593" dy="0">temporary RAM root</tspan><tspan x="593" dy="32">load modules → mount real root</tspan><tspan x="593" dy="32">switch → full init</tspan></text>
<rect x="1080" y="430" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
<text x="1108" y="470" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Shutdown / recovery</text>
<text x="1108" y="510" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108" dy="0">managed shutdown → unmount → sync</tspan><tspan x="1108" dy="32">rescue.target / single-user</tspan><tspan x="1108" dy="32">live image often more practical</tspan></text>
<rect x="50" y="760" width="1500" height="72" rx="14" fill="#17202a"/>
<text x="78" y="805" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">unit → status/journal → dependencies/path → local change → reload → verify</text>
</svg>