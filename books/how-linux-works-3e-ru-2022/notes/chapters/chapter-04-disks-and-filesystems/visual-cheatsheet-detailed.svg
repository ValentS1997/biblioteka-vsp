<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — Диски и файловые системы: подробная шпаргалка</title>
  <desc id="desc">Detailed storage stack, filesystem, swap, LVM, recovery and inode summary.</desc>
  <rect width="1600" height="1120" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffffff">Глава 4 — Диски и файловые системы</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Partitioning · VFS · mount/fstab · fsck · swap · LVM/device mapper · inode internals</text>

  <rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Partition layer</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">MBR: primary / extended / logical</tspan>
    <tspan x="78" dy="29">GPT: modern partition table with names/IDs</tspan>
    <tspan x="78" dy="29">fdisk stages; parted applies immediately</tspan>
    <tspan x="78" dy="29">Backup + target unused before writes</tspan>
    <tspan x="78" dy="29">SSD alignment usually 1 MiB boundaries</tspan>
  </text>

  <rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Filesystem / VFS</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Filesystem = database over block device</tspan>
    <tspan x="593" dy="29">VFS standardizes app-facing interface</tspan>
    <tspan x="593" dy="29">ext4 · Btrfs · FAT · NTFS · XFS · ISO9660</tspan>
    <tspan x="593" dy="29">mkfs creates metadata + superblocks</tspan>
    <tspan x="593" dy="29">Creating over existing FS destroys data</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Mount + identity</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">device/UUID → mount point</tspan>
    <tspan x="1108" dy="29">blkid resolves UUID/type</tspan>
    <tspan x="1108" dy="29">UUID avoids unstable kernel device names</tspan>
    <tspan x="1108" dy="29">ro/rw · exec/noexec · suid/nosuid</tspan>
    <tspan x="1108" dy="29">umount flushes buffered writes</tspan>
  </text>

  <rect x="50" y="410" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. fstab / capacity / recovery</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">fstab: device · mountpoint · type · options · dump · fsck order</tspan>
    <tspan x="78" dy="29">df → filesystem capacity · du → directory usage</tspan>
    <tspan x="78" dy="29">sync flushes pending disk writes</tspan>
    <tspan x="78" dy="29">fsck must not run on mounted filesystem</tspan>
    <tspan x="78" dy="29">For serious errors: no-change check first</tspan>
    <tspan x="78" dy="29">Backup superblocks and lost+found are recovery mechanisms</tspan>
  </text>

  <rect x="810" y="410" width="740" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Special FS + swap</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="838" dy="0">proc → processes/kernel interface</tspan>
    <tspan x="838" dy="29">sysfs → device/system interface</tspan>
    <tspan x="838" dy="29">tmpfs → RAM + swap-backed temporary storage</tspan>
    <tspan x="838" dy="29">squashfs → compressed read-only</tspan>
    <tspan x="838" dy="29">overlay → combined directory layers</tspan>
    <tspan x="838" dy="29">swap partition/file → kernel virtual-memory pool</tspan>
  </text>

  <rect x="50" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. LVM model</text>
  <text x="78" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">PV → VG → LV</tspan>
    <tspan x="78" dy="29">PE = allocation unit inside PV/VG</tspan>
    <tspan x="78" dy="29">LVM tools manage metadata in user space</tspan>
    <tspan x="78" dy="29">device mapper performs kernel block mapping</tspan>
    <tspan x="78" dy="29">Stable LV names point to dm-* devices</tspan>
  </text>

  <rect x="565" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. Resize boundary</text>
  <text x="593" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">LV size and filesystem size are separate.</tspan>
    <tspan x="593" dy="29">Grow ext-family can be online.</tspan>
    <tspan x="593" dy="29">Shrink mounted filesystem is not supported.</tspan>
    <tspan x="593" dy="29">Removal requires data moved/backed up + LV unused.</tspan>
    <tspan x="593" dy="29">Syntax errors can change deletion scope.</tspan>
  </text>

  <rect x="1080" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Inode internals</text>
  <text x="1108" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Directory entry maps name → inode number.</tspan>
    <tspan x="1108" dy="29">Inode stores metadata + block references.</tspan>
    <tspan x="1108" dy="29">Hard links share one inode.</tspan>
    <tspan x="1108" dy="29">Link count controls inode lifetime.</tspan>
    <tspan x="1108" dy="29">Block bitmap tracks free/used data blocks.</tspan>
  </text>

  <rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="76" y="1037" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Operational model: identify storage layer → read-only evidence → backup/rollback → minimal write → verify same layer.</text>
  <text x="76" y="1064" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0102:c01–p0155:c01 · PDF/printed pages 102–155.</text>
</svg>