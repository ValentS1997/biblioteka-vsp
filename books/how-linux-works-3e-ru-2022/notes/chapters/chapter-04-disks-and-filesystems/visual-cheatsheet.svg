<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 4 — Диски и файловые системы: компактная шпаргалка</title>
  <desc id="desc">Partitioning, filesystems, mount, fsck, swap, LVM and inodes.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 4 — Диски и файловые системы</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">device → partition → LVM → filesystem/swap → mount → files</text>

  <rect x="45" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="72" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Partitioning</text>
  <text x="72" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">MBR / GPT · parted · fdisk</tspan>
    <tspan x="72" dy="30">Partition ≠ filesystem</tspan>
    <tspan x="72" dy="30">Перед изменением: backup + target unused</tspan>
    <tspan x="72" dy="30">SSD: alignment обычно по 1 MiB</tspan>
  </text>

  <rect x="560" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="588" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Filesystem + mount</text>
  <text x="588" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">VFS унифицирует разные filesystem types</tspan>
    <tspan x="588" dy="30">mkfs — destructive creation boundary</tspan>
    <tspan x="588" dy="30">UUID → stable filesystem identity</tspan>
    <tspan x="588" dy="30">mount options: ro/rw · exec/noexec · suid/nosuid</tspan>
  </text>

  <rect x="1075" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1103" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Integrity</text>
  <text x="1103" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">Buffered writes → umount/sync</tspan>
    <tspan x="1103" dy="30">df / du → capacity</tspan>
    <tspan x="1103" dy="30">fsck: только offline filesystem</tspan>
    <tspan x="1103" dy="30">При тяжёлой ошибке сначала no-change check</tspan>
  </text>

  <rect x="45" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="72" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">/etc/fstab + special FS</text>
  <text x="72" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">device/UUID · mountpoint · type · options</tspan>
    <tspan x="72" dy="30">dump field · fsck order</tspan>
    <tspan x="72" dy="30">proc · sysfs · tmpfs · squashfs · overlay</tspan>
    <tspan x="72" dy="30">Filesystem может быть system interface.</tspan>
  </text>

  <rect x="560" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="588" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Swap + LVM</text>
  <text x="588" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">Swap = disk-backed virtual-memory storage</tspan>
    <tspan x="588" dy="30">PV → VG → LV</tspan>
    <tspan x="588" dy="30">Device Mapper выполняет kernel mapping</tspan>
    <tspan x="588" dy="30">LV resize ≠ filesystem resize</tspan>
  </text>

  <rect x="1075" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1103" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Inodes</text>
  <text x="1103" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">Directory entry → inode → data blocks</tspan>
    <tspan x="1103" dy="30">Hard link = ещё одно имя того же inode</tspan>
    <tspan x="1103" dy="30">Link count управляет lifetime inode</tspan>
    <tspan x="1103" dy="30">Block bitmap хранит free/used blocks</tspan>
  </text>

  <rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
  <text x="74" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Правило: идентифицировать слой → read-only baseline → backup/rollback → минимальное изменение → verification.</text>
</svg>