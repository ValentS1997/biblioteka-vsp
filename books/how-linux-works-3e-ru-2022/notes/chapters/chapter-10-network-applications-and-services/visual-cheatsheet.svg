<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 10 — Сетевые приложения и службы</title>
<desc id="desc">Clients, servers, SSH, network diagnostics, security and sockets.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 10 — Сетевые приложения и службы</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">client/server · SSH · lsof/tcpdump/netcat/nmap · security · sockets</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Service model</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">client → socket → transport → server</tspan>
<tspan x="72" dy="31">listener must exist before connection</tspan>
<tspan x="72" dy="31">TCP connectivity ≠ protocol correctness</tspan>
<tspan x="72" dy="39" font-weight="700">Localize endpoint before packet capture.</tspan>
</text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">SSH</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">sshd_config + host keys</tspan>
<tspan x="588" dy="31">private host key = secret</tspan>
<tspan x="588" dy="31">known_hosts verifies server identity</tspan>
<tspan x="588" dy="39">Confirm changed key before editing trust.</tspan>
</text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Diagnostics</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">netstat → endpoint state</tspan>
<tspan x="1103" dy="31">lsof → process ownership</tspan>
<tspan x="1103" dy="31">tcpdump → packets</tspan>
<tspan x="1103" dy="39">netcat/nmap → active authorized tests</tspan>
</text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Security</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">run fewer services</tspan>
<tspan x="72" dy="31">firewall unnecessary exposure</tspan>
<tspan x="72" dy="31">update public services + restrict accounts</tspan>
<tspan x="72" dy="39">Avoid plaintext legacy remote services.</tspan>
</text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Socket API</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">TCP → SOCK_STREAM</tspan>
<tspan x="588" dy="31">UDP → SOCK_DGRAM</tspan>
<tspan x="588" dy="31">listen → accept → connection socket</tspan>
<tspan x="588" dy="39">socket = user/kernel networking boundary</tspan>
</text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Unix domain sockets</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">local IPC without IP network</tspan>
<tspan x="1103" dy="31">filesystem permissions may control access</tspan>
<tspan x="1103" dy="31">lsof -U maps active sockets</tspan>
<tspan x="1103" dy="39">Check local socket before assuming TCP.</tspan>
</text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Workflow: listener/process → endpoint → application exchange → trust/security → packets only when necessary.</text>
</svg>