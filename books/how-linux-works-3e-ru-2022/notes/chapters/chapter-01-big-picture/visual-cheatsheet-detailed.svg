<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Общая картина: подробная шпаргалка</title>
  <desc id="desc">Подробное визуальное резюме главы 1 книги Внутреннее устройство Linux.</desc>
  <rect width="1600" height="1120" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Общая картина: подробная шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Абстракция · уровни · процессы · память · драйверы · syscalls · user space · users</text>

  <rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Абстракция</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Скрыть лишние детали и понять назначение.</tspan>
    <tspan x="78" dy="29">Компоненты группируются по уровням между</tspan>
    <tspan x="78" dy="29">пользователем и оборудованием.</tspan>
    <tspan x="78" dy="38" font-weight="700">Сначала сузить уровень, затем углубляться.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Три уровня Linux</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">User space — пользовательские процессы.</tspan>
    <tspan x="593" dy="29">Kernel — управление и интерфейс к hardware.</tspan>
    <tspan x="593" dy="29">Hardware — CPU, RAM, disks, network interfaces.</tspan>
    <tspan x="593" dy="38">Процессы ↔ kernel ↔ hardware.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Privilege boundary</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Kernel mode: широкий доступ к CPU и RAM.</tspan>
    <tspan x="1108" dy="29">User mode: ограниченный доступ.</tspan>
    <tspan x="1108" dy="29">Kernel space доступен только ядру.</tspan>
    <tspan x="1108" dy="29">root — привилегированный user, не kernel mode.</tspan>
  </text>

  <rect x="50" y="410" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Process management и context switch</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Квант времени → interrupt → kernel mode.</tspan>
    <tspan x="78" dy="29">Ядро сохраняет состояние текущего процесса.</tspan>
    <tspan x="78" dy="29">Обрабатывает kernel tasks и выбирает ready process.</tspan>
    <tspan x="78" dy="29">Подготавливает memory + CPU, задаёт новый квант.</tspan>
    <tspan x="78" dy="29">Возвращает CPU в user mode.</tspan>
    <tspan x="78" dy="38" font-weight="700">Запуск: shell → fork() → child → exec(ls).</tspan>
  </text>

  <rect x="810" y="410" width="740" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Memory management</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="838" dy="0">Ядро изолирует память процессов и kernel memory.</tspan>
    <tspan x="838" dy="29">Допускается shared и read-only memory.</tspan>
    <tspan x="838" dy="29">Virtual memory скрывает физические адреса.</tspan>
    <tspan x="838" dy="29">MMU: process address → physical location.</tspan>
    <tspan x="838" dy="29">Ядро поддерживает mapping; реализация — page table.</tspan>
    <tspan x="838" dy="29">При context switch меняется активное соответствие.</tspan>
  </text>

  <rect x="50" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Devices и syscalls</text>
  <text x="78" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Drivers находятся в kernel и унифицируют hardware.</tspan>
    <tspan x="78" dy="29">System calls — граница process ↔ kernel.</tspan>
    <tspan x="78" dy="29">Open/read/write связаны с system calls.</tspan>
    <tspan x="78" dy="29">/dev/random — пример kernel pseudodevice.</tspan>
  </text>

  <rect x="565" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. User space</text>
  <text x="593" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Низ: небольшие базовые компоненты.</tspan>
    <tspan x="593" dy="29">Середина: mail / print / DB / DNS cache services.</tspan>
    <tspan x="593" dy="29">Верх: UI и приложения.</tspan>
    <tspan x="593" dy="29">Структура приблизительная, не жёсткое правило.</tspan>
    <tspan x="593" dy="29">Многие программы используют syslog.</tspan>
  </text>

  <rect x="1080" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Users, UID, root, groups</text>
  <text x="1108" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Ядро идентифицирует users числовым UID.</tspan>
    <tspan x="1108" dy="29">Процессы и файлы имеют owner.</tspan>
    <tspan x="1108" dy="29">Пользователь ограничен относительно чужих процессов.</tspan>
    <tspan x="1108" dy="29">root имеет исключительные права.</tspan>
    <tspan x="1108" dy="29">Groups дают совместный доступ к файлам.</tspan>
  </text>

  <rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="76" y="1037" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Модель: hardware → kernel → user space; внутри kernel — процессы, память, drivers, syscalls.</text>
  <text x="76" y="1064" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0028:c01–p0038:c01 · PDF/printed pages 28–38.</text>
</svg>