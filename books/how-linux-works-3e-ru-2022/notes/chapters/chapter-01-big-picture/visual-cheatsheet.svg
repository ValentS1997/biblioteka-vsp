<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 1 — Общая картина: компактная шпаргалка</title>
  <desc id="desc">Три уровня Linux, обязанности ядра, процессы, память и пользователи.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 1 — Общая картина</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Абстракция → hardware → kernel → user space</text>

  <rect x="50" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Три уровня</text>
  <text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#273746">
    <tspan x="78" dy="0">User space — процессы, службы, приложения</tspan>
    <tspan x="78" dy="34">Kernel — посредник и управляющий слой</tspan>
    <tspan x="78" dy="34">Hardware — CPU, RAM, disks, network</tspan>
    <tspan x="78" dy="45" font-weight="700">Сначала определить слой, потом детали.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">4 обязанности ядра</text>
  <text x="593" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#273746">
    <tspan x="593" dy="0">• управление процессами</tspan>
    <tspan x="593" dy="34">• управление памятью</tspan>
    <tspan x="593" dy="34">• драйверы устройств</tspan>
    <tspan x="593" dy="34">• системные вызовы и поддержка</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="270" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="187" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Kernel mode / user mode</text>
  <text x="1108" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Kernel mode: широкий доступ к CPU и RAM.</tspan>
    <tspan x="1108" dy="33">User mode: ограниченная память и операции.</tspan>
    <tspan x="1108" dy="33">Обычный сбой процесса обычно локален.</tspan>
    <tspan x="1108" dy="33">root остаётся в user mode.</tspan>
  </text>

  <rect x="50" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Процессы</text>
  <text x="78" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="78" dy="0">Кванты времени создают ощущение multitasking.</tspan>
    <tspan x="78" dy="33">Context switch: сохранить → выбрать →</tspan>
    <tspan x="78" dy="33">подготовить → вернуть в user mode.</tspan>
    <tspan x="78" dy="43">Запуск: shell → fork() → exec(ls).</tspan>
  </text>

  <rect x="565" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="593" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Память</text>
  <text x="593" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="593" dy="0">Процесс имеет собственное адресное пространство.</tspan>
    <tspan x="593" dy="33">MMU переводит адрес процесса в physical memory.</tspan>
    <tspan x="593" dy="33">Ядро поддерживает mapping.</tspan>
    <tspan x="593" dy="33">Реализация mapping — таблица страниц.</tspan>
  </text>

  <rect x="1080" y="455" width="470" height="285" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1108" y="497" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Пользователи</text>
  <text x="1108" y="540" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="19" fill="#273746">
    <tspan x="1108" dy="0">Ядро оперирует UID, не username.</tspan>
    <tspan x="1108" dy="33">Процессы и файлы имеют владельца.</tspan>
    <tspan x="1108" dy="33">root может управлять чужими процессами</tspan>
    <tspan x="1108" dy="33">и читать локальные файлы.</tspan>
    <tspan x="1108" dy="33">Groups дают совместный доступ к файлам.</tspan>
  </text>

  <rect x="50" y="790" width="1500" height="68" rx="14" fill="#17202a"/>
  <text x="78" y="833" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Принцип: локализуй механизм по уровню абстракции, затем углубляйся только в нужный компонент.</text>
</svg>