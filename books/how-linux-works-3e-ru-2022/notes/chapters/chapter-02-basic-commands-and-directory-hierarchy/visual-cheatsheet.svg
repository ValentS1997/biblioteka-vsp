<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — Основные команды и иерархия каталогов</title>
  <desc id="desc">Компактная визуальная шпаргалка по shell, файлам, процессам, правам, архивам и sudo.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffffff">Глава 2 — Основные команды и иерархия каталогов</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Shell · paths · streams · errors · processes · permissions · archives · filesystem hierarchy · sudo</text>

  <rect x="45" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="72" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Shell и навигация</text>
  <text x="72" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">bash /bin/sh · command + arguments</tspan>
    <tspan x="72" dy="30">pwd · ls · cd · mkdir · rmdir</tspan>
    <tspan x="72" dy="30">absolute path / relative path</tspan>
    <tspan x="72" dy="30">. · .. · ~ · wildcard * and ?</tspan>
    <tspan x="72" dy="38" font-weight="700">Shell expansion происходит до запуска команды.</tspan>
  </text>

  <rect x="560" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="588" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Read-only toolkit</text>
  <text x="588" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">grep · less · diff · file</tspan>
    <tspan x="588" dy="30">find · locate · head · tail · sort</tspan>
    <tspan x="588" dy="30">man · man -k · info</tspan>
    <tspan x="588" dy="30">ps · jobs · journalctl(sudo)</tspan>
    <tspan x="588" dy="38" font-weight="700">Сначала получить evidence.</tspan>
  </text>

  <rect x="1075" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1103" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">stdin / stdout / stderr</text>
  <text x="1103" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">stdin → process → stdout</tspan>
    <tspan x="1103" dy="30">stderr — отдельный diagnostic stream</tspan>
    <tspan x="1103" dy="30">pipe связывает процессы</tspan>
    <tspan x="1103" dy="30">redirect пишет вывод в файл</tspan>
    <tspan x="1103" dy="38" font-weight="700">Перезапись файла требует осторожности.</tspan>
  </text>

  <rect x="45" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="72" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Processes и errors</text>
  <text x="72" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">Ошибка: program + object/path + reason</tspan>
    <tspan x="72" dy="30">Исправлять первую ошибку.</tspan>
    <tspan x="72" dy="30">ps: PID · TTY · STAT · TIME · COMMAND</tspan>
    <tspan x="72" dy="30">TERM · STOP · CONT · job control</tspan>
    <tspan x="72" dy="30">Принудительный signal — только крайняя мера.</tspan>
  </text>

  <rect x="560" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="588" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Permissions / links / archives</text>
  <text x="588" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">user · group · other → r / w / x</tspan>
    <tspan x="588" dy="30">chmod · umask · symbolic links</tspan>
    <tspan x="588" dy="30">gzip + tar: compression ≠ archive</tspan>
    <tspan x="588" dy="30">Перед extraction сначала listing/test.</tspan>
    <tspan x="588" dy="30">Symlink: проверять target и порядок аргументов.</tspan>
  </text>

  <rect x="1075" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1103" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Filesystem + privilege</text>
  <text x="1103" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">/etc config · /proc runtime process data</tspan>
    <tspan x="1103" dy="30">/sys devices · /run runtime state</tspan>
    <tspan x="1103" dy="30">/usr programs/data · /var mutable data</tspan>
    <tspan x="1103" dy="30">sudo вместо постоянной root-shell</tspan>
    <tspan x="1103" dy="30">sudoers редактировать через visudo.</tspan>
  </text>

  <rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
  <text x="74" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Принцип: посмотреть → понять → сузить область → изменить минимально → проверить.</text>
</svg>