<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 2 — подробная шпаргалка</title>
  <desc id="desc">Подробное резюме основных команд, потоков, процессов, прав, архивов и каталогов.</desc>
  <rect width="1600" height="1120" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffffff">Глава 2 — Основные команды и иерархия каталогов</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Подробная карта: shell → files → streams → errors/processes → permissions → archives → hierarchy → sudo</text>

  <rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Shell и пути</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">bash /bin/sh · command + arguments</tspan>
    <tspan x="78" dy="29">absolute path начинается с /</tspan>
    <tspan x="78" dy="29">relative path · . · .. · ~</tspan>
    <tspan x="78" dy="29">cd встроена в shell</tspan>
    <tspan x="78" dy="29">wildcard expansion: * и ? до запуска command</tspan>
  </text>

  <rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Files и inspection</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">ls · cat · grep · less · pwd</tspan>
    <tspan x="593" dy="29">diff · file · find · locate</tspan>
    <tspan x="593" dy="29">head · tail · sort</tspan>
    <tspan x="593" dy="29">cp · mv · touch · mkdir · rmdir</tspan>
    <tspan x="593" dy="29">destructive delete требует перепроверки</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Variables и docs</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">shell variable → export → environment</tspan>
    <tspan x="1108" dy="29">PATH задаёт порядок поиска commands</tspan>
    <tspan x="1108" dy="29">man · man -k · sectioned man pages</tspan>
    <tspan x="1108" dy="29">info · --help / -h · /usr/share/doc</tspan>
    <tspan x="1108" dy="29">ошибочный временный PATH лечится новой shell</tspan>
  </text>

  <rect x="50" y="410" width="720" height="275" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. stdin / stdout / stderr и ошибки</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">stdin → process → stdout; stderr идёт отдельным потоком.</tspan>
    <tspan x="78" dy="29">pipe передаёт stdout следующему процессу.</tspan>
    <tspan x="78" dy="29">redirect может создать/перезаписать/дописать файл.</tspan>
    <tspan x="78" dy="29">Ошибка: program + file/path + reason.</tspan>
    <tspan x="78" dy="29">Правило главы: сначала исправлять первую ошибку.</tspan>
    <tspan x="78" dy="29">ENOENT · permission denied · no space · segmentation fault и др.</tspan>
  </text>

  <rect x="810" y="410" width="740" height="275" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Processes и job control</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="838" dy="0">ps: PID · TTY · STAT · TIME · COMMAND.</tspan>
    <tspan x="838" dy="29">ps x / ax / u / w и combinations.</tspan>
    <tspan x="838" dy="29">TERM — обычное завершение.</tspan>
    <tspan x="838" dy="29">STOP / CONT — приостановить / продолжить.</tspan>
    <tspan x="838" dy="29">jobs · fg · bg · background process.</tspan>
    <tspan x="838" dy="29">Принудительное завершение — только крайняя мера.</tspan>
  </text>

  <rect x="50" y="715" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="755" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Permissions и links</text>
  <text x="78" y="793" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">mode = type + user/group/other permissions</tspan>
    <tspan x="78" dy="29">r · w · x · -</tspan>
    <tspan x="78" dy="29">chmod: symbolic и absolute modes</tspan>
    <tspan x="78" dy="29">umask: defaults для новых объектов</tspan>
    <tspan x="78" dy="29">symlink: link name → target path</tspan>
    <tspan x="78" dy="29">без -s создаётся hard link</tspan>
  </text>

  <rect x="565" y="715" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="755" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. Archives</text>
  <text x="593" y="793" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">gzip — compression; tar — archive.</tspan>
    <tspan x="593" dy="29">tar c: create · x: extract · t: contents</tspan>
    <tspan x="593" dy="29">v: verbose · f: archive file</tspan>
    <tspan x="593" dy="29">.tar.gz = archive + compression</tspan>
    <tspan x="593" dy="29">Перед extraction — сначала contents/test.</tspan>
    <tspan x="593" dy="29">Если структура сомнительна — extract во временный dir.</tspan>
  </text>

  <rect x="1080" y="715" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="755" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Hierarchy и sudo</text>
  <text x="1108" y="793" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">/etc config · /proc process/kernel data</tspan>
    <tspan x="1108" dy="29">/run runtime · /sys device/system interface</tspan>
    <tspan x="1108" dy="29">/usr programs/data · /var mutable data</tspan>
    <tspan x="1108" dy="29">kernel: /vmlinuz или /boot/vmlinuz</tspan>
    <tspan x="1108" dy="29">modules: /lib/modules</tspan>
    <tspan x="1108" dy="29">sudo + visudo + sudo logs</tspan>
  </text>

  <rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="76" y="1037" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Operational discipline: read-only baseline → минимальное изменение → verification → audit trail.</text>
  <text x="76" y="1064" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0039:c01–p0078:c01 · PDF/printed pages 39–78.</text>
</svg>