<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Устройства: компактная шпаргалка</title>
  <desc id="desc">Компактная карта device nodes, sysfs, udev, device naming и SCSI.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 3 — Устройства</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">/dev · sysfs · devtmpfs · udev · naming · dd · SCSI</text>

  <rect x="45" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="72" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">/dev: device nodes</text>
  <text x="72" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">b — block · c — character</tspan>
    <tspan x="72" dy="30">p — pipe · s — socket</tspan>
    <tspan x="72" dy="30">major/minor связывают node с kernel interface</tspan>
    <tspan x="72" dy="38" font-weight="700">Имя /dev/sdX не равно постоянной identity.</tspan>
  </text>

  <rect x="560" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="588" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">sysfs + udevadm</text>
  <text x="588" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">/sys/devices отражает hardware path</tspan>
    <tspan x="588" dy="30">/sys/block — удобные links к block devices</tspan>
    <tspan x="588" dy="30">udevadm info: path · node · symlinks · attrs</tspan>
    <tspan x="588" dy="38" font-weight="700">Identity подтверждать через sysfs/attributes.</tspan>
  </text>

  <rect x="1075" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1103" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">devtmpfs + udev</text>
  <text x="1103" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">Kernel создаёт base node через devtmpfs</tspan>
    <tspan x="1103" dy="30">uevent → udevd → rules</tspan>
    <tspan x="1103" dy="30">permissions · persistent symlinks · actions</tspan>
    <tspan x="1103" dy="38" font-weight="700">/dev/disk/by-id отделяет identity от order.</tspan>
  </text>

  <rect x="45" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="72" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Discovery toolkit</text>
  <text x="72" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">ls -l · journalctl -k · /proc/devices</tspan>
    <tspan x="72" dy="30">udevadm info / monitor</tspan>
    <tspan x="72" dy="30">lsscsi · nvme list · lsusb</tspan>
    <tspan x="72" dy="30">lsscsi -g → generic SCSI nodes</tspan>
    <tspan x="72" dy="38" font-weight="700">Сначала evidence, затем изменение.</tspan>
  </text>

  <rect x="560" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="588" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Device naming</text>
  <text x="588" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">sd* — SCSI/SATA/USB storage</tspan>
    <tspan x="588" dy="30">nvme* · dm-* / mapper/* · sr*</tspan>
    <tspan x="588" dy="30">tty* / pts/* · ttyUSB* / ttyACM*</tspan>
    <tspan x="588" dy="30">sg* — generic SCSI</tspan>
    <tspan x="588" dy="38" font-weight="700">Короткие names зависят от discovery order.</tspan>
  </text>

  <rect x="1075" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1103" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">dd + SCSI model</text>
  <text x="1103" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">dd: if / of / bs / count / skip</tspan>
    <tspan x="1103" dy="30">Неверный output способен повредить данные</tspan>
    <tspan x="1103" dy="30">SCSI: upper → middle → lower</tspan>
    <tspan x="1103" dy="30">USB bridge · libata for ATA/SATA</tspan>
    <tspan x="1103" dy="38" font-weight="700">Section 3.6 — advanced architecture context.</tspan>
  </text>

  <rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
  <text x="74" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Принцип: /dev name → sysfs path → persistent identity → event/driver → только потом state change.</text>
</svg>