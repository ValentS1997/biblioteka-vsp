<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 3 — Устройства: подробная шпаргалка</title>
  <desc id="desc">Подробная карта device nodes, sysfs, udev, naming, dd и SCSI architecture.</desc>
  <rect width="1600" height="1120" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 3 — Устройства: подробная шпаргалка</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">device nodes · sysfs · devtmpfs · udev rules/events · naming · dd · SCSI layers</text>

  <rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. /dev и device nodes</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">b — block · c — character</tspan>
    <tspan x="78" dy="29">p — named pipe · s — Unix socket</tspan>
    <tspan x="78" dy="29">major/minor идентифицируют kernel interface</tspan>
    <tspan x="78" dy="29">Не все devices обязаны иметь /dev node.</tspan>
    <tspan x="78" dy="29">Network interfaces — пример другого I/O interface.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. sysfs</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">/sys/devices = hardware-oriented hierarchy</tspan>
    <tspan x="593" dy="29">/sys/block = links to block-device paths</tspan>
    <tspan x="593" dy="29">sysfs exposes attributes as files/directories</tspan>
    <tspan x="593" dy="29">udevadm info maps /dev name → sysfs + attrs</tspan>
    <tspan x="593" dy="29">Короткое /dev name скрывает topology.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. devtmpfs и udevd</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Kernel создаёт base device nodes.</tspan>
    <tspan x="1108" dy="29">Kernel отправляет uevent в user space.</tspan>
    <tspan x="1108" dy="29">udevd читает attrs и последовательно rules.</tspan>
    <tspan x="1108" dy="29">Результат: permissions, symlinks, actions.</tspan>
    <tspan x="1108" dy="29">Defaults: /lib/udev · overrides: /etc/udev.</tspan>
  </text>

  <rect x="50" y="410" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Identity и discovery</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">ls -l → type + permissions + major/minor</tspan>
    <tspan x="78" dy="29">udevadm info → P/N/S/E: path, node, links, attributes</tspan>
    <tspan x="78" dy="29">udevadm monitor → KERNEL и UDEV events</tspan>
    <tspan x="78" dy="29">journalctl -k · /proc/devices · lsscsi · nvme list · lsusb</tspan>
    <tspan x="78" dy="29">/dev/disk/by-id отделяет persistent identity от sd-letter.</tspan>
    <tspan x="78" dy="38" font-weight="700">Перед изменением подтвердить один и тот же object несколькими views.</tspan>
  </text>

  <rect x="810" y="410" width="740" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Naming conventions</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="838" dy="0">sd* — SCSI/SATA/USB storage · sr* — optical</tspan>
    <tspan x="838" dy="29">nvme* — NVMe · dm-* / mapper/* — device mapper</tspan>
    <tspan x="838" dy="29">xvd* / vd* — virtual disks · hd* — legacy PATA</tspan>
    <tspan x="838" dy="29">tty* / pts/* — terminals</tspan>
    <tspan x="838" dy="29">ttyS* / ttyUSB* / ttyACM* — serial</tspan>
    <tspan x="838" dy="29">sg* — generic SCSI access</tspan>
  </text>

  <rect x="50" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. dd: high-risk boundary</text>
  <text x="78" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">if / of define source and destination.</tspan>
    <tspan x="78" dy="29">bs / ibs / obs define block sizes.</tspan>
    <tspan x="78" dy="29">count limits amount; skip advances input.</tspan>
    <tspan x="78" dy="29">Source explicitly warns about data damage.</tspan>
    <tspan x="78" dy="29">Учебный output — новый обычный файл.</tspan>
  </text>

  <rect x="565" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. SCSI layers</text>
  <text x="593" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">Upper: device class semantics, например sd.</tspan>
    <tspan x="593" dy="29">Middle: routing + tracking buses/devices.</tspan>
    <tspan x="593" dy="29">Lower: hardware-specific transport.</tspan>
    <tspan x="593" dy="29">USB storage uses bridge into SCSI.</tspan>
    <tspan x="593" dy="29">libata translates ATA/SATA into SCSI model.</tspan>
  </text>

  <rect x="1080" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Multiple access paths</text>
  <text x="1108" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Один hardware object может иметь несколько nodes.</tspan>
    <tspan x="1108" dy="29">Class node обслуживает обычный use case.</tspan>
    <tspan x="1108" dy="29">Generic SCSI /dev/sg* даёт direct protocol access.</tspan>
    <tspan x="1108" dy="29">Complex tasks иногда выносятся из kernel.</tspan>
    <tspan x="1108" dy="29">Section 3.6 — advanced architecture context.</tspan>
  </text>

  <rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="76" y="1037" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Mental model: hardware → kernel subsystem → sysfs/devtmpfs → udev → stable identity → user-space process.</text>
  <text x="76" y="1064" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0079:c01–p0101:c01 · PDF/printed pages 79–101.</text>
</svg>