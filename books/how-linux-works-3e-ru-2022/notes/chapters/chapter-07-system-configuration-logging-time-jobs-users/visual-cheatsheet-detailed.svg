<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Глава 7 — подробная шпаргалка</title>
<desc id="desc">Detailed logging, system time, cron/timers, user databases, IDs and PAM summary.</desc>
<rect width="1600" height="1120" fill="#f7f8fa"/>
<rect width="1600" height="112" fill="#17202a"/>
<text x="60" y="49" font-family="system-ui,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Глава 7 — журналирование, время, задачи и пользователи</text>
<text x="60" y="85" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#d6e4f0">journald/syslog · /etc · user DB · getty/login · UTC/NTP · cron/timers/at · UID/EUID/RUID · PAM</text>

<rect x="50" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="78" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. System logging</text>
<text x="78" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">journalctl filters time/unit/text/boot/priority.</tspan><tspan x="78" dy="29">Journald and syslog may coexist.</tspan><tspan x="78" dy="29">Traditional files live under /var/log.</tspan><tspan x="78" dy="29">logrotate manages old file generations.</tspan><tspan x="78" dy="29">journald manages its own retention.</tspan></text>

<rect x="565" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="593" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. User database</text>
<text x="593" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593">passwd → name/UID/GID/home/shell</tspan><tspan x="593" dy="29">shadow → password/auth data</tspan><tspan x="593" dy="29">group → GID + member list</tspan><tspan x="593" dy="29">root = UID 0</tspan><tspan x="593" dy="29">vipw provides locking/backup for direct repair.</tspan></text>

<rect x="1080" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1108" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Login + time</text>
<text x="1108" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108">getty → login → exec(shell)</tspan><tspan x="1108" dy="29">system clock differs from RTC.</tspan><tspan x="1108" dy="29">Keep RTC in UTC.</tspan><tspan x="1108" dy="29">timezone: /etc/localtime + zoneinfo</tspan><tspan x="1108" dy="29">network time corrects drift.</tspan></text>

<rect x="50" y="410" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="78" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Scheduled jobs</text>
<text x="78" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">cron: minute hour DOM month DOW command</tspan><tspan x="78" dy="29">system /etc/crontab adds execution user field.</tspan><tspan x="78" dy="29">systemd timer unit activates service unit.</tspan><tspan x="78" dy="29">Timers add cgroups, journal, dependencies, richer timing.</tspan><tspan x="78" dy="29">at handles one-shot tasks.</tspan><tspan x="78" dy="29">systemd-run creates transient timers.</tspan></text>

<rect x="810" y="410" width="740" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="838" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. User timers + identity</text>
<text x="838" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="838">User timer manager normally follows login session.</tspan><tspan x="838" dy="29">linger keeps user manager after logout.</tspan><tspan x="838" dy="29">RUID identifies original user.</tspan><tspan x="838" dy="29">EUID determines effective file permissions.</tspan><tspan x="838" dy="29">Saved UID enables controlled privilege switching.</tspan><tspan x="838" dy="29">setuid-root executables expand attack surface.</tspan></text>

<rect x="50" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="78" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Access layers</text>
<text x="78" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">Identification: determine identity.</tspan><tspan x="78" dy="29">Authentication: prove identity.</tspan><tspan x="78" dy="29">Authorization: decide permission.</tspan><tspan x="78" dy="29">Applications should use libraries/APIs, not assume passwd only.</tspan></text>

<rect x="565" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="593" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. PAM functions</text>
<text x="593" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593">auth · account · session · password</tspan><tspan x="593" dy="29">Application asks PAM for a high-level function.</tspan><tspan x="593" dy="29">PAM executes configured module actions.</tspan><tspan x="593" dy="29">pam_unix can verify and set passwords.</tspan><tspan x="593" dy="29">/etc/pam.d/other is fallback policy.</tspan></text>

<rect x="1080" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="1108" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. PAM control flow</text>
<text x="1108" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108">sufficient: success may terminate evaluation.</tspan><tspan x="1108" dy="29">requisite: failure terminates immediately.</tspan><tspan x="1108" dy="29">required: failure remembered; continue rules.</tspan><tspan x="1108" dy="29">Generated PAM files should not be edited blindly.</tspan><tspan x="1108" dy="29">Recovery access is mandatory before risky edits.</tspan></text>

<rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
<text x="76" y="1037" font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Operational model: observe logs/state → identify execution identity → change supported config → verify scheduler/auth result.</text>
<text x="76" y="1064" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0208:c01–p0243:c01 · PDF/printed pages 208–243.</text>
</svg>