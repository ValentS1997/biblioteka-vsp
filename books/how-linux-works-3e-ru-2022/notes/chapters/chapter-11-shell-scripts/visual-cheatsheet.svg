<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 11 — Сценарии оболочки</title>
<desc id="desc">Shell scripts: quoting, arguments, return codes, control flow, temporary files and composable utilities.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 11 — Сценарии оболочки</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">shebang · quoting · args · return codes · flow · temp files · Unix tools</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Execution</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">#!/bin/sh selects interpreter</tspan>
<tspan x="72" dy="31">script needs read + execute permission</tspan>
<tspan x="72" dy="31">shell expands before command runs</tspan>
<tspan x="72" dy="39" font-weight="700">Keep shell scripts short.</tspan>
</text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Quoting + arguments</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">'single' = literal shell text</tspan>
<tspan x="588" dy="31">"double" = grouped + variable expansion</tspan>
<tspan x="588" dy="31">$1 · $# · $@ · $0 · $$ · $?</tspan>
<tspan x="588" dy="39">Quote possibly empty parameters.</tspan>
</text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Control flow</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">if uses command return code</tspan>
<tspan x="1103" dy="31">test/[ checks files, strings, numbers</tspan>
<tspan x="1103" dy="31">case · for · while · && · || · !</tspan>
<tspan x="1103" dy="39">Nonzero does not always mean error.</tspan>
</text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Temporary files</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">mktemp → unique file</tspan>
<tspan x="72" dy="31">trap → cleanup on INT</tspan>
<tspan x="72" dy="31">rm -f → destructive cleanup</tspan>
<tspan x="72" dy="39">Plan abnormal termination.</tspan>
</text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Composable tools</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">basename · awk · sed</tspan>
<tspan x="588" dy="31">find -print0 | xargs -0</tspan>
<tspan x="588" dy="31">expr · exec</tspan>
<tspan x="588" dy="39">Use safe filename delimiters.</tspan>
</text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Isolation boundary</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">(commands) = subshell isolation</tspan>
<tspan x="1103" dy="31">. file = source into current shell</tspan>
<tspan x="1103" dy="31">exec replaces current process</tspan>
<tspan x="1103" dy="39">Know which changes persist.</tspan>
</text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Rule: shell is glue for commands/files; when parsing and control logic grow complex, switch languages.</text>
</svg>