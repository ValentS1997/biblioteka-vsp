<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Глава 11 — подробная шпаргалка</title>
<desc id="desc">Detailed shell scripting summary: interpreter, quoting, special variables, return codes, tests, loops, temp files and helper utilities.</desc>
<rect width="1600" height="1120" fill="#f7f8fa"/>
<rect width="1600" height="112" fill="#17202a"/>
<text x="60" y="49" font-family="system-ui,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Глава 11 — Сценарии оболочки</text>
<text x="60" y="85" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#d6e4f0">shebang · quoting · positional args · return codes · test/case/loops · temp files · sed/awk/xargs · subshell/source</text>

<rect x="50" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="78" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Script execution</text>
<text x="78" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="78">#!/bin/sh selects shell interpreter.</tspan>
<tspan x="78" dy="29">File needs readable + executable permissions.</tspan>
<tspan x="78" dy="29">./script runs from current directory.</tspan>
<tspan x="78" dy="29">env-based shebang searches PATH.</tspan>
<tspan x="78" dy="29">Source warns PATH may select unintended interpreter.</tspan>
</text>

<rect x="565" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="593" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Quoting</text>
<text x="593" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="593">Single quotes preserve shell-special text.</tspan>
<tspan x="593" dy="29">Double quotes preserve grouping but expand variables.</tspan>
<tspan x="593" dy="29">Backslash escapes individual characters.</tspan>
<tspan x="593" dy="29">Quoting happens before utility receives arguments.</tspan>
<tspan x="593" dy="29">Empty positional params should be quoted in tests.</tspan>
</text>

<rect x="1080" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1108" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Script state</text>
<text x="1108" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1108">$1.. = args · $# = count · $@ = all</tspan>
<tspan x="1108" dy="29">$0 = script · $$ = PID · $? = return code</tspan>
<tspan x="1108" dy="29">shift advances positional arguments.</tspan>
<tspan x="1108" dy="29">Read $? immediately: next command overwrites it.</tspan>
<tspan x="1108" dy="29">Command-specific nonzero status may be normal.</tspan>
</text>

<rect x="50" y="410" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="78" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Conditions + loops</text>
<text x="78" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="78">if executes a command and branches on return code.</tspan>
<tspan x="78" dy="29">test/[ handles file, string and numeric checks.</tspan>
<tspan x="78" dy="29">String '=' differs from numeric '-eq'.</tspan>
<tspan x="78" dy="29">case handles pattern dispatch; branches end with ;;.</tspan>
<tspan x="78" dy="29">for iterates values; while repeats while status is zero.</tspan>
<tspan x="78" dy="29">Complex loop-heavy logic is a signal to change language.</tspan>
</text>

<rect x="810" y="410" width="740" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="838" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Expansion + temporary files</text>
<text x="838" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="838">$(command) captures stdout; POSIX form preferred.</tspan>
<tspan x="838" dy="29">Do not replace normal globbing with $(ls).</tspan>
<tspan x="838" dy="29">mktemp creates unique temp files.</tspan>
<tspan x="838" dy="29">trap handles INT for cleanup.</tspan>
<tspan x="838" dy="29">Use exit in signal handler to stop the script.</tspan>
<tspan x="838" dy="29">Here-doc sends multi-line text to command stdin.</tspan>
</text>

<rect x="50" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="78" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Unix helpers</text>
<text x="78" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="78">basename strips path/suffix.</tspan>
<tspan x="78" dy="29">awk selects/processes fields.</tspan>
<tspan x="78" dy="29">sed transforms streams to stdout.</tspan>
<tspan x="78" dy="29">find -print0 | xargs -0 handles odd filenames.</tspan>
<tspan x="78" dy="29">find -exec is an alternative.</tspan>
</text>

<rect x="565" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="593" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. Process/environment boundaries</text>
<text x="593" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="593">exec replaces current shell process irreversibly.</tspan>
<tspan x="593" dy="29">(commands) runs in a subshell.</tspan>
<tspan x="593" dy="29">Subshell environment changes disappear on exit.</tspan>
<tspan x="593" dy="29">. file sources code into current shell.</tspan>
<tspan x="593" dy="29">Sourced variables/definitions persist.</tspan>
</text>

<rect x="1080" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="1108" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Tool-choice boundary</text>
<text x="1108" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1108">Shell excels at commands and simple files.</tspan>
<tspan x="1108" dy="29">Keep scripts short.</tspan>
<tspan x="1108" dy="29">Complex strings/arithmetic/control flow → move on.</tspan>
<tspan x="1108" dy="29">Source names Python, Perl and awk.</tspan>
<tspan x="1108" dy="29">Interactive read-heavy programs are another warning sign.</tspan>
</text>

<rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
<text x="76" y="1037" font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Operational model: parse/quote correctly → use return codes → keep side effects bounded → clean temp state → change language before shell complexity explodes.</text>
<text x="76" y="1064" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0344:c01–p0367:c01 · PDF/printed pages 344–367.</text>
</svg>