<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Загрузка ядра Linux: подробная шпаргалка</title>
  <desc id="desc">Detailed boot flow, kernel command line, GRUB, firmware models and secure boot.</desc>
  <rect width="1600" height="1120" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="#17202a"/>
  <text x="60" y="49" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#ffffff">Глава 5 — Загрузка ядра Linux</text>
  <text x="60" y="85" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">Boot messages · kernel cmdline · bootloaders · GRUB · MBR/UEFI · Secure Boot · chainloading</text>

  <rect x="50" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="78" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Boot sequence</text>
  <text x="78" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">Firmware → bootloader → kernel image.</tspan>
    <tspan x="78" dy="29">Kernel: CPU → RAM → bus → devices.</tspan>
    <tspan x="78" dy="29">Then subsystems → root filesystem.</tspan>
    <tspan x="78" dy="29">Kernel starts init as PID 1.</tspan>
    <tspan x="78" dy="29">Chapter 6 continues user-space startup.</tspan>
  </text>

  <rect x="565" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="593" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. Diagnostics</text>
  <text x="593" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">journalctl -k = current kernel boot log.</tspan>
    <tspan x="593" dy="29">-b selects boot sessions.</tspan>
    <tspan x="593" dy="29">dmesg / kern.log are alternative sources.</tspan>
    <tspan x="593" dy="29">Find the last successfully reached stage.</tspan>
    <tspan x="593" dy="29">Early device/root failures are kernel-side.</tspan>
  </text>

  <rect x="1080" y="145" width="470" height="235" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1108" y="185" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Kernel command line</text>
  <text x="1108" y="223" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">/proc/cmdline = actual passed parameters.</tspan>
    <tspan x="1108" dy="29">Flags + key=value pairs.</tspan>
    <tspan x="1108" dy="29">root= identifies root filesystem.</tspan>
    <tspan x="1108" dy="29">ro starts root filesystem read-only.</tspan>
    <tspan x="1108" dy="29">Unknown parameters can be passed to init.</tspan>
  </text>

  <rect x="50" y="410" width="720" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="78" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. GRUB runtime</text>
  <text x="78" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">GRUB has its own devices, modules and commands.</tspan>
    <tspan x="78" dy="29">GRUB root = filesystem containing kernel/initrd.</tspan>
    <tspan x="78" dy="29">Linux root= = filesystem kernel mounts as /.</tspan>
    <tspan x="78" dy="29">ls / ls -l / echo $root / set inspect environment.</tspan>
    <tspan x="78" dy="29">prefix points to GRUB config/support directory.</tspan>
    <tspan x="78" dy="29">Temporary menu edits can repair one boot without persistence.</tspan>
  </text>

  <rect x="810" y="410" width="740" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="838" y="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. GRUB configuration</text>
  <text x="838" y="488" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="838" dy="0">grub.cfg is generated — do not edit directly.</tspan>
    <tspan x="838" dy="29">grub-mkconfig executes scripts in /etc/grub.d.</tspan>
    <tspan x="838" dy="29">Without -o it writes configuration to stdout.</tspan>
    <tspan x="838" dy="29">With -o it writes persistent grub.cfg.</tspan>
    <tspan x="838" dy="29">Back up previous config and verify target directory.</tspan>
    <tspan x="838" dy="29">menuentry → search/root → linux → initrd.</tspan>
  </text>

  <rect x="50" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="78" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. BIOS / MBR</text>
  <text x="78" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="78" dy="0">BIOS loads tiny boot code from MBR.</tspan>
    <tspan x="78" dy="29">Too small for full loader → multi-stage design.</tspan>
    <tspan x="78" dy="29">GPT + BIOS uses special BIOS boot partition.</tspan>
    <tspan x="78" dy="29">Loader eventually reaches grub.cfg and kernel.</tspan>
    <tspan x="78" dy="29">Install mistakes can make the machine unbootable.</tspan>
  </text>

  <rect x="565" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="593" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. UEFI / ESP</text>
  <text x="593" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="593" dy="0">ESP = VFAT filesystem with EFI directory.</tspan>
    <tspan x="593" dy="29">Linux commonly mounts ESP at /boot/efi.</tspan>
    <tspan x="593" dy="29">Loaders are .efi files under vendor dirs.</tspan>
    <tspan x="593" dy="29">Firmware can directly load EFI executables.</tspan>
    <tspan x="593" dy="29">ESP != BIOS boot partition.</tspan>
  </text>

  <rect x="1080" y="720" width="470" height="250" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="1108" y="760" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Secure Boot / chainload</text>
  <text x="1108" y="798" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1108" dy="0">Secure Boot verifies loader signatures.</tspan>
    <tspan x="1108" dy="29">Distros often use signed GRUB/shim chain.</tspan>
    <tspan x="1108" dy="29">Some require signed kernel chain too.</tspan>
    <tspan x="1108" dy="29">GRUB can chainload another bootloader.</tspan>
    <tspan x="1108" dy="29">Useful for multi-OS/legacy boot layouts.</tspan>
  </text>

  <rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
  <text x="76" y="1037" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Operational rule: firmware → loader → kernel → root FS → PID 1. Identify the failing boundary before changing boot state.</text>
  <text x="76" y="1064" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0156:c01–p0175:c01 · PDF/printed pages 156–175.</text>
</svg>