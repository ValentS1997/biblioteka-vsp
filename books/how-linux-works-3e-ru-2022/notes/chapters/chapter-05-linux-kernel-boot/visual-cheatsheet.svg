<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Глава 5 — Загрузка ядра Linux</title>
  <desc id="desc">Boot flow, kernel parameters, GRUB, BIOS/MBR, UEFI and Secure Boot.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="108" fill="#17202a"/>
  <text x="56" y="48" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Глава 5 — Загрузка ядра Linux</text>
  <text x="56" y="82" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6e4f0">firmware → bootloader → kernel → root filesystem → init/PID 1</text>

  <rect x="45" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#5dade2" stroke-width="2"/>
  <text x="72" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Boot chain</text>
  <text x="72" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">Firmware запускает bootloader.</tspan>
    <tspan x="72" dy="30">Bootloader загружает kernel + parameters.</tspan>
    <tspan x="72" dy="30">Kernel: CPU → memory → bus → devices.</tspan>
    <tspan x="72" dy="30">Root FS → init/PID 1 → user space.</tspan>
  </text>

  <rect x="560" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#7dcea0" stroke-width="2"/>
  <text x="588" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Evidence</text>
  <text x="588" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">journalctl -k · dmesg</tspan>
    <tspan x="588" dy="30">/proc/cmdline</tspan>
    <tspan x="588" dy="30">root= points to root filesystem</tspan>
    <tspan x="588" dy="30">ro = initial read-only root mount</tspan>
  </text>

  <rect x="1075" y="140" width="480" height="265" rx="18" fill="#ffffff" stroke="#f5b041" stroke-width="2"/>
  <text x="1103" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">GRUB root != Linux root</text>
  <text x="1103" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">GRUB root: где искать kernel/initrd.</tspan>
    <tspan x="1103" dy="30">Linux root=: что mount-ит kernel.</tspan>
    <tspan x="1103" dy="30">prefix: config/support directory GRUB.</tspan>
    <tspan x="1103" dy="30">UUID помогает не зависеть от device order.</tspan>
  </text>

  <rect x="45" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#af7ac5" stroke-width="2"/>
  <text x="72" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">GRUB workflow</text>
  <text x="72" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="72" dy="0">Menu → edit entry → command line</tspan>
    <tspan x="72" dy="30">ls / ls -l / set / echo $root</tspan>
    <tspan x="72" dy="30">Не править generated grub.cfg напрямую.</tspan>
    <tspan x="72" dy="30">grub-mkconfig генерирует configuration.</tspan>
  </text>

  <rect x="560" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#85c1e9" stroke-width="2"/>
  <text x="588" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">BIOS / UEFI</text>
  <text x="588" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="588" dy="0">BIOS/MBR: tiny first-stage boot code.</tspan>
    <tspan x="588" dy="30">UEFI: EFI System Partition (VFAT).</tspan>
    <tspan x="588" dy="30">EFI loaders are normal .efi files.</tspan>
    <tspan x="588" dy="30">ESP и BIOS boot partition — не одно и то же.</tspan>
  </text>

  <rect x="1075" y="445" width="480" height="280" rx="18" fill="#ffffff" stroke="#ec7063" stroke-width="2"/>
  <text x="1103" y="486" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Safety boundary</text>
  <text x="1103" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" fill="#273746">
    <tspan x="1103" dy="0">grub-install может сломать boot sequence.</tspan>
    <tspan x="1103" dy="30">Перед install: boot mode + target + backup.</tspan>
    <tspan x="1103" dy="30">Нужен emergency boot plan.</tspan>
    <tspan x="1103" dy="30">Secure Boot — часть security chain.</tspan>
  </text>

  <rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
  <text x="74" y="819" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Troubleshooting: найти последний успешно достигнутый layer и менять только следующий узкий участок.</text>
</svg>