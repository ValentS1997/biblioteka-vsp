<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Глава 13 — подробная шпаргалка</title>
<desc id="desc">Detailed user environment summary: startup policy, PATH security, Bash and tcsh startup order, defaults, rollout and anti-patterns.</desc>
<rect width="1600" height="1120" fill="#f7f8fa"/>
<rect width="1600" height="112" fill="#17202a"/>
<text x="60" y="49" font-family="system-ui,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Глава 13 — Пользовательское окружение</text>
<text x="60" y="85" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#d6e4f0">startup design · PATH security · prompt · aliases · umask · Bash/tcsh startup order · rollout testing</text>

<rect x="50" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="78" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b4f72">1. Startup policy</text>
<text x="78" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">Keep files few, short and commented.</tspan><tspan x="78" dy="29">Edit only for a concrete reason.</tspan><tspan x="78" dy="29">Defaults may interact with /etc configuration.</tspan><tspan x="78" dy="29">Personal dotfiles are poor universal templates.</tspan><tspan x="78" dy="29">Errors multiply when defaults are distributed.</tspan></text>

<rect x="565" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="593" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">2. PATH security</text>
<text x="593" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593">/usr/local/bin → /usr/bin → /bin.</tspan><tspan x="593" dy="29">$HOME/bin may override system binaries.</tspan><tspan x="593" dy="29">sbin paths only when needed.</tspan><tspan x="593" dy="29">Do not grow PATH for every package directory.</tspan><tspan x="593" dy="29">Never add current directory ".".</tspan></text>

<rect x="1080" y="145" width="470" height="235" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1108" y="185" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">3. Shell defaults</text>
<text x="1108" y="223" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108">Minimal prompt; avoid shell-special characters.</tspan><tspan x="1108" dy="29">EDITOR/VISUAL = vi example.</tspan><tspan x="1108" dy="29">PAGER=less; LESS=meiX example.</tspan><tspan x="1108" dy="29">Export values inherited by child processes.</tspan><tspan x="1108" dy="29">MANPATH normally left to system defaults.</tspan></text>

<rect x="50" y="410" width="720" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="78" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c3483">4. Bash startup order</text>
<text x="78" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">Login: /etc/profile, then first of .bash_profile/.bash_login/.profile.</tspan><tspan x="78" dy="29">Interactive non-login: /etc/bash.bashrc, then ~/.bashrc.</tspan><tspan x="78" dy="29">Common environment can live in .bashrc.</tspan><tspan x="78" dy="29">.bash_profile may source: . $HOME/.bashrc</tspan><tspan x="78" dy="29">$- containing i distinguishes interactive context.</tspan><tspan x="78" dy="29">echo $0 is source's login-shell marker check.</tspan></text>

<rect x="810" y="410" width="740" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="838" y="450" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#21618c">5. Aliases + umask + tcsh</text>
<text x="838" y="488" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="838">Aliases hide origin and can change standard semantics.</tspan><tspan x="838" dy="29">Source prefers functions/scripts for meaningful behavior.</tspan><tspan x="838" dy="29">umask 077 = strict privacy; 022 = readable-by-others.</tspan><tspan x="838" dy="29">tcsh searches .tcshrc then .cshrc.</tspan><tspan x="838" dy="29">Source prefers .cshrc for portability.</tspan><tspan x="838" dy="29">Choose defaults for actual user/workload needs.</tspan></text>

<rect x="50" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="78" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#922b21">6. Rollout testing</text>
<text x="78" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="78">Create a clean test user.</tspan><tspan x="78" dy="29">Write startup files from scratch.</tspan><tspan x="78" dy="29">Test console, remote and graphical paths.</tspan><tspan x="78" dy="29">Create second user from proposed defaults.</tspan><tspan x="78" dy="29">Distribute only after behavior stays consistent.</tspan></text>

<rect x="565" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="593" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#9c640c">7. Default choices</text>
<text x="593" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="593">Source prefers Bash for new users.</tspan><tspan x="593" dy="29">vi/emacs are traditional editor defaults.</tspan><tspan x="593" dy="29">Many distributions use nano for beginners.</tspan><tspan x="593" dy="29">less is recommended pager default.</tspan><tspan x="593" dy="29">Avoid heavy editor startup customization.</tspan></text>

<rect x="1080" y="720" width="470" height="250" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="1108" y="760" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#196f3d">8. Anti-patterns</text>
<text x="1108" y="798" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1108">No graphical commands in shell startup files.</tspan><tspan x="1108" dy="29">Do not set DISPLAY.</tspan><tspan x="1108" dy="29">Do not hard-code terminal type.</tspan><tspan x="1108" dy="29">Do not print to stdout.</tspan><tspan x="1108" dy="29">Never set LD_LIBRARY_PATH there.</tspan></text>

<rect x="50" y="1005" width="1500" height="72" rx="14" fill="#17202a"/>
<text x="76" y="1037" font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Operational model: minimal startup files → deterministic PATH/exported defaults → explicit login/non-login behavior → clean-user acceptance test.</text>
<text x="76" y="1064" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#d6e4f0">Provenance: RAG p0390:c01–p0401:c01 · PDF/printed pages 390–401.</text>
</svg>