<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 13 — Пользовательское окружение</title>
<desc id="desc">Startup files, PATH, prompt, umask, Bash login and non-login behavior and safe defaults.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 13 — Пользовательское окружение</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">startup files · PATH · prompt · umask · Bash/tcsh · safe defaults</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Design rule</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="72">few files · short files · clear comments</tspan><tspan x="72" dy="31">change only for a concrete reason</tspan><tspan x="72" dy="31">test before distributing defaults</tspan><tspan x="72" dy="39" font-weight="700">Every startup line is another failure point.</tspan></text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">PATH</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="588">/usr/local/bin → /usr/bin → /bin</tspan><tspan x="588" dy="31">$HOME/bin may precede system paths</tspan><tspan x="588" dy="31">add sbin only when needed</tspan><tspan x="588" dy="39">Do not add "." to PATH.</tspan></text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Defaults</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1103">PS1 + EDITOR/VISUAL + PAGER</tspan><tspan x="1103" dy="31">export child-visible variables</tspan><tspan x="1103" dy="31">umask 077 or 022 by use case</tspan><tspan x="1103" dy="39">Keep prompt minimal.</tspan></text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Bash startup</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="72">login: /etc/profile → first user profile</tspan><tspan x="72" dy="31">non-login: bash.bashrc → .bashrc</tspan><tspan x="72" dy="31">.bash_profile can source .bashrc</tspan><tspan x="72" dy="39">Know which file actually runs.</tspan></text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Rollout</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="588">clean test user</tspan><tspan x="588" dy="31">console + remote + graphical sessions</tspan><tspan x="588" dy="31">second user from proposed defaults</tspan><tspan x="588" dy="39">Accept only after repeated behavior matches.</tspan></text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Do not put here</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746"><tspan x="1103">graphical commands</tspan><tspan x="1103" dy="31">DISPLAY · terminal type</tspan><tspan x="1103" dy="31">stdout-producing commands</tspan><tspan x="1103" dy="39">LD_LIBRARY_PATH</tspan></text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Operational rule: minimal startup state → deterministic PATH → explicit exports → test every session path before rollout.</text>
</svg>