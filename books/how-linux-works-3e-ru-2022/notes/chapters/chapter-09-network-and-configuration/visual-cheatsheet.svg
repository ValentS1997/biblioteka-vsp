<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Глава 9 — Сеть и ее конфигурация</title>
<desc id="desc">Network layers, addressing, routing, DNS, TCP/UDP, DHCP, firewall, neighbor discovery and Wi-Fi.</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect width="1600" height="108" fill="#17202a"/>
<text x="56" y="48" font-family="system-ui,Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Глава 9 — Сеть и ее конфигурация</text>
<text x="56" y="82" font-family="system-ui,Arial,sans-serif" font-size="20" fill="#d6e4f0">link → IP/routing → DNS → TCP/UDP → application</text>

<rect x="45" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#5dade2" stroke-width="2"/>
<text x="72" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b4f72">Addressing + routes</text>
<text x="72" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">IPv4 / IPv6 + CIDR prefix</tspan>
<tspan x="72" dy="31">ip address show · ip route show</tspan>
<tspan x="72" dy="31">specific route beats default route</tspan>
<tspan x="72" dy="39" font-weight="700">Gateway must be locally reachable.</tspan>
</text>

<rect x="560" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#7dcea0" stroke-width="2"/>
<text x="588" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#196f3d">Name + transport</text>
<text x="588" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">nsswitch → hosts → resolver/DNS</tspan>
<tspan x="588" dy="31">TCP = connection + ports</tspan>
<tspan x="588" dy="31">UDP = datagrams + ports</tspan>
<tspan x="588" dy="39">netstat distinguishes listeners/connections.</tspan>
</text>

<rect x="1075" y="140" width="480" height="265" rx="18" fill="#fff" stroke="#f5b041" stroke-width="2"/>
<text x="1103" y="181" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#9c640c">Automation</text>
<text x="1103" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">DHCP → dynamic IPv4 config</tspan>
<tspan x="1103" dy="31">IPv6 RA → stateless config</tspan>
<tspan x="1103" dy="31">NetworkManager orchestrates layers</tspan>
<tspan x="1103" dy="39">nmcli · nm-online · resolvectl</tspan>
</text>

<rect x="45" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#af7ac5" stroke-width="2"/>
<text x="72" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6c3483">Router + NAT</text>
<text x="72" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="72">IP forwarding enables routing</tspan>
<tspan x="72" dy="31">private IPv4 → NAT / MASQUERADE</tspan>
<tspan x="72" dy="31">packet path crosses FORWARD policy</tspan>
<tspan x="72" dy="39">Capture baseline before changes.</tspan>
</text>

<rect x="560" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#ec7063" stroke-width="2"/>
<text x="588" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#922b21">Firewall</text>
<text x="588" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="588">iptables chains = top-to-bottom</tspan>
<tspan x="588" dy="31">first matching rule wins</tspan>
<tspan x="588" dy="31">allow required traffic, drop rest</tspan>
<tspan x="588" dy="39" font-weight="700">Remote-only lockout is a real risk.</tspan>
</text>

<rect x="1075" y="445" width="480" height="280" rx="18" fill="#fff" stroke="#85c1e9" stroke-width="2"/>
<text x="1103" y="486" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#21618c">Local link + Wi-Fi</text>
<text x="1103" y="527" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#273746">
<tspan x="1103">ARP: IPv4 → MAC</tspan>
<tspan x="1103" dy="31">NDP: IPv6 neighbors</tspan>
<tspan x="1103" dy="31">iw scan/link/connect</tspan>
<tspan x="1103" dy="39">WPA2/WPA3 via wpa_supplicant layer.</tspan>
</text>

<rect x="45" y="775" width="1510" height="72" rx="14" fill="#17202a"/>
<text x="74" y="819" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Troubleshooting: interface → address → route → neighbor → DNS → transport → application.</text>
</svg>