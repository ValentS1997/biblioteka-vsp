<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980"><rect width="1500" height="980" fill="white"/><text x="50" y="60" font-family="sans-serif" font-size="34" font-weight="700">Appendix B — kubeadm build flow</text><rect x="50" y="110" width="680" height="330" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="155" font-family="sans-serif" font-size="25" font-weight="700">Node preparation</text><text x="80" y="205" font-family="sans-serif" font-size="19">Bridged networking · unique MAC · unique hostname</text><text x="80" y="245" font-family="sans-serif" font-size="19">Docker · kubelet · kubeadm · kubectl · CNI package</text><text x="80" y="285" font-family="sans-serif" font-size="19">bridge-nf-call-iptables=1 · swap off</text><text x="80" y="340" font-family="sans-serif" font-size="17">Source also disables SELinux/firewalld — high-risk historical step.</text><rect x="770" y="110" width="680" height="330" rx="18" fill="#f4f4f4" stroke="#222"/><text x="800" y="155" font-family="sans-serif" font-size="25" font-weight="700">Cluster bootstrap</text><text x="800" y="210" font-family="monospace" font-size="20">master: kubeadm init</text><text x="800" y="250" font-family="monospace" font-size="20">workers: kubeadm join ...</text><text x="800" y="290" font-family="monospace" font-size="20">kubectl get nodes → NotReady</text><text x="800" y="330" font-family="monospace" font-size="20">describe → CNI not initialized</text><text x="800" y="370" font-family="monospace" font-size="20">deploy CNI → Ready</text><rect x="50" y="500" width="1400" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="545" font-family="sans-serif" font-size="25" font-weight="700">Control-plane mechanics</text><text x="80" y="600" font-family="monospace" font-size="20">/etc/kubernetes/manifests → kubelet → static control-plane Pods</text><text x="80" y="650" font-family="monospace" font-size="20">admin.conf → KUBECONFIG → kubectl</text><text x="80" y="700" font-family="monospace" font-size="20">scp admin.conf → local kubectl access</text><text x="80" y="755" font-family="sans-serif" font-size="17">admin.conf is sensitive credential material.</text><text x="50" y="880" font-family="sans-serif" font-size="18">RAG p0646:c01–p0659:c01 · source-era commands only</text></svg>