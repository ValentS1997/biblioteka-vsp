<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950"><rect width="1500" height="950" fill="white"/><text x="50" y="60" font-family="sans-serif" font-size="34" font-weight="700">Appendix D — Federation architecture</text><rect x="50" y="110" width="650" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="155" font-family="sans-serif" font-size="25" font-weight="700">Federation control plane</text><text x="80" y="210" font-family="monospace" font-size="20">etcd</text><text x="80" y="250" font-family="monospace" font-size="20">federated API server</text><text x="80" y="290" font-family="monospace" font-size="20">federated controller manager</text><text x="80" y="345" font-family="sans-serif" font-size="18">Manages clusters instead of individual nodes.</text><rect x="800" y="110" width="650" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="830" y="155" font-family="sans-serif" font-size="25" font-weight="700">Resource projection</text><text x="830" y="210" font-family="monospace" font-size="19">Federated Namespace → each cluster</text><text x="830" y="250" font-family="monospace" font-size="19">Deployment replicas=5 → 3 + 2</text><text x="830" y="290" font-family="monospace" font-size="19">Federated Ingress → global entry point</text><text x="830" y="345" font-family="sans-serif" font-size="18">One-way synchronization only.</text><rect x="50" y="470" width="1400" height="270" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="515" font-family="sans-serif" font-size="25" font-weight="700">Failure-domain idea</text><text x="80" y="575" font-family="sans-serif" font-size="20">Separate Kubernetes clusters per location reduce dependency on one datacenter.</text><text x="80" y="625" font-family="sans-serif" font-size="20">Federation provides one higher-level management interface across them.</text><text x="80" y="680" font-family="sans-serif" font-size="18">Source does not provide setup commands; no commands were invented.</text><text x="50" y="850" font-family="sans-serif" font-size="18">RAG p0665:c01–p0669:c01</text></svg>