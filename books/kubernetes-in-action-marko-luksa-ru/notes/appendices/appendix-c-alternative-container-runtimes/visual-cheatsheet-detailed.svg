<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950"><rect width="1500" height="950" fill="white"/><text x="50" y="60" font-family="sans-serif" font-size="34" font-weight="700">Appendix C — runtime abstraction</text><rect x="50" y="110" width="650" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="155" font-family="sans-serif" font-size="25" font-weight="700">rkt experiment</text><text x="80" y="210" font-family="monospace" font-size="19">minikube start --container-runtime=rkt</text><text x="80" y="250" font-family="monospace" font-size="19">             --network-plugin=cni</text><text x="80" y="300" font-family="monospace" font-size="19">kubectl run → describe pods</text><text x="80" y="345" font-family="monospace" font-size="19">minikube ssh → rkt list</text><rect x="800" y="110" width="650" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="830" y="155" font-family="sans-serif" font-size="25" font-weight="700">CRI boundary</text><text x="830" y="215" font-family="monospace" font-size="20">Kubelet → CRI → runtime</text><text x="830" y="265" font-family="sans-serif" font-size="18">Docker / rkt / CRI-O</text><text x="830" y="310" font-family="sans-serif" font-size="18">Frakti / Virtlet examples</text><rect x="50" y="470" width="1400" height="270" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="515" font-family="sans-serif" font-size="25" font-weight="700">Core lesson</text><text x="80" y="575" font-family="sans-serif" font-size="20">Kubernetes scheduling/control logic can be decoupled from one specific runtime implementation.</text><text x="80" y="630" font-family="sans-serif" font-size="18">rkt-specific IDs in kubectl output expose the selected runtime.</text><text x="80" y="685" font-family="sans-serif" font-size="18">All named implementations reflect the source era; current status is [Needs confirmation].</text><text x="50" y="850" font-family="sans-serif" font-size="18">RAG p0660:c01–p0664:c01</text></svg>