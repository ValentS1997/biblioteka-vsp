<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950"><rect width="1500" height="950" fill="white"/><text x="50" y="60" font-family="sans-serif" font-size="34" font-weight="700">Appendix A — kubectl multi-cluster model</text><rect x="50" y="110" width="650" height="310" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="155" font-family="sans-serif" font-size="26" font-weight="700">kubeconfig structure</text><text x="80" y="205" font-family="monospace" font-size="21">clusters → API endpoint + CA</text><text x="80" y="250" font-family="monospace" font-size="21">users → credentials</text><text x="80" y="295" font-family="monospace" font-size="21">contexts → cluster + user + namespace</text><text x="80" y="340" font-family="monospace" font-size="21">current-context → active target</text><rect x="800" y="110" width="650" height="310" rx="18" fill="#f4f4f4" stroke="#222"/><text x="830" y="155" font-family="sans-serif" font-size="26" font-weight="700">Safe switching flow</text><text x="830" y="215" font-family="monospace" font-size="20">current-context</text><text x="830" y="255" font-family="monospace" font-size="20">   ↓ get-contexts</text><text x="830" y="295" font-family="monospace" font-size="20">use-context target</text><text x="830" y="335" font-family="monospace" font-size="20">   ↓ verify current-context</text><rect x="50" y="480" width="1400" height="300" rx="18" fill="#f4f4f4" stroke="#222"/><text x="80" y="525" font-family="sans-serif" font-size="26" font-weight="700">Source-confirmed operations</text><text x="80" y="575" font-family="monospace" font-size="19">set-cluster · set-credentials · set-context · use-context</text><text x="80" y="620" font-family="monospace" font-size="19">get-contexts · get-clusters · delete-context · delete-cluster</text><text x="80" y="680" font-family="sans-serif" font-size="18">Critical boundary: active context determines where subsequent kubectl changes land.</text><text x="80" y="725" font-family="sans-serif" font-size="18">Credentials in artifacts are placeholders; source-era compatibility is [Needs confirmation].</text></svg>