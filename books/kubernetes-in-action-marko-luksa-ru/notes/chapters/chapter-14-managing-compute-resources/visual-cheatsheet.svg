<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>.title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}.t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}</style>
  <text x="40" y="54" class="title">Глава 14 — Requests, limits, QoS и quotas</text>
  <text x="40" y="82" class="s">RAG p0492:c01–p0528:c01 · PDF 492–528 · Printed 491–527</text>

  <rect x="40" y="120" width="350" height="175" class="blue"/>
  <text x="60" y="154" class="h">Requests</text>
  <text x="60" y="188" class="t">scheduler reservation</text>
  <text x="60" y="218" class="t">CPU fairness under contention</text>
  <text x="60" y="248" class="t">sum across containers</text>

  <rect x="425" y="120" width="350" height="175" class="red"/>
  <text x="445" y="154" class="h">Limits</text>
  <text x="445" y="188" class="t">CPU → throttling</text>
  <text x="445" y="218" class="t">Memory → OOMKilled</text>
  <text x="445" y="248" class="t">may be overcommitted</text>

  <rect x="810" y="120" width="350" height="175" class="violet"/>
  <text x="830" y="154" class="h">QoS</text>
  <text x="830" y="188" class="t">BestEffort</text>
  <text x="830" y="218" class="t">Burstable</text>
  <text x="830" y="248" class="t">Guaranteed</text>

  <text x="40" y="350" class="h">Namespace policy</text>

  <rect x="40" y="385" width="540" height="185" class="green"/>
  <text x="60" y="420" class="h">LimitRange</text>
  <text x="60" y="454" class="t">per Pod/container/PVC</text>
  <text x="60" y="484" class="t">min · max · defaults</text>
  <text x="60" y="514" class="t">admission reject/default</text>

  <rect x="620" y="385" width="540" height="185" class="amber"/>
  <text x="640" y="420" class="h">ResourceQuota</text>
  <text x="640" y="454" class="t">aggregate namespace budget</text>
  <text x="640" y="484" class="t">CPU · memory · storage · counts</text>
  <text x="640" y="514" class="t">QoS/state scopes</text>

  <text x="40" y="635" class="h">Tune with measurements</text>
  <rect x="40" y="670" width="1120" height="160" class="box"/>
  <text x="65" y="707" class="t">Source-era monitoring: cAdvisor → Heapster → kubectl top / InfluxDB → Grafana.</text>
  <text x="65" y="743" class="t">CPU actual &gt; request for long periods → source recommends raising request.</text>
  <text x="65" y="779" class="t">Memory actual far below request → source recommends lowering reservation.</text>

  <text x="40" y="885" class="s">Resource policy is a scheduling, runtime and namespace-governance boundary.</text>
</svg>