<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>
    .title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}
    .t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}
    .violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}
  </style>
  <text x="40" y="54" class="title">Глава 6 — Volumes, PV/PVC и dynamic provisioning</text>
  <text x="40" y="82" class="s">RAG p0212:c01–p0248:c01 · PDF 212–248 · Printed 211–247</text>
  <rect x="40" y="120" width="350" height="175" class="blue"/>
  <text x="60" y="154" class="h">Pod-local volumes</text><text x="60" y="188" class="t">emptyDir · gitRepo</text><text x="60" y="218" class="t">shared between containers</text><text x="60" y="248" class="t">deleted with Pod</text>
  <rect x="425" y="120" width="350" height="175" class="amber"/>
  <text x="445" y="154" class="h">Node-coupled</text><text x="445" y="188" class="t">hostPath</text><text x="445" y="218" class="t">worker filesystem</text><text x="445" y="248" class="t">not portable across nodes</text>
  <rect x="810" y="120" width="350" height="175" class="green"/>
  <text x="830" y="154" class="h">Persistent</text><text x="830" y="188" class="t">external disk / NFS</text><text x="830" y="218" class="t">PV → PVC → Pod</text><text x="830" y="248" class="t">survives Pod replacement</text>
  <text x="40" y="350" class="h">PV/PVC lifecycle</text>
  <rect x="40" y="385" width="540" height="185" class="violet"/>
  <text x="60" y="420" class="h">Binding</text><text x="60" y="454" class="t">PV Available → PVC → PV Bound</text><text x="60" y="484" class="t">capacity + accessModes must match</text><text x="60" y="514" class="t">PVC namespaced · PV cluster-scoped</text>
  <rect x="620" y="385" width="540" height="185" class="red"/>
  <text x="640" y="420" class="h">Reclaim</text><text x="640" y="454" class="t">Retain → Released + keep data</text><text x="640" y="484" class="t">Recycle → erase + reuse</text><text x="640" y="514" class="t">Delete → delete underlying storage</text>
  <text x="40" y="635" class="h">Dynamic provisioning</text>
  <rect x="40" y="670" width="1120" height="160" class="box"/>
  <text x="65" y="707" class="t">PVC → storageClassName → StorageClass → provisioner → new PV + actual storage</text>
  <text x="65" y="743" class="t">No class → default class may provision automatically</text>
  <text x="65" y="779" class="t">storageClassName: empty string → source method to avoid dynamic provisioning</text>
  <text x="40" y="885" class="s">Critical check before PVC deletion: bound PV + reclaim policy + intended data lifecycle.</text>
</svg>