<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>.title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}.t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}</style>

  <text x="40" y="54" class="title">Глава 16 — Advanced Scheduling</text>
  <text x="40" y="82" class="s">RAG p0553:c01–p0574:c01 · PDF 553–574 · Printed 552–573</text>

  <rect x="40" y="120" width="350" height="175" class="red"/>
  <text x="60" y="154" class="h">Taints</text>
  <text x="60" y="188" class="t">NoSchedule</text>
  <text x="60" y="218" class="t">PreferNoSchedule</text>
  <text x="60" y="248" class="t">NoExecute → eviction risk</text>

  <rect x="425" y="120" width="350" height="175" class="blue"/>
  <text x="445" y="154" class="h">Node affinity</text>
  <text x="445" y="188" class="t">required → hard filter</text>
  <text x="445" y="218" class="t">preferred → weighted score</text>
  <text x="445" y="248" class="t">node labels drive placement</text>

  <rect x="810" y="120" width="350" height="175" class="violet"/>
  <text x="830" y="154" class="h">Pod affinity</text>
  <text x="830" y="188" class="t">co-locate matching Pods</text>
  <text x="830" y="218" class="t">labelSelector</text>
  <text x="830" y="248" class="t">topologyKey</text>

  <text x="40" y="350" class="h">Separation and topology</text>

  <rect x="40" y="385" width="540" height="185" class="green"/>
  <text x="60" y="420" class="h">Pod anti-affinity</text>
  <text x="60" y="454" class="t">keep matching workloads apart</text>
  <text x="60" y="484" class="t">node · rack · zone · region</text>
  <text x="60" y="514" class="t">hard rule may cause Pending Pods</text>

  <rect x="620" y="385" width="540" height="185" class="amber"/>
  <text x="640" y="420" class="h">topologyKey</text>
  <text x="640" y="454" class="t">hostname → node</text>
  <text x="640" y="484" class="t">zone / region → failure domain</text>
  <text x="640" y="514" class="t">custom label → custom domain</text>

  <text x="40" y="635" class="h">Operational rule</text>
  <rect x="40" y="670" width="1120" height="160" class="box"/>
  <text x="65" y="707" class="t">Use hard requirements only for true invariants.</text>
  <text x="65" y="743" class="t">Use preferred rules when availability matters more than ideal placement.</text>
  <text x="65" y="779" class="t">Before NoExecute or hard anti-affinity, verify blast radius and schedulable topology capacity.</text>

  <text x="40" y="885" class="s">Toleration permits tainted-node placement; it does not attract a Pod to that node.</text>
</svg>