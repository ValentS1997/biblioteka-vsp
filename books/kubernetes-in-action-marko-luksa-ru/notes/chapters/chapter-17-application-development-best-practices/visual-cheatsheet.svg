<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>.title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}.t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}</style>

  <text x="40" y="54" class="title">Глава 17 — Application Lifecycle Practices</text>
  <text x="40" y="82" class="s">RAG p0575:c01–p0610:c01 · PDF 575–610 · Printed 574–609</text>

  <rect x="40" y="120" width="350" height="175" class="blue"/>
  <text x="60" y="154" class="h">Startup</text>
  <text x="60" y="188" class="t">init containers gate prerequisites</text>
  <text x="60" y="218" class="t">readiness gates Service traffic</text>
  <text x="60" y="248" class="t">postStart adds startup action</text>

  <rect x="425" y="120" width="350" height="175" class="red"/>
  <text x="445" y="154" class="h">Termination</text>
  <text x="445" y="188" class="t">preStop → SIGTERM</text>
  <text x="445" y="218" class="t">grace period → SIGKILL</text>
  <text x="445" y="248" class="t">force delete = critical</text>

  <rect x="810" y="120" width="350" height="175" class="violet"/>
  <text x="830" y="154" class="h">Traffic safety</text>
  <text x="830" y="188" class="t">Endpoints/router updates async</text>
  <text x="830" y="218" class="t">wait briefly before close</text>
  <text x="830" y="248" class="t">finish active requests</text>

  <text x="40" y="350" class="h">Operational manageability</text>

  <rect x="40" y="385" width="540" height="185" class="green"/>
  <text x="60" y="420" class="h">Observability</text>
  <text x="60" y="454" class="t">stdout/stderr logs</text>
  <text x="60" y="484" class="t">termination messages</text>
  <text x="60" y="514" class="t">FluentD → Elasticsearch → Kibana</text>

  <rect x="620" y="385" width="540" height="185" class="amber"/>
  <text x="640" y="420" class="h">Delivery</text>
  <text x="640" y="454" class="t">versioned image tags</text>
  <text x="640" y="484" class="t">labels + annotations</text>
  <text x="640" y="514" class="t">manifests in VCS → apply / CI/CD</text>

  <text x="40" y="635" class="h">Design assumption</text>
  <rect x="40" y="670" width="1120" height="160" class="box"/>
  <text x="65" y="707" class="t">Pods are replaceable: IPs change, containers restart, writable layers disappear.</text>
  <text x="65" y="743" class="t">Application correctness requires durable state, readiness, signal handling and graceful shutdown.</text>
  <text x="65" y="779" class="t">Kubernetes reconciliation does not replace application-level lifecycle design.</text>

  <text x="40" y="885" class="s">Source-era Docker/Minikube/Ksonnet ecosystem preserved without modernization.</text>
</svg>