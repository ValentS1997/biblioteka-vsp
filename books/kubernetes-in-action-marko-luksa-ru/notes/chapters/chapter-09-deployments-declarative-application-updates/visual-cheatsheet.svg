<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>.title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}.t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}</style>
  <text x="40" y="54" class="title">Глава 9 — Deployment rollout и rollback</text>
  <text x="40" y="82" class="s">RAG p0316:c01–p0349:c01 · PDF 316–349 · Printed 315–348</text>

  <rect x="40" y="120" width="350" height="175" class="blue"/>
  <text x="60" y="154" class="h">Deployment</text>
  <text x="60" y="188" class="t">desired Pod template</text>
  <text x="60" y="218" class="t">ReplicaSet per revision</text>
  <text x="60" y="248" class="t">controller performs rollout</text>

  <rect x="425" y="120" width="350" height="175" class="green"/>
  <text x="445" y="154" class="h">RollingUpdate</text>
  <text x="445" y="188" class="t">maxSurge</text>
  <text x="445" y="218" class="t">maxUnavailable</text>
  <text x="445" y="248" class="t">progressive replacement</text>

  <rect x="810" y="120" width="350" height="175" class="violet"/>
  <text x="830" y="154" class="h">Revision control</text>
  <text x="830" y="188" class="t">rollout history</text>
  <text x="830" y="218" class="t">rollout undo</text>
  <text x="830" y="248" class="t">old ReplicaSets preserve history</text>

  <text x="40" y="350" class="h">Rollout safety</text>

  <rect x="40" y="385" width="540" height="185" class="green"/>
  <text x="60" y="420" class="h">Healthy rollout</text>
  <text x="60" y="454" class="t">readiness succeeds</text>
  <text x="60" y="484" class="t">minReadySeconds satisfied</text>
  <text x="60" y="514" class="t">new ReplicaSet continues scaling</text>

  <rect x="620" y="385" width="540" height="185" class="red"/>
  <text x="640" y="420" class="h">Bad rollout</text>
  <text x="640" y="454" class="t">readiness fails</text>
  <text x="640" y="484" class="t">new Pod not available</text>
  <text x="640" y="514" class="t">rollout blocks before full replacement</text>

  <text x="40" y="635" class="h">Operational controls</text>
  <rect x="40" y="670" width="1120" height="160" class="box"/>
  <text x="65" y="707" class="t">set image → rollout · status → observe · pause/resume → staged rollout · undo → rollback</text>
  <text x="65" y="743" class="t">Recreate = downtime risk. RollingUpdate = controlled coexistence of old/new Pods.</text>
  <text x="65" y="779" class="t">Source-era kubectl rolling-update is obsolete and client-driven.</text>

  <text x="40" y="885" class="s">High-risk command in setup: kubectl delete rc --all — broad destructive scope.</text>
</svg>