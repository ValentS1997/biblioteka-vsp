<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect width="1200" height="860" fill="#ffffff"/>
  <style>
    .title{font:700 32px sans-serif;fill:#111827}
    .h{font:700 20px sans-serif;fill:#111827}
    .t{font:16px sans-serif;fill:#1f2937}
    .s{font:14px sans-serif;fill:#374151}
    .box{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:14}
    .accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:14}
    .node{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:12}
    .arrow{stroke:#334155;stroke-width:2;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>

  <text x="40" y="52" class="title">Глава 1 — Знакомство с Kubernetes</text>
  <text x="40" y="80" class="s">Марко Лукша · RAG p0035:c01–p0061:c01 · PDF 35–61</text>

  <rect x="40" y="115" width="330" height="170" class="box"/>
  <text x="60" y="148" class="h">Проблема</text>
  <text x="60" y="178" class="t">Монолит → микросервисы</text>
  <text x="60" y="204" class="t">Больше deployable-компонентов</text>
  <text x="60" y="230" class="t">Environment drift и зависимости</text>
  <text x="60" y="256" class="t">Ручное размещение не масштабируется</text>

  <rect x="435" y="115" width="330" height="170" class="accent"/>
  <text x="455" y="148" class="h">Контейнеры</text>
  <text x="455" y="178" class="t">Namespaces → что процесс видит</text>
  <text x="455" y="204" class="t">cgroups → сколько ресурсов получает</text>
  <text x="455" y="230" class="t">Image → Registry → Container</text>
  <text x="455" y="256" class="t">Общее ядро хоста, меньше overhead</text>

  <rect x="830" y="115" width="330" height="170" class="accent"/>
  <text x="850" y="148" class="h">Kubernetes</text>
  <text x="850" y="178" class="t">Много узлов → одна платформа</text>
  <text x="850" y="204" class="t">Desired state вместо ручного placement</text>
  <text x="850" y="230" class="t">Self-healing и scaling</text>
  <text x="850" y="256" class="t">Stable service access</text>

  <line x1="370" y1="200" x2="430" y2="200" class="arrow"/>
  <line x1="765" y1="200" x2="825" y2="200" class="arrow"/>

  <text x="40" y="335" class="h">Архитектура кластера</text>

  <rect x="40" y="365" width="500" height="210" class="box"/>
  <text x="60" y="398" class="h">Control plane</text>
  <text x="60" y="430" class="t">API server — точка взаимодействия</text>
  <text x="60" y="458" class="t">Scheduler — назначает workload узлам</text>
  <text x="60" y="486" class="t">Controller Manager — кластерные функции</text>
  <text x="60" y="514" class="t">etcd — сохраняет конфигурацию кластера</text>

  <rect x="660" y="365" width="500" height="210" class="node"/>
  <text x="680" y="398" class="h">Worker node</text>
  <text x="680" y="430" class="t">Kubelet — управляет контейнерами узла</text>
  <text x="680" y="458" class="t">Container runtime — получает image и запускает</text>
  <text x="680" y="486" class="t">kube-proxy — балансирует service traffic</text>
  <text x="680" y="514" class="t">Containers — приложение</text>

  <line x1="540" y1="470" x2="655" y2="470" class="arrow"/>

  <text x="40" y="630" class="h">Путь приложения</text>
  <rect x="40" y="665" width="170" height="74" class="box"/><text x="62" y="708" class="t">Application</text>
  <rect x="250" y="665" width="170" height="74" class="box"/><text x="282" y="708" class="t">Image</text>
  <rect x="460" y="665" width="170" height="74" class="box"/><text x="493" y="708" class="t">Registry</text>
  <rect x="670" y="665" width="210" height="74" class="accent"/><text x="696" y="696" class="t">API + Scheduler</text><text x="714" y="720" class="s">desired state</text>
  <rect x="920" y="665" width="240" height="74" class="node"/><text x="947" y="696" class="t">Kubelet + runtime</text><text x="974" y="720" class="s">running containers</text>
  <line x1="210" y1="702" x2="245" y2="702" class="arrow"/>
  <line x1="420" y1="702" x2="455" y2="702" class="arrow"/>
  <line x1="630" y1="702" x2="665" y2="702" class="arrow"/>
  <line x1="880" y1="702" x2="915" y2="702" class="arrow"/>

  <text x="40" y="810" class="s">Главный принцип: описание приложения отделено от конкретных машин; Kubernetes выбирает размещение и поддерживает состояние.</text>
</svg>