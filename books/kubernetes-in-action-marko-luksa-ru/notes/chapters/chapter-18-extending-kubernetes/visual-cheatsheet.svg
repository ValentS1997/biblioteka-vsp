<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="50" y="60" font-family="sans-serif" font-size="34" font-weight="700">Глава 18 — Расширение Kubernetes</text>
  <text x="50" y="98" font-family="sans-serif" font-size="18">RAG: p0611:c01–p0639:c01 · PDF 611–639</text>

  <rect x="50" y="140" width="500" height="240" rx="18" fill="#f4f4f4" stroke="#222"/>
  <text x="75" y="180" font-family="sans-serif" font-size="24" font-weight="700">Custom resources</text>
  <text x="75" y="220" font-family="monospace" font-size="19">CRD → Website → Controller</text>
  <text x="75" y="255" font-family="monospace" font-size="19">             ↘ Deployment</text>
  <text x="75" y="290" font-family="monospace" font-size="19">             ↘ Service</text>
  <text x="75" y="335" font-family="sans-serif" font-size="18">CRD хранит объект; controller дает ему поведение.</text>

  <rect x="650" y="140" width="500" height="240" rx="18" fill="#f4f4f4" stroke="#222"/>
  <text x="675" y="180" font-family="sans-serif" font-size="24" font-weight="700">API aggregation</text>
  <text x="675" y="225" font-family="monospace" font-size="19">Client → Main API → Custom API server</text>
  <text x="675" y="265" font-family="monospace" font-size="19">          ↑ APIService</text>
  <text x="675" y="320" font-family="sans-serif" font-size="18">Отдельный API server интегрируется в общий API.</text>

  <rect x="50" y="420" width="500" height="250" rx="18" fill="#f4f4f4" stroke="#222"/>
  <text x="75" y="460" font-family="sans-serif" font-size="24" font-weight="700">Service Catalog</text>
  <text x="75" y="505" font-family="monospace" font-size="18">Broker → Class → Instance → Binding</text>
  <text x="75" y="545" font-family="monospace" font-size="18">                         ↓</text>
  <text x="75" y="580" font-family="monospace" font-size="18">                       Secret → Pod</text>
  <text x="75" y="625" font-family="sans-serif" font-size="18">Provisioning внешних служб через API resources.</text>

  <rect x="650" y="420" width="500" height="250" rx="18" fill="#f4f4f4" stroke="#222"/>
  <text x="675" y="460" font-family="sans-serif" font-size="24" font-weight="700">Platforms & packaging</text>
  <text x="675" y="505" font-family="sans-serif" font-size="19">OpenShift: build/deploy abstractions</text>
  <text x="675" y="545" font-family="sans-serif" font-size="19">Deis Workflow: PaaS workflow</text>
  <text x="675" y="585" font-family="sans-serif" font-size="19">Helm: Chart + Config → Release → resources</text>
  <text x="675" y="635" font-family="sans-serif" font-size="17">Source-era APIs/Tiller: current compatibility [Needs confirmation]</text>
</svg>
