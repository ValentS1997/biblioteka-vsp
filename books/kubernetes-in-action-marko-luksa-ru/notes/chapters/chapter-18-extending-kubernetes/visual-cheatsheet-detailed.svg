<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="55" y="65" font-family="sans-serif" font-size="38" font-weight="700">Глава 18 — Расширение системы Kubernetes</text>
  <text x="55" y="105" font-family="sans-serif" font-size="19">Custom resources · controllers · API aggregation · Service Catalog · OpenShift · Deis · Helm</text>

  <rect x="55" y="145" width="710" height="310" rx="18" fill="#f5f5f5" stroke="#222"/>
  <text x="85" y="190" font-family="sans-serif" font-size="27" font-weight="700">1. CRD → Controller → native resources</text>
  <text x="85" y="235" font-family="monospace" font-size="20">CustomResourceDefinition</text>
  <text x="85" y="272" font-family="monospace" font-size="20">        ↓</text>
  <text x="85" y="309" font-family="monospace" font-size="20">Website custom resource</text>
  <text x="85" y="346" font-family="monospace" font-size="20">        ↓ watch</text>
  <text x="85" y="383" font-family="monospace" font-size="20">Website controller → Deployment + Service</text>
  <text x="85" y="425" font-family="sans-serif" font-size="17">RBAC example binds controller ServiceAccount to cluster-admin — broad privileges.</text>

  <rect x="835" y="145" width="710" height="310" rx="18" fill="#f5f5f5" stroke="#222"/>
  <text x="865" y="190" font-family="sans-serif" font-size="27" font-weight="700">2. Aggregated API server</text>
  <text x="865" y="240" font-family="monospace" font-size="20">kubectl/client</text>
  <text x="865" y="277" font-family="monospace" font-size="20">     ↓</text>
  <text x="865" y="314" font-family="monospace" font-size="20">Main Kubernetes API server</text>
  <text x="865" y="351" font-family="monospace" font-size="20">     ↓ API aggregation</text>
  <text x="865" y="388" font-family="monospace" font-size="20">Custom API server</text>
  <text x="865" y="425" font-family="sans-serif" font-size="17">APIService registers the extension endpoint.</text>

  <rect x="55" y="500" width="710" height="330" rx="18" fill="#f5f5f5" stroke="#222"/>
  <text x="85" y="545" font-family="sans-serif" font-size="27" font-weight="700">3. Service Catalog</text>
  <text x="85" y="592" font-family="monospace" font-size="19">ClusterServiceBroker</text>
  <text x="85" y="627" font-family="monospace" font-size="19">        ↓ publishes</text>
  <text x="85" y="662" font-family="monospace" font-size="19">ClusterServiceClass</text>
  <text x="85" y="697" font-family="monospace" font-size="19">        ↓ select class/plan</text>
  <text x="85" y="732" font-family="monospace" font-size="19">ServiceInstance → ServiceBinding → Secret → Pod</text>
  <text x="85" y="785" font-family="sans-serif" font-size="17">Catalog components: API server + etcd + controller manager.</text>

  <rect x="835" y="500" width="710" height="330" rx="18" fill="#f5f5f5" stroke="#222"/>
  <text x="865" y="545" font-family="sans-serif" font-size="27" font-weight="700">4. Platforms above Kubernetes</text>
  <text x="865" y="592" font-family="sans-serif" font-size="20">OpenShift:</text>
  <text x="895" y="627" font-family="sans-serif" font-size="18">Template · BuildConfig · Source-to-Image</text>
  <text x="895" y="662" font-family="sans-serif" font-size="18">ImageStream · DeploymentConfig · Route</text>
  <text x="865" y="710" font-family="sans-serif" font-size="20">Deis Workflow:</text>
  <text x="895" y="745" font-family="sans-serif" font-size="18">git push deis master → platform delivery workflow</text>
  <text x="865" y="792" font-family="sans-serif" font-size="20">Helm:</text>
  <text x="895" y="817" font-family="sans-serif" font-size="18">Chart + Config → Release → Tiller → Kubernetes resources</text>

  <rect x="55" y="875" width="1490" height="165" rx="18" fill="#f5f5f5" stroke="#222"/>
  <text x="85" y="920" font-family="sans-serif" font-size="26" font-weight="700">Source-confirmed commands</text>
  <text x="85" y="960" font-family="monospace" font-size="17">kubectl create -f website-crd-definition.yaml   ·   kubectl get website kubia -o yaml</text>
  <text x="85" y="995" font-family="monospace" font-size="17">kubectl logs &lt;controller-pod&gt; -c main   ·   kubectl get deploy,svc,po   ·   helm install --name my-database stable/mysql</text>
  <text x="85" y="1025" font-family="sans-serif" font-size="16">Historical API versions and Tiller-era workflow are preserved as source content; current compatibility is [Needs confirmation].</text>
</svg>
