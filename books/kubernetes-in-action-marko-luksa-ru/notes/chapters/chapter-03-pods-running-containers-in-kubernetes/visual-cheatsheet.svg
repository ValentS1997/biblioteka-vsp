<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">
  <rect width="1200" height="920" fill="#ffffff"/>
  <style>
    .title{font:700 32px sans-serif;fill:#111827}.h{font:700 20px sans-serif;fill:#111827}
    .t{font:16px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}
    .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}
    .violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}
    .amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}
    .arrow{stroke:#334155;stroke-width:2;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>

  <text x="40" y="54" class="title">Глава 3 — Pods: запуск контейнеров в Kubernetes</text>
  <text x="40" y="82" class="s">RAG p0095:c01–p0126:c01 · PDF 95–126 · Printed 94–125</text>

  <rect x="40" y="120" width="350" height="190" class="blue"/>
  <text x="60" y="154" class="h">Pod = logical host</text>
  <text x="60" y="188" class="t">• one worker node</text>
  <text x="60" y="218" class="t">• one Pod IP / port space</text>
  <text x="60" y="248" class="t">• shared Network / UTS / IPC</text>
  <text x="60" y="278" class="t">• whole Pod is scaling unit</text>

  <rect x="425" y="120" width="350" height="190" class="green"/>
  <text x="445" y="154" class="h">Resource definition</text>
  <text x="445" y="188" class="t">apiVersion · kind</text>
  <text x="445" y="218" class="t">metadata · spec</text>
  <text x="445" y="248" class="t">status = observed runtime state</text>
  <text x="445" y="278" class="t">kubectl explain / create / get</text>

  <rect x="810" y="120" width="350" height="190" class="violet"/>
  <text x="830" y="154" class="h">Operational access</text>
  <text x="830" y="188" class="t">kubectl logs</text>
  <text x="830" y="218" class="t">kubectl port-forward</text>
  <text x="830" y="248" class="t">get -o yaml/json</text>
  <text x="830" y="278" class="t">describe / selectors</text>

  <text x="40" y="365" class="h">Organization and placement</text>

  <rect x="40" y="400" width="350" height="180" class="green"/>
  <text x="60" y="434" class="h">Labels / selectors</text>
  <text x="60" y="468" class="t">identity + grouping</text>
  <text x="60" y="498" class="t">= · != · presence · absence</text>
  <text x="60" y="528" class="t">in / notin · AND conditions</text>

  <rect x="425" y="400" width="350" height="180" class="amber"/>
  <text x="445" y="434" class="h">Node placement</text>
  <text x="445" y="468" class="t">node label: gpu=true</text>
  <text x="445" y="498" class="t">Pod nodeSelector</text>
  <text x="445" y="528" class="t">describe capability, not hostname</text>

  <rect x="810" y="400" width="350" height="180" class="violet"/>
  <text x="830" y="434" class="h">Annotations / namespaces</text>
  <text x="830" y="468" class="t">annotations: metadata, not selection</text>
  <text x="830" y="498" class="t">namespace: resource/name scope</text>
  <text x="830" y="528" class="t">not automatic network isolation</text>

  <text x="40" y="640" class="h">Deletion semantics</text>
  <rect x="40" y="675" width="1120" height="155" class="box"/>
  <text x="65" y="712" class="t">delete Pod → SIGTERM → grace period → SIGKILL if needed</text>
  <text x="65" y="748" class="t">selector / namespace / --all can affect many resources</text>
  <text x="65" y="784" class="t">controller-managed Pod may reappear because desired state still exists</text>

  <text x="40" y="875" class="s">Главный принцип: Pod задаёт co-location/network/scaling boundary; labels выбирают группы; namespaces задают scope.</text>
</svg>