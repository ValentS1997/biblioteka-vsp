<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <rect width="1200" height="930" fill="#ffffff"/>
  <style>.title{font:700 31px sans-serif;fill:#111827}.h{font:700 19px sans-serif;fill:#111827}.t{font:15px sans-serif;fill:#1f2937}.s{font:14px sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}</style>
  <text x="40" y="54" class="title">Глава 15 — Autoscaling Pods и Nodes</text>
  <text x="40" y="82" class="s">RAG p0529:c01–p0552:c01 · PDF 529–552 · Printed 528–551</text>

  <rect x="40" y="120" width="350" height="175" class="blue"/>
  <text x="60" y="154" class="h">HorizontalPodAutoscaler</text>
  <text x="60" y="188" class="t">metrics → desired replicas</text>
  <text x="60" y="218" class="t">Scale subresource</text>
  <text x="60" y="248" class="t">min/max replica bounds</text>

  <rect x="425" y="120" width="350" height="175" class="green"/>
  <text x="445" y="154" class="h">Metric model</text>
  <text x="445" y="188" class="t">Resource · Pods · Object</text>
  <text x="445" y="218" class="t">CPU based on request</text>
  <text x="445" y="248" class="t">QPS = good custom metric</text>

  <rect x="810" y="120" width="350" height="175" class="violet"/>
  <text x="830" y="154" class="h">Cluster Autoscaler</text>
  <text x="830" y="188" class="t">unschedulable Pod</text>
  <text x="830" y="218" class="t">grow fitting node group</text>
  <text x="830" y="248" class="t">remove safe idle nodes</text>

  <text x="40" y="350" class="h">Control loops</text>

  <rect x="40" y="385" width="540" height="185" class="amber"/>
  <text x="60" y="420" class="h">HPA</text>
  <text x="60" y="454" class="t">cAdvisor → Heapster → HPA</text>
  <text x="60" y="484" class="t">metric propagation is delayed</text>
  <text x="60" y="514" class="t">source-era rescale rate limits</text>

  <rect x="620" y="385" width="540" height="185" class="green"/>
  <text x="640" y="420" class="h">Node scale-down</text>
  <text x="640" y="454" class="t">mark node unschedulable</text>
  <text x="640" y="484" class="t">evict movable Pods</text>
  <text x="640" y="514" class="t">controllers recreate elsewhere</text>

  <text x="40" y="635" class="h">Availability boundary</text>
  <rect x="40" y="670" width="1120" height="160" class="red"/>
  <text x="65" y="707" class="t">PDB constrains voluntary disruption from drain / Cluster Autoscaler.</text>
  <text x="65" y="743" class="t">PDB cannot prevent unexpected node failure.</text>
  <text x="65" y="779" class="t">Cluster Autoscaler changes cloud capacity and cost; drain evicts workloads.</text>

  <text x="40" y="885" class="s">Source-era HPA/Heapster/API behavior preserved without modernization.</text>
</svg>