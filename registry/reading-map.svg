<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">VSP reading map — Infrastructure / Technical Operations → DevOps/SRE</title>
  <desc id="desc">Career-oriented reading map derived from biblioteka-vsp registry on 2026-09-24.</desc>
  <defs>
    <style>
      .bg { fill:#ffffff; }
      .title { font:700 42px Arial, sans-serif; fill:#111827; }
      .section { font:700 27px Arial, sans-serif; fill:#111827; }
      .box-title { font:700 22px Arial, sans-serif; fill:#111827; }
      .box-text { font:400 19px Arial, sans-serif; fill:#374151; }
      .small { font:400 18px Arial, sans-serif; fill:#374151; }
      .tiny { font:400 16px Arial, sans-serif; fill:#4b5563; }
      .done { fill:#f3f4f6; stroke:#6b7280; stroke-width:2; }
      .core { fill:#e8f0fe; stroke:#3559a8; stroke-width:2.5; }
      .next { fill:#f7f7f8; stroke:#6b7280; stroke-width:2; }
      .branch { fill:#fafafa; stroke:#9ca3af; stroke-width:2; }
      .note { fill:#fff7ed; stroke:#c2410c; stroke-width:2; }
      .arrow { stroke:#374151; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#9ca3af; stroke-width:2; stroke-dasharray:7 7; fill:none; }
      .muted { fill:#6b7280; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
