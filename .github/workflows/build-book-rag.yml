name: Build book RAG

on:
  push:
    branches-ignore:
      - main
    paths:
      - "books/**/source/book.pdf"

permissions:
  contents: write

jobs:
  build-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Detect changed book sources and build RAG
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SOURCES < <(
            git show --pretty="" --name-only "$GITHUB_SHA" |
              grep -E '^books/[^/]+/source/book\.pdf$' || true
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No canonical book source PDF changed."
            exit 0
          fi

          for source in "${SOURCES[@]}"; do
            book_dir="${source%/source/book.pdf}"
            echo "Building RAG for $book_dir"
            python scripts/build_book_rag.py --book-dir "$book_dir"
          done

      - name: Commit generated RAG artifacts back to the ingest branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books/*/rag/manifest.yaml books/*/rag/text.md books/*/rag/chunks.jsonl

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(rag): build full-book retrieval artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
