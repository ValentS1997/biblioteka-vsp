name: Build book RAG

on:
  push:
    branches-ignore:
      - main
    paths:
      - "books/**/source/book.pdf"
      - "scripts/build_book_rag.py"
      - ".github/workflows/build-book-rag.yml"

permissions:
  contents: write

jobs:
  build-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Detect books to rebuild
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git show --pretty="" --name-only "$GITHUB_SHA")"

          if grep -Eq '^(scripts/build_book_rag.py|\.github/workflows/build-book-rag\.yml)$' <<<"$CHANGED"; then
            find books -mindepth 3 -maxdepth 3 -path '*/source/book.pdf' -type f | sort > /tmp/rag-sources.txt
          else
            grep -E '^books/[^/]+/source/book\.pdf$' <<<"$CHANGED" | sort -u > /tmp/rag-sources.txt || true
          fi

          echo "Sources selected:"
          cat /tmp/rag-sources.txt || true

      - name: Build full-book and addressable retrieval artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/rag-sources.txt ]; then
            echo "No canonical book source PDF selected."
            exit 0
          fi

          while IFS= read -r source; do
            book_dir="${source%/source/book.pdf}"
            echo "Building RAG for $book_dir"
            python scripts/build_book_rag.py --book-dir "$book_dir"
          done < /tmp/rag-sources.txt

      - name: Commit generated RAG artifacts back to the ingest branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             books/*/rag/manifest.yaml             books/*/rag/text.md             books/*/rag/chunks.jsonl             books/*/rag/chunk-index.jsonl             books/*/rag/chunks/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(rag): build addressable retrieval chunks"

          # The ingest branch may receive documentation/protocol commits while
          # this job is generating thousands of chunk files. Rebase the generated
          # commit onto the current remote branch before publishing it.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
