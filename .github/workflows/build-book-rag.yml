name: Build book RAG

on:
  push:
    branches-ignore:
      - main
    paths:
      - "books/**/source/book.pdf"
      - "books/**/source/book.epub"
      - "scripts/build_book_rag.py"
      - ".github/workflows/build-book-rag.yml"
  workflow_dispatch:
    inputs:
      book_id:
        description: "Optional book id to rebuild explicitly"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Detect books to rebuild
        id: detect
        shell: bash
        env:
          REQUESTED_BOOK_ID: ${{ inputs.book_id }}
        run: |
          set -euo pipefail
          : > /tmp/rag-sources.txt

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${REQUESTED_BOOK_ID:-}" ]; then
            for candidate in \
              "books/${REQUESTED_BOOK_ID}/source/book.pdf" \
              "books/${REQUESTED_BOOK_ID}/source/book.epub"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate" >> /tmp/rag-sources.txt
              fi
            done
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git show --pretty="" --name-only "$GITHUB_SHA" \
              | grep -E '^books/[^/]+/source/book\.(pdf|epub)$' \
              | sort -u > /tmp/rag-sources.txt || true
          fi

          if [ "$(wc -l < /tmp/rag-sources.txt)" -gt 1 ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "More than one supported canonical source exists for ${REQUESTED_BOOK_ID}." >&2
            exit 1
          fi

          echo "Sources selected:"
          cat /tmp/rag-sources.txt || true

      - name: Build full-book and addressable retrieval artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/rag-sources.txt ]; then
            echo "No changed canonical PDF/EPUB source selected."
            exit 0
          fi

          while IFS= read -r source; do
            book_dir="$(dirname "$(dirname "$source")")"
            echo "Building RAG for $book_dir from $source"
            python scripts/build_book_rag.py --book-dir "$book_dir"
          done < /tmp/rag-sources.txt

      - name: Commit generated RAG artifacts back to the ingest branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            books/*/rag/manifest.yaml \
            books/*/rag/text.md \
            books/*/rag/chunks.jsonl \
            books/*/rag/chunk-index.jsonl \
            books/*/rag/chunks/ \
            books/*/rag/search-index/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(rag): build addressable retrieval chunks"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push race on attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to publish generated RAG artifacts after 5 attempts." >&2
          exit 1
