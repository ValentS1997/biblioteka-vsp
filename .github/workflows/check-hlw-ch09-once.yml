name: Chapter 9 Artifacts QA Once

on:
  push:
    branches:
      - chapter/how-linux-works-brian-ward-3e-ru-2022-ch09
    paths:
      - .github/workflows/check-hlw-ch09-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chapter 9 collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          b=Path("books/how-linux-works-brian-ward-3e-ru-2022")
          d=b/"notes/chapters/chapter-09-networking-and-configuration"
          required=("README.md","cheatsheet.md","commands.md","diagram.md","visual-cheatsheet.svg","visual-cheatsheet-detailed.svg","summary.md","source-findings.md")

          for name in required:
              p=d/name
              assert p.is_file() and p.stat().st_size>700,name
              s=p.read_text(encoding="utf-8")
              if name=="summary.md":
                  assert "p0319:c01" in s,name
              else:
                  assert "p0270:c01" in s and "p0319:c01" in s,name
              if name.endswith(".svg"):
                  root=ET.parse(p).getroot()
                  assert root.tag.endswith("svg")
                  assert root.attrib.get("viewBox")
                  assert any(x.tag.endswith("title") for x in root.iter())
              print("PASS",name,p.stat().st_size)

          sheet=(d/"cheatsheet.md").read_text(encoding="utf-8")
          for h in ("Symptom / problem framing","Baseline / context","Read-only checks","Interpretation","Next action","Modifying action","Verification / acceptance checks","Rollback"):
              assert h in sheet,h

          for absent in ("review-questions.md","review-answers.md"):
              assert not (d/absent).exists(),absent

          for idx in (b/"notes/chapters/README.md",b/"README.md"):
              assert "chapter-09-networking-and-configuration/README.md" in idx.read_text(encoding="utf-8")

          print("PASS chapter 9 artifact collection")
          PY
