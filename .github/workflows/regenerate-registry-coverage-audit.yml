name: Regenerate registry coverage audit

on:
  push:
    branches:
      - migration/registry-coverage-audit
    paths:
      - ".github/workflows/regenerate-registry-coverage-audit.yml"
      - "scripts/generate_registry_readme.py"
      - "scripts/validate_registry.py"
      - "books/index.yaml"
      - "registry/books.yaml"
      - "registry/ARCHITECTURE.md"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Regenerate registry
        run: python scripts/generate_registry_readme.py

      - name: Validate registry and generated view
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/generate_registry_readme.py --check

          python - <<'PY'
          from pathlib import Path
          text = Path("registry/README.md").read_text(encoding="utf-8")
          required = [
              "## Покрытие knowledge-проектов",
              "## Migration gaps",
              "Проектов завершено (user-confirmed '+')",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"generated coverage view missing: {missing}")
          print("coverage view assertions OK")
          PY

      - name: Show migration coverage summary
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^## Покрытие knowledge-проектов$/,/^## Реестр книг$/p' registry/README.md
          sed -n '/^## Контроль$/,$p' registry/README.md | head -40

      - name: Commit generated registry README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add registry/README.md
          if git diff --cached --quiet; then
            echo "README already current."
            exit 0
          fi

          git commit -m "Regenerate registry knowledge coverage view"
          git push origin "HEAD:migration/registry-coverage-audit"
