name: Validate chapter notes and SVG
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - "books/**/notes/**"
      - "scripts/validate_chapter_notes.py"
      - ".github/workflows/validate-chapter-notes.yml"
  push:
    paths:
      - "books/**/notes/**"
      - "scripts/validate_chapter_notes.py"
      - ".github/workflows/validate-chapter-notes.yml"

permissions:
  contents: read

jobs:
  validate-chapter-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without large Git LFS blobs
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3"
      - name: Validate chapter collections, RAG links and render SVGs to PNG
        run: python scripts/validate_chapter_notes.py --all-books
