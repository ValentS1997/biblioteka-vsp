name: Validate chapter notes and SVG
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - "books/**/notes/**"
      - "scripts/validate_chapter_notes.py"
      - "scripts/check_book_readiness.py"
      - "tests/test_validate_chapter_notes.py"
      - ".github/workflows/validate-chapter-notes.yml"
  push:
    paths:
      - "books/**/notes/**"
      - "scripts/validate_chapter_notes.py"
      - "scripts/check_book_readiness.py"
      - "tests/test_validate_chapter_notes.py"
      - ".github/workflows/validate-chapter-notes.yml"

permissions:
  contents: read

jobs:
  validate-chapter-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without large Git LFS blobs
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "PyYAML>=6,<7"
      - name: Detect changed chapter collections
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/chapter-changed-paths.txt"
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "$RUNNER_TEMP/chapter-changed-paths.txt"
          fi
      - name: Validate changed chapter collections, RAG links and SVG PNG rendering
        run: |
          python scripts/validate_chapter_notes.py \
            --changed-paths-file "$RUNNER_TEMP/chapter-changed-paths.txt" \
            --fallback-book-dir books/computer-networks-olifer-7e-ru-2026

      - name: Validate Prometheus inventory 0040 explicitly (no fallback)
        shell: bash
        run: |
          set -euo pipefail
          book="books/prometheus-up-and-running-pivotto-brazil-ru-2023"
          echo "Explicit chapter validation target: $book"
          if [ -n "$(find "$book/notes/chapters" -maxdepth 1 -mindepth 1 -type d -name 'chapter-*' -print -quit)" ]; then
            python scripts/validate_chapter_notes.py --book-dir "$book"
            python scripts/check_book_readiness.py --book-id prometheus-up-and-running-pivotto-brazil-ru-2023 --capability chapter-analysis
          else
            echo "No published Prometheus chapter directories in this revision; no chapter validation to perform"
          fi
      - name: Chapter-validator regression tests
        run: python -m unittest discover -s tests -p 'test_validate_chapter_notes.py'
