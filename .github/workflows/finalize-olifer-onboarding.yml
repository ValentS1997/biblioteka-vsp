name: Finalize Olifer onboarding once

on:
  push:
    branches:
      - onboard/computer-networks-olifer-6e-ru-2020
    paths:
      - ".github/workflows/finalize-olifer-onboarding.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema "PyMuPDF>=1.24,<2"

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify all declared RAG books and exact Olifer readiness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("books/index.yaml").read_text(encoding="utf-8"))
          checked = 0
          for book in data.get("books", []):
              paths = book.get("paths") or {}
              if not paths.get("rag_manifest"):
                  continue
              subprocess.run(
                  [
                      "python",
                      "scripts/check_book_readiness.py",
                      "--book-id",
                      book["id"],
                      "--capability",
                      "chapter-analysis",
                  ],
                  check=True,
              )
              checked += 1

          if checked == 0:
              raise SystemExit("No RAG-onboarded books were validated")
          print(f"Validated {checked} RAG-onboarded book(s)")
          PY

          python scripts/check_book_readiness.py             --book-id computer-networks-olifer-6e-ru-2020             --capability chapter-analysis

      - name: Regenerate and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_registry_readme.py
          python scripts/validate_registry.py
          python scripts/generate_registry_readme.py --check

      - name: Commit generated registry view and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f             .github/workflows/rebuild-olifer-rag.yml             .github/workflows/finalize-olifer-onboarding.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A             registry/README.md             .github/workflows/rebuild-olifer-rag.yml             .github/workflows/finalize-olifer-onboarding.yml

          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi

          git commit -m "chore(book): finalize Olifer onboarding validation"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to publish finalization commit after 5 attempts." >&2
          exit 1
