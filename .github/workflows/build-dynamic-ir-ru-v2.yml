name: Build Dynamic IR Russian Book v2

on:
  pull_request:
    branches: [main]
    paths:
      - "books/dynamic-incident-response-joshua-wright-en-2026/translation/ru/**"
      - "scripts/build_dynamic_ir_ru_v2.py"
      - ".github/workflows/build-dynamic-ir-ru-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer fonts-liberation poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml python-docx

      - name: Assemble RU v2 book
        run: |
          python scripts/build_dynamic_ir_ru_v2.py             --repo-root .             --out-dir build/dynamic-ir-ru-v2

      - name: Convert DOCX to PDF
        run: |
          mkdir -p build/dynamic-ir-ru-v2/pdf
          libreoffice --headless             --convert-to pdf             --outdir build/dynamic-ir-ru-v2/pdf             build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.docx
          mv build/dynamic-ir-ru-v2/pdf/dynamic-incident-response-ru-v2-a4.pdf             build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.pdf

      - name: Basic PDF verification
        run: |
          test -s build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.pdf
          pdfinfo build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.pdf             | tee build/dynamic-ir-ru-v2/pdfinfo-v2.txt
          grep -q "^Pages:" build/dynamic-ir-ru-v2/pdfinfo-v2.txt

      - name: Persist v2 artifacts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          export_dir="books/dynamic-incident-response-joshua-wright-en-2026/exports"
          mkdir -p "$export_dir"

          cp build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.pdf             "$export_dir/dynamic-incident-response-ru-v2-a4.pdf"
          cp build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.docx             "$export_dir/dynamic-incident-response-ru-v2-a4.docx"
          cp build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2.md             "$export_dir/dynamic-incident-response-ru-v2.md"
          cp build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-audit.json             "$export_dir/dynamic-incident-response-ru-v2-audit.json"
          cp build/dynamic-ir-ru-v2/pdfinfo-v2.txt             "$export_dir/pdfinfo-v2.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$export_dir"

          if git diff --cached --quiet; then
            echo "RU v2 publication artifacts already match the generated build."
            exit 0
          fi

          git commit -m "Publish Dynamic IR Russian v2 artifacts"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-incident-response-ru-v2
          path: |
            build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.pdf
            build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-a4.docx
            build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2.md
            build/dynamic-ir-ru-v2/dynamic-incident-response-ru-v2-audit.json
            build/dynamic-ir-ru-v2/pdfinfo-v2.txt
          if-no-files-found: error
          retention-days: 14
