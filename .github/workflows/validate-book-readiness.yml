name: Validate book readiness

on:
  pull_request:
    paths:
      - "templates/**"
      - "scripts/check_book_readiness.py"
      - "scripts/build_book_rag.py"
      - "tests/**"
      - "docs/BOOK-LIFECYCLE.md"
      - "RAG-RETRIEVAL.yaml"
      - "books/index.yaml"
      - "books/*/metadata.yaml"
      - "books/*/source/SHA256"
      - "books/*/source/book.pdf"
      - "books/*/source/book.epub"
      - "books/*/rag/manifest.yaml"
      - "books/*/rag/chunk-index.jsonl"
      - "books/*/rag/chunks/**"
      - "books/*/rag/search-index/**"
      - ".github/workflows/validate-book-readiness.yml"
  push:
    paths:
      - "templates/**"
      - "scripts/check_book_readiness.py"
      - "scripts/build_book_rag.py"
      - "tests/**"
      - "docs/BOOK-LIFECYCLE.md"
      - "RAG-RETRIEVAL.yaml"
      - "books/index.yaml"
      - "books/*/metadata.yaml"
      - "books/*/source/SHA256"
      - "books/*/source/book.pdf"
      - "books/*/source/book.epub"
      - "books/*/rag/manifest.yaml"
      - "books/*/rag/chunk-index.jsonl"
      - "books/*/rag/chunks/**"
      - "books/*/rag/search-index/**"
      - ".github/workflows/validate-book-readiness.yml"

permissions:
  contents: read

jobs:
  validate-book-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML "PyMuPDF>=1.24,<2"

      - name: Run unit/integration tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify all declared RAG-onboarded books
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("books/index.yaml").read_text(encoding="utf-8"))
          checked = 0
          for book in data.get("books", []):
              paths = book.get("paths") or {}
              if not paths.get("rag_manifest"):
                  continue
              subprocess.run(
                  [
                      "python",
                      "scripts/check_book_readiness.py",
                      "--book-id",
                      book["id"],
                      "--capability",
                      "chapter-analysis",
                  ],
                  check=True,
              )
              checked += 1

          if checked == 0:
              raise SystemExit("No RAG-onboarded books were validated")
          print(f"Validated {checked} RAG-onboarded book(s)")
          PY
