name: Build Dynamic Incident Response RAG

on:
  push:
    branches:
      - book/dynamic-incident-response-joshua-wright-en-2026
    paths:
      - ".github/workflows/build-dynamic-ir-rag.yml"

permissions:
  contents: write

jobs:
  build-rag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Verify canonical source identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "books/dynamic-incident-response-joshua-wright-en-2026/source/book.pdf"
          test -f "books/dynamic-incident-response-joshua-wright-en-2026/source/SHA256"
          expected="$(awk '{print $1}' "books/dynamic-incident-response-joshua-wright-en-2026/source/SHA256")"
          actual="$(sha256sum "books/dynamic-incident-response-joshua-wright-en-2026/source/book.pdf" | awk '{print $1}')"
          test "$expected" = "f882f3fdfe4d2de2b8b295747b1579f7592c59cd46d5a3dc211ba8b777925164"
          test "$actual" = "$expected"

      - name: Build full-book RAG
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_book_rag.py             --book-dir "books/dynamic-incident-response-joshua-wright-en-2026"

      - name: Commit generated RAG artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             "books/dynamic-incident-response-joshua-wright-en-2026/rag/manifest.yaml"             "books/dynamic-incident-response-joshua-wright-en-2026/rag/text.md"             "books/dynamic-incident-response-joshua-wright-en-2026/rag/chunks.jsonl"             "books/dynamic-incident-response-joshua-wright-en-2026/rag/chunk-index.jsonl"             "books/dynamic-incident-response-joshua-wright-en-2026/rag/chunks/"             "books/dynamic-incident-response-joshua-wright-en-2026/rag/search-index/"

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore(rag): build Dynamic Incident Response retrieval"
          git push origin "HEAD:book/dynamic-incident-response-joshua-wright-en-2026"
