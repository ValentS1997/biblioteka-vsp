name: Remove Olifer 6e data

on:
  push:
    branches:
      - cleanup/remove-olifer-6e
    paths:
      - ".github/workflows/remove-olifer-6e.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Remove Olifer 6e canonical data
        shell: bash
        run: |
          set -euo pipefail

          git rm -r "books/computer-networks-olifer-6e-ru-2020"

          python - <<'PY'
          from pathlib import Path

          book_id = "computer-networks-olifer-6e-ru-2020"

          # Remove books/index.yaml entry.
          index_path = Path("books/index.yaml")
          text = index_path.read_text(encoding="utf-8")
          marker = f"  - id: {book_id}\n"
          start = text.find(marker)
          if start < 0:
              raise SystemExit(f"books/index.yaml entry not found: {book_id}")
          nxt = text.find("\n  - id: ", start + len(marker))
          end = len(text) if nxt < 0 else nxt + 1
          text = text[:start] + text[end:]
          index_path.write_text(text, encoding="utf-8")

          # Remove physical inventory 0002 and linked electronic holding.
          registry_path = Path("registry/books.yaml")
          text = registry_path.read_text(encoding="utf-8")

          inventory_marker = '  - number: 2\n    inventory_number: "0002"\n'
          start = text.find(inventory_marker)
          if start < 0:
              raise SystemExit("inventory 0002 block not found")
          nxt = text.find("\n  - number: ", start + len(inventory_marker))
          end = len(text) if nxt < 0 else nxt + 1
          text = text[:start] + text[end:]

          holding_marker = '    - filename: " Компьютерные сети. Принципы, технологии, протоколы. Олиферы.pdf"\n'
          start = text.find(holding_marker)
          if start < 0:
              raise SystemExit("Olifer 6e electronic holding not found")
          nxt = text.find("\n    - filename: ", start + len(holding_marker))
          end = len(text) if nxt < 0 else nxt + 1
          text = text[:start] + text[end:]

          text = text.replace('  book_count: 40', '  book_count: 39')
          text = text.replace('  file_count: 22', '  file_count: 21')
          text = text.replace('  matched_unambiguous: 21', '  matched_unambiguous: 20')
          text = text.replace('  observed_date: "2026-10-06"', '  observed_date: "2026-10-07"')

          registry_path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate registry README
        run: python scripts/generate_registry_readme.py

      - name: Validate cleanup state
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_registry.py
          python scripts/generate_registry_readme.py --check

          test ! -e "books/computer-networks-olifer-6e-ru-2020"

          ! grep -R --fixed-strings "computer-networks-olifer-6e-ru-2020"             books/index.yaml registry/books.yaml registry/README.md

          ! grep -R --fixed-strings 'inventory_number: "0002"'             registry/books.yaml

          ! grep -R --fixed-strings ' Компьютерные сети. Принципы, технологии, протоколы. Олиферы.pdf'             registry/books.yaml registry/README.md

          # 7th edition must remain intact.
          grep -q --fixed-strings 'inventory_number: "0003"' registry/books.yaml
          grep -q --fixed-strings 'Компьютерные сети. Принципы, технологии, протоколы. 7-е издание' registry/books.yaml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Remove Olifer 6th edition data"
          git push origin "HEAD:cleanup/remove-olifer-6e"
