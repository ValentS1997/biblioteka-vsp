name: Render Chapter 1 Visuals Once

on:
  push:
    branches:
      - chapter/how-linux-works-brian-ward-3e-ru-2022-ch01
    paths:
      - .github/workflows/render-chapter01-visuals-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chapter branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render two chapter SVG files
        run: python scripts/render_hlw_ch01_visuals.py
      - name: Verify generated SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path("books/how-linux-works-brian-ward-3e-ru-2022/notes/chapters/chapter-01-big-picture")
          for name in ("visual-cheatsheet.svg", "visual-cheatsheet-detailed.svg"):
              file = base / name
              root = ET.parse(file).getroot()
              assert root.tag.endswith("svg")
              assert file.stat().st_size > 1500
              print(f"VALID {file}: {file.stat().st_size} bytes")
          PY
      - name: Commit generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- books/how-linux-works-brian-ward-3e-ru-2022/notes/chapters/chapter-01-big-picture/visual-cheatsheet.svg books/how-linux-works-brian-ward-3e-ru-2022/notes/chapters/chapter-01-big-picture/visual-cheatsheet-detailed.svg
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "docs(ch01): render two canonical SVG summaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
