name: Ingest Dynamic Incident Response source

on:
  push:
    branches:
      - book/dynamic-incident-response-joshua-wright-en-2026
    paths:
      - ".github/workflows/ingest-dynamic-ir-source.yml"

permissions:
  contents: write

jobs:
  ingest-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Download and verify official PDF
        shell: bash
        env:
          SOURCE_URL: "https://dl.dynamicincidentresponse.com/dynamicir.pdf"
          EXPECTED_SHA256: "f882f3fdfe4d2de2b8b295747b1579f7592c59cd46d5a3dc211ba8b777925164"
          EXPECTED_SIZE: "69370936"
          TARGET: "books/dynamic-incident-response-joshua-wright-en-2026/source/book.pdf"
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET")"

          if [ -f "$TARGET" ]; then
            echo "Canonical source already exists; verifying."
          else
            curl --fail --location --retry 3 --retry-all-errors               --output "$TARGET" "$SOURCE_URL"
          fi

          actual_size="$(stat -c '%s' "$TARGET")"
          actual_sha="$(sha256sum "$TARGET" | awk '{print $1}')"

          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA256"

          printf '%s  book.pdf\n' "$EXPECTED_SHA256"             > "books/dynamic-incident-response-joshua-wright-en-2026/source/SHA256"

          echo "Verified size: $actual_size"
          echo "Verified SHA-256: $actual_sha"

      - name: Verify Git LFS routing
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          attr="$(git check-attr filter -- "books/dynamic-incident-response-joshua-wright-en-2026/source/book.pdf")"
          echo "$attr"
          echo "$attr" | grep -q 'filter: lfs'

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             "books/dynamic-incident-response-joshua-wright-en-2026/source/book.pdf"             "books/dynamic-incident-response-joshua-wright-en-2026/source/SHA256"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "chore(source): ingest Dynamic Incident Response PDF"
          git push origin "HEAD:book/dynamic-incident-response-joshua-wright-en-2026"
