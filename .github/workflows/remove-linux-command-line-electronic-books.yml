name: Remove two Linux command-line electronic books

on:
  push:
    branches:
      - cleanup/remove-linux-command-line-electronic-books
    paths:
      - ".github/workflows/remove-linux-command-line-electronic-books.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Remove book workspaces and canonical references
        shell: bash
        run: |
          set -euo pipefail

          git rm -r             "books/linux-command-line-best-practices-barrett-ru"             "books/linux-command-line-shotts-ru"

          python - <<'PY'
          from pathlib import Path

          ids = [
              "linux-command-line-shotts-ru",
              "linux-command-line-best-practices-barrett-ru",
          ]

          index_path = Path("books/index.yaml")
          text = index_path.read_text(encoding="utf-8")

          for book_id in ids:
              start_marker = f"  - id: {book_id}\n"
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"books/index.yaml entry not found: {book_id}")
              nxt = text.find("\n  - id: ", start + len(start_marker))
              end = len(text) if nxt < 0 else nxt + 1
              text = text[:start] + text[end:]

          index_path.write_text(text, encoding="utf-8")

          registry_path = Path("registry/books.yaml")
          text = registry_path.read_text(encoding="utf-8")

          targets = [
              '    - filename: "Командная строка Linux.Лучшие практики. Барретт.pdf"\n',
              '    - filename: "Командная строка Linux. Полное руководство. Шоттс.pdf"\n',
          ]

          for marker in targets:
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"registry holding not found: {marker.strip()}")
              nxt = text.find("\n    - filename: ", start + len(marker))
              end = len(text) if nxt < 0 else nxt + 1
              text = text[:start] + text[end:]

          text = text.replace('updated: "2026-10-05"', 'updated: "2026-10-06"')
          text = text.replace('  observed_date: "2026-10-03"', '  observed_date: "2026-10-06"')
          text = text.replace('  file_count: 24', '  file_count: 22')
          text = text.replace('  unregistered: 3', '  unregistered: 1')

          registry_path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate registry README
        run: python scripts/generate_registry_readme.py

      - name: Validate cleanup state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_registry.py
          python scripts/generate_registry_readme.py --check

          ! grep -R --fixed-strings "linux-command-line-best-practices-barrett-ru"             books/index.yaml registry/books.yaml registry/README.md
          ! grep -R --fixed-strings "linux-command-line-shotts-ru"             books/index.yaml registry/books.yaml registry/README.md

          test ! -e "books/linux-command-line-best-practices-barrett-ru"
          test ! -e "books/linux-command-line-shotts-ru"

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Remove Barrett and Shotts Linux command-line books"
          git push origin "HEAD:cleanup/remove-linux-command-line-electronic-books"
