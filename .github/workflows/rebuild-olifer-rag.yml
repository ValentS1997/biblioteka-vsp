name: Rebuild Olifer RAG once

on:
  push:
    branches:
      - onboard/computer-networks-olifer-6e-ru-2020
    paths:
      - ".github/workflows/rebuild-olifer-rag.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Build exact Olifer book RAG
        run: python scripts/build_book_rag.py --book-dir books/computer-networks-olifer-6e-ru-2020

      - name: Commit generated RAG artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             books/computer-networks-olifer-6e-ru-2020/rag/manifest.yaml             books/computer-networks-olifer-6e-ru-2020/rag/text.md             books/computer-networks-olifer-6e-ru-2020/rag/chunks.jsonl             books/computer-networks-olifer-6e-ru-2020/rag/chunk-index.jsonl             books/computer-networks-olifer-6e-ru-2020/rag/chunks/             books/computer-networks-olifer-6e-ru-2020/rag/search-index/

          git commit -m "chore(rag): build Olifer addressable retrieval chunks"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to publish generated RAG artifacts after 5 attempts." >&2
          exit 1
