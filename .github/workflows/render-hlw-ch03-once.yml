name: Render HLW Chapter 3 Visuals Once

on:
  push:
    branches:
      - chapter/how-linux-works-brian-ward-3e-ru-2022-ch03
    paths:
      - .github/workflows/render-hlw-ch03-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate
        run: |
          python scripts/render_hlw_ch03_visuals.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          d=Path("books/how-linux-works-brian-ward-3e-ru-2022/notes/chapters/chapter-03-devices")
          for n in ("visual-cheatsheet.svg", "visual-cheatsheet-detailed.svg"):
              p=d/n
              assert ET.parse(p).getroot().tag.endswith("svg")
              assert p.stat().st_size > 1500
              print("VALID",p)
          PY
      - name: Commit two SVGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/how-linux-works-brian-ward-3e-ru-2022/notes/chapters/chapter-03-devices/visual-cheatsheet*.svg
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "docs(ch03): create two mandatory SVG summaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
