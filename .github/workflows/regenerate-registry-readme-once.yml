name: Regenerate registry README once

on:
  push:
    branches:
      - book/how-linux-works-brian-ward-3e-ru-2022
    paths:
      - ".github/workflows/regenerate-registry-readme-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Regenerate canonical registry view
        run: python scripts/generate_registry_readme.py
      - name: Commit generated README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/README.md
          if git diff --cached --quiet; then
            echo "No registry README changes."
            exit 0
          fi
          git commit -m "docs(registry): regenerate canonical view"
          git push origin "HEAD:${GITHUB_REF_NAME}"
